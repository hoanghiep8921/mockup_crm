<script>
/* ---------- tiện ích ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('vi-VN');
const fmt1=n=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:1,minimumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const NOW=new Date(2026,10,3,15,30), TODAY=new Date(2026,10,3);
const mkD=(d,m,y=2026,h=8,mi=0)=>new Date(y,m-1,d,h,mi);
const fD=d=>d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:'-';
const fDT=d=>d?`${fD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'-';
const fT=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes());
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate(),d.getHours(),d.getMinutes());
const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const diffMin=(a,b)=>Math.round((a-b)/60000);
const diffDay=(a,b)=>Math.round((dayStart(a)-dayStart(b))/864e5);
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function dur(m){m=Math.max(0,Math.round(m));if(m<60)return m+' phút';const h=Math.floor(m/60);if(h<24)return h+' giờ'+(m%60?' '+(m%60)+' phút':'');const d=Math.floor(h/24);return d+' ngày'+(h%24?' '+(h%24)+' giờ':'')}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const has=(hay,q)=>norm(hay).includes(norm(q));
const initials=n=>{const p=String(n).trim().split(/\s+/);return (p[p.length-2]||'')[0]+(p[p.length-1]||'')[0]};
const avatar=(n,c='')=>{const k=['avatar--a','avatar--b','avatar--c',''];let h=0;for(const ch of String(n))h+=ch.charCodeAt(0);return `<span class="avatar ${c||k[h%4]}" aria-hidden="true">${esc(initials(n).toUpperCase())}</span>`};
const userCell=n=>n?`<span class="cell-user">${avatar(n)}<span>${esc(n)}</span></span>`:'<span class="muted">-</span>';
const tag=(t,k='')=>`<span class="tag ${k?'tag--'+k:''}">${esc(t)}</span>`;
const dash='<span class="muted">-</span>';
function hashStr(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
let _rnd=20261103;const rnd=()=>{_rnd=(_rnd*1664525+1013904223)>>>0;return _rnd/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];


/* ---------- toast, modal, drawer ---------- */
function toast(msg,kind='success',undo){const b=$('#toasts');const el=document.createElement('div');el.className='toast toast--'+kind;
  const n=kind==='error'?'err':kind==='info'?'info':'ok';
  el.innerHTML=`${ic(n)}<div class="toast__m">${esc(msg)}</div>${undo?'<button class="toast__a">Hoàn tác</button>':''}<button class="toast__x" aria-label="Đóng">${ic('x','ic--sm')}</button>`;
  while(b.children.length>=3)b.firstChild.remove();b.appendChild(el);const rm=()=>el.remove();el.querySelector('.toast__x').onclick=rm;
  if(undo)el.querySelector('.toast__a').onclick=()=>{undo();rm();render()};
  if(kind!=='error')setTimeout(rm,undo?8000:5000)}
let _overlay=null;
function closeOverlay(){if(_overlay){_overlay.remove();_overlay=null}}
function modal({title,body,foot,size=''}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="modal__b">${body}</div>${foot?`<div class="modal__f">${foot}</div>`:''}</div>`;document.body.appendChild(w);_overlay=w;const f=w.querySelector('input,select,textarea');if(f)f.focus()}
function drawer({title,body,foot}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="drawer__b">${body}</div>${foot?`<div class="drawer__f">${foot}</div>`:''}</aside>`;document.body.appendChild(w);_overlay=w}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function fieldErr(id,msg){const e=document.getElementById(id);if(!e)return;e.setAttribute('aria-invalid','true');const w=e.closest('.field');if(w&&!w.querySelector('.field__err')){const d=document.createElement('div');d.className='field__err';d.innerHTML=ic('err')+`<span>${esc(msg)}</span>`;w.appendChild(d)}e.focus()}
const selectBox=(id,opts,cur='',attrs='')=>`<div class="select"><select class="input" id="${id}" ${attrs}>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSel=(key,opts,cur,label)=>`<div class="select"><select class="input" data-f="${key}" aria-label="${esc(label)}">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSearch=(key,cur,ph)=>`<div class="input-wrap">${ic('search')}<input class="input" id="s-${key.replace('.','-')}" data-f="${key}" value="${esc(cur)}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></div>`;
const seg=(key,opts,cur,label)=>`<div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v,l])=>`<button data-a="setF" data-k="${key}" data-v="${v}" aria-pressed="${v===cur}">${esc(l)}</button>`).join('')}</div>`;
const sw=(a,on,label,x='')=>`<button class="sw" role="switch" aria-checked="${!!on}" data-a="${a}" data-x="${esc(x)}"><span class="sw__t"></span><span>${esc(label)}</span></button>`;
const crumbs=(arr)=>`<nav class="crumbs" aria-label="Đường dẫn">${arr.map((c,i)=>i<arr.length-1?`<a href="#" data-a="go" data-x="${c[1]}">${esc(c[0])}</a>${ic('chev-right')}`:`<span aria-current="page">${esc(c[0])}</span>`).join('')}</nav>`;
const pagehead=(cr,title,actions='',sub='')=>`<div class="pagehead"><div class="pagehead__l">${cr?crumbs(cr):''}<h1>${title}</h1>${sub?`<div class="hint">${sub}</div>`:''}</div>${actions?`<div class="row">${actions}</div>`:''}</div>`;
const emptyState=(t,d,btn='')=>`<div class="state"><span class="state__ic">${ic('search')}</span><h4>${esc(t)}</h4><p>${esc(d)}</p>${btn?`<div class="row">${btn}</div>`:''}</div>`;
const logs=[];
function addLog(fn,op,before,after){logs.unshift({t:new Date(NOW.getTime()+logs.length*0),who:me(),fn,op,before,after})}

/* ---------- khung chung: trạng thái, thanh ứng dụng, điều hướng, sự kiện ----------
   File phân hệ khai: APP, ROLES, NAV, VIEWS.<route>, ACT.<thao tác>, Object.assign(S,{...}), MH(...)
   Xem _congcu/proto/HUONG_DAN_PROTOTYPE.md */
const S={role:null,route:null,arg:null,openNav:null,userOpen:false};
const VIEWS={}, ACT={}, MHS={};
let APP={key:'',name:'',search:'Tìm kiếm'}, ROLES={}, NAV=[];
function can(r){return !r||r.split(' ').includes(S.role)}
const me=()=>ROLES[S.role].u;
function canRoute(r){for(const g of NAV){if(g.r===r)return can(g.ro);if(g.items)for(const i of g.items)if(i[0]===r)return can(i[2])}return true}
function navGroupOf(r){return NAV.find(g=>g.r===r||(g.items&&g.items.some(i=>i[0]===r)))}
function getPath(k){return k.split('.').reduce((o,p)=>o==null?o:o[p],S)}
function setPath(k,v){const p=k.split('.');let o=S;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=v;if(o.page!==undefined&&p[p.length-1]!=='page')o.page=1}
/* Đánh dấu phần Claude tự bổ sung: chỉ hiện nền vàng khi mở với #...&vang=1 (ảnh chụp cho URD) */
const moi=h=>`<span data-moi>${h}</span>`;
function vAppbar(){const R=ROLES[S.role],cur=navGroupOf(S.route);
 return `<button class="appbar__mod" data-a="go" data-x="${R.home}" aria-label="${esc(APP.name)}, về trang đầu">${ic('apps')}<span class="appbar__brand">${esc(APP.name)}</span></button><span class="appbar__sep"></span><nav class="appbar__secs" aria-label="Nhóm chức năng">${NAV.map(g=>{
  if(g.r){if(!can(g.ro))return'';return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="go" data-x="${g.r}" aria-current="${cur===g}">${esc(g.t)}</button></div>`}
  const it=g.items.filter(i=>can(i[2]));if(!it.length||(g.ro&&!can(g.ro)))return'';
  if(g.items.length===1)return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="go" data-x="${it[0][0]}" aria-current="${cur===g}">${esc(g.t)}</button></div>`;
  return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="toggleNav" data-x="${esc(g.t)}" aria-haspopup="menu" aria-expanded="${S.openNav===g.t}" aria-current="${cur===g}">${esc(g.t)}${ic('chev-down','ic--sm')}</button>${S.openNav===g.t?`<div class="menu navmenu" role="menu">${it.map(i=>`<button class="menu__i" role="menuitem" data-a="go" data-x="${i[0]}" aria-current="${S.route===i[0]?'page':'false'}">${esc(i[1])}</button>`).join('')}</div>`:''}</div>`}).join('')}</nav><span class="spacer"></span>

const mkVnd=n=>fmt(Math.round(n))+' đ';

/* cột dọc: labels, series [{n, v:[...], c}], stack: cột chồng */
function mkCols({labels,series,h=200,w=640,stack=false,fv=fmt,ft=fv,top=true}){
 const pl=48,pr=8,pt=18,pb=24,ih=h-pt-pb,iw=w-pl-pr,n=labels.length;
 const mx=mkNice(Math.max(...labels.map((_,i)=>stack?series.reduce((s,x)=>s+(x.v[i]||0),0):Math.max(...series.map(x=>x.v[i]||0))),1));
 const y=v=>pt+ih-v/mx*ih,gw=iw/n;let g='';

 labels.forEach((lb,i)=>{const cx=pl+gw*i+gw/2;g+=`<text x="${cx}" y="${h-6}" text-anchor="middle">${esc(lb)}</text>`;
  if(stack){const bw=Math.min(36,gw*.55);let acc=0;series.forEach((s,j)=>{const v=s.v[i]||0;if(!v)return;const y1=y(acc+v),y0=y(acc);acc+=v;g+=`<rect class="mk-vz__hit" x="${cx-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-(j?2:0))}" rx="${j===series.length-1?3:0}" fill="${s.c||'var(--data-'+(j+1)+')'}"><title>${esc(lb)} · ${esc(s.n)}: ${esc(fv(v))}</title></rect>`});

  else{const m=series.length,bw=Math.min(28,(gw*.7-(m-1)*2)/m),x0=cx-(bw*m+(m-1)*2)/2;series.forEach((s,j)=>{const v=s.v[i];if(v==null)return;g+=`<rect class="mk-vz__hit" x="${x0+j*(bw+2)}" y="${y(v)}" width="${bw}" height="${Math.max(0,ih+pt-y(v))}" rx="3" fill="${s.c||'var(--data-'+(j+1)+')'}"><title>${esc(lb)} · ${esc(s.n)}: ${esc(fv(v))}</title></rect>`;
   if(top&&m===1)g+=`<text class="mk-vz__v" x="${x0+bw/2}" y="${y(v)-5}" text-anchor="middle">${esc(fv(v))}</text>`})}});
 g+=`<line class="axis" x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}"/>`;
 return `<svg class="mk-vz" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(s=>s.n).join(', '))}">${g}</svg>`}

function x18f(id,label,input,o={}){return `<div class="field ${o.full?'full':''}" ${o.moi?'data-moi':''}><label class="field__label" for="${id}">${esc(label)}${o.req?' <span class="field__req" aria-hidden="true">*</span>':''}</label>${input}${o.help?`<div class="field__help">${esc(o.help)}</div>`:''}</div>`}
function x18multi(items,ph){return `<div class="multi">${items.map(t=>`<span class="tag tag--outline">${esc(t)}<button type="button" aria-label="Bỏ ${esc(t)}">${ic('x','ic--sm')}</button></span>`).join('')}<input placeholder="${esc(ph||'Thêm')}" autocomplete="off"></div>`}
function x18tbl(head,rows,o={}){return `<div class="tbl-box ${o.cls||''}"><table class="tbl"><thead><tr>${head.map(h=>{const[t,c,m]=Array.isArray(h)?h:[h,''];return `<th class="${c||''}">${m?moi(esc(t)):esc(t)}</th>`}).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function x18confirm(title,msg,okLabel,okAct,x='',danger){modal({title,size:'modal--sm',body:`<p>${esc(msg)}</p>`,foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn ${danger?'btn--danger':'btn--primary'}" data-a="${okAct}" data-x="${esc(x)}">${esc(okLabel)}</button>`})}
function x18reason(title,reasons,okLabel,okAct,note=''){modal({title,body:`<div class="form-grid">${x18f('x18-ly','Lý do',selectBox('x18-ly',[['','Chọn lý do'],...reasons]),{req:1,full:1})}${x18f('x18-dg','Diễn giải',`<textarea class="input" id="x18-dg" rows="3" maxlength="500" placeholder="Tối thiểu 10 ký tự" oninput="x18reasonChk()"></textarea>`,{req:1,full:1})}</div>${note?`<p class="hint gap-t-s">${esc(note)}</p>`:''}`,foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><span id="x18-okw">${x18dis(`<button class="btn btn--primary" id="x18-ok" data-a="${okAct}" disabled title="Chọn lý do và nhập diễn giải">${esc(okLabel)}</button>`,'Chọn lý do và nhập diễn giải')}</span>`});const s=document.getElementById('x18-ly');if(s)s.onchange=x18reasonChk}
function x18reasonChk(){const ok=val('x18-ly')&&val('x18-dg').length>=10;const b=document.getElementById('x18-ok');if(!b)return;b.disabled=!ok;const h=b.parentNode.querySelector('.hint');if(h)h.style.display=ok?'none':''}
function x18prefill(id,v){const e=document.getElementById(id);if(e){e.value=v;x18reasonChk()}}

function l20head(){const T=S.l20.tab,n=l20selIds().length,th=l20can()&&(T==='cho'||T==='bosung');
 const sub={cho:'Lead từ quảng cáo và form chờ Chuyên viên Marketing thẩm định trước khi vào Kho cơ hội',bosung:'Lead thiếu số điện thoại hoặc nhãn sản phẩm, bổ sung rồi thẩm định',kho:'Lead đã thẩm định đạt và kết quả bàn giao sang Kinh doanh',khl:'Lead đã đóng vì không hợp lệ',phanhoi:'Nhân viên kinh doanh chấm chất lượng lead sau khi chăm'}[T];
 let a='';
 if(th&&!S.l20.empty)a+=n?`<button class="btn btn--secondary" data-a="l20Khl">Không hợp lệ (${n})</button>`:x18dis(`<button class="btn btn--secondary" disabled title="Chọn lead cần đánh dấu không hợp lệ">Không hợp lệ</button>`,'Chọn lead cần đánh dấu không hợp lệ');
 a+=`<button class="btn btn--secondary" data-a="l20Xuat">${ic('download')}Xuất Excel</button>`;
 if(th)a+=n?`<button class="btn btn--primary" data-a="l20Dat">${ic('check')}Hợp lệ (${n})</button>`:x18dis(`<button class="btn btn--primary" disabled title="Chọn lead cần thẩm định">${ic('check')}Hợp lệ</button>`,'Chọn lead cần thẩm định');
 return pagehead([['Chiến dịch','MKT-URD-05'],['Lead Marketing','MKT-URD-20']],'Lead Marketing',a,sub)}

function l20cards(){const cho=L20.filter(l=>l.tt==='Chờ thẩm định');
 return x18cards([{v:cho.length,l:'Chờ thẩm định',a:'l20Card',x:'cho'},{v:cho.filter(l=>l.con<=48).length,l:'Sắp quá hạn thẩm định',a:'l20Card',x:'sap'},{v:L20.filter(l=>l.tt==='Cần bổ sung thông tin').length,l:'Cần bổ sung thông tin',a:'l20Card',x:'bosung'},{v:L20_KHO.filter(k=>sameDay(k.luc,mkD(4,11))).length,l:'Đã vào Kho cơ hội hôm nay',a:'l20Card',x:'kho'}])}

function l20tbl(rows,tick){const P=S.l20;return x18tbl([...(tick?[['','w-chk']]:[]),'Số điện thoại','Tên lead','Nhãn sản phẩm','Nguồn và chiến dịch','Khách cũ','Vào lúc',P.tab==='bosung'?'Còn thiếu':'Hạn thẩm định'],
 rows.map(l=>`<tr>${tick?`<td class="w-chk"><input type="checkbox" class="chk" ${P.sel[l.id]?'checked':''} data-f="l20.sel.${l.id}" aria-label="Chọn ${esc(l.ten)}"></td>`:''}<td class="nowrap">${l.sdt?`<span style="display:inline-flex;align-items:center;gap:.25rem">${ic('phone','ic--sm')}${esc(l.sdt)}</span>`:dash}</td><td><a href="#" class="lnk" data-a="l20Open" data-x="${l.id}">${esc(l.ten)}</a></td><td>${l.nhan?esc(l.nhan):dash}</td><td class="wrap">${esc(l.kenh)}${l.cd?', '+esc(l.cd):''}</td><td>${l.cu?tag('Khách cũ','teal'):dash}</td><td class="nowrap">${fDT(l.vao)}</td><td class="nowrap">${P.tab==='bosung'?tag(l20thieu(l).join(', '),'warning'):x18sla(l.con)}</td></tr>`))}

function l20list(){const P=S.l20;
 if(P.empty&&P.tab==='cho')return `<div class="card gap-t">${emptyState('Không còn lead chờ thẩm định','Lead mới từ quảng cáo và form sẽ hiện ở đây')}</div>`;
 const tt=P.tab==='cho'?'Chờ thẩm định':'Cần bổ sung thông tin';
 const rows=L20.filter(l=>l.tt===tt&&(!P.q||has(l.ten+l.sdt,P.q))&&(!P.nhan||l.nhan===P.nhan)&&(!P.kenh||l.kenh===P.kenh)&&(!P.cd||l.cd===P.cd)&&(!P.cu||(P.cu==='cu'?!!l.cu:!l.cu))&&(!P.sla||l.con<=48)).sort((a,b)=>(a.con??1e9)-(b.con??1e9));
 return `<div class="toolbar">${fSearch('l20.q',P.q,'Tìm theo tên lead, số điện thoại')}${fSel('l20.nhan',[['','Nhãn sản phẩm: Tất cả'],'Máy khắc','Máy in UV','Máy cắt CNC','Máy hàn laser'],P.nhan,'Nhãn sản phẩm')}${fSel('l20.kenh',[['','Kênh: Tất cả'],'Facebook','Zalo','Website','TikTok'],P.kenh,'Kênh')}${fSel('l20.cd',[['','Chiến dịch: Tất cả'],...new Set(L20.map(l=>l.cd).filter(Boolean))],P.cd,'Chiến dịch')}${fSel('l20.cu',[['','Khách cũ: Tất cả'],['cu','Khách cũ'],['moi','Khách mới']],P.cu,'Khách cũ')}<span data-moi>${fSel('l20.ngay',[['7','Ngày vào: 7 ngày qua'],['hn','Ngày vào: Hôm nay'],['30','Ngày vào: 30 ngày qua']],P.ngay,'Ngày vào')}</span>${P.sla?`<span class="fchip"><span>Hạn:</span> Sắp quá hạn <button aria-label="Bỏ điều kiện" data-a="setF" data-k="l20.sla" data-v="">${ic('x','ic--sm')}</button></span>`:''}</div>
 <div class="gap-t">${rows.length?l20tbl(rows,l20can())+x18pag(rows.length):`<div class="card">${emptyState('Không có kết quả tìm kiếm phù hợp','Bỏ bớt điều kiện lọc hoặc tìm theo từ khác')}</div>`}</div>`}

function l20kho(){const P=S.l20;const rows=L20_KHO.filter(k=>(!P.q||has(k.ten,P.q))&&(!P.kq||k.kq===P.kq)&&(!P.nhan||k.nhan===P.nhan)&&(!P.doi||k.doi===P.doi)).sort((a,b)=>b.luc-a.luc);
 return `<div class="toolbar">${fSearch('l20.q',P.q,'Tìm theo tên lead, số điện thoại')}<span data-moi>${fSel('l20.kq',[['','Kết quả bàn giao: Tất cả'],'Chờ nhận','Đã nhận','Trả về'],P.kq,'Kết quả bàn giao')}</span>${fSel('l20.nhan',[['','Nhãn sản phẩm: Tất cả'],'Máy khắc','Máy in UV','Máy cắt CNC'],P.nhan,'Nhãn sản phẩm')}${fSel('l20.doi',[['','Đội nhận: Tất cả'],'Đội Máy khắc 1','Đội Máy in','Đội CNC'],P.doi,'Đội nhận')}<span data-moi>${fSel('l20.nt',[['7','Ngày thẩm định: 7 ngày qua'],['30','Ngày thẩm định: 30 ngày qua']],P.nt,'Ngày thẩm định')}</span></div>
 <div class="gap-t">${rows.length?x18tbl(['Tên lead','Nhãn sản phẩm','Người thẩm định','Thẩm định lúc','Kết quả bàn giao','Nhân viên kinh doanh','Ghi chú'],rows.map(k=>`<tr><td><a href="#" class="lnk" data-a="l20Open" data-x="LD-30415">${esc(k.ten)}</a></td><td>${esc(k.nhan)}</td><td>${k.ai==='Hệ thống'?'<span class="muted">Hệ thống</span>':userCell(k.ai)}</td><td class="nowrap">${fDT(k.luc)}</td><td>${tag(k.kq,L20_KQ[k.kq])}</td><td>${k.nv?userCell(k.nv):dash}</td><td class="wrap muted">${k.gc?esc(k.gc):dash}</td></tr>`))+x18pag(rows.length,186):`<div class="card">${emptyState('Không có kết quả tìm kiếm phù hợp','Bỏ bớt điều kiện lọc hoặc tìm theo từ khác')}</div>`}</div>`}

function l20khl(){const rows=L20.filter(l=>l.tt==='Không hợp lệ');
 return `<div class="gap-t">${x18tbl(['Số điện thoại','Tên lead','Nguồn và chiến dịch','Lý do','Diễn giải','Người đánh dấu','Đánh dấu lúc'],rows.map(l=>`<tr><td class="nowrap">${esc(l.sdt)}</td><td><a href="#" class="lnk" data-a="l20Open" data-x="${l.id}">${esc(l.ten)}</a></td><td class="wrap">${esc(l.kenh)}${l.cd?', '+esc(l.cd):''}</td><td>${tag(l.ly,'danger')}</td><td class="wrap muted">${esc(l.dg)}</td><td>${userCell(l.ai)}</td><td class="nowrap">${fDT(l.luc)}</td></tr>`))+x18pag(rows.length)}</div>`}

function l20ph(){const P=S.l20;const n=L20_PH.length,c=k=>L20_PH.filter(p=>p.cl===k).length,pc=v=>Math.round(v/n*100)+'%';
 const rows=L20_PH.filter(p=>(!P.cl||p.cl===P.cl)&&(!P.kenh||p.kenh===P.kenh)&&(!P.cd||p.cd===P.cd));
 return `<div class="gap-t">${x18cards([{v:pc(c('Tốt')),l:'Tốt',a:'setF',k:'l20.cl',vv:'Tốt'},{v:pc(c('Trung bình')),l:'Trung bình',a:'setF',k:'l20.cl',vv:'Trung bình'},{v:pc(c('Kém')),l:'Kém',a:'setF',k:'l20.cl',vv:'Kém'},{v:pc(c('Sai thông tin')),l:'Sai thông tin',a:'setF',k:'l20.cl',vv:'Sai thông tin'},{v:fmt(n),l:'Lead đã chấm',a:'setF',k:'l20.cl',vv:''}],5)}</div>
 <div class="toolbar">${fSel('l20.cl',[['','Chất lượng: Tất cả'],'Tốt','Trung bình','Kém','Sai thông tin'],P.cl,'Chất lượng')}${fSel('l20.kenh',[['','Kênh: Tất cả'],'Facebook','Zalo','Website','TikTok'],P.kenh,'Kênh')}${fSel('l20.cd',[['','Chiến dịch: Tất cả'],...new Set(L20_PH.map(p=>p.cd))],P.cd,'Chiến dịch')}<span data-moi>${fSel('l20.nc',[['m','Ngày chấm: Tháng này'],['t','Ngày chấm: Tháng trước']],P.nc,'Ngày chấm')}</span></div>
 <div class="gap-t">${rows.length?x18tbl(['Cơ hội','Chất lượng','Nhân viên kinh doanh','Kênh','Chiến dịch','Ghi chú','Ngày chấm'],rows.map(p=>`<tr><td><a href="#" class="lnk" data-a="l20Opp">${esc(p.ch)}</a></td><td>${tag(p.cl,L20_CL[p.cl])}</td><td>${userCell(p.nv)}</td><td>${esc(p.kenh)}</td><td>${esc(p.cd)}</td><td class="wrap muted">${esc(p.gc)}</td><td class="nowrap">${fD(p.ngay)}</td></tr>`))+x18pag(rows.length):`<div class="card">${emptyState('Không có kết quả tìm kiếm phù hợp','Bỏ bớt điều kiện lọc hoặc tìm theo từ khác')}</div>`}<p class="x18-note">Marketing chỉ xem, không sửa phản hồi của Nhân viên kinh doanh</p></div>`}

VIEWS['MKT-URD-20']=()=>{const P=S.l20,T=P.tab;
 const tabs=x18tabs('l20.tab',T,[['cho','Chờ thẩm định',P.empty?0:L20.filter(l=>l.tt==='Chờ thẩm định').length],['bosung','Cần bổ sung thông tin',L20.filter(l=>l.tt==='Cần bổ sung thông tin').length],['kho','Đã vào Kho cơ hội'],['khl','Không hợp lệ'],['phanhoi','Phản hồi từ Sale']]);
 const body=T==='kho'?l20kho():T==='khl'?l20khl():T==='phanhoi'?l20ph():l20list();
 return `${l20head()}${(T==='cho'||T==='bosung')&&!P.empty?l20cards():''}${tabs}${body}`};

VIEWS['MKT-URD-20:ct']=()=>{const l=L20.find(x=>x.id===S.arg)||L20[1];const mo=l.tt==='Chờ thẩm định'||l.tt==='Cần bổ sung thông tin';const th=l20can()&&mo;const thieu=l20thieu(l);
 let a='';if(th&&l.tt==='Chờ thẩm định')a+=`<button class="btn btn--secondary" data-a="l20BoSung" data-x="${l.id}">${ic('edit')}Cần bổ sung</button>`;
 if(th)a+=`<button class="btn btn--secondary" data-a="l20Khl" data-x="${l.id}">Không hợp lệ</button>`;
 if(th)a+=thieu.length?x18dis(`<button class="btn btn--primary" disabled title="Còn thiếu: ${esc(thieu.join(', '))}">${ic('check')}Hợp lệ</button>`,'Còn thiếu: '+thieu.join(', ')):`<button class="btn btn--primary" data-a="l20Dat" data-x="${l.id}">${ic('check')}Hợp lệ</button>`;
 const hist=[[l.vao,'Hệ thống','Tạo lead từ '+(l.kenh==='Website'?'form website':'form '+l.kenh)+', vào nhóm Chờ thẩm định',''],...(l.cu?[[new Date(l.vao.getTime()+60000),'Hệ thống','Nhận diện khách cũ theo số điện thoại','']]:[]),...(l.tt==='Cần bổ sung thông tin'?[[new Date(l.vao.getTime()+3600000),'Lê Thị Hoa','Chuyển Cần bổ sung thông tin, còn thiếu '+l.thieu,'wait']]:[]),...(l.tt==='Không hợp lệ'?[[l.luc,l.ai,'Đánh dấu không hợp lệ: '+l.ly,'no']]:[])];
 return `${pagehead([['Chiến dịch','MKT-URD-05'],['Lead Marketing','MKT-URD-20'],[l.ten,'']],esc(l.ten),a,'Lead vào lúc '+fDT(l.vao)+' từ '+esc(l.kenh))}
 ${l.cu?`<div class="alert alert--warning x18-sec" data-moi>${ic('info')}<div class="alert__d">Số điện thoại trùng khách cũ ${esc(l.cu)}. Lead sẽ nối vào hồ sơ khách này</div></div>`:''}
 ${x18card('Thông tin lead',x18info([['Số điện thoại',l.sdt?esc(l.sdt):null],['Tên lead',esc(l.ten)],['Tỉnh thành',l.tinh?esc(l.tinh):null],['Nhu cầu',esc(l.nc)],['Trạng thái thẩm định',tag(l.tt,L20_TT[l.tt])],['Nhãn sản phẩm',l.nhan?esc(l.nhan):null],['Kênh',esc(l.kenh)],['Chiến dịch',l.cd?esc(l.cd):null],['Quảng cáo',esc(l.qc)],['Hạn thẩm định',l.han&&l.con!=null?fDT(l.han)+' '+x18sla(l.con):(l.tt==='Cần bổ sung thông tin'?'<span class="muted">Dừng đếm hạn khi chờ bổ sung</span>':null)]]))}
 ${x18card('Lịch sử',x18tl(hist))}`};

Object.assign(ACT,{
 l20Open(x){go('MKT-URD-20:ct',x)},
 l20Opp(){if(VIEWS['CRM-URD-03'])go('CRM-URD-03');else toast('Mở chi tiết cơ hội ở chế độ xem theo quyền','info')},
 l20Xuat(){toast('Đã xuất danh sách theo tab và bộ lọc đang áp')},
 l20Card(x){const P=S.l20;P.sla='';if(x==='sap'){P.tab='cho';P.sla='1'}else P.tab=x;render(true)},
 l20Khl(x){const ids=x?[x]:l20selIds();S.l20.cur=ids;x18reason('Lead không hợp lệ'+(ids.length>1?` (${ids.length} lead)`:''),L20_LY,'Xác nhận không hợp lệ','l20KhlOk','Lead không hợp lệ được đóng, không vào Kho cơ hội và tính vào tỷ lệ lead sai của kênh, chiến dịch')},
 l20KhlOk(){const ids=S.l20.cur||[];ids.forEach(id=>{const l=L20.find(y=>y.id===id);if(l){l.tt='Không hợp lệ';l.ly=val('x18-ly');l.dg=val('x18-dg');l.ai=me();l.luc=NOW;l.con=null}});S.l20.sel={};closeOverlay();toast('Đã đánh dấu '+ids.length+' lead không hợp lệ');if(S.route!=='MKT-URD-20')go('MKT-URD-20');else render(true)},
 l20Dat(x){const ids=x?[x]:l20selIds();let ok=0,thieu=0;ids.forEach(id=>{const l=L20.find(y=>y.id===id);if(!l)return;if(l20thieu(l).length){l.tt='Cần bổ sung thông tin';l.thieu=l20thieu(l).join(', ');l.con=null;thieu++}else{l.tt='Hợp lệ';L20_KHO.unshift({ten:l.ten,nhan:l.nhan,ai:me(),luc:NOW,kq:'Chờ nhận',nv:'',doi:'',gc:'Đang trong Kho cơ hội'});ok++}});
  S.l20.sel={};if(thieu)ACT.l20KetQua(ok,thieu,0);else{toast('Đã đánh dấu hợp lệ '+ok+' lead, đã chuyển vào Kho cơ hội');if(S.route!=='MKT-URD-20')go('MKT-URD-20');else render(true)}},
 l20KetQua(ok=8,thieu=2,khac=1){render(true);modal({title:'Kết quả thẩm định',body:`<div class="alert alert--success">${ic('ok')}<div class="alert__t">Đã đánh dấu hợp lệ ${ok} lead, đã chuyển vào Kho cơ hội</div></div>${thieu?`<div class="alert alert--warning gap-t-s">${ic('alert')}<div class="alert__d">Bỏ qua ${thieu} lead còn thiếu số điện thoại hoặc nhãn sản phẩm, đã chuyển sang Cần bổ sung thông tin</div></div>`:''}${khac?`<div class="alert alert--warning gap-t-s">${ic('alert')}<div class="alert__d">Bỏ qua ${khac} lead vì người khác vừa thẩm định xong</div></div>`:''}`,foot:`<button class="btn btn--primary" data-a="closeOverlay">Đóng</button>`})},
 l20BoSung(x){const l=L20.find(y=>y.id===x);l.tt='Cần bổ sung thông tin';l.thieu=l20thieu(l).join(', ');l.con=null;render(true);
  modal({title:'Bổ sung thông tin lead',body:`<div class="form-grid">${x18f('l20-sdt','Số điện thoại',`<input class="input" id="l20-sdt" value="${esc(l.sdt)}">`,{req:1})}${x18f('l20-ten','Tên lead',`<input class="input" id="l20-ten" value="${esc(l.ten)}">`)}${x18f('l20-nhan','Nhãn sản phẩm',selectBox('l20-nhan',[['','Chọn nhãn sản phẩm'],'Máy khắc','Máy in UV','Máy cắt CNC','Máy hàn laser'],l.nhan),{req:1})}${x18f('l20-tinh','Tỉnh thành',`<input class="input" id="l20-tinh" value="${esc(l.tinh)}">`)}${x18f('l20-nc','Nhu cầu',`<textarea class="input" id="l20-nc" rows="2">${esc(l.nc)}</textarea>`,{full:1})}</div>`,
   foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="l20BoSungOk" data-x="${x}">Lưu</button>`});
  if(!l.sdt)fieldErr('l20-sdt','Số điện thoại không được để trống');if(!l.nhan)fieldErr('l20-nhan','Nhãn sản phẩm không được để trống')},
 l20BoSungOk(x){const l=L20.find(y=>y.id===x);l.sdt=val('l20-sdt');l.nhan=val('l20-nhan');l.tinh=val('l20-tinh');closeOverlay();toast('Đã lưu thông tin lead');render(true)},
 l20Cham(){const p=L20_PH[0];modal({title:'Chấm chất lượng lead',body:`<dl class="dl"><dt>Cơ hội</dt><dd>${esc(p.ch)}</dd><dt>Nguồn</dt><dd>${esc(p.kenh+', '+p.cd)}</dd></dl><div class="form-grid gap-t">${x18f('l20-cl','Chất lượng lead',selectBox('l20-cl',[['','Chọn chất lượng'],'Tốt','Trung bình','Kém','Sai thông tin'],p.cl),{req:1,full:1})}${x18f('l20-gc','Ghi chú',`<textarea class="input" id="l20-gc" rows="3" maxlength="500" placeholder="Khách có nhu cầu thật không, thông tin có đúng không">Khách có xưởng 300 m2, đã hẹn xem máy thứ Bảy</textarea>`,{full:1})}</div>`,
  foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="l20ChamOk">Lưu</button>`})},
 l20ChamOk(){if(!val('l20-cl'))return fieldErr('l20-cl','Chất lượng lead không được để trống');closeOverlay();toast('Đã lưu phản hồi chất lượng lead')}
});

/* ---------- hàm dựng chung danh mục ----------
 cfg: {key, title, sub, crumbs, add:'Nhãn nút thêm', mode:'inline'|'popup', open(i), roles, rows, filter(r), filters:html,
       cols:[{h, f(r,i), e(r,i) ô sửa, cls, moi}], st:{on(r), set(r,v), labels:[bật,tắt]}, del(r), save(r|null) trả lỗi hoặc '', name(r), note} */
function c23dm(cfg){C23_REG[cfg.key]=cfg;const ed=can(cfg.roles||'tpmkt');const E=S.c23.edit;const rows=cfg.rows.map((r,i)=>[r,i]).filter(([r])=>!cfg.filter||cfg.filter(r));
 const isEd=i=>E===cfg.key+':'+i;const stL=(cfg.st&&cfg.st.labels)||['Đang dùng','Ngừng dùng'];
 const actCell=(r,i)=>{if(!ed)return '';if(isEd(i))return `<td class="nowrap"><button class="btn btn--primary btn--sm" data-a="c23Save" data-x="${cfg.key}:${i}">Lưu</button> <button class="btn btn--ghost btn--sm" data-a="c23Cancel">Huỷ</button></td>`;
  return `<td class="nowrap" style="text-align:right"><button class="btn btn--ghost btn--icon btn--sm" aria-label="Sửa ${esc(cfg.name(r))}" data-a="${cfg.mode==='popup'?'c23Open':'c23Edit'}" data-x="${cfg.key}:${i}">${ic('edit')}</button>${cfg.del&&cfg.del(r)?`<button class="btn btn--ghost btn--icon btn--sm" aria-label="Xoá ${esc(cfg.name(r))}" data-a="c23Del" data-x="${cfg.key}:${i}" data-moi>${ic('trash')}</button>`:''}</td>`};
 const stCell=(r,i)=>cfg.st?`<td>${ed&&!isEd(i)?sw('c23Sw',cfg.st.on(r),cfg.st.on(r)?stL[0]:stL[1],cfg.key+':'+i):tag(cfg.st.on(r)?stL[0]:stL[1],cfg.st.on(r)?'success':'')}</td>`:'';
 const tr=(r,i)=>`<tr>${cfg.cols.map(c=>`<td class="${c.cls||''}">${isEd(i)&&c.e?c.e(r,i):c.f(r,i)}</td>`).join('')}${stCell(r,i)}${actCell(r,i)}</tr>`;
 const newRow=E===cfg.key+':new'?tr({},'new'):'';
 const head=[...cfg.cols.map(c=>[c.h,c.cls,c.moi]),...(cfg.st?['Trạng thái']:[]),...(ed?['']:[])];
 const addBtn=ed&&cfg.add?`<button class="btn btn--primary" data-a="${cfg.mode==='popup'?'c23Open':'c23Edit'}" data-x="${cfg.key}:new">${ic('plus')}${esc(cfg.add)}</button>`:'';
 return `${pagehead(cfg.crumbs||[...C23_CR,[cfg.title,'']],cfg.title,addBtn+(cfg.acts||''),cfg.sub)}
 ${cfg.filters?`<div class="toolbar">${cfg.filters}</div>`:''}
 <div class="gap-t">${rows.length||newRow?x18tbl(head,[newRow,...rows.map(([r,i])=>tr(r,i))])+x18pag(rows.length):`<div class="card">${emptyState('Không có kết quả tìm kiếm phù hợp','Bỏ bớt điều kiện lọc hoặc tìm theo từ khác')}</div>`}${cfg.note?`<p class="x18-note">${cfg.note}</p>`:''}</div>`}
const c23in=(id,v,o={})=>`<input class="input x18-in-sm" id="${id}" value="${esc(v==null?'':v)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.num?'inputmode="numeric" style="width:5rem"':''} ${o.max?`maxlength="${o.max}"`:''}>`;
const c23sel=(id,opts,v)=>`<div class="select x18-in-sm">${selectBox(id,opts,v).replace(/^<div class="select">|<\/div>$/g,'')}</div>`;
const c23chips=a=>a&&a.length?`<span class="x18-chips">${a.map(t=>tag(t,'outline')).join('')}</span>`:dash;
Object.assign(ACT,{

 c23SwOk(x){const[k,i]=x.split(':');const cfg=C23_REG[k];const r=cfg.rows[+i];cfg.st.set(r,false);closeOverlay();toast('Đã ngừng dùng '+cfg.name(r));render(true)},
 c23Del(x){const[k,i]=x.split(':');const cfg=C23_REG[k];x18confirm('Xoá thẻ','Xoá thẻ '+cfg.name(cfg.rows[+i])+'? Thao tác này không hoàn tác được','Xoá','c23DelOk',x,1)},

 <div class="toolbar">${fSearch('c23.nq',C.nq,'Tìm theo bản ghi')}<span data-moi>${fSel('c23.nk',[['Cấu hình','Nhóm: Cấu hình'],['Chiến dịch và nội dung','Nhóm: Chiến dịch và nội dung']],C.nk,'Nhóm')}</span>${fSel('c23.dt',[['','Đối tượng: Tất cả'],...dts],C.dt,'Đối tượng')}${fSel('c23.ai',[['','Người đổi: Tất cả'],...new Set(C23_LOG.map(l=>l[1]))],C.ai,'Người đổi')}<span data-moi>${fSel('c23.d',[['30','Ngày: 30 ngày qua'],['7','Ngày: 7 ngày qua']],C.d,'Ngày')}</span></div>
 <div class="gap-t">${rows.length?x18tbl(['Thời điểm','Người đổi','Đối tượng','Bản ghi','Trường','Giá trị cũ','Giá trị mới'],rows.map(l=>`<tr><td class="nowrap">${fDT(l[0])}</td><td>${userCell(l[1])}</td><td>${esc(l[2])}</td><td>${esc(l[3])}</td><td>${esc(l[4])}</td><td class="wrap muted">${l[5]?esc(l[5]):dash}</td><td class="wrap">${l[6]?esc(l[6]):dash}</td></tr>`))+x18pag(rows.length,312):`<div class="card">${emptyState('Không có kết quả tìm kiếm phù hợp','Bỏ bớt điều kiện lọc hoặc tìm theo từ khác')}</div>`}</div>`};

Object.assign(ACT,{
 c23Ngoai(x){toast(x+' khai ở '+(/duyệt/i.test(x)?'Luồng duyệt chung':'Cấu hình CRM')+', mở ở chế độ chỉ xem','info')},
 c23NgLuu(){const v=S.c23.ng;if(!/^\d+$/.test(v)||+v<50||+v>99)return fieldErr('c23-ng','Ngưỡng cảnh báo sớm phải là số nguyên từ 50 đến 99.');C23_LOG.unshift([NOW,me(),'Ngưỡng cảnh báo vượt mức','Cảnh báo sớm','Mức (% ngân sách)',S.c23.ngSaved,v,'Cấu hình']);S.c23.ngSaved=v;toast('Đã lưu ngưỡng cảnh báo');render(true)},
 c23TkOpen(x){go('MKT-URD-23:tkct',x)},
 c23TkXem(x){S.f18.tk=x;go('MKT-URD-18')},
 c23TkSync(){toast('Đã đồng bộ chiến dịch')},
 c23TkKn(){toast('Đang chuyển sang trang cấp quyền của Facebook','info')},
 c23TkLuu(){if(!val('c23-tkten'))return fieldErr('c23-tkten','Tên không được để trống');if(!val('c23-tknhan'))return fieldErr('c23-tknhan','Nhãn sản phẩm không được để trống');
  if(S.arg==='new'){C23_TK.push({ten:val('c23-tkten'),nhan:val('c23-tknhan'),ma:'',fbTen:'',kn:'Chưa kết nối',het:null,so:0,loi:'',pc:[],hm:null,chi:null,no:0,on:true});toast('Đã lưu tài khoản quảng cáo');go('MKT-URD-23:tkct',val('c23-tkten'))}else{const t=C23_TK.find(x=>x.ten===S.arg);t.nhan=val('c23-tknhan');toast('Đã lưu tài khoản quảng cáo')}},
 c23PcBo(x){const[i,j]=x.split(':').map(Number);C23_TK[i].pc.splice(j,1);toast('Đã lưu phân công');render(true)},
 c23PcThem(i,v){if(!v)return;C23_TK[i].pc.push(v);toast('Đã lưu phân công');render(true)},
 c23TtLuu(){const r=S.c23.cur;const ten=val('tt-ten'),mau=val('tt-mau');if(!ten)return fieldErr('tt-ten','Tên quy tắc không được để trống');
  if(!mau)return fieldErr('tt-mau','Từ khoá của quy tắc "'+ten+'" đang trống.');if(val('tt-kieu')==='Biểu thức chính quy'){try{new RegExp(mau)}catch(e){return fieldErr('tt-mau','Biểu thức chính quy của quy tắc "'+ten+'" sai: '+e.message)}}
  if(C23_TT.some(x=>x!==r&&norm(x.ten)===norm(ten)))return fieldErr('tt-ten','Quy tắc tuân thủ đã tồn tại trên hệ thống');
  Object.assign(r,{ten,mau,kieu:val('tt-kieu'),muc:val('tt-muc'),nguon:val('tt-nguon'),tt:+val('tt-tt')||10,gt:val('tt-gt')});if(!C23_TT.includes(r)){r.on=true;C23_TT.push(r)}closeOverlay();toast('Đã lưu quy tắc tuân thủ');render(true)},
 c23NhanLuu(){const r=S.c23.cur;const ten=val('nh-ten');if(!ten)return fieldErr('nh-ten','Tên nhãn không được để trống');if(C23_NHAN.some(x=>x!==r&&norm(x.ten)===norm(ten)))return fieldErr('nh-ten','Nhãn sản phẩm đã tồn tại trên hệ thống');
  r.ten=ten;r.doi=val('nh-doi');if(!C23_NHAN.includes(r)){r.on=true;C23_NHAN.push(r)}closeOverlay();toast('Đã lưu nhãn sản phẩm');render(true)},
 c23DoiLuu(x){const r=S.c23.cur;const ten=val('doi-ten');if(!ten)return fieldErr('doi-ten','Tên đội không được để trống');if(!val('doi-tn'))return fieldErr('doi-tn','Trưởng nhóm không được để trống');
  const them=x?x.split('|'):[];them.forEach(n=>{C23_DOI.forEach(d=>{if(d!==r)d.tv=d.tv.filter(t=>t!==n)});if(!r.tv.includes(n))r.tv.push(n)});r.ten=ten;r.tn=val('doi-tn');r.cty=val('doi-cty');if(!C23_DOI.includes(r)){r.on=true;C23_DOI.push(r)}closeOverlay();toast('Đã lưu đội nhóm marketing');render(true)}
});
