  pg(el){const [k,p]=el.dataset.arg.split('|'),n=Number(p);if(k==='cb')CB.page=n-1;else if(k==='ld')LD.page=n-1;else pst(k).page=n;rerender()},
  'lq-clear'(el){const s=pst(el.dataset.arg);s.q='';s.st='';s.page=1;rerender()},
  /* tạo lô */
  'qty-set'(el){T.q=Number(el.dataset.arg);refreshTao()},
  'tao-xn'(){
    const sp=spOf(T.sp);
    confirmM(`Tạo ${fmt(T.q)} serial cho ${sp.c}?`,`Serial được cấp một lần duy nhất và không xoá hay cấp lại được, kể cả khi bạn huỷ lô sau đó${T.q>=100?`. Đây là lô lớn, kiểm tra lại số lượng ${fmt(T.q)} trước khi tạo`:''}`,`Tạo ${fmt(T.q)} serial`,()=>{
      T.busy=true;rerender();
      setTimeout(()=>{
        const sp=spOf(T.sp),pre=sp.g,a=COUNT[pre]+1,idn=87+LO.filter(l=>l.id>'LSN-2610-0087').length+1;
        const lot={id:'LSN-2610-'+String(idn).padStart(4,'0'),sp:sp.c,pre,a,q:T.q,by:ROLES[R].u,at:nowStr(),out:new Set()};
        COUNT[pre]+=T.q;sp.n+=T.q;LO.unshift(lot);audit(`Tạo lô ${T.q} serial`,lot.id);
        for(let k=0;k<lot.q;k++)addSer({pre,n:a+k,sp:sp.c,lo:lot.id,by:lot.by,at:lot.at});
        TC.sel=new Set();T.res=lot;T.busy=false;rerender();
        toast('success',`Đã tạo lô ${lot.id} gồm ${fmt(lot.q)} serial`);
      },800);
    },false);
  },
  'tao-moi'(){T.res=null;T.sp='';T.q=null;rerender()},
  'tao-in'(){const l=T.res;CB.lot=l.id;CB.sel=new Set(freeIdx(l));CB.page=0;CB.cur=0;CB.q='';go('chuan-bi-in')},
  'lo-xem'(el){TC.tab='serial';TC.f={st:'',g:'',q:'',lo:el.dataset.arg};TC.sel=new Set();pst('se').page=1;if(location.hash!=='#/serial')go('serial');else rerender()},
  /* chờ in */
  'cb-cur'(el,e){if(e.target.closest('label'))return;CB.cur=Number(el.dataset.arg);rerender()},
  'cb-row'(el){const i=Number(el.dataset.arg);el.checked?CB.sel.add(i):CB.sel.delete(i);CB.cur=i;rerender()},
  'cb-all'(el){const l=loOf(CB.lot),qq=CB.q.trim().toUpperCase(),pool=freeIdx(l).filter(i=>!qq||ser(l.pre,l.a+i).includes(qq));pool.forEach(i=>el.checked?CB.sel.add(i):CB.sel.delete(i));rerender()},
  'cb-gui'(){
    const l=loOf(CB.lot),ns=[...CB.sel].sort((a,b)=>a-b),id=nextLi();
    LENH.unshift({id,k:'dau',lo:l.id,sp:l.sp,pre:l.pre,ns:ns.map(i=>l.a+i),done:new Set(),st:'guiin',by:ROLES[R].u,at:nowStr(),ver:TEM.ver,sess:true});audit('Tạo lệnh in',id);
    ns.forEach(i=>l.out.add(i));CB.sel=new Set();toast('success',`Đã gửi in ${ns.length} tem theo lệnh ${id}. Xác nhận kết quả sau khi in xong`);go('lenh-in/'+id);
  },
  /* lệnh in */
  ltab(el){LTAB=el.dataset.arg;pst('li').page=1;rerender()},
  'open-lenh'(el){go('lenh-in/'+el.dataset.arg)},
  'ld-cur'(el,e){if(e.target.closest('label'))return;LD.cur=Number(el.dataset.arg);rerender()},
  'ld-row'(el){const i=Number(el.dataset.arg);el.checked?LD.sel.add(i):LD.sel.delete(i);LD.cur=i;rerender()},
  'ld-f'(el){LD.f=el.dataset.arg;LD.page=0;rerender()},
  'ld-bo'(){LD.sel=new Set();rerender()},
  'ld-xn'(){
    const x=lenhOf(LD.id),pend=[...Array(x.ns.length).keys()].filter(i=>!x.done.has(i));
    let todo;
    if(LD.sel.size)todo=[...LD.sel];
    else{const q=$('#ld-q');let n=Math.floor(Number(q&&q.value));if(!(n>=1))n=0;todo=pend.slice(0,Math.min(n,pend.length))}
    if(!todo.length){toast('error','Nhập số tem từ 1 trở lên');return}
    const k=todo.length,rest=pend.length-k;
    confirmM(`Xác nhận ${k} tem đã in?`,`Chỉ ${k} tem này chuyển sang Đã in. ${rest>0?`${rest} tem còn lại giữ trạng thái Mới tạo và in tiếp được trong lệnh này`:'Lệnh in sẽ hoàn tất'}`,`Xác nhận ${k} tem`,()=>{
      todo.forEach(i=>x.done.add(i));LD.sel=new Set();x.st=x.done.size===x.ns.length?'ok':'motphan';LD.f=x.done.size===x.ns.length?'all':LD.f;LD.page=0;audit(`Xác nhận ${k} tem đã in`,x.id);rerender();
      toast('success',`Đã xác nhận ${k} tem đã in`);
    },false);
  },
  'ld-tiep'(){const x=lenhOf(LD.id);toast('info',`Đã mở hộp thoại in cho ${x.ns.length-x.done.size} tem còn lại`)},
  'ld-gui'(){const x=lenhOf(LD.id);x.st='guiin';audit('Gửi in lệnh in',x.id);rerender();toast('success',`Đã gửi in ${x.ns.length} tem`)},
  'ld-huy'(){const x=lenhOf(LD.id);confirmM(`Huỷ lệnh ${x.id}?`,`${x.ns.length} serial của lệnh trở về trạng thái Mới tạo và có thể đưa vào lệnh in khác`,'Huỷ lệnh',()=>{x.st='huy';const l=loOf(x.lo);if(l)x.ns.forEach(n=>l.out.delete(n-l.a));audit('Huỷ lệnh in',x.id);rerender();toast('success',`Đã huỷ lệnh ${x.id}`)})},
  'ld-dong'(){const x=lenhOf(LD.id),l=loOf(x.lo);x.st='dong';if(l&&x.k==='dau')x.ns.forEach((n,i)=>{if(!x.done.has(i))l.out.delete(n-l.a)});audit('Đóng lệnh in',x.id);rerender();toast('success',`Đã đóng lệnh ${x.id}`)},
  /* serial */
  'tc-tab'(el){TC.tab=el.dataset.arg;rerender()},
  'tc-clear'(){TC.f={st:'',g:'',q:'',lo:''};pst('se').page=1;rerender()},
  'ser-open'(el){serDrawer(Number(el.dataset.arg))},
  'ser-huy'(el){huyModal([Number(el.dataset.arg)])},
  'ser-khoa'(el){khoaModal([Number(el.dataset.arg)])},
  'ser-lai'(el){laiModal([Number(el.dataset.arg)])},
  'ser-mo'(el){const s=SERIALS[Number(el.dataset.arg)];s.fixed=false;delete s.khoa;audit(`Mở khoá serial ${s.code}`,s.lo);closeOv();rerender();toast('success',`Đã mở khoá serial ${s.code}`)},
  'ser-sel'(el){const i=Number(el.dataset.arg);el.checked?TC.sel.add(i):TC.sel.delete(i);rerender()},
  'ser-sel-all'(el){const ps=pst('se'),l=serList().slice((ps.page-1)*ps.size,ps.page*ps.size);l.forEach(s=>el.checked?TC.sel.add(s.i):TC.sel.delete(s.i));rerender()},
  'ser-clear'(){TC.sel=new Set();rerender()},
  'bulk-huy'(){huyModal(selIdx())},
  'bulk-khoa'(){khoaModal(selIdx())},
  'bulk-lai'(){laiModal(selIdx())},
  'bulk-mo'(){const n=TC.sel.size;confirmM(`Mở khoá ${n} serial?`,'Các serial này in và dùng lại được như trước khi bị khoá','Mở khoá '+n+' serial',()=>{selIdx().forEach(i=>{const s=SERIALS[i];s.fixed=false;delete s.khoa});audit(`Mở khoá ${n} serial`,'Nhiều lô');TC.sel=new Set();rerender();toast('success',`Đã mở khoá ${n} serial`)},false)},
  /* nhóm máy */
  'g-moi'(){gModal()},
  'g-sua'(el){gModal(nhomOf(el.dataset.arg))},
  'g-toggle'(el){
    const g=nhomOf(el.dataset.arg),n=nhomSp(g.p);
    if(g.st!=='on'){
      g.st='on';audit(`Bật hoạt động nhóm máy ${g.p}`,g.t);rerender();
      toast('success',`Đã bật hoạt động nhóm máy ${g.t}. Sản phẩm của nhóm tạo được serial trở lại`);return;
    }
    if(COUNT[g.p]>0){
      modal(`<div class="modal__h"><h3>Chưa thể tắt nhóm máy ${g.t}</h3></div><div class="modal__b"><p style="margin:0">Nhóm máy này đã có <b>${fmt(COUNT[g.p])}</b> serial${n?` và ${n} sản phẩm đang dùng`:''}. Tiền tố ${g.p} đã in trên tem ngoài thực tế nên phải giữ nguyên để tra cứu và bảo hành. Vì vậy nhóm máy đã phát hành serial không tắt hoạt động được</p></div><div class="modal__f"><button class="btn btn--primary" data-act="close" data-focus>Đã hiểu</button></div>`,true);
      return;
    }
    confirmM(`Tắt hoạt động nhóm máy ${g.t}?`,`Nhóm máy này chưa có serial nào. Sau khi tắt, ${n?`${n} sản phẩm thuộc nhóm không tạo được serial và `:''}nhóm không còn xuất hiện khi gán cho sản phẩm. Bạn có thể bật lại bất cứ lúc nào`,'Tắt hoạt động',()=>{
      g.st='off';audit(`Tắt hoạt động nhóm máy ${g.p}`,g.t);rerender();toast('success',`Đã tắt hoạt động nhóm máy ${g.t}`);
    });
  },
  'g-luu'(el){
    const old=el.dataset.arg,t=$('#g-t').value.trim(),p=$('#g-p').value.toUpperCase();let ok=true;
    if(!t){ok=false;$('#g-t').classList.add('is-error')}
    if(!old||(COUNT[old]===0&&p!==old)){
      const dup=NHOM.find(g=>g.p===p&&g.p!==old),bad=(m)=>{ok=false;$('#g-p-w').innerHTML=field('g-p','Tiền tố',`<input class="input is-error" id="g-p" maxlength="3" value="${esc(p)}" data-live="gp" style="text-transform:uppercase;width:8rem">`,{req:true,err:m})};
      if(!/^[A-Z]{3}$/.test(p))bad('Tiền tố cần đúng 3 chữ cái A–Z');else if(dup)bad(`Tiền tố ${p} đã dùng cho ${dup.t}. Chọn tiền tố khác`);
    }
    if(!ok)return;
    if(old){const g=nhomOf(old);g.t=t;g.up='29/10/2026';if(p!==old&&COUNT[old]===0){SP.forEach(x=>{if(x.g===old)x.g=p});COUNT[p]=0;delete COUNT[old];g.p=p}audit(`Sửa nhóm máy ${g.p}`,t)}else{NHOM.push({p,t,st:'on',up:'29/10/2026'});COUNT[p]=0;audit(`Tạo nhóm máy ${p}`,t)}
    closeOv();rerender();toast('success',old?`Đã lưu nhóm máy ${t}`:`Đã tạo nhóm máy ${t} với tiền tố ${p}`);
  },
  /* sản phẩm */
  spf(el){SPF=el.dataset.arg;pst('sp').page=1;rerender()},
  'sp-gan'(el){spModal(el.dataset.arg)},
  'sp-luu'(el){const s=spOf(el.dataset.arg),v=$('#sp-g').value;if(!v){$('#sp-g').classList.add('is-error');return}s.was=s.g&&s.n>0?s.g:s.was;s.g=v;audit(`Gán sản phẩm ${s.c} vào nhóm máy ${v}`,s.c);closeOv();rerender();toast('success',`Đã gán ${s.c} vào nhóm ${nhomOf(v).t}`)},
  /* nhập Excel */
  'imp-open'(el){IMP.kind=el.dataset.arg;IMP.file=null;IMP.res=false;impModal()},
  'imp-pick'(){IMP.file=IMP.kind==='nhom'?'nhom-may-dot-2.xlsx':'san-pham-dot-3.xlsx';impModal()},
  'imp-rm'(){IMP.file=null;impModal()},
  'imp-run'(){IMP.res=true;audit(`Nhập 46 dòng từ ${IMP.file}, 4 dòng lỗi`,'Nhập Excel');impModal()},
  'imp-err'(){toast('success','Đã tải file loi-nhap-excel.xlsx')},
  tpl(){toast('success','Đã tải file mẫu')},
  /* cấu hình tem */
  'tem-txt'(el){el.setAttribute('aria-checked',el.getAttribute('aria-checked')==='true'?'false':'true');liveTem()},
  'tem-luu'(){
    TEM={...TEM,w:Number($('#ct-w').value),h:Number($('#ct-h').value),l1:$('#ct-l1').value,l2:$('#ct-l2').value,dpi:Number($('#ct-dpi').value),txt:$('#ct-txt').getAttribute('aria-checked')==='true',ver:TEM.ver+1};
    VERS.forEach(v=>v.now=false);
    const nm={sp:'Tên sản phẩm',ma:'Mã sản phẩm',no:'Không có'};
    VERS.unshift({v:TEM.ver,w:TEM.w,h:TEM.h,c1:TEM.l1,c2:TEM.l2,txt:TEM.txt,l1:nm[TEM.l1],l2:TEM.l2==='nhom'?'Nhóm máy':'Không có',by:ROLES[R].u,at:'29/10/2026',n:0,now:true});
    audit(`Lưu phiên bản tem ${TEM.ver}`,'Cấu hình tem');rerender();toast('success',`Đã lưu phiên bản tem ${TEM.ver}. Lệnh in mới sẽ dùng phiên bản này`);
  },
  /* xuất */
  'xuat-moi'(){
    modal(`<div class="modal__h"><h3>Tạo file xuất</h3><button class="btn btn--ghost btn--icon btn--sm" data-act="close" aria-label="Đóng">${ic('x')}</button></div><div class="modal__b stack">
      ${field('x-k','Khoảng ngày tạo',`<input class="input" id="x-k" value="01/10/2026 – 29/10/2026" data-focus>`)}
      ${field('x-g','Nhóm máy lúc tạo',sel('x-g',[['','Mọi nhóm máy'],...NHOM.map(g=>[g.p,g.t])],''))}
      ${field('x-s','Trạng thái',sel('x-s',[['','Mọi trạng thái'],...Object.entries(SER_ST).map(([k,v])=>[k,v[1]])],''),{help:'Tối đa 100.000 dòng mỗi file'})}</div>
      <div class="modal__f"><button class="btn btn--ghost" data-act="close">Huỷ</button><button class="btn btn--primary" id="x-ok">Tạo file xuất</button></div>`);
    $('#x-ok').onclick=()=>{
      const j={f:'serial-2610-'+(XJ.length+1)+'.xlsx',loc:`${$('#x-g').selectedOptions[0].text} · 01/10 – 29/10/2026`,n:0,st:'run',exp:'30/10/2026 '+new Date().toTimeString().slice(0,5),by:ROLES[R].u};
      XJ.unshift(j);audit('Tạo file xuất dữ liệu',j.f);closeOv();pst('xu').page=1;rerender();
      setTimeout(()=>{j.st='ok';j.n=SERIALS.length;if(location.hash==='#/xuat')rerender();toast('success',`File ${j.f} đã sẵn sàng`,{t:'Tải xuống',fn:()=>toast('success','Đang tải '+j.f)})},2500);
    };
  },
  'xuat-tai'(el){toast('success','Đang tải '+el.dataset.arg)},
  /* cảnh báo */
  cbt(el){CBT=el.dataset.arg;rerender()},
  'al-xl'(el){const a=ALERTS.find(x=>x[1]===el.dataset.arg);if(a){a[3]='Đã xử lý';a[0]='success';audit('Đánh dấu cảnh báo đã xử lý',a[1].slice(0,40))}rerender();toast('success','Đã đánh dấu cảnh báo là đã xử lý')},
  'us-khoa'(el){const u=USERS.find(x=>x.n===el.dataset.arg);confirmM(`Tạm khoá quyền tạo serial của ${u.n}?`,'Tài khoản này vẫn xem và in được, chỉ không tạo được lô serial mới. Các tài khoản khác không bị ảnh hưởng','Tạm khoá quyền tạo',()=>{u.st='khoa';audit(`Tạm khoá quyền tạo serial của ${u.a}`,'Tài khoản');rerender();toast('success',`Đã tạm khoá quyền tạo serial của ${u.n}`)})},
  'us-mo'(el){const u=USERS.find(x=>x.n===el.dataset.arg);u.st='ok';audit(`Mở lại quyền tạo serial của ${u.a}`,'Tài khoản');rerender();toast('success',`Đã mở lại quyền tạo serial cho ${u.n}`)},
  /* nhật ký, cấp số, đối soát */
  'aud-check'(){AUD_OK='run';rerender();setTimeout(()=>{AUD_OK='ok';if(location.hash==='#/audit')rerender()},1400)},
  'cs-khoa'(){confirmM('Tạm dừng cấp số cho mọi tiền tố?','Thủ kho không tạo được lô serial mới cho đến khi bạn đối soát và mở lại. Serial đã cấp và các lệnh in đang chạy không bị ảnh hưởng','Tạm dừng cấp số',()=>{LOCKED=true;audit('Tạm dừng cấp số','Cấp số');rerender();toast('info','Đã tạm dừng cấp số')})},
  'cs-mo'(){LOCKED=false;audit('Đối soát và mở lại cấp số','Cấp số');rerender();toast('success','Đối soát khớp. Đã mở lại cấp số')},
  'ds-tab'(el){DST.tab=el.dataset.arg;rerender()}
};
function refreshTao(){const q=$('#f-qty-w');if(!q)return;q.innerHTML=qtyField();$('#tao-sum').innerHTML=taoSum()}
document.addEventListener('click',e=>{
  const nav=e.target.closest('.appbar__sec-w');if(!nav&&navOpen>-1)closeNav();
  if(!e.target.closest('.dd'))$$('.menu:not(.navmenu)').forEach(m=>m.hidden=true);
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;if(!ACT[a])return;
  if(el.tagName==='INPUT'&&!['checkbox','radio'].includes(el.type))return;
  if(el.tagName==='INPUT'&&e.target!==el)return;
  if(el.matches('tr')&&e.target.closest('button,a,input,label'))return;
  const mm=el.closest('.menu:not(.navmenu)');if(mm&&a!=='menu')mm.hidden=true;
  ACT[a](el,e);
});
document.addEventListener('input',e=>{
  const t=e.target,l=t.dataset.live;if(!l)return;
  if(l==='tao'){
    if(t.id==='f-sp'){T.sp=t.value;refreshTao()}
    else{const v=t.value.trim();T.q=v===''?null:(/^\d+$/.test(v)?Number(v):NaN);t.classList.toggle('is-error',T.q!==null&&!qOk(T.q));$('#qty-msg').innerHTML=qtyMsg();$('#tao-sum').innerHTML=taoSum()}
  }
  else if(l==='tem')liveTem();
  else if(l==='gp'){t.value=t.value.toUpperCase().replace(/[^A-Z]/g,'')}
  else if(l==='tcq'){TC.f.q=t.value;pst('se').page=1;const pos=t.selectionStart;rerender();reFocus('#tc-q',pos)}
  else if(l==='tcf'){TC.f.st=$('#tc-st').value;TC.f.g=$('#tc-g').value;pst('se').page=1;rerender()}
  else if(l==='cb'){CB.lot=t.value;const l2=loOf(CB.lot);CB.sel=new Set(freeIdx(l2));CB.page=0;CB.cur=0;CB.q='';rerender()}
  else if(l==='cbq'){CB.q=t.value;CB.page=0;const pos=t.selectionStart;rerender();reFocus('[data-live="cbq"]',pos)}
  else if(l==='ldq'){LD.q=t.value;LD.page=0;const pos=t.selectionStart;rerender();reFocus('[data-live="ldq"]',pos)}
  else if(l==='lq'){const k=t.dataset.key,p=pst(k);p.q=t.value;p.page=1;const pos=t.selectionStart;rerender();reFocus(`[data-live="lq"][data-key="${k}"]`,pos)}
  else if(l==='lst'){const p=pst(t.dataset.key);p.st=t.value;p.page=1;rerender()}
  else if(l==='ldf'){LD.f=t.value;LD.page=0;rerender()}
  else if(l==='spg'){$('#sp-warn').innerHTML=spWarn(spOf(t.dataset.sp),t.value)}
  else if(l==='pgsize'){const p=pst(t.dataset.key);p.size=Number(t.value);p.page=1;rerender()}
  else if(l==='dsk'){DST.k=Number(t.value);pst('ds').page=1;rerender()}
});
new MutationObserver(()=>{$$('[data-mixed]').forEach(x=>x.indeterminate=true)}).observe(document.body,{childList:true,subtree:true});

/* ---------- khởi động ---------- */
const qr=new URLSearchParams(location.search).get('r');if(ROLES[qr])R=qr;
if(!location.hash)location.hash='#/'+ROLES[R].home;
route();
</script>
