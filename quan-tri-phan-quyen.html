VIEWS['PQ-URD-04:kenh']=()=>{const K=S.kenh;
 if(K.mode==='nv')return knNvView();
 const list=KN.filter(k=>!K.q||has(k.ten,K.q));const k=KN.find(z=>z.id===K.sel)||KN[0];
 return `${pagehead([['Phân quyền dữ liệu','PQ-URD-04'],['Phân quyền CSKH','PQ-URD-04:kenh']],'Phân quyền CSKH',knSw(),'Nhân viên nào được dùng từng kênh, ở quyền nào')}
 <div class="pq-split"><div class="card pq-side"><div class="pq-side__h"><span class="cap" style="margin:0">Danh sách kênh</span>${fSearch('kenh.q',K.q,'Tìm kênh')}</div>
  ${list.length?list.map(z=>`<button class="pq-kenh" data-a="setF" data-k="kenh.sel" data-v="${z.id}" aria-current="${z.id===k.id}"><b><span>${esc(z.ten)}</span>${z.rows.length?'':`<span title="Chưa cấu hình, đang mở cho mọi nhân viên CSKH">${tag('Chưa cấu hình','warning')}</span>`}</b><small>${z.nt} · ${z.rows.length?z.rows.length+' nhân viên':'mở cho mọi nhân viên CSKH'}</small></button>`).join(''):`<div class="cb__st">Không có kênh khớp</div>`}</div>
 <div class="card"><div class="card__h"><h4>${esc(k.ten)}</h4><span class="muted">${k.nt}</span></div>
  ${k.rows.length?`<table class="tbl" style="width:100%"><thead><tr><th>Nhân viên</th><th>Phòng ban</th><th style="width:11rem">Quyền</th><th>Cấp ngày</th><th style="width:5.5rem">Thao tác</th></tr></thead><tbody>
  ${k.rows.map((r,i)=>{const ck=k.id+'|'+r[0];const cur=K.chg[ck]||r[2];return `<tr><td>${userCell(r[0])}</td><td>${esc(r[1])}</td><td${K.chg[ck]?' class="is-chg"':''}><div class="select"><select class="input" aria-label="Quyền của ${esc(r[0])}" onchange="ACT.knMuc('${esc(ck)}',this.value,'${esc(r[2])}')">${KN_MUC.map(m=>`<option ${m===cur?'selected':''}>${m}</option>`).join('')}</select>${ic('chev-down')}</div></td><td>${r[3]}</td><td><a href="#" class="lnk" data-a="knThuHoi" data-x="${k.id}|${i}">Thu hồi</a></td></tr>`}).join('')}
  </tbody></table>`:`<div class="pq-pad"><div class="alert alert--warning">${ic('alert')}<div class="alert__d">Kênh chưa cấu hình, đang mở cho mọi nhân viên CSKH. Thêm dòng quyền đầu tiên thì kênh chỉ còn người được cấp</div></div></div>`}
  <div class="pq-bar"><button class="btn btn--secondary" data-a="knThem">${ic('plus')}Thêm quyền</button><button class="btn btn--secondary" data-a="knSaoChep" data-x="kenh">${ic('copy')}Sao chép quyền từ kênh khác</button><span class="spacer"></span>${knSave()}</div></div></div>`};
function knNvView(){const K=S.kenh;const list=KN_NV.filter(n=>!K.nq||has(n[0]+' '+n[1],K.nq));const nv=KN_NV.find(n=>n[0]===K.nv)||KN_NV[0];const adm=nv[2]==='Quản trị kênh chăm sóc';
 return `${pagehead([['Phân quyền dữ liệu','PQ-URD-04'],['Phân quyền CSKH','PQ-URD-04:kenh']],'Phân quyền CSKH',knSw(),'Quyền của nhân viên trên từng kênh')}
 <div class="pq-split"><div class="card pq-side"><div class="pq-side__h"><span class="cap" style="margin:0">Nhân viên</span>${fSearch('kenh.nq',K.nq,'Tìm theo tên, phòng ban')}</div>
  ${list.map(n=>`<button class="pq-kenh" data-a="setF" data-k="kenh.nv" data-v="${esc(n[0])}" aria-current="${n[0]===nv[0]}"><b><span>${esc(n[0])}</span></b><small>${esc(n[1])} · ${esc(n[2]==='Không'?'Chưa có vai CSKH':n[2])}</small></button>`).join('')}</div>
 <div class="card"><div class="card__b"><dl class="dl"><dt>Nhân viên</dt><dd>${esc(nv[0])}</dd><dt>Phòng ban</dt><dd>${esc(nv[1])}</dd><dt>Vai trò CSKH</dt><dd>${esc(nv[2])}</dd><dt>Kênh được xem</dt><dd>${esc(nv[3])}</dd></dl></div>
  <table class="tbl" style="width:100%"><thead><tr><th>Kênh</th><th>Nền tảng</th><th style="width:12rem">Quyền trên kênh</th><th>Lý do</th></tr></thead><tbody>
  ${KN.map(k=>{const r=k.rows.find(z=>z[0]===nv[0]);const ck=k.id+'|'+nv[0];const cur=K.chg[ck]||(r?r[2]:'Không có quyền');
   let ly=r?'Được cấp':k.rows.length?'Kênh đã cấu hình, chưa cấp':'Chưa cấu hình, đang mở cho mọi nhân viên CSKH';if(adm)ly='Quản trị theo vai trò CSKH';if(nv[3]!=='Tất cả'&&nv[3]!==k.ten)ly='Bị giới hạn hiển thị trên hồ sơ người dùng';
   const ctl=adm?tag('Quản trị kênh','info'):!k.rows.length?tag('Mở cho mọi nhân viên CSKH','warning'):`<div class="select"><select class="input" aria-label="Quyền trên ${esc(k.ten)}" onchange="ACT.knMuc('${esc(ck)}',this.value,'${r?r[2]:'Không có quyền'}')">${['Không có quyền',...KN_MUC].map(m=>`<option ${m===cur?'selected':''}>${m}</option>`).join('')}</select>${ic('chev-down')}</div>`;
   return `<tr><td>${esc(k.ten)}</td><td>${k.nt}</td><td${K.chg[ck]?' class="is-chg"':''}>${ctl}</td><td class="muted">${esc(ly)}</td></tr>`}).join('')}
  </tbody></table>
  <div class="pq-bar"><button class="btn btn--secondary" data-a="knSaoChep" data-x="nv">${ic('copy')}Sao chép quyền từ nhân viên khác</button><span class="spacer"></span>${knSave()}</div></div></div>`}
Object.assign(ACT,{
 knMuc(ck,v,old){if(v===old)delete S.kenh.chg[ck];else S.kenh.chg[ck]=v;render(true)},
 knLuu(){const n=Object.keys(S.kenh.chg).length;for(const ck in S.kenh.chg){const[id,nv]=ck.split('|');const k=KN.find(z=>z.id===id);const r=k.rows.find(z=>z[0]===nv);const v=S.kenh.chg[ck];
  if(r){if(v==='Không có quyền')k.rows.splice(k.rows.indexOf(r),1);else r[2]=v}else if(v!=='Không có quyền')k.rows.push([nv,'Phòng CSKH',v,fD(TODAY)])}
  S.kenh.chg={};toast(`Đã lưu ${n} thay đổi quyền kênh`);render(true)},
 knThem(){const k=KN.find(z=>z.id===S.kenh.sel)||KN[0];
  modal({title:'Thêm quyền trên '+k.ten,body:`<div class="form-grid" style="grid-template-columns:1fr">
   ${pqFld('Nhân viên',`<div class="multi" id="kn-nv"><span class="tag tag--outline">Võ Anh Thư<button type="button" aria-label="Bỏ Võ Anh Thư">${ic('x','ic--sm')}</button></span><span class="tag tag--outline">Lưu Bảo Ngọc<button type="button" aria-label="Bỏ Lưu Bảo Ngọc">${ic('x','ic--sm')}</button></span><input placeholder="Tìm nhân viên đang hoạt động" aria-label="Tìm nhân viên"></div>`,{req:1,help:'Chỉ nhân viên chưa có dòng quyền trên kênh. Người có vai Quản trị kênh chăm sóc quản trị mọi kênh theo vai trò, không cấp ở đây'})}
   ${pqFld('Quyền',selectBox('kn-muc',KN_MUC,'Trực chat'),{req:1})}</div>
   ${k.rows.length?'':`<div class="alert alert--warning gap-t">${ic('alert')}<div class="alert__d">Dòng quyền đầu tiên: kênh sẽ chỉ còn người được cấp</div></div>`}
   <p class="hint" style="margin:.75rem 0 0">Chỉ xem: xem hội thoại và data của kênh. Trực chat: nhận, trả lời hội thoại, tạo cơ hội, đơn hàng. Quản trị kênh: toàn quyền, kể cả cấu hình và ngắt kết nối</p>`,
   foot:`${pqHuy}<button class="btn btn--primary" data-a="knThemOk">Thêm</button>`})},
 knThemOk(){const k=KN.find(z=>z.id===S.kenh.sel)||KN[0];const muc=val('kn-muc');['Võ Anh Thư','Lưu Bảo Ngọc'].forEach(n=>{if(!k.rows.some(r=>r[0]===n))k.rows.push([n,'Phòng CSKH',muc,fD(TODAY)])});closeOverlay();toast('Đã thêm quyền cho 2 nhân viên');render(true)},
 knThuHoi(x){const[id,i]=x.split('|');const k=KN.find(z=>z.id===id);const r=k.rows[+i];
  if(k.rows.length===1)return modal({title:'Thu hồi quyền cuối cùng của kênh?',size:'modal--sm',body:`<p style="margin:0" data-moi>${esc(r[0])} là người cuối cùng có quyền trên ${esc(k.ten)}. Sau khi thu hồi, kênh chỉ còn người có vai Quản trị kênh chăm sóc dùng được</p>`,foot:`${pqHuy}<button class="btn btn--danger" data-a="knThuHoiOk" data-x="${x}">Thu hồi</button>`});
  ACT.knThuHoiOk(x)},
 knThuHoiOk(x){const[id,i]=x.split('|');const k=KN.find(z=>z.id===id);k.rows.splice(+i,1);closeOverlay();toast('Đã thu hồi quyền');render(true)},
 knSaoChep(x){const nv=x==='nv';
  modal({title:nv?'Sao chép quyền từ nhân viên khác':'Sao chép quyền từ kênh khác',size:'modal--sm',body:pqFld(nv?'Nhân viên nguồn':'Kênh nguồn',selectBox('kn-src',nv?KN_NV.filter(n=>n[0]!==S.kenh.nv).map(n=>n[0]):KN.filter(k=>k.id!==S.kenh.sel).map(k=>[k.id,k.ten])),{req:1,help:'Các dòng quyền được nạp vào bảng ở trạng thái chưa lưu, bấm Lưu thay đổi để áp'}),foot:`${pqHuy}<button class="btn btn--primary" data-a="knSaoChepOk" data-x="${x}">Nạp quyền</button>`})},
 knSaoChepOk(x){const s=val('kn-src');closeOverlay();
  if(x==='kenh'){const src=KN.find(k=>k.id===s);if(!src.rows.length)return toast('Kênh nguồn chưa cấp quyền riêng cho ai, không có gì để sao chép','error');const k=KN.find(z=>z.id===S.kenh.sel);
   src.rows.forEach(r=>{if(k.rows.some(z=>z[0]===r[0])){const ck=k.id+'|'+r[0];if(k.rows.find(z=>z[0]===r[0])[2]!==r[2])S.kenh.chg[ck]=r[2]}});toast('Đã nạp quyền từ '+src.ten+', bấm Lưu thay đổi để áp','info')}
  else{KN.forEach(k=>{const r=k.rows.find(z=>z[0]===s);const me=k.rows.find(z=>z[0]===S.kenh.nv);const v=r?r[2]:'Không có quyền';if(k.rows.length&&(me?me[2]:'Không có quyền')!==v)S.kenh.chg[k.id+'|'+S.kenh.nv]=v});toast('Đã nạp quyền của '+s+', bấm Lưu thay đổi để áp','info')}
  render(true)}
});

Object.assign(ACT,{
 ldBac(x){const[lid,bid]=x.split('|');const l=ldGet(lid);const b=l.bac.find(z=>z.id===bid)||{ten:'',nguong:'',vai:[],doi:false,han:600};const cd=lid==='cd';
  modal({title:b.ten||'Thêm bậc duyệt',body:`<div class="form-grid">
   ${pqFld(cd?'Tên cấp':'Tên bậc',pqIn('lb-ten',b.ten,'Nhập tên bậc','maxlength="100"'),{req:1,full:1})}
   ${pqFld(cd?'Áp khi ngân sách từ (đ)':'Áp khi số tiền từ (đ)',pqIn('lb-ng',b.nguong===''?'':fmt(b.nguong),'0: mọi phiếu','maxlength="15" inputmode="numeric" style="text-align:right"'),{req:1,moi:!cd,help:'0: mọi phiếu. Mỗi ngưỡng chỉ khai một bậc'})}
   ${pqFld('Hạn duyệt (phút làm việc)',pqIn('lb-han',b.han,'600','maxlength="5" inputmode="numeric" style="text-align:right"'),{req:1,moi:cd,help:'600 phút là một ngày làm việc'})}
   ${cd?'':pqFld('Vai trò được ký',pqChips(b.vai,'Thêm vai trò'),{req:1,full:1,help:'Vai đầu tiên giữ bậc, các vai sau ký thay. Ký được phiếu nào theo phạm vi Duyệt của vai trên ma trận'})}
   ${cd?'':`<div class="full" data-moi><label class="chk"><input type="checkbox" id="lb-doi" ${b.doi?'checked':''}><span>Chỉ trưởng nhóm của đội bản ghi được ký</span></label></div>`}</div>`,
   foot:`${pqHuy}<button class="btn btn--primary" data-a="ldBacLuu" data-x="${x}">Lưu</button>`})},
 ldBacLuu(x){const[lid,bid]=x.split('|');if(!val('lb-ten'))return fieldErr('lb-ten','Tên bậc không được để trống');
  const ng=+val('lb-ng').replace(/\D/g,'')||0,han=+val('lb-han').replace(/\D/g,'')||0;
  if(!(han>0))return fieldErr('lb-han','Hạn duyệt phải lớn hơn 0 phút');
  const l=ldGet(lid);if(l.bac.some(z=>z.id!==bid&&z.nguong===ng))return fieldErr('lb-ng','Hai bậc cùng ngưỡng sẽ cùng áp một lúc, mỗi ngưỡng chỉ khai một bậc');
  if(bid&&l.bac.find(z=>z.id===bid).nguong===0&&ng>0&&!l.bac.some(z=>z.id!==bid&&z.nguong===0))return ACT.ldKhongLuu();
  S.ldPend={lid,bid,ten:val('lb-ten'),ng,han,doi:!!(document.getElementById('lb-doi')||{}).checked};ACT.ldLuuHoi(lid)},
 ldLuuHoi(lid){const l=ldGet(lid);modal({title:`Lưu thay đổi luồng ${l.ten}?`,size:'modal--sm',body:`<p style="margin:0" data-moi>Thay đổi chỉ áp cho phiếu gửi duyệt từ sau lúc lưu. ${l.cho||2} phiếu đang chờ duyệt giữ nguyên bậc và hạn cũ</p>`,foot:`${pqHuy}<button class="btn btn--primary" data-a="ldLuuOk" data-x="${lid}">Lưu</button>`})},
 ldLuuOk(lid){const P=S.ldPend;if(P&&P.lid===lid){const l=ldGet(lid);let b=l.bac.find(z=>z.id===P.bid);if(!b){b={id:'n'+Date.now(),vai:['Ban giám đốc'],tt:'on'};l.bac.push(b)}Object.assign(b,{ten:P.ten,nguong:P.ng,han:P.han,doi:P.doi});S.ldPend=null}
  closeOverlay();toast(lid==='hd'?'Đã lưu ngưỡng duyệt hợp đồng':'Đã lưu bậc duyệt');render(true)},
 ldKhongLuu(){pqNotice('Không lưu được bậc duyệt','Phải luôn có một bậc duyệt đang dùng áp dụng cho mọi đề xuất chi. Không lưu trữ, xoá hay đổi ngưỡng của bậc cuối cùng như vậy')},
 ldKichHoat(x){const l=ldGet(x);pqConfirm(`Kích hoạt luồng ${l.ten}?`,`Phiếu ${l.ten.toLowerCase()} gửi duyệt từ lúc này đi theo luồng. Phiếu đã gửi trước đó giữ cách duyệt cũ`,'Kích hoạt luồng','ldKichHoatOk','primary',x)},
 ldKichHoatOk(x){ldGet(x).tt='on';closeOverlay();toast('Đã kích hoạt luồng');render(true)}
});
