<script>
/* ---------- tiện ích ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('vi-VN');
const fmt1=n=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:1,minimumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const NOW=new Date(2026,10,3,15,30), TODAY=new Date(2026,10,3);
const mkD=(d,m,y=2026,h=8,mi=0)=>new Date(y,m-1,d,h,mi);
const fD=d=>d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:'-';
const fDT=d=>d?`${fD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'-';
const fT=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes());
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate(),d.getHours(),d.getMinutes());
const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const diffMin=(a,b)=>Math.round((a-b)/60000);
const diffDay=(a,b)=>Math.round((dayStart(a)-dayStart(b))/864e5);
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function dur(m){m=Math.max(0,Math.round(m));if(m<60)return m+' phút';const h=Math.floor(m/60);if(h<24)return h+' giờ'+(m%60?' '+(m%60)+' phút':'');const d=Math.floor(h/24);return d+' ngày'+(h%24?' '+(h%24)+' giờ':'')}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const has=(hay,q)=>norm(hay).includes(norm(q));
const initials=n=>{const p=String(n).trim().split(/\s+/);return (p[p.length-2]||'')[0]+(p[p.length-1]||'')[0]};
const avatar=(n,c='')=>{const k=['avatar--a','avatar--b','avatar--c',''];let h=0;for(const ch of String(n))h+=ch.charCodeAt(0);return `<span class="avatar ${c||k[h%4]}" aria-hidden="true">${esc(initials(n).toUpperCase())}</span>`};
const userCell=n=>n?`<span class="cell-user">${avatar(n)}<span>${esc(n)}</span></span>`:'<span class="muted">-</span>';
const tag=(t,k='')=>`<span class="tag ${k?'tag--'+k:''}">${esc(t)}</span>`;
const dash='<span class="muted">-</span>';
function hashStr(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
let _rnd=20261103;const rnd=()=>{_rnd=(_rnd*1664525+1013904223)>>>0;return _rnd/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];


/* ---------- toast, modal, drawer ---------- */
function toast(msg,kind='success',undo){const b=$('#toasts');const el=document.createElement('div');el.className='toast toast--'+kind;
  const n=kind==='error'?'err':kind==='info'?'info':'ok';
  el.innerHTML=`${ic(n)}<div class="toast__m">${esc(msg)}</div>${undo?'<button class="toast__a">Hoàn tác</button>':''}<button class="toast__x" aria-label="Đóng">${ic('x','ic--sm')}</button>`;
  while(b.children.length>=3)b.firstChild.remove();b.appendChild(el);const rm=()=>el.remove();el.querySelector('.toast__x').onclick=rm;
  if(undo)el.querySelector('.toast__a').onclick=()=>{undo();rm();render()};
  if(kind!=='error')setTimeout(rm,undo?8000:5000)}
let _overlay=null;
function closeOverlay(){if(_overlay){_overlay.remove();_overlay=null}}
function modal({title,body,foot,size=''}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="modal__b">${body}</div>${foot?`<div class="modal__f">${foot}</div>`:''}</div>`;document.body.appendChild(w);_overlay=w;const f=w.querySelector('input,select,textarea');if(f)f.focus()}
function drawer({title,body,foot}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="drawer__b">${body}</div>${foot?`<div class="drawer__f">${foot}</div>`:''}</aside>`;document.body.appendChild(w);_overlay=w}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function fieldErr(id,msg){const e=document.getElementById(id);if(!e)return;e.setAttribute('aria-invalid','true');const w=e.closest('.field');if(w&&!w.querySelector('.field__err')){const d=document.createElement('div');d.className='field__err';d.innerHTML=ic('err')+`<span>${esc(msg)}</span>`;w.appendChild(d)}e.focus()}
const selectBox=(id,opts,cur='',attrs='')=>`<div class="select"><select class="input" id="${id}" ${attrs}>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSel=(key,opts,cur,label)=>`<div class="select"><select class="input" data-f="${key}" aria-label="${esc(label)}">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSearch=(key,cur,ph)=>`<div class="input-wrap">${ic('search')}<input class="input" id="s-${key.replace('.','-')}" data-f="${key}" value="${esc(cur)}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></div>`;
const seg=(key,opts,cur,label)=>`<div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v,l])=>`<button data-a="setF" data-k="${key}" data-v="${v}" aria-pressed="${v===cur}">${esc(l)}</button>`).join('')}</div>`;
const sw=(a,on,label,x='')=>`<button class="sw" role="switch" aria-checked="${!!on}" data-a="${a}" data-x="${esc(x)}"><span class="sw__t"></span><span>${esc(label)}</span></button>`;
const crumbs=(arr)=>`<nav class="crumbs" aria-label="Đường dẫn">${arr.map((c,i)=>i<arr.length-1?`<a href="#" data-a="go" data-x="${c[1]}">${esc(c[0])}</a>${ic('chev-right')}`:`<span aria-current="page">${esc(c[0])}</span>`).join('')}</nav>`;
const pagehead=(cr,title,actions='',sub='')=>`<div class="pagehead"><div class="pagehead__l">${cr?crumbs(cr):''}<h1>${title}</h1>${sub?`<div class="hint">${sub}</div>`:''}</div>${actions?`<div class="row">${actions}</div>`:''}</div>`;
const emptyState=(t,d,btn='')=>`<div class="state"><span class="state__ic">${ic('search')}</span><h4>${esc(t)}</h4><p>${esc(d)}</p>${btn?`<div class="row">${btn}</div>`:''}</div>`;
const logs=[];
function addLog(fn,op,before,after){logs.unshift({t:new Date(NOW.getTime()+logs.length*0),who:me(),fn,op,before,after})}

/* ---------- khung chung: trạng thái, thanh ứng dụng, điều hướng, sự kiện ----------
   File phân hệ khai: APP, ROLES, NAV, VIEWS.<route>, ACT.<thao tác>, Object.assign(S,{...}), MH(...)
   Xem _congcu/proto/HUONG_DAN_PROTOTYPE.md */
const S={role:null,route:null,arg:null,openNav:null,userOpen:false};
const VIEWS={}, ACT={}, MHS={};
let APP={key:'',name:'',search:'Tìm kiếm'}, ROLES={}, NAV=[];
function can(r){return !r||r.split(' ').includes(S.role)}
const me=()=>ROLES[S.role].u;
function canRoute(r){for(const g of NAV){if(g.r===r)return can(g.ro);if(g.items)for(const i of g.items)if(i[0]===r)return can(i[2])}return true}
function navGroupOf(r){return NAV.find(g=>g.r===r||(g.items&&g.items.some(i=>i[0]===r)))}
function getPath(k){return k.split('.').reduce((o,p)=>o==null?o:o[p],S)}
function setPath(k,v){const p=k.split('.');let o=S;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=v;if(o.page!==undefined&&p[p.length-1]!=='page')o.page=1}
/* Đánh dấu phần Claude tự bổ sung: chỉ hiện nền vàng khi mở với #...&vang=1 (ảnh chụp cho URD) */
const moi=h=>`<span data-moi>${h}</span>`;
function vAppbar(){const R=ROLES[S.role],cur=navGroupOf(S.route);
 return `<button class="appbar__mod" data-a="go" data-x="${R.home}" aria-label="${esc(APP.name)}, về trang đầu">${ic('apps')}<span class="appbar__brand">${esc(APP.name)}</span></button><span class="appbar__sep"></span><nav class="appbar__secs" aria-label="Nhóm chức năng">${NAV.map(g=>{
  if(g.r){if(!can(g.ro))return'';return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="go" data-x="${g.r}" aria-current="${cur===g}">${esc(g.t)}</button></div>`}
  const it=g.items.filter(i=>can(i[2]));if(!it.length||(g.ro&&!can(g.ro)))return'';
  if(g.items.length===1)return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="go" data-x="${it[0][0]}" aria-current="${cur===g}">${esc(g.t)}</button></div>`;
  return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="toggleNav" data-x="${esc(g.t)}" aria-haspopup="menu" aria-expanded="${S.openNav===g.t}" aria-current="${cur===g}">${esc(g.t)}${ic('chev-down','ic--sm')}</button>${S.openNav===g.t?`<div class="menu navmenu" role="menu">${it.map(i=>`<button class="menu__i" role="menuitem" data-a="go" data-x="${i[0]}" aria-current="${S.route===i[0]?'page':'false'}">${esc(i[1])}</button>`).join('')}</div>`:''}</div>`}).join('')}</nav><span class="spacer"></span>

 if(k.lv==='L1'){if(!k.mt)return `${k.n} đang ở cấp L1 và chưa có Mentor nên chưa đi phiếu được. Nhờ Trưởng phòng kỹ thuật chọn Mentor cho KTV này`;const m=kKtv(k.mt);return kLvBlock(m,t)?`Mentor ${m.n} của ${k.n} không nhận được phiếu này. Chọn KTV khác`:''}
 if(k.lv==='L2'){if(t.pr==='P1'||t.pr==='P2')return `${k.n} đang ở cấp L2, chỉ nhận phiếu P3, P4 thuộc nhóm thiết bị được cấp phép. Phiếu ${t.id} là ${t.pr}. Chọn KTV cấp L3`;const g=kGroupOf(t);if(!k.grp.split(', ').includes(g))return `${k.n} chưa được cấp phép nhóm thiết bị ${g}. Chọn KTV khác hoặc nhờ Trưởng phòng kỹ thuật cập nhật cấp độ`}
 return ''}
const kSlotEnd=(d,i)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),KSLOTS[i][3],KSLOTS[i][4]);

 KHOLD.filter(h=>h.st==='Chờ xác nhận'&&h.k===k.n&&sameDay(h.day,d)&&h.slot===i).forEach(h=>it.push(Object.assign(Object.create(kT(h.t)),{held:true})));return it}

 ${KSLOTS.map((s,i)=>{if(k.lv==='L0')return `<td><span class="slot" style="cursor:default" data-moi>Đang đào tạo</span></td>`;
  const it=kCell(k,d,i);const f=it[0];const past=kPast(d,i);const block=sel&&kLvBlock(k,sel);const hl=L.hl===k.n+'|'+i;
  if(f&&!sel){const held=it.some(x=>x.held);const canX=dp&&!held&&(f.st===1||f.st===2);return `<td><div class="kslot-w"><button class="slot has ${f.pr==='P1'?'is-p1':''} ${held?'is-wait':''} ${it.length>1?'is-dup':''}" data-a="${held?'klHold':'kOpenT'}" data-x="${held?it.find(x=>x.held).id:f.id}"><b>${f.id.slice(-4)} ${esc(f.cust)}</b><small>${it.length>1?moi(`Trùng ${it.length} việc`):`${f.pr}${f.mate===k.n?', Đi cùng Mentor':f.flags.includes('Kèm cặp')?', Kèm cặp':''}, ${esc(KST[f.st])}`}${held?', '+moi('Chờ xác nhận trùng lịch'):''}</small></button>${canX?`<button class="btn btn--ghost btn--icon btn--sm kslot-x" data-a="klSwap" data-x="${f.id}" aria-label="Đổi KTV hoặc gỡ gán">${ic('edit','ic--sm')}</button>`:''}</div></td>`}

  foot:`<span class="hint" id="k05s-why" style="margin-right:auto" data-moi>Quét hoặc nhập serial</span><button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" id="k05s-ok" data-a="k05TraOk">Mở hồ sơ máy</button>`});ACT.k05ChkSn();if(o.sn)ACT.k05TraOk()},
 k05ChkSn(){const ok=!!val('k05s-sn');const b=$('#k05s-ok');b.disabled=!ok;b.title=ok?'':'Quét hoặc nhập serial';$('#k05s-why').hidden=ok},
 k05TraOk(){const raw=val('k05s-sn');const sn=k05Sn(raw);const kq=$('#k05s-kq');const al=(k,t,extra='')=>`<div class="alert alert--${k}" role="alert">${ic(k==='danger'?'err':'alert')}<div class="alert__d">${t}${extra}</div></div>`;
  if(!sn){kq.innerHTML=al('danger','Serial không được để trống');$('#k05s-sn').focus();return}
  if(K05_SER_HUY.includes(sn)){kq.innerHTML=al('danger',`Serial ${esc(sn)} đã huỷ, không dùng cho máy nào được nữa`);return}
  if(K05_SER_KHOA.includes(sn)){kq.innerHTML=al('danger',`Serial ${esc(sn)} đang tạm khoá điều tra, chưa dùng được. Báo người vận hành phân hệ Serial`);return}
  const m=K05_MAY.find(x=>x.sn===sn);if(m){closeOverlay();S.k05m.tab='tt';go('KT-URD-05:may',m.id);return}
  kq.innerHTML=al('warning',`Không có máy nào mang serial ${esc(sn)} trong sổ`,can('dpkt tpkt')?`<div class="gap-t-s" data-moi><a href="#" class="lnk" data-a="k05ThemTuSn" data-x="${esc(sn)}">Thêm máy với serial này</a></div>`:'')},
 k05ThemTuSn(x){ACT.k05FormMay(null,null,null,{sn:x})},

 k05ThemTag(sel){const v=sel.value;if(!v)return;const box=sel.closest('.multi');const s=document.createElement('span');s.className='tag tag--outline';s.dataset.v=v;s.innerHTML=`${esc(v)}<button type="button" aria-label="Bỏ ${esc(v)}" onclick="ACT.k05BoTag(this)">${ic('x','ic--sm')}</button>`;box.insertBefore(s,sel);sel.querySelector(`option[value="${CSS.escape(v)}"]`)?.remove();sel.value='';ACT.k05Chk()},

 k05Chk(){if($('#k05c-ok'))ACT.k05ChkCs();if($('#k05h-ok'))ACT.k05ChkHd()},

  if(trung){$('#k05c-model').setAttribute('aria-invalid','true');const w=$('#k05c-model').closest('.field');const d=document.createElement('div');d.className='field__err';d.innerHTML=ic('err')+`<span>Model ${esc(trung)} đang thuộc chính sách khác</span>`;w.appendChild(d);return}
  if(!/^\d+$/.test(th)||+th<1||+th>120)return fieldErr('k05c-thang','Nhập số nguyên từ 1 đến 120');
  const ck=val('k05c-ck');if(ck&&(!/^\d+$/.test(ck)||+ck>60))return fieldErr('k05c-ck','Nhập số nguyên từ 0 đến 60');
  const ten=ms.join(', ');
  if(c){c.truoc={tu:c.tu,thang:c.thang,pham:c.pham,loaiTru:c.loaiTru,chuky:c.chuky};Object.assign(c,{models:ms,ten,thang:+th,tu:TODAY,pham:k05Tags('k05c-pham'),loaiTru:val('k05c-lt'),chuky:+ck||0})}
  else{const id='cs'+K05_CS.length;K05_CS.push({id,models:ms,ten,thang:+th,tu:TODAY,pham:k05Tags('k05c-pham'),loaiTru:val('k05c-lt'),chuky:+ck||0,may:0,st:'ap'});S.k05cs.sel=id}
  closeOverlay();toast('Đã lưu chính sách '+ten);render(true)},

 k05NgungCs(x){const c=k05Cs(x);S.k05c=x;modal({title:'Ngừng dùng chính sách '+c.ten,size:'modal--sm',body:`<div class="alert alert--warning">${ic('alert')}<div class="alert__d">${c.may} máy đã kích hoạt giữ bản đã áp. Máy mới của các model này lấy 12 tháng mặc định cho tới khi có chính sách mới</div></div>

  foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--danger" id="k05n-ok" data-a="k05NgungOk" disabled title="Nhập lý do tối thiểu 10 ký tự">Ngừng dùng</button>`})},
 k05NgungOk(){const c=k05Cs(S.k05c);c.st='ngung';closeOverlay();toast('Đã ngừng dùng chính sách '+c.ten);render(true)},

 /* MH12 hợp đồng */
 k05FormHd(x,el,ev,o={}){const h=x?K05_HD.find(z=>z.so===x):null;const kh=h&&h.st!=='nhap';S.k05h=x||null;
  const d=o.demo?{kh:'Quảng cáo Minh Khang',loai:'Bảo trì định kỳ',tu:'01/12/2026',den:'30/11/2027',may:['DTS2511000032, Khắc laser CO2 1390'],chuky:3,phi:'8.000.000'}
   :h?{kh:h.kh,loai:h.loai,tu:fD(h.tu),den:fD(h.den),may:h.may.map(id=>{const m=k05May(id);return k05Ten(m)+', '+m.model}),chuky:h.chuky||'',phi:h.phi}:{kh:'',loai:'Bảo trì định kỳ',tu:'',den:'',may:[],chuky:'',phi:''};
  const mayKhach=K05_MAY.filter(m=>m.tt==='dung'&&m.sn).map(m=>k05Ten(m)+', '+m.model).filter(t=>!d.may.includes(t));

   <div class="field">${k05Lbl('Loại hợp đồng',1,'k05h-loai')}${h?`<div class="field-ro">${esc(d.loai)}</div>`:selectBox('k05h-loai',['Bảo trì định kỳ','Bảo hành mở rộng','Dịch vụ theo phiếu'],d.loai,'onchange="ACT.k05ChkHd()"')}</div>
   <div class="field">${k05Lbl('Hiệu lực từ',1,'k05h-tu')}${kh?`<div class="field-ro">${d.tu}</div>`:k05Date('k05h-tu',d.tu,'oninput="ACT.k05ChkHd()"')}</div>
   <div class="field">${k05Lbl('Hiệu lực đến',1,'k05h-den')}${k05Date('k05h-den',d.den,'oninput="ACT.k05ChkHd()"')}${kh?'<div class="field__help">Hợp đồng đã kích hoạt chỉ được lùi ngày này để gia hạn</div>':''}</div>
   <div class="field full">${k05Lbl('Máy thuộc hợp đồng',1)}${k05Multi('k05h-may',d.may,mayKhach,'Thêm máy đang dùng của khách')}<div class="field__help">Một máy chỉ thuộc một hợp đồng Bảo trì định kỳ đang hiệu lực</div></div>
   <div class="field" id="k05h-ck-w">${k05Lbl('Chu kỳ bảo trì (tháng)',1,'k05h-ck')}<input class="input num" id="k05h-ck" maxlength="2" value="${esc(d.chuky)}" oninput="ACT.k05ChkHd()"></div>
   <div class="field">${k05Lbl('Phí dịch vụ (đ)',0,'k05h-phi')}${kh?`<div class="field-ro">${esc(d.phi)}</div>`:`<input class="input num" id="k05h-phi" maxlength="15" value="${esc(d.phi)}">`}</div>
   <div class="field full">${k05Lbl('Tệp hợp đồng',0)}${h&&h.tep?`<div class="row"><a href="#" class="lnk" style="display:inline-flex;align-items:center;gap:.25rem" data-a="k05Tep" data-x="${h.tep}">${ic('doc','ic--sm')} ${h.tep}</a><button type="button" class="btn btn--ghost btn--sm">Thay tệp</button></div>`:`<button type="button" class="drop">${ic('upload')}<span><b>Kéo tệp vào đây</b> hoặc bấm để chọn</span><small>Định dạng PDF, tối đa 10 MB</small></button>`}</div></div></div>`,
   foot:`<span class="hint" id="k05h-why" style="margin-right:auto" data-moi>Nhập đủ các trường bắt buộc</span><button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button>${!h||h.st==='nhap'?`<button class="btn btn--secondary" data-a="k05LuuHd" data-x="nhap">Lưu nháp</button>`:''}<button class="btn btn--primary" id="k05h-ok" data-a="k05LuuHd" data-x="kh">${kh?'Lưu':'Kích hoạt'}</button>`});ACT.k05ChkHd()},
 k05ChkHd(){const h=S.k05h?K05_HD.find(z=>z.so===S.k05h):null;const loai=$('#k05h-loai')?val('k05h-loai'):h.loai;const btdk=loai==='Bảo trì định kỳ';$('#k05h-ck-w').hidden=!btdk;
  const ok=($('#k05h-kh')?val('k05h-kh'):1)&&($('#k05h-tu')?val('k05h-tu'):1)&&val('k05h-den')&&k05Tags('k05h-may').length&&(!btdk||val('k05h-ck'));
  const b=$('#k05h-ok');b.disabled=!ok;b.title=ok?'':'Nhập đủ các trường bắt buộc';$('#k05h-why').hidden=!!ok},
 k05LuuHd(x){k05ClrErr();const h=S.k05h?K05_HD.find(z=>z.so===S.k05h):null;const p=s=>{const[d,m,y]=String(s).split('/').map(Number);return d&&m&&y?new Date(y,m-1,d):null};
  const tu=$('#k05h-tu')?p(val('k05h-tu')):h.tu,den=p(val('k05h-den'));
  if(x!=='nhap'){if(!den)return fieldErr('k05h-den','Nhập ngày theo dạng dd/mm/yyyy');if(tu&&den<=tu)return fieldErr('k05h-den','Hiệu lực đến phải sau Hiệu lực từ');
   if(h&&h.st!=='nhap'&&den<h.den)return fieldErr('k05h-den','Chỉ được lùi ngày hết hiệu lực để gia hạn');
   const ck=val('k05h-ck');if(!$('#k05h-ck-w').hidden&&(!/^\d+$/.test(ck)||+ck<1||+ck>60))return fieldErr('k05h-ck','Nhập số nguyên từ 1 đến 60')}

  else{so='HĐDV-2026-0020';const kh=val('k05h-kh').split(',')[0].trim();K05_HD.push({so,kh,loai:val('k05h-loai'),tu:tu||TODAY,den:den||addM(TODAY,12),chuky:+val('k05h-ck')||0,may:[],phi:val('k05h-phi')?val('k05h-phi')+' đ':'',nv:me(),tep:'',st:x==='nhap'?'nhap':'hl'});S.k05cs.hd=so}
  closeOverlay();toast('Đã lưu hợp đồng '+so);render(true)},

 k05ChamDut(x,el,ev,o={}){const h=K05_HD.find(z=>z.so===x);S.k05h=x;const d=o.demo?{ly:'Khách thanh lý máy',dg:'Khách bán lại máy cho đơn vị khác, đã ký biên bản thanh lý'}:{ly:'',dg:''};

 k05ChkCd(){const ok=!!(val('k05d-ngay')&&val('k05d-ly')&&val('k05d-dg').length>=10);const b=$('#k05d-ok');b.disabled=!ok;b.title=ok?'':'Chọn lý do và nhập diễn giải tối thiểu 10 ký tự';$('#k05d-why').hidden=ok},
 k05CdOk(){const h=K05_HD.find(z=>z.so===S.k05h);const[d,m,y]=val('k05d-ngay').split('/').map(Number);const n=new Date(y,m-1,d);

function kaFoot(p){const lk=kaLock(p);const d=lk?'disabled':'';let b='';
 const tx=p.loai==='Hỗ trợ từ xa';
 if(p.tt==='Đã điều phối')b=`<button class="btn btn--primary btn--block" data-moi data-a="kaNhan" data-x="${p.id}" ${d}>Nhận việc</button><button class="btn btn--secondary btn--block" data-moi data-a="kaTuChoi" data-x="${p.id}" ${d}>Từ chối nhận</button>`;
 else if(p.tt==='KTV đã nhận')b=`<button class="btn btn--primary btn--block" data-moi data-a="kaChuyen" data-x="${p.id}" ${d}>${tx?'Bắt đầu xử lý':'Bắt đầu di chuyển'}</button><button class="btn btn--secondary btn--block" data-moi data-a="kaGo" data-x="KT-URD-13:yeucau|${p.id}" ${d}>Yêu cầu vật tư</button>`;
 else if(p.tt==='Đang di chuyển')b=`<button class="btn btn--secondary btn--block" data-moi data-a="kaGo" data-x="KT-URD-13:yeucau|${p.id}" ${d}>Yêu cầu vật tư</button>`;
 else if(p.tt==='Đang xử lý')b=`<button class="btn btn--primary btn--block" data-moi data-a="kaXuLy" data-x="${p.id}" ${d}>Xử lý xong, mời khách xác nhận</button><div class="ka-ft__row"><button class="btn btn--secondary" data-moi data-a="kaBaoCho" data-x="${p.id}" ${d}>${p.cho?'Hết chờ':'Báo chờ'}</button><button class="btn btn--secondary" data-moi data-a="kaGo" data-x="KT-URD-13:yeucau|${p.id}" ${d}>Yêu cầu vật tư</button></div>`;
 else if(p.tt==='Chờ khách xác nhận')b=tx?`<button class="btn btn--primary btn--block" data-moi ${d}>Ghi nhận khách xác nhận</button>`:`<button class="btn btn--secondary btn--block" data-moi data-a="kaGo" data-x="KT-URD-13:tuchoiky|${p.id}" ${d}>Khách từ chối ký</button>`;
 if(!b)return '';
 return (lk?`<div class="ka-note ka-note--warn">${esc(lk)}</div>`:'')+b}
function kaDetail(p){const dd=p.tt==='Đã điều phối';const sua=kaSua(p);const tx=p.loai==='Hỗ trợ từ xa';
 const head=`<div class="ka-card"><div class="row" style="gap:.375rem">${tag(p.loai,'teal')}${kaTag(p.tt)}${p.cho?tag(p.cho,'warning'):''}${p.lech?moi(tag('Lệch vị trí','danger')):''}</div>
  <div class="ka-card__big">${esc(p.kh)}</div>
  ${p.hen?`<div class="ka-line">${ic('calendar')}<span>Hẹn ${kaHen(p.hen)}${sameDay(p.hen,NOW)?', hôm nay':''}</span></div>`:''}
  ${p.bh==='con'?`<div class="alert alert--success" style="margin-top:.625rem">${ic('ok')}<div class="alert__d"><b>CÒN bảo hành</b>, không thu tiền vật tư</div></div>`:p.bh==='het'?`<div class="alert alert--warning" style="margin-top:.625rem">${ic('alert')}<div class="alert__d"><b>HẾT bảo hành</b>, phải báo giá trước khi sửa</div></div>`:''}</div>`;
 const khach=`<div class="ka-sec"><div class="ka-sec__h">Khách hàng</div><div class="ka-sec__b">${p.sdt||p.dc?`
  ${p.sdt?`<div class="ka-kv"><span>Điện thoại</span><button class="ka-tlink" data-a="kaInfo" data-x="Mở trình gọi điện">${ic('phone')}${esc(p.sdt)}</button></div>`:''}
  ${p.dc?`<div class="ka-kv"><span>Địa chỉ</span><button class="ka-tlink" data-a="kaInfo" data-x="Mở Google Maps chỉ đường">${ic('ka-pin')}${esc(p.dc)}</button></div>`:''}`:'<span class="muted">Phiếu chưa có số điện thoại và địa chỉ</span>'}</div></div>`;
 const nd=`<div class="ka-sec"><div class="ka-sec__h">Nội dung công việc</div><div class="ka-sec__b">${[['Yêu cầu',p.yc],['Máy',p.may],['Serial',p.serial],['Đơn hàng',p.don],['Vận đơn',p.vd]].filter(x=>x[1]).map(([k,v])=>`<div class="ka-kv"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}</div></div>`;
 if(dd)return head+khach+nd;
 const tgOk=sua;
 const tg=tx?'':`<div class="ka-sec"><div class="ka-sec__h">Thời gian làm việc</div><div class="ka-sec__b" style="text-align:center">${p.bd?`<div class="ka-timer">${kaHms(NOW-p.bd)}</div><div class="ka-sub" style="margin-bottom:.625rem">Bắt đầu hôm nay ${fT(p.bd)}</div><button class="btn btn--secondary btn--block" data-a="kaKetThuc" data-x="${p.id}">${ic('ka-clock')}Kết thúc</button>`
  :`<p style="margin:0 0 .625rem;color:var(--text-secondary)">${p.lam?esc(p.lam):'Bấm bắt đầu khi tới nơi để hệ thống ghi nhận thời gian làm thực tế'}</p><button class="btn btn--secondary btn--block" data-a="kaBatDau" data-x="${p.id}" ${tgOk?'':'disabled title="Chỉ bấm giờ khi đang làm phiếu này"'}>${ic('ka-pin')}Bắt đầu làm</button>${tgOk?'':'<div class="hint" style="margin-top:.25rem">Chỉ bấm giờ khi đang làm phiếu này</div>'}`}</div></div>`;
 const tong=p.vt.reduce((s,v)=>s+v[1]*v[2],0);
 const vt=`<div class="ka-sec"><div class="ka-sec__h">Vật tư đã dùng<button class="btn btn--ghost btn--sm" data-a="kaGo" data-x="KT-URD-13:vattu|${p.id}" ${sua?'':'disabled title="Phiếu đã chốt nội dung, không sửa vật tư"'}>${ic('plus')}Thêm</button></div><div class="ka-sec__b">
  ${p.vt.length?p.vt.map(v=>`<div class="ka-vt"><div>${esc(v[0])}<small>${fmt(v[1])} × ${kaMoney(v[2])}</small></div><div class="ka-price">${kaMoney(v[1]*v[2])}</div></div>`).join('')+`<div class="ka-vt ka-vt--sum"><div>Tổng cộng</div><div>${kaMoney(tong)}</div></div>${p.bh==='con'?'<div class="hint">Còn bảo hành, không thu tiền khách</div>':''}`:'<span class="muted">Chưa ghi vật tư nào</span>'}
  ${sua?'':'<div class="hint" style="margin-top:.25rem">Phiếu đã chốt nội dung, không sửa vật tư</div>'}</div></div>`;
 const anh=`<div class="ka-sec"><div class="ka-sec__h">Ảnh hiện trường</div><div class="ka-sec__b">
  ${p.anh.length?`<div class="ka-photos">${p.anh.map(a=>`<div class="ka-ph ${a[1]?'ka-ph--'+a[1]:''}">${ic('ka-img')}<b>${a[0]}</b>${a[2]?'':`<i title="Chưa gửi">${ic('upload')}</i>`}</div>`).join('')}</div>`:'<p class="muted" style="margin:0 0 .625rem">Chưa có ảnh</p>'}
  <div class="ka-row2"><button class="btn btn--secondary" data-a="kaChup" data-x="${p.id}|Trước" ${sua?'':'disabled'}>${ic('ka-cam')}Ảnh trước</button><button class="btn btn--secondary" data-a="kaChup" data-x="${p.id}|Sau" ${sua?'':'disabled'}>${ic('ka-cam')}Ảnh sau</button></div>
  ${sua?'':'<div class="hint" style="margin-top:.25rem">Phiếu đã chốt nội dung, không thêm ảnh</div>'}</div></div>`;
 const ky=p.ky?`<div class="ka-sec"><div class="ka-sec__h">Chữ ký nghiệm thu</div><div class="ka-sec__b"><span class="ka-dev">${ic('ok')}Đã có chữ ký của ${esc(p.ky)}</span></div></div>`
  :(p.tt==='Chờ khách xác nhận'&&!tx?`<div class="ka-sec"><div class="ka-sec__h">Chữ ký nghiệm thu</div><div class="ka-sec__b"><p style="margin:0 0 .625rem;color:var(--text-secondary)">Mời khách ký xác nhận đã nghiệm thu trên máy này</p><button class="btn btn--primary btn--block" data-moi data-a="kaGo" data-x="KT-URD-13:chuky|${p.id}" ${kaLock(p)?'disabled':''}>${ic('ka-sign')}Xin chữ ký khách hàng</button></div></div>`:'');
 return head+tg+ky+vt+anh+khach+nd}
VIEWS['KT-URD-13:phieu']=()=>{const p=KA_P.find(x=>x.id===S.arg);
 if(!p||p.gone)return kaPhone({title:'Phiếu công việc',back:'KT-URD-13',body:`<div class="ka-empty"><span class="ka-empty__ic">${ic('doc')}</span><h4>Phiếu này không còn trong máy</h4><p>Có thể phiếu đã được chuyển cho người khác</p></div>`});

Object.assign(ACT,{
 kaDxl(){S.ka.dxl=!S.ka.dxl;render(true)},
 kaXinDangXuat(){kaOpen('dangxuat')},
 kaNhan(id){kaP(id).tt='KTV đã nhận';render(true);kaToast('Đã ghi nhận: Nhận việc')},
 kaTuChoi(id){kaOpen('tuchoi',id)},
 kaTuChoiOk(id){const ld=kaV('ka-tc-ld'),dg=kaV('ka-tc-dg');
  if(!ld)return kaToast('Cần điền Lý do');if(!dg)return kaToast('Cần điền Diễn giải');if(dg.length<10)return fieldErr('ka-tc-dg','Diễn giải cần tối thiểu 10 ký tự');
  kaP(id).gone=true;kaGoto('KT-URD-13');kaToast('Đã ghi nhận: Từ chối nhận')},

 kaXuLy(id){kaOpen('xuly',id)},
 kaXuLyOk(id){const p=kaP(id);p.tt='Chờ khách xác nhận';p.bd=null;p.lam='Đã làm 1 giờ 13 phút qua 1 lần';S.ka.sheet=null;render(true);kaToast('Đã ghi nhận: Xử lý xong, mời khách xác nhận')},
 kaBaoCho(id){const p=kaP(id);if(p.cho){p.cho='';render(true);return kaToast('Đã ghi nhận: Hết chờ')}kaOpen('baocho',id)},
 kaBaoChoOk(id){kaP(id).cho=kaV('ka-bc-ld');S.ka.sheet=null;render(true);kaToast('Đã ghi nhận: Báo chờ')},
 kaKetThuc(id){kaOpen('ketthuc',id)},
 kaKetThucOk(id){const p=kaP(id);p.bd=null;p.lam='Đã làm 1 giờ 12 phút qua 1 lần';S.ka.sheet=null;render(true);kaToast('Đã kết thúc phiên làm việc')},
 kaBatDau(id){if(id==='00426')return kaOpen('lech',id);ACT.kaBatDauOk(id)},

 kaChup(x){const[id,l]=x.split('|');kaP(id).anh.push([l,l==='Sau'?'c':'b',0]);render(true);kaToast('Đã lưu ảnh, sẽ tự gửi khi có mạng')},
 kaGhiChu(){kaOpen('ghichu')},
 kaGhiChuOk(){S.ka.sheet=null;render(true);kaToast('Đã ghi nhận: Ghi chú')},
 kaPhieuIn(x){S.ka.menu=false;render(true);kaToast(x==='xem'?'Đang tải phiếu in':'Đang mở bảng chia sẻ')}

 if(K.time==='range'){const a=fromIso(K.from)||addD(t,-6),b=fromIso(K.to)||t;return[a,addD(b,1)]}return[addD(t,-6),addD(t,1)]}

 const days=[];for(let d=dayStart(a);d<b&&days.length<31;d=addD(d,1))days.push(d);const people=k16Scope().filter(n=>base.some(p=>p.ktv===n));

 <tr><td><b>Tổng</b></td>${days.map(d=>`<td class="num"><b>${k16HM(people.reduce((s,n)=>s+cell(n,d),0))}</b></td>`).join('')}<td class="num"><b>${k16HM(base.reduce((s,p)=>s+k16Min(p),0))}</b></td><td class="num">${base.filter(p=>p.tt==='quen').length}</td></tr>
