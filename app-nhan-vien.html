const kvThay=x=>S.role==='ktvkd'||(S.role==='nvkd'?x.nhom==='cohoi':x.nhom==='phieu');
function kvQ(){kvSeed();const q=KV_Q.filter(kvThay).sort((a,b)=>a.t-b.t);
 S.dt.sync={cho:q.filter(x=>!x.loi).length,loi:q.filter(x=>x.loi).length,mat:!S.dt.net};return q}
function kvNhan(x){if(x.nhan)return x.nhan;const p=kvP(x.ref)||KV_MOI.find(m=>m.id===x.ref);return p?`${p.loai} ${kvMa(p)}`:'KT/2026/'+x.ref}
/* thanh nút khoá khi phiếu còn việc trong hàng đợi */
function kvLock(nhom,ref){kvSeed();const q=KV_Q.filter(x=>x.nhom===nhom&&x.ref===ref);if(!q.length)return '';
 return q.some(x=>x.loi)?'Xử lý việc lỗi ở màn Đồng bộ trước khi làm tiếp':'Đang chờ gửi việc trước đó lên hệ thống'}
/* xếp một việc, có mạng thì gửi ngay ở nền */
function kvXep(o){kvSeed();KV_Q.push({id:++kvQid,t:new Date(kvNow()),...o});if(S.dt.net)setTimeout(()=>kvChay(true),900)}
/* một lượt đồng bộ: kiểm kết nối, đẩy việc theo thứ tự, kéo thay đổi về */
function kvRe(){if(!S.dt.sheet&&!S.dt.dlg)render(true)}
function kvChay(nen){if(S.kv.chay)return;
 if(!S.dt.net){S.kv.loiLuot='Không có mạng, việc đã làm vẫn được giữ và tự gửi khi có sóng';if(!nen){render(true);dtToast(S.kv.loiLuot)}return}
 S.kv.chay=true;S.kv.loiLuot='';S.kv.buoc='Đang kiểm tra kết nối';kvRe();
 setTimeout(()=>{S.kv.buoc='Đang gửi việc đã làm';kvRe()},450);
 setTimeout(()=>{const chan=new Set(KV_Q.filter(x=>x.loi).map(x=>x.nhom+x.ref));
  [...KV_Q].sort((a,b)=>a.t-b.t).forEach(x=>{const i=KV_Q.indexOf(x);if(!x.loi&&!chan.has(x.nhom+x.ref)){KV_Q.splice(i,1);if(x.ok)x.ok();NV_P.forEach(p=>{if(p.id===x.ref)p.anh.forEach(a=>a[1]=1)})}})
  S.kv.buoc='Đang tải phiếu mới';kvRe()},950);
 setTimeout(()=>{S.kv.chay=false;S.kv.buoc='';S.kv.last=new Date(kvNow());let moi='';
  if(!nen&&KV_MOI.length&&!kvP(KV_MOI[0].id)){NV_P.unshift(KV_MOI[0]);moi='Việc mới: KT/2026/'+KV_MOI[0].id}
  kvRe();if(!nen)dtToast(moi||'Đã đồng bộ')},1450)}

/* ---------- dải trạng thái, icon đồng bộ, menu ba chấm của màn chính ---------- */
function kvStrip(){const q=kvQ(),bad=q.filter(x=>x.loi).length,wait=q.length-bad;
 if(bad)return `<button class="dt-strip dt-strip--danger" data-a="dtGo" data-x="KT-URD-14">${ic('err')}<span>${bad} việc không gửi được, bấm để xem</span>${ic('chev-right')}</button>`;
 if(!S.dt.net||S.kv.loiLuot)return `<button class="dt-strip dt-strip--warning" ${wait?'data-a="dtGo" data-x="KT-URD-14"':''}>${ic('dt-cloud-off')}<span>${esc(S.kv.loiLuot||'Không có mạng, việc đã làm vẫn được giữ và tự gửi khi có sóng')}</span>${wait?ic('chev-right'):''}</button>`;
 if(wait)return `<button class="dt-strip dt-strip--info" data-a="dtGo" data-x="KT-URD-14">${ic('upload')}<span>${wait} việc đang chờ gửi lên hệ thống</span>${ic('chev-right')}</button>`;
 return ''}
function kvSyncIb(){const q=kvQ(),bad=q.some(x=>x.loi);
 return `<button class="dt-ib${S.kv.chay?' kv-spin':''}" data-a="kvDongBo" aria-label="Đồng bộ" ${S.kv.chay?'disabled':''}>${ic('dt-sync')}${q.length?`<span class="dt-ib__b ${bad?'':'is-warn'}">${q.length}</span>`:''}</button>`}
DT_MENU.kvchinh=()=>`<button data-a="dtGo" data-x="KT-URD-14">${ic('dt-cloud')}Trạng thái đồng bộ</button><button class="is-danger" data-a="kvDangXuat">${ic('dt-logout')}Đăng xuất</button>`;
Object.assign(ACT,{
 kvDongBo(){kvChay(false)},
 kvDangXuat(){S.dt.menu=null;if(typeof ACT.nvDangXuat==='function')return ACT.nvDangXuat();dtGoto('nv:tk')}
});

/* giữ thông báo ngắn khi màn vẽ lại ở nền (lượt đồng bộ tự chạy) */
const _kvRender=render;
render=function(k){const t=document.querySelector('#dt-phone .dt-toast'),m=t&&t.textContent;_kvRender(k);
 if(m&&!document.querySelector('#dt-phone .dt-toast')){const p=document.getElementById('dt-phone');if(p){const e=document.createElement('div');e.className='dt-toast';e.setAttribute('role','status');e.textContent=m;p.appendChild(e);setTimeout(()=>e.remove(),1600)}}};
/* đồng hồ phiên làm việc chạy từng giây */
setInterval(()=>{if(document.body.dataset.shot)return;document.querySelectorAll('[data-kv-bd]').forEach(e=>{e.textContent=kvHms(kvNow()-Number(e.dataset.kvBd))})},1000);

/* KT-URD-13 [App] Phiếu của tôi: danh sách (MH1, MH2), chi tiết theo trạng thái (MH3, MH4), từ chối nhận (MH5),
   nhập thông tin khi đổi trạng thái (MH6), kết thúc phiên (MH7), lệch vị trí (MH8). Bám src/KT-URD-13.py */
const KV_LOAI=['Bảo hành','Sửa chữa','Bảo trì','Lắp đặt','Đào tạo khách hàng','Khảo sát','Hỗ trợ từ xa'];
const KV_THU=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const kvNgay=d=>{if(!d)return 'Chưa hẹn giờ';const n=diffDay(d,NOW);const s=`${pad(d.getDate())}/${pad(d.getMonth()+1)}`;return n===0?'Hôm nay, '+s:n===1?'Ngày mai, '+s:n===-1?'Hôm qua, '+s:KV_THU[d.getDay()]+', '+s};

/* ---------- MH1, MH2 Danh sách phiếu của tôi ---------- */
function kvCard(p){const tre=p.hen&&p.hen<NOW&&['Đã điều phối','KTV đã nhận','Đang di chuyển'].includes(p.tt);
 const t=p.hen?`<span class="nv-tk__time${tre?' is-late':''}"><b>${fT(p.hen)}</b><small>${tre?'Trễ hẹn':sameDay(p.hen,NOW)?'Hôm nay':pad(p.hen.getDate())+'/'+pad(p.hen.getMonth()+1)}</small></span>`
  :`<span class="nv-tk__time is-none"><b>--:--</b><small>Chưa hẹn</small></span>`;
 const lk=kvLock('phieu',p.id);
 return `<button class="nv-tk" data-a="dtGo" data-x="KT-URD-13:phieu|${p.id}">${t}<span class="nv-tk__b">
 <span class="nv-tk__kh">${esc(p.kh||'(chưa có tên khách)')}</span><span class="nv-tk__so">${kvMa(p)} · ${esc(p.loai)}</span>
 ${p.dc?`<span class="dt-line kv-2l">${ic('dt-pin')}<span>${esc(p.dc)}</span></span>`:''}
 <span class="nv-tk__tags">${kvTag(p.tt)}${p.bh==='con'?dtPill('Còn bảo hành','ok'):p.bh==='het'?dtPill('Hết bảo hành','bad'):''}${lk?`<span data-moi>${dtPill(lk.startsWith('Xử lý')?'Việc lỗi':'Chờ gửi',lk.startsWith('Xử lý')?'bad':'warn')}</span>`:''}</span>
 ${p.may?`<span class="dt-line" data-moi>${ic('dt-tool')}<span>${esc(p.may)}</span></span>`:''}</span></button>`}
VIEWS['KT-URD-13']=()=>{const K=S.kv;const all=K.rong?[]:NV_P;
 const loais=KV_LOAI.filter(l=>all.some(p=>p.loai===l));
 const rows=all.filter(p=>(!K.q||has(kvMa(p)+' '+p.kh+' '+p.dc,K.q))&&(!K.loai||p.loai===K.loai)&&(!K.dxl||!kvXong(p)))
  .sort((a,b)=>(a.hen?0:1)-(b.hen?0:1)||(a.hen&&b.hen?a.hen-b.hen:0)||b.id.localeCompare(a.id));
 let list='',day=null;
 rows.forEach(p=>{const g=kvNgay(p.hen);if(g!==day){day=g;list+=`<h3 class="nv-day" data-moi>${g}</h3>`}list+=kvCard(p)});
 const empty=K.q&&all.length?dtEmpty(IL.search(),'Không có kết quả tìm kiếm phù hợp','Tìm theo từ khác hoặc bỏ bớt bộ lọc')
  :dtEmpty(IL.empty(),'Chưa có phiếu nào','Kéo xuống để đồng bộ với hệ thống',`<button class="btn btn--secondary dt-btn kv-y" data-moi data-a="kvDongBo">${ic('dt-sync')}Đồng bộ ngay</button>`);
 return dtPhone({title:'Phiếu của tôi',acts:kvSyncIb()+dtIb('more','dtMenu','kvchinh','Thêm'),strip:kvStrip(),nav:'KT-URD-13',
  body:`<div class="dt-search">${ic('search')}<input class="dt-in" id="kv-q" data-f="kv.q" value="${esc(K.q)}" placeholder="Tìm số phiếu, khách hàng, địa chỉ" autocomplete="off">${K.q?`<button class="kv-clr" data-a="kvXoaQ" aria-label="Xoá chữ đã gõ">${ic('x')}</button>`:''}</div>
  <div class="dt-chips kv-chips" role="group" aria-label="Lọc phiếu"><button class="dt-chip" data-a="kvDxl" aria-pressed="${K.dxl}">${K.dxl?ic('check'):''}Đang xử lý</button><button class="dt-chip" data-a="setF" data-k="kv.loai" data-v="" aria-pressed="${!K.loai}">Tất cả</button><span class="kv-chips__l" data-moi>${loais.map(l=>`<button class="dt-chip" data-a="setF" data-k="kv.loai" data-v="${l}" aria-pressed="${K.loai===l}">${l}</button>`).join('')}</span></div>
  ${rows.length?list+'<div class="kv-fabgap"></div>':empty}
  <button class="nv-fab" data-a="dtGo" data-x="KT-URD-13:lapphieu">${ic('plus')}Phiếu bảo hành</button>`})};
Object.assign(ACT,{kvDxl(){S.kv.dxl=!S.kv.dxl;render(true)},kvXoaQ(){S.kv.q='';render(true)}});

/* ---------- MH3, MH4 Chi tiết phiếu ---------- */
function kvFoot(p){const lk=kvLock('phieu',p.id),d=lk?'disabled':'',tx=p.loai==='Hỗ trợ từ xa';let b='';
 if(p.tt==='Đã điều phối')b=`<button class="btn btn--primary dt-btn kv-y" data-moi data-a="kvNhan" data-x="${p.id}" ${d}>Nhận việc</button><button class="btn btn--secondary dt-btn kv-y" data-moi data-a="kvTuChoi" data-x="${p.id}" ${d}>Từ chối nhận</button>`;
 else if(p.tt==='KTV đã nhận')b=`<button class="btn btn--primary dt-btn kv-y" data-moi data-a="kvDiChuyen" data-x="${p.id}" ${d}>${ic('dt-car')}${tx?'Bắt đầu xử lý':'Bắt đầu di chuyển'}</button><button class="btn btn--secondary dt-btn kv-y" data-moi data-a="dtGo" data-x="KT-URD-13:yeucau|${p.id}" ${d}>Yêu cầu vật tư</button>`;
 else if(p.tt==='Đang di chuyển')b=`<button class="btn btn--secondary dt-btn kv-y" data-moi data-a="dtGo" data-x="KT-URD-13:yeucau|${p.id}" ${d}>Yêu cầu vật tư</button>`;
 else if(p.tt==='Đang xử lý')b=`<button class="btn btn--primary dt-btn kv-y" data-moi data-a="kvXuLy" data-x="${p.id}" ${d}>Xử lý xong, mời khách xác nhận</button><div class="dt-ft__row"><button class="btn btn--secondary kv-y" data-moi data-a="kvBaoCho" data-x="${p.id}" ${d}>${p.cho?'Hết chờ':'Báo chờ'}</button><button class="btn btn--secondary kv-y" data-moi data-a="dtGo" data-x="KT-URD-13:yeucau|${p.id}" ${d}>Yêu cầu vật tư</button></div>`;
 else if(p.tt==='Chờ khách xác nhận')b=tx?`<button class="btn btn--primary dt-btn kv-y" data-moi data-a="kvDaXacNhan" data-x="${p.id}" ${d}>Ghi nhận khách xác nhận</button>`:`<button class="btn btn--secondary dt-btn kv-y" data-moi data-a="dtGo" data-x="KT-URD-13:tuchoiky|${p.id}" ${d}>Khách từ chối ký</button>`;
 if(!b)return '';
 return (lk?`<div class="dt-ft__hint dt-ft__hint--warn" role="status">${esc(lk)}</div>`:'')+b}
function kvDetail(p){const sua=kvSua(p),tx=p.loai==='Hỗ trợ từ xa',lk=kvLock('phieu',p.id);
 const head=`<div class="nv-head"><div class="nv-head__tags">${dtPill(esc(p.loai),'ac')}${kvTag(p.tt)}${p.cho?dtPill(esc(p.cho),'warn'):''}${p.tck?dtPill('Từ chối ký','bad'):''}${p.lechCo?`<span data-moi>${dtPill('Lệch vị trí','bad')}</span>`:''}</div>
  <h2>${esc(p.kh||'(chưa có tên khách)')}</h2>
  ${p.hen?`<div class="dt-line">${ic('calendar')}<span>Hẹn ${kvHen(p.hen)}${sameDay(p.hen,NOW)?', hôm nay':''}</span></div>`:''}
  ${p.bh==='con'?`<div class="dt-alert dt-alert--ok">${ic('ok')}<span><b>CÒN bảo hành</b>, không thu tiền vật tư</span></div>`:p.bh==='het'?`<div class="dt-alert dt-alert--warn">${ic('alert')}<span><b>HẾT bảo hành</b>, phải báo giá trước khi sửa</span></div>`:''}</div>`;
 const khach=dtSec('Khách hàng',p.sdt||p.dc?`${p.sdt?dtRow('Điện thoại',`<button class="kv-tl" data-a="dtInfo" data-x="Mở trình gọi điện">${ic('phone')}${esc(p.sdt)}</button>`):''}${p.dc?dtRow('Địa chỉ',`<button class="kv-tl" data-a="dtInfo" data-x="Mở Google Maps chỉ đường">${ic('dt-pin')}${esc(p.dc)}</button>`):''}`
  :'<p class="dt-p">Phiếu chưa có số điện thoại và địa chỉ</p>');
 const nd=dtSec('Nội dung công việc',[['Yêu cầu',p.yc],['Máy',p.may],['Serial',p.serial],['Đơn hàng',p.don],['Vận đơn',p.vd],['Ghi chú',p.gc]].filter(x=>x[1]).map(([k,v])=>dtRow(k,esc(v))).join(''));
 if(p.tt==='Đã điều phối'||p.tt==='Mới')return head+khach+nd;
 const tgOk=sua;const live=p.bd&&!tx;
 const tg=tx||p.tam?'':dtSec('Thời gian làm việc',live?`<div class="nv-timer"><b data-kv-bd="${p.bd.getTime()}">${kvHms(kvNow()-p.bd)}</b><small>Bắt đầu hôm nay ${fT(p.bd)}</small></div>
  <button class="btn btn--secondary dt-btn" data-a="kvKetThuc" data-x="${p.id}">${ic('dt-clock')}Kết thúc</button>`
  :`<p class="dt-p kv-mb">${p.lam?esc(p.lam):'Bấm bắt đầu khi tới nơi để hệ thống ghi nhận thời gian làm thực tế'}</p>
  <button class="btn ${p.tt==='Đang di chuyển'&&!lk?'btn--primary':'btn--secondary'} dt-btn" data-a="kvBatDau" data-x="${p.id}" ${tgOk&&!lk?'':'disabled'}>${ic('dt-pin')}Bắt đầu làm</button>${tgOk?'':'<div class="dt-field__h kv-mt" data-moi>Chỉ bấm giờ khi đang làm phiếu này</div>'}`);
 const tong=p.vt.reduce((s,v)=>s+v[1]*v[2],0),bh=p.bh==='con';
 const vt=dtSec('Vật tư đã dùng',`${p.vt.length?p.vt.map((v,i)=>`<button class="nv-vt kv-vt" data-a="kvVtSua" data-x="${p.id}|${i}" ${sua?'':'disabled'}><span>${esc(v[0])}<small>${fmt(v[1])} × ${dtMoney(v[2])}</small></span>${bh?`<b data-moi>0 đ</b>`:`<b>${dtMoney(v[1]*v[2])}</b>`}</button>`).join('')
   +(bh?`<div class="nv-vt nv-vt--sum" data-moi><span>Khách trả</span><b>0 đ</b></div><div class="dt-field__h">Còn bảo hành, không thu tiền khách, giá theo danh mục ${dtMoney(tong)}</div>`
   :`<div class="nv-vt nv-vt--sum"><span>Tổng cộng</span><b>${dtMoney(tong)}</b></div>`):'<p class="dt-p">Chưa ghi vật tư nào</p>'}
  ${sua?'':'<div class="dt-field__h kv-mt" data-moi>Phiếu đã chốt nội dung, không sửa vật tư</div>'}`,
  `<button class="btn btn--ghost btn--sm" data-a="kvVtThem" data-x="${p.id}" ${sua?'':'disabled'}>${ic('plus')}Thêm</button>`);
 const anh=dtSec('Ảnh hiện trường',`${p.anh.length?`<div class="nv-photos">${p.anh.map((a,i)=>`<button class="nv-ph kv-ph kv-ph--${i%3}" data-a="dtInfo" data-x="${a[1]?'Đã gửi lên hệ thống':'Chưa gửi'}" aria-label="Ảnh ${a[0]}">${ic('dt-img')}<span>${a[0]}</span>${a[1]?'':`<i title="Chưa gửi">${ic('upload')}</i>`}</button>`).join('')}</div>`:'<p class="dt-p kv-mb">Chưa có ảnh</p>'}
  <div class="nv-act"><button class="btn btn--secondary" data-a="kvChup" data-x="${p.id}|Trước" ${sua?'':'disabled'}>${ic('dt-cam')}Ảnh trước</button><button class="btn btn--secondary" data-a="kvChup" data-x="${p.id}|Sau" ${sua?'':'disabled'}>${ic('dt-cam')}Ảnh sau</button></div>
  ${sua?'':'<div class="dt-field__h kv-mt" data-moi>Phiếu đã chốt nội dung, không thêm ảnh</div>'}`);
 const ky=p.ky?dtSec('Chữ ký nghiệm thu',`<div class="kv-ok">${ic('dt-check-c')}<span>Đã có chữ ký của ${esc(p.ky)}</span></div>`)
  :(p.tt==='Chờ khách xác nhận'&&!tx?dtSec('Chữ ký nghiệm thu',`<p class="dt-p kv-mb">Mời khách ký xác nhận đã nghiệm thu trên máy này</p><button class="btn btn--primary dt-btn kv-y" data-moi data-a="dtGo" data-x="KT-URD-13:chuky|${p.id}" ${lk?'disabled':''}>${ic('dt-sign')}Xin chữ ký khách hàng</button>`):'');
 const duyet=/Chờ duyệt/.test(p.tt)?`<div class="dt-alert dt-alert--plain kv-mb12" data-moi>${ic('info')}<span>Phiếu đang chờ Trưởng nhóm kỹ thuật duyệt trên web, app không còn thao tác đổi trạng thái</span></div>`:'';
 return head+duyet+ky+tg+vt+anh+khach+nd}
VIEWS['KT-URD-13:phieu']=()=>{const p=kvP(S.arg);
 if(!p)return dtPhone({title:'Phiếu công việc',back:'KT-URD-13',body:dtEmpty(IL.doc(),'Phiếu này không còn trong máy','Có thể phiếu đã được chuyển cho người khác',`<button class="btn btn--primary dt-btn" data-a="dtGo" data-x="KT-URD-13">Về danh sách phiếu</button>`)});
 return dtPhone({title:kvMa(p),sub:p.tam?'':esc(p.loai),back:'KT-URD-13',strip:kvStrip(),
  acts:dtIb('dt-chat','kvGhiChu',p.id,'Ghi chú vào phiếu')+dtIb('more','dtMenu','kvphieu','Thêm'),
  body:kvDetail(p),foot:kvFoot(p)})};
DT_MENU.kvphieu=()=>{const id=S.arg;return `<button data-a="kvPhieuIn" data-x="xem">${ic('doc')}Xem phiếu in</button><button data-a="kvPhieuIn" data-x="gui">${ic('dt-send')}Gửi phiếu cho khách</button><button data-a="dtGo" data-x="KT-URD-13:lapphieu|${id}">${ic('plus')}<span>Lập phiếu bảo hành mới cho máy khác của khách này</span></button><button data-moi data-a="dtGo" data-x="KT-URD-13:tra">${ic('dt-scan')}Tra máy theo serial</button>`};

/* ---------- MH5 Từ chối nhận việc ---------- */
DT_SHEET.kvtuchoi=id=>{const t=S.kv.tc;return {t:'Từ chối nhận việc',s:'KT/2026/'+id,b:`<div class="dt-form" data-moi>
 ${dtField('kv-tc-ld','Lý do',dtSel('kv-tc-ld',KV_LD_TC,t.ld,'Chọn lý do'),{req:1})}
 ${dtField('kv-tc-dg','Diễn giải',dtTa('kv-tc-dg',{v:t.dg,max:500,ph:'Tối thiểu 10 ký tự'}),{req:1})}
 <div class="dt-alert dt-alert--warn">${ic('alert')}<span>Phiếu sẽ quay về Mới để Điều phối kỹ thuật giao người khác</span></div></div>`,

/* ---------- MH6 Nhập thông tin khi đổi trạng thái: Xử lý xong, mời khách xác nhận ---------- */

/* thứ tự: Quá hạn SLA, Quá hẹn, Sắp quá hạn SLA, Gọi nhỡ và Đến hẹn, hẹn sớm nhất, Chưa gọi, còn lại */
function kdRank(c){const k=kdMuc(c);return c.sla==='qua'?0:k==='quahen'?1:c.sla==='sap'?2:(k==='nho'||k==='denhen')?3:c.hen?4:k==='chuagoi'?5:6}
function kdSort(a,b){return kdRank(a)-kdRank(b)||((a.hen||9e15)-(b.hen||9e15))}
/* thao tác: có mạng thì ghi luôn, mất mạng thì vào hàng đợi trên máy */
function kdDo(c,op,ok){c.tt=new Date(NOW);if(!S.dt.net){if(kdShared())kvXep({nhom:'cohoi',ref:c.id,nhan:'Cơ hội '+c.id,ten:op});else S.kd.jobs.push({k:'J'+Date.now(),id:c.id,op,t:fT(NOW)});dtToast('Đã lưu trên máy, gửi khi có mạng');return}if(ok)dtToast(ok)}

/* màn Đồng bộ dùng chung của app (KT-URD-14, 23_ktv_dongbo.js), chưa có thì dùng màn riêng CRM-URD-15:dongbo */
const KD_DB=VIEWS['KT-URD-14']?'KT-URD-14':'CRM-URD-15:dongbo';

/* ---------- MH1, MH10 Danh sách cơ hội ---------- */
function kdCard(c){const j=kdJob(c);
 return `<div class="nv-opp kd-opp"><button class="nv-opp__b" data-a="dtGo" data-x="CRM-URD-15:ct|${c.id}">
  <div class="nv-opp__n">${esc(c.ten)}</div><div class="nv-opp__p">${c.sdt?esc(c.sdt):'Chưa có số điện thoại'} · ${esc(c.gd)}</div>
  <div class="kd-opp__m">${ic('dt-clock')}<span>${j?esc((j.err?'Lỗi: ':'Chờ gửi: ')+j.op):`${esc(kdHen(c))} · ${c.calls.length?c.calls.length+' cuộc gọi':'Chưa gọi lần nào'}`}</span></div>
  ${kdTags(c)?`<div class="kd-opp__tags">${kdTags(c)}</div>`:''}</button>
  ${c.sdt&&kdOpen(c)&&!c.dong?`<button class="nv-call" data-moi data-a="kdGoi" data-x="${c.id}" aria-label="Gọi ${esc(c.kh)}">${ic('phone')}</button>`:''}</div>`}
VIEWS['CRM-URD-15']=()=>{const K=S.kd,all=KD_CH.filter(kdOpen).sort(kdSort),due=all.filter(kdDue);
 const src=K.tab==='hen'?due:all,ds=K.q?src.filter(c=>has(c.ten+' '+c.sdt.replace(/\s/g,'')+' '+c.sdt,K.q)):src;
 const J=kdJobs(),err=J.find(j=>j.err),wait=J.filter(j=>!j.err).length;
 /* một dải theo thứ tự ưu tiên: việc lỗi, mất kết nối, chờ gửi, cơ hội thu hồi */
 const strip=err?`<button class="dt-strip dt-strip--danger" data-a="dtGo" data-x="${KD_DB}">${ic('err')}<span>Xử lý việc lỗi ở màn Đồng bộ trước khi làm tiếp</span>${ic('chev-right')}</button>`
  :!S.dt.net?`<div class="dt-strip dt-strip--warning kd-strip" data-moi>${ic('dt-cloud-off')}<span>Mất kết nối. Thao tác được lưu trên máy và gửi khi có mạng</span></div>`
  :wait?`<button class="dt-strip dt-strip--info" data-a="dtGo" data-x="${KD_DB}">${ic('dt-sync')}<span>Đang chờ gửi việc trước đó lên hệ thống…</span>${ic('chev-right')}</button>`
  :K.thuHoi?`<div class="dt-strip dt-strip--info kd-strip" data-moi>${ic('info')}<span>${K.thuHoi} cơ hội đã chuyển khỏi máy của bạn</span></div>`:'';
 const empty=K.q?dtEmpty(IL.search(),'Không tìm thấy cơ hội',`Không có cơ hội nào khớp "${esc(K.q)}"`)
  :K.tab==='hen'?dtEmpty(IL.empty(),'Không có cơ hội nào đến hẹn','Chuyển sang "Tất cả" để xem hết',`<button class="btn btn--secondary dt-btn" data-a="kdTab" data-x="tat">Xem tất cả</button>`)
  :dtEmpty(IL.cloudOk(),'Chưa có cơ hội nào','Kéo xuống để đồng bộ');
 return dtPhone({title:'Cơ hội',acts:dtIb('refresh','kdSync','','Đồng bộ',dtBadge(J.length,err?'':'is-warn')),strip,
  body:`<div class="dt-tabs kd-tabs" role="tablist"><button role="tab" aria-selected="${K.tab==='hen'}" data-a="kdTab" data-x="hen">Đến hẹn (${due.length})</button><button role="tab" aria-selected="${K.tab==='tat'}" data-a="kdTab" data-x="tat">Tất cả (${all.length})</button></div>
  <div class="kd-list"><div class="dt-search kd-q">${ic('search')}${dtIn('kd-q',{f:'kd.q',v:K.q,ph:'Tìm tên khách, số điện thoại…',max:100})}</div>
  ${ds.length?ds.map(kdCard).join(''):empty}</div>`,flush:1,nav:'CRM-URD-15'})};

/* ---------- MH2 Chi tiết cơ hội ---------- */
const kdHenDong=c=>{if(!c.hen)return '--';const k=kdMuc(c);return kdDM(c.hen)+(k==='quahen'||k==='denhen'?' · '+kdHen(c).replace(/ \d\d:\d\d hôm nay$/,''):'')};
const kdSlaT=c=>c.sla==='da'?'Đã chăm sóc trong hạn':!c.han?'--':`${kdDM(c.han)} · ${{trong:'Trong hạn',sap:'Sắp quá hạn',qua:'Quá hạn SLA'}[c.sla]||''}`;
VIEWS['CRM-URD-15:ct']=()=>{const c=kdCur();
 if(!c||c.mat)return dtPhone({title:'Cơ hội',back:'CRM-URD-15',body:dtEmpty(IL.search(),'Không còn cơ hội này','Cơ hội này không còn trong máy. Có thể đã được chuyển cho người khác hoặc đã đóng',
  `<button class="btn btn--primary dt-btn" data-a="dtGo" data-x="CRM-URD-15">Về danh sách cơ hội</button>`)});
 if(c.dong&&!c.dong.cho)return dtPhone({title:'Cơ hội',back:'CRM-URD-15',body:`<div data-moi>${dtEmpty(IL.cloudOk(),'Cơ hội đã đóng','Cơ hội không còn trong danh sách đang chăm của bạn. Mở lại trên web nếu cần',
  `<button class="btn btn--primary dt-btn" data-a="dtGo" data-x="CRM-URD-15">Về danh sách cơ hội</button>`)}</div>`});
 const j=kdJob(c),mo=!c.dong;
 const head=`<div class="nv-head"><div class="nv-head__tags">${dtPill(esc(c.gd),'ac')}${mo?kdTags(c):dtPill('Chờ gửi','warn')}</div>
  <h2>${esc(c.ten)}</h2><div class="kd-sub">${c.id} · Nguồn ${esc(c.nguon)}</div>
  ${j?`<div class="dt-alert dt-alert--warn">${ic('dt-cloud-off')}<span>${j.err?'Không gửi được':'Chờ gửi'}: ${esc(j.op)}</span></div>`:''}
  ${c.dong?`<div class="dt-alert dt-alert--plain" data-moi>${ic('info')}<span>Đóng lúc ${esc(c.dong.t)}. Lý do: ${esc(c.dong.ly)}. Cơ hội rời máy khi gửi xong</span></div>`:''}</div>`;
 const info=dtSec('Thông tin',`<div class="kd-info">${dtRow('Ngày hẹn tiếp theo',esc(kdHenDong(c)))}<div data-moi>${dtRow('Hạn giữ lead',esc(kdSlaT(c)))}</div>${dtRow('Khách ghi chú',c.ghichu?esc(c.ghichu):'--')}${dtRow('Địa chỉ',c.dc?esc(c.dc):'--')}${dtRow('Email',c.email?esc(c.email):'--')}${dtRow('Facebook',c.fb?esc(c.fb):'--')}</div>`);
 const acts=mo?`<div class="dt-group kd-acts">${dtLi({ic:'dt-flag',t:'Chuyển trạng thái',s:'Đang ở '+esc(c.gd),a:'kdSheet',x:'kdGd'})}${dtLi({ic:'dt-clock',t:'Đặt hẹn gọi lại',s:esc(kdHen(c)),a:'kdSheet',x:'kdHen'})}${dtLi({ic:'x',t:'Đóng cơ hội',a:'kdSheet',x:'kdDong',danger:1})}</div>`:'';
 const notes=dtSec('Ghi chú chăm sóc',c.notes.length?c.notes.slice(0,10).map(n=>`<div class="nv-note">${esc(n[2])}<small>${esc(kdWho(n[0]))} · ${n[1]}</small></div>`).join(''):'<p class="dt-muted">Chưa có ghi chú nào</p>',
  mo?`<button class="btn btn--ghost btn--sm" data-a="kdSheet" data-x="kdGc">${ic('plus')}Thêm</button>`:'');
 const calls=dtSec(`Lịch sử cuộc gọi (${c.calls.length})`,c.calls.length?c.calls.slice(0,20).map(k=>`<div class="kd-call"><span class="kd-call__ic${KD_KQ_NOI.includes(k[1])?'':' is-miss'}">${ic('phone')}</span><span class="kd-call__t"><span data-moi>${esc(k[1])}</span><small>${k[0]}${k[2]?' · '+kdSec(k[2]):''}</small></span>${k[3]==='Tự khai'?`<span data-moi>${dtPill('Tự khai trên app')}</span>`:dtPill('Tổng đài','info')}</div>`).join(''):'<p class="dt-muted">Chưa gọi lần nào</p>');
 const foot=!mo?`<button class="btn btn--primary dt-btn" disabled title="Cơ hội đang chờ gửi thao tác đóng">${ic('phone')}Gọi</button><div class="dt-ft__hint" data-moi>Cơ hội đang chờ gửi thao tác đóng</div>`
  :c.sdt?`<button class="btn btn--primary dt-btn" data-a="kdGoi" data-x="${c.id}">${ic('phone')}Gọi ${esc(c.sdt)}</button>`
  :`<button class="btn btn--primary dt-btn" disabled title="Cơ hội chưa có thông tin liên hệ">${ic('phone')}Gọi</button><div class="dt-ft__hint">Cơ hội chưa có thông tin liên hệ</div>`;
 return dtPhone({title:'Cơ hội',sub:c.id,back:'CRM-URD-15',body:head+acts+info+notes+calls,foot})};

/* ---------- bottom sheet MH4 đến MH9 ---------- */
const kdTa=(id,ph,v,max=2000)=>dtTa(id,{ph,v,max,rows:4});
const kdBtns=(a,l,req,cancel='Huỷ',hint='')=>`<button class="btn btn--primary dt-btn" data-a="${a}"${req?` data-req="${req}"`:''}>${l}</button>${hint?`<div class="dt-ft__hint kd-why">${hint}</div>`:''}<button class="btn btn--secondary dt-btn" data-a="dtClose">${cancel}</button>`;
const kdDT=(id,v,err)=>`<input class="dt-in" type="datetime-local" id="${id}" min="${kdIsoDT(NOW)}" value="${esc(v||'')}" ${err?'aria-invalid="true"':''}>`;
const kdIsoDT=d=>`${iso(d)}T${fT(d)}`;
const kdRadio=(name,list,cur)=>`<div class="dt-opts" role="radiogroup" aria-label="Kết quả cuộc gọi">${list.map(k=>dtOpt('radio',name,k,k,'',k===cur)).join('')}</div>`;
const kdRv=name=>(document.querySelector(`input[name="${name}"]:checked`)||{}).value||'';
/* phần chung của MH4, MH5: Kết quả cuộc gọi, Ghi chú, Trạng thái mới, Ngày hẹn tiếp theo */
function kdKqBody(x,c,extra=''){const e=x.err||{};
 return `<div class="dt-form"><div class="dt-field" data-moi><span class="dt-field__l">Kết quả cuộc gọi<span class="dt-req" aria-hidden="true">*</span></span>${kdRadio('kd-kq',KD_KQ,x.kq)}</div>
 ${extra}
 ${dtField('kd-nd','Ghi chú',kdTa('kd-nd','Khách nói gì, cần làm gì tiếp…',x.nd||''))}
 ${dtField('kd-kgd','Trạng thái mới',dtSel('kd-kgd',[['','Giữ nguyên: '+c.gd],...KD_CHON.filter(g=>g!==c.gd)],x.gd||''),{moi:1,hint:'Muốn đóng thì chọn Đóng cơ hội trên chi tiết'})}
 ${dtField('kd-khen','Ngày hẹn tiếp theo',kdDT('kd-khen',x.hen,e.hen),{moi:1,err:e.hen,hint:'Bắt buộc khi khách hẹn gọi lại hoặc trạng thái mới cần hẹn'})}</div>`}
/* đọc lại sheet để giữ giá trị khi báo lỗi */
const kdKqRead=()=>({kq:kdRv('kd-kq'),nd:dtV('kd-nd'),gd:dtV('kd-kgd'),hen:dtV('kd-khen'),sec:dtV('kd-tl')});
/* kiểm Ngày hẹn tiếp theo: bắt buộc theo kết quả và trạng thái mới (CRM-URD-19 BR_08), không trước hiện tại */
function kdHenLoi(v,gd,kq){if(v&&new Date(v)<NOW)return 'Thời điểm hẹn không được trước hiện tại';
 if(!v&&kq==='Khách hẹn gọi lại')return 'Khách hẹn gọi lại cần chọn Ngày hẹn tiếp theo';
 if(!v&&gd&&KD_BBH.includes(gd))return `Trạng thái "${gd}" yêu cầu phải có Ngày hẹn tiếp theo`;return ''}
/* ghi kết quả vào cơ hội: ghi chú, trạng thái, hẹn (tạo việc Gọi lại theo hẹn như web) */
function kdApplyKq(c,v){if(v.nd)c.notes.unshift([KD_ME,kdNowS(),v.nd]);if(v.gd)c.gd=v.gd;if(v.hen){c.hen=new Date(v.hen)}c.nho=null}
/* MH4 sau khi gọi bằng ứng dụng gọi điện của máy: tự khai */
DT_SHEET.kdKq=x=>{x=x||{};const c=kdCur();if(!x.kq)x.kq='Đã trao đổi';return {t:'Cuộc gọi vừa rồi thế nào?',s:esc(c.kh)+' · '+esc(c.sdt)+' · Gọi bằng ứng dụng của máy',
 b:kdKqBody(x,c,dtField('kd-tl','Thời lượng (giây)',dtIn('kd-tl',{v:String(x.sec!=null?x.sec:95),mode:'numeric',max:5}),{hint:moi('Máy tự đo, sửa lại nếu chưa đúng. Không nghe máy, Khách tắt máy, Sai số thì lưu 0')})),
 f:kdBtns('kdLuuKq','Lưu nhật ký','','Bỏ qua lần này')}};
/* MH5 sau cuộc gọi qua tổng đài: hỏi kết quả như web */
DT_SHEET.kdGctd=x=>{x=x||{};const c=kdCur();if(!x.kq)x.kq=x.talk===false?'Không nghe máy':'Đã trao đổi';
 return {t:'Cuộc gọi vừa rồi thế nào?',s:x.talk===false?'Không có người nghe, tổng đài đã ghi lại':'Thời lượng và ghi âm tổng đài đã lưu rồi',
 b:kdKqBody(x,c),f:kdBtns('kdLuuTd','Lưu kết quả','','Bỏ qua lần này')}};
/* MH6 Chuyển trạng thái */
DT_SHEET.kdGd=x=>{x=x||{};const c=kdCur(),e=x.err||{};return {t:'Chuyển trạng thái',s:'Đang ở '+esc(c.gd),
 b:`<div class="dt-form">${dtField('kd-gd','Trạng thái mới',dtSel('kd-gd',KD_CHON.filter(g=>g!==c.gd),x.gd||'','Chọn trạng thái'),{req:1,hint:moi('Không gồm trạng thái đóng và trạng thái do đơn hàng đặt. Muốn đóng thì chọn Đóng cơ hội')})}
 ${dtField('kd-gdh','Ngày hẹn tiếp theo',kdDT('kd-gdh',x.hen,e.hen),{moi:1,err:e.hen,hint:'Bắt buộc với Tiềm năng 1, 2, 3 và Tham khảo thêm'})}
 ${dtField('kd-gdn','Ghi chú chăm sóc',kdTa('kd-gdn','Khách nói gì, cần làm gì tiếp…',x.nd||''))}</div>`,
 f:kdBtns('kdGdOk','Xác nhận','kd-gd:1','Huỷ','Trạng thái mới không được để trống')}};
/* MH7 */
const KD_NHANH=[['Sáng mai 9:00',mkD(4,11,2026,9,0)],['Chiều mai 14:00',mkD(4,11,2026,14,0)],['Thứ Sáu 9:00',mkD(6,11,2026,9,0)]];
DT_SHEET.kdHen=x=>{x=x||{};return {t:'Đặt hẹn gọi lại',s:esc(kdCur().kh),
 b:`<div class="dt-form"><div class="dt-field"><span class="dt-field__l">Chọn nhanh</span><div class="kd-chips" data-moi>${KD_NHANH.map(([l,d])=>`<button class="dt-chip" data-a="kdHenNhanh" data-x="${kdIsoDT(d)}">${l}</button>`).join('')}</div></div>
 ${dtField('kd-hl','Ngày hẹn tiếp theo',`<input class="dt-in" type="datetime-local" id="kd-hl" min="${kdIsoDT(NOW)}" value="${x.v||(x.pre?'2026-11-05T09:00':'')}" ${x.err?'aria-invalid="true"':''}>`,{req:1,err:x.err,hint:moi('Tới giờ hẹn bạn nhận thông báo, cơ hội vào tab Đến hẹn')})}
 ${dtField('kd-hn','Ghi chú',kdTa('kd-hn','Khách nói gì, cần làm gì tiếp…',x.pre?'Gọi lại sau khi khách họp với xưởng':(x.n||'')))}</div>`,
 f:kdBtns('kdHenOk','Xác nhận','kd-hl:1','Huỷ','Cần chọn thời điểm hẹn gọi lại')}};
/* MH8 Đóng cơ hội: lý do theo nhóm, nhóm quyết định trạng thái khi đóng */
const kdLySel=cur=>`<div class="dt-sel"><select class="dt-in" id="kd-ly"><option value="">Chọn lý do</option>${KD_NHOM.map(([n,gd])=>`<optgroup label="${esc(n)} · sang ${esc(gd)}">${KD_LYDO.filter(l=>l[1]===n).map(([l])=>`<option value="${esc(l)}" ${l===cur?'selected':''}>${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select>${ic('chev-down')}</div>`;
DT_SHEET.kdDong=x=>{x=x||{};const c=kdCur();return {t:'Đóng cơ hội',s:esc(c.ten),
 b:`<div class="dt-form"><div class="dt-alert dt-alert--warn">${ic('alert')}<span>Cơ hội sẽ rời khỏi danh sách đang chăm của bạn</span></div>
 ${dtField('kd-ly','Lý do thất bại',kdLySel(x.pre?'Giá cao':''),{req:1,hint:moi('Trạng thái khi đóng theo nhóm lý do, ví dụ Giá cao sang Từ chối mua hàng')})}
 ${dtField('kd-dn','Diễn giải',kdTa('kd-dn','Tối thiểu 10 ký tự',x.pre?'Khách chê giá, đã mua máy Trung Quốc rẻ hơn 15 triệu':''),{req:1,moi:1})}</div>`,
 f:kdBtns('kdDongOk','Xác nhận','kd-ly:1,kd-dn:10','Huỷ',moi('Chọn lý do và nhập diễn giải tối thiểu 10 ký tự'))}};
/* MH9 */
DT_SHEET.kdGc=x=>({t:'Ghi chú chăm sóc',s:esc(kdCur().kh),
 b:dtField('kd-gc','Nội dung',kdTa('kd-gc','Khách nói gì, cần làm gì tiếp…',x&&x.pre?'Khách hẹn mang mẫu gỗ tới thử khắc vào sáng thứ Sáu':''),{req:1}),
 f:kdBtns('kdLuuGc','Lưu ghi chú','kd-gc:1','Huỷ','Ghi chú không được để trống')});

Object.assign(ACT,{
 kdTab(x){S.kd.tab=x;render(true)},
 kdSheet(k){dtSheet(k,{});const f=document.querySelector('.dt-sheet select,.dt-sheet textarea');if(f&&f.tagName==='SELECT')f.focus()},
 kdSync(){if(!S.dt.net)return dtToast('Chưa có mạng, thao tác vẫn lưu trên máy');
  if(kdJobs().some(j=>j.err))return dtToast('Xử lý việc lỗi ở màn Đồng bộ trước khi làm tiếp');
  if(kdShared())kvChay(true);else{S.kd.jobs=[];S.kd.last=NOW;render(true)}dtToast('Đã đồng bộ cơ hội')},
 kdLuuKq(){const c=kdCur(),v=kdKqRead();if(!v.kq)return;const loi=kdHenLoi(v.hen,v.gd,v.kq);
  if(loi){S.dt.sheet.x={...v,sec:v.sec,err:{hen:loi}};return render(true)}
  const tl=parseInt(v.sec,10)||0;c.calls.unshift([kdNowS(),v.kq,KD_KQ_NOI.includes(v.kq)?tl:0,'Tự khai']);kdApplyKq(c,v);
  S.dt.sheet=null;kdDo(c,'Ghi nhật ký cuộc gọi','Đã ghi nhật ký cuộc gọi');render(true)},
 kdLuuTd(){const c=kdCur(),v=kdKqRead();if(!v.kq)return;const loi=kdHenLoi(v.hen,v.gd,v.kq);
  if(loi){S.dt.sheet.x={...S.dt.sheet.x,...v,err:{hen:loi}};return render(true)}
  if(c.calls[0]&&c.calls[0][3]==='Tổng đài')c.calls[0][1]=v.kq;kdApplyKq(c,v);
  S.dt.sheet=null;kdDo(c,'Ghi kết quả cuộc gọi','Đã ghi kết quả cuộc gọi');render(true)},

function kdStopSub(d){if(d.st==='Chưa đến')return `${esc(d.sp)} · ${esc(d.mt)}`;
 if(d.st==='Không gặp được'&&!d.vin)return `Lý do: ${esc(d.ly||'')}`;
 return d.vout?`Check-in ${d.vin} · Check-out ${d.vout}`:`Check-in ${d.vin} · cách ${fmt(d.kc)}&nbsp;m`}

/* ---------- MH12 Tuyến hôm nay ---------- */
VIEWS['CRM-URD-14:tuyen']=()=>{const T=S.kdT,L=KD_TUYEN.stops;
 if(T.empty)return dtPhone({title:'Tuyến hôm nay',body:`<div data-moi>${dtEmpty(IL.route(),'Hôm nay chưa có kế hoạch tuyến','Kế hoạch tuyến đã gửi trên web sẽ hiện ở đây sau khi đồng bộ')}</div>`,nav:'CRM-URD-14:tuyen'});
 const done=L.filter(d=>d.st==='Đã gặp').length,busy=L.findIndex(d=>d.st==='Đang gặp');
 const stops=L.map((d,i)=>{const cls=d.st==='Đã gặp'?'is-done':d.st==='Đang gặp'?'is-now':d.st==='Không gặp được'?'is-miss':'';
  const q=T.q.includes(d.id);
  const khong=`<button class="btn btn--secondary" data-a="kdKhongMo" data-x="${i}">Không gặp được</button>`;
  const btn=d.st==='Đang gặp'?`<button class="btn btn--primary" data-a="kdOutMo" data-x="${i}">${ic('dt-check-c')}Check-out</button>`
   :d.st==='Chưa đến'?(busy>=0?`<button class="btn btn--secondary" disabled title="Check-out điểm đang gặp trước khi check-in điểm mới">${ic('dt-pin')}Check-in</button><div class="kd-hint">Check-out điểm đang gặp trước khi check-in điểm mới</div>${khong}`
    :`<button class="btn btn--primary" data-a="kdIn" data-x="${i}">${ic('dt-pin')}Check-in</button>${khong}`):'';
  const so=d.vin?kdSo(d):'';
  return `<li class="nv-stop ${cls}"><span class="nv-stop__d">${cls==='is-done'?ic('check'):cls==='is-miss'?ic('x'):i+1}</span><div class="nv-stop__c">
  <div class="nv-stop__t"><b>${esc(d.kh)}</b><span class="nv-stop__time">${d.gio}</span></div>
  <div class="dt-line">${ic('dt-pin')}<span>${esc(d.dc)}</span></div>
  <div class="kd-stop__sub">${kdStopSub(d)}</div>
  <div class="kd-stop__tags">${dtPill(d.st,KD_TT[d.st])}${so?dtPill(so,so==='Trong phạm vi'?'ok':'warn'):''}${q?dtPill('Chờ gửi','warn'):''}</div>${btn}</div></li>`}).join('');
 return dtPhone({title:'Tuyến hôm nay',sub:esc(KD_TUYEN.ten),body:`<div data-moi><div class="nv-route-h"><b>${fD(KD_TUYEN.ngay)} · Đã gặp ${done}/${L.length}</b><small>${esc(KD_TUYEN.ten)}</small><div class="nv-bar"><i style="width:${Math.round(done/L.length*100)}%"></i></div></div>
 <ol class="nv-stops">${stops}</ol></div>`,nav:'CRM-URD-14:tuyen'})};

/* ---------- MH13 Check-out tại khách ---------- */
DT_SHEET.kdOut=i=>{const d=kdDiem(i),o=S.kdT.out,gap=(o.kq||'Đã gặp')==='Đã gặp';return {t:'Check-out tại '+d.kh,s:`Check-in ${d.vin} · ${esc(d.sp)}`,
 b:`<div class="dt-form" data-moi><div class="dt-field"><span class="dt-field__l">Kết quả<span class="dt-req" aria-hidden="true">*</span></span><div class="dt-opts dt-opts--row" role="radiogroup" aria-label="Kết quả">${['Đã gặp','Không gặp được'].map(k=>dtOpt('radio','kd-okq',k,k,'',k===(o.kq||'Đã gặp'))).join('')}</div></div>
 ${gap?dtField('kd-okg','Kết quả cuộc gặp',dtSel('kd-okg',KD_KQG,o.kg||'','Chọn kết quả cuộc gặp'),{req:1,err:o.errKg})
  +dtField('kd-ond','Nội dung cuộc gặp',dtTa('kd-ond',{ph:'Khách nói gì, cần làm gì tiếp',max:2000,rows:4,v:o.nd||''}),{req:1,err:o.err})
  :dtField('kd-oly','Lý do không gặp được',dtTa('kd-oly',{ph:'Ví dụ: Khách có việc đột xuất, hẹn lại tuần sau',max:200,rows:3,v:o.ly||''}),{req:1,err:o.err,hint:'Tối đa 200 ký tự'})}
 <div class="dt-field"><span class="dt-field__l">Ảnh tại khách</span><div class="nv-photos kd-photos">${Array.from({length:o.anh||0},(_,k)=>`<div class="nv-ph">${ic('dt-img')}<span>Ảnh ${k+1}</span></div>`).join('')}
 ${(o.anh||0)<5?`<button class="nv-ph kd-ph-add" data-a="kdAnh" aria-label="Chụp hoặc chọn ảnh">${ic('dt-cam')}<span>Thêm</span></button>`:''}</div><div class="dt-field__h">${o.anh||0}/5 ảnh</div></div></div>`,
 f:`<button class="btn btn--primary dt-btn" data-a="kdOutOk" data-x="${i}">Check-out</button><button class="btn btn--secondary dt-btn" data-a="dtClose">Huỷ</button>`}};
/* ---------- Không gặp được ở điểm Chưa đến (mô tả trong MH12) ---------- */
DT_SHEET.kdKhong=i=>{const d=kdDiem(i),k=S.kdT.kh;return {t:'Không gặp được '+d.kh,s:`Hẹn ${d.gio} · ${esc(d.sp)}`,
 b:`<div class="dt-form" data-moi>${dtField('kd-kly','Lý do không gặp được',dtTa('kd-kly',{ph:'Ví dụ: Khách huỷ hẹn, hẹn lại tuần sau',max:200,rows:3,v:k.ly||''}),{req:1,err:k.err,hint:'Tối đa 200 ký tự. Không cần check-in'})}</div>`,
 f:`<button class="btn btn--primary dt-btn" data-a="kdKhongOk" data-x="${i}" data-req="kd-kly:1">Xác nhận</button><div class="dt-ft__hint kd-why">Lý do không gặp được không được để trống</div><button class="btn btn--secondary dt-btn" data-a="dtClose">Huỷ</button>`}};
/* ---------- MH14 Check-in ngoài phạm vi ---------- */
DT_SHEET.kdNgoai=i=>{const d=kdDiem(i);return {t:'Check-in ngoài phạm vi',
 b:`<div class="dt-form" data-moi><div class="dt-alert dt-alert--warn">${ic('alert')}<span>Bạn đang cách điểm hẹn ${esc(d.kh)} ${fmt(d.kc)}&nbsp;m, ngoài phạm vi ${KD_BK}&nbsp;m. Nhập lý do để check-in</span></div>
 ${dtField('kd-ily','Lý do',dtTa('kd-ily',{ph:'Tối thiểu 10 ký tự',max:500,rows:3,v:S.kdT.pre?'Khách hẹn gặp ở kho hàng đầu ngõ':''}),{req:1})}</div>`,
 f:`<button class="btn btn--primary dt-btn" data-a="kdInOk" data-x="${i}" data-req="kd-ily:10">${ic('dt-pin')}Check-in</button><div class="dt-ft__hint kd-why">Lý do không được để trống</div><button class="btn btn--secondary dt-btn" data-a="dtClose">Huỷ</button>`}};
/* không lấy được định vị, cấu hình không cho phép check-in khi không có định vị */
DT_DLG.kdGps=i=>({il:IL.pin(),t:'Không lấy được vị trí',b:'<p>Không lấy được vị trí, bật định vị rồi thử lại</p>',
 f:`<button class="btn btn--primary dt-btn" data-a="kdGpsLai" data-x="${i}">Thử lại</button><button class="btn btn--secondary dt-btn" data-a="dtClose">Đóng</button>`});

function kdTQueue(d){if(S.dt.net)return false;if(!S.kdT.q.includes(d.id))S.kdT.q.push(d.id);return true}
/* giữ chữ đã gõ khi đổi Kết quả trên sheet check-out */
function kdOutGiu(){const o=S.kdT.out;o.kq=(document.querySelector('input[name="kd-okq"]:checked')||{}).value||o.kq||'Đã gặp';
 if(document.getElementById('kd-ond'))o.nd=dtV('kd-ond');if(document.getElementById('kd-oly'))o.ly=dtV('kd-oly');if(document.getElementById('kd-okg'))o.kg=dtV('kd-okg')}
document.addEventListener('change',e=>{if(e.target&&e.target.name==='kd-okq'){kdOutGiu();S.kdT.out.err='';S.kdT.out.errKg='';render(true)}});
Object.assign(ACT,{
 kdIn(i){const d=kdDiem(+i);if(!S.kdT.gps)return dtDlg('kdGps',i);
  if(d.kc>KD_BK){S.kdT.pre=false;return dtSheet('kdNgoai',+i)}
  Object.assign(d,{st:'Đang gặp',vin:fT(NOW)});const q=kdTQueue(d);render(true);dtToast(q?'Đã lưu trên máy, gửi khi có mạng':`Check-in lúc ${fT(NOW)}. Trong phạm vi cho phép (cách ${fmt(d.kc)} m)`)},
 kdGpsLai(i){S.kdT.gps=true;S.dt.dlg=null;ACT.kdIn(i)},
 kdInOk(i){const d=kdDiem(+i);if(dtV('kd-ily').length<10)return;Object.assign(d,{st:'Đang gặp',vin:fT(NOW),lyIn:dtV('kd-ily')});S.dt.sheet=null;
  const q=kdTQueue(d);render(true);dtToast(q?'Đã lưu trên máy, gửi khi có mạng':`Check-in lúc ${fT(NOW)}`)},
 kdOutMo(i){S.kdT.out={kq:'Đã gặp',kg:'',nd:'',ly:'',anh:0,err:'',errKg:''};dtSheet('kdOut',+i)},
 kdAnh(){kdOutGiu();const o=S.kdT.out;o.anh=Math.min(5,(o.anh||0)+1);render(true)},
 kdOutOk(i){kdOutGiu();const o=S.kdT.out,d=kdDiem(+i);o.err='';o.errKg='';
  if(o.kq==='Đã gặp'){if(!o.kg)o.errKg='Kết quả cuộc gặp không được để trống';if(!o.nd)o.err='Nội dung cuộc gặp không được để trống';if(o.err||o.errKg)return render(true)}
  else if(!o.ly){o.err='Lý do không gặp được không được để trống';return render(true)}
  Object.assign(d,{st:o.kq,vout:fT(NOW),nd:o.nd,kg:o.kg,ly:o.ly});S.dt.sheet=null;const q=kdTQueue(d);render(true);dtToast(q?'Đã lưu trên máy, gửi khi có mạng':'Đã check-out')},
 kdKhongMo(i){S.kdT.kh={ly:'',err:''};dtSheet('kdKhong',+i)},
 kdKhongOk(i){const d=kdDiem(+i),ly=dtV('kd-kly');if(!ly){S.kdT.kh={ly:'',err:'Lý do không gặp được không được để trống'};return render(true)}
  Object.assign(d,{st:'Không gặp được',ly});S.dt.sheet=null;const q=kdTQueue(d);render(true);dtToast(q?'Đã lưu trên máy, gửi khi có mạng':'Đã ghi không gặp được')}
});

MH('CRM-URD-14','MH12',{r:'CRM-URD-14:tuyen',role:'nvkd'});
MH('CRM-URD-14','MH13',{r:'CRM-URD-14:tuyen',role:'nvkd',run:()=>{S.kdT.out={kq:'Đã gặp',kg:'Tích cực, nên theo tiếp',nd:'Khách xem mẫu in UV trên hộp giấy, xin báo giá máy 6090 kèm mực trắng',ly:'',anh:2,err:'',errKg:''};dtSheet('kdOut',2)}});
MH('CRM-URD-14','MH14',{r:'CRM-URD-14:tuyen',role:'nvkd',run:()=>{S.kdT.pre=true;dtSheet('kdNgoai',3)}});
dtX('kd-tuyen-trong','Tuyến hôm nay: chưa có kế hoạch','Tuyến hôm nay',{r:'CRM-URD-14:tuyen',role:'nvkd',state:{'kdT.empty':true}});
dtX('kd-tuyen-khong','Tuyến hôm nay: ghi không gặp được ở điểm chưa đến','Tuyến hôm nay',{r:'CRM-URD-14:tuyen',role:'nvkd',run:()=>{S.kdT.kh={ly:'Khách báo đi công tác Hải Phòng, hẹn lại thứ Sáu',err:''};dtSheet('kdKhong',3)}});
dtX('kd-tuyen-gps','Tuyến hôm nay: không lấy được vị trí','Tuyến hôm nay',{r:'CRM-URD-14:tuyen',role:'nvkd',run:()=>{Object.assign(kdDiem(2),{st:'Đã gặp',vout:'15:10'});S.kdT.gps=false;dtDlg('kdGps',3)}});
dtX('kd-tuyen-loi','Check-out: thiếu lý do không gặp được','Tuyến hôm nay',{r:'CRM-URD-14:tuyen',role:'nvkd',run:()=>{S.kdT.out={kq:'Không gặp được',kg:'',nd:'',ly:'',anh:0,err:'Lý do không gặp được không được để trống',errKg:''};dtSheet('kdOut',2)}});


boot();
</script>
</body>
</html>
