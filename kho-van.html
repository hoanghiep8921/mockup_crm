VIEWS['KHO-URD-07']=()=>{const P=S.k7,W=can('ketoan thukho');
 const rows=K7_PS.filter(p=>(!P.q||has(p.id+' '+p.hang,P.q))&&(!P.nhap||p.st==='nhap')&&(!P.lech||k7Sum(p).lech!==0)).sort((a,b)=>b.den-a.den);
 const T=rows.reduce((a,p)=>{const s=k7Sum(p);a.thu+=s.thu;a.nhan+=s.nhan;a.lech+=s.lech;return a},{thu:0,nhan:0,lech:0});
 return `${pagehead(K7_CR([]).slice(0,2).concat([['Đối soát COD','']]),'Đối soát COD',W?`<button class="btn btn--secondary" data-a="k7Xuat">${ic('download')}Xuất Excel</button><button class="btn btn--primary" data-a="k7Tao">${ic('plus')}Tạo phiên</button>`:'','Tiền thu hộ hãng vận chuyển đã thu của khách và chuyển về công ty')}
 ${W?'':khRo()}
 <div class="toolbar">${fSearch('k7.q',P.q,'Tìm theo mã phiên hoặc hãng vận chuyển')}<button class="chip-btn" aria-pressed="${P.nhap}" data-a="k7Qf" data-x="nhap">Nháp</button><button class="chip-btn" aria-pressed="${P.lech}" data-a="k7Qf" data-x="lech">Còn lệch</button><button class="chip-btn" aria-pressed="${P.nhom}" data-a="k7Qf" data-x="nhom">Nhóm theo: Hãng vận chuyển</button></div>
 <div class="gap-t">${rows.length?`<div class="tbl-box"><table class="tbl"><thead><tr><th>Mã phiên</th><th>Hãng vận chuyển</th><th>Từ ngày</th><th>Đến ngày</th><th class="right">Số phiếu</th><th class="right">Đáng lẽ thu</th><th class="right">Thực nhận</th><th class="right">Lệch</th><th>Trạng thái</th></tr></thead><tbody>
 ${P.nhom?`<tr><td colspan="9" style="background:var(--bg-subtle);font-weight:500">Giao Hàng Nhanh <span class="muted">(${rows.length})</span></td></tr>`:''}
 ${rows.map(p=>{const s=k7Sum(p),mo=p.st==='chot'&&!s.lech;return `<tr ${mo?'style="color:var(--text-tertiary)"':''}><td class="nowrap"><a href="#" class="lnk" data-a="k7Mo" data-x="${p.id}"><b>${p.id}</b></a></td><td>${p.hang}</td><td class="nowrap">${fD(p.tu)}</td><td class="nowrap">${fD(p.den)}</td><td class="right num">${p.rows.length}</td><td class="right num">${khMoney(s.thu)}</td><td class="right num">${khMoney(s.nhan)}</td><td class="right">${k7Lech(s.lech)}</td><td>${k7St(p.st)}</td></tr>`}).join('')}
 <tr><td colspan="5"><b>Tổng</b></td><td class="right num"><b>${khMoney(T.thu)}</b></td><td class="right num"><b>${khMoney(T.nhan)}</b></td><td class="right"><b>${k7Lech(T.lech)}</b></td><td></td></tr>
 </tbody></table>${khPag(rows.length,P.q||P.nhap||P.lech?rows.length:12)}</div>`:`<div class="card">${emptyState('Không có kết quả tìm kiếm phù hợp','Bỏ bớt điều kiện lọc hoặc tìm theo từ khác')}</div>`}</div>`};

/* MH3, MH6 Chi tiết phiên */
VIEWS['KHO-URD-07:ct']=()=>{const p=k7Of(S.arg)||K7_PS[0],s=k7Sum(p),nhap=p.st==='nhap',W=can('ketoan thukho'),KT=can('ketoan');
 const thieu=p.rows.filter(r=>r.nhan==null).length,chuaLy=p.rows.filter(r=>r.nhan!=null&&r.thu!==r.nhan&&r.ld.trim().length<10).length;
 const why=!p.rows.length?'Phiên chưa có dòng nào để chốt':thieu?`Còn ${thieu} dòng chưa nhập thực nhận`:chuaLy?`Còn ${chuaLy} dòng lệch chưa ghi lý do`:'';
 const acts=nhap?`${W?`<button class="btn btn--secondary" data-a="k7Nap" data-x="${p.id}">Nạp phiếu trong kỳ</button>`:''}${KT?`<div style="text-align:right"><button class="btn btn--primary" data-a="k7Chot" data-x="${p.id}" ${why?`disabled title="${why}"`:''}>Chốt phiên</button>${why?`<div class="hint gap-t-s" data-moi>${why}</div>`:''}</div>`:''}`:(KT?`<button class="btn btn--primary" data-a="k7MoLai" data-x="${p.id}">Mở lại</button>`:'');
 const row=(a,b)=>`<dl class="dl" style="grid-template-columns:10rem 1fr"><dt>${a}</dt><dd>${b}</dd></dl>`;
 const bkl=p.bk!=null?s.nhan-p.bk:0;
 const show=p.rows.slice(0,nhap?3:2),rest=p.rows.length-show.length;
 return `${pagehead(K7_CR([[p.id,'']]),`${p.id} <span style="vertical-align:middle;margin-left:.375rem">${k7St(p.st)}</span>`,acts,'Phiên đối soát COD')}
 <div class="stack-lg gap-t">
 <div class="card"><div class="card__h"><h3 class="h4">Kỳ và tiền</h3><span class="spacer"></span>${s.nl?`<span class="tag tag--danger">${ic('alert','ic--sm')} ${s.nl} phiếu lệch</span>`:''}</div><div class="card__b"><div class="form-grid">
  ${row('Hãng vận chuyển',p.hang)}${row('Đáng lẽ thu',`<span class="num">${khMoney(s.thu)}</span>`)}
  ${row('Từ ngày',fD(p.tu))}${row('Thực nhận',`<span class="num">${khMoney(s.nhan)}</span>`)}
  ${row('Đến ngày',fD(p.den))}${row('Lệch',k7Lech(s.lech))}
  ${nhap?row('Số phiếu',p.rows.length):row('Chốt lúc',`${fDT(p.chot[0])}, ${esc(p.chot[1])}`)}${row('Hãng báo đã chuyển',p.bk!=null?`<span class="num">${khMoney(p.bk)}</span>${bkl?` <span class="muted">· lệch so với bảng kê ${khMoney(bkl)}</span>`:''}`:dash)}
 </div>
 ${s.lech>0?`<div class="alert alert--danger gap-t" data-moi>${ic('err')}<div class="alert__b"><div class="alert__d">Hãng còn thiếu ${khMoney(s.lech)}. Xem cột Lệch bên dưới để biết của những đơn nào</div></div></div>`:s.lech<0?`<div class="alert alert--warning gap-t" data-moi>${ic('alert')}<div class="alert__b"><div class="alert__d">Hãng chuyển thừa ${khMoney(-s.lech)}. Xem cột Lệch bên dưới để biết của những đơn nào</div></div></div>`:''}
 ${bkl?`<div class="alert alert--warning gap-t">${ic('alert')}<div class="alert__b"><div class="alert__d">Tổng thực nhận theo dòng khác số hãng báo đã chuyển. Bảng kê và thực tế không khớp, trước cả khi xét từng đơn</div></div></div>`:''}
 </div></div>
 <div class="card"><div class="card__h"><h3 class="h4">Dòng đối soát</h3></div><div class="card__b">
  <div class="tbl-box tbl-box--flat" style="border:1px solid var(--border-subtle);border-radius:var(--radius-md)"><table class="tbl"><thead><tr><th>Phiếu giao</th><th>Đơn bán</th><th>Mã vận đơn</th><th>Khách hàng</th><th>Ngày giao</th><th class="right">Đáng lẽ thu</th><th class="right">Thực nhận</th><th class="right">Lệch</th>${nhap?'<th class="right">Lệch với đơn</th>':''}<th>Lý do lệch</th></tr></thead><tbody>
  ${show.map((r,i)=>{const l=r.nhan==null?null:r.thu-r.nhan,bg=l?'background:var(--status-danger-bg)':r.ldon?'background:var(--status-warning-bg)':'';
   return `<tr style="${bg}"><td class="nowrap"><a href="#" class="lnk" data-a="k7Ph" data-x="${r.ph}">${r.ph}</a></td><td>${r.don}</td><td class="mono">${r.vd}</td><td class="wrap">${esc(r.kh)}</td><td class="nowrap">${fD(r.ngay)}</td><td class="right num">${khMoney(r.thu)}</td>
   <td class="right">${nhap&&W?`<input class="input num" style="width:9rem;text-align:right" value="${r.nhan==null?'':fmt(r.nhan)}" aria-label="Thực nhận" onchange="ACT.k7Nhan('${p.id}',${i},this.value)">`:`<span class="num">${khMoney(r.nhan)}</span>`}</td>
   <td class="right">${l==null?dash:k7Lech(l)}</td>${nhap?`<td class="right num" ${r.ldon?'style="color:var(--status-warning-fg);font-weight:500"':''}>${khMoney(r.ldon)}</td>`:''}
   <td>${nhap&&W?`<input class="input" style="min-width:12rem" value="${esc(r.ld)}" placeholder="${l?'Bắt buộc, tối thiểu 10 ký tự':''}" aria-label="Lý do lệch" ${l&&r.ld.trim().length<10?'aria-invalid="true"':''} onchange="ACT.k7Ly('${p.id}',${i},this.value)">`:esc(r.ld)}</td></tr>`}).join('')}
  ${rest>0?`<tr><td colspan="${nhap?10:9}" class="muted">Và ${rest} dòng khác khớp đủ</td></tr>`:''}
  <tr><td colspan="5"><b>Tổng ${p.rows.length} phiếu</b></td><td class="right num"><b>${khMoney(s.thu)}</b></td><td class="right num"><b>${khMoney(s.nhan)}</b></td><td class="right"><b>${k7Lech(s.lech)}</b></td>${nhap?'<td></td>':''}<td></td></tr>
  </tbody></table></div>
 </div></div></div>`};

Object.assign(ACT,{
 k7Qf(k){S.k7[k]=!S.k7[k];render(true)},
 k7Mo(id){go('KHO-URD-07:ct',id)},
 k7Ph(id){if(VIEWS['KHO-URD-06:ct']&&typeof k6Of==='function'&&k6Of(id))go('KHO-URD-06:ct',id);else toast('Mở phiếu giao '+id,'info')},
 k7Xuat(){toast('Đang xuất Excel theo bộ lọc đang áp','info')},
 /* MH2 tạo phiên */
 k7Tao(){modal({title:'Tạo phiên đối soát COD',body:`<div class="field"><label class="field__label" for="k7-hang">Hãng vận chuyển<span class="field__req">*</span></label>${selectBox('k7-hang',[['','Chọn hãng vận chuyển'],'Giao Hàng Nhanh'],'Giao Hàng Nhanh')}</div>
  <div class="form-grid gap-t"><div class="field"><label class="field__label" for="k7-tu">Từ ngày<span class="field__req">*</span></label><input type="date" class="input" id="k7-tu" value="2026-11-01"></div><div class="field"><label class="field__label" for="k7-den">Đến ngày<span class="field__req">*</span></label><input type="date" class="input" id="k7-den" value="2026-11-03"></div></div>
  <div class="field gap-t"><label class="field__label" for="k7-bk">Hãng báo đã chuyển</label><input class="input num" id="k7-bk" style="max-width:14rem" value="341.700.000 đ"><div class="field__help">Số trên sao kê hoặc bảng kê của hãng</div></div>
  <div class="field gap-t"><label class="field__label" for="k7-gc">Ghi chú</label><textarea class="input" id="k7-gc" rows="2" maxlength="1000">Bảng kê GHN đợt 1 tháng 11</textarea></div>`,
  foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="k7TaoOk">Tạo phiên</button>`})},
 k7TaoOk(){if(!val('k7-hang'))return fieldErr('k7-hang','Hãng vận chuyển không được để trống');const tu=val('k7-tu'),den=val('k7-den');if(!tu)return fieldErr('k7-tu','Từ ngày không được để trống');if(!den)return fieldErr('k7-den','Đến ngày không được để trống');if(tu>den)return fieldErr('k7-tu','Từ ngày phải trước Đến ngày');
  const id='DS-COD/2026/0013';K7_PS.unshift({id,hang:val('k7-hang'),tu:fromIso(tu),den:fromIso(den),bk:Number(val('k7-bk').replace(/\D/g,''))||null,gc:val('k7-gc'),st:'nhap',rows:[]});closeOverlay();go('KHO-URD-07:ct',id);toast('Đã tạo phiên '+id)},
 /* MH4 không có phiếu để nạp */
 k7Nap(id){const p=k7Of(id);modal({title:'Không có phiếu để nạp',size:'modal--sm',body:`<div class="row" style="gap:.75rem;align-items:flex-start;flex-wrap:nowrap"><span class="state__ic state__ic--danger" style="flex:none">${ic('alert')}</span><p style="margin:0">Không tìm thấy phiếu giao nào thoả điều kiện: hãng ${p.hang}, đã giao trong khoảng ${fD(p.tu)} đến ${fD(p.den)}, có thu hộ, và chưa nằm trong phiên đối soát nào khác</p></div>`,foot:`<button class="btn btn--primary" data-a="closeOverlay">Đã hiểu</button>`})},
 k7Nhan(id,i,v){const r=k7Of(id).rows[i];const n=String(v).replace(/\D/g,'');r.nhan=n===''?null:+n;render(true)},
 k7Ly(id,i,v){k7Of(id).rows[i].ld=v;render(true)},
 /* MH5 xác nhận chốt */
 k7Chot(id){const p=k7Of(id),s=k7Sum(p);modal({title:`Chốt phiên ${p.id}?`,size:'modal--sm',body:`<div class="row" style="gap:.75rem;align-items:flex-start;flex-wrap:nowrap"><span class="state__ic" style="flex:none">${ic('info')}</span><p style="margin:0" data-moi>${s.lech?`Phiên còn lệch ${khMoney(s.lech)} trên ${s.nl} phiếu, mọi dòng lệch đã có lý do. Sau khi chốt, số thực nhận và lý do không sửa được, các phiếu được đánh dấu Đã đối soát COD`:`Phiên khớp toàn bộ ${p.rows.length} phiếu. Sau khi chốt, số thực nhận không sửa được, các phiếu được đánh dấu Đã đối soát COD`}</p></div>`,
  foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="k7ChotOk" data-x="${id}">Chốt phiên</button>`})},
 k7ChotOk(id){const p=k7Of(id);p.st='chot';p.chot=[NOW,me()];closeOverlay();render(true);toast('Đã chốt phiên '+id)},
 /* MH7 mở lại */
 k7MoLai(id){modal({title:'Mở lại phiên '+id,size:'modal--sm',body:`<p style="margin:0 0 .75rem" data-moi>Phiên về Nháp để sửa. Các phiếu trong phiên bỏ đánh dấu Đã đối soát COD cho tới khi chốt lại</p><div class="field" data-moi><label class="field__label" for="k7-ml">Lý do mở lại<span class="field__req">*</span></label><textarea class="input" id="k7-ml" rows="3" maxlength="500" oninput="$('#k7-ml-ok').disabled=this.value.trim().length<10"></textarea><div class="field__help">Tối thiểu 10 ký tự</div></div>`,
  foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" id="k7-ml-ok" data-a="k7MoLaiOk" data-x="${id}" disabled title="Ghi lý do mở lại, tối thiểu 10 ký tự">Mở lại</button>`})},
 k7MoLaiOk(id){const p=k7Of(id);p.st='nhap';closeOverlay();render(true);toast('Đã mở lại phiên '+id)}
});

MH('KHO-URD-07','MH1',{r:'KHO-URD-07',role:'ketoan'});
MH('KHO-URD-07','MH2',{r:'KHO-URD-07',role:'ketoan',run:()=>ACT.k7Tao()});
MH('KHO-URD-07','MH3',{r:'KHO-URD-07:ct',arg:'DS-COD/2026/0012',role:'ketoan'});
MH('KHO-URD-07','MH4',{r:'KHO-URD-07:ct',arg:'DS-COD/2026/0012',role:'ketoan',run:()=>ACT.k7Nap('DS-COD/2026/0012')});
MH('KHO-URD-07','MH5',{r:'KHO-URD-07:ct',arg:'DS-COD/2026/0012',role:'ketoan',run:()=>{k7Of('DS-COD/2026/0012').rows[1].ld='GHN trừ phí hoàn một phần hàng';render();ACT.k7Chot('DS-COD/2026/0012')}});
MH('KHO-URD-07','MH6',{r:'KHO-URD-07:ct',arg:'DS-COD/2026/0011',role:'ketoan'});
MH('KHO-URD-07','MH7',{r:'KHO-URD-07:ct',arg:'DS-COD/2026/0011',role:'ketoan',run:()=>{ACT.k7MoLai('DS-COD/2026/0011');$('#k7-ml').value='GHN gửi bảng kê điều chỉnh đơn S00214';$('#k7-ml-ok').disabled=false}});


boot();
</script>
</body>
</html>
