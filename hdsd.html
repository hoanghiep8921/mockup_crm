ống chuyển sang màn <a href=\"../bao-cao-du-lieu/doanh-thu-ghi-nhan.md\">Doanh thu ghi nhận<\/a> và mở hộp Nạp giá vốn, giữ kỳ và bộ lọc của Phễu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nạp giá vốn theo hướng dẫn ở màn Doanh thu ghi nhận<\/td><td>Giá vốn được áp theo mã đơn<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Quay lại Phễu và hiệu quả<\/td><td>Khi mọi đơn đã có giá vốn, bước Lợi nhuận gộp hiển thị số<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Nút `Nạp giá vốn` chỉ hiện với **Trưởng/Phó phòng và BGĐ**\n* Hệ thống không hiển thị lợi nhuận một phần: chỉ cần một đơn chưa có giá vốn là cả bước hiện \"Chưa đủ giá vốn\"\n* Chuyên viên không thấy bước Lợi nhuận gộp, kể cả trong tệp Excel\n", "bang-dieu-khien/hieu-suat-doi-nhom.md": "# Hiệu suất đội nhóm\n\n🧭 Tổng quan chức năng: So sánh kết quả giữa các đội Marketing, hoặc giữa các nhân viên Marketing: lead, cơ hội, đơn, doanh thu, chi phí quảng cáo và các tỷ lệ. Dùng cho Trưởng nhóm, Trưởng/Phó phòng Marketing và BGĐ\n\nTruy cập: menu **Bảng điều khiển → Điều hành → Hiệu suất đội nhóm**, hoặc nhấn `Hiệu suất đội nhóm` ở thẻ Chỉ tiêu lead theo đội của màn [Tổng quan ngày](tong-quan-ngay.md)\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH SO SÁNH HIỆU SUẤT CÁC ĐỘI\n\nBước 1: Chọn kỳ và đặt bộ lọc cần xem\n\nBước 2: Xem bảng **Theo đội**, mặc định xếp theo Doanh thu giảm dần\n\nBước 3: Xem cột **% chỉ tiêu lead** để biết đội nào chậm tiến độ\n\nBước 4: Bấm tiêu đề cột để xếp lại theo chỉ số cần so (CPL, ROAS, % chốt…)\n\nBước 5: Bấm số Lead, Cơ hội hoặc Đơn chốt của một đội để mở danh sách dữ liệu gốc\n\nBước 6: Chuyển sang **Theo nhân viên** để so sánh từng người\n\nChọn kỳ, khoảng ngày tùy chọn, bộ lọc dùng chung, làm mới, xuất Excel và danh sách dữ liệu gốc: xem [Bộ lọc và kỳ báo cáo](bo-loc-va-ky-bao-cao.md)\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem hiệu suất theo đội<\/mark>\n\n<figure><img src=\"images/hieu-suat-doi-nhom-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | \"Cập nhật lúc HH:MM · kỳ … so với …\", nhóm nút kỳ, nút Làm mới, `Xuất Excel` |\n| **Bộ lọc dùng chung** | Xem [Bộ lọc và kỳ báo cáo](bo-loc-va-ky-bao-cao.md) |\n| **Chuyển chế độ** | `Theo đội` (mặc định) / `Theo nhân viên` |\n| **Bảng theo đội** | Mỗi dòng một đội Marketing. Dòng \"(Chưa gắn đội)\" luôn ở cuối, dòng **Tổng** ở dưới cùng |\n\n**Các cột của bảng:**\n\n| Cột | Ý nghĩa |\n| --- | --- |\n| **Đội nhóm** | Tên đội Marketing |\n| **Lead** | Lead mới của đội trong kỳ. Bấm được |\n| **% chỉ tiêu lead** | Lead × 100 ÷ chỉ tiêu lead của đội trong kỳ, kèm thanh nhỏ. \"-\" khi đội không có chỉ tiêu |\n| **Cơ hội** | Cơ hội tạo trong kỳ thuộc đội. Bấm được |\n| **Đơn chốt** | Đơn đã chốt trong kỳ thuộc đội. Bấm được (Chuyên viên bị khóa) |\n| **Doanh thu** | Tổng tiền đơn đã chốt của đội |\n| **Chi phí quảng cáo** | Chi phí Meta và thanh toán quảng cáo trả phí của Google, TikTok; tính theo đội của chiến dịch. Không gồm KOL, in ấn, sự kiện |\n| **CPL** | Chi phí quảng cáo ÷ Lead |\n| **ROAS** | Doanh thu ÷ Chi phí quảng cáo |\n| **% chốt / lead** | Đơn chốt ÷ Lead × 100 |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Bảng điều khiển → Điều hành → Hiệu suất đội nhóm<\/strong><\/td><td>Màn mở với kỳ và bộ lọc đang giữ trong Bảng điều khiển, chế độ <code>Theo đội<\/code>, xếp theo Doanh thu giảm dần<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đổi kỳ hoặc đặt bộ lọc<\/td><td>Bảng tính lại. Cách dùng: <a href=\"bo-loc-va-ky-bao-cao.md\">Bộ lọc và kỳ báo cáo<\/a><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem cột <strong>% chỉ tiêu lead<\/strong><\/td><td>Thanh nhỏ có vạch thời gian đã qua. Đội chậm tiến độ khi % chỉ tiêu lead thấp hơn thời gian đã qua quá 3 điểm<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xem dòng <strong>Tổng<\/strong><\/td><td>Tổng lead, cơ hội, đơn, doanh thu, chi phí quảng cáo. CPL, ROAS, % chốt tính lại từ tổng, không cộng tỷ lệ của các đội. % chỉ tiêu lead ở dòng Tổng không đánh dấu chậm tiến độ<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn nút Làm mới hoặc <code>Xuất Excel<\/code><\/td><td>Làm mới tính lại ngay. Xuất Excel tải tệp gồm bảng đang hiển thị<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Menu **Hiệu suất đội nhóm** chỉ hiện từ **Trưởng nhóm trở lên**. Chuyên viên mở bằng đường dẫn trực tiếp thì chỉ thấy dòng thuộc phạm vi của mình\n* **Ai thấy dòng nào:**\n  * Trưởng/Phó phòng, BGĐ: mọi đội và dòng \"(Chưa gắn đội)\". Dòng Tổng là toàn phòng; % chỉ tiêu lead của Tổng tính trên chỉ tiêu toàn phòng của kế hoạch đã duyệt\n  * Trưởng nhóm: chỉ các đội mình quản lý, không thấy dòng \"(Chưa gắn đội)\". Dòng Tổng là tổng các đội mình, kèm chú thích \"Tổng chỉ gồm các đội bạn quản lý, chưa gồm chi phí chưa gắn đội\"\n* Dòng **\"(Chưa gắn đội)\"** gom lead, cơ hội, đơn và chi phí không xác định được đội, ví dụ chiến dịch có chi phí nhưng chưa gắn đội. Dòng này không có chỉ tiêu\n* Lead tính theo đội của lead, còn chi phí tính theo đội của chiến dịch. Khi hai đội này khác nhau, CPL theo đội có thể lệch\n* CPL, ROAS của dòng Tổng khớp với CPL, ROAS ở [Tổng quan ngày](tong-quan-ngay.md) cùng kỳ và bộ lọc\n* Lọc theo chiều chưa lọc được chi phí (Nhân viên, Trang web, Kênh nhập, Khu vực): cột Chi phí quảng cáo, CPL, ROAS hiển thị \"-\" kèm \"Chi phí chưa lọc theo chiều này\"\n* \"0\" hoặc \"0 đ\" là biết rõ bằng 0; \"-\" là không tính được (ví dụ ROAS khi chi phí bằng 0)\n* Các cột Công việc và % hoàn thành KPI chưa có trên màn này\n\n## <mark style=\"color:green;\">2. Sắp xếp và mở danh sách dữ liệu gốc<\/mark>\n\n<figure><img src=\"images/hieu-suat-doi-nhom-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm tiêu đề một cột<\/td><td>Bảng xếp theo cột đó. Mũi tên cạnh tiêu đề cho biết cột và chiều đang xếp<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm lại tiêu đề cột<\/td><td>Đảo chiều xếp (tăng ↔ giảm)<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm số <strong>Lead<\/strong>, <strong>Cơ hội<\/strong> hoặc <strong>Đơn chốt<\/strong> của một đội<\/td><td>Mở danh sách dữ liệu gốc của đội đó, đúng kỳ và bộ lọc. Dòng \"Đang lọc\" có thêm \"Đội = …\". Tổng số dòng bằng số đã bấm<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Quay lại<\/code><\/td><td>Về màn Hiệu suất đội nhóm, giữ kỳ và bộ lọc<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Giá trị bằng nhau xếp tiếp theo tên đội, theo thứ tự chữ cái tiếng Việt\n* Ô \"-\" luôn nằm cuối ở cả hai chiều xếp; ô \"0\" xếp như số bình thường\n* Dòng \"(Chưa gắn đội)\" luôn ở cuối, không tham gia sắp xếp. Bấm số ở dòng này thì danh sách ghi \"(Chưa gắn đội)\"\n* Chuyên viên không mở được danh sách Đơn chốt: ô có biểu tượng khóa\n* Cách dùng danh sách dữ liệu gốc (lọc nhanh, sắp xếp, mở bản ghi): [Bộ lọc và kỳ báo cáo](bo-loc-va-ky-bao-cao.md)\n\n## <mark style=\"color:green;\">3. Xem hiệu suất theo nhân viên<\/mark>\n\n<figure><img src=\"images/hieu-suat-doi-nhom-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nBảng theo nhân viên có cùng bố cục với bảng theo đội, mỗi dòng là một nhân viên Marketing:\n\n| Cột | Ý nghĩa |\n| --- | --- |\n| **Nhân viên** | Nhân viên Marketing phụ trách |\n| **Lead**, **Cơ hội**, **Đơn chốt** | Theo nhân viên Marketing lưu trên lead, cơ hội, đơn. Bấm được |\n| **Doanh thu** | Tổng tiền đơn đã chốt của nhân viên |\n| **Chi phí Meta** | Chi phí quảng cáo Meta của các quảng cáo được gán cho nhân viên |\n| **CPL**, **ROAS** | Tính trên Chi phí Meta |\n| **% chốt / lead** | Đơn chốt ÷ Lead × 100 |\n| **Dòng \"(Chưa gắn nhân viên)\"** | Lead và chi phí chưa gán người, luôn ở cuối |\n| **Dòng Tổng** | Tính lại từ tổng |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Theo nhân viên<\/code><\/td><td>Hệ thống tính theo nhân viên Marketing, xếp theo Doanh thu giảm dần<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm tiêu đề cột<\/td><td>Sắp xếp như chế độ theo đội<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm số Lead, Cơ hội hoặc Đơn chốt của một nhân viên<\/td><td>Mở danh sách dữ liệu gốc của nhân viên đó. Dòng \"Đang lọc\" có thêm \"Nhân viên = …\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Theo đội<\/code><\/td><td>Quay về bảng theo đội<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Cột chi phí ở chế độ này là **Chi phí Meta**, không gồm thanh toán quảng cáo của Google, TikTok (không gán được cho từng người). Khi kỳ có các khoản này, dưới bảng có chú thích \"Chi phí theo nhân viên chỉ gồm chi phí Meta; CPL, ROAS có thể khác chế độ Theo đội.\"\n* Chế độ này không có cột % chỉ tiêu lead vì chưa có chỉ tiêu theo nhân viên\n* Trưởng nhóm chỉ thấy nhân viên thuộc đội mình và không thấy dòng \"(Chưa gắn nhân viên)\". Trưởng/Phó phòng, BGĐ thấy mọi nhân viên và dòng này\n* Chi phí gán theo người đang được gán quảng cáo, còn lead theo người lúc tạo lead. Khi quảng cáo được gán lại cho người khác, CPL theo người có thể lệch\n* Lọc chiều **Nhân viên** ở bộ lọc dùng chung thì bảng chỉ còn nhân viên được chọn\n", "ke-hoach/ke-hoach-marketing.md": "# Kế hoạch Marketing\n\n🧭 Tổng quan chức năng: Màn dùng để lập kế hoạch Marketing theo năm, quý, tháng (mục tiêu Lead, Doanh thu theo sản phẩm và kênh, ngân sách dự kiến theo kênh, mốc triển khai), gửi duyệt và theo dõi kế hoạch. Chuyên viên và Trưởng nhóm lập kế hoạch; Trưởng/Phó phòng và BGĐ duyệt. Kế hoạch **Đã duyệt** là căn cứ để sinh chỉ tiêu, lập phân bổ ngân sách và tạo chiến dịch\n\nTruy cập: menu **Kế hoạch → Kế hoạch Marketing → Kế hoạch năm / quý / tháng**. Nhấn liên kết kế hoạch ở chi tiết một mục của [Lịch triển khai](lich-trien-khai.md) cũng mở đúng kế hoạch đó tại màn này\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH LẬP VÀ DUYỆT KẾ HOẠCH\n\nBước 1: **Tạo kế hoạch**. Người lập nhấn `Tạo kế hoạch`, chọn loại kỳ (Năm, Quý, Tháng), kế hoạch cha, khoảng ngày, người phụ trách, đội. Kế hoạch được lưu ở trạng thái **Nháp** với mã dạng `MKT-KH-0013`. Xem mục 3\n\nBước 2: **Hoàn thiện nội dung**. Thêm dòng mục tiêu, dòng ngân sách dự kiến và mốc triển khai. Xem mục 4, 5, 6\n\nBước 3: **Gửi duyệt**. Người phụ trách, người tạo, Trưởng nhóm của đội hoặc Trưởng/Phó phòng, BGĐ nhấn `Gửi duyệt`. Kế hoạch chuyển **Chờ duyệt** và bị khóa sửa. Xem mục 7\n\nBước 4: **Duyệt hoặc từ chối**. Trưởng/Phó phòng hoặc BGĐ (không phải người lập, không phải người gửi duyệt) nhấn `Duyệt` hoặc `Từ chối` kèm lý do. Kế hoạch bị từ chối được người lập sửa rồi gửi duyệt lại. Xem mục 8, 9\n\nBước 5: **Sinh chỉ tiêu**. Với kế hoạch Đã duyệt, người phụ trách hoặc Trưởng/Phó phòng, BGĐ nhấn `Sinh chỉ tiêu` để tạo chỉ tiêu ở [Chỉ tiêu theo sản phẩm](chi-tieu-theo-san-pham.md) và [Chỉ tiêu theo kênh](chi-tieu-theo-kenh.md). Xem mục 11\n\nBước 6: **Dùng kế hoạch**. Lập [Phân bổ ngân sách](phan-bo-ngan-sach.md) từ kế hoạch Đã duyệt, tạo chiến dịch, theo dõi mốc trên [Lịch triển khai](lich-trien-khai.md)\n\n**Trạng thái duyệt của kế hoạch:**\n\n* **Nháp**: đang soạn, sửa được\n* **Chờ duyệt**: đã gửi, khóa sửa nội dung và các dòng\n* **Đã duyệt**: khóa sửa; dùng được để sinh chỉ tiêu, phân bổ ngân sách\n* **Từ chối**: có lý do từ chối; người lập sửa và gửi duyệt lại\n\n**Giai đoạn theo thời gian** (chỉ hiện với kế hoạch Đã duyệt, không phải trạng thái duyệt): **Chưa bắt đầu** (hôm nay trước ngày bắt đầu), **Đang triển khai** (trong kỳ), **Đã kết thúc** (qua ngày kết thúc). Giai đoạn chỉ để xem, không chặn thao tác nào\n\n**Ai làm được gì:**\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng | BGĐ |\n| --- | --- | --- | --- | --- |\n| Xem kế hoạch | Mình phụ trách, mình tạo, mình là thành viên (chỉ xem) | Của đội | Tất cả | Tất cả |\n| Tạo kế hoạch | Có | Có | Có | Có |\n| Sửa khi Nháp, Từ chối; thêm, sửa, xóa dòng | Của mình | Của đội | Tất cả | Tất cả |\n| Gửi duyệt | Của mình | Của đội | Có | Có |\n| Duyệt, Từ chối | Không | Không | Có (trừ kế hoạch mình lập hoặc gửi) | Có (trừ kế hoạch mình lập hoặc gửi) |\n| Rút Chờ duyệt, Từ chối về nháp | Của mình | Của đội | Có | Có |\n| Rút Đã duyệt về nháp | Không | Không | Có | Có |\n| Sinh chỉ tiêu | Khi là người phụ trách | Khi là người phụ trách | Có | Có |\n| Xóa kế hoạch Nháp | Không | Của đội | Có | Có |\n| Thêm, sửa, xóa, đánh dấu mốc | Của mình | Của đội | Có | Có |\n\n\"Của mình\" là kế hoạch mình phụ trách hoặc mình tạo. \"Của đội\" là kế hoạch thuộc đội mà mình là trưởng hoặc thành viên\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề và dòng \"N kế hoạch · M chờ duyệt\". N là số kế hoạch khớp bộ lọc; M là số kế hoạch Chờ duyệt trong N |\n| **Chọn loại kỳ** | `Tất cả`, `Năm`, `Quý`, `Tháng`. `Tất cả` hiện dạng cây năm → quý → tháng; các nút còn lại hiện danh sách phẳng |\n| **Ô tìm** | \"Tìm theo mã hoặc tên…\" |\n| **Lọc trạng thái** | Mọi trạng thái, Nháp, Chờ duyệt, Đã duyệt, Từ chối |\n| **Lọc thêm** | Người phụ trách, Đội, Kỳ (từ ngày – đến ngày), Của tôi |\n| **Nút `Xuất Excel`** | Xuất danh sách kế hoạch đang lọc |\n| **Nút `Tạo kế hoạch`** | Mở hộp tạo kế hoạch (mục 3) |\n| **Nhóm \"Chờ bạn duyệt · N\"** | Chỉ Trưởng/Phó phòng và BGĐ thấy: kế hoạch Chờ duyệt do người khác lập. Sau đó là nhóm \"Các kế hoạch khác\" |\n| **Dòng kế hoạch** | Tên, mã, chip trạng thái; dòng phụ: loại kỳ và kỳ áp dụng · ngân sách · người phụ trách (\"Chưa phân công\" nếu trống). Nhãn **Vượt kế hoạch cha** khi tổng các kế hoạch con vượt kế hoạch cha |\n| **Cột phải** | Chi tiết kế hoạch đang chọn (mục 2) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Kế hoạch → Kế hoạch Marketing → Kế hoạch năm / quý / tháng<\/strong><\/td><td>Hệ thống hiện các kế hoạch bạn được xem và tự chọn kế hoạch có kỳ chứa hôm nay, ưu tiên Tháng, rồi Quý, rồi Năm. Cùng loại kỳ thì ưu tiên kế hoạch Đã duyệt, rồi kế hoạch bạn phụ trách, rồi mã lớn nhất. Không có kế hoạch nào chứa hôm nay thì chọn dòng đầu<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn loại kỳ<\/td><td><code>Tất cả<\/code>: cây năm → quý → tháng, mỗi cấp xếp kỳ mới trước. <code>Năm<\/code>, <code>Quý<\/code>, <code>Tháng<\/code>: danh sách phẳng, ngày bắt đầu mới trước<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập từ khóa vào <strong>Ô tìm<\/strong><\/td><td>Tìm theo một phần mã hoặc tên, không phân biệt hoa thường và dấu. Ví dụ \"ke hoach\" khớp \"Kế hoạch\"; \"0013\" khớp <code>MKT-KH-0013<\/code>. Tối đa 100 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn trạng thái và các bộ lọc thêm<\/td><td>Danh sách hiện chip \"Đang lọc\" và nút <code>Xóa bộ lọc<\/code><br><strong>Của tôi<\/strong>: kế hoạch bạn phụ trách hoặc bạn tạo<br><strong>Kỳ<\/strong>: khớp kế hoạch có khoảng ngày giao một phần với khoảng đã chọn<br>Kế hoạch cha của dòng khớp vẫn hiện mờ để giữ cây; dòng mờ vẫn nhấn chọn được nhưng không tính vào số đếm<br>Nhấn <code>Xóa bộ lọc<\/code> để xóa mọi bộ lọc và cả ô tìm<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn một dòng kế hoạch<\/td><td>Cột phải hiện chi tiết ở tab <code>Tổng quan<\/code>. Bộ lọc và ô tìm giữ nguyên<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>KeHoachMarketing_yyyymmdd.xlsx<\/code> gồm các kế hoạch đang khớp bộ lọc (không gồm kế hoạch cha hiện mờ), các cột mã, tên, loại kỳ, kỳ, người phụ trách, ngân sách, trạng thái<br>Danh sách rỗng: hệ thống báo \"Không có dữ liệu để xuất.\" và không tải tệp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy kế hoạch nào:** Chuyên viên thấy kế hoạch mình phụ trách, mình tạo hoặc mình là thành viên kế hoạch (thành viên chỉ xem, không sửa, không gửi duyệt). Trưởng nhóm thấy kế hoạch của đội mình. Trưởng/Phó phòng và BGĐ thấy tất cả\n* Mỗi kế hoạch chỉ hiện một lần: kế hoạch đã nằm ở \"Chờ bạn duyệt\" thì không lặp lại ở \"Các kế hoạch khác\". Nhóm \"Chờ bạn duyệt\" cũng chịu ảnh hưởng của ô tìm và bộ lọc\n* Không có kế hoạch khớp: danh sách hiện \"Không có kế hoạch khớp bộ lọc.\"\n* Kế hoạch đang xem không còn khớp bộ lọc: chi tiết vẫn giữ, kèm dòng \"Không nằm trong bộ lọc hiện tại\"\n* Số tiền hiện rút gọn: từ 1 tỷ là \"tỷ\", từ 1 triệu là \"tr\", từ 1 nghìn là \"nghìn\", dưới 1 nghìn là \"đ\" (ví dụ 2.770.000.000 hiện \"2,77 tỷ\"). Di chuột lên số để xem giá trị đầy đủ\n* Lỗi tải dữ liệu: hệ thống hiện \"Không tải được dữ liệu\" và nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết kế hoạch<\/mark>\n\nChi tiết nằm ở cột phải, gồm 5 tab: `Tổng quan`, `Mục tiêu`, `Ngân sách`, `Mốc triển khai`, `Lịch sử & liên kết`. Đổi sang kế hoạch khác thì tab quay về `Tổng quan`\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên kế hoạch, chip trạng thái, chip giai đoạn (khi Đã duyệt), dòng \"mã · người phụ trách\" |\n| **Nút chính và menu `⋯`** | Một nút chính theo trạng thái và menu `⋯` (Thao tác khác). Xem bảng \"Nút theo trạng thái\" |\n| **Thanh bước** | Nháp → Chờ duyệt → Đã duyệt; Từ chối hiện riêng |\n| **Dòng người duyệt** | Khi Đã duyệt: \"Đã duyệt bởi &lt;tên&gt;, &lt;ngày giờ&gt;\" |\n| **Khung từ chối** | Khi Từ chối: khung gồm lý do, người từ chối và thời điểm. Kế hoạch rút từ Từ chối về Nháp hiện khung \"Lý do từ chối lần trước\" (chỉ lý do) tới khi gửi duyệt lại |\n| **Khối Kỳ áp dụng** | Loại kỳ, từ ngày – đến ngày, giai đoạn |\n| **Thẻ Ngân sách** | Tổng ngân sách rút gọn, kèm \"Đã phân bổ x%\" |\n| **Thành viên, Kế hoạch cha** | Danh sách thành viên; kế hoạch cha là liên kết, nhấn để mở |\n| **Thẻ Kế hoạch con** | Bảng kế hoạch con (liên kết) và ngân sách; dòng tổng và chênh lệch với kế hoạch này |\n| **Khối Cảnh báo** | Trùng kỳ, vượt kế hoạch cha, ngân sách còn lại chưa chia cho kế hoạch con, thiếu dữ liệu để gửi duyệt, kế hoạch cha chưa được duyệt |\n| **Dòng tiến độ** | \"n dòng mục tiêu · x/y mốc hoàn thành\" |\n\n**Nút theo trạng thái**\n\n| Trạng thái | Nút chính | Trong menu `⋯` |\n| --- | --- | --- |\n| **Nháp** | `Gửi duyệt` | `Sửa kế hoạch`, `Xóa`, `Xuất Excel` |\n| **Từ chối** | `Gửi duyệt` | `Sửa kế hoạch`, `Rút về nháp`, `Xuất Excel` |\n| **Chờ duyệt** | `Duyệt` | `Từ chối`, `Rút về nháp`, `Xuất Excel` |\n| **Đã duyệt** | `Sinh chỉ tiêu` (hoặc `Sinh lại chỉ tiêu`) | `Rút về nháp` (chỉ Trưởng/Phó phòng, BGĐ), `Xuất Excel` |\n\nNút bạn không có quyền sẽ không hiện. Không có nút nào thì menu `⋯` chỉ còn `Xuất Excel`\n\n### 2.1. Tab Mục tiêu\n\n<figure><img src=\"images/ke-hoach-marketing-2.png\" alt=\"\"><figcaption><p>Tab Mục tiêu của kế hoạch Đã duyệt: nút Thêm dòng thay bằng nhãn Đã khóa<\/p><\/figcaption><\/figure>\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bảng mục tiêu** | Cột Chỉ số, Nhãn sản phẩm, Kênh, Giá trị mục tiêu. Doanh thu, CPL hiện tiền rút gọn; Độ phủ hiện %; Lead hiện số. Nhãn hoặc kênh trống hiện \"-\" (toàn phòng) |\n| **Dòng Tổng** | Chỉ cho Lead và Doanh thu, tối đa 3 dòng: **Toàn phòng** (dòng không nhãn, không kênh), **Theo sản phẩm** (dòng có nhãn), **Theo kênh** (dòng có kênh, không nhãn). Ba dòng tổng là ba cách nhìn của cùng một mục tiêu, **không cộng với nhau** |\n| **Nút `Thêm dòng`** | Mở hộp thêm dòng mục tiêu (mục 4). Kế hoạch Chờ duyệt, Đã duyệt: thay bằng nhãn \"Đã khóa\" |\n| **Biểu tượng sửa, xóa** | Ở từng dòng khi kế hoạch chưa khóa |\n\nChưa có dòng: hiện \"Chưa có dòng mục tiêu nào.\"\n\n### 2.2. Tab Ngân sách\n\n<figure><img src=\"images/ke-hoach-marketing-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bảng ngân sách** | Cột Kênh, Số tiền dự kiến, Tỷ trọng (thanh nhỏ và %), dòng **Tổng** đậm. Tỷ trọng = số tiền dòng ÷ tổng ngân sách, làm tròn 1 chữ số thập phân |\n| **Dòng Điều chỉnh tăng** | Hiện khi đề nghị tăng ngân sách được BGĐ duyệt (xem [Phân bổ ngân sách](phan-bo-ngan-sach.md)); tính vào Tổng |\n| **Dòng Còn lại chưa phân bổ** | Ngân sách kế hoạch trừ tổng phân bổ đã tạo (mọi kỳ phân bổ gắn kế hoạch, mọi trạng thái). Âm thì hiện có dấu trừ |\n| **Khối \"Phân bổ ngân sách thực tế\"** | Khi Đã duyệt: nút `Mở phân bổ` mở màn [Phân bổ ngân sách](phan-bo-ngan-sach.md) đã lọc theo kế hoạch này |\n| **Nút `Thêm dòng`, biểu tượng sửa, xóa** | Như tab Mục tiêu (mục 5) |\n\n### 2.3. Tab Mốc triển khai\n\n<figure><img src=\"images/ke-hoach-marketing-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bảng mốc** | Cột Tên mốc, Từ ngày, Đến ngày, Người phụ trách, Trạng thái, ô **Hoàn thành** |\n| **Trạng thái mốc** | **Hoàn thành** (đã đánh dấu), **Trễ** (đến ngày trước hôm nay, chưa đánh dấu), **Đang triển khai** (từ ngày đến hôm nay), **Chưa bắt đầu** |\n| **Nút `Thêm mốc`** | Mở hộp thêm mốc với kế hoạch đang xem chọn sẵn (mục 6) |\n| **Nút `Xem trên lịch`** | Mở [Lịch triển khai](lich-trien-khai.md) ở tháng chứa mốc |\n\nChưa có mốc: hiện \"Chưa khai báo mốc triển khai nào.\"\n\n### 2.4. Tab Lịch sử & liên kết\n\n<figure><img src=\"images/ke-hoach-marketing-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thẻ Liên kết** | **Chỉ tiêu đã sinh**: \"n dòng · theo sản phẩm · theo kênh\" (nhấn để mở màn chỉ tiêu) hoặc \"Chưa sinh\". **Phân bổ ngân sách**: mã các kỳ phân bổ gắn kế hoạch, kèm \"Đã phân bổ / Ngân sách dự kiến\" (%). **Chiến dịch**: `Xem chiến dịch của kỳ` mở danh sách chiến dịch lọc theo khoảng ngày của kế hoạch |\n| **Thẻ Lịch sử** | Thời điểm (giờ Việt Nam), Người thực hiện, Hành động; mới nhất ở trên. Ghi: tạo, sửa, gửi duyệt, duyệt, từ chối kèm lý do, rút về nháp, sinh chỉ tiêu, thêm/sửa/xóa dòng, mốc, đánh dấu hoàn thành, đổi kế hoạch cha |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn một kế hoạch ở danh sách<\/td><td>Tab <code>Tổng quan<\/code> mở ra. Đọc <strong>Khối Cảnh báo<\/strong> (nếu có) để biết kế hoạch đang vướng gì<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn liên kết <strong>Kế hoạch cha<\/strong> hoặc một dòng ở <strong>Thẻ Kế hoạch con<\/strong><\/td><td>Hệ thống mở kế hoạch đó và đổi bộ chọn loại kỳ theo loại của nó<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chuyển tab <code>Mục tiêu<\/code>, <code>Ngân sách<\/code>, <code>Mốc triển khai<\/code>, <code>Lịch sử &amp; liên kết<\/code><\/td><td>Xem các dòng con và lịch sử của kế hoạch<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>⋯<\/code> → <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>&lt;mã&gt;_yyyymmdd.xlsx<\/code> của kế hoạch đang xem, gồm các sheet Tổng quan, Mục tiêu, Ngân sách, Mốc. Số tiền ghi đầy đủ (không rút gọn), ngày dạng dd/mm/yyyy<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Cảnh báo vượt kế hoạch cha** chỉ để nhắc, không chặn lưu hay gửi duyệt. Hệ thống so tổng ngân sách các kế hoạch con (Nháp, Chờ duyệt, Đã duyệt; không tính Từ chối) với ngân sách kế hoạch cha, và so tổng Lead, Doanh thu của kế hoạch con với dòng tương ứng của kế hoạch cha. Câu cảnh báo: \"Tổng ngân sách kế hoạch con vượt kế hoạch cha &lt;số tiền&gt;\". Độ phủ, CPL mục tiêu, Lợi nhuận gộp không được so\n* Kế hoạch cha chưa có ngân sách hoặc chưa có mục tiêu tương ứng thì không so, chỉ ghi \"Kế hoạch cha chưa lập ngân sách\" (\"chưa có mục tiêu tương ứng\")\n* Cảnh báo được tính lại mỗi khi mở chi tiết, lưu, sửa, xóa dòng của kế hoạch này hoặc kế hoạch cùng cha, và khi gửi duyệt. Người duyệt thấy cảnh báo ở tab `Tổng quan` để cân nhắc\n* **Trùng kỳ:** khối Cảnh báo liệt kê tối đa 3 mã kế hoạch trùng, rồi \"và n kế hoạch khác\". Bạn thấy được mã cả khi không có quyền mở kế hoạch đó\n* **\"Đã phân bổ\"** cộng mọi kỳ phân bổ gắn kế hoạch ở mọi trạng thái; vượt 100% vẫn hiện số thật. Tổng ngân sách bằng 0 thì hiện \"-\"\n\n## <mark style=\"color:green;\">3. Tạo và sửa kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Tạo kế hoạch<\/code><\/td><td>Hộp <strong>Tạo kế hoạch<\/strong> mở ra với giá trị mặc định: loại Tháng, Từ ngày là hôm nay, người phụ trách là bạn, đội là đội của bạn (nếu bạn thuộc đúng một đội)<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Loại kế hoạch<\/strong> (bắt buộc)<\/td><td>Năm, Quý hoặc Tháng. <strong>Không đổi được sau khi lưu<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Kế hoạch cha<\/strong> (bắt buộc với Quý, Tháng)<\/td><td>Ẩn khi loại là Năm. Tháng chỉ treo vào Quý, Quý chỉ treo vào Năm. Danh sách chỉ gồm kế hoạch đúng loại, có kỳ chứa khoảng ngày đang nhập, trạng thái khác Từ chối, hiện mã, tên, kỳ, đội. Bạn chọn được kế hoạch cha của người khác, không bắt buộc cùng đội<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Từ ngày<\/strong>, <strong>Đến ngày<\/strong> (bắt buộc)<\/td><td>Khi chọn loại kỳ và Từ ngày, hệ thống gợi ý Đến ngày: cộng 1 tháng (Tháng), 3 tháng (Quý), 12 tháng (Năm) rồi trừ 1 ngày. Ví dụ 01/10 loại Tháng gợi ý 31/10; 15/10 loại Tháng gợi ý 14/11; 01/10 loại Quý gợi ý 31/12<br>Bạn đã tự sửa Đến ngày thì hệ thống giữ giá trị của bạn, chỉ kiểm tra<br>Độ dài kỳ (tính cả hai đầu): Tháng 28–31 ngày, Quý 89–92 ngày, Năm 365–366 ngày. Kỳ không bắt buộc trùng tháng, quý, năm dương lịch<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhập <strong>Tên kế hoạch<\/strong> (bắt buộc, tối đa 255 ký tự)<\/td><td>Hệ thống gợi ý tên theo loại kỳ và kỳ, ví dụ \"Kế hoạch Marketing tháng 10/2026\", \"Kế hoạch Marketing quý 4/2026\"; bạn sửa được. Hai kế hoạch trùng tên vẫn được, phân biệt bằng mã<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Chọn <strong>Người phụ trách<\/strong> (bắt buộc)<\/td><td>Chọn trong mọi người dùng Marketing đang hoạt động, không buộc thuộc đội đã chọn<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Chọn <strong>Đội nhóm<\/strong> (bắt buộc)<\/td><td>Chuyên viên và Trưởng nhóm chỉ chọn được đội mình thuộc; Trưởng/Phó phòng và BGĐ chọn mọi đội. Bạn thuộc nhiều đội hoặc không thuộc đội nào thì ô để trống, phải chọn<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Chọn <strong>Thành viên<\/strong>, nhập <strong>Mô tả<\/strong> (không bắt buộc)<\/td><td>Thành viên chọn nhiều người; thành viên được xem kế hoạch nhưng không sửa. Mô tả tối đa 5.000 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td>Nhấn <code>Tạo kế hoạch<\/code><\/td><td>Hợp lệ: hộp đóng, kế hoạch lưu ở trạng thái Nháp với mã mới, được chọn ở tab <code>Tổng quan<\/code>, hệ thống báo \"Đã tạo kế hoạch &lt;mã&gt;.\"<br>Đã có kế hoạch cùng loại kỳ, cùng đội, khoảng ngày giao nhau: kế hoạch vẫn được lưu, kèm cảnh báo \"Đã có kế hoạch &lt;mã&gt; cùng kỳ\"<br>Có lỗi: hộp giữ nguyên, lỗi hiện ngay tại từng ô sai (xem bảng lỗi bên dưới)<br>Nhấn <code>Hủy<\/code> để đóng hộp, không lưu<\/td><\/tr>\n<tr><td><strong>Bước 10<\/strong><\/td><td>Sửa kế hoạch: nhấn <code>⋯<\/code> → <code>Sửa kế hoạch<\/code><\/td><td>Chỉ khi kế hoạch Nháp hoặc Từ chối. Hộp mở với dữ liệu hiện có, nút đổi thành <code>Lưu thay đổi<\/code>. Loại kế hoạch bị khóa. Lưu xong hệ thống báo \"Đã lưu thay đổi &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Tên trống | \"Nhập tên kế hoạch.\" |\n| Đến ngày trước Từ ngày | \"Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.\" |\n| Độ dài kỳ không khớp loại | \"Kế hoạch Tháng phải dài từ 28 đến 31 ngày.\" (Quý \"từ 89 đến 92 ngày\", Năm \"từ 365 đến 366 ngày\") |\n| Quý, Tháng chưa chọn kế hoạch cha | \"Chọn kế hoạch cha.\" |\n| Khoảng ngày nằm ngoài kỳ kế hoạch cha | \"Kỳ của kế hoạch phải nằm trong kỳ của kế hoạch cha.\" |\n| Chưa chọn người phụ trách, đội | \"Chọn người phụ trách.\", \"Chọn đội nhóm.\" |\n| Sửa kỳ kế hoạch cha làm kế hoạch con nằm ngoài | \"Kỳ mới làm kế hoạch con &lt;các mã&gt; nằm ngoài kỳ của kế hoạch này.\" |\n| Lỗi hệ thống khi lưu | \"Chưa lưu được, vui lòng thử lại.\" |\n\n### ⚠️ Lưu ý\n\n* **Đổi kế hoạch cha** sau khi lưu: chỉ Trưởng/Phó phòng, BGĐ, và chỉ khi kế hoạch còn Nháp. Với người khác hoặc khi kế hoạch Từ chối, ô bị khóa. Đổi xong hệ thống kiểm tra lại kỳ, tính lại cảnh báo và ghi lịch sử \"Đổi kế hoạch cha\"\n* Kế hoạch cha chưa Đã duyệt vẫn được chọn; kế hoạch con vẫn lưu, gửi duyệt, duyệt được, kèm cảnh báo \"Kế hoạch cha &lt;mã&gt; chưa được duyệt\"\n* Sửa kế hoạch Từ chối không tự đổi trạng thái; bạn phải nhấn `Gửi duyệt` lại\n* Kế hoạch cũ chưa đúng quy tắc mới (chưa có đội, kỳ sai độ dài…) vẫn giữ nguyên; khi mở sửa, bạn phải sửa các ô vi phạm mới lưu được\n* Mã kế hoạch cấp tuần tự khi lưu thành công; mã của kế hoạch đã xóa không dùng lại\n\n## <mark style=\"color:green;\">4. Thêm, sửa, xóa dòng mục tiêu<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-7.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở tab <code>Mục tiêu<\/code>, nhấn <code>Thêm dòng<\/code><\/td><td>Hộp <strong>Thêm dòng mục tiêu định lượng<\/strong> mở ra. Chỉ làm được khi kế hoạch Nháp hoặc Từ chối<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Chỉ số<\/strong> (bắt buộc)<\/td><td>Lead, Doanh thu, Độ phủ, CPL mục tiêu, Lợi nhuận gộp<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Nhãn sản phẩm<\/strong>, <strong>Kênh<\/strong> (không bắt buộc)<\/td><td>Chọn từ danh mục. Bỏ trống nghĩa là áp dụng toàn phòng<br>Lợi nhuận gộp bắt buộc chọn Kênh và không chọn Nhãn sản phẩm<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập <strong>Giá trị mục tiêu<\/strong> (bắt buộc)<\/td><td>Lớn hơn 0. Lead là số nguyên. Doanh thu, CPL mục tiêu, Lợi nhuận gộp là số tiền VND nguyên. Độ phủ là %, không quá 100, tối đa 2 chữ số thập phân. Tối đa 999.999.999.999. Dán được số có dấu chấm hàng nghìn<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Thêm dòng<\/code><\/td><td>Hợp lệ: dòng được thêm, hệ thống báo \"Đã thêm dòng mục tiêu.\" và tính lại cảnh báo so với kế hoạch cha<br>Nhấn <code>Hủy<\/code> để đóng, không lưu<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Sửa dòng: nhấn biểu tượng sửa ở dòng<\/td><td>Hộp mở với tiêu đề \"Sửa dòng mục tiêu\", nút <code>Lưu dòng<\/code>. Lưu xong hệ thống báo \"Đã lưu dòng mục tiêu.\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Xóa dòng: nhấn biểu tượng xóa ở dòng<\/td><td>Hộp xác nhận \"Xóa dòng mục tiêu này?\" (nút <code>Hủy<\/code> mặc định, <code>Xóa dòng<\/code>). Xóa xong hệ thống báo \"Đã xóa dòng mục tiêu.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Giá trị bằng 0 hoặc âm | \"Giá trị mục tiêu phải lớn hơn 0.\" |\n| Độ phủ ngoài khoảng (0, 100] | \"Độ phủ phải lớn hơn 0 và không quá 100.\" |\n| Lead có phần lẻ | \"Lead phải là số nguyên.\" |\n| Doanh thu, CPL, Lợi nhuận có phần lẻ | \"Giá trị phải là số nguyên.\" |\n| Vượt 999.999.999.999 | \"Giá trị không được vượt quá 999.999.999.999.\" |\n| Lợi nhuận gộp thiếu Kênh | \"Lợi nhuận gộp phải chọn Kênh.\" |\n| Lợi nhuận gộp có Nhãn sản phẩm | \"Lợi nhuận gộp chỉ đặt theo kênh, không chọn Nhãn sản phẩm.\" |\n| Trùng bộ (chỉ số, nhãn, kênh) trong cùng kế hoạch | \"Dòng này đã có trong kế hoạch\" |\n\n### ⚠️ Lưu ý\n\n* Dòng mục tiêu nào **thiếu cả nhãn và kênh** sẽ không sinh được chỉ tiêu. Dòng **Độ phủ** không sinh chỉ tiêu\n* Bạn được xóa dòng cuối cùng của kế hoạch Nháp, nhưng kế hoạch không còn dòng mục tiêu và dòng ngân sách nào thì không gửi duyệt được\n* Mọi thay đổi dòng đều ghi vào tab `Lịch sử & liên kết`\n\n## <mark style=\"color:green;\">5. Thêm, sửa, xóa dòng ngân sách<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-8.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở tab <code>Ngân sách<\/code>, nhấn <code>Thêm dòng<\/code><\/td><td>Hộp <strong>Thêm dòng ngân sách theo kênh<\/strong> mở ra. Chỉ làm được khi kế hoạch Nháp hoặc Từ chối<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Kênh<\/strong> (bắt buộc)<\/td><td>Chọn từ danh mục kênh, ví dụ Meta Ads, Google Ads, TikTok Ads, Zalo OA, Website/SEO, Giới thiệu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Chiến dịch<\/strong> (không bắt buộc)<\/td><td>Gắn dòng ngân sách với một chiến dịch cụ thể<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập <strong>Số tiền dự kiến (₫)<\/strong> (bắt buộc)<\/td><td>Số nguyên lớn hơn 0, tối đa 999.999.999.999<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Thêm dòng<\/code><\/td><td>Dòng được thêm, Tổng và Tỷ trọng cập nhật, cảnh báo so với kế hoạch cha được tính lại<br>Nhấn <code>Hủy<\/code> để đóng, không lưu<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Sửa hoặc xóa dòng bằng biểu tượng ở dòng<\/td><td>Sửa: hộp mở với dữ liệu hiện có, lưu xong báo \"Đã lưu dòng ngân sách.\"<br>Xóa: hộp xác nhận \"Xóa dòng ngân sách này?\" (nút <code>Hủy<\/code> mặc định, <code>Xóa dòng<\/code>), xóa xong báo \"Đã xóa dòng ngân sách.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Số tiền bằng 0 | \"Số tiền phải lớn hơn 0.\" |\n| Vượt 999.999.999.999 | \"Số tiền không được vượt quá 999.999.999.999.\" |\n| Trùng cặp (kênh, chiến dịch) | \"Dòng này đã có trong kế hoạch\" |\n\n### ⚠️ Lưu ý\n\n* Hai dòng cùng kênh nhưng khác chiến dịch là hai dòng khác nhau. Hai dòng cùng kênh và cùng **không** có chiến dịch là trùng\n* Ngân sách ở đây là **ngân sách dự kiến**. Phân bổ chi tiết theo kênh, chiến dịch, sản phẩm và theo dõi số đã dùng nằm ở [Phân bổ ngân sách](phan-bo-ngan-sach.md)\n\n## <mark style=\"color:green;\">6. Mốc triển khai<\/mark>\n\nMốc triển khai là các mốc theo dõi việc triển khai kế hoạch (ví dụ \"Hội chợ Cơ khí Hà Nội\", \"Chốt số liệu tháng\"). Mốc thêm ở tab `Mốc triển khai` hoặc ở [Lịch triển khai](lich-trien-khai.md) đều ghi vào cùng một danh sách mốc của kế hoạch\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở tab <code>Mốc triển khai<\/code>, nhấn <code>Thêm mốc<\/code><\/td><td>Hộp <strong>Thêm mốc triển khai<\/strong> mở ra với kế hoạch đang xem chọn sẵn. Cách nhập từng ô xem mục 3 trang <a href=\"lich-trien-khai.md\">Lịch triển khai<\/a><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Thêm mốc<\/code> trong hộp<\/td><td>Mốc được thêm, bạn ở lại tab <code>Mốc triển khai<\/code> và mốc mới được chọn. Hệ thống báo \"Đã thêm mốc &lt;tên&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đánh dấu ô <strong>Hoàn thành<\/strong><\/td><td>Mốc chuyển <strong>Hoàn thành<\/strong>, không còn Trễ. Bỏ đánh dấu thì trạng thái tính lại theo ngày<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Sửa mốc: nhấn biểu tượng sửa<\/td><td>Hộp mở với tiêu đề \"Sửa mốc triển khai\", nút <code>Lưu mốc<\/code>; đổi được tên, ngày, người phụ trách, ghi chú. Kế hoạch Chờ duyệt: chỉ sửa được Ghi chú<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Xóa mốc: nhấn biểu tượng xóa<\/td><td>Hộp xác nhận \"Xóa mốc &lt;tên&gt;?\" (nút <code>Hủy<\/code> mặc định, <code>Xóa mốc<\/code>). Xóa xong báo \"Đã xóa mốc &lt;tên&gt;.\" Kế hoạch Chờ duyệt không có nút xóa<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Xem trên lịch<\/code><\/td><td>Mở <a href=\"lich-trien-khai.md\">Lịch triển khai<\/a> ở tháng chứa mốc<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Khác với mục tiêu và ngân sách, **mốc vẫn thêm, sửa, xóa được khi kế hoạch Đã duyệt**. Khi kế hoạch Chờ duyệt: không thêm, xóa mốc, không sửa tên, ngày, người phụ trách; vẫn đánh dấu hoàn thành và sửa ghi chú được\n* Người làm được việc với mốc: người phụ trách kế hoạch, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. **Người phụ trách mốc** chỉ là thông tin hiển thị, không có thêm quyền\n* Mốc phải nằm trong kỳ của kế hoạch\n* \"Hôm nay\" tính theo giờ Việt Nam, đổi ngày lúc 00:00. Mốc có đến ngày là hôm nay vẫn là \"Đang triển khai\"; đến ngày là hôm qua thì \"Trễ\"\n\n## <mark style=\"color:green;\">7. Gửi duyệt kế hoạch<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kế hoạch Nháp hoặc Từ chối, nhấn <code>Gửi duyệt<\/code><\/td><td>Hệ thống kiểm tra kế hoạch đã đủ: tên, loại kỳ, khoảng ngày, người phụ trách, đội và <strong>ít nhất một dòng mục tiêu hoặc một dòng ngân sách<\/strong><br>Thiếu: hệ thống chặn và báo \"Chưa thể gửi duyệt. Còn thiếu: &lt;danh sách&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xác nhận nếu được hỏi<\/td><td>Nếu mọi dòng mục tiêu đều thiếu cả nhãn sản phẩm và kênh, hệ thống hỏi: \"Mọi dòng mục tiêu thiếu nhãn sản phẩm và kênh nên không sinh được chỉ tiêu. Vẫn gửi duyệt?\" Nhấn <code>Quay lại sửa<\/code> (mặc định) để bổ sung, hoặc <code>Vẫn gửi<\/code><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem kết quả<\/td><td>Kế hoạch chuyển <strong>Chờ duyệt<\/strong>, nội dung và các dòng bị khóa. Lý do, người và thời điểm từ chối cũ (nếu có) bị xóa. Hệ thống tạo việc \"Duyệt kế hoạch &lt;mã&gt;\" cho các Trưởng/Phó phòng (trừ người lập và người gửi); không còn ai thì giao BGĐ<br>Cảnh báo vượt kế hoạch cha (nếu có) hiện ở khối Cảnh báo<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Người bấm `Gửi duyệt` được ghi lại. Người đó **không được duyệt** vòng này, kể cả khi là Trưởng/Phó phòng hoặc BGĐ gửi hộ\n* Không còn ai khác có quyền duyệt (ngoài người lập và người gửi): kế hoạch giữ Chờ duyệt, người lập thấy \"Chưa có người khác có quyền duyệt kế hoạch này.\" Bạn có thể rút về nháp hoặc nhờ quản trị bổ sung người duyệt\n* Kế hoạch vừa bị người khác đổi trạng thái: hệ thống báo \"Kế hoạch &lt;mã&gt; đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\"\n\n## <mark style=\"color:green;\">8. Duyệt kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-9.png\" alt=\"\"><figcaption><p>Kế hoạch Chờ duyệt nằm ở nhóm \"Chờ bạn duyệt\", nút Duyệt ở đầu chi tiết<\/p><\/figcaption><\/figure>\n\nChỉ Trưởng/Phó phòng và BGĐ\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở nhóm <strong>Chờ bạn duyệt<\/strong> ở đầu danh sách, chọn kế hoạch<\/td><td>Nhóm chỉ gồm kế hoạch Chờ duyệt do người khác lập<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem tab <code>Tổng quan<\/code>, <code>Mục tiêu<\/code>, <code>Ngân sách<\/code><\/td><td>Đọc khối Cảnh báo (vượt kế hoạch cha, trùng kỳ, kế hoạch cha chưa duyệt) trước khi quyết định<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Duyệt<\/code><\/td><td>Kế hoạch chuyển <strong>Đã duyệt<\/strong>, ghi người và ngày duyệt (\"Đã duyệt bởi &lt;tên&gt;, &lt;ngày giờ&gt;\"). Người lập và người phụ trách nhận thông báo. Việc chờ duyệt của các người duyệt khác được đóng<br>Kế hoạch cha chưa Đã duyệt: vẫn duyệt được, kèm cảnh báo<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Không tự duyệt:** người lập kế hoạch và người bấm gửi duyệt vòng hiện tại thấy nút `Duyệt`, `Từ chối` bị khóa kèm chú giải \"Bạn không thể duyệt kế hoạch do chính mình lập hoặc gửi duyệt.\" Kế hoạch do Trưởng/Phó phòng lập thì Trưởng/Phó phòng khác hoặc BGĐ duyệt; do BGĐ lập thì BGĐ khác hoặc Trưởng/Phó phòng duyệt\n* Chuyên viên, Trưởng nhóm không thấy nút `Duyệt`. Nếu thao tác ngoài giao diện, hệ thống báo \"Chỉ Trưởng/Phó phòng hoặc Ban giám đốc được duyệt hay từ chối kế hoạch.\"\n* Mỗi kế hoạch chỉ một cấp duyệt, cho cả năm, quý, tháng\n* Hai người cùng duyệt một lúc: người đến sau nhận thông báo kế hoạch đã chuyển trạng thái\n\n## <mark style=\"color:green;\">9. Từ chối kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-10.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kế hoạch Chờ duyệt, nhấn <code>⋯<\/code> → <code>Từ chối<\/code><\/td><td>Hộp <strong>Từ chối kế hoạch<\/strong> mở ra. Cùng điều kiện quyền như <code>Duyệt<\/code><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Lý do từ chối<\/strong> (bắt buộc, tối đa 1.000 ký tự)<\/td><td>Nêu rõ điểm cần sửa để người lập chỉnh lại. Người lập nhận được lý do này kèm thông báo<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Từ chối kế hoạch<\/code><\/td><td>Lý do trống: hệ thống báo \"Chưa nhập lý do từ chối.\" và giữ hộp<br>Thành công: kế hoạch chuyển <strong>Từ chối<\/strong>, hệ thống báo \"Đã từ chối &lt;mã&gt;. Người lập nhận được lý do.\" Tab <code>Tổng quan<\/code> hiện khung gồm lý do, người từ chối và thời điểm<br>Nhấn <code>Hủy<\/code> để đóng, không đổi gì<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Người lập sửa và gửi lại<\/td><td>Người lập nhấn <code>⋯<\/code> → <code>Sửa kế hoạch<\/code>, sửa theo lý do, rồi nhấn <code>Gửi duyệt<\/code> (mục 7)<\/td><\/tr>\n<\/tbody><\/table>\n\n## <mark style=\"color:green;\">10. Rút kế hoạch về nháp<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-11.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Rút kế hoạch <strong>Chờ duyệt<\/strong> hoặc <strong>Từ chối<\/strong>: nhấn <code>⋯<\/code> → <code>Rút về nháp<\/code><\/td><td>Người phụ trách, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ làm được. Hệ thống không hỏi xác nhận; kế hoạch về <strong>Nháp<\/strong> và mở khóa để sửa. Kế hoạch rút từ Từ chối giữ khung \"Lý do từ chối lần trước\" tới khi gửi duyệt lại<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Rút kế hoạch <strong>Đã duyệt<\/strong>: nhấn <code>⋯<\/code> → <code>Rút về nháp<\/code><\/td><td>Chỉ Trưởng/Phó phòng, BGĐ. Hộp <strong>Rút kế hoạch đã duyệt về nháp?<\/strong> hiện: \"Chữ ký duyệt của &lt;người duyệt&gt; sẽ bị hủy. Kế hoạch mở khóa để sửa và phải gửi duyệt lại.\" kèm số chỉ tiêu và các kỳ phân bổ đã sinh từ kế hoạch<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Rút về nháp<\/code> (hoặc <code>Hủy<\/code>, mặc định)<\/td><td>Kế hoạch về Nháp, người và ngày duyệt bị xóa<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Khi rút kế hoạch Đã duyệt: **chỉ tiêu và phân bổ đã sinh vẫn giữ nguyên** nhưng được gắn cờ **\"Không còn căn cứ đã duyệt\"** cho tới khi kế hoạch được duyệt lại. Trong thời gian đó, không tạo được kỳ phân bổ mới từ kế hoạch; kỳ phân bổ đã có bị chặn thêm, sửa dòng, gửi duyệt và duyệt\n* Cờ chỉ để nhắc, không làm thay đổi số liệu báo cáo và bảng điều khiển\n* \"Chữ ký duyệt\" ở đây là người và ngày duyệt được ghi trên kế hoạch\n* Kế hoạch có đề nghị tăng ngân sách đang chờ duyệt thì đề nghị đó tự hủy khi kế hoạch bị rút về nháp\n\n## <mark style=\"color:green;\">11. Sinh chỉ tiêu từ kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-marketing-12.png\" alt=\"\"><figcaption><p>Hộp xác nhận khi sinh lại chỉ tiêu<\/p><\/figcaption><\/figure>\n\nChỉ người phụ trách kế hoạch và Trưởng/Phó phòng, BGĐ; chỉ với kế hoạch **Đã duyệt**\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kế hoạch Đã duyệt, nhấn <code>Sinh chỉ tiêu<\/code><\/td><td>Hệ thống gộp các dòng mục tiêu theo bộ (nhãn sản phẩm, kênh): mỗi bộ thành <strong>một chỉ tiêu<\/strong> chứa Lead, Doanh thu, CPL mục tiêu (và Lợi nhuận gộp)<br>Dòng có nhãn (có hoặc không có kênh) sinh chỉ tiêu <strong>theo sản phẩm<\/strong>; dòng chỉ có kênh sinh chỉ tiêu <strong>theo kênh<\/strong>. Dòng Lợi nhuận gộp sinh sang chỉ tiêu theo kênh<br>Bỏ qua dòng Độ phủ và dòng thiếu cả nhãn và kênh<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem kết quả<\/td><td>Hệ thống báo số chỉ tiêu <strong>thực tế đã tạo hoặc cập nhật<\/strong>, kèm liên kết sang màn chỉ tiêu. Kế hoạch vẫn Đã duyệt. Nút chính đổi thành <code>Sinh lại chỉ tiêu<\/code><br>Không có dòng nào sinh được: hệ thống báo \"Kế hoạch chưa có dòng mục tiêu sinh được chỉ tiêu (cần Lead, Doanh thu, CPL hoặc Lợi nhuận gộp kèm nhãn hoặc kênh)\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Sinh lại: nhấn <code>Sinh lại chỉ tiêu<\/code><\/td><td>Hộp <strong>Sinh lại chỉ tiêu?<\/strong> hiện: \"Kế hoạch đã sinh &lt;n&gt; chỉ tiêu lúc &lt;thời điểm&gt;. Sinh lại sẽ cập nhật giá trị theo mục tiêu hiện tại, không tạo thêm dòng trùng. Kết quả thực tế đã ghi nhận được giữ nguyên.\" Nếu có chỉ tiêu không còn dòng mục tiêu tương ứng, hộp thêm câu \"&lt;k&gt; chỉ tiêu không còn dòng mục tiêu tương ứng sẽ bị xóa.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Sinh lại chỉ tiêu<\/code> trong hộp (hoặc <code>Hủy<\/code>)<\/td><td>Chỉ tiêu được tính lại từ đầu theo mục tiêu hiện tại (không cộng vào giá trị cũ). Chỉ tiêu không còn dòng mục tiêu tương ứng bị xóa. Chỉ tiêu tạo tay không bị ảnh hưởng<\/td><\/tr>\n<\/tbody><\/table>\n\n**Ví dụ:** kế hoạch có 5 dòng: Lead nhãn A kênh Meta 300; Doanh thu nhãn A kênh Meta 900 triệu; CPL nhãn A kênh Meta 150 nghìn; Lead kênh Google 200; Độ phủ nhãn B 60%. Sinh chỉ tiêu tạo **2 chỉ tiêu**: (1) theo sản phẩm, nhãn A kênh Meta: Lead 300, Doanh thu 900 triệu, CPL 150 nghìn; (2) theo kênh Google: Lead 200. Dòng Độ phủ bị bỏ qua\n\n### ⚠️ Lưu ý\n\n* Chỉ tiêu sinh từ kế hoạch **không sửa trực tiếp** ở màn chỉ tiêu. Muốn đổi, sửa mục tiêu ở kế hoạch (rút về nháp, sửa, duyệt lại) rồi sinh lại\n* Giai đoạn Chưa bắt đầu hay Đã kết thúc không chặn sinh chỉ tiêu\n* Lỗi khi sinh: hệ thống báo \"Chưa sinh được chỉ tiêu, vui lòng thử lại.\" và không để lại chỉ tiêu tạo dở\n\n## <mark style=\"color:green;\">12. Xóa kế hoạch<\/mark>\n\nChỉ Trưởng nhóm (kế hoạch của đội mình), Trưởng/Phó phòng, BGĐ. Chuyên viên không xóa được\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kế hoạch Nháp, nhấn <code>⋯<\/code> → <code>Xóa<\/code><\/td><td>Hộp xác nhận \"Xóa kế hoạch &lt;mã&gt;?\" kèm \"Kế hoạch cùng dòng mục tiêu, ngân sách, mốc và lịch sử sẽ bị xóa, không khôi phục được.\" (nút <code>Hủy<\/code> mặc định, <code>Xóa<\/code>)<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Xóa<\/code><\/td><td>Thành công: hệ thống báo \"Đã xóa kế hoạch &lt;mã&gt;.\" và chọn lại kế hoạch mặc định<br>Bị chặn: hệ thống liệt kê mọi lý do, mỗi lý do một dòng (xem bảng dưới)<\/td><\/tr>\n<\/tbody><\/table>\n\n| Lý do bị chặn | Thông báo |\n| --- | --- |\n| Kế hoạch không ở Nháp | \"Chỉ xóa được kế hoạch ở trạng thái Nháp.\" |\n| Có kế hoạch con | \"Kế hoạch có kế hoạch con nên không xóa được.\" |\n| Đã sinh chỉ tiêu | \"Kế hoạch đã sinh chỉ tiêu nên không xóa được.\" |\n| Đã có phân bổ ngân sách | \"Kế hoạch đã có phân bổ ngân sách nên không xóa được.\" |\n\n### ⚠️ Lưu ý\n\n* Kế hoạch Từ chối phải rút về nháp trước rồi mới xóa được\n* Mã của kế hoạch đã xóa không được cấp lại\n", "ke-hoach/lich-trien-khai.md": "# Lịch triển khai\n\n🧭 Tổng quan chức năng: Màn lịch gộp bốn loại hoạt động: mốc triển khai của kế hoạch, chiến dịch, bài đăng và nội dung chưa có bài đăng, giúp cả phòng theo dõi việc gì đang chạy, việc gì trễ. Mọi người trong phòng Marketing đều xem được; người có quyền với kế hoạch thì thêm mốc và đánh dấu mốc hoàn thành\n\nTruy cập: menu **Kế hoạch → Kế hoạch Marketing → Lịch triển khai**. Nhấn `Xem trên lịch` ở tab **Mốc triển khai** của [Kế hoạch Marketing](ke-hoach-marketing.md) cũng mở màn này ở tháng chứa mốc\n\n{% hint style=\"info\" %}\n\n## CÁCH ĐỌC LỊCH\n\nLịch là màn **chỉ đọc**: chiến dịch, bài đăng, nội dung được sửa ở màn gốc của chúng; lịch chỉ hiển thị. Riêng mốc triển khai được thêm và đánh dấu hoàn thành ngay tại đây\n\n**Bốn nguồn hoạt động:**\n\n* **Mốc kế hoạch**: mốc triển khai thuộc một kế hoạch Marketing\n* **Chiến dịch**: chiến dịch đang hoạt động, không bị từ chối\n* **Bài đăng**: bài đăng lên kênh, không bị hủy\n* **Nội dung (chưa lên lịch)**: nội dung chưa có bài đăng nào (bài đã hủy không tính)\n\n**Bốn trạng thái:**\n\n* **Chưa bắt đầu**: chưa tới ngày bắt đầu\n* **Đang triển khai**: đang trong khoảng ngày\n* **Hoàn thành**: đã xong\n* **Trễ**: đã qua ngày kết thúc mà chưa xong\n\n**Cách tính trạng thái theo từng nguồn:**\n\n| Nguồn | Hoàn thành | Trễ | Còn lại |\n| --- | --- | --- | --- |\n| **Mốc kế hoạch** | Đã đánh dấu hoàn thành | Đến ngày trước hôm nay, chưa đánh dấu | Đã tới từ ngày: Đang triển khai; chưa tới: Chưa bắt đầu |\n| **Chiến dịch** | Đã kết thúc và đã từng chạy (thanh lịch kết thúc ở ngày kết thúc thực tế) | Đã kết thúc mà chưa từng chạy; hoặc chưa chạy mà đã qua ngày kết thúc | Đang chạy, kể cả Tạm dừng: Đang triển khai. Chưa chạy: so ngày |\n| **Bài đăng** | Đã đăng | Bị lỗi; hoặc qua ngày đăng mà chưa đăng | Ngày đăng sau hôm nay: Chưa bắt đầu; bằng hôm nay: Đang triển khai |\n| **Nội dung** | Không bao giờ | Quá ngày đăng dự kiến mà chưa có bài đăng | So ngày |\n\n\"Hôm nay\" tính theo giờ Việt Nam, đổi ngày lúc 00:00\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem lịch theo tháng, theo tuần<\/mark>\n\n<figure><img src=\"images/lich-trien-khai-1.png\" alt=\"\"><figcaption><p>Chế độ Tháng<\/p><\/figcaption><\/figure>\n\n<figure><img src=\"images/lich-trien-khai-2.png\" alt=\"\"><figcaption><p>Chế độ Tuần, kèm thẻ Chưa lên lịch và bảng Danh sách hoạt động<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề và dòng \"a hoạt động trong tháng m/yyyy · b chưa lên lịch\" (chế độ Tuần ghi khoảng tuần) |\n| **Nút `Xuất Excel`** | Xuất danh sách hoạt động của khoảng đang xem |\n| **Nút `Thêm mốc`** | Mở hộp thêm mốc triển khai (mục 3) |\n| **Bộ lọc** | Nguồn, Kênh, Đội, Người phụ trách, Trạng thái |\n| **Thanh điều hướng** | Nút `<` `>` (tháng trước, tháng sau hoặc tuần trước, tuần sau), nhãn khoảng đang xem, `Hôm nay`; nút `Tháng`, `Tuần` để đổi chế độ |\n| **Thẻ \"Kéo dài nhiều ngày (n)\"** | Chỉ ở chế độ Tháng: hoạt động dài từ 8 ngày trở lên hiện thành thanh ngang trên trục ngày của tháng, có vạch \"hôm nay\" và nhãn \"dd/mm – dd/mm\". Các hoạt động này không lặp lại trong từng ô ngày |\n| **Lưới lịch** | Cột T2 đến CN (tuần bắt đầu thứ Hai). Ô ngoài tháng hiện mờ; ô hôm nay có viền. Mỗi ô hiện tối đa 3 hoạt động rồi \"+n mục\" |\n| **Chú giải** | Bốn trạng thái |\n| **Thẻ \"Chưa lên lịch (n)\"** | Nội dung chưa có ngày đăng dự kiến: tên, nguồn, nút `Xếp lịch` |\n| **Bảng \"Danh sách hoạt động (n)\"** | Cột Hoạt động (nhấn để mở chi tiết), Nguồn, Thời gian, Kênh, Chiến dịch liên quan (mã và tên), Trạng thái. Ô không có dữ liệu hiện \"-\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Kế hoạch → Kế hoạch Marketing → Lịch triển khai<\/strong><\/td><td>Lịch mở ở chế độ <code>Tháng<\/code>, tháng hiện tại, chỉ gồm hoạt động trong phạm vi bạn được xem<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>&lt;<\/code>, <code>&gt;<\/code> hoặc <code>Hôm nay<\/code><\/td><td>Lịch, số đếm và bảng hoạt động vẽ lại theo khoảng mới. <code>Hôm nay<\/code> đưa về tháng (hoặc tuần) chứa hôm nay<br>Tháng không có hoạt động: hiện \"Không có hoạt động trong tháng này\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Tuần<\/code> hoặc <code>Tháng<\/code><\/td><td>Chế độ <code>Tuần<\/code> hiện 7 ngày; hoạt động dài hiện như hoạt động thường trong từng ô ngày nó đi qua<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn bộ lọc Nguồn, Kênh, Đội, Người phụ trách, Trạng thái<\/td><td>Lịch và bảng chỉ còn các hoạt động khớp<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn \"+n mục\" trong một ô ngày<\/td><td>Hiện đủ các hoạt động của ngày đó. Thứ tự trong ô: Mốc, Chiến dịch, Bài đăng, Nội dung, rồi theo tên<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Xếp lịch<\/code> ở thẻ <strong>Chưa lên lịch<\/strong><\/td><td>Mở <a href=\"../noi-dung-va-media/ke-hoach-noi-dung.md\">Kế hoạch nội dung<\/a> để chọn ngày cho nội dung. Sau khi có ngày, nội dung chuyển lên lưới lịch<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn một hoạt động trên lưới, trên thanh ngang hoặc ở bảng<\/td><td>Cột phải mở chi tiết hoạt động (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>LichTrienKhai_yyyymmdd_yyyymmdd.xlsx<\/code> (ngày đầu, ngày cuối khoảng đang xem) gồm các cột hoạt động, nguồn, thời gian, kênh, chiến dịch, người phụ trách, trạng thái<br>Không có hoạt động: hệ thống báo \"Không có dữ liệu để xuất.\" và không tải tệp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Số đếm và bảng \"Danh sách hoạt động\"** chỉ tính hoạt động có ngày giao với tháng hoặc tuần đang xem, xếp theo ngày bắt đầu rồi theo tên\n* **Mục chưa lên lịch** không tính vào số hoạt động và không nằm trong bảng; chỉ nằm ở thẻ \"Chưa lên lịch\". Số \"b chưa lên lịch\" là tổng mọi mục chưa có ngày, không đổi khi chuyển tháng\n* Hoạt động kéo qua hai tháng: thanh ngang bị cắt ở biên tháng đang xem, nhãn vẫn ghi đủ khoảng ngày (thêm năm khi khác năm đang xem)\n* **Chiến dịch liên quan**: chiến dịch lấy chính nó; bài đăng lấy chiến dịch của bài đăng; mốc và nội dung chưa lên lịch hiện \"-\"\n* **Ai thấy gì:** mốc theo quyền xem kế hoạch (xem [Kế hoạch Marketing](ke-hoach-marketing.md)); chiến dịch, bài đăng, nội dung theo quyền xem ở màn gốc\n* Lịch chưa hỗ trợ kéo-thả đổi ngày, xem dạng Gantt, đồng bộ Google Calendar/Outlook, xuất PDF\n* Lỗi tải: hệ thống hiện \"Không tải được lịch\" và nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết một hoạt động<\/mark>\n\n<figure><img src=\"images/lich-trien-khai-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên hoạt động, nguồn, nút `Mở bản ghi gốc`, nút X để đóng |\n| **Bảng thông tin** | Nguồn, Kênh, Chiến dịch liên quan, Fanpage (chỉ bài đăng có Fanpage), Thời gian, Trạng thái, Người phụ trách, Đội nhóm, Kế hoạch (chỉ với mốc, nhấn để mở kế hoạch) |\n| **Khung trễ hạn** | Khi trạng thái Trễ: khung ghi lý do theo nguồn |\n| **Nút `Đánh dấu hoàn thành`** | Chỉ với mốc; mốc đã hoàn thành thì nút là `Bỏ đánh dấu hoàn thành` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn một hoạt động<\/td><td>Cột phải mở chi tiết; lịch thu hẹp lại. Nhấn X để đóng, lịch chiếm lại cả chiều rộng<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc <strong>Khung trễ hạn<\/strong> (nếu có)<\/td><td>Mốc: \"Ngày kết thúc &lt;ngày&gt; đã qua mà chưa đánh dấu hoàn thành.\"<br>Chiến dịch chưa chạy đã qua ngày kết thúc: \"Chiến dịch đã qua ngày kết thúc &lt;ngày&gt; mà chưa chạy.\"<br>Chiến dịch đã kết thúc mà chưa từng chạy: \"Chiến dịch đã kết thúc mà chưa chạy.\"<br>Bài đăng lỗi: \"Bài đăng bị lỗi, chưa đăng được.\"<br>Bài đăng quá ngày: \"Bài đăng đã qua ngày dự kiến &lt;ngày&gt; mà chưa đăng.\"<br>Nội dung: \"Nội dung đã qua ngày đăng dự kiến &lt;ngày&gt; mà chưa có bài đăng.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Với mốc: nhấn <code>Đánh dấu hoàn thành<\/code><\/td><td>Mốc chuyển <strong>Hoàn thành<\/strong>, không còn Trễ; lịch vẽ lại. Nhấn <code>Bỏ đánh dấu hoàn thành<\/code> để trạng thái tính lại theo ngày. Thao tác được ghi vào lịch sử của kế hoạch<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Mở bản ghi gốc<\/code><\/td><td>Mốc: mở kế hoạch chứa mốc ở tab <code>Mốc triển khai<\/code>, chọn sẵn mốc<br>Chiến dịch, Bài đăng, Nội dung: mở đúng bản ghi ở màn gốc (<a href=\"../chien-dich/danh-sach-chien-dich.md\">Danh sách chiến dịch<\/a>, <a href=\"../noi-dung-va-media/lich-xuat-ban.md\">Lịch xuất bản<\/a>, <a href=\"../noi-dung-va-media/yeu-cau-noi-dung.md\">Yêu cầu nội dung<\/a>…)<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* `Đánh dấu hoàn thành` chỉ hiện với người phụ trách kế hoạch, người tạo kế hoạch, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. Nút dùng được cả khi kế hoạch đang Chờ duyệt hay Đã duyệt\n* Nút `Mở bản ghi gốc` bị khóa kèm chú giải khi:\n  * không có bản ghi gốc: \"Chưa có bản ghi gốc để mở\";\n  * bạn không có quyền xem bản ghi gốc: \"Bạn không có quyền xem bản ghi này\"\n* Bản ghi gốc bị xóa sau khi bạn tải lịch: hệ thống báo \"Bản ghi gốc không còn.\" và tải lại lịch\n\n## <mark style=\"color:green;\">3. Thêm mốc triển khai<\/mark>\n\n<figure><img src=\"images/lich-trien-khai-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nMốc thêm ở đây được ghi vào danh sách mốc của kế hoạch đã chọn, cùng chỗ với tab **Mốc triển khai** của [Kế hoạch Marketing](ke-hoach-marketing.md)\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Thêm mốc<\/code><\/td><td>Hộp <strong>Thêm mốc triển khai<\/strong> mở ra. Mở từ tab Mốc triển khai của kế hoạch thì kế hoạch đang xem được chọn sẵn<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Tên mốc<\/strong> (bắt buộc, tối đa 255 ký tự)<\/td><td>Ví dụ \"Hội chợ Cơ khí Hà Nội\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Kế hoạch<\/strong> (bắt buộc)<\/td><td>Mặc định là kế hoạch Tháng có kỳ chứa hôm nay (nhiều kế hoạch khớp thì ưu tiên kế hoạch bạn phụ trách, rồi kế hoạch của đội bạn, rồi mã lớn nhất). Danh sách chỉ gồm kế hoạch Nháp, Từ chối, Đã duyệt mà bạn được thêm mốc. Kế hoạch Năm, Quý cũng thêm mốc được<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Từ ngày<\/strong>, <strong>Đến ngày<\/strong> (bắt buộc)<\/td><td>Mặc định hôm nay. Đến ngày phải sau hoặc bằng Từ ngày; cả hai phải nằm trong kỳ của kế hoạch đã chọn<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Chọn <strong>Đội nhóm<\/strong> (không bắt buộc)<\/td><td>Mặc định đội của kế hoạch<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Chọn <strong>Người phụ trách<\/strong> (bắt buộc)<\/td><td>Mặc định là bạn. Người phụ trách mốc chỉ để hiển thị, không có thêm quyền<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhập <strong>Ghi chú<\/strong> (không bắt buộc, tối đa 1.000 ký tự)<\/td><td><\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Nhấn <code>Thêm mốc<\/code><\/td><td>Hợp lệ: hộp đóng, hệ thống báo \"Đã thêm mốc &lt;tên&gt;.\", lịch nhảy tới tháng của Từ ngày và chọn mốc mới. Mở từ tab Mốc triển khai thì bạn ở lại tab đó<br>Có lỗi: hộp giữ nguyên dữ liệu, lỗi hiện tại ô sai<br>Nhấn <code>Hủy<\/code> để đóng, không ghi mốc<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Tên trống | \"Nhập tên mốc.\" |\n| Đến ngày trước Từ ngày | \"Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.\" |\n| Mốc ngoài kỳ kế hoạch | \"Mốc phải nằm trong kỳ của kế hoạch.\" |\n| Vượt độ dài | \"Tên mốc tối đa 255 ký tự.\", \"Ghi chú tối đa 1.000 ký tự.\" |\n| Lỗi hệ thống | \"Chưa lưu được mốc, vui lòng thử lại.\" |\n\n### ⚠️ Lưu ý\n\n* Người thêm được mốc: người phụ trách kế hoạch, người tạo kế hoạch, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. Thành viên kế hoạch chỉ xem\n* Kế hoạch **Chờ duyệt** không nằm trong danh sách chọn vì đang khóa thêm mốc\n* Sửa, xóa mốc làm ở tab **Mốc triển khai** của kế hoạch; xem mục 6 trang [Kế hoạch Marketing](ke-hoach-marketing.md)\n", "ke-hoach/phan-bo-ngan-sach.md": "# Phân bổ ngân sách\n\n🧭 Tổng quan chức năng: Màn dùng để chia ngân sách của một kế hoạch Marketing **đã duyệt** thành các kỳ phân bổ, mỗi kỳ gồm các dòng theo kênh, chiến dịch, sản phẩm; theo dõi số đã dùng so với phân bổ; và kiểm soát để tổng phân bổ không vượt ngân sách kế hoạch. Trưởng nhóm và Trưởng/Phó phòng lập phân bổ; Trưởng/Phó phòng, BGĐ duyệt, khóa, đóng kỳ; BGĐ duyệt đề nghị tăng ngân sách; Chuyên viên xem\n\nTruy cập: menu **Kế hoạch → Ngân sách và mục tiêu → Phân bổ ngân sách**. Nhấn `Mở phân bổ` ở tab **Ngân sách** của [Kế hoạch Marketing](ke-hoach-marketing.md) cũng mở màn này, đã lọc theo kế hoạch đó\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH PHÂN BỔ NGÂN SÁCH\n\nBước 1: **Có kế hoạch đã duyệt**. Ngân sách của kế hoạch Marketing Đã duyệt là hạn mức cho mọi kỳ phân bổ của kế hoạch đó. Xem [Kế hoạch Marketing](ke-hoach-marketing.md)\n\nBước 2: **Tạo kỳ phân bổ**. Trưởng nhóm hoặc Trưởng/Phó phòng, BGĐ nhấn `Tạo phân bổ`, chọn kế hoạch, khoảng ngày, đội và nhập dòng phân bổ đầu tiên. Kỳ ở trạng thái **Đang phân bổ**, mã dạng `MKT-PB-0010`. Xem mục 3\n\nBước 3: **Thêm dòng phân bổ**. Thêm các dòng theo kênh, chiến dịch, sản phẩm. Mỗi lần lưu dòng, hệ thống kiểm tra tổng phân bổ so với ngân sách kế hoạch. Xem mục 4 và mục 6\n\nBước 4: **Gửi duyệt**. Trưởng nhóm hoặc Trưởng/Phó phòng, BGĐ nhấn `Gửi duyệt`. Kỳ chuyển **Chờ duyệt**, khóa nội dung và các dòng. Xem mục 5\n\nBước 5: **Duyệt**. Trưởng/Phó phòng hoặc BGĐ (không phải người tạo kỳ, không phải người gửi duyệt) nhấn `Duyệt`. Kỳ chuyển **Đã duyệt**\n\nBước 6: **Khóa phân bổ**. Trưởng/Phó phòng, BGĐ nhấn `Khóa phân bổ` để cho triển khai. Kỳ chuyển **Đã khóa**\n\nBước 7: **Đóng kỳ**. Hết kỳ, Trưởng/Phó phòng, BGĐ nhấn `Đóng kỳ`. Kỳ chuyển **Đã đóng kỳ**, không mở lại được\n\nKhi cần thêm ngân sách: Trưởng/Phó phòng gửi **Đề nghị tăng ngân sách**, BGĐ duyệt. Xem mục 7\n\n**Trạng thái kỳ phân bổ:**\n\n* **Đang phân bổ**: nháp; thêm, sửa, xóa dòng và xóa kỳ được\n* **Chờ duyệt**: đã gửi, chờ Trưởng/Phó phòng, BGĐ quyết định. Khóa nội dung và dòng\n* **Đã duyệt**: số phân bổ đã được chấp thuận; còn `Về nháp` được\n* **Đã khóa**: cho triển khai, chốt số phân bổ. Không về nháp trực tiếp (phải `Mở khóa` về Đã duyệt trước). Chỉ kỳ Đã khóa mới đóng kỳ được\n* **Đã đóng kỳ**: chốt cuối, không mở lại. Số đã dùng vẫn cập nhật theo chi phí đồng bộ muộn\n\n**Ai làm được gì:**\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng | BGĐ |\n| --- | --- | --- | --- | --- |\n| Xem kỳ phân bổ | Mình phụ trách hoặc mình tạo | Của đội | Tất cả | Tất cả |\n| Tạo kỳ; thêm, sửa, xóa dòng (khi Đang phân bổ) | Không | Của đội | Có | Có |\n| Gửi duyệt | Không | Của đội | Có | Có |\n| Duyệt kỳ | Không | Không | Có (trừ kỳ mình tạo hoặc gửi) | Có (trừ kỳ mình tạo hoặc gửi) |\n| Khóa, Mở khóa, Đóng kỳ, Về nháp | Không | Không | Có | Có |\n| Xóa kỳ (Đang phân bổ, chưa có chi phí thực) | Không | Không | Có | Có |\n| Gửi đề nghị tăng ngân sách | Không | Không | Có | Không |\n| Duyệt, từ chối đề nghị tăng ngân sách | Không | Không | Không | Có |\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách kỳ phân bổ<\/mark>\n\n<figure><img src=\"images/phan-bo-ngan-sach-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề và dòng \"N kỳ phân bổ\" |\n| **Ô tìm** | \"Tìm theo mã hoặc tên…\" |\n| **Nút `Xuất Excel`** | Xuất danh sách kỳ đang lọc |\n| **Nút `Tạo phân bổ`** | Mở hộp tạo kỳ phân bổ (mục 3). Chỉ Trưởng nhóm, Trưởng/Phó phòng, BGĐ thấy |\n| **Lọc khoảng thời gian** | Ngày, Tuần, Tháng, Năm, Tùy chỉnh; mặc định **Tháng** |\n| **Chip trạng thái** | Tất cả, Đang phân bổ, Chờ duyệt, Đã duyệt, Đã khóa, Đã đóng kỳ |\n| **Khối tổng hợp** | **Được duyệt** (tổng ngân sách các kế hoạch gắn, mỗi kế hoạch tính một lần), **Đã phân bổ**, **Chưa phân bổ**, **Đã sử dụng**, **Còn lại** (= Đã phân bổ − Đã sử dụng) |\n| **Thẻ kỳ** | Tên, chip trạng thái, nhãn **Sắp vượt** / **Vượt**, mã, khoảng ngày, \"Phân bổ &lt;tiền&gt;\", \"đã dùng x%\", thanh tiến độ |\n| **Cột phải** | Chi tiết kỳ đang chọn (mục 2). Chưa chọn kỳ: \"Chọn một kỳ phân bổ để xem chi tiết.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Kế hoạch → Ngân sách và mục tiêu → Phân bổ ngân sách<\/strong><\/td><td>Hệ thống hiện các kỳ bạn được xem, có khoảng ngày giao với tháng hiện tại. Kỳ mới nhất (ngày bắt đầu mới nhất) ở trên; cùng ngày thì mã lớn hơn ở trên<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>khoảng thời gian<\/strong><\/td><td>Kỳ được giữ lại khi khoảng ngày của kỳ giao với khoảng đã chọn. Cách chọn kỳ và khoảng ngày tùy chọn xem <a href=\"../bang-dieu-khien/bo-loc-va-ky-bao-cao.md\">Bộ lọc và kỳ báo cáo<\/a><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>chip trạng thái<\/strong><\/td><td>Chỉ còn các kỳ ở trạng thái đã chọn<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập từ khóa vào <strong>Ô tìm<\/strong><\/td><td>Tìm theo mã hoặc tên, không phân biệt hoa thường, <strong>có phân biệt dấu<\/strong>. Tối đa 100 ký tự. Không khớp: hiện \"Không có kỳ phân bổ nào khớp \"&lt;từ khóa&gt;\".\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Đọc <strong>Khối tổng hợp<\/strong><\/td><td>Các thẻ cộng trên các kỳ đang hiện sau bộ lọc. Riêng <strong>Chưa phân bổ<\/strong> tính theo từng kế hoạch: ngân sách kế hoạch trừ tổng mọi kỳ cùng kế hoạch (không âm), rồi cộng lại<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn một thẻ kỳ<\/td><td>Cột phải hiện chi tiết kỳ (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>PhanBoNganSach_yyyymmdd.xlsx<\/code>:<br>• Trang \"Kỳ phân bổ\": mọi kỳ đang hiện (Mã, Tên, Kế hoạch, Nhóm, Người phụ trách, Từ ngày, Đến ngày, Trạng thái, Tổng phân bổ, Đã dùng, Còn lại, % đã dùng)<br>• Trang \"Dòng phân bổ\": các dòng của kỳ đang chọn (Kênh, Chiến dịch, Sản phẩm, Trang, Ngân sách, Đã dùng, Còn lại, % đã dùng)<br>Tiền ghi đủ VND, không rút gọn. Danh sách rỗng: \"Không có dữ liệu để xuất.\" Xuất lỗi: \"Không xuất được tệp, vui lòng thử lại.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy kỳ nào:** Chuyên viên thấy kỳ mình phụ trách hoặc mình tạo; Trưởng nhóm thấy kỳ của đội mình; Trưởng/Phó phòng, BGĐ thấy tất cả\n* **Mức dùng** của kỳ và dòng: dưới 80% là bình thường; từ 80% đến đúng 100% là **Sắp vượt**; trên 100% là **Vượt**. Mốc 80% là mốc cảnh báo sớm, cấu hình ở [Cảnh báo vượt mức](../quan-ly-chi-phi-ngan-sach/canh-bao-vuot-muc.md)\n* Màn này chỉ hiện nhãn mức dùng; cảnh báo chi vượt gửi cho người dùng do [Cảnh báo vượt mức](../quan-ly-chi-phi-ngan-sach/canh-bao-vuot-muc.md) tạo\n* Bộ lọc, ô tìm và kỳ đang chọn được giữ khi bạn mở hộp thoại rồi quay về. Mở lại màn từ menu thì về mặc định\n* Lỗi tải một phần: hệ thống hiện \"Không tải được dữ liệu\" và nút `Thử lại` ngay tại vùng lỗi; vùng đã tải giữ nguyên\n\n## <mark style=\"color:green;\">2. Xem chi tiết kỳ phân bổ<\/mark>\n\n<figure><img src=\"images/phan-bo-ngan-sach-5.png\" alt=\"\"><figcaption><p>Kỳ có dòng Sắp vượt và dòng Vượt<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên kỳ, mã, khoảng ngày, chip trạng thái; các nút thao tác theo trạng thái (mục 5), `Thêm dòng` (chỉ khi Đang phân bổ), `Xuất Excel`, `Xóa kỳ` (mục 5) |\n| **Khối \"Kiểm soát ngân sách theo kế hoạch\"** | Ngân sách kế hoạch, tổng phân bổ và cảnh báo 80%, 100% (mục 6) |\n| **Banner vượt** | Khi tổng đã dùng trên 100% phân bổ: banner \"Đã chi vượt ngân sách phân bổ\", \"Thực chi &lt;tiền&gt; trên ngân sách &lt;tiền&gt;\", kèm liên kết sang [Cảnh báo vượt mức](../quan-ly-chi-phi-ngan-sach/canh-bao-vuot-muc.md) |\n| **Bốn ô tổng** | **Tổng phân bổ**; **Đã dùng thực tế** kèm \"x% ngân sách\"; **Còn lại**; **Từ kế hoạch** (nhấn để mở kế hoạch gốc) |\n| **Bảng \"Dòng phân bổ\"** | Cột Kênh, Chiến dịch, Sản phẩm (trống hiện \"-\"), Ngân sách, Đã dùng, Còn lại, % đã dùng (thanh), nhãn Sắp vượt / Vượt ở từng dòng; biểu tượng sửa, xóa khi kỳ Đang phân bổ |\n| **Dòng \"Chi chưa gắn dòng nào\"** | Phần chi phí thực của kỳ không khớp dòng nào |\n| **Hàng Tổng** | Tổng ngân sách; Đã dùng của cả kỳ (không cộng các dòng) |\n| **Dòng \"Hạn mức quý còn lại\"** | Chỉ Trưởng/Phó phòng, BGĐ thấy: phần còn lại của hạn mức quý (dùng khi gửi duyệt chiến dịch), chỉ để tham khảo |\n| **Ghi chú** | \"Đã dùng của kỳ là chi phí thực của cả công ty trong khoảng ngày; dòng bao nhau có thể cùng đếm một khoản chi\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn một kỳ ở danh sách<\/td><td>Cột phải hiện chi tiết. Các số Đã dùng, Còn lại, % đã dùng được tính khi mở màn, theo chi phí thực đã đồng bộ<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc bảng <strong>Dòng phân bổ<\/strong><\/td><td>Nhãn <strong>Vượt<\/strong>: đã chi quá ngân sách dòng. Nhãn <strong>Sắp vượt<\/strong>: đã dùng từ 80%<br>Phân bổ bằng 0 thì % đã dùng hiện \"-\"<br>Chiến dịch chưa nối mã theo dõi nguồn (UTM): chi phí kênh không tính vào dòng chiến dịch, dòng có ghi chú \"Chiến dịch chưa nối UTM\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn mã kế hoạch ở ô <strong>Từ kế hoạch<\/strong><\/td><td>Mở kế hoạch gốc ở <a href=\"ke-hoach-marketing.md\">Kế hoạch Marketing<\/a><\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chi phí thực** gồm chi phí quảng cáo Meta đồng bộ theo ngày, cộng từng lượt thanh toán còn hiệu lực của các khoản mục tính vào thực chi (xem [Thanh toán](../quan-ly-chi-phi-ngan-sach/thanh-toan.md)), trừ khoản nạp tiền cho tài khoản Meta (đã nằm trong chi phí Meta). Đề xuất chi chưa thanh toán không tính\n* **Đã dùng của một dòng** = chi phí thực khớp **mọi chiều** dòng đã khai (kênh, chiến dịch, sản phẩm); chiều không khai thì không xét\n* **Đã dùng của kỳ** = chi phí thực của **toàn công ty** trong khoảng ngày của kỳ, không lọc theo kênh hay đội. Hai kỳ của hai kế hoạch chồng ngày sẽ cùng thấy một khoản chi\n* **Dòng bao nhau** được phép, ví dụ dòng \"Meta\" và dòng \"Meta + chiến dịch X\". Một khoản chi khớp cả hai dòng được tính vào cả hai, nên cộng cột Đã dùng của các dòng có thể lớn hơn Đã dùng của kỳ\n* Khoản chi không có kênh được tính vào kênh \"Khác\"; khoản chi không có chiến dịch không khớp dòng có khai chiến dịch hoặc sản phẩm\n* Kỳ gắn kế hoạch đã bị rút về nháp hiện cờ **\"Không còn căn cứ đã duyệt\"**. Kỳ có kế hoạch gốc đã bị xóa hiện cảnh báo \"Kỳ chưa gắn kế hoạch\". Xem mục 5\n\n## <mark style=\"color:green;\">3. Tạo kỳ phân bổ<\/mark>\n\n<figure><img src=\"images/phan-bo-ngan-sach-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ Trưởng nhóm, Trưởng/Phó phòng, BGĐ. Hộp tạo kỳ gồm 3 bước: **Phạm vi**, **Ngân sách**, **Xác nhận**\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Tạo phân bổ<\/code><\/td><td>Hộp <strong>Tạo phân bổ ngân sách<\/strong> mở ra ở bước Phạm vi<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Loại kỳ<\/strong><\/td><td>Năm, Quý, Tháng; mặc định Tháng. Ô này chỉ để lọc danh sách ở ô Kế hoạch<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Kế hoạch<\/strong> (bắt buộc)<\/td><td>Chỉ liệt kê kế hoạch <strong>Đã duyệt<\/strong>; hiện 24 kế hoạch gần nhất, gõ mã hoặc tên để tìm kế hoạch cũ hơn. Mặc định là kế hoạch chứa hôm nay<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập <strong>Tên kỳ phân bổ<\/strong> (bắt buộc, tối đa 255 ký tự)<\/td><td>Mặc định \"Phân bổ &lt;tên kế hoạch&gt;\", sửa được<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Chọn <strong>Nhóm Marketing<\/strong> (bắt buộc) và <strong>Người phụ trách chính<\/strong><\/td><td>Trưởng nhóm có đúng một đội thì đội đó được chọn sẵn; thuộc nhiều đội thì chọn trong các đội của mình. Trưởng/Phó phòng, BGĐ chọn trong mọi đội. Người phụ trách mặc định là bạn<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Chọn <strong>Từ ngày<\/strong>, <strong>Đến ngày<\/strong><\/td><td>Mặc định theo kỳ của kế hoạch. Đến ngày phải sau hoặc bằng Từ ngày; khoảng ngày phải nằm trong kỳ kế hoạch và không giao với kỳ phân bổ khác của cùng kế hoạch<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Ở bước Ngân sách, nhập <strong>dòng đầu tiên<\/strong> (bắt buộc)<\/td><td>Chọn Sản phẩm, Kênh, Chiến dịch (ít nhất một) và nhập Số tiền lớn hơn 0. Quy tắc như mục 4<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Ở bước Xác nhận, kiểm tra số<\/td><td>Hệ thống hiện: tổng ngân sách kế hoạch, đã phân bổ trước, lần này, sau khi phân bổ, kèm cảnh báo nếu vượt mức<\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td>Nhấn <code>Lưu nháp<\/code> hoặc <code>Gửi duyệt<\/code><\/td><td><code>Lưu nháp<\/code>: tạo kỳ <strong>Đang phân bổ<\/strong> kèm dòng đầu, hệ thống báo \"Đã tạo phân bổ &lt;mã&gt;.\" và chọn kỳ mới<br><code>Gửi duyệt<\/code>: tạo kỳ rồi gửi duyệt ngay. Nếu bước gửi duyệt lỗi, kỳ vẫn được tạo ở Đang phân bổ và hệ thống hiện lỗi gửi duyệt<br>Có lỗi ở kỳ hoặc dòng đầu: không tạo gì, lỗi hiện tại ô sai<\/td><\/tr>\n<tr><td><strong>Bước 10<\/strong><\/td><td>Nhấn <code>Quay lại<\/code> hoặc <code>Hủy<\/code><\/td><td><code>Quay lại<\/code> về bước trước, giữ dữ liệu đã nhập<br><code>Hủy<\/code> khi đã nhập dữ liệu: hộp \"Bỏ các thay đổi đang nhập?\" với <code>Bỏ<\/code> và <code>Ở lại<\/code>. Chưa nhập gì thì đóng ngay<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Tên trống | \"Nhập tên kỳ phân bổ.\" |\n| Chưa chọn kế hoạch, hoặc kế hoạch chưa duyệt | \"Chọn kế hoạch đã duyệt để gắn phân bổ.\" |\n| Đến ngày trước Từ ngày | \"Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.\" |\n| Chưa chọn đội | \"Chọn nhóm Marketing.\" |\n| Khoảng ngày giao với kỳ khác cùng kế hoạch | \"Khoảng ngày giao với kỳ &lt;mã&gt;.\" (kỳ ngoài phạm vi xem của bạn: \"Khoảng ngày giao với một kỳ phân bổ khác của kế hoạch này.\") |\n| Dòng đầu làm tổng phân bổ vượt ngân sách kế hoạch | \"Tổng phân bổ &lt;số tiền&gt; vượt ngân sách kế hoạch &lt;số tiền&gt;. Giảm phân bổ hoặc gửi Đề nghị tăng ngân sách.\" |\n\n### ⚠️ Lưu ý\n\n* **Gộp vào kỳ cũ:** nếu khoảng ngày bạn nhập **trùng khít** với một kỳ Đang phân bổ của cùng kế hoạch mà bạn thấy được, hệ thống không tạo kỳ mới mà thêm dòng vào kỳ đó, giữ tên, đội, người phụ trách của kỳ cũ và báo \"Đã thêm dòng vào kỳ &lt;mã&gt;\"\n* Nhiều đội cùng một kế hoạch thì thêm dòng vào chung một kỳ, vì các kỳ cùng kế hoạch không được chồng ngày\n* Bạn không thuộc đội nào để chọn thì không lưu được; liên hệ quản trị để được gán đội\n* Kế hoạch đã bị rút về nháp thì không tạo được kỳ mới từ kế hoạch đó\n\n## <mark style=\"color:green;\">4. Thêm, sửa, xóa dòng phân bổ<\/mark>\n\n<figure><img src=\"images/phan-bo-ngan-sach-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ Trưởng nhóm (kỳ của đội), Trưởng/Phó phòng, BGĐ; chỉ khi kỳ **Đang phân bổ**\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kỳ Đang phân bổ, nhấn <code>Thêm dòng<\/code><\/td><td>Hộp <strong>Thêm dòng phân bổ<\/strong> mở ra<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Kênh<\/strong><\/td><td>Meta (Facebook / Instagram), Google, TikTok, Zalo, Website, Khác<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Chiến dịch (nếu có)<\/strong><\/td><td>Chọn trong mọi chiến dịch đang theo dõi nguồn, kể cả đã kết thúc; gõ để tìm. Hệ thống không kiểm tra chiến dịch có thuộc kênh đã chọn không: chọn lệch thì dòng đọc được 0 đồng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Sản phẩm (nếu có)<\/strong><\/td><td>Chọn nhãn sản phẩm từ danh mục; gõ để tìm<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Chọn <strong>Trang/Fanpage<\/strong> (không bắt buộc)<\/td><td>Chỉ có với Facebook. Trang chỉ là ghi chú, không lọc số đã dùng<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhập <strong>Ngân sách dòng (₫)<\/strong> (bắt buộc)<\/td><td>Số nguyên lớn hơn 0<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Thêm dòng<\/code><\/td><td>Hệ thống kiểm tra tổng phân bổ của kế hoạch (mục 6)<br>Hợp lệ: hệ thống báo \"Đã thêm dòng phân bổ.\", Đã dùng của dòng được tính ngay từ chi phí thực. Từ 80% ngân sách kế hoạch thì kèm cảnh báo<br>Vượt mức chặn: không lưu, báo lỗi<br><code>Hủy<\/code> khi đã nhập: hỏi \"Bỏ các thay đổi đang nhập?\"<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Sửa hoặc xóa dòng bằng biểu tượng ở dòng<\/td><td>Sửa và xóa cũng được kiểm tra tổng phân bổ như khi thêm<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Số tiền bằng 0 | \"Ngân sách dòng phải lớn hơn 0.\" |\n| Không chọn kênh, chiến dịch, sản phẩm nào | \"Chọn ít nhất một kênh, chiến dịch hoặc sản phẩm.\" |\n| Trùng bộ (kênh, chiến dịch, sản phẩm) với dòng khác trong kỳ | \"Dòng này đã có trong kỳ phân bổ.\" |\n| Tổng phân bổ vượt ngân sách kế hoạch và tăng so với trước | \"Tổng phân bổ &lt;số tiền&gt; vượt ngân sách kế hoạch &lt;số tiền&gt;. Giảm phân bổ hoặc gửi Đề nghị tăng ngân sách.\" |\n\n### ⚠️ Lưu ý\n\n* Kỳ từ Chờ duyệt trở đi khóa dòng: nút `Thêm dòng` và biểu tượng sửa, xóa không hiện\n* Muốn chuyển tiền giữa hai dòng khi đã chạm 100%: **giảm dòng nguồn trước, rồi tăng dòng đích**, vì mỗi lần lưu một dòng được kiểm tra riêng\n\n## <mark style=\"color:green;\">5. Gửi duyệt, duyệt, khóa, đóng kỳ và xóa kỳ<\/mark>\n\nCác nút nằm ở đầu chi tiết kỳ. Nút bạn không có quyền sẽ ẩn; nút bạn có quyền nhưng kỳ chưa đủ điều kiện sẽ khóa kèm chú giải lý do\n\n**Nút theo trạng thái**\n\n| Trạng thái | Nút | Ai làm |\n| --- | --- | --- |\n| **Đang phân bổ** | `Gửi duyệt`, `Thêm dòng`, `Xóa kỳ` | Gửi duyệt: Trưởng nhóm, Trưởng/Phó phòng, BGĐ. Xóa kỳ: Trưởng/Phó phòng, BGĐ |\n| **Chờ duyệt** | `Duyệt`, `Về nháp` | Trưởng/Phó phòng, BGĐ |\n| **Đã duyệt** | `Khóa ph
