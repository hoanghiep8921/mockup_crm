hận (chi phí quảng cáo đồng bộ từ nền tảng cộng các khoản đã thanh toán) với **số trên hóa đơn** của nền tảng hoặc nhà cung cấp, ghi chênh lệch, giải trình và chốt kỳ để khóa số liệu của tháng. Số hóa đơn được nhập kèm hóa đơn của từng kênh; Trưởng/Phó phòng, BGĐ giải trình và chốt; Trưởng nhóm xem\n\nTruy cập: menu **Chi phí & ngân sách → Quản lý chi phí → Đối soát**\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH ĐỐI SOÁT THÁNG\n\nBước 1: Lúc 01:00 ngày 1 hằng tháng, hệ thống tự lập **bản đối soát** cho tháng vừa qua, mỗi kênh có chi phí là một dòng. **Trưởng/Phó phòng** hoặc **BGĐ** cũng lập tay được bằng `Lập bản đối soát`\n\nBước 2: **Số hóa đơn (chưa VAT)** của từng kênh được nhập kèm hóa đơn. Hệ thống tính chênh lệch: lệch không quá 1% chi phí thực là **Khớp**, lệch hơn là **Có chênh lệch**\n\nBước 3: Dòng **Có chênh lệch** phải có **giải trình**. Trưởng/Phó phòng hoặc BGĐ nhập giải trình\n\nBước 4: **Trưởng/Phó phòng** hoặc **BGĐ** bấm `Chốt` từng dòng hoặc `Chốt kỳ` cho cả bản. Dòng đã chốt bị khóa; bản chuyển **Đã chốt** khi mọi dòng đã chốt\n\nBước 5: Sau khi chốt, không ghi nhận hoặc hủy được lượt thanh toán có ngày trả trong kỳ đó. Đề xuất chi **Đã thanh toán** có mọi lượt thuộc kỳ đã chốt tự chuyển **Đã đối soát**\n\nTrạng thái dòng: **Chưa đối soát** (chưa nhập số) → **Khớp** hoặc **Có chênh lệch** → **Đã chốt**. Trạng thái bản: **Mở** → **Đã chốt**\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách kỳ đối soát<\/mark>\n\n<figure><img src=\"images/doi-soat-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề và dòng đếm** | \"Đối soát\" và dòng \"&lt;n&gt; kỳ đối soát · &lt;m&gt; kỳ đang mở\" theo bộ lọc |\n| **Ô tìm** | Tìm theo tháng (\"mm/yyyy\" hoặc \"mm-yyyy\") hoặc tên kênh có trong bản (tối đa 100 ký tự) |\n| **Bộ lọc** | **Năm** (mặc định năm hiện tại), **Trạng thái** (Tất cả, Mở, Đã chốt), **Công ty** (chỉ hiện khi bạn làm việc với nhiều công ty). Lọc đang áp hiện thành chip, bấm X để bỏ |\n| **Nút `Lập bản đối soát`** | Mở hộp lập bản (mục 4). Chỉ Trưởng/Phó phòng, BGĐ |\n| **Nút `Xuất Excel`** | Xuất các bản trong danh sách đang lọc |\n| **Thẻ kỳ (cột trái)** | \"Đối soát mm/yyyy\", chip **Mở** hoặc **Đã chốt**; dòng \"Chi phí thực &lt;tiền&gt; · Hóa đơn &lt;tiền&gt;\" (\"-\" khi chưa dòng nào nhập số); nhãn \"&lt;n&gt; dòng chênh lệch\", \"&lt;n&gt; dòng chưa nhập số\", \"Số Meta đổi sau chốt\". Xếp tháng mới trước |\n| **Chi tiết kỳ (cột phải)** | Bảng đối soát của kỳ đang chọn, xem mục 2 |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Chi phí &amp; ngân sách → Quản lý chi phí → Đối soát<\/strong><\/td><td>Hệ thống hiển thị các kỳ của năm hiện tại và chọn sẵn kỳ mới nhất<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Năm<\/strong>, <strong>Trạng thái<\/strong> hoặc nhập <strong>ô tìm<\/strong><\/td><td>Danh sách vẽ lại. Không có kết quả: \"Không có kỳ đối soát nào khớp điều kiện.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm một thẻ kỳ<\/td><td>Chi tiết kỳ hiện ở cột phải (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code> ở thanh trên<\/td><td>Hệ thống tải tệp <code>DoiSoat_yyyymmdd.xlsx<\/code>, mỗi dòng một kênh của một tháng, cột Tháng, Công ty, Kênh, Chi phí nền tảng, Đã thanh toán, Chi phí thực, Số hóa đơn (chưa VAT), Chênh lệch, % lệch, Trạng thái, Giải trình, Người nhập số, Chốt lúc, Người chốt, Cảnh báo Meta. Rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy menu:** Trưởng nhóm (chỉ xem), Trưởng/Phó phòng, BGĐ. Chuyên viên không thấy menu Đối soát\n* Số liệu đối soát là số cấp công ty, không chia theo đội hay người: ai xem được thì xem toàn bộ bản của các công ty mình được phép\n* Chưa có bản nào: \"Chưa có bản đối soát nào. Bấm Lập bản đối soát để bắt đầu.\" (người không có quyền lập chỉ thấy câu đầu)\n* Tải lỗi: \"Không tải được bản đối soát.\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết kỳ đối soát<\/mark>\n\n<figure><img src=\"images/doi-soat-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu trang** | \"Đối soát tháng mm/yyyy\" và dòng \"Kỳ đang mở\" hoặc \"Chốt lúc dd/mm/yyyy hh:mm bởi &lt;người&gt;\". Nút `Lập lại bảng`, `Chốt kỳ` (bản Mở, theo quyền), `Xuất Excel`. Bản Đã chốt chỉ còn `Xuất Excel` |\n| **Khung chênh lệch** | Khung \"&lt;n&gt; kênh có chênh lệch\" kèm \"&lt;kênh&gt; &lt;±tiền&gt; (x%)\" từng kênh; dòng chưa giải trình ghi thêm \"Cần giải trình trước khi chốt.\" |\n| **Khung số Meta đổi sau chốt** | Khung \"Số Meta đã đổi sau ngày chốt. Xem cột Cảnh báo Meta của kênh bị đánh dấu.\" |\n| **Thẻ tổng** | **Chi phí thực** (kèm \"nền tảng &lt;tiền&gt; · đã thanh toán &lt;tiền&gt;\"), **Số hóa đơn** (kèm \"&lt;n&gt;/&lt;m&gt; kênh đã nhập\"), **Chênh lệch** (kèm %), **Trạng thái** (Mở hoặc Đã chốt, \"&lt;n&gt;/&lt;m&gt; kênh đã chốt\") |\n| **Bảng đối soát theo kênh** | Mỗi dòng một kênh (kênh trống là \"Khác\"), dòng Tổng ở cuối. Cột: Kênh (bấm để xem khoản chi), Chi phí nền tảng, Đã thanh toán, Chi phí thực, Số hóa đơn (chưa VAT), Chênh lệch, % lệch, Trạng thái, Giải trình (rút gọn 60 ký tự, di chuột xem đủ), Chốt lúc, Người chốt, Cảnh báo Meta (ẩn được) |\n| **Thao tác trên dòng** | `Nhập số` (dòng chưa nhập) hoặc `Sửa` (đã nhập), `Chốt`, `Xem khoản chi` |\n| **Ghi chú** | \"Chi phí thực và số hóa đơn đều tính trước VAT. Chi phí Meta cập nhật trễ tới 3 ngày.\" |\n| **Lịch sử** | Thu gọn ở cuối: lập bản, lập lại bảng, nhập hoặc sửa số hóa đơn (số cũ → số mới), sửa giải trình, chốt; mỗi mục ghi người, thời điểm |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn một kỳ ở danh sách<\/td><td>Bảng đối soát theo kênh hiện ở cột phải<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc từng dòng<\/td><td><strong>Chi phí thực<\/strong> = <strong>Chi phí nền tảng<\/strong> (chi phí quảng cáo Meta đồng bộ) + <strong>Đã thanh toán<\/strong> (các lượt thanh toán tính vào chi phí thực, theo ngày thanh toán). <strong>Chênh lệch<\/strong> = Số hóa đơn − Chi phí thực; <strong>% lệch<\/strong> = Chênh lệch ÷ Chi phí thực<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem cột <strong>Trạng thái<\/strong><\/td><td><strong>Chưa đối soát<\/strong>: chưa nhập số hóa đơn. <strong>Khớp<\/strong>: lệch không quá 1% chi phí thực. <strong>Có chênh lệch<\/strong>: lệch vượt 1%. <strong>Đã chốt<\/strong>: kèm chữ \"khớp\" hoặc \"có chênh lệch\" theo số lúc chốt<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm thao tác trên dòng<\/td><td><code>Nhập số<\/code>, <code>Sửa<\/code>: mục 5. <code>Chốt<\/code>: mục 6. Tên kênh hoặc <code>Xem khoản chi<\/code>: mục 3<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code> ở đầu chi tiết<\/td><td>Hệ thống tải tệp <code>DoiSoat_&lt;yyyy-mm&gt;_yyyymmdd.xlsx<\/code> gồm sheet \"Đối soát\" và sheet \"Khoản chi\" (khoản chi của mọi dòng)<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Dòng chưa chốt tính lại chi phí thực mỗi lần xem. Dòng đã chốt hiển thị và xuất theo **số lúc chốt**, không đổi về sau\n* Chi phí Meta tự đồng bộ và lấy lại 3 ngày gần nhất nên có thể đổi sau khi chốt. Khi đó cột Cảnh báo Meta ghi \"Số Meta đã đổi sau ngày chốt: lúc chốt &lt;a&gt;, hiện tại &lt;b&gt;.\", thẻ kỳ có chip **Số Meta đổi sau chốt**; số chốt của đối soát vẫn giữ nguyên\n* Kênh chưa có đồng bộ (Google, TikTok, Zalo OA, Website/SEO, khác) có Chi phí nền tảng \"-\"; chi phí của các kênh này đến từ thanh toán\n* Số tiền trên bảng hiển thị rút gọn, đầy đủ khi di chuột, trong hộp thoại và tệp xuất. % lệch khi chi phí thực bằng 0 hiển thị \"-\"\n\n## <mark style=\"color:green;\">3. Xem khoản chi của một dòng<\/mark>\n\n<figure><img src=\"images/doi-soat-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp **Khoản chi · &lt;kênh&gt; · mm/yyyy** gồm ba nhóm:\n\n| Nhóm | Mô tả |\n| --- | --- |\n| **Chi phí nền tảng theo chiến dịch** | Chiến dịch (mã, tên; bấm để mở chiến dịch), Mã Facebook, Tài khoản quảng cáo, Chi phí trong tháng; dòng tổng bằng cột Chi phí nền tảng. Kênh không có đồng bộ: \"Kênh này chưa có đồng bộ chi phí nền tảng.\" |\n| **Khoản đã thanh toán tính vào chi phí thực** | Mã lượt thanh toán, Mã đề xuất chi (bấm để mở), Nội dung, Khoản mục, Chiến dịch, Người đề xuất, Người duyệt bậc cuối, Ngày thanh toán, Số chứng từ, Số tiền của lượt, Chứng từ (tải từng tệp); tổng bằng cột Đã thanh toán |\n| **Tham khảo, không tính vào chi phí thực** | Trả trước cho nền tảng (ví dụ nạp tiền tài khoản Meta), Chi phí bổ sung ngoài nền tảng, Chi phí Meta chưa khớp chiến dịch nào. Giúp giải thích chênh lệch với hóa đơn |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm tên kênh hoặc <code>Xem khoản chi<\/code> ở một dòng<\/td><td>Hộp Khoản chi mở. Nhóm không có dữ liệu ghi \"Không có khoản nào.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm mã đề xuất chi hoặc tên tệp chứng từ<\/td><td>Mở đề xuất ở màn <a href=\"de-xuat-chi.md\">Đề xuất chi<\/a> hoặc tải tệp<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Tải tệp <code>DoiSoat_&lt;yyyy-mm&gt;_&lt;kênh&gt;_yyyymmdd.xlsx<\/code> gồm ba nhóm của dòng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Đóng<\/code><\/td><td>Quay lại chi tiết kỳ<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Khoản nạp tiền tài khoản Meta là **trả trước cho nền tảng**: không cộng vào chi phí thực vì chi phí tiêu thật đã nằm trong chi phí nền tảng. Nếu cộng sẽ bị tính hai lần\n* Lượt thanh toán đã hủy không xuất hiện ở đây\n* Dòng đã chốt liệt kê khoản tại lúc chốt, kèm dòng \"Khoản phát sinh sau chốt\" nếu số Meta hiện tại khác số lúc chốt\n\n## <mark style=\"color:green;\">4. Lập bản đối soát và lập lại bảng<\/mark>\n\n<figure><img src=\"images/doi-soat-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp **Lập bản đối soát**, câu dẫn \"Hệ thống tự thêm một dòng cho mỗi kênh có chi phí thực trong tháng. Mỗi công ty chỉ có một bản đối soát cho mỗi tháng.\"\n\n| Ô nhập | Bắt buộc | Mô tả |\n| --- | --- | --- |\n| **Tháng đối soát** | Có | Dạng mm/yyyy, mặc định tháng trước. Chỉ tháng hiện tại hoặc các tháng trước |\n| **Công ty** | Có | Mặc định công ty đang làm việc; chỉ hiện khi bạn làm việc với nhiều công ty |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Lập bản đối soát<\/code> ở thanh trên<\/td><td>Hộp mở với tháng trước<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Tháng đối soát<\/strong>, <strong>Công ty<\/strong>, nhấn <code>Lập bản đối soát<\/code><\/td><td>Thành công: bản ở trạng thái <strong>Mở<\/strong>, mỗi kênh có chi phí thực trong tháng là một dòng (gồm \"Khác\" nếu có); thông báo \"Đã lập bản đối soát mm/yyyy với &lt;n&gt; kênh.\"; chi tiết bản mới mở ra. Tháng chưa có chi phí: bản không có dòng, chi tiết ghi \"Tháng này chưa có chi phí thực. Bấm Lập lại bảng khi có chi phí.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Khi có kênh mới phát sinh chi phí: nhấn <code>Lập lại bảng<\/code> ở chi tiết kỳ<\/td><td>Hệ thống thêm dòng cho kênh có chi phí mà chưa có dòng, không xóa và không đổi dòng đã có. Thông báo \"Đã thêm &lt;n&gt; kênh có chi phí mới.\" hoặc \"Không có kênh mới để thêm.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Đóng hộp, không tạo bản<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được lập:** Trưởng/Phó phòng, BGĐ\n* Hệ thống tự lập bản cho **tháng vừa qua** lúc 01:00 ngày 1 hằng tháng, cho mỗi công ty có chi phí thực mà chưa có bản. Thường bạn chỉ cần mở bản đã có\n* Câu lỗi thường gặp: \"Chọn tháng đối soát.\", \"Chỉ lập được bản đối soát cho tháng hiện tại hoặc các tháng trước.\", \"Mỗi công ty chỉ có một bản đối soát cho mỗi tháng.\" (kèm liên kết \"Mở bản đã có\"), \"Bạn không có quyền với công ty này.\"\n* Trưởng/Phó phòng, BGĐ thêm tay được một kênh chưa có dòng; kênh đã có thì \"Bản đối soát đã có dòng cho Kênh marketing '&lt;kênh&gt;'.\"\n* `Lập lại bảng` chỉ dùng khi bản đang Mở; bản Đã chốt không còn nút này\n\n## <mark style=\"color:green;\">5. Nhập số hóa đơn và giải trình<\/mark>\n\n<figure><img src=\"images/doi-soat-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp **Nhập số hóa đơn · &lt;kênh&gt; · mm/yyyy**:\n\n| Ô nhập | Bắt buộc | Mô tả |\n| --- | --- | --- |\n| **Chi phí của dòng** | - | Chi phí nền tảng, Đã thanh toán, Chi phí thực (số đầy đủ) |\n| **Số hóa đơn (chưa VAT)** | Có | Tổng tiền trên các hóa đơn của kênh trong tháng, **trước thuế GTGT**. Số nguyên VND không âm, tối đa 15 chữ số, tự thêm dấu chấm nghìn |\n| **Tệp hóa đơn** | Không | Nhiều tệp, mỗi tệp PDF, JPG, PNG tối đa 10 MB |\n| **Giải trình** | Có khi Có chênh lệch | Tối đa 1.000 ký tự |\n| **Kết quả tạm tính** | - | Tính ngay khi gõ: khung \"Khớp: chênh lệch &lt;±tiền&gt; (x%)\" hoặc khung \"Có chênh lệch: &lt;±tiền&gt; (x%)\" kèm \"Vượt dung sai 1% chi phí thực. Nhập giải trình để chốt được kỳ.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở chi tiết kỳ, nhấn <code>Nhập số<\/code> (hoặc <code>Sửa<\/code>) trên dòng kênh<\/td><td>Hộp mở với số hiện có<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Số hóa đơn (chưa VAT)<\/strong><\/td><td>Khung kết quả tạm tính cho biết dòng Khớp hay Có chênh lệch<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Tải <strong>Tệp hóa đơn<\/strong><\/td><td>Tệp sai: \"Chỉ nhận tệp PDF, JPG, PNG.\" hoặc \"Tệp &lt;tên&gt; vượt 10 MB.\"; tệp không được thêm<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập <strong>Giải trình<\/strong> nếu Có chênh lệch<\/td><td>Ví dụ \"Hóa đơn gồm phí chuyển đổi ngoại tệ 600.000 đ chưa ghi nhận thanh toán.\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Lưu<\/code><\/td><td>Thành công: \"Đã lưu số hóa đơn &lt;kênh&gt;.\"; dòng, thẻ tổng và khung chênh lệch cập nhật. Lỗi: \"Nhập số hóa đơn.\", \"Số hóa đơn phải là số không âm.\", \"Giải trình tối đa 1.000 ký tự.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Trưởng/Phó phòng, BGĐ **không** nhập, sửa được số hóa đơn và tệp; khi mở hộp này chỉ sửa được **Giải trình** (ô số và tệp hiện mờ); lưu xong hiện \"Đã lưu giải trình &lt;kênh&gt;.\"\n* Nhập số **trước VAT** để so cùng gốc với chi phí thực\n* Lưu số khi chưa có giải trình vẫn được để nhập dần; dòng hiện nhãn \"Chưa giải trình\" và nút `Chốt` hiện mờ cho tới khi có giải trình\n* Dòng đã chốt không sửa được: nút hiện mờ kèm \"Dòng đã chốt kỳ.\"\n* Mọi lần đổi số, giải trình đều ghi vào lịch sử (người, thời điểm, số cũ → số mới)\n* Người khác vừa chốt hoặc sửa dòng: \"Dòng đối soát &lt;kênh&gt; mm/yyyy đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\"; dữ liệu đang nhập được giữ\n\n## <mark style=\"color:green;\">6. Chốt đối soát<\/mark>\n\n<figure><img src=\"images/doi-soat-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp xác nhận chốt:\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | \"Chốt đối soát tháng mm/yyyy?\" (cả kỳ) hoặc \"Chốt kênh &lt;kênh&gt; tháng mm/yyyy?\" (một dòng) |\n| **Phạm vi chốt** | \"Chốt &lt;n&gt; kênh: &lt;danh sách&gt;.\" và \"Kênh có chênh lệch đã giải trình: &lt;kênh&gt; &lt;±tiền&gt;.\" nếu có |\n| **Hệ quả** | Sau khi chốt: không sửa số hóa đơn, giải trình; không thêm, sửa, xóa chi phí bổ sung và không ghi nhận thanh toán có ngày trả trong tháng của các kênh này; đề xuất chi đã thanh toán đạt điều kiện chuyển sang Đã đối soát. Dòng đậm \"Bản đã chốt không mở lại được.\" |\n| **Nút** | `Hủy` (mặc định), `Chốt kỳ` hoặc `Chốt` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Kiểm tra mọi dòng đã nhập số hóa đơn và dòng Có chênh lệch đã có giải trình<\/td><td>Nút <code>Chốt kỳ<\/code> hiện mờ kèm \"Còn &lt;n&gt; kênh chưa đủ điều kiện chốt.\" khi còn dòng thiếu điều kiện<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Chốt kỳ<\/code> ở đầu chi tiết (chốt mọi dòng chưa chốt), hoặc <code>Chốt<\/code> trên một dòng<\/td><td>Thiếu điều kiện: hộp không mở, hệ thống báo \"Chưa chốt được: &lt;kênh&gt; chưa nhập số hóa đơn; &lt;kênh&gt; có chênh lệch chưa giải trình.\" Đủ điều kiện: hộp xác nhận mở<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc phạm vi và hệ quả, nhấn <code>Chốt kỳ<\/code> (hoặc <code>Chốt<\/code>)<\/td><td>Mỗi dòng ghi Đã chốt, thời điểm, người chốt và lưu số lúc chốt. Thông báo \"Đã chốt &lt;n&gt; kênh của đối soát mm/yyyy.\" Mọi dòng đã chốt thì bản chuyển <strong>Đã chốt<\/strong>, nút <code>Lập lại bảng<\/code>, <code>Chốt kỳ<\/code> ẩn<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Đóng hộp, không đổi gì<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chỉ Trưởng/Phó phòng và BGĐ** được chốt. Trưởng nhóm không thấy nút; gọi trực tiếp bị chặn: \"Chỉ Trưởng/Phó phòng Marketing hoặc Ban giám đốc được chốt đối soát.\"\n* `Chốt kỳ` là tất cả hoặc không: một dòng thiếu điều kiện thì không dòng nào được chốt\n* **Không mở lại** bản hoặc dòng đã chốt. Sai sót phát hiện sau khi chốt ghi nhận vào kỳ sau\n* Sau khi chốt, kỳ đó bị khóa ở màn [Thanh toán](thanh-toan.md): không ghi nhận và không hủy lượt thanh toán có ngày trả trong tháng, kênh, công ty đã chốt. Khoản nạp tiền tài khoản Meta không bị khóa vì không vào chi phí thực\n* Đề xuất chi **Đã thanh toán** chuyển **Đã đối soát** khi mọi lượt thanh toán còn hiệu lực của đề xuất đều thuộc kỳ đã chốt. Việc này do hệ thống làm, không ai chuyển tay\n* Bản có dòng đã chốt không xóa được và không đổi tháng, công ty được\n* Chốt lỗi: \"Không chốt được đối soát, vui lòng thử lại.\"; không dòng nào được chốt, không đề xuất nào đổi trạng thái\n\n## <mark style=\"color:green;\">7. Phân quyền trên màn Đối soát<\/mark>\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng | BGĐ |\n| --- | --- | --- | --- | --- |\n| Xem danh sách, chi tiết, khoản chi; xuất Excel | Không | Có (chỉ xem) | Có | Có |\n| Lập bản, lập lại bảng, thêm kênh | Không | Không | Có | Có |\n| Nhập, sửa giải trình | Không | Không | Có | Có |\n| Chốt dòng, chốt kỳ | Không | Không | Có | Có |\n| Xóa bản chưa có dòng chốt | Không | Không | Có | Có |\n| Mở lại bản, dòng đã chốt | Không | Không | Không | Không |\n", "quan-ly-chi-phi-ngan-sach/canh-bao-vuot-muc.md": "# Cảnh báo vượt mức\n\n🧭 Tổng quan chức năng: Màn **Cảnh báo vượt mức** là sổ đầy đủ các cảnh báo ngân sách do hệ thống tự sinh khi chi phí thực của một **dòng phân bổ**, một **kênh trong hạn mức quý** hoặc **cả quý** chạm mốc cảnh báo sớm (mặc định 80%) hoặc vượt 100% ngân sách. Màn còn là nơi sửa ngưỡng cảnh báo và theo dõi chi phí từng chiến dịch theo nền tảng. Mọi nhóm Marketing xem được theo phạm vi; Trưởng nhóm trở lên đánh dấu đã xử lý; Trưởng/Phó phòng, BGĐ sửa ngưỡng\n\nTruy cập: menu **Chi phí & ngân sách → Quản lý chi phí → Cảnh báo vượt mức**\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH XỬ LÝ CẢNH BÁO NGÂN SÁCH\n\nBước 1: Hệ thống tự soát mỗi 1 giờ (sau lượt đồng bộ chi phí Meta), ngay sau mỗi lần ghi nhận hoặc hủy lượt [thanh toán](thanh-toan.md), và sau khi kỳ phân bổ được duyệt hoặc số tiền dòng phân bổ đổi\n\nBước 2: Với mỗi dòng phân bổ, mỗi kênh của hạn mức quý và cả quý, hệ thống tính **% đã dùng = Chi phí thực ÷ Ngân sách**. Từ mốc cảnh báo sớm đến đúng 100% là mức **Cảnh báo**; trên 100% là **Vượt mức**\n\nBước 3: Chạm mốc thì hệ thống sinh một cảnh báo mã `MKT-CB-0001` ở trạng thái **Đang mở** và giao việc cho người có trách nhiệm\n\nBước 4: Người nhận quyết định tạm dừng quảng cáo hoặc bổ sung ngân sách, rồi Trưởng nhóm trở lên bấm `Đánh dấu đã xử lý`. Cảnh báo chuyển **Đã xử lý**\n\nBước 5: Khi % đã dùng xuống dưới mốc (ví dụ đã tăng ngân sách), lên mốc cao hơn, hoặc đối tượng hết thời gian soát, hệ thống tự chuyển cảnh báo sang **Tự đóng**\n\nTrạng thái cảnh báo: **Đang mở** → **Đã xử lý** hoặc **Tự đóng**\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Sổ cảnh báo ngân sách<\/mark>\n\n<figure><img src=\"images/canh-bao-vuot-muc-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề và dòng đếm** | \"Cảnh báo vượt mức\" và dòng \"&lt;n&gt; cảnh báo · &lt;m&gt; đang mở\" |\n| **Hai tab** | **Cảnh báo ngân sách** (mặc định) và **Chi phí chiến dịch theo nền tảng** (mục 4) |\n| **Ô tìm, nút `Xuất Excel`** | Tìm theo mã hoặc tên đối tượng (tối đa 100 ký tự); xuất tab đang xem |\n| **Thẻ \"Ngưỡng cảnh báo đang áp dụng\"** | \"Cảnh báo sớm: từ &lt;x&gt;% ngân sách\" và \"Vượt mức: trên 100% ngân sách\". Nút `Sửa ngưỡng` chỉ hiện với Trưởng/Phó phòng, BGĐ (mục 5) |\n| **Bộ lọc** | **Trạng thái** (Đang mở mặc định, Đã xử lý, Tự đóng, Tất cả), **Mức** (Tất cả, Cảnh báo, Vượt mức), **Loại đối tượng** (Dòng phân bổ, Hạn mức theo kênh, Hạn mức cả quý), **Thời điểm sinh** (khoảng ngày), **Đội**. Lọc đang áp hiện thành chip |\n| **Dòng \"Lượt soát gần nhất\"** | \"Lượt soát gần nhất hh:mm dd/mm/yyyy · mỗi 1 giờ\" |\n| **Bảng cảnh báo** | Ô chọn, Mã (bấm để mở chi tiết), Loại, Đối tượng, Kỳ, Mốc (chip **Cảnh báo** hoặc **Vượt mức**), Ngân sách, Chi phí thực lúc báo, % lúc báo, % hiện tại, Còn lại, Đội, Người phụ trách, Thời điểm sinh, Trạng thái (\"Đang mở\", \"Đã xử lý · &lt;người&gt;\", \"Tự đóng · &lt;lý do&gt;\"), nút `Đánh dấu đã xử lý` ở dòng Đang mở. Xếp % hiện tại giảm dần |\n| **Thanh thao tác hàng loạt** | Hiện khi chọn ít nhất 1 dòng: \"Đã chọn &lt;n&gt;\" và nút `Đánh dấu đã xử lý` |\n| **Ghi chú cuối bảng** | \"&lt;n&gt; cảnh báo đang mở. Cảnh báo đang mở cũng hiện ở Bảng điều khiển &gt; Cảnh báo cần xử lý, loại Chi phí chạm ngưỡng cảnh báo.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Chi phí &amp; ngân sách → Quản lý chi phí → Cảnh báo vượt mức<\/strong><\/td><td>Hệ thống mở tab <strong>Cảnh báo ngân sách<\/strong>, lọc sẵn các cảnh báo <strong>Đang mở<\/strong> trong phạm vi của bạn<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đổi <strong>bộ lọc<\/strong> hoặc nhập <strong>ô tìm<\/strong><\/td><td>Bảng vẽ lại. Không có kết quả: \"Không có cảnh báo nào khớp điều kiện.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc cột <strong>% lúc báo<\/strong> và <strong>% hiện tại<\/strong><\/td><td>% lúc báo là số tại thời điểm sinh cảnh báo, không đổi. % hiện tại và Còn lại (Ngân sách − Chi phí thực hiện tại) tính lại mỗi lần xem<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm <strong>mã<\/strong> một cảnh báo<\/td><td>Chi tiết mở ở cột phải (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>CanhBaoVuotMuc_yyyymmdd.xlsx<\/code> gồm các cảnh báo đang xem kèm lịch sử: Mã, Loại, Đối tượng, Kỳ, Mốc, Ngân sách, Chi phí thực lúc báo, % lúc báo, % hiện tại, Còn lại, Đội, Người phụ trách, Thời điểm sinh, Trạng thái, Thời điểm đóng, Lý do đóng hoặc Người xử lý, Ghi chú xử lý. Rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ba loại đối tượng được soát:**\n  * **Dòng phân bổ** của kỳ phân bổ đã duyệt hoặc đã khóa: so \"Đã dùng\" của dòng với ngân sách phân bổ của dòng, từ ngày bắt đầu kỳ đến 7 ngày sau ngày kết thúc kỳ. Tên hiển thị \"Dòng phân bổ &lt;mã kỳ&gt; · &lt;kênh / chiến dịch / nhãn&gt;\"\n  * **Hạn mức theo kênh**: so chi phí thực của kênh trong quý với kế hoạch kênh. Tên \"Hạn mức &lt;Quý/năm&gt; · &lt;kênh&gt;\"\n  * **Hạn mức cả quý**: so chi phí thực mọi kênh với kế hoạch quý. Tên \"Hạn mức &lt;Quý/năm&gt; · cả quý\"\n  * Hạn mức được soát trong quý đang chạy và thêm 7 ngày đầu quý sau (vì chi phí Meta cập nhật trễ)\n* **Ai thấy gì:** Trưởng/Phó phòng, BGĐ thấy mọi cảnh báo của công ty được phép; Trưởng nhóm thấy cảnh báo hạn mức và cảnh báo dòng phân bổ của kỳ thuộc đội mình; Chuyên viên chỉ thấy cảnh báo dòng phân bổ của kỳ mình phụ trách hoặc tạo, không thấy cảnh báo hạn mức\n* Mỗi đối tượng chỉ có **một** cảnh báo Đang mở, ở mốc cao nhất đã chạm. Ngân sách bằng 0 hoặc không có thì không cảnh báo, % hiển thị \"-\"\n* % hiển thị một chữ số thập phân, làm tròn xuống (99,96% hiện 99,9%). Còn lại âm có dấu \"−\"\n* Tải lỗi: \"Không tải được cảnh báo.\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết cảnh báo<\/mark>\n\n<figure><img src=\"images/canh-bao-vuot-muc-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên đối tượng, dòng \"&lt;mã&gt; · thời điểm sinh\", nút `Đánh dấu đã xử lý` (cảnh báo Đang mở), nút X đóng |\n| **Khung mức** | Vượt mức: khung \"Đã vượt ngân sách\" và \"Đã dùng &lt;a&gt; trên ngân sách &lt;b&gt; (x%). Cân nhắc tạm dừng quảng cáo hoặc bổ sung ngân sách.\" Cảnh báo: khung \"Chạm ngưỡng cảnh báo &lt;y&gt;%\" và \"Theo dõi sát, còn &lt;c&gt; trước khi vượt.\" Cảnh báo đã đóng: khung \"Đã đóng\" kèm lý do hoặc người xử lý |\n| **Thông tin** | Loại đối tượng, Đối tượng, Kỳ, Mốc sinh cảnh báo, Ngân sách, Chi phí thực lúc báo, % lúc báo, Chi phí thực hiện tại, % hiện tại, Còn lại, Đội, Người phụ trách, Thời điểm sinh, Trạng thái |\n| **Lịch sử cảnh báo** | Các mốc của cùng đối tượng theo thời gian: \"Sinh cảnh báo &lt;mốc&gt; (x%)\", \"Tự đóng: &lt;lý do&gt;\", \"Đã xử lý bởi &lt;người&gt;: &lt;ghi chú&gt;\"; người nhận việc |\n| **Mở nguồn** | Liên kết mở kỳ phân bổ (chọn sẵn dòng) ở [Phân bổ ngân sách](../ke-hoach/phan-bo-ngan-sach.md) hoặc mở hạn mức quý |\n| **Ghi chú** | \"Hệ thống soát mỗi 1 giờ và ngay sau khi ghi nhận hoặc hủy lượt thanh toán, so chi phí thực với ngân sách của dòng phân bổ và hạn mức quý. Đánh dấu đã xử lý để đóng cảnh báo.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm mã cảnh báo ở bảng, hoặc bấm việc cảnh báo được giao trong danh sách việc cần làm<\/td><td>Chi tiết mở ở cột phải. Mở từ việc được giao thì danh sách lọc Tất cả<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc <strong>khung mức<\/strong> và <strong>thông tin<\/strong><\/td><td>So chi phí thực hiện tại với lúc báo để biết tình hình đã đổi chưa<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <strong>Mở nguồn<\/strong><\/td><td>Mở kỳ phân bổ hoặc hạn mức quý để xem chi tiết, bổ sung ngân sách. Không có quyền xem nguồn: liên kết hiện mờ kèm \"Bạn không có quyền xem bản ghi này\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Đánh dấu đã xử lý<\/code> khi đã xử lý xong<\/td><td>Xem mục 3<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Tiêu đề việc được giao có dạng \"&lt;Cảnh báo | Vượt mức&gt;: &lt;đối tượng&gt; đã dùng x% ngân sách (mốc y%)\", ghi chú \"Chi phí thực &lt;a&gt; đ trên ngân sách &lt;b&gt; đ (chưa gồm VAT). Mã &lt;MKT-CB-nnnn&gt;.\"\n* **Ai nhận việc:** Trưởng/Phó phòng, BGĐ của công ty; với cảnh báo dòng phân bổ còn có người phụ trách kỳ phân bổ và các Trưởng nhóm của đội của kỳ\n* Cảnh báo đóng (Đã xử lý hoặc Tự đóng) thì các việc còn mở của cảnh báo đó tự đánh dấu xong\n* Mở cảnh báo ngoài phạm vi: \"Bạn không có quyền thực hiện thao tác này.\"\n\n## <mark style=\"color:green;\">3. Đánh dấu đã xử lý<\/mark>\n\n<figure><img src=\"images/canh-bao-vuot-muc-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp **Đánh dấu đã xử lý · &lt;mã&gt;** (một cảnh báo) hoặc **Đánh dấu đã xử lý &lt;n&gt; cảnh báo** (hàng loạt):\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tóm tắt** | Một cảnh báo: \"&lt;Đối tượng&gt; đã dùng x% ngân sách (mốc &lt;Cảnh báo / Vượt mức&gt;). Cảnh báo sẽ đóng và không sinh lại ở mốc này.\" Hàng loạt: \"&lt;n&gt; cảnh báo sẽ đóng và không sinh lại ở mốc hiện tại.\" |\n| **Ghi chú xử lý** | Không bắt buộc, tối đa 1.000 ký tự. Ví dụ \"Đã tạm dừng nhóm quảng cáo remarketing, gửi Đề nghị tăng ngân sách 10 tr.\" |\n| **Nút** | `Hủy`, `Đánh dấu đã xử lý` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Đánh dấu đã xử lý<\/code> ở một dòng, ở chi tiết cảnh báo, hoặc tích chọn nhiều dòng rồi nhấn nút ở thanh thao tác hàng loạt<\/td><td>Hộp Đánh dấu đã xử lý mở. Hàng loạt tối đa 100 cảnh báo mỗi lần<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Ghi chú xử lý<\/strong> (nếu muốn)<\/td><td>Ghi lại việc đã làm: tạm dừng quảng cáo, bổ sung ngân sách…<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Đánh dấu đã xử lý<\/code><\/td><td>Cảnh báo chuyển <strong>Đã xử lý<\/strong>, ghi người, thời điểm, ghi chú; việc giao tự xong. Thông báo \"Đã đánh dấu xử lý &lt;n&gt; cảnh báo.\"; danh sách đang lọc Đang mở bỏ các dòng này<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Đóng hộp, không đổi gì<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được đánh dấu:** Trưởng nhóm (trong phạm vi xem), Trưởng/Phó phòng, BGĐ. Chuyên viên không thấy nút\n* Cảnh báo đã xử lý **không sinh lại ở cùng mốc** cho cùng đối tượng. Chỉ khi đối tượng lên mốc cao hơn (từ Cảnh báo lên Vượt mức) mới có cảnh báo mới\n* Đánh dấu ở Bảng điều khiển (loại \"Chi phí chạm ngưỡng cảnh báo\" của [Cảnh báo cần xử lý](../bang-dieu-khien/canh-bao-can-xu-ly.md)) ghi vào cùng cảnh báo này\n* Có cảnh báo vừa đóng hoặc ngoài phạm vi trong lô: hệ thống xử lý phần hợp lệ và báo \"Bỏ qua &lt;m&gt; cảnh báo: &lt;mã&gt; đã chuyển sang trạng thái &lt;Đã xử lý / Tự đóng&gt;.\" Một cảnh báo thì báo \"Cảnh báo &lt;mã&gt; đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\"\n* Câu lỗi: \"Ghi chú xử lý tối đa 1.000 ký tự.\", \"Tối đa 100 cảnh báo mỗi lần xử lý.\", \"Không lưu được, vui lòng thử lại.\"\n\n## <mark style=\"color:green;\">4. Theo dõi chi phí chiến dịch theo nền tảng<\/mark>\n\n<figure><img src=\"images/canh-bao-vuot-muc-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bộ lọc** | **Mức** (\"Cảnh báo và Vượt mức\" mặc định, \"Cảnh báo\", \"Vượt mức\", \"Tất cả\" gồm cả Trong ngưỡng), **Gom theo** (Không gom, Nền tảng, Chiến dịch), **Trạng thái chiến dịch**, **Đội**, ô tìm theo mã hoặc tên chiến dịch |\n| **Dòng \"Cập nhật\"** | \"Chi phí Meta đồng bộ mỗi 1 giờ · gần nhất hh:mm; Google, TikTok và kênh khác cập nhật khi ghi nhận thanh toán\" |\n| **Bảng chiến dịch × nền tảng** | Chiến dịch (mã, tên; bấm để mở chiến dịch), Trạng thái chiến dịch, Nền tảng (kênh phân bổ hoặc \"Ngoài phân bổ\"), Ngân sách, Chi phí thực, % đã dùng (chip theo mức), Còn lại, Đội, Người phụ trách |\n| **Hàng nhóm** | Gom Nền tảng: \"&lt;kênh&gt; · &lt;n&gt; chiến dịch\" cộng ngân sách, chi phí thực, tính lại %. Gom Chiến dịch: \"&lt;mã&gt; &lt;tên&gt;\" với ngân sách đã duyệt, chi phí thực của chiến dịch và chip \"Chi vượt ngân sách đã duyệt\" khi chiến dịch đã chi vượt |\n| **Ghi chú cuối bảng** | \"Bảng chỉ để theo dõi. Chiến dịch chi vượt ngân sách đã duyệt được báo ở Danh sách chiến dịch; chiến dịch từ mốc cảnh báo sớm (mặc định 80%) đến 100% hiện ở Cảnh báo cần xử lý, loại Chiến dịch sắp hết ngân sách.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm tab <strong>Chi phí chiến dịch theo nền tảng<\/strong><\/td><td>Bảng hiện các chiến dịch đã cam kết, chưa chốt chi phí, trong phạm vi của bạn, lọc sẵn mức \"Cảnh báo và Vượt mức\", không gom. Không có dòng nào: \"Không có chiến dịch nào từ mốc cảnh báo sớm trở lên.\" kèm liên kết \"Xem tất cả\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Gom theo<\/strong> Nền tảng hoặc Chiến dịch<\/td><td>Bảng thêm hàng nhóm cộng dồn theo kênh hoặc theo chiến dịch<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm một dòng<\/td><td>Mở chi tiết chiến dịch ở <a href=\"../chien-dich/danh-sach-chien-dich.md\">Danh sách chiến dịch<\/a> (tab Tổng quan)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>ChiPhiChienDich_yyyymmdd.xlsx<\/code> gồm Mã, Tên chiến dịch, Trạng thái, Nền tảng, Ngân sách, Chi phí thực, % đã dùng, Còn lại, Mức, Đội, Người phụ trách<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ngân sách** của một dòng = ngân sách đã duyệt của chiến dịch × tỷ lệ phân bổ của kênh. **Chi phí thực**: kênh Meta là chi phí Meta đồng bộ; mọi kênh cộng thêm các lượt thanh toán của đề xuất chi gắn chiến dịch đó (trừ khoản nạp tiền Meta). Khoản không có kênh hoặc kênh ngoài phân bổ vào dòng \"Ngoài phân bổ\"\n* Chiến dịch chưa phân bổ kênh hiện một dòng nền tảng \"Chưa phân bổ\". Chiến dịch đang chờ duyệt điều chỉnh dùng ngân sách đã duyệt cũ, kèm nhãn \"Chờ duyệt điều chỉnh\"\n* Tab này **chỉ để theo dõi**: không có mã cảnh báo, không có nút xử lý, không giao việc\n* Tải lỗi: \"Không tải được chi phí chiến dịch.\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">5. Sửa ngưỡng cảnh báo<\/mark>\n\n<figure><img src=\"images/canh-bao-vuot-muc-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp **Sửa ngưỡng cảnh báo vượt mức**:\n\n| Ô nhập | Bắt buộc | Mô tả |\n| --- | --- | --- |\n| **Câu dẫn** | - | \"Áp dụng cho dòng phân bổ, hạn mức quý và chiến dịch từ lượt soát kế tiếp. Cảnh báo đang mở dưới mốc mới sẽ tự đóng.\" |\n| **Cảnh báo sớm** | Có | Số nguyên từ 50 đến 99, đơn vị \"% ngân sách\" |\n| **Vượt mức** | - | \"Trên 100% ngân sách (cố định)\", không sửa được |\n| **Lần sửa gần nhất** | - | \"Sửa lần cuối: &lt;người&gt;, dd/mm/yyyy hh:mm, &lt;cũ&gt;% → &lt;mới&gt;%\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Sửa ngưỡng<\/code> ở thẻ ngưỡng<\/td><td>Hộp mở với giá trị hiện tại<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập mốc <strong>Cảnh báo sớm<\/strong> mới<\/td><td>Sai: \"Nhập ngưỡng cảnh báo sớm.\" hoặc \"Ngưỡng cảnh báo sớm phải là số nguyên từ 50 đến 99.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Lưu ngưỡng<\/code><\/td><td>Thông báo \"Đã lưu ngưỡng cảnh báo sớm &lt;x&gt;%. Áp dụng từ lượt soát kế tiếp.\"; thẻ ngưỡng cập nhật; lần sửa được ghi nhật ký. Giá trị không đổi thì hộp đóng, không ghi gì<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Đóng hộp, không lưu<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chỉ Trưởng/Phó phòng và BGĐ** sửa được ngưỡng. Chuyên viên, Trưởng nhóm không thấy nút\n* Mốc cảnh báo sớm là con số dùng chung cho mọi nơi trong phân hệ: nhãn Sắp vượt ở Phân bổ ngân sách, cảnh báo \"Chiến dịch sắp hết ngân sách\", mức cảnh báo của hạn mức quý\n* **Hạ mốc**: ở lượt soát kế tiếp, đối tượng vừa chạm mốc mới sẽ có cảnh báo (trừ đối tượng đã có cảnh báo cùng mốc đã đóng). **Nâng mốc**: cảnh báo mức Cảnh báo đang mở có % dưới mốc mới tự đóng với lý do \"Không còn chạm ngưỡng\"\n* Người khác vừa sửa: \"Ngưỡng cảnh báo vừa được &lt;người&gt; đổi thành &lt;x&gt;%. Tải lại để xem.\"; hệ thống không ghi đè\n\n## <mark style=\"color:green;\">6. Phân biệt các loại \"vượt\" trong phân hệ<\/mark>\n\n| Tên | Ở đâu | So cái gì | Hệ quả |\n| --- | --- | --- | --- |\n| **Cảnh báo Vượt mức** | Màn này | Chi phí thực **đã phát sinh** của dòng phân bổ, kênh hạn mức hoặc cả quý trên 100% ngân sách | Sinh cảnh báo, giao việc |\n| **Nhãn Vượt hạn mức** | [Đề xuất chi](de-xuat-chi.md) | Số tiền **đề nghị** lớn hơn phần còn lại của kênh trong hạn mức quý, tính một lần lúc gửi duyệt | Đề xuất phải ký đủ mọi bậc; không sinh cảnh báo ở đây |\n| **Chi vượt ngân sách đã duyệt** | [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md) | Chi phí thực của **một chiến dịch** trên ngân sách đã duyệt của chiến dịch | Cờ trên chiến dịch, giao việc ở màn chiến dịch |\n| **Vượt phân bổ còn lại** | [Đề xuất chi](de-xuat-chi.md) | Số tiền **đề nghị** so với phần còn lại của dòng phân bổ, chụp lúc gửi duyệt | Chỉ cảnh báo, không chặn, không thêm bậc, không sinh cảnh báo ở đây |\n\n## <mark style=\"color:green;\">7. Phân quyền trên màn Cảnh báo vượt mức<\/mark>\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng | BGĐ |\n| --- | --- | --- | --- | --- |\n| Xem tab Cảnh báo ngân sách, chi tiết, xuất Excel | Dòng phân bổ của kỳ mình | Hạn mức; dòng phân bổ của đội | Tất cả | Tất cả |\n| Xem tab Chi phí chiến dịch, xuất Excel | Chiến dịch của mình | Chiến dịch của đội | Tất cả | Tất cả |\n| Đánh dấu đã xử lý (từng dòng, hàng loạt) | Không | Trong phạm vi xem | Có | Có |\n| Sửa ngưỡng cảnh báo sớm | Không | Không | Có | Có |\n| Nhận việc cảnh báo | Người phụ trách kỳ phân bổ | Trưởng nhóm của đội của kỳ phân bổ | Có | Có |\n", "bao-cao-du-lieu/chi-phi-va-lead.md": "# Chi phí và Lead\n\n🧭 Tổng quan chức năng: Đối chiếu chi phí quảng cáo bỏ ra với số lead thu về theo từng kênh hoặc từng chiến dịch trong kỳ, tính CPL, so với chỉ tiêu lead theo kênh và với kỳ trước, để điều chỉnh phân bổ ngân sách. Màn dành cho Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng Marketing và BGĐ\n\nTruy cập: menu **Báo cáo dữ liệu → Hiệu quả Marketing → Chi phí và Lead**\n\n{% hint style=\"info\" %}\n\n## ĐIỂM RIÊNG CỦA NHÓM BÁO CÁO\n\nMàn dùng chung cách chọn kỳ, bộ lọc và danh sách dữ liệu gốc với Bảng điều khiển. Cách dùng chi tiết xem ở [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md). Ở nhóm Báo cáo có các điểm khác sau:\n\n* **Kỳ mặc định là Tháng này** (từ mùng 1 đến hôm nay), không phải Hôm nay\n* Kỳ và bộ lọc **giữ nguyên khi chuyển qua lại** giữa ba màn Chi phí và Lead, [Doanh thu ghi nhận](doanh-thu-ghi-nhan.md), [Hiệu quả chiến dịch](hieu-qua-chien-dich.md). Tải lại trang thì về Tháng này, không lọc\n* Kỳ và bộ lọc **không mang từ Bảng điều khiển sang**\n* Ô **Xem theo** và ô tìm là điều khiển riêng của màn, không thuộc bộ lọc dùng chung. Đổi **Xem theo** là tính lại ngay, không cần bấm `Áp dụng`\n* Màn chỉ đọc: không tạo, sửa, xóa dữ liệu. Số liệu tính lại mỗi lần mở màn hoặc bấm `Làm mới`\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem chi phí và lead theo kênh<\/mark>\n\n<figure><img src=\"images/chi-phi-va-lead-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Đường dẫn \"Marketing › Báo cáo dữ liệu › Hiệu quả Marketing\", tiêu đề màn. Dòng mô tả dạng \"7 kênh có chi phí hoặc lead · Kỳ 01/10/2026 – 03/10/2026\". Bên phải có ô tìm, nút `Xuất Excel`, nút `Làm mới` và dòng **Cập nhật lúc HH:MM** |\n| **Bộ lọc dùng chung và chọn kỳ** | Nhóm nút kỳ Hôm nay, Hôm qua, 7 ngày, Tháng này, Tùy chọn; khối thu gọn **Bộ lọc dùng chung · N điều kiện** |\n| **Dòng kỳ và so sánh** | \"Kỳ dd/mm/yyyy – dd/mm/yyyy · &lt;nhãn so sánh&gt; dd/mm/yyyy – dd/mm/yyyy\". Nhãn so sánh theo kỳ: Hôm nay \"so với cả ngày hôm qua\"; Hôm qua \"so với hôm kia\"; 7 ngày \"so với 7 ngày liền trước\"; Tháng này \"so với n ngày liền trước\"; Tùy chọn \"so với khoảng liền trước\". Kỳ trước luôn là khoảng liền trước, cùng số ngày |\n| **Ô Xem theo** | Kênh (mặc định) hoặc Chiến dịch |\n| **Liên kết Xem phễu chuyển đổi** | Mở [Phễu và hiệu quả](../bang-dieu-khien/pheu-va-hieu-qua.md) với cùng kỳ và bộ lọc |\n| **Dòng cách cắt số liệu** | Ngay trên bảng: \"Số liệu theo ngày phát sinh trong kỳ dd/mm/yyyy – dd/mm/yyyy\" |\n| **Hàng thẻ tổng** | Bốn thẻ: **Chỉ tiêu lead trong kỳ**, **Lead thực tế**, **Chi phí quảng cáo**, **CPL chung** |\n| **Bảng theo kênh** | Mỗi dòng một kênh có phát sinh chi phí quảng cáo hoặc lead trong kỳ. Cột Kênh cố định khi cuộn ngang; các cột kỳ trước nằm bên phải |\n| **Dòng TỔNG** | Cuối bảng, cộng các dòng đang hiển thị |\n| **Chú thích dưới bảng** | Giải thích chi phí quảng cáo, CPL chung, chỉ tiêu trong kỳ xem |\n\n**Bốn thẻ tổng:**\n\n| Thẻ | Ý nghĩa |\n| --- | --- |\n| **Chỉ tiêu lead trong kỳ** | Tổng chỉ tiêu lead của các kênh, đã chia theo số ngày của kỳ đang xem. Dòng phụ \"chia theo ngày từ kỳ của từng chỉ tiêu\" |\n| **Lead thực tế** | Tổng lead tạo trong kỳ. Dòng phụ \"đạt x% ở kênh có chỉ tiêu\" |\n| **Chi phí quảng cáo** | Tổng chi phí quảng cáo trong kỳ. Dòng phụ \"kỳ trước &lt;tiền&gt; &lt;±x%&gt;\" và giờ đồng bộ \"Chi phí Meta đồng bộ lúc dd/mm/yyyy hh:mm\" |\n| **CPL chung** | Tổng chi phí quảng cáo ÷ tổng lead, gồm cả lead tự nhiên. Dòng phụ \"tổng chi phí QC / tổng lead\" và dòng \"CPL lead quảng cáo &lt;tiền&gt;\": chi phí quảng cáo chia cho lead của riêng các kênh có chi phí quảng cáo (Meta, Google, TikTok) |\n\n**Các cột của bảng:**\n\n| Cột | Ý nghĩa |\n| --- | --- |\n| **Kênh** | Tên kênh Marketing. Lead không có kênh gom vào dòng **(Chưa gắn kênh)** ở cuối bảng |\n| **Chỉ tiêu (kỳ của chỉ tiêu)** | Số lead chỉ tiêu của kênh. Dòng phụ ghi mã chỉ tiêu và kỳ, ví dụ \"MKT-CT-0013 · Quý 4/2026\". Kênh chưa đặt chỉ tiêu ghi \"-\" và \"Chưa đặt chỉ tiêu\" |\n| **Chỉ tiêu trong kỳ xem** | Chỉ tiêu × số ngày giao nhau ÷ số ngày của kỳ chỉ tiêu, làm tròn số nguyên. Dòng phụ ví dụ \"1.920 × 3/92 ngày\" |\n| **Lead thực tế** | Số lead của kênh trong kỳ. Số có gạch chân, bấm để mở danh sách lead |\n| **% đạt** | Lead trong phần ngày giao nhau ÷ chỉ tiêu trong kỳ xem, một chữ số thập phân |\n| **Chi phí quảng cáo** | Chi phí quảng cáo của kênh. Số có gạch chân, bấm để mở danh sách khoản chi |\n| **CPL** | Chi phí quảng cáo ÷ Lead của dòng |\n| **CPL mục tiêu** | CPL mục tiêu ghi trên chỉ tiêu của kênh |\n| **Kết quả** | Chip **Đạt CPL** khi CPL ≤ CPL mục tiêu; **Vượt CPL** khi CPL lớn hơn; **Không có chi phí QC** với kênh không có chi phí quảng cáo; \"-\" khi chưa có CPL mục tiêu hoặc chưa tính được CPL |\n| **Lead kỳ trước, Δ lead** | Số lead kỳ trước và % thay đổi |\n| **Chi phí kỳ trước, Δ chi phí** | Chi phí kỳ trước và % thay đổi |\n| **CPL kỳ trước, Δ CPL** | CPL kỳ trước và % thay đổi |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Báo cáo dữ liệu → Hiệu quả Marketing → Chi phí và Lead<\/strong><\/td><td>Hệ thống mở màn với kỳ đang giữ (lần đầu là Tháng này, không lọc), <strong>Xem theo<\/strong> là Kênh. Dòng trên bảng ghi \"Số liệu theo ngày phát sinh trong kỳ …\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc hàng thẻ tổng<\/td><td>Xem nhanh chỉ tiêu, lead thực tế, chi phí quảng cáo và CPL chung của cả kỳ. Rê chuột lên số tiền rút gọn (ví dụ \"111,2 tr\") để xem giá trị đầy đủ<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc bảng theo kênh<\/td><td>Bảng mặc định xếp theo <strong>Chi phí quảng cáo<\/strong> giảm dần, cùng chi phí thì theo Lead giảm dần. So <strong>CPL<\/strong> với <strong>CPL mục tiêu<\/strong> qua chip <strong>Kết quả<\/strong>; so <strong>Lead thực tế<\/strong> với <strong>Chỉ tiêu trong kỳ xem<\/strong> qua cột <strong>% đạt<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Cuộn ngang sang phải<\/td><td>Xem sáu cột so với kỳ trước. Chênh lệch: Lead tăng là tốt, giảm là xấu; Chi phí và CPL giảm là tốt, tăng là xấu<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Đọc dòng <strong>TỔNG<\/strong><\/td><td>Dòng TỔNG cộng chỉ tiêu, lead, chi phí, số kỳ trước; % đạt, CPL và các Δ tính lại từ tổng<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Bấm <code>Làm mới<\/code> khi cần số mới nhất<\/td><td>Hệ thống tính lại ngay và cập nhật dòng <strong>Cập nhật lúc HH:MM<\/strong>. Màn không tự làm mới<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy dữ liệu gì:** Chuyên viên thấy lead của mình và chi phí của chiến dịch mình phụ trách hoặc tạo. Trưởng nhóm thấy lead của đội và chi phí của chiến dịch có Đội chủ là đội mình. Trưởng/Phó phòng, BGĐ thấy toàn bộ\n* **Chuyên viên không thấy chỉ tiêu:** thẻ **Chỉ tiêu lead trong kỳ** và các cột Chỉ tiêu, % đạt, CPL mục tiêu, Kết quả bị ẩn. Thay vào đó màn ghi \"Chỉ tiêu theo kênh xem được từ Trưởng nhóm\"\n* **Chi phí quảng cáo gồm:** chi phí Meta đồng bộ về hệ thống và các lượt thanh toán còn hiệu lực thuộc khoản mục \"Quảng cáo trả phí\" của kênh Google, TikTok, tính theo ngày và số tiền của từng lượt. Lượt đã hủy không tính. Không gồm KOL, in ấn, sự kiện, khoản nạp tiền cho tài khoản Meta\n* **Kênh không có chi phí quảng cáo** (Zalo OA, Website/SEO, Giới thiệu, Hotline): ô Chi phí quảng cáo, CPL và các cột kỳ trước về chi phí hiển thị \"-\" kèm chú giải \"Kênh không có chi phí quảng cáo\", không hiển thị \"0 đ\". Lead của các kênh này vẫn cộng vào dòng TỔNG\n* **Kênh có chi phí quảng cáo nhưng kỳ này chưa chi:** Chi phí hiển thị \"0 đ\", CPL \"0 đ\" khi có lead\n* **Kênh có chỉ tiêu mà chưa phát sinh** vẫn hiện với Lead 0, % đạt 0,0%, để thấy kênh chưa chạy. Chỉ tiêu chỉ dùng để so, không quyết định kênh nào có mặt\n* **Chi phí Meta chưa khai kênh nhận:** khi Trưởng/Phó phòng chưa khai kênh nhận chi phí Meta trong danh mục kênh, chi phí Meta nằm ở dòng **(Chưa gắn kênh)** kèm chú giải \"Chưa khai kênh nhận chi phí Meta\"\n* **Cột chỉ tiêu bị ẩn khi lọc:** nếu bộ lọc dùng chung có chiều không có chỉ tiêu (Chiến dịch, Nền tảng, Nguồn, Nhân viên…) hoặc lọc từ hai chiều trở lên, các cột Chỉ tiêu, % đạt, CPL mục tiêu, Kết quả bị ẩn\n* **Kỳ Hôm nay** (hoặc Tháng này vào ngày mùng 1): Δ chi phí, CPL kỳ trước, Δ CPL hiển thị \"-\" tới hết ngày; Δ lead vẫn so với cả ngày hôm qua. Dòng **Cập nhật lúc** có thêm nhãn \"chưa trọn ngày\"\n* **Số chi phí có độ trễ:** chi phí Meta đồng bộ mỗi 1 giờ, mỗi lượt lấy lại 3 ngày gần nhất; Google, TikTok tính theo lúc ghi nhận thanh toán\n* **Khớp với Bảng điều khiển:** khi cùng kỳ, cùng bộ lọc, cùng người xem và ô tìm để trống, Lead, Chi phí quảng cáo, CPL ở dòng TỔNG bằng các ô tương ứng ở [Tổng quan ngày](../bang-dieu-khien/tong-quan-ngay.md), [Phễu và hiệu quả](../bang-dieu-khien/pheu-va-hieu-qua.md) và dòng Tổng của [Hiệu suất đội nhóm](../bang-dieu-khien/hieu-suat-doi-nhom.md) chế độ Theo đội. Số của một kênh ở đây **không** so với [Chỉ tiêu theo kênh](../ke-hoach/chi-tieu-theo-kenh.md) vì hai màn gán chi phí Meta về kênh theo cách khác nhau\n* Màn trống thì hiện \"Không có chi phí hoặc lead nào trong kỳ hoặc bộ lọc này.\"; thẻ Lead là 0, Chi phí 0 đ, CPL \"-\"\n* Lỗi tải số liệu thì màn giữ kỳ, bộ lọc và hiện \"Không tải được số liệu\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi phí và lead theo chiến dịch<\/mark>\n\n<figure><img src=\"images/chi-phi-va-lead-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Hàng thẻ tổng** | Ba thẻ **Lead thực tế**, **Chi phí quảng cáo**, **CPL chung**. Không có thẻ chỉ tiêu |\n| **Cột Chiến dịch** | Tên chiến dịch (bấm để mở chi tiết chiến dịch), dòng phụ là mã dạng `CMP-yymm-nn` |\n| **Cột Kênh** | Các kênh triển khai của chiến dịch, cách nhau dấu phẩy |\n| **Cột Lead thực tế, Chi phí quảng cáo, CPL** | Như khi xem theo kênh, gán theo chiến dịch |\n| **Sáu cột kỳ trước** | Lead, chi phí, CPL của chính chiến dịch trong kỳ trước và % thay đổi |\n| **Dòng chưa gắn** | Ở cuối bảng, chữ nghiêng: \"Không gắn chiến dịch · &lt;kênh&gt;\" và \"Chiến dịch UTM &lt;tên&gt; · chưa nối chiến dịch\" |\n| **Chú thích dưới bảng** | \"Số của chiến dịch ở đây chỉ gồm phần phát sinh trong kỳ; số lũy kế toàn chiến dịch xem ở Hiệu quả chiến dịch.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở ô <strong>Xem theo<\/strong>, chọn <strong>Chiến dịch<\/strong><\/td><td>Hệ thống tính lại ngay theo chiến dịch, không cần bấm <code>Áp dụng<\/code>. Dòng mô tả đổi thành \"&lt;n&gt; chiến dịch có chi phí hoặc lead · Kỳ …\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc bảng theo chiến dịch<\/td><td>Mỗi dòng là một chiến dịch có phát sinh chi phí quảng cáo hoặc lead trong kỳ. Các dòng chưa gắn chiến dịch nằm cuối bảng<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm tên chiến dịch (nếu cần)<\/td><td>Hệ thống mở chi tiết chiến dịch ở <a href=\"../chien-dich/danh-sach-chien-dich.md\">Danh sách chiến dịch<\/a><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn lại <strong>Kênh<\/strong> ở ô <strong>Xem theo<\/strong><\/td><td>Hệ thống về bảng theo kênh, giữ kỳ và bộ lọc<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Số ở đây là số trong kỳ, không phải số lũy kế của chiến dịch.** Một chiến dịch chạy từ tháng trước chỉ được tính phần lead và chi phí phát sinh trong kỳ đang xem. Số lũy kế toàn chiến dịch xem ở [Hiệu quả chiến dịch](hieu-qua-chien-dich.md) hoặc [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md)\n* Khi xem theo chiến dịch **không có** cột chỉ tiêu, CPL mục tiêu, Kết quả vì chỉ tiêu lead đặt theo kênh, không đặt theo chiến dịch. Mục tiêu của chiến dịch so ở [Hiệu quả chiến dịch](hieu-qua-chien-dich.md)\n* Chiến dịch bắt đầu sau kỳ trước vẫn có cột kỳ trước: Lead kỳ trước 0, Chi phí kỳ trước 0 đ, các Δ là \"-\"\n* Lead, chi phí chỉ tính về chiến dịch khi chiến dịch đã nối chiến dịch UTM. Lead không có chiến dịch UTM gom theo kênh vào dòng \"Không gắn chiến dịch · &lt;kênh&gt;\"\n* Dòng \"Chiến dịch UTM … · chưa nối chiến dịch\" có chi phí chỉ khi người xem là Trưởng/Phó phòng hoặc BGĐ\n* Dòng TỔNG khi xem theo chiến dịch bằng dòng TỔNG khi xem theo kênh, cùng kỳ và bộ lọc. Một dòng chiến dịch X bằng số ở [Tổng quan ngày](../bang-dieu-khien/tong-quan-ngay.md) khi đặt bộ lọc Chiến dịch = X\n\n## <mark style=\"color:green;\">3. Chọn kỳ và đặt bộ lọc<\/mark>\n\nCách chọn kỳ, nhập khoảng ngày tùy chọn và đặt bộ lọc dùng chung giống Bảng điều khiển, xem [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md). Phần dưới chỉ ghi các điểm riêng của màn này\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kỳ: <code>Hôm nay<\/code>, <code>Hôm qua<\/code>, <code>7 ngày<\/code>, <code>Tháng này<\/code> hoặc <code>Tùy chọn<\/code><\/td><td>Mặc định là <strong>Tháng này<\/strong>. Chọn <code>Tùy chọn<\/code> mở hộp <strong>Chọn khoảng ngày<\/strong>; khoảng tối đa 366 ngày. Muốn xem theo tuần, quý, năm thì dùng <code>Tùy chọn<\/code><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Mở khối <strong>Bộ lọc dùng chung<\/strong>, chọn giá trị cho các chiều cần lọc<\/td><td>Mỗi chiều chọn một giá trị, các chiều kết hợp cùng lúc. Chiều Trang web, Kênh nhập khách tiềm năng, Khu vực đang khóa, chú giải \"Chưa có dữ liệu để lọc\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <code>Áp dụng<\/code><\/td><td>Hệ thống tính lại số kỳ này và kỳ trước với cùng điều kiện lọc<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm <code>Xóa bộ lọc<\/code> khi muốn bỏ lọc<\/td><td>Mọi chiều về \"Tất cả\", hệ thống tính lại<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chi phí chỉ lọc được theo Chiến dịch, Nền tảng, Nhóm, Sản phẩm.** Khi lọc theo chiều khác (ví dụ Nhân viên), ô chi phí vẫn là số chưa lọc theo chiều đó, kèm chú thích \"Chi phí chưa lọc theo chiều này\"; CPL, Δ CPL hiển thị \"-\" kèm cùng chú thích\n* Khi có bộ lọc mà kỳ trước không so được, ô so sánh hiển thị \"-\" kèm \"Không so sánh được với bộ lọc này\"\n* Trưởng nhóm chỉ chọn được giá trị thuộc đội mình, ví dụ không chọn được đội khác ở chiều Nhóm\n\n## <mark style=\"color:green;\">4. Tìm và sắp xếp<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhập từ khóa vào ô <strong>Tìm theo mã, tên…<\/strong><\/td><td>Tìm theo tên kênh, mã hoặc tên chiến dịch, không phân biệt hoa thường và dấu. Tối đa 100 ký tự; vượt thì báo \"Ô tìm tối đa 100 ký tự.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem kết quả<\/td><td>Bảng chỉ còn dòng khớp. Dòng TỔNG và hàng thẻ chỉ cộng các dòng đang hiện, ghi \"TỔNG (n/m dòng khớp tìm kiếm)\". Không có dòng nào khớp thì hiện 'Không có dòng nào khớp \"&lt;từ khóa&gt;\".'<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm tiêu đề cột để sắp xếp<\/td><td>Bấm lần nữa để đảo chiều. Ô \"-\" luôn xuống cuối; dòng chưa gắn luôn ở cuối bảng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xóa ô tìm<\/td><td>Bảng và dòng TỔNG trở về toàn bộ<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Khi ô tìm có chữ, dòng TỔNG không còn so được với Bảng điều khiển. Muốn đối chiếu số thì để trống ô tìm\n\n## <mark style=\"color:green;\">5. Xem danh sách lead và khoản chi của một dòng<\/mark>\n\n<figure><img src=\"images/chi-phi-va-lead-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nBấm số **Lead thực tế** hoặc **Chi phí quảng cáo** có gạch chân để mở danh sách dữ liệu gốc dùng chung của Bảng điều khiển. Cách lọc nhanh, sắp xếp, phân trang trong danh sách xem ở [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md)\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | Danh sách lead: \"Lead · &lt;kênh hoặc chiến dịch hoặc Tất cả&gt; · &lt;kỳ&gt; · &lt;n&gt; bản ghi\". Danh sách khoản chi: \"Chi phí quảng cáo · &lt;dòng&gt; · &lt;kỳ&gt;\" |\n| **Dòng Đang lọc** | Liệt kê kỳ, bộ lọc đang áp và điều kiện của dòng, ví dụ \"Kênh = Meta Ads\" hoặc \"Chiến dịch = CMP-2610-01\". Dòng chưa gắn ghi \"Kênh = (trống)\" hoặc \"Chiến dịch = (trống)\" |\n| **Bảng lead** | Cột Khách hàng (mã dạng `KH000001`), Nguồn, Chiến dịch, Đội nhóm MKT, Giờ vào, Trạng thái. Phân trang 20 dòng |\n| **Bảng khoản chi** | Cột Ngày, Chiến dịch, Nền tảng, Nguồn tiền, Chi phí, Hiển thị, Nhấp chuột, CPC. Nguồn tiền ghi \"Số liệu Meta\" hoặc mã lượt thanh toán kèm mã đề xuất chi |\n| **Dòng TỔNG** (bảng khoản chi) | Tổng cột Chi phí, bằng số tiền đã bấm |\n| **Chú thích** (bảng khoản chi) | \"Chỉ gồm chi phí quảng cáo (Meta và khoản thanh toán quảng cáo trả phí của Google, TikTok); khoản chi khác (KOL, in ấn…) không vào CPL.\" |\n| **Nút Quay lại** | Về màn Chi phí và Lead |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm số <strong>Lead thực tế<\/strong> của một dòng<\/td><td>Hệ thống mở danh sách lead của dòng đó với đúng kỳ, bộ lọc và phạm vi của bạn. Tổng số bản ghi bằng số đã bấm<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm số <strong>Chi phí quảng cáo<\/strong> của một dòng<\/td><td>Hệ thống mở danh sách khoản chi quảng cáo của dòng đó, mặc định xếp Ngày giảm dần. Mỗi dòng là một ngày số liệu Meta hoặc một lượt thanh toán; dòng thanh toán ghi \"-\" ở Hiển thị, Nhấp chuột, CPC<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm số ở dòng <strong>TỔNG<\/strong> (nếu cần)<\/td><td>Hệ thống mở danh sách của cả kỳ, không thêm điều kiện dòng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Lọc nhanh, sắp xếp, bấm mã<\/td><td>Bấm mã khách hàng mở hồ sơ khách hàng; bấm mã lượt thanh toán mở chi tiết lượt ở <a href=\"../quan-ly-chi-phi-ngan-sach/thanh-toan.md\">Thanh toán<\/a>. Khi lọc nhanh, danh sách ghi \"N khớp trên tổng M\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm <code>Quay lại<\/code><\/td><td>Hệ thống về màn Chi phí và Lead, giữ kỳ, bộ lọc, Xem theo, ô tìm và cột đang sắp xếp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Ô chi phí \"-\" của kênh không có chi phí quảng cáo không gạch chân, không bấm được\n* Bấm số ở dòng chưa gắn chỉ mở đúng phần chưa gắn (kênh trống, chiến dịch trống hoặc đúng chiến dịch UTM chưa nối), không mở toàn bộ dữ liệu của kỳ\n* Lượt thanh toán đã hủy không có trong danh sách khoản chi\n* Bản ghi ngoài phạm vi của bạn thì phân hệ sở hữu chặn khi mở, báo \"Bạn không có quyền thực hiện thao tác này.\"\n* Lỗi tải danh sách thì hiện \"Không tải được dữ liệu.\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">6. Xuất Excel<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kỳ, bộ lọc, Xem theo và ô tìm như muốn xuất<\/td><td>Tệp xuất đúng các thẻ và bảng đang hiển thị<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm <code>Xuất Excel<\/code><\/td><td>Trình duyệt tải tệp <code>ChiPhiVaLead_&lt;từ ngày&gt;_&lt;đến ngày&gt;.xlsx<\/code>, ngày dạng yyyymmdd, ví dụ <code>ChiPhiVaLead_20261001_20261003.xlsx<\/code><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Mở tệp<\/td><td>Đầu trang có tên màn, kỳ, nhãn so sánh, cách cắt số liệu, dòng \"Đang lọc: …\" và \"Cập nhật lúc\". Tiền là số VND đầy đủ, không rút gọn; ô \"-\" giữ nguyên \"-\"; ngày dạng dd/mm/yyyy<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Tệp chỉ có dữ liệu trong phạm vi bạn xem được và các dòng đang hiện theo ô tìm\n* Không có dòng nào thì hệ thống không tải tệp, hiện \"Không có dữ liệu để xuất.\"\n* Lỗi tạo tệp thì hiện \"Không xuất được tệp, vui lòng thử lại.\"\n", "bao-cao-du-lieu/doanh-thu-ghi-nhan.md": "# Doanh thu ghi nhận\n\n🧭 Tổng quan chức năng: Xem doanh thu thực tế từ các đơn chốt có nguồn là lead Marketing, theo kênh hoặc theo chiến dịch, so với chỉ tiêu doanh thu và kỳ trước, kèm ROAS, ROI và lợi nhuận gộp. Đây cũng là nơi nạp giá vốn cho đơn hàng. Màn dành cho Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng Marketing, BGĐ và Trưởng phòng Sale\n\nTruy cập: menu **Báo cáo dữ liệu → Hiệu quả Marketing → Doanh thu ghi nhận**\n\n{% hint style=\"info\" %}\n\n## ĐIỂM RIÊNG CỦA NHÓM BÁO CÁO\n\nMàn dùng chung cách chọn kỳ, bộ lọc và danh sách dữ liệu gốc với Bảng điều khiển, xem [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md). Điểm khác ở nhóm Báo cáo:\n\n* **Kỳ mặc định là Tháng này.** Kỳ và bộ lọc giữ khi chuyển qua lại giữa [Chi phí và Lead](chi-phi-va-lead.md), Doanh thu ghi nhận, [Hiệu quả chiến dịch](hieu-qua-chien-dich.md); tải lại trang thì về Tháng này, không lọc\n* Kỳ và bộ lọc không mang từ Bảng điều khiển sang, **trừ** khi bạn mở màn này bằng nút `Nạp giá vốn` ở [Phễu và hiệu quả](../bang-dieu-khien/pheu-va-hieu-qua.md): khi đó màn giữ kỳ và bộ lọc của Phễu\n* Ô **Xem theo**, ô **Chế độ xem** và ô tìm là điều khiển riêng của màn, không thuộc bộ lọc dùng chung. Đổi hai ô này là tính lại ngay\n* Đơn tính theo **ngày đặt đơn** nằm trong kỳ\n\n## QUY TRÌNH NẠP GIÁ VỐN\n\nBước 1: Trưởng/Phó phòng hoặc BGĐ bấm `Nạp giá vốn` ở màn này hoặc ở Phễu và hiệu quả\n\nBước 2: Nạp bằng tệp CSV (`Nạp CSV`) hoặc nhập tay từng ô rồi bấm `Lưu giá vốn`\n\nBước 3: Hệ thống kiểm toàn bộ dữ liệu. Có bất kỳ dòng hoặc ô sai nào thì **không ghi gì** và báo lỗi để sửa\n\nBước 4: Dữ liệu hợp lệ thì hệ thống ghi giá vốn vào đơn, ghi người nạp, thời điểm nạp và nhật ký. Lợi nhuận gộp tính lại ngay ở mọi màn\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem doanh thu tổng hợp theo kênh hoặc chiến dịch<\/mark>\n\n<figure><img src=\"images/doanh-thu-ghi-nhan-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Đường dẫn \"Marketing › Báo cáo dữ liệu › Hiệu quả Marketing\", tiêu đề màn. Dòng mô tả dạng \"7 đơn · doanh thu 486,0 tr · đạt 31,2% chỉ tiêu trong kỳ · Kỳ 01/10/2026 – 03/10/2026\". Bên phải có ô tìm, nút `Nạp giá vốn` (chỉ người có quyền), `Xuất Excel`, `Làm mới` và dòng **Cập nhật lúc HH:MM** |\n| **Bộ lọc dùng chung và chọn kỳ** | Nhóm nút kỳ và khối **Bộ lọc dùng chung · N điều kiện** |\n| **Dòng kỳ, so sánh và cách cắt số liệu** | \"Kỳ … · &lt;nhãn so sánh&gt; …\"; ngay trên bảng: \"Số liệu theo ngày phát sinh trong kỳ …\" |\n| **Ô Xem theo** | Kênh (mặc định) hoặc Chiến dịch |\n| **Ô Chế độ xem** | Tổng hợp (mặc định) hoặc Chi tiết đơn |\n| **Bảng tổng hợp** | Mỗi dòng một kênh hoặc một chiến dịch có đơn chốt, có chi phí quảng cáo, hoặc (xem theo kênh) có chỉ tiêu doanh thu trong kỳ. Mặc định xếp Doanh thu giảm dần |\n| **Dòng TỔNG** | Cuối bảng |\n| **Nút Kiểm tra nguồn / điểm chạm** | Dưới bảng, chỉ Trưởng/Phó phòng Marketing, BGĐ, Trưởng phòng Sale thấy |\n| **Chú thích dưới bảng** | \"Chỉ tính đơn đã chốt có nguồn từ lead Marketing; đơn Sale tự tạo không vào báo cáo. ROAS = Doanh thu / Chi phí quảng cáo; ROI = (Doanh thu − Chi phí quảng cáo) / Chi phí quảng cáo, chi phí lấy như màn Chi phí và Lead. Lợi nhuận gộp = Doanh thu − Giá vốn, chỉ tính khi mọi đơn đã có giá vốn.\" |\n\n**Các cột của bảng:**\n\n| Cột | Ý nghĩa |\n| --- | --- |\n| **Kênh** hoặc **Chiến dịch** | Tên kênh; hoặc tên chiến dịch kèm mã dạng `CMP-yymm-nn`, bấm tên để mở chi tiết chiến dịch. Dòng chưa gắn nằm cuối bảng |\n| **Đơn chốt**, **Doanh thu** | Số đơn chốt và tổng tiền đơn (gồm thuế) của dòng. Số có gạch chân, bấm để xem danh sách đơn của dòng |\n| **Doanh thu kỳ trước**, **% so kỳ trước** | Doanh thu của kỳ liền trước cùng số ngày và % thay đổi |\n| **Chỉ tiêu doanh thu trong kỳ**, **% đạt chỉ tiêu** | Chỉ tiêu doanh thu của kênh chia theo số ngày giao với kỳ xem, và % đạt. Chỉ có khi xem theo kênh |\n| **Chi phí quảng cáo** | Cùng số với cột Chi phí quảng cáo của cùng dòng ở [Chi phí và Lead](chi-phi-va-lead.md) |\n| **ROAS** | Doanh thu ÷ Chi phí quảng cáo, dạng \"4,7×\" |\n| **ROI** | (Doanh thu − Chi phí quảng cáo) ÷ Chi phí quảng cáo, dạng % |\n| **Giá vốn** | Tổng giá vốn các đơn của dòng khi mọi đơn đã có giá vốn; còn thiếu thì ghi \"Chưa đủ giá vốn (x/y đơn)\" |\n| **Lợi nhuận gộp** | Doanh thu − Giá vốn; còn thiếu giá vốn thì ghi \"Chưa đủ giá vốn\" |\n| **Biên lợi nhuận gộp** | Lợi nhuận gộp ÷ Doanh thu, dạng % |\n| **ROI lợi nhuận gộp** | (Lợi nhuận gộp − Chi phí quảng cáo) ÷ Chi phí quảng cáo, dạng % |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Báo cáo dữ liệu → Hiệu quả Marketing → Doanh thu ghi nhận<\/strong><\/td><td>Hệ thống mở màn với kỳ, bộ lọc đang giữ, <strong>Chế độ xem<\/strong> là Tổng hợp, <strong>Xem theo<\/strong> là Kênh<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc dòng mô tả dưới tiêu đề<\/td><td>Thấy nhanh số đơn, tổng doanh thu và % đạt chỉ tiêu của cả kỳ<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc bảng tổng hợp<\/td><td>So doanh thu với kỳ trước và với chỉ tiêu; xem ROAS, ROI để biết kênh nào mang lại doanh thu tốt trên chi phí quảng cáo<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xem cột <strong>Giá vốn<\/strong>, <strong>Lợi nhuận gộp<\/strong><\/td><td>Dòng ghi \"Chưa đủ giá vốn (x/y đơn)\" nghĩa là còn đơn chưa nạp giá vốn; xem mục 5 và mục 6 về nạp giá vốn<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Đổi <strong>Xem theo<\/strong> sang <strong>Chiến dịch<\/strong> (nếu cần)<\/td><td>Hệ thống tính lại ngay theo chiến dịch; cột chỉ tiêu ẩn. Cuối bảng có dòng \"Không gắn chiến dịch · &lt;kênh&gt;\" và \"Chiến dịch UTM … · chưa nối chiến dịch\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Bấm <code>Làm mới<\/code> khi cần số mới nhất<\/td><td>Hệ thống tính lại và cập nhật dòng <strong>Cập nhật lúc HH:MM<\/strong><\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Đơn nào được tính:** đơn bán hàng đã xác nhận (kể cả đã khóa), có lead nguồn Marketing, ngày đặt đơn trong kỳ. Đơn Sale tự tạo không có lead nguồn không vào báo cáo. Đơn chốt rồi bị hủy thì tự rời báo cáo; trả hàng, hoàn tiền sau khi chốt chưa trừ. Không có thao tác \"ghi nhận\" bằng tay\n* Đơn khác VND được quy đổi về VND theo tỷ giá ngày đặt đơn\n* Đơn gán về kênh, chiến dịch theo thông tin lưu trên đơn (lấy từ cơ hội khi tạo đơn)\n* **Kênh không có chi phí quảng cáo** (Zalo OA, Website/SEO, Giới thiệu, Hotline) hoặc kênh có chi phí bằng 0: Chi phí quảng cáo, ROAS, ROI hiển thị \"-\"\n* **Giá vốn phải đủ mới có lợi nhuận:** chỉ khi **mọi** đơn của dòng đã có giá vốn thì mới hiện Giá vốn, Lợi nhuận gộp, Biên, ROI lợi nhuận gộp. Giá vốn bằng 0 là hợp lệ. Dòng TỔNG có lợi nhuận khi mọi đơn của kỳ đã đủ giá vốn\n* **Chuyên viên:** thấy số liệu của mình; không thấy cột chỉ tiêu, Giá vốn, Lợi nhuận gộp, Biên, ROI lợi nhuận gộp. Số Đơn chốt, Doanh thu không gạch chân, có biểu tượng khóa và chú giải \"Không mở được danh sách đơn hàng\"; mục Chi tiết đơn ở ô **Chế độ xem** bị khóa\n* **Trưởng nhóm:** thấy số liệu của đội, có giá vốn và lợi nhuận, xem được Chi tiết đơn\n* **Trưởng phòng Sale:** thấy mọi đơn có nguồn Marketing, cả hai chế độ, kể cả giá vốn và lợi nhuận gộp của đơn. Không thấy cột chỉ tiêu, Chi phí quảng cáo, ROAS, ROI, ROI lợi nhuận gộp; ô **Xem theo** chỉ có Kênh; tên chiến dịch là chữ thường, không mở được chi tiết chiến dịch; không có nút `Nạp giá vốn`. Trưởng phòng Sale không vào được Chi phí và Lead và Hiệu quả chiến dịch\n* **Khớp với Bảng điều khiển:** khi cùng kỳ, bộ lọc, người xem và ô tìm để trống, Đơn chốt, Doanh thu, ROAS, ROI ở dòng TỔNG bằng các ô cùng tên ở [Tổng quan ngày](../bang-dieu-khien/tong-quan-ngay.md) và [Phễu và hiệu quả](../bang-dieu-khien/pheu-va-hieu-qua.md); Lợi nhuận gộp bằng bước Lợi nhuận gộp ở Phễu và hiệu quả\n* **Kỳ Hôm nay** (hoặc Tháng này vào ngày mùng 1): ROAS, ROI không so kỳ trước; doanh thu vẫn so với cả ngày hôm qua\n* Lọc theo chiều chưa lọc được chi phí (ví dụ Nhân viên): chi phí là số chưa lọc kèm chú thích \"Chi phí chưa lọc theo chiều này\"; ROAS, ROI, ROI lợi nhuận gộp hiển thị \"-\"\n* Màn trống thì hiện \"Không có dòng nào khớp bộ lọc.\"; lỗi tải thì hiện \"Không tải được số liệu\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết đơn<\/mark>\n\n<figure><img src=\"images/doanh-thu-ghi-nhan-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChế độ **Chi tiết đơn** liệt kê từng đơn tạo nên doanh thu của kỳ. Chỉ Trưởng nhóm trở lên và Trưởng phòng Sale dùng được\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Chip lọc dòng** | \"Kênh = &lt;kênh&gt; ✕\" hoặc \"Chiến dịch = &lt;mã&gt; ✕\", hiện khi mở từ số của một dòng |\n| **Bảng đơn** | Cột: Mã đơn, Ngày chốt (ngày đặt đơn), Khách hàng, Giá trị, Chiến dịch (tên, mã), Kênh, Đội nhóm MKT, Nhân viên Marketing, Sale phụ trách, Trực page, Giá vốn, Lợi nhuận gộp |\n| **Dòng TỔNG** | \"n đơn\", tổng Giá trị, tổng Giá vốn hoặc \"Chưa đủ giá vốn (x/y đơn)\", tổng Lợi nhuận gộp khi đủ |\n| **Phân trang** | 50 dòng một trang; mặc định Ngày chốt giảm dần |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở ô <strong>Chế độ xem<\/strong>, chọn <strong>Chi tiết đơn<\/strong><\/td><td>Hệ thống hiện mọi đơn chốt có nguồn Marketing của kỳ, bộ lọc, phạm vi. Ô <strong>Xem theo<\/strong> ẩn ở chế độ này<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Hoặc: ở chế độ Tổng hợp, bấm số <strong>Đơn chốt<\/strong> hoặc <strong>Doanh thu<\/strong> của một dòng<\/td><td>Hệ thống mở Chi tiết đơn đã lọc theo dòng đó, có chip \"Kênh = … ✕\" hoặc \"Chiến dịch = … ✕\". Số đơn và tổng giá trị bằng số đã bấm<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm ✕ trên chip (nếu cần)<\/td><td>Bỏ lọc dòng, hiện mọi đơn của kỳ và bộ lọc<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xem cột <strong>Giá vốn<\/strong><\/td><td>Đơn chưa có giá vốn ghi \"Chưa nạp\"; Lợi nhuận gộp của đơn đó là \"-\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm mã đơn<\/td><td>Mở hộp chi tiết đơn hàng (mục 3)<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Chọn lại <strong>Tổng hợp<\/strong> ở ô <strong>Chế độ xem<\/strong><\/td><td>Về bảng tổng hợp, giữ kỳ, bộ lọc, Xem theo<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ngày chốt** là ngày đặt đơn theo giờ Việt Nam, cũng là ngày dùng để xác định đơn thuộc kỳ nào\n* Cột **Sale phụ trách** và **Nhân viên Marketing** lấy theo thông tin trên đơn. Cột **Trực page** hiển thị \"-\" kèm chú giải \"Chưa có dữ liệu điểm chạm\" cho tới khi hệ thống có dữ liệu điểm chạm\n* Trưởng phòng Sale thấy cột Giá vốn, Lợi nhuận gộp vì đây là dữ liệu bán hàng; tên chiến dịch là chữ thường\n* Chuyên viên mở chế độ này bằng đường khác sẽ bị chặn: \"Bạn chưa được cấp quyền xem danh sách đơn hàng. Số tổng vẫn hiển thị trên bảng điều khiển. Liên hệ trưởng phòng nếu cần xem chi tiết đơn.\"\n* Kỳ không có đơn thì hiện \"Không có đơn nào từ lead Marketing trong kỳ.\"\n\n## <mark style=\"color:green;\">3. Xem chi tiết một đơn hàng<\/mark>\n\n<figure><img src=\"images/doanh-thu-ghi-nhan-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | \"Đơn hàng &lt;mã đơn&gt;\" |\n| **Bảng thông tin** | Ngày chốt, Giá trị đơn, Kênh, Chiến dịch (tên · mã, hoặc \"Không gắn chiến dịch\"), Lead nguồn, Điểm chạm cuối, Sale phụ trách, Nhân viên Marketing, Trực page, Giá vốn (\"Chưa nạp\" hoặc số kèm \"nạp bởi &lt;người&gt; lúc dd/mm/yyyy hh:mm\"), Lợi nhuận gộp |\n| **Bảng tương tác** | Thời điểm, Tương tác, Sale, Marketing, Trực page; dòng điểm chạm cuối ghi \"Ghi nhận doanh số\". Chưa có dữ liệu điểm chạm thì ẩn bảng, hiện \"Chưa có dữ liệu điểm chạm\" |\n| **Nút** | `Mở đơn hàng`, `Đóng` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm mã đơn ở bảng Chi tiết đơn hoặc ở hộp Nguồn và điểm chạm<\/td><td>Hệ thống mở hộp chi tiết đơn, chỉ đọc<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc thông tin đơn<\/td><td>Xem kênh, chiến dịch, người phụ trách, giá vốn và lợi nhuận gộp của đơn<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <code>Mở đơn hàng<\/code> (nếu cần)<\/td><td>Hệ thống mở đơn ở phân hệ Bán hàng theo quyền của phân hệ đó. Không có quyền thì báo \"Bạn không có quyền thực hiện thao tác này.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm <code>Đóng<\/code><\/td><td>Đóng hộp, về danh sách đơn<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Mục **Lead nguồn**, **Điểm chạm cuối** và bảng tương tác chỉ hiện với Trưởng/Phó phòng Marketing, BGĐ, Trưởng phòng Sale\n\n## <mark style=\"color:green;\">4. Kiểm tra nguồn và điểm chạm<\/mark>\n\n<figure><img src=\"images/doanh-thu-ghi-nhan-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ Trưởng/Phó phòng Marketing, BGĐ, Trưởng phòng Sale thấy nút này\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | \"Nguồn và điểm chạm · kỳ dd/mm/yyyy – dd/mm/yyyy\" |\n| **Cột Đơn** | Mã đơn, bấm để mở hộp chi tiết đơn |\n| **Cột Lead nguồn** | Mã khách hàng nguồn của đơn, dòng phụ là ngày tạo lead |\n| **Cột Kênh · chiến dịch** | Kênh, mã chiến dịch của đơn |\n| **Cột Điểm chạm cuối** | Loại tương tác · kênh · thời điểm · người; chưa có thì \"Chưa có dữ liệu điểm chạm\" |\n| **Cột Doanh số ghi nhận cho** | Sale, Marketing, Trực page ở điểm chạm cuối. Chưa có điểm chạm thì ghi Sale phụ trách và nhân viên Marketing của đơn, kèm nhãn \"theo đơn, chưa theo điểm chạm\" |\n| **Chú thích** | \"Chỉ Trưởng/Phó phòng Marketing, Trưởng phòng Sale và BGĐ xem được. Doanh số ghi nhận theo điểm chạm cuối.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm <code>Kiểm tra nguồn / điểm chạm<\/code> dưới bảng<\/td><td>Hệ thống mở hộp liệt kê các đơn chốt có nguồn Marketing của kỳ và bộ lọc đang xem. Bảng cuộn ngang được, cột đầu cố định; 50 dòng một trang<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đối chiếu từng đơn<\/td><td>Kiểm đơn đến từ lead nào, kênh và chiến dịch nào, doanh số ghi cho ai<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm mã đơn (nếu cần)<\/td><td>Mở hộp chi tiết đơn hàng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm <code>Đóng<\/code><\/td><td>Về màn Doanh thu ghi nhận, giữ kỳ và bộ lọc<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Doanh thu luôn thuộc kênh và chiến dịch của lead nguồn. Doanh số cá nhân (Sale, Marketing, trực page) ghi cho người ở điểm chạm cuối trước lúc chốt đơn\n* Kỳ không có đơn thì hộp hiện \"Không có đơn nào từ lead Marketing trong kỳ.\"\n\n## <mark style=\"color:green;\">5. Nạp giá vốn bằng tệp CSV<\/mark>\n\n<figure><img src=\"images/doanh-thu-ghi-nhan-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ Trưởng/Phó phòng Marketing và BGĐ\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | \"Nạp giá vốn theo đơn\" |\n| **Hướng dẫn** | \"CSV: ma_don,gia_von. Giá vốn là số nguyên VND, không có dấu phân cách. Để trống nghĩa là chưa có; giá vốn 0 là dữ liệu hợp lệ.\" |\n| **Ô Chọn CSV** | Chỉ nhận tệp `.csv`, tối đa 5 MB và 10.000 dòng |\n| **Bảng đơn** | Cột Mã đơn, Ngày chốt, Giá vốn (đ), Doanh thu, Đã nạp (người, thời điểm). Gồm đơn chốt của kỳ, bộ lọc đang xem; đơn chưa có giá vốn xếp trước |\n| **Liên kết Nhật ký nạp giá vốn** | Mở danh sách các lần nạp: thời điểm, người, tên tệp hoặc \"Nhập tay\", số dòng, số đơn cập nhật |\n| **Nút** | `Nạp CSV`, `Tải mẫu CSV`, `Hủy`, `Lưu giá vốn` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm <code>Nạp giá vốn<\/code> trên thanh tiêu đề<\/td><td>Hệ thống mở hộp <strong>Nạp giá vốn theo đơn<\/strong>. Nếu bạn bấm <code>Nạp giá vốn<\/code> ở Phễu và hiệu quả, hệ thống mở màn này với kỳ, bộ lọc của Phễu và mở sẵn hộp<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm <code>Tải mẫu CSV<\/code><\/td><td>Trình duyệt tải tệp <code>Mau_gia_von.csv<\/code> gồm dòng tiêu đề và các đơn chốt của kỳ, bộ lọc đang xem; cột giá vốn điền giá trị hiện có hoặc để trống<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Điền cột <strong>gia_von<\/strong> trong tệp<\/td><td>Mỗi dòng hai cột <code>ma_don, gia_von<\/code>. Giá vốn là số nguyên VND, không dấu phân cách, tối đa 12 chữ số. Để trống nghĩa là chưa có: dòng đó bỏ qua, giá vốn cũ giữ nguyên. Lưu tệp dạng CSV mã UTF-8<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Ở ô <strong>Chọn CSV<\/strong>, chọn tệp vừa điền<\/td><td>Chỉ chọn được tệp <code>.csv<\/code><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm <code>Nạp CSV<\/code><\/td><td>Hệ thống đọc và kiểm toàn bộ tệp. Hợp lệ thì áp dụng ngay cho mọi đơn trong tệp (kể cả đơn ngoài kỳ đang xem), hiện \"Đã nạp giá vốn cho &lt;n&gt; đơn.\", đóng hộp và tính lại màn<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nếu tệp có lỗi<\/td><td>Hệ thống hiện khung lỗi \"Tệp có dòng không hợp lệ, KHÔNG áp dụng dòng nào:\" rồi liệt kê từng dòng lỗi. Sửa tệp rồi bấm <code>Nạp CSV<\/code> lại<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Mở từ Phễu và hiệu quả: bấm <code>Quay lại Phễu và hiệu quả<\/code><\/td><td>Nút hiện sau khi nạp thành công; hệ thống về Phễu với kỳ, bộ lọc cũ<\/td><\/tr>\n<\/tbody><\/table>\n\n**Các câu báo lỗi khi nạp tệp:**\n\n| Câu báo | Nguyên nhân |\n| --- | --- |\n| \"Chưa chọn tệp CSV.\" | Bấm `Nạp CSV` khi chưa chọn tệp |\n| \"Tệp không phải văn bản UTF-8 hợp lệ.\" | Tệp không lưu mã UTF-8 |\n| \"Tệp không có dòng dữ liệu nào.\" | Tệp rỗng hoặc chỉ có dòng tiêu đề |\n| \"Tệp tối đa 5 MB và 10.000 dòng.\" | Tệp quá lớn |\n| \"Dòng &lt;n&gt;: thiếu cột (cần đúng 2 cột ma_don, gia_von).\" | Dòng không đủ hai cột |\n| \"Dòng &lt;n&gt;: thiếu mã đơn.\" | Ô mã đơn trống |\n| \"Dòng &lt;n&gt;: không tìm thấy đúng một đơn \"&lt;mã&gt;\".\" | Mã đơn sai hoặc trùng nhiều đơn |\n| \"Dòng &lt;n&gt;: giá vốn \"&lt;giá trị&gt;\" phải là số nguyên VNĐ không dấu phân cách.\" | Giá vốn có chữ, số âm, số thập phân hoặc dấu phân cách |\n| \"Dòng &lt;n&gt;: đơn \"&lt;mã&gt;\" chưa chốt, không nạp giá vốn.\" | Đơn chưa ở trạng thái đã xác nhận |\n| \"Dòng &lt;n&gt;: mã đơn \"&lt;mã&gt;\" lặp lại ở dòng &lt;m&gt;.\" | Một mã đơn xuất hiện hai lần trong tệp |\n| \"Dòng &lt;n&gt;: giá vốn vượt 12 chữ số.\" | Giá vốn quá dài |\n\n### ⚠️ Lưu ý\n\n* **Có một dòng lỗi là không áp dụng dòng nào.** Hệ thống không ghi một phần tệp\n* \"Dòng &lt;n&gt;\" là số dòng thật trong tệp, tính cả dòng tiêu đề và dòng trống; dòng đầu tệp là dòng 1\n* Dòng tiêu đề là tùy chọn: dòng đầu đúng chữ \"ma_don, gia_von\" thì được bỏ qua\n* Nạp lại một đơn đã có giá vốn thì giá vốn mới ghi đè, người và thời điểm nạp cập nhật, nhật ký ghi lần nạp mới\n* Sau khi nạp, Giá vốn, Lợi nhuận gộp, Biên, ROI lợi nhuận gộp tính lại ngay ở màn này, [Phễu và hiệu quả](../bang-dieu-khien/pheu-va-hieu-qua.md), [Tổng quan ngày](../bang-dieu-khien/tong-quan-ngay.md), [Chỉ tiêu theo kênh](../ke-hoach/chi-tieu-theo-kenh.md), [Hiệu quả chiến dịch](hieu-qua-chien-dich.md), kể cả kỳ đã qua. Số chốt của chiến dịch không đổi\n* Hai người nạp cùng một đơn: hệ thống xử lý lần lượt, người sau ghi đè, nhật ký ghi cả hai lần\n* Bấm `Hủy` thì đóng hộp, không ghi gì\n* Người không có quyền không thấy nút `Nạp giá vốn`; gọi trực tiếp bị chặn: \"Chỉ Trưởng/Phó phòng hoặc Ban giám đốc được nạp giá vốn.\"\n\n## <mark style=\"color:green;\">6. Nhập tay giá vốn<\/mark>\n\n<figure><img src=\"images/doanh-thu-ghi-nhan-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm <code>Nạp giá vốn<\/code><\/td><td>Hệ thống mở hộp, liệt kê đơn chốt của kỳ, bộ lọc đang xem; đơn chưa có giá vốn xếp trước, rồi theo Ngày chốt giảm dần<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập ô <strong>Giá vốn (đ)<\/strong> của từng đơn<\/td><td>Số nguyên ≥ 0, không dấu phân cách, tối đa 12 chữ số. Ô để trống thì giá vốn của đơn đó không đổi<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <code>Lưu giá vốn<\/code><\/td><td>Hệ thống kiểm mọi ô có giá trị. Hợp lệ thì lưu, hiện \"Đã lưu giá vốn cho &lt;n&gt; đơn.\", đóng hộp và tính lại màn. Nhật ký ghi tên tệp là \"Nhập tay\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nếu có ô sai<\/td><td>Hệ thống báo \"Giá vốn phải là số nguyên không âm.\" ngay dưới từng ô sai và <strong>không lưu ô nào<\/strong>. Các ô đã nhập giữ nguyên để bạn sửa rồi bấm <code>Lưu giá vốn<\/code> lại<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Nhập tay
