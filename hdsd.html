<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Hướng dẫn sử dụng Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: kiểu tài liệu GitBook, thanh trên cố định, mục lục trái, nội dung giữa ~760px, "Trên trang này" bên phải */
:root{
  --bg:#ffffff; --bg-soft:#f6f8fb; --bg-side:#f8f9fb; --line:#e3e7ee; --line-strong:#cfd6e1;
  --fg:#1d2430; --fg-soft:#4a5463; --fg-mute:#7a8494;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --accent-fg:#ffffff;
  --info-bg:#eef5ff; --info-line:#9cc0f3; --warn-bg:#fff6e6; --warn-line:#f0c46c; --ok-bg:#ecf8f1; --ok-line:#8fd1ac; --bad-bg:#fdeeee; --bad-line:#f0a3a3;
  --code-bg:#f1f3f7;
  --shadow:0 8px 28px rgba(20,35,60,.12);
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --top:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --bg-soft:#181d26; --bg-side:#151a22; --line:#262d39; --line-strong:#344052;
  --fg:#e6eaf1; --fg-soft:#b4bdcb; --fg-mute:#808b9c;
  --accent:#6ea3f2; --accent-soft:#1c2a40; --accent-fg:#0d1420;
  --info-bg:#172338; --info-line:#2f548c; --warn-bg:#2a2214; --warn-line:#7a5e22; --ok-bg:#14271d; --ok-line:#2e6b49; --bad-bg:#2c1717; --bad-line:#7a3434;
  --code-bg:#1d232e; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --bg-soft:#181d26; --bg-side:#151a22; --line:#262d39; --line-strong:#344052;
  --fg:#e6eaf1; --fg-soft:#b4bdcb; --fg-mute:#808b9c;
  --accent:#6ea3f2; --accent-soft:#1c2a40; --accent-fg:#0d1420;
  --info-bg:#172338; --info-line:#2f548c; --warn-bg:#2a2214; --warn-line:#7a5e22; --ok-bg:#14271d; --ok-line:#2e6b49; --bad-bg:#2c1717; --bad-line:#7a3434;
  --code-bg:#1d232e; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.65;margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;
  padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:600;white-space:nowrap;min-width:0}
.brand:hover{text-decoration:none}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--bg);color:var(--fg-soft);height:34px;min-width:34px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;font:inherit;padding:0 8px}
.iconbtn:hover{background:var(--bg-soft);color:var(--fg)}
#menuBtn{display:none}
.search{position:relative;width:min(380px,40vw)}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg-soft);color:var(--fg);
  font:inherit;font-size:14px;padding:0 64px 0 34px}
.search input::placeholder{color:var(--fg-mute)}
.search svg{position:absolute;left:10px;top:10px;color:var(--fg-mute)}
.search kbd{position:absolute;right:8px;top:7px;font:500 11px var(--mono);color:var(--fg-mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--bg)}
#results{position:absolute;top:42px;left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  max-height:min(70vh,520px);overflow:auto;padding:6px}
#results a{display:block;padding:8px 10px;border-radius:8px;color:var(--fg)}
#results a:hover,#results a.on{background:var(--accent-soft);text-decoration:none}
#results .rt{font-weight:600;font-size:14px}
#results .rg{font-size:12px;color:var(--fg-mute)}
#results .rs{font-size:13px;color:var(--fg-soft);margin-top:2px}
#results mark{background:transparent;color:var(--accent);font-weight:600}
#results .empty{padding:12px;color:var(--fg-mute);font-size:14px}

/* Khung 3 cột */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr) 230px;min-height:calc(100vh - var(--top))}
#side{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top));overflow:auto;
  background:var(--bg-side);border-right:1px solid var(--line);padding-block:18px 40px;padding-inline:12px}
/* Nhóm chức năng: tiêu đề in hoa đậm, tách hẳn khỏi các trang bên dưới */
.grp{margin-bottom:10px;padding-bottom:10px}
.grp + .grp{border-top:1px solid var(--line);padding-top:16px}
.grp h4{margin:0 0 6px;padding:0 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
#side a{display:block;color:var(--fg-soft);line-height:1.4}
#side a:hover{color:var(--fg);text-decoration:none}
/* Chọn phân hệ */
.mod{position:relative;margin:0 0 18px}
#modBtn{width:100%;height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--bg);color:var(--fg);font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-align:left}
#modBtn:hover{border-color:var(--accent)}
#modBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modBtn svg{flex:none;color:var(--fg-mute);transition:transform .15s}
#modBtn[aria-expanded="true"] svg{transform:rotate(180deg)}
#modList{position:absolute;left:0;right:0;top:44px;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px}
#modList button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:0;border-radius:7px;background:none;color:var(--fg);font:inherit;font-size:14px;text-align:left;cursor:pointer}
#modList button:hover{background:var(--bg-soft)}
#modList button[aria-selected="true"]{color:var(--accent);font-weight:600}
/* Trang */
#side a.pg{padding:6px 10px 6px 12px;font-size:14px;border-left:2px solid transparent;border-radius:0 7px 7px 0}
#side a.pg:hover{background:var(--bg-soft)}
#side a.pg.on{background:var(--accent-soft);color:var(--accent);font-weight:600;border-left-color:var(--accent)}
main{min-width:0;padding-block:28px 64px;padding-inline:clamp(16px,4vw,56px)}
.doc{max-width:780px;margin:0 auto}
#toc{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top));overflow:auto;padding-block:30px;padding-inline:8px 16px}
#toc h5{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-mute)}
#toc a{display:block;font-size:13px;line-height:1.4;color:var(--fg-mute);padding:5px 0 5px 12px;border-left:2px solid var(--line)}
#toc a:hover{color:var(--fg);text-decoration:none}
#toc a.on{color:var(--accent);border-left-color:var(--accent)}

/* Nội dung */
.crumbs{font-size:13px;color:var(--fg-mute);margin-bottom:6px}
.doc h1{font-size:32px;line-height:1.25;margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
.doc h2{font-size:22px;line-height:1.35;margin:44px 0 12px;padding-top:8px;border-top:1px solid var(--line);text-wrap:balance;scroll-margin-top:calc(var(--top) + 16px)}
.doc h3{font-size:17px;margin:26px 0 10px;scroll-margin-top:calc(var(--top) + 16px)}
.doc h1+p{font-size:16px;color:var(--fg-soft)}
.doc p{margin:10px 0}
.doc ul,.doc ol{padding-left:22px;margin:8px 0}
.doc li{margin:4px 0}
.doc mark{background:transparent;color:var(--accent)!important}
.doc code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--line);padding:1px 6px;border-radius:5px;white-space:nowrap}
.doc strong{font-weight:600}
.doc figure{margin:16px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg-soft)}
.doc figure img{display:block;width:100%;height:auto;cursor:zoom-in}
.doc figcaption:empty{display:none}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px}
.doc table{border-collapse:collapse;width:100%;font-size:14px}
.doc th,.doc td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
.doc th{background:var(--bg-soft);font-weight:600;color:var(--fg);white-space:nowrap}
.doc tr:last-child td{border-bottom:0}
.doc td:first-child{white-space:nowrap}
.hint{border:1px solid var(--info-line);background:var(--info-bg);border-radius:10px;padding:6px 18px 10px;margin:18px 0}
.hint.hint-warning{border-color:var(--warn-line);background:var(--warn-bg)}
.hint.hint-success{border-color:var(--ok-line);background:var(--ok-bg)}
.hint.hint-danger{border-color:var(--bad-line);background:var(--bad-bg)}
.hint h2{border:0;margin:10px 0 6px;padding:0;font-size:14px;letter-spacing:.05em;color:var(--fg)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px}
.pager a{border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--fg);display:block;min-width:0}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager small{display:block;color:var(--fg-mute);font-size:12px}
.pager span{font-weight:600}
.pager .next{text-align:right;grid-column:2}

/* Xem ảnh lớn */
#lightbox{position:fixed;inset:0;z-index:60;background:rgba(8,12,18,.82);display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow)}

/* Màn hẹp */
@media (max-width:1200px){.shell{grid-template-columns:270px minmax(0,1fr)} #toc{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-grid}
  #side{position:fixed;left:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;width:min(300px,86vw);height:auto;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  body.nav-open #side{transform:none}
  .search{width:auto;flex:1}
  .search kbd{display:none}
  .search input{padding-right:10px}
  .doc h1{font-size:26px}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:1}
}
@media (max-width:520px){.brand b{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

"items": [{"title": "Đề xuất chi", "path": "quan-ly-chi-phi-ngan-sach/de-xuat-chi.md"}, {"title": "Thanh toán", "path": "quan-ly-chi-phi-ngan-sach/thanh-toan.md"}, {"title": "Đối soát", "path": "quan-ly-chi-phi-ngan-sach/doi-soat.md"}, {"title": "Cảnh báo vượt mức", "path": "quan-ly-chi-phi-ngan-sach/canh-bao-vuot-muc.md"}]}, {"title": "Báo cáo dữ liệu", "items": [{"title": "Chi phí và Lead", "path": "bao-cao-du-lieu/chi-phi-va-lead.md"}, {"title": "Doanh thu ghi nhận", "path": "bao-cao-du-lieu/doanh-thu-ghi-nhan.md"}, {"title": "Hiệu quả chiến dịch", "path": "bao-cao-du-lieu/hieu-qua-chien-dich.md"}, {"title": "Báo cáo ngày, tuần, tháng", "path": "bao-cao-du-lieu/bao-cao-ngay-tuan-thang.md"}]}], "pages": {"README.md": "# Giới thiệu\n\n🧭 Tổng quan: Phân hệ **Marketing** trên hệ thống Datyso giúp phòng Marketing lập kế hoạch, chạy chiến dịch, sản xuất nội dung, kiểm soát chi phí và theo dõi hiệu quả trên cùng một nơi. Số liệu lấy từ lead, cơ hội và đơn hàng của CRM, cùng chi phí từ nền tảng quảng cáo\n\n<figure><img src=\"images/giao-dien-chung.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n{% hint style=\"info\" %}\n\n## THỨ TỰ LÀM VIỆC TRONG PHÂN HỆ MARKETING\n\nBước 1: Lập **Kế hoạch Marketing** theo năm, quý, tháng, rồi gửi duyệt\n\nBước 2: **Phân bổ ngân sách** và đặt **chỉ tiêu** theo sản phẩm, theo kênh từ kế hoạch đã duyệt\n\nBước 3: Lập **Chiến dịch**, duyệt 2 cấp, rồi đưa vào chạy\n\nBước 4: Sản xuất **Nội dung** cho chiến dịch: yêu cầu, sản xuất, duyệt, lên lịch đăng\n\nBước 5: Chi tiền qua **Đề xuất chi**, ghi nhận **Thanh toán**, đối soát cuối tháng\n\nBước 6: Theo dõi kết quả ở **Bảng điều khiển** và **Báo cáo dữ liệu**; đánh giá chiến dịch khi kết thúc\n\n{% endhint %}\n\n## <mark style=\"color:green;\">Giao diện chung<\/mark>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh menu trên cùng** | 6 nhóm chức năng: **Bảng điều khiển**, **Kế hoạch**, **Chiến dịch**, **Nội dung & media**, **Chi phí & ngân sách**, **Báo cáo dữ liệu**. Rê chuột vào một nhóm để mở các mục con. Số cạnh Bảng điều khiển là số việc đang chờ bạn xử lý |\n| **Đường dẫn (breadcrumb)** | Cho biết bạn đang ở màn nào, ví dụ **Marketing → Bảng điều khiển** |\n| **Tiêu đề và thanh công cụ** | Tên màn, dòng mô tả ngắn, các nút thao tác chính như `+ Tạo …`, `Xuất Excel`, `Làm mới`, chọn kỳ |\n| **Vùng nội dung** | Danh sách và chi tiết. Ở các màn danh sách, chọn một dòng bên trái thì chi tiết hiện bên phải |\n\n### 🧭 Quy ước trong tài liệu\n\n| Ký hiệu | Ý nghĩa |\n| --- | --- |\n| **Chữ đậm** | Tên menu, khu vực, ô nhập trên màn hình |\n| `Nút` | Tên nút cần bấm |\n| **A → B** | Đường menu: chọn A rồi chọn B |\n| ⚠️ **Lưu ý** | Quy tắc nghiệp vụ cần biết khi thao tác |\n\n### ⚠️ Lưu ý\n\n* Mỗi người chỉ thấy dữ liệu và nút theo vai trò của mình. Xem [Vai trò và phân quyền](bat-dau/vai-tro-va-phan-quyen.md)\n* Nút bạn không có quyền dùng sẽ không hiển thị. Nút bị khóa tạm thời (ví dụ chưa đủ điều kiện, hoặc bạn là người lập nên không tự duyệt được) vẫn hiển thị nhưng mờ; rê chuột vào nút để xem lý do\n", "bat-dau/vai-tro-va-phan-quyen.md": "# Vai trò và phân quyền\n\n🧭 Tổng quan: Quyền trong phân hệ Marketing gán theo nhóm người dùng. Nhóm cao có mọi quyền của nhóm thấp, trừ một số ngoại lệ ghi ở cuối trang\n\n## <mark style=\"color:green;\">1. Các vai trò<\/mark>\n\n| Vai trò | Thấy dữ liệu nào | Việc chính |\n| --- | --- | --- |\n| **Chuyên viên Marketing** | Dữ liệu mình phụ trách hoặc do mình tạo | Lập kế hoạch, đề xuất chiến dịch, yêu cầu nội dung, sản xuất nội dung, lập đề xuất chi |\n| **Trưởng nhóm Marketing** | Dữ liệu của đội mình (là trưởng hoặc thành viên đội) | Thêm việc của Chuyên viên; phân công, duyệt nội dung, duyệt cấp 1 chiến dịch, duyệt bậc Trưởng nhóm của đề xuất chi, duyệt kế hoạch nội dung của đội |\n| **Trưởng/Phó phòng Marketing** | Toàn bộ | Duyệt kế hoạch Marketing, kỳ phân bổ, ngân sách chiến dịch; chốt đối soát; trình báo cáo tháng; ký thay ở mọi đội |\n| **Ban giám đốc (BGĐ)** | Toàn bộ | Như Trưởng/Phó phòng; duyệt đề nghị tăng ngân sách, bậc BGĐ của đề xuất chi; xem và phản hồi báo cáo tháng |\n| **Trưởng phòng Sale** | Chỉ màn **Doanh thu ghi nhận** | Xem doanh thu, đơn hàng, nguồn và điểm chạm của đơn |\n\n## <mark style=\"color:green;\">2. Ai được ký duyệt<\/mark>\n\n| Quy tắc | Giải thích |\n| --- | --- |\n| **Không tự duyệt** | Người lập phiếu và người bấm gửi duyệt không được duyệt chính phiếu đó, ở mọi cấp. Với nội dung, người nộp phiên bản không được duyệt phiên bản đó. Nút duyệt hiện mờ kèm câu \"Bạn không thể duyệt … do chính mình lập hoặc gửi duyệt.\" |\n| **Trưởng nhóm của đội** | Khi một bước cần \"Trưởng nhóm của đội\" ký, mọi Trưởng nhóm là trưởng hoặc thành viên của đội đó đều ký được. Trưởng nhóm đội khác không ký được, kể cả khi xem được phiếu |\n| **Ký thay** | Trưởng/Phó phòng và BGĐ ký thay được ở mọi đội |\n| **Việc chờ ký** | Hệ thống giao việc cho người ký được của bước đang chờ. Không còn ai thì giao Trưởng/Phó phòng, sau cùng là BGĐ |\n\n### ⚠️ Lưu ý\n\n* BGĐ không gửi đề nghị tăng ngân sách và không trình báo cáo tháng; BGĐ là người duyệt hoặc phản hồi các việc này\n* Nếu không còn ai khác đủ quyền duyệt (ví dụ bạn là người duy nhất của nhóm duyệt và cũng là người lập), phiếu giữ trạng thái chờ duyệt và bạn thấy câu \"Chưa có người khác có quyền duyệt … này.\"\n* Kho ảnh video và Mẫu và nhận diện dùng chung toàn phòng: mọi người trong phòng xem và tải được; quyền sửa, xóa vẫn theo vai trò\n", "bang-dieu-khien/bo-loc-va-ky-bao-cao.md": "# Bộ lọc và kỳ báo cáo\n\n🧭 Tổng quan chức năng: Trang này hướng dẫn các thao tác dùng chung của Bảng điều khiển: chọn kỳ báo cáo, chọn khoảng ngày tùy chọn, đặt bộ lọc dùng chung 10 chiều, bấm số để mở danh sách dữ liệu gốc, làm mới và xuất Excel. Mọi người dùng thuộc nhóm Marketing đều dùng được\n\nTruy cập: có ở đầu các màn **Bảng điều khiển → Điều hành → Tổng quan**, **Bảng điều khiển → Điều hành → Phễu và hiệu quả**, **Bảng điều khiển → Điều hành → Hiệu suất đội nhóm**. Màn **Cảnh báo cần xử lý** không có kỳ và bộ lọc\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH XEM SỐ LIỆU THEO KỲ VÀ BỘ LỌC\n\nBước 1: Chọn kỳ báo cáo ở góc trên bên phải: `Hôm nay` (mặc định), `Hôm qua`, `7 ngày`, `Tháng này` hoặc `Tùy chọn…`\n\nBước 2 (không bắt buộc): Mở khối **Bộ lọc dùng chung**, chọn giá trị cho các chiều cần lọc, nhấn `Áp dụng`\n\nBước 3: Đọc số liệu. Số có gạch chân bấm được để mở danh sách dữ liệu gốc đúng kỳ và đúng bộ lọc\n\nBước 4: Nhấn `Quay lại` để về màn trước. Kỳ và bộ lọc vẫn giữ nguyên\n\nKỳ và bộ lọc áp chung cho ba màn Tổng quan, Phễu và hiệu quả, Hiệu suất đội nhóm. Đổi màn trong Bảng điều khiển thì kỳ và bộ lọc đi theo. Tải lại trang (F5) thì kỳ về `Hôm nay` và bộ lọc bị xóa\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Chọn kỳ báo cáo<\/mark>\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đường dẫn và tiêu đề** | \"Marketing > Bảng điều khiển\" và tên màn đang xem |\n| **Dòng \"Cập nhật lúc HH:MM\"** | Giờ lấy số liệu lần gần nhất (giờ Việt Nam), kỳ đang xem và nhãn so sánh, ví dụ \"kỳ Hôm nay, so với cả ngày hôm qua\". Kỳ có ngày cuối là hôm nay có thêm nhãn \"chưa trọn ngày\" |\n| **Nhóm nút kỳ** | `Hôm nay`, `Hôm qua`, `7 ngày`, `Tháng này`, `Tùy chọn…`. Nút đang chọn được tô nổi |\n| **Nút Làm mới** (biểu tượng hai mũi tên) | Tính lại số liệu ngay. Xem mục 5 |\n| **Nút `Xuất Excel`** | Tải tệp `.xlsx` của màn đang xem. Xem mục 5 |\n\n**Các kỳ và kỳ so sánh** (ví dụ hôm nay là 11/10/2026):\n\n| Kỳ | Gồm các ngày | So với kỳ trước | Nhãn so sánh |\n| --- | --- | --- | --- |\n| **Hôm nay** (mặc định) | 11/10 | Cả ngày 10/10 | \"so với cả ngày hôm qua\" |\n| **Hôm qua** | 10/10 | 09/10 | \"so với hôm kia\" |\n| **7 ngày** | Hôm nay và 6 ngày liền trước: 05/10 đến 11/10 | 28/09 đến 04/10 | \"so với 7 ngày liền trước\" |\n| **Tháng này** | Từ mùng 1 đến hôm nay: 01/10 đến 11/10 | 11 ngày liền trước: 20/09 đến 30/09 | \"so với 11 ngày liền trước\" |\n| **Tùy chọn** | Trọn các ngày đã chọn, gồm cả hai đầu | Khoảng liền trước, cùng số ngày | \"so với khoảng liền trước\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở một màn của Bảng điều khiển<\/td><td>Màn mở với kỳ <strong>Hôm nay<\/strong>. Nếu trước đó bạn đã chọn kỳ khác ở một màn của Bảng điều khiển, màn mở với kỳ đó<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn một nút kỳ: <code>Hôm nay<\/code>, <code>Hôm qua<\/code>, <code>7 ngày<\/code> hoặc <code>Tháng này<\/code><\/td><td>Hệ thống tính lại toàn bộ số liệu của màn theo kỳ mới và kỳ trước tương ứng. Dòng \"Cập nhật lúc\" đổi nhãn so sánh theo bảng trên<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Tùy chọn…<\/code><\/td><td>Hệ thống mở hộp <strong>Chọn khoảng ngày<\/strong>. Xem mục 2<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đọc chênh lệch so với kỳ trước<\/td><td>Mỗi ô có dòng chênh lệch dạng \"+x%\" hoặc \"−x%\". Thông thường tăng là tốt, giảm là xấu. Với Chi phí quảng cáo, CPL, Đã mất thì giảm là tốt, tăng là xấu. Không đổi hiển thị \"+0,0%\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Chuyển sang màn khác trong Bảng điều khiển<\/td><td>Kỳ đang chọn được giữ nguyên<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Kỳ tính theo ngày Việt Nam\n* **Kỳ Hôm nay** chưa trọn ngày nhưng vẫn so với **cả ngày hôm qua**, không cắt theo giờ. Vì chi phí quảng cáo chỉ có theo ngày, chênh lệch của nhóm số liệu chi phí (Chi phí quảng cáo, Lượt nhấp, CPL, ROAS, ROI, CPA) hiển thị \"-\" cho tới hết ngày. Giá trị chi phí hôm nay vẫn hiển thị theo số đã đồng bộ. Các ô khác (lead, cơ hội, đơn, doanh thu, tỷ lệ) vẫn có chênh lệch\n* Kỳ Tháng này vào ngày mùng 1 áp quy tắc như kỳ Hôm nay\n* Các kỳ khác (Hôm qua, 7 ngày, Tháng này, Tùy chọn) hiển thị chênh lệch chi phí bình thường\n* Chênh lệch hiển thị \"-\" khi kỳ trước bằng 0 hoặc chưa có dữ liệu kỳ trước (\"chưa có kỳ trước\")\n* Số \"0\" hoặc \"0 đ\" nghĩa là biết rõ bằng 0. Dấu \"-\" nghĩa là không tính được, ví dụ chia cho 0 hoặc thiếu dữ liệu\n* Tỷ lệ chuyển đổi đếm lead theo ngày tạo lead, cơ hội theo ngày tạo cơ hội, đơn theo ngày đặt đơn. Vì vậy với kỳ ngắn, tỷ lệ có thể vượt 100%\n* Số chi phí là số **đã đồng bộ** về hệ thống, có thể chậm hơn nền tảng quảng cáo. Giờ đồng bộ chi phí gần nhất hiển thị cạnh ô Chi phí\n* Thanh tiến độ chỉ tiêu tính thời gian đã qua theo giờ làm việc 8:00–18:00. Trước 8:00 là 0%, sau 18:00 là 100%. Chủ nhật và ngày nghỉ tính như ngày thường\n* Màn **Cảnh báo cần xử lý** không có chọn kỳ: cảnh báo luôn tính tại thời điểm hiện tại\n\n## <mark style=\"color:green;\">2. Chọn khoảng ngày tùy chọn<\/mark>\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Hộp \"Chọn khoảng ngày\"** | Mở ngay dưới nút `Tùy chọn…`, gồm hai ô ngày và hai nút |\n| **Từ ngày, Đến ngày** | Ô nhập ngày định dạng `dd/mm/yyyy`. Gõ trực tiếp hoặc chọn trên lịch |\n| **Nút `Hủy`** | Đóng hộp, giữ kỳ cũ |\n| **Nút `Áp dụng`** | Kiểm tra khoảng ngày rồi tải lại số liệu |\n| **Chip \"Khoảng ngày: dd/mm/yyyy → dd/mm/yyyy ✕\"** | Hiện dưới tiêu đề màn khi kỳ Tùy chọn đang áp |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Tùy chọn…<\/code><\/td><td>Hệ thống mở hộp <strong>Chọn khoảng ngày<\/strong>. Nếu đang có khoảng ngày được áp, hộp hiện sẵn khoảng đó<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Từ ngày<\/strong><\/td><td>Bắt buộc. Nhập ngày bắt đầu theo định dạng <code>dd/mm/yyyy<\/code><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Đến ngày<\/strong><\/td><td>Bắt buộc. Nhập ngày kết thúc. Khoảng ngày tối đa 366 ngày, tính cả hai đầu<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Áp dụng<\/code><\/td><td>Hợp lệ: hộp đóng, số liệu tải lại, hiện chip \"Khoảng ngày: … ✕\" và thông báo <strong>\"Đã áp dụng khoảng ngày\"<\/strong>. Nhãn so sánh đổi thành \"so với khoảng liền trước\"<br>Không hợp lệ: hệ thống báo lỗi ngay tại ô, hộp vẫn mở, số liệu không tải lại (xem bảng lỗi bên dưới)<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Hộp đóng, giữ nguyên kỳ và bộ lọc đang có<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <strong>✕<\/strong> trên chip khoảng ngày<\/td><td>Kỳ về mặc định Hôm nay, hiện thông báo <strong>\"Đã về kỳ mặc định Hôm nay\"<\/strong><\/td><\/tr>\n<\/tbody><\/table>\n\n**Ví dụ báo lỗi khi từ ngày lớn hơn đến ngày:**\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n**Các câu báo lỗi:**\n\n| Trường hợp | Câu báo lỗi |\n| --- | --- |\n| Bỏ trống một hoặc cả hai ngày | \"Chọn từ ngày và đến ngày\" |\n| Từ ngày sau đến ngày | \"Ngày bắt đầu phải trước hoặc bằng ngày kết thúc\" |\n| Khoảng dài hơn 366 ngày | \"Khoảng ngày tối đa 366 ngày\" |\n| Ngày sai định dạng | \"Ngày không đúng định dạng dd/mm/yyyy\" |\n\n**Sau khi áp dụng thành công:**\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Khoảng từ 01/01 đến 31/12 của năm nhuận là 366 ngày, vẫn hợp lệ\n* Hệ thống không chặn khoảng ngày trong tương lai hoặc trước thời điểm có dữ liệu. Khi đó số liệu bằng 0, tiến độ 0%, chênh lệch \"-\"\n* Chọn kỳ khác (ví dụ `7 ngày`) thì chip khoảng ngày biến mất\n* Kỳ Tùy chọn và chip giữ khi đổi màn trong Bảng điều khiển. Tải lại trang thì kỳ về Hôm nay\n* Muốn xem theo tuần, quý hoặc năm: dùng `Tùy chọn…` và nhập khoảng ngày tương ứng\n\n## <mark style=\"color:green;\">3. Bộ lọc dùng chung<\/mark>\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nKhối **\"Bộ lọc dùng chung · N điều kiện\"** nằm ngay dưới tiêu đề màn. Khối thu gọn khi chưa lọc, mở sẵn khi đang có điều kiện lọc. N là số chiều đang lọc, không tính chiều Thời gian\n\n| Chiều (mặc định \"Tất cả\") | Giá trị | Ghi chú |\n| --- | --- | --- |\n| **Thời gian** | Kỳ chọn ở nhóm nút kỳ (mục 1, mục 2) | Không nằm trong khối, không tính vào N |\n| **Trang web** | Danh mục website | Hiển thị nhưng khóa, chú giải \"Chưa có dữ liệu để lọc\" |\n| **Nền tảng** | Meta, Google, TikTok | Suy từ kênh Marketing theo bảng ánh xạ kênh sang nền tảng |\n| **Nguồn** | Quảng cáo, Tự nhiên, Giới thiệu | |\n| **Kênh nhập khách tiềm năng** | Form website, Inbox, Hotline | Hiển thị nhưng khóa, chú giải \"Chưa có dữ liệu để lọc\" |\n| **Chiến dịch** | Danh sách chiến dịch (tên, mã) | |\n| **Sản phẩm** | Nhãn sản phẩm | |\n| **Khu vực** | Danh mục khu vực | Hiển thị nhưng khóa, chú giải \"Chưa có dữ liệu để lọc\" |\n| **Nhóm** | Đội Marketing | |\n| **Nhân viên** | Nhân viên Marketing phụ trách | Là nhân viên Marketing, không phải nhân viên Sale |\n| **Nút `Áp dụng`** | | Áp các giá trị đã chọn và tính lại số liệu |\n| **Nút `Xóa bộ lọc`** | | Đưa mọi chiều về \"Tất cả\". Bị khóa khi chưa có điều kiện nào |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn vào dòng <strong>Bộ lọc dùng chung · N điều kiện<\/strong><\/td><td>Khối mở ra, hiện các chiều lọc<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn giá trị cho một hoặc nhiều chiều<\/td><td>Mỗi chiều chọn <strong>một<\/strong> giá trị. Danh sách giá trị chỉ gồm giá trị thuộc phạm vi dữ liệu của bạn. Lúc này số liệu <strong>chưa<\/strong> thay đổi<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Áp dụng<\/code><\/td><td>Hệ thống tính lại số liệu kỳ này và kỳ trước theo cùng điều kiện lọc. Tiêu đề khối hiện số điều kiện, ví dụ \"Bộ lọc dùng chung · 2 điều kiện\". Banner cảnh báo và màn Cảnh báo không đổi<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đọc số liệu sau khi lọc<\/td><td>Các chiều kết hợp theo kiểu <strong>và<\/strong>: bản ghi phải thỏa mọi điều kiện. Xem phần Lưu ý về chi phí, chỉ tiêu và so sánh<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xóa bộ lọc<\/code><\/td><td>Mọi chiều về \"Tất cả\", số liệu tính lại như khi chưa lọc<\/td><\/tr>\n<\/tbody><\/table>\n\n**Ví dụ sau khi áp dụng 2 điều kiện (Chiến dịch và Nhóm):**\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* **Phải nhấn `Áp dụng`** thì lựa chọn mới có hiệu lực. Đổi ô chọn mà chưa nhấn thì số liệu giữ nguyên\n* Bộ lọc giữ khi đổi màn trong Bảng điều khiển và khi mở danh sách dữ liệu gốc. Tải lại trang thì bộ lọc bị xóa\n* Trưởng nhóm chỉ thấy đội mình trong chiều **Nhóm**, nên không chọn được đội khác. Dữ liệu sau khi lọc vẫn theo phạm vi quyền của bạn\n* Bộ lọc **không** áp cho màn Cảnh báo cần xử lý và banner cảnh báo ở Tổng quan\n* Ô **Lưu lượng truy cập** chỉ nhận chiều Trang web; các chiều khác không áp cho ô này\n* **Cơ hội và đơn** được lọc theo thông tin lưu trên chính cơ hội và đơn (chiến dịch, kênh, đội, nhân viên Marketing), không đi qua lead\n* **Chi phí khi lọc:** chi phí lọc được theo Chiến dịch, Nền tảng, Nhóm, Sản phẩm. Khi lọc theo chiều chưa lọc được chi phí (Nhân viên, Trang web, Kênh nhập, Khu vực):\n  * ô Chi phí quảng cáo và Lượt nhấp hiển thị số **chưa lọc** theo chiều đó, kèm chú thích \"Chi phí chưa lọc theo chiều này\";\n  * CPL, ROAS, ROI, CPA (và bước Chi phí, CPL của phễu; cột Chi phí, CPL, ROAS của Hiệu suất đội nhóm) hiển thị \"-\" kèm cùng chú thích\n* Lọc theo Nền tảng: Meta lấy số liệu quảng cáo của Meta; Google, TikTok lấy theo khoản thanh toán quảng cáo trả phí của kênh thuộc nền tảng đó. Lượt nhấp chỉ có số của Meta. Nền tảng chưa có dữ liệu thì các số bằng 0 kèm chú thích \"Chưa có dữ liệu cho nền tảng này\"\n* **So sánh khi lọc:** kỳ trước được tính lại với cùng điều kiện lọc. Nếu không có dữ liệu kỳ trước để so, ô chênh lệch hiển thị \"-\" kèm chú thích \"Không so sánh được với bộ lọc này\"\n* **Chỉ tiêu khi lọc:** lọc theo Nhóm hoặc Sản phẩm thì chỉ tiêu lấy theo đúng đội hoặc sản phẩm đó (nếu có). Lọc theo chiều không có chỉ tiêu (Chiến dịch, Trang web, Nền tảng, Nguồn, Kênh nhập, Khu vực, Nhân viên) hoặc kết hợp từ hai chiều có chỉ tiêu trở lên thì thanh tiến độ và % chỉ tiêu bị ẩn; số thực tế và so sánh kỳ trước vẫn hiển thị\n* Các màn của nhóm **Báo cáo dữ liệu** (ví dụ [Chi phí và Lead](../bao-cao-du-lieu/chi-phi-va-lead.md)) dùng cùng khối bộ lọc và hộp chọn khoảng ngày, nhưng giữ kỳ và bộ lọc riêng, mặc định kỳ Tháng này. Kỳ và bộ lọc không mang qua lại giữa Bảng điều khiển và Báo cáo dữ liệu\n\n## <mark style=\"color:green;\">4. Mở danh sách dữ liệu gốc<\/mark>\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-7.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đường dẫn và nút `Quay lại`** | \"Marketing > Bảng điều khiển > &lt;tên màn nguồn&gt;\", tiêu đề là tên số liệu đã bấm (ví dụ \"Lead mới\"), mũi tên `Quay lại` bên trái tiêu đề |\n| **Dòng \"Đang lọc: …\"** | Hiện khi có bộ lọc, liệt kê kỳ và các chiều đang lọc, ví dụ \"Đang lọc: Kỳ 01/10/2026 - 11/10/2026; Chiến dịch = Hè 2026; Nhóm = Đội 1\". Mở từ một đội hoặc một nhân viên thì có thêm \"Đội = …\" hoặc \"Nhân viên = …\" |\n| **Ô \"Lọc nhanh trong danh sách\"** | Gõ chữ để lọc các dòng, tối đa 100 ký tự |\n| **Bảng** | Cột theo loại danh sách (bảng dưới). Bấm tiêu đề cột để sắp xếp. Bấm mã bản ghi để mở bản ghi |\n| **Tổng số bản ghi, phân trang** | Tổng số bản ghi bằng đúng con số đã bấm. 20 dòng mỗi trang |\n\n**Các loại danh sách:**\n\n| Loại | Mở từ | Cột chính | Thứ tự mặc định |\n| --- | --- | --- | --- |\n| **Lead** | Ô Lead, nút `Danh sách lead`, số Lead của một đội hoặc nhân viên, bước Lead của phễu | Khách hàng, Nguồn, Chiến dịch, Đội nhóm MKT, Giờ vào, Trạng thái | Giờ vào mới nhất trước |\n| **Đủ điều kiện** | Ô Khách tiềm năng đủ điều kiện, bước tương ứng của phễu | Như Lead, Trạng thái \"Đủ điều kiện\" | Giờ vào mới nhất trước |\n| **Cơ hội** | Ô Cơ hội mới, số Cơ hội của một đội hoặc nhân viên, bước Cơ hội của phễu | Mã cơ hội, Khách hàng, Giai đoạn, Đội nhóm MKT, Giá trị dự kiến | Ngày tạo mới nhất trước |\n| **Đã mất** | Ô Đã mất | Như Cơ hội, thêm Lý do thất bại | Ngày đóng mới nhất trước |\n| **Đơn chốt** | Nút `Danh sách đơn`, ô Đơn chốt, bước Đơn chốt và Doanh thu của phễu, số Đơn chốt của một đội hoặc nhân viên | Số đơn, Khách hàng, Ngày chốt (ngày đặt đơn), Đội nhóm MKT, Thành tiền | Ngày đặt đơn mới nhất trước |\n| **Quảng cáo** | Ô Chi phí quảng cáo, bước Chi phí quảng cáo của phễu | Ngày, Chiến dịch, Nền tảng, Chi phí, Hiển thị, Nhấp chuột, CPC | Ngày mới nhất trước, cùng ngày thì chi phí lớn trước |\n| **Cảnh báo** | Một dòng ở màn Cảnh báo cần xử lý | Xem [Cảnh báo cần xử lý](canh-bao-can-xu-ly.md) | |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm một số có gạch chân, tên một đội hoặc nút <code>Danh sách …<\/code><\/td><td>Hệ thống xác định loại danh sách và kiểm tra quyền, rồi mở danh sách với đúng kỳ, đúng bộ lọc đang áp, đúng phạm vi dữ liệu của bạn và đúng đội (nếu bấm từ một đội)<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem dòng <strong>Đang lọc<\/strong> và tổng số bản ghi<\/td><td>Tổng số bản ghi bằng con số bạn đã bấm. Với danh sách Quảng cáo, tổng cột Chi phí bằng số tiền đã bấm<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Gõ vào ô <strong>Lọc nhanh trong danh sách<\/strong><\/td><td>Hệ thống tìm trên các cột chữ, không phân biệt hoa thường và dấu tiếng Việt, trên toàn bộ kết quả (mọi trang). Hiển thị \"N khớp trên tổng M\", trong đó M vẫn bằng con số đã bấm<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm tiêu đề cột<\/td><td>Sắp xếp theo cột đó. Bấm lại để đảo chiều<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Chuyển trang<\/td><td>Mỗi trang 20 dòng<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Bấm mã bản ghi<\/td><td>Mở bản ghi ở phân hệ sở hữu dữ liệu (Lead/Khách hàng, Cơ hội, Bán hàng, Chi phí)<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Quay lại<\/code><\/td><td>Về màn nguồn, giữ kỳ và bộ lọc. Màn nguồn hiện từ đầu trang; trang và vị trí cuộn của danh sách không được giữ<\/td><\/tr>\n<\/tbody><\/table>\n\n**Khi Chuyên viên bấm vào số Đơn chốt hoặc Doanh thu:**\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-8.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n**Thông báo thường gặp:**\n\n| Trường hợp | Hệ thống hiển thị |\n| --- | --- |\n| Kỳ không có bản ghi | \"Không có bản ghi trong kỳ này. Thử chọn kỳ dài hơn.\" |\n| Chuyên viên mở danh sách đơn | \"Bạn chưa được cấp quyền xem danh sách đơn hàng. Số tổng vẫn hiển thị trên bảng điều khiển. Liên hệ trưởng phòng nếu cần xem chi tiết đơn.\" kèm nút `Quay lại` |\n| Bấm từ dòng \"(Chưa gắn đội)\" ở Hiệu suất đội nhóm | Danh sách ghi \"(Chưa gắn đội)\", không gán tên đội thật |\n\n### ⚠️ Lưu ý\n\n* Danh sách dữ liệu gốc chỉ để xem. Muốn sửa bản ghi, mở bản ghi ở phân hệ sở hữu\n* **Chuyên viên** xem được số tổng Đơn chốt, Doanh thu, ROAS nhưng không mở được danh sách đơn hàng ở bất kỳ màn nào. Ô có biểu tượng khóa, chú giải \"Không mở được danh sách đơn hàng\"\n* Danh sách Quảng cáo gồm cả chi phí quảng cáo Meta và các khoản thanh toán quảng cáo trả phí của kênh Google, TikTok. Dòng của Google, TikTok ghi \"-\" ở cột Hiển thị và Nhấp chuột\n* Tải lại trang khi đang xem danh sách: danh sách mở lại cùng loại với kỳ Hôm nay và không có bộ lọc, nên tổng có thể khác con số đã bấm trước đó\n* Danh sách dữ liệu gốc không xuất Excel\n\n## <mark style=\"color:green;\">5. Làm mới và xuất Excel<\/mark>\n\n<figure><img src=\"images/bo-loc-va-ky-bao-cao-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn nút <strong>Làm mới<\/strong> (biểu tượng hai mũi tên)<\/td><td>Hệ thống tính lại số liệu ngay và cập nhật \"Cập nhật lúc HH:MM\" theo giờ Việt Nam. Huy hiệu số việc trên menu và banner cảnh báo cũng được cập nhật<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tạo tệp <code>.xlsx<\/code> gồm đúng các số và bảng đang hiển thị, đã theo kỳ và bộ lọc<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Mở tệp vừa tải<\/td><td>Tên tệp có dạng \"&lt;Tên màn không dấu&gt;_&lt;từ ngày&gt;_&lt;đến ngày&gt;.xlsx\", ngày dạng yyyymmdd, ví dụ <code>TongQuanNgay_20261001_20261011.xlsx<\/code>. Đầu tệp có tên màn, kỳ, dòng \"Đang lọc: …\" và \"Cập nhật lúc\", sau đó là toàn bộ thẻ và bảng. Số ghi đầy đủ, không rút gọn \"tr\", \"nghìn\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo thường gặp:**\n\n| Trường hợp | Hệ thống hiển thị |\n| --- | --- |\n| Không lấy được số liệu (hoặc quá 30 giây) | \"Không tải được số liệu\" kèm nút `Thử lại`. Kỳ và bộ lọc giữ nguyên |\n| Xuất tệp lỗi | \"Không xuất được tệp, vui lòng thử lại\". Không tạo tệp |\n\n### ⚠️ Lưu ý\n\n* Bảng điều khiển **không tự làm mới**. Số liệu được tính lúc mở màn, đổi kỳ, áp bộ lọc hoặc nhấn Làm mới\n* Xuất Excel có ở Tổng quan, Phễu và hiệu quả, Hiệu suất đội nhóm. Màn Cảnh báo cần xử lý và danh sách dữ liệu gốc không xuất Excel\n* Tệp của **Chuyên viên** không có bước Lợi nhuận gộp, dòng ROI lợi nhuận gộp và danh sách đơn hàng; số tổng Đơn chốt, Doanh thu vẫn có\n* Hết phiên đăng nhập: hệ thống chuyển về trang đăng nhập. Thao tác đang làm dở không được lưu. Đăng nhập lại thì vào Tổng quan với kỳ Hôm nay, không còn bộ lọc\n* Phạm vi dữ liệu theo vai trò: xem [Vai trò và phân quyền](../bat-dau/vai-tro-va-phan-quyen.md)\n", "bang-dieu-khien/tong-quan-ngay.md": "# Tổng quan ngày\n\n🧭 Tổng quan chức năng: Xem nhanh kết quả Marketing trong ngày hoặc trong kỳ: số liệu chính so với kỳ trước, tiến độ so với chỉ tiêu, việc đang cần xử lý và hiệu quả chuyển đổi. Dùng cho Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng Marketing và BGĐ\n\nTruy cập: menu **Bảng điều khiển → Điều hành → Tổng quan**\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH ĐỌC TỔNG QUAN MỖI NGÀY\n\nBước 1: Mở **Bảng điều khiển → Điều hành → Tổng quan**. Màn mở với kỳ **Hôm nay**\n\nBước 2: Xem banner cảnh báo. Có việc quá hạn thì nhấn `Xem cảnh báo` để xử lý\n\nBước 3: Xem thẻ **Chuyển đổi và hiệu quả** để nắm chất lượng lead, chi phí và hiệu quả quảng cáo\n\nBước 4: Xem thanh tiến độ của **Doanh thu ghi nhận** và **Lead mới**: đang đi trước, đúng hay chậm tiến độ\n\nBước 5: Xem **Chỉ tiêu lead theo đội** và **Lead theo kênh** để biết đội nào, kênh nào đang chậm\n\nBước 6: Bấm vào số có gạch chân để mở danh sách dữ liệu gốc khi cần kiểm tra chi tiết\n\nChọn kỳ, khoảng ngày tùy chọn, bộ lọc dùng chung, làm mới, xuất Excel và danh sách dữ liệu gốc: xem [Bộ lọc và kỳ báo cáo](bo-loc-va-ky-bao-cao.md)\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem tổng quan trong kỳ<\/mark>\n\n<figure><img src=\"images/tong-quan-ngay-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tên màn \"Tổng quan\", dòng \"Cập nhật lúc HH:MM · kỳ … so với …\", nhóm nút kỳ, nút Làm mới, `Xuất Excel` |\n| **Bộ lọc dùng chung** | Khối thu gọn \"Bộ lọc dùng chung · N điều kiện\". Xem [Bộ lọc và kỳ báo cáo](bo-loc-va-ky-bao-cao.md) |\n| **Banner cảnh báo** | Số việc đang quá hạn cần xử lý, nút `Xem cảnh báo` (mục 2) |\n| **Thẻ Chuyển đổi và hiệu quả** | 8 ô số liệu chính của kỳ (mục 3) |\n| **Thẻ Doanh thu ghi nhận** | Doanh thu so với chỉ tiêu, thanh tiến độ, 4 ô nhỏ (mục 4) |\n| **Thẻ Lead mới** | Lead so với chỉ tiêu, thanh tiến độ, 3 kênh nhiều lead nhất, 4 ô nhỏ (mục 4) |\n| **Thẻ Chỉ tiêu lead theo đội** | Tiến độ lead của từng đội (mục 5) |\n| **Thẻ Lead theo kênh** | Số lead và tỷ trọng của từng kênh (mục 5) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Bảng điều khiển → Điều hành → Tổng quan<\/strong><\/td><td>Hệ thống xác định phạm vi dữ liệu theo vai trò của bạn, tính số liệu kỳ này và kỳ trước rồi hiển thị các thẻ<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đổi kỳ ở nhóm nút <code>Hôm nay<\/code>, <code>Hôm qua<\/code>, <code>7 ngày<\/code>, <code>Tháng này<\/code>, <code>Tùy chọn…<\/code><\/td><td>Mọi thẻ tính lại theo kỳ mới. Chi tiết cách tính kỳ và nhãn so sánh: <a href=\"bo-loc-va-ky-bao-cao.md\">Bộ lọc và kỳ báo cáo<\/a><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Mở khối <strong>Bộ lọc dùng chung<\/strong>, chọn giá trị, nhấn <code>Áp dụng<\/code><\/td><td>Số liệu tính lại theo bộ lọc. Banner cảnh báo không đổi<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đọc từng thẻ<\/td><td>Xem ý nghĩa từng ô ở các mục 2 đến 5<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn nút Làm mới hoặc <code>Xuất Excel<\/code><\/td><td>Làm mới tính lại số ngay. Xuất Excel tải tệp <code>TongQuanNgay_&lt;từ ngày&gt;_&lt;đến ngày&gt;.xlsx<\/code> gồm đúng số đang hiển thị<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Màn chỉ để xem, không sửa được dữ liệu. Số liệu tính trực tiếp lúc mở màn, không tự làm mới\n* **Ai thấy dữ liệu gì:** Chuyên viên thấy dữ liệu của mình; Trưởng nhóm thấy dữ liệu đội mình; Trưởng/Phó phòng và BGĐ thấy toàn bộ\n* Không lấy được số liệu: màn hiển thị \"Không tải được số liệu\" kèm nút `Thử lại`, kỳ và bộ lọc giữ nguyên\n* Kỳ không có lead: các tỷ lệ hiển thị \"-\", thẻ Lead theo kênh ghi \"Chưa có lead trong kỳ\"\n\n## <mark style=\"color:green;\">2. Banner cảnh báo<\/mark>\n\n<figure><img src=\"images/tong-quan-ngay-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề \"N việc đang quá hạn cần xử lý\"** | N là tổng số việc của các loại cảnh báo bạn được xem, bằng số \"N việc\" trên màn Cảnh báo cần xử lý |\n| **Dòng mô tả** | Hai nhóm việc đầu tiên (ưu tiên nhóm Nghiêm trọng), ví dụ \"1 Đề xuất chi quá hạn duyệt · 1 Hội thoại quá hạn phản hồi · và 2 nhóm khác\" |\n| **Mức banner** | Mức Nghiêm trọng khi có nhóm Nghiêm trọng; mức Cảnh báo khi chỉ có nhóm Cảnh báo; \"Không có việc quá hạn\" khi không có việc nào |\n| **Nút `Xem cảnh báo`** | Mở màn [Cảnh báo cần xử lý](canh-bao-can-xu-ly.md) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Đọc tiêu đề và dòng mô tả của banner<\/td><td>Biết có bao nhiêu việc và nhóm việc nào gấp nhất<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Xem cảnh báo<\/code><\/td><td>Hệ thống mở màn Cảnh báo cần xử lý với đầy đủ danh sách loại cảnh báo<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Banner tính tại thời điểm hiện tại, **không** phụ thuộc kỳ và bộ lọc đang chọn\n* Số trên banner bằng huy hiệu trên menu **Cảnh báo cần xử lý** và trên nhóm menu **Bảng điều khiển**. Huy hiệu hiển thị \"99+\" khi lớn hơn 99; banner luôn hiển thị số thật\n* Loại cảnh báo bạn không đủ quyền xem không được cộng vào N\n\n## <mark style=\"color:green;\">3. Thẻ Chuyển đổi và hiệu quả<\/mark>\n\n<figure><img src=\"images/tong-quan-ngay-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Ô | Ý nghĩa | Bấm được |\n| --- | --- | --- |\n| **Khách tiềm năng đủ điều kiện** | Lead tạo trong kỳ, thẩm định hợp lệ, đủ trường bắt buộc (mặc định: họ tên, số điện thoại hợp lệ, nhãn sản phẩm quan tâm). Kèm chênh lệch kỳ trước | Có: mở danh sách lead đủ điều kiện |\n| **Đã mất** | Cơ hội đóng trong kỳ có lý do thất bại. Giảm là tốt | Có: mở danh sách cơ hội đã mất |\n| **Lead → Cơ hội** | Cơ hội mới ÷ Lead mới × 100 | Không |\n| **Lượt nhấp** | Tổng lượt nhấp quảng cáo trong kỳ. Chỉ quảng cáo Meta có số liệu | Không |\n| **ROAS** | Doanh thu ÷ Chi phí quảng cáo, dạng \"4,8×\" | Không |\n| **ROI** | (Doanh thu − Chi phí quảng cáo) ÷ Chi phí quảng cáo, dạng %. Khi mọi đơn đã có giá vốn, có thêm dòng phụ \"ROI lợi nhuận gộp\" | Không |\n| **Lưu lượng truy cập** | Số phiên truy cập website trong kỳ. Hiển thị \"-\" kèm \"Chưa kết nối GA4\" cho tới khi có nguồn số liệu | Không |\n| **Chiến dịch đang chạy** | Số chiến dịch quảng cáo đang ở trạng thái Đang chạy trong phạm vi của bạn, kể cả chiến dịch đang tạm dừng hoặc đang chờ duyệt điều chỉnh. Không theo kỳ | Không |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Đọc giá trị và chênh lệch của từng ô<\/td><td>Chênh lệch có dấu + là tăng, dấu − là giảm. Với Đã mất, giảm là tốt<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Rê chuột vào ô<\/td><td>Hiện chú giải cách tính của ô<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm số <strong>Khách tiềm năng đủ điều kiện<\/strong> hoặc <strong>Đã mất<\/strong><\/td><td>Mở danh sách dữ liệu gốc đúng kỳ và bộ lọc. Tổng số dòng bằng số đã bấm<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Khi chi phí bằng 0 mà có lead: CPL hiển thị \"0 đ\", ROAS và ROI hiển thị \"-\"\n* Lọc theo chiều chưa lọc được chi phí (Nhân viên, Trang web, Kênh nhập, Khu vực): Lượt nhấp hiển thị số chưa lọc kèm \"Chi phí chưa lọc theo chiều này\"; ROAS, ROI hiển thị \"-\"\n* Ô **Chiến dịch đang chạy** không đếm chiến dịch \"Đã duyệt · chờ ngày chạy\", đang đẩy hoặc đã kết thúc. Vì vậy số này có thể nhỏ hơn số trên tab Đang chạy của [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md)\n* Chuyên viên không thấy dòng phụ \"ROI lợi nhuận gộp\". Khi chưa đủ giá vốn, dòng phụ này ẩn với mọi vai trò\n* Lead tính vào kỳ theo ngày tạo. Lead bổ sung đủ trường ở kỳ sau vẫn tính vào kỳ tạo, nên số \"đủ điều kiện\" của kỳ cũ có thể tăng khi xem lại\n\n## <mark style=\"color:green;\">4. Theo dõi Doanh thu ghi nhận và Lead mới<\/mark>\n\n<figure><img src=\"images/tong-quan-ngay-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Giá trị lớn** | Doanh thu (hoặc số lead mới) và \"/ … chỉ tiêu\" |\n| **Thanh tiến độ** | Rộng bằng % đạt chỉ tiêu (tối đa 100%). Vạch mốc là % thời gian đã qua |\n| **Dòng \"n% chỉ tiêu · thời gian đã qua m%\"** | % đạt hiển thị số thật, có thể trên 100%. Bên phải là chênh lệch so với kỳ trước |\n| **Dòng trạng thái** | \"Đi trước tiến độ n điểm\", \"Đúng tiến độ\" hoặc \"Chậm n điểm so với tiến độ\" |\n| **Đường xu hướng** (thẻ Doanh thu) | Doanh thu theo từng ngày của kỳ |\n| **Nút `Danh sách đơn`** / **`Danh sách lead`** | Mở danh sách đơn chốt / danh sách lead của kỳ |\n| **3 kênh nhiều lead nhất** (thẻ Lead) | Tên kênh, thanh, số lead, tỷ trọng |\n| **4 ô nhỏ thẻ Doanh thu** | **Đơn chốt** (bấm được), **Giá trị TB / đơn**, **ROAS**, **Chi phí quảng cáo** (bấm được; giảm là tốt) |\n| **4 ô nhỏ thẻ Lead** | **Cơ hội mới** (bấm được), **Lead → Cơ hội**, **CPL** (giảm là tốt), **Lead → Đơn** |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>So thanh tiến độ với vạch thời gian<\/td><td>Thanh vượt vạch là đi trước, thanh dưới vạch quá 3 điểm là chậm. Chênh trong khoảng ±3 điểm là đúng tiến độ<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Danh sách đơn<\/code> hoặc bấm số <strong>Đơn chốt<\/strong><\/td><td>Mở danh sách đơn đã chốt trong kỳ có nguồn Marketing. Chuyên viên không mở được (xem Lưu ý)<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm số <strong>Chi phí quảng cáo<\/strong><\/td><td>Mở danh sách chi phí quảng cáo theo ngày và chiến dịch. Tổng cột Chi phí bằng số đã bấm<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Danh sách lead<\/code> hoặc bấm số <strong>Cơ hội mới<\/strong><\/td><td>Mở danh sách lead mới / cơ hội mới của kỳ<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Doanh thu** là tổng tiền đơn đã chốt có nguồn từ lead Marketing, gồm thuế, chưa trừ chiết khấu. Đơn đã chốt rồi bị hủy thì không tính; trả hàng, hoàn tiền sau khi chốt chưa bị trừ\n* **Chỉ tiêu theo kỳ** được chia theo số ngày: chỉ tiêu tháng 300 lead, xem kỳ 7 ngày thì chỉ tiêu kỳ là 300 × 7 ÷ số ngày của tháng\n* **Mẫu số chỉ tiêu theo vai trò:**\n  * Trưởng/Phó phòng, BGĐ: chỉ tiêu toàn phòng, lấy từ kế hoạch Marketing đã duyệt. Chưa có kế hoạch đã duyệt thì % chỉ tiêu và tiến độ hiển thị \"-\"\n  * Trưởng nhóm: tổng chỉ tiêu của các đội mình quản lý\n  * Chuyên viên: chưa có chỉ tiêu cá nhân nên **không** có thanh tiến độ và % chỉ tiêu; chỉ thấy số thực tế và so sánh kỳ trước\n* **Chuyên viên** thấy số Đơn chốt, Doanh thu, ROAS nhưng không mở được danh sách đơn: nút `Danh sách đơn` được thay bằng dòng khóa \"Không mở được danh sách đơn\", ô Đơn chốt có biểu tượng khóa\n* Lọc theo chiều không có chỉ tiêu (ví dụ Chiến dịch) thì thanh tiến độ và % chỉ tiêu bị ẩn\n* Kỳ Hôm nay: chênh lệch của Chi phí quảng cáo, CPL, ROAS hiển thị \"-\" cho tới hết ngày\n* Giờ đồng bộ chi phí gần nhất hiển thị cạnh ô Chi phí quảng cáo. Chi phí quảng cáo gồm chi phí Meta đồng bộ và các khoản thanh toán quảng cáo trả phí của kênh Google, TikTok; không gồm KOL, in ấn, sự kiện\n\n## <mark style=\"color:green;\">5. Chỉ tiêu lead theo đội và Lead theo kênh<\/mark>\n\n<figure><img src=\"images/tong-quan-ngay-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thẻ Chỉ tiêu lead theo đội** | Mỗi đội một dòng: tên đội, thẻ \"Chậm tiến độ\" nếu chậm, \"lead / chỉ tiêu · n%\", thanh tiến độ. Sắp theo số lead giảm dần |\n| **Dòng \"Chưa giao đội\"** | Phần chỉ tiêu phòng chưa giao cho đội nào, kèm lead không xác định được đội |\n| **Nút `Hiệu suất đội nhóm`** | Mở màn [Hiệu suất đội nhóm](hieu-suat-doi-nhom.md) |\n| **Thẻ Lead theo kênh** | Mỗi kênh một dòng: tên, thanh tỷ trọng, số lead, %. Kênh rỗng ghi \"(Chưa gắn kênh)\". Sắp giảm dần |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Xem các đội có thẻ \"Chậm tiến độ\"<\/td><td>Đội có % đạt thấp hơn % thời gian đã qua quá 3 điểm bị gắn thẻ \"Chậm tiến độ\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm tên một đội<\/td><td>Mở danh sách lead của đội đó trong kỳ<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Hiệu suất đội nhóm<\/code><\/td><td>Mở màn so sánh chi tiết giữa các đội, giữ kỳ và bộ lọc<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xem thẻ <strong>Lead theo kênh<\/strong><\/td><td>Biết kênh nào mang về nhiều lead nhất. Thẻ này chỉ để xem, không phải bộ lọc<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Đội xuất hiện khi có lead hoặc có chỉ tiêu giao trong kỳ\n* **Ai thấy thẻ Chỉ tiêu lead theo đội:**\n  * Trưởng/Phó phòng, BGĐ: mọi đội và dòng \"Chưa giao đội\". Nếu tổng chỉ tiêu các đội lớn hơn chỉ tiêu phòng, dòng này không hiện và thay bằng ghi chú \"Tổng chỉ tiêu các đội vượt chỉ tiêu phòng n lead\"\n  * Trưởng nhóm: chỉ các đội mình quản lý, không có dòng \"Chưa giao đội\"\n  * Chuyên viên: không thấy thẻ này, thay bằng dòng \"Chỉ tiêu theo đội chỉ xem được từ Trưởng nhóm\"\n* Chỉ tiêu toàn phòng lấy từ kế hoạch Marketing đã duyệt, không bằng tổng chỉ tiêu các đội. Xem cách lập chỉ tiêu ở [Chỉ tiêu theo sản phẩm](../ke-hoach/chi-tieu-theo-san-pham.md) và [Chỉ tiêu theo kênh](../ke-hoach/chi-tieu-theo-kenh.md)\n* Kỳ không có lead: thẻ Lead theo kênh ghi \"Chưa có lead trong kỳ\"\n", "bang-dieu-khien/canh-bao-can-xu-ly.md": "# Cảnh báo cần xử lý\n\n🧭 Tổng quan chức năng: Gom mọi việc đang quá hạn hoặc sắp vượt ngưỡng tại thời điểm hiện tại để xử lý trong ngày: chi phí chạm ngưỡng, đề xuất chi quá hạn duyệt, chiến dịch sắp hết ngân sách, chỉ tiêu lead chậm tiến độ. Một số cảnh báo xử lý được ngay tại màn này. Dùng cho Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng Marketing và BGĐ, mỗi người thấy cảnh báo theo quyền của mình\n\nTruy cập: menu **Bảng điều khiển → Điều hành → Cảnh báo cần xử lý**, hoặc nhấn `Xem cảnh báo` trên banner của màn [Tổng quan ngày](tong-quan-ngay.md)\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH XỬ LÝ CẢNH BÁO\n\nBước 1: Mở màn **Cảnh báo cần xử lý**. Huy hiệu trên menu cho biết số việc đang chờ\n\nBước 2: Bấm một loại cảnh báo trong nhóm **Cần xử lý** để mở danh sách chi tiết\n\nBước 3: Lọc nhanh, chọn một dòng hoặc nhiều dòng\n\nBước 4: Nhấn nút xử lý: `Duyệt`, `Xem khoản chi`, `Tạm dừng quảng cáo`, `Đánh dấu đã xử lý`, `Nhắc`, `Giao cho người khác`…\n\nBước 5: Hệ thống thực hiện ở phân hệ sở hữu dữ liệu, ghi nhật ký người, thời điểm, đối tượng rồi tính lại số cảnh báo. Dòng đã xử lý xong biến mất sau khi làm mới\n\n**Ai được làm gì:**\n\n| Thao tác | Vai trò được làm |\n| --- | --- |\n| Xem cảnh báo, `Xem khoản chi` | Mọi vai trò, theo quyền xem từng loại |\n| `Duyệt` đề xuất chi | Người ký được bậc đang chờ của đề xuất chi |\n| `Tạm dừng quảng cáo` | Chỉ Trưởng/Phó phòng, BGĐ |\n| `Giao cho người khác`, `Nhắc`, `Đánh dấu đã xử lý` | Từ Trưởng nhóm trở lên, trong phạm vi của mình |\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem danh sách cảnh báo<\/mark>\n\n<figure><img src=\"images/canh-bao-can-xu-ly-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | \"Cập nhật lúc HH:MM · tính tại thời điểm hiện tại\" và nút Làm mới. Màn không có chọn kỳ và bộ lọc dùng chung |\n| **Nhóm \"Cần xử lý · N việc\"** | Mỗi loại có việc là một dòng: nhãn mức độ (\"Nghiêm trọng\", \"Cảnh báo\"), tiêu đề, mô tả, số việc, mũi tên. Bấm dòng để mở danh sách chi tiết |\n| **Nhóm \"Không có việc\"** | Loại không có việc nào: dòng mờ, số 0, không bấm được |\n| **Nhóm \"Không đủ quyền xem\"** | Loại bạn không được xem: mô tả \"Bạn không có quyền xem số liệu này\", số \"-\" |\n| **Ghi chú sắp xếp** | \"Sắp xếp: nghiêm trọng trước, cùng mức thì nhiều việc trước\" |\n| **Banner khi hết việc** | \"Không có việc nào đang quá hạn\" khi tổng số việc bằng 0 |\n\n**Các loại cảnh báo:**\n\n| Loại | Mức | Khi nào xuất hiện | Ai thấy |\n| --- | --- | --- | --- |\n| **Chi phí chạm ngưỡng cảnh báo** | Nghiêm trọng | Chi phí của một dòng phân bổ ngân sách hoặc hạn mức quý đạt mốc cảnh báo sớm (mặc định 80%) đến 100% (mốc \"Cảnh báo\"), hoặc vượt trên 100% (mốc \"Vượt mức\"). Hệ thống quét mỗi giờ | Trưởng/Phó phòng, BGĐ: mọi cảnh báo. Trưởng nhóm: cảnh báo hạn mức và cảnh báo dòng phân bổ thuộc đội mình. Chuyên viên: cảnh báo dòng phân bổ mình phụ trách hoặc tạo |\n| **Đề xuất chi quá hạn duyệt** | Nghiêm trọng | Đề xuất chi đang chờ duyệt mà bậc đang chờ đã quá hạn duyệt | Theo phạm vi dữ liệu đề xuất chi |\n| **Chiến dịch sắp hết ngân sách** | Cảnh báo | Chiến dịch đang chạy (kể cả đang tạm dừng, đang chờ duyệt điều chỉnh), đã duyệt chờ ngày chạy hoặc đang đẩy, có chi phí thực đạt từ mốc cảnh báo sớm (mặc định 80%) đến 100% ngân sách đã duyệt | Theo phạm vi dữ liệu chiến dịch |\n| **Chỉ tiêu lead chậm tiến độ** | Cảnh báo | Chỉ tiêu đang trong kỳ, có chỉ tiêu lead, % đạt lead thấp hơn % thời gian đã qua quá 3 điểm | Theo phạm vi dữ liệu chỉ tiêu |\n| **Hội thoại quá hạn phản hồi** | Cảnh báo | Hội thoại khách hàng vượt thời gian phản hồi cam kết. Chỉ có khi đã cài phân hệ CSKH | Chỉ Trưởng/Phó phòng, BGĐ |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Bảng điều khiển → Điều hành → Cảnh báo cần xử lý<\/strong><\/td><td>Hệ thống tính từng loại cảnh báo tại thời điểm hiện tại theo quyền của bạn, rồi hiển thị ba nhóm<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem nhóm <strong>Cần xử lý · N việc<\/strong><\/td><td>Loại Nghiêm trọng nằm trên. Cùng mức thì loại nhiều việc hơn nằm trên<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm một dòng có việc<\/td><td>Mở danh sách chi tiết của loại đó (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn nút Làm mới<\/td><td>Hệ thống tính lại số cảnh báo và cập nhật \"Cập nhật lúc HH:MM\". Huy hiệu trên menu và banner ở Tổng quan cũng cập nhật<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Mỗi dòng trong danh sách là một việc. Số việc luôn tính lại từ dữ liệu gốc: xử lý xong (duyệt đề xuất, đánh dấu đã xử lý, tăng ngân sách…) thì số giảm sau khi làm mới\n* Màn **không** theo kỳ và **không** áp bộ lọc dùng chung\n* Huy hiệu số việc trên menu chỉ cộng các loại bạn được xem. Huy hiệu ẩn khi bằng 0, hiển thị \"99+\" khi lớn hơn 99\n* Màn không tự làm mới. Huy hiệu và số cập nhật khi mở hoặc chuyển màn trong Bảng điều khiển, sau mỗi thao tác xử lý và khi nhấn Làm mới\n* Loại **Chi phí chạm ngưỡng cảnh báo** lấy kết quả lần quét gần nhất, có thể trễ tối đa 1 giờ. Mỗi dòng phân bổ hoặc hạn mức chỉ có một cảnh báo ở mốc cao nhất. Cấu hình mốc cảnh báo: [Cảnh báo vượt mức](../quan-ly-chi-phi-ngan-sach/canh-bao-vuot-muc.md)\n* Loại **Chiến dịch sắp hết ngân sách** không báo khi chi phí đã vượt 100%; trường hợp này hiện cờ \"Chi vượt ngân sách đã duyệt\" ở [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md). Một chiến dịch có thể vừa ở loại này vừa ở loại Chi phí chạm ngưỡng cảnh báo; khi đó tính là hai việc\n* Hai loại **Bàn giao Sale quá hạn xác nhận** và **Nội dung chờ duyệt quá hạn** chưa hiển thị trên màn này và không tính vào số việc\n\n## <mark style=\"color:green;\">2. Xem danh sách chi tiết của một cảnh báo<\/mark>\n\n<figure><img src=\"images/canh-bao-can-xu-ly-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đường dẫn, tiêu đề, `Quay lại`** | \"Marketing > Bảng điều khiển > Cảnh báo cần xử lý\", tiêu đề là tên loại cảnh báo, mũi tên `Quay lại` về màn Cảnh báo |\n| **Banner mô tả** | Theo mức Nghiêm trọng hoặc Cảnh báo, kèm dòng \"Xử lý từng dòng bằng nút bên phải, hoặc chọn nhiều dòng để xử lý hàng loạt\" |\n| **Ô \"Lọc nhanh trong danh sách\"** | Lọc theo chữ, tối đa 100 ký tự. Hiển thị \"N khớp\" |\n| **Bảng** | Cột: ô chọn, **Đối tượng**, **Đội nhóm MKT**, **Phụ trách**, **Quá hạn** (ví dụ \"6 giờ 50 phút\", \"1 ngày\") hoặc chi tiết, nút thao tác của dòng |\n| **Thanh hàng loạt** | Hiện khi có dòng được chọn: \"N đã chọn\", các nút hàng loạt của loại, `Giao cho người khác`, nút ✕ bỏ chọn |\n| **Phân trang** | 20 dòng mỗi trang |\n\n**Thao tác theo loại cảnh báo:**\n\n| Loại | Nút ở từng dòng | Nút hàng loạt |\n| --- | --- | --- |\n| **Chi phí chạm ngưỡng cảnh báo** | `Xem khoản chi`, `Đánh dấu đã xử lý` | `Tạm dừng quảng cáo`, `Đánh dấu đã xử lý`, `Giao cho người khác` |\n| **Đề xuất chi quá hạn duyệt** | `Duyệt` | `Duyệt` |\n| **Chiến dịch sắp hết ngân sách** | `Đề xuất thêm` | `Giao cho người khác` |\n| **Chỉ tiêu lead chậm tiến độ** | `Xem chỉ tiêu` | `Nhắc trưởng nhóm`, `Giao cho người khác` |\n| **Hội thoại quá hạn phản hồi** | `Mở hội thoại` | Không có |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Gõ chữ vào ô <strong>Lọc nhanh trong danh sách<\/strong><\/td><td>Hệ thống tìm trên các cột Đối tượng, Đội nhóm MKT, Phụ trách, Chi tiết; không phân biệt hoa thường và dấu tiếng Việt; trên toàn bộ kết quả. Hiển thị \"N khớp\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Tích ô chọn ở đầu dòng<\/td><td>Thanh hàng loạt hiện \"N đã chọn\" và các nút hàng loạt của loại<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Tích ô <strong>Chọn tất cả<\/strong> ở tiêu đề bảng<\/td><td>Chọn các dòng của trang đang xem (sau khi lọc nhanh). Lựa chọn được giữ khi sang trang khác<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn nút ở một dòng hoặc nút trên thanh hàng loạt<\/td><td>Hệ thống kiểm tra quyền. Đủ quyền thì thực hiện hoặc mở hộp thoại (mục 3 đến 7). Không đủ quyền thì nút bị khóa kèm chú giải lý do<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Xem kết quả<\/td><td>Xử lý hàng loạt hiện \"Đã xử lý X dòng; bỏ qua Y dòng\" kèm lý do từng dòng bị bỏ qua. Dòng đã xử lý tự bỏ chọn<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn nút ✕ trên thanh hàng loạt hoặc <code>Quay lại<\/code><\/td><td>Bỏ chọn tất cả / về màn Cảnh báo cần xử lý<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Mỗi lần xử lý hàng loạt tối đa 100 dòng. Chọn nhiều hơn thì hệ thống báo \"Tối đa 100 dòng mỗi lần xử lý\" và không thực hiện\n* Xử lý hàng loạt làm từng dòng độc lập: dòng bạn không đủ quyền hoặc đã đổi trạng thái bị bỏ qua, các dòng còn lại vẫn được xử lý\n* Nếu người khác vừa xử lý dòng đó, hệ thống không làm lần hai và báo \"Dòng này đã được &lt;tên&gt; xử lý lúc HH:MM\"\n* Thao tác lỗi: dòng giữ nguyên, hệ thống hiển thị lý do\n* Không có nút Hoàn tác. Giao nhầm thì giao lại; tạm dừng nhầm thì bật lại chiến dịch ở [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md)\n* Đổi chữ ở ô lọc nhanh thì dòng không còn khớp bị bỏ chọn\n\n## <mark style=\"color:green;\">3. Duyệt đề xuất chi quá hạn<\/mark>\n\n<figure><img src=\"images/canh-bao-can-xu-ly-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở loại <strong>Đề xuất chi quá hạn duyệt<\/strong><\/td><td>Mỗi dòng là một đề xuất chi: mã và nội dung, đội, người đề xuất, thời gian quá hạn<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Duyệt<\/code> ở một dòng (hoặc chọn nhiều dòng rồi nhấn <code>Duyệt<\/code> trên thanh hàng loạt)<\/td><td>Hệ thống mở hộp xác nhận ngay tại màn, có tóm tắt: mã, nội dung, số tiền, bậc đang chờ<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Ghi chú<\/strong><\/td><td>Không bắt buộc<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn liên kết <code>Xem chi tiết<\/code> (nếu cần)<\/td><td>Mở đề xuất chi ở màn <a href=\"../quan-ly-chi-phi-ngan-sach/de-xuat-chi.md\">Đề xuất chi<\/a> để xem đầy đủ trước khi duyệt<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xác nhận duyệt<\/code><\/td><td>Hệ thống duyệt bậc đang chờ theo đúng luồng bậc của đề xuất chi và ghi nhật ký. Duyệt hàng loạt chỉ duyệt dòng bạn đủ quyền và báo \"Đã xử lý X dòng; bỏ qua Y dòng\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Đóng hộp, không thay đổi<\/td><\/tr>\n<\/tbody><\/table>\n\n**Khi nút `Duyệt` bị khóa, chú giải cho biết lý do:**\n\n| Trường hợp | Chú giải |\n| --- | --- |\n| Bạn không thuộc nhóm ký bậc đang chờ | \"Bạn không thuộc bậc đang chờ duyệt (bậc «&lt;bậc&gt;» chỉ nhóm «&lt;nhóm&gt;» được ký).\" |\n| Trưởng nhóm của đội khác | \"Chỉ Trưởng nhóm của &lt;đội&gt; hoặc Trưởng/Phó phòng, BGĐ được ký bậc này.\" |\n| Bạn đã ký một bậc của đề xuất này | \"Bạn đã ký một bậc của đề xuất này - mỗi người chỉ ký một bậc, các bậc còn lại do người khác ký.\" |\n| Bạn là người lập hoặc người gửi duyệt | \"Bạn không thể duyệt đề xuất chi do chính mình lập hoặc gửi duyệt.\" |\n\n### ⚠️ Lưu ý\n\n* **Không có nút Từ chối** tại đây. Muốn từ chối, mở đề xuất ở màn [Đề xuất chi](../quan-ly-chi-phi-ngan-sach/de-xuat-chi.md)\n* Bậc Trưởng nhóm chỉ do Trưởng nhóm của đội của đề xuất ký; Trưởng/Phó phòng, BGĐ ký thay được. Bậc BGĐ chỉ BGĐ ký\n* Duyệt xong một bậc mà bậc kế tiếp cũng đã quá hạn thì dòng vẫn còn; dòng chỉ biến mất khi đề xuất không còn quá hạn\n* Cột **Quá hạn** tính từ hạn duyệt đến lúc xem: dưới 1 giờ ghi \"n phút\"; dưới 24 giờ ghi \"h giờ m phút\"; từ 24 giờ ghi \"n ngày\" (làm tròn xuống)\n* Loại này không có nút Giao cho người khác. Người cần xử lý là người ở bậc đang chờ duyệt\n\n## <mark style=\"color:green;\">4. Giao cho người khác<\/mark>\n\n<figure><img src=\"images/canh-bao-can-xu-ly-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn một hoặc nhiều dòng, nhấn <code>Giao cho người khác<\/code> trên thanh hàng loạt<\/td><td>Hệ thống mở hộp <strong>Giao cho người khác<\/strong>, liệt kê các dòng được giao<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Người nhận<\/strong><\/td><td>Bắt buộc. Chọn nhân viên Marketing trong phạm vi của bạn. Mặc định \"Chọn người nhận\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Xác nhận giao<\/code><\/td><td>Chưa chọn người nhận: báo \"Chọn người nhận trước khi xác nhận\", hộp vẫn mở<br>Thành công: hộp đóng, cột Phụ trách đổi sang người nhận, người nhận nhận thông báo, hiện \"Đã giao cho &lt;tên&gt;\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Đóng hộp, giữ nguyên người phụ trách cũ<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ từ **Trưởng nhóm trở lên** được giao. Trưởng nhóm giao cho nhân viên đội mình; Trưởng/Phó phòng, BGĐ giao cho mọi nhân viên Marketing. Chuyên viên thấy nút khóa với chú giải \"Chỉ Trưởng nhóm trở lên được giao việc\"\n* Chỉ có ở loại có người phụ trách thật: Chi phí chạm ngưỡng cảnh báo, Chiến dịch sắp hết ngân sách, Chỉ tiêu lead chậm tiến độ\n* Giao chỉ đổi người phụ trách, **không** làm giảm số cảnh báo\n\n## <mark style=\"color:green;\">5. Tạm dừng quảng cáo<\/mark>\n\n<figure><img src=\"images/canh-bao-can-xu-ly-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Trong loại <strong>Chi phí chạm ngưỡng cảnh báo<\/strong>, chọn một hoặc nhiều dòng<\/td><td>Mỗi dòng là một dòng phân bổ ngân sách hoặc hạn mức quý; tạm dừng áp cho các chiến dịch quảng cáo đang chạy thuộc dòng đó<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Tạm dừng quảng cáo<\/code><\/td><td>Hệ thống mở hộp <strong>Xác nhận tạm dừng quảng cáo<\/strong>: \"Tạm dừng N chiến dịch quảng cáo đã chọn?\" kèm danh sách. Chiến dịch đã tạm dừng được bỏ qua. Nếu tất cả đã tạm dừng: báo \"Các quảng cáo đã chọn đã tạm dừng\" và không mở hộp<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Xác nhận tạm dừng<\/code><\/td><td>Hệ thống gửi lệnh tạm dừng lên nền tảng quảng cáo. Thành công: dòng gắn thẻ \"Tạm dừng\", hiện \"Đã tạm dừng các quảng cáo đã chọn\"<br>Có chiến dịch lỗi: hiện \"Đã tạm dừng X chiến dịch; Y chiến dịch lỗi\" kèm lý do từng dòng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Hủy<\/code><\/td><td>Đóng hộp, không thay đổi<\/td><\/tr>\n<\/tbody><\/table>\n\n**Lý do lỗi khi tạm dừng:**\n\n| Lý do | Ý nghĩa |\n| --- | --- |\n| \"Nền tảng từ chối yêu cầu\" | Nền tảng quảng cáo không chấp nhận lệnh tạm dừng |\n| \"Nền tảng không phản hồi sau 30 giây\" | Quá 30 giây không có phản hồi |\n| \"Chiến dịch chưa kết nối nền tảng\" | Chiến dịch chưa nối với tài khoản quảng cáo |\n\n### ⚠️ Lưu ý\n\n* Chỉ **Trưởng/Phó phòng và BGĐ** được tạm dừng quảng cáo\n* Hệ thống tạm dừng được chiến dịch Facebook. Chiến dịch của nền tảng khác được liệt kê riêng trong hộp kèm lời nhắc tạm dừng trực tiếp trên nền tảng, và bị bỏ qua\n* Tạm dừng **không** đóng cảnh báo. Muốn đóng cảnh báo, nhấn `Đánh dấu đã xử lý` (mục 7)\n* Muốn chạy lại chiến dịch đã tạm dừng: làm ở [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md)\n\n## <mark style=\"color:green;\">6. Xem khoản chi<\/mark>\n\n<figure><img src=\"images/canh-bao-can-xu-ly-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tên** | \"kênh · chiến dịch\" của dòng cảnh báo |\n| **Bảng theo ngày** | Cột Ngày, Chi phí quảng cáo, Lead của 7 ngày gần nhất tính đến hôm nay |\n| **Tổng chi** | Tổng chi phí của các ngày trong bảng |\n| **Ngưỡng cảnh báo** | % đã dùng so với ngân sách phân bổ hoặc hạn mức, kèm mốc \"Cảnh báo\" (từ mốc cảnh báo sớm đến 100%) hoặc \"Vượt mức\" (trên 100%) |\n| **Trạng thái** | Đang chạy hoặc Tạm dừng |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Trong loại <strong>Chi phí chạm ngưỡng cảnh báo<\/strong>, nhấn <code>Xem khoản chi<\/code> ở một dòng<\/td><td>Hệ thống mở hộp <strong>Xem khoản chi<\/strong> với chi phí và lead theo ngày<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc tổng chi, ngưỡng và trạng thái<\/td><td>Dùng để quyết định tạm dừng, đề xuất tăng ngân sách hay đánh dấu đã xử lý<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Đóng<\/code><\/td><td>Quay lại danh sách chi tiết<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Hộp chỉ để xem, không sửa được dữ liệu\n* Số liệu theo phạm vi dữ liệu của bạn\n\n## <mark style=\"color:green;\">7. Nhắc, đánh dấu đã xử lý và các thao tác mở màn khác<\/mark>\n\n<figure><img src=\"images/canh-bao-can-xu-ly-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Đánh dấu đã xử lý<\/code> (loại Chi phí chạm ngưỡng cảnh báo, từng dòng hoặc hàng loạt)<\/td><td>Nhập <strong>Ghi chú<\/strong> nếu cần (không bắt buộc, tối đa 1.000 ký tự; vượt thì báo \"Ghi chú tối đa 1.000 ký tự.\"). Xác nhận: cảnh báo đóng, ghi người và thời điểm<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn dòng, nhấn <code>Nhắc trưởng nhóm<\/code> trên thanh hàng loạt (loại Chỉ tiêu lead chậm tiến độ)<\/td><td>Hệ thống gửi thông báo trong hệ thống tới người phụ trách: \"Nhắc xử lý: &lt;tiêu đề cảnh báo&gt; - &lt;đối tượng&gt; (&lt;chi tiết&gt;), người nhắc &lt;tên&gt;\". Phụ trách trống thì gửi Trưởng nhóm của đội; không có đội thì gửi Trưởng/Phó phòng<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Xem chỉ tiêu<\/code> (loại Chỉ tiêu lead chậm tiến độ)<\/td><td>Mở chỉ tiêu tương ứng ở nhóm Kế hoạch (<a href=\"../ke-hoach/chi-tieu-theo-san-pham.md\">Chỉ tiêu theo sản phẩm<\/a> hoặc <a href=\"../ke-hoach/chi-tieu-theo-kenh.md\">Chỉ tiêu theo kênh<\/a>)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Đề xuất thêm<\/code> (loại Chiến dịch sắp hết ngân sách)<\/td><td>Mở chi tiết chiến dịch ở <a href=\"../chien-dich/danh-sach-chien-dich.md\">Danh sách chiến dịch<\/a> và mở luồng <strong>Điều chỉnh<\/strong> (menu ⋯), ô Tổng ngân sách. Tổng ngân sách mới chỉ áp dụng sau khi được duyệt<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Mở hội thoại<\/code> (loại Hội thoại quá hạn phản hồi)<\/td><td>Mở hội thoại ở phân hệ CSKH để phản hồi khách<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* `Nhắc` và `Đánh dấu đã xử lý`: từ **Trưởng nhóm trở lên**, trong phạm vi của mình\n* Mỗi dòng chỉ được nhắc một lần trong 4 giờ. Nhắc sớm hơn thì hệ thống báo \"Đã nhắc lúc HH:MM, thử lại sau\". Nhắc không làm giảm số cảnh báo\n* Cảnh báo đã đánh dấu xử lý không sinh lại ở cùng mốc; chỉ sinh lại khi chi phí vượt mốc cao hơn. Cảnh báo cũng tự đóng khi lần quét sau không còn vượt ngưỡng (ví dụ đã tăng ngân sách)\n* Trong lúc chờ duyệt điều chỉnh ngân sách, chiến dịch vẫn tính theo ngân sách đã duyệt cũ nên vẫn nằm trong cảnh báo\n* Giao lại hội thoại là thao tác của phân hệ CSKH, không làm tại màn này\n", "bang-dieu-khien/pheu-va-hieu-qua.md": "# Phễu và hiệu quả\n\n🧭 Tổng quan chức năng: Tìm điểm nghẽn chuyển đổi qua 7 bước, từ chi phí quảng cáo đến lợi nhuận gộp, so sánh kỳ này với kỳ trước. Dùng cho Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng Marketing và BGĐ\n\nTruy cập: menu **Bảng điều khiển → Điều hành → Phễu và hiệu quả**. Cũng mở được từ liên kết \"Xem phễu chuyển đổi\" ở màn [Chi phí và Lead](../bao-cao-du-lieu/chi-phi-va-lead.md)\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH TÌM ĐIỂM NGHẼN CHUYỂN ĐỔI\n\nBước 1: Chọn kỳ và đặt bộ lọc cần xem (ví dụ một chiến dịch hoặc một đội)\n\nBước 2: Xem hai thẻ **Lead → Đơn chốt** và **ROAS · ROI** để biết hiệu quả chung\n\nBước 3: Đọc cột **Chuyển đổi so với bước trước** từ trên xuống: bước nào có tỷ lệ thấp là điểm nghẽn\n\nBước 4: So với cột **Chuyển đổi kỳ trước** và **Giá trị so với kỳ trước** để biết điểm nghẽn mới phát sinh hay đã có từ trước\n\nBước 5: Bấm tên bước hoặc số của bước đó để mở danh sách dữ liệu gốc và kiểm tra\n\nChọn kỳ, khoảng ngày tùy chọn, bộ lọc dùng chung, làm mới, xuất Excel và danh sách dữ liệu gốc: xem [Bộ lọc và kỳ báo cáo](bo-loc-va-ky-bao-cao.md)\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem phễu chuyển đổi<\/mark>\n\n<figure><img src=\"images/pheu-va-hieu-qua-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | \"Cập nhật lúc HH:MM · kỳ … so với …\", nhóm nút kỳ, nút Làm mới, `Nạp giá vốn` (chỉ Trưởng/Phó phòng, BGĐ), `Xuất Excel` |\n| **Bộ lọc dùng chung** | Xem [Bộ lọc và kỳ báo cáo](bo-loc-va-ky-bao-cao.md) |\n| **Thẻ Lead → Đơn chốt** | Đơn chốt ÷ Lead × 100, kèm dòng phụ \"kỳ trước x%\" |\n| **Thẻ ROAS · ROI** | ROAS dạng \"4,8×\", dòng phụ \"ROI x% · kỳ trước ROAS y×\" |\n| **Bảng phễu** | Cột **Bước**, **Giá trị**, **Chuyển đổi so với bước trước** (thanh và %), **Chuyển đổi kỳ trước**, **Giá trị so với kỳ trước** |\n\n**Bảy bước của phễu** (nhóm \"Marketing · chi phí đến khách tiềm năng đủ điều kiện\" và nhóm \"Bán hàng · cơ hội đến lợi nhuận\"):\n\n| Bước | Giá trị | Cột \"Chuyển đổi so với bước trước\" | Bấm để mở |\n| --- | --- | --- | --- |\n| **1. Chi phí quảng cáo** | Chi phí quảng cáo trong kỳ (Meta và thanh toán quảng cáo trả phí của Google, TikTok). Giảm là tốt | \"bước đầu\" | Danh sách Quảng cáo |\n| **2. Lead** | Số lead mới | \"CPL &lt;tiền&gt;\" (chi phí mỗi lead) | Danh sách Lead |\n| **3. Khách tiềm năng đủ điều kiện** | Lead thẩm định hợp lệ, đủ trường bắt buộc | Đủ điều kiện ÷ Lead | Danh sách Đủ điều kiện |\n| **4. Cơ hội** | Số cơ hội mới | Cơ hội ÷ Đủ điều kiện | Danh sách Cơ hội |\n| **5. Đơn chốt** | Số đơn đã chốt. Ngay dưới có dòng phụ **CPA** = Chi phí ÷ Đơn chốt | Đơn ÷ Cơ hội | Danh sách Đơn chốt |\n| **6. Doanh thu** | Tổng tiền đơn đã chốt | \"TB &lt;tiền&gt; / đơn\" | Danh sách Đơn chốt |\n| **7. Lợi nhuận gộp** | Doanh thu trừ giá vốn; hoặc thẻ \"Chưa đủ giá vốn\" | \"Biên x%\" (lợi nhuận ÷ doanh thu) hoặc \"-\" | Không bấm được |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Bảng điều khiển → Điều hành → Phễu và hiệu quả<\/strong><\/td><td>Màn mở với kỳ và bộ lọc đang giữ trong Bảng điều khiển. Hệ thống tính 7 bước, kỳ này và kỳ trước<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đổi kỳ hoặc đặt bộ lọc<\/td><td>Bảng phễu và hai thẻ tính lại. Cách dùng: <a href=\"bo-loc-va-ky-bao-cao.md\">Bộ lọc và kỳ báo cáo<\/a><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc cột <strong>Chuyển đổi so với bước trước<\/strong><\/td><td>Tỷ lệ = giá trị bước ÷ giá trị bước ngay trên × 100. Thanh ngang thể hiện tỷ lệ. Mẫu số bằng 0 thì hiển thị \"-\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đọc cột <strong>Chuyển đổi kỳ trước<\/strong> và <strong>Giá trị so với kỳ trước<\/strong><\/td><td>Chênh lệch có dấu + là tăng, dấu − là giảm. Với Chi phí quảng cáo, giảm là tốt<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn nút Làm mới hoặc <code>Xuất Excel<\/code><\/td><td>Làm mới tính lại ngay. Xuất Excel tải tệp gồm hai thẻ và bảng phễu đang hiển thị<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Màn chỉ để xem, không sửa được dữ liệu\n* Mỗi bước đếm theo mốc thời gian riêng (lead theo ngày tạo lead, cơ hội theo ngày tạo cơ hội, đơn theo ngày đặt đơn), không theo từng nhóm lead. Với kỳ ngắn, tỷ lệ chuyển đổi có thể vượt 100%\n* Tỷ lệ ở phễu ghi rõ \"Đủ điều kiện ÷ Lead\", \"Cơ hội ÷ Đủ điều kiện\", \"Đơn ÷ Cơ hội\". Đừng nhầm với ô \"Lead → Cơ hội\" ở [Tổng quan ngày](tong-quan-ngay.md) (Cơ hội ÷ Lead)\n* Lọc theo chiều chưa lọc được chi phí (Nhân viên, Trang web, Kênh nhập, Khu vực): bước Chi phí quảng cáo, CPL, CPA và thẻ ROAS · ROI hiển thị \"-\" kèm \"Chi phí chưa lọc theo chiều này\"\n* Kỳ Hôm nay: chênh lệch của bước Chi phí quảng cáo, CPL, CPA, ROAS, ROI hiển thị \"-\" cho tới hết ngày\n* **Chuyên viên:** thấy số của bước Đơn chốt, Doanh thu và CPA nhưng tên bước có biểu tượng khóa, không mở được danh sách đơn; **không** thấy bước Lợi nhuận gộp và nút `Nạp giá vốn`\n* **Trưởng nhóm:** thấy bước Lợi nhuận gộp nhưng không có nút `Nạp giá vốn`\n* Khi mở từ liên kết \"Xem phễu chuyển đổi\" ở Chi phí và Lead, Phễu nhận kỳ và bộ lọc đang áp ở màn báo cáo đó\n* Không lấy được số liệu: màn hiển thị \"Không tải được số liệu\" kèm nút `Thử lại`, kỳ và bộ lọc giữ nguyên\n\n## <mark style=\"color:green;\">2. Mở danh sách dữ liệu gốc của một bước<\/mark>\n\n<figure><img src=\"images/pheu-va-hieu-qua-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm số (hoặc tên bước có gạch chân) của một bước: Chi phí quảng cáo, Lead, Khách tiềm năng đủ điều kiện, Cơ hội, Đơn chốt, Doanh thu<\/td><td>Hệ thống mở danh sách dữ liệu gốc tương ứng, đúng kỳ, đúng bộ lọc và phạm vi dữ liệu của bạn. Tổng số dòng bằng số của bước<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Lọc nhanh, sắp xếp, mở bản ghi<\/td><td>Cách dùng danh sách: <a href=\"bo-loc-va-ky-bao-cao.md\">Bộ lọc và kỳ báo cáo<\/a>, mục Mở danh sách dữ liệu gốc<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Quay lại<\/code><\/td><td>Về màn Phễu và hiệu quả, giữ kỳ và bộ lọc<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Bước Đơn chốt và Doanh thu mở cùng danh sách Đơn chốt. Chuyên viên bấm vào thì thấy thông báo \"Bạn chưa được cấp quyền xem danh sách đơn hàng…\" kèm nút `Quay lại`\n* Bước Lợi nhuận gộp không mở danh sách\n* Danh sách Chi phí quảng cáo có tổng cột Chi phí bằng đúng số tiền của bước 1\n\n## <mark style=\"color:green;\">3. Xem Lợi nhuận gộp và nạp giá vốn<\/mark>\n\n<figure><img src=\"images/pheu-va-hieu-qua-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Xem dòng <strong>Lợi nhuận gộp<\/strong> ở cuối bảng phễu<\/td><td>Mọi đơn chốt trong kỳ và bộ lọc đã có giá vốn: hiển thị số lợi nhuận gộp và \"Biên x%\"<br>Còn đơn chưa có giá vốn, hoặc kỳ không có đơn nào: hiển thị thẻ \"Chưa đủ giá vốn\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Nạp giá vốn<\/code> ở thanh tiêu đề<\/td><td>Hệ th
