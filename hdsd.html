chỉ đọc (mục 5)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đọc kết quả<\/td><td>Xem thẻ chỉ số và bảng <strong>Mục tiêu so với thực tế<\/strong>. Cột Kết luận: Lead, Doanh thu, Tiếp cận đạt từ 100% là \"Đạt\", dưới 100% là \"Không đạt\"; Ngân sách dùng đến 100% là \"Trong ngân sách\", trên 100% là \"Vượt ngân sách\"; mục tiêu trống hoặc bằng 0 là \"Không đặt mục tiêu\"; kênh không có số tiếp cận là \"Không có số liệu\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Mở chiến dịch<\/td><td>Nhấn liên kết chiến dịch ở thẻ thông tin để mở chiến dịch ở tab Đã kết thúc<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td><code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>DanhGiaChienDich_yyyymmdd.xlsx<\/code> gồm các dòng đang xem: mã đánh giá, trạng thái, chiến dịch, kênh, sản phẩm, Đội chủ, người phụ trách, ngày kết thúc thực tế, ngân sách, chi phí thực, chi phí quảng cáo, mục tiêu và thực tế lead, doanh thu, tiếp cận, CPL, ROAS, ROI, case mẫu, người gửi, người xác nhận, thời điểm xác nhận. Danh sách rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy đánh giá nào:** giống phạm vi xem chiến dịch. Chuyên viên thấy đánh giá của chiến dịch mình phụ trách, mình tạo, có quảng cáo gán cho mình, và đánh giá mình lập; Trưởng nhóm thấy đánh giá của chiến dịch thuộc đội mình; Trưởng/Phó phòng, BGĐ thấy toàn bộ. Case mẫu đã xác nhận thì mọi người trong phòng xem được\n* Số liệu đánh giá là **số chốt** của chiến dịch, không tính lại và không đổi theo dữ liệu phát sinh sau. **CPL, ROAS, ROI** tính trên chi phí quảng cáo; ROI hiển thị theo %\n* Chiến dịch kênh Zalo OA, Google, TikTok không có số tiếp cận: Tiếp cận, Tần suất, Chi phí / 1.000 tiếp cận hiện \"-\"\n* Trong nhóm, dòng xếp theo ngày kết thúc thực tế, mới nhất trước. Danh sách cuộn liên tục, không phân trang\n* Đổi dòng khi đang có thay đổi chưa lưu thì hệ thống hỏi \"Bạn có thay đổi chưa lưu. Rời đi?\" (`Ở lại` / `Rời đi`)\n\n## <mark style=\"color:green;\">2. Lập đánh giá<\/mark>\n\nMỗi chiến dịch đã kết thúc có **tối đa một** đánh giá. Người lập được: người phụ trách chiến dịch, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ\n\n<figure><img src=\"images/danh-gia-chien-dich-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chiến dịch đã kết thúc<\/td><td>Vào tab <strong>Đã kết thúc<\/strong> của màn Chiến dịch và chọn chiến dịch, hoặc chọn dòng <strong>Chưa lập<\/strong> ở tab Đánh giá sau chiến dịch, hoặc mở việc \"Lập đánh giá &lt;mã&gt;\". Khung thông tin ghi \"Số liệu đã chốt lúc kết thúc (dd/mm/yyyy)… Chưa lập đánh giá.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><code>Lập đánh giá<\/code><\/td><td>Nhấn nút ở đầu chi tiết<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Hệ thống tạo đánh giá<\/td><td>Đánh giá được tạo ở <strong>Nháp<\/strong>, mã dạng <code>MKT-DG-nnnn<\/code>, số liệu lấy từ số chốt; bài học, đề xuất để trống; case mẫu chưa đánh dấu. Lịch sử chiến dịch ghi \"Lập đánh giá &lt;mã&gt;\"; việc nhắc của người phụ trách được đóng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Mở đánh giá<\/td><td>Màn chuyển sang tab <strong>Đánh giá sau chiến dịch<\/strong> và chọn đánh giá vừa lập. Thông báo: \"Đã tạo đánh giá &lt;mã&gt; từ số liệu đã chốt.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chiến dịch chưa chốt chi phí (trước 06:00 ngày thứ 3 sau ngày kết thúc) vẫn lập và soạn nháp được; khung trạng thái ghi thêm \"Chi phí chưa chốt (chốt ngày dd/mm/yyyy)\"\n* **Hạn lập đánh giá là 7 ngày** kể từ ngày kết thúc thực tế. Quá hạn mà chưa có đánh giá Đã xác nhận: dòng có chip **Quá hạn đánh giá**, khung ghi \"Đã quá hạn lập đánh giá (dd/mm/yyyy).\", và các Trưởng nhóm của Đội chủ nhận thêm việc nhắc. Vẫn lập được bình thường\n* Người khác vừa lập trước bạn: \"Chiến dịch &lt;mã&gt; đã có đánh giá &lt;mã đánh giá&gt;.\" và hệ thống mở đánh giá đó\n* Chiến dịch chưa kết thúc: \"Chỉ lập được đánh giá sau khi chiến dịch kết thúc và chốt số liệu.\"\n* Người không có quyền lập không thấy nút `Lập đánh giá`\n\n## <mark style=\"color:green;\">3. Soạn, lưu nháp và gửi xác nhận<\/mark>\n\nSửa được khi đánh giá ở **Nháp** hoặc **Yêu cầu bổ sung**, bởi người lập, người phụ trách chiến dịch, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ. Người khác thấy các ô ở dạng chỉ đọc\n\n<figure><img src=\"images/danh-gia-chien-dich-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Ô nhập | Mô tả |\n| --- | --- |\n| **Bài học rút ra** | Bắt buộc khi gửi xác nhận, tối đa 5.000 ký tự. Chỉ gõ khoảng trắng coi là trống |\n| **Đề xuất cho lần sau** | Không bắt buộc, tối đa 5.000 ký tự |\n| **Gắn làm case mẫu** | Ô đánh dấu, mặc định bỏ trống. \"Case mẫu được gợi ý khi lập đề xuất chiến dịch cùng nhóm sản phẩm\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở đánh giá<\/td><td>Chọn dòng Nháp hoặc Yêu cầu bổ sung. Khung hướng dẫn ghi \"Bạn sửa được nội dung nháp. Gửi xác nhận để Trưởng nhóm trở lên khoá đánh giá.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập nội dung<\/td><td>Nhập <strong>Bài học rút ra<\/strong>, <strong>Đề xuất cho lần sau<\/strong>; đánh dấu <strong>Gắn làm case mẫu<\/strong> nếu chiến dịch đáng dùng làm mẫu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><code>Lưu nháp<\/code><\/td><td>Hệ thống lưu và ghi lịch sử. Thông báo: \"Đã lưu nháp đánh giá &lt;mã&gt;.\" Vượt độ dài: \"Bài học rút ra tối đa 5.000 ký tự.\" hoặc \"Đề xuất cho lần sau tối đa 5.000 ký tự.\" ngay dưới ô, chữ đang gõ được giữ<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><code>Gửi xác nhận<\/code><\/td><td>Nút chỉ bấm được sau khi chiến dịch đã chốt chi phí; trước đó nút mờ kèm câu \"Chưa chốt chi phí, gửi xác nhận được từ ngày dd/mm/yyyy.\" Khi bấm, hệ thống tự lưu nội dung đang sửa rồi kiểm Bài học<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Thiếu bài học<\/td><td>Ô <strong>Bài học rút ra<\/strong> báo lỗi, dưới ô hiện \"Nhập bài học rút ra trước khi xác nhận.\" (ảnh trên). Đánh giá giữ nguyên trạng thái; nhập bài học rồi bấm lại<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Gửi thành công<\/td><td>Đánh giá sang <strong>Chờ xác nhận<\/strong>, các ô chuyển chỉ đọc; bạn được ghi là người gửi xác nhận; người xác nhận nhận việc \"Xác nhận đánh giá &lt;mã&gt;\". Thông báo: \"Đã gửi xác nhận đánh giá &lt;mã&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Xử lý yêu cầu bổ sung<\/td><td>Với đánh giá <strong>Yêu cầu bổ sung<\/strong>: đọc ý kiến ở khung Yêu cầu bổ sung, sửa nội dung, <code>Lưu nháp<\/code> rồi <code>Gửi xác nhận<\/code> lại. Khung Yêu cầu bổ sung ẩn đi; người yêu cầu nhận thông báo \"Đánh giá &lt;mã&gt; đã được bổ sung.\"<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Xóa đánh giá<\/td><td>Chỉ đánh giá Nháp chưa gửi xác nhận lần nào; chỉ Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ. Menu <strong>⋯<\/strong> → <code>Xóa đánh giá<\/code>, xác nhận \"Xóa đánh giá &lt;mã&gt;? Nội dung đánh giá sẽ bị xóa; chiến dịch quay lại trạng thái Chưa lập.\" bằng <code>Xóa<\/code>. Thông báo: \"Đã xóa đánh giá &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chuyên viên không xóa được đánh giá, kể cả đánh giá mình lập\n* Đánh giá Chờ xác nhận và Đã xác nhận không ai sửa hay xóa được\n* Người gửi xác nhận không được tự xác nhận đánh giá đó\n* Người khác vừa xác nhận trong lúc bạn đang sửa: \"Đánh giá &lt;mã&gt; đã chuyển sang trạng thái Đã xác nhận nên chưa thực hiện được thao tác này. Tải lại để xem.\" Chữ đang gõ được giữ để bạn sao chép\n\n## <mark style=\"color:green;\">4. Xác nhận, yêu cầu bổ sung<\/mark>\n\nChỉ áp dụng cho đánh giá **Chờ xác nhận**. Người xác nhận: Trưởng nhóm của Đội chủ (mọi Trưởng nhóm thuộc đội); Trưởng/Phó phòng, BGĐ xác nhận thay ở mọi đội. Người lập đánh giá và người gửi xác nhận không được xác nhận\n\n<figure><img src=\"images/danh-gia-chien-dich-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở đánh giá<\/td><td>Chọn dòng <strong>Chờ xác nhận<\/strong> hoặc mở việc \"Xác nhận đánh giá &lt;mã&gt;\". Khung hướng dẫn ghi \"Xác nhận để khoá đánh giá.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc nội dung<\/td><td>Xem số liệu, bảng mục tiêu so với thực tế, bài học, đề xuất và lựa chọn case mẫu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><code>Xác nhận đánh giá<\/code><\/td><td>Hộp <strong>Xác nhận đánh giá?<\/strong> ghi \"Sau khi xác nhận, nội dung đánh giá bị khoá và lưu vào lịch sử chiến dịch làm tham chiếu cho lần đề xuất sau.\" Có case mẫu thì thêm \"Đánh giá sẽ được gợi ý làm case mẫu khi lập đề xuất cùng nhóm sản phẩm.\" (ảnh dưới)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><code>Xác nhận<\/code><\/td><td>Đánh giá sang <strong>Đã xác nhận<\/strong>, ghi người và thời điểm, khóa nội dung và case mẫu; lịch sử chiến dịch ghi \"Đánh giá &lt;mã&gt; đã xác nhận\"; mọi việc nhắc được đóng; người lập và người gửi nhận thông báo. Thông báo: \"Đã xác nhận &lt;mã&gt;.\" Dòng chuyển sang nhóm Đã đánh giá. Nhấn <code>Hủy<\/code> để đóng hộp, giữ Chờ xác nhận<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><code>Yêu cầu bổ sung<\/code><\/td><td>Hộp <strong>Yêu cầu bổ sung<\/strong> mở ra. Nhập <strong>Cần bổ sung gì *<\/strong> (bắt buộc, tối đa 1.000 ký tự; trống: \"Nhập nội dung cần bổ sung.\"), nhấn <code>Gửi yêu cầu<\/code>. Thông báo: \"Đã gửi yêu cầu bổ sung cho &lt;người lập&gt;.\" Đánh giá về <strong>Yêu cầu bổ sung<\/strong>, người lập và người gửi nhận thông báo kèm ý kiến<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/danh-gia-chien-dich-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Người lập hoặc người gửi xác nhận thấy hai nút mờ kèm câu \"Bạn không thể duyệt đánh giá chiến dịch do chính mình lập hoặc gửi duyệt.\" và khung ghi \"Cần Trưởng nhóm của Đội chủ hoặc Trưởng/Phó phòng khác xác nhận.\"\n* Chuyên viên và Trưởng nhóm đội khác không có nút xác nhận. Thao tác ngoài quyền bị chặn: \"Trưởng nhóm của Đội chủ hoặc Trưởng/Phó phòng mới xác nhận được đánh giá.\"\n* Không còn ai khác đủ quyền xác nhận thì đánh giá giữ Chờ xác nhận; người lập thấy \"Chưa có người khác có quyền duyệt đánh giá chiến dịch này.\"\n* Đánh giá Đã xác nhận **không mở lại được**. Cần ghi thêm thì ghi chú ở chiến dịch\n\n## <mark style=\"color:green;\">5. Xem đánh giá đã xác nhận và xuất báo cáo tổng kết<\/mark>\n\nĐánh giá Đã xác nhận ở chế độ chỉ đọc, có khung \"Đã xác nhận bởi &lt;người&gt; lúc dd/mm/yyyy hh:mm\" và nút `Xuất PDF`\n\n<figure><img src=\"images/danh-gia-chien-dich-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Khung \"Đã xác nhận\"** | Người, thời điểm xác nhận; \"Nội dung đánh giá đã khoá, lưu vào lịch sử chiến dịch làm tham chiếu cho lần đề xuất sau.\"; \"Được gắn nhãn Case mẫu.\" nếu có |\n| **Thẻ chỉ số, Mục tiêu so với thực tế** | Như mục 1, chỉ đọc |\n| **Bài học rút ra, Đề xuất cho lần sau** | Hiện nguyên văn, giữ xuống dòng |\n| **Thẻ thông tin** | Chiến dịch (liên kết), Case mẫu (\"Có\" hoặc \"Không\"), người lập, người gửi xác nhận, người xác nhận và thời điểm |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn đánh giá<\/td><td>Chọn dòng <strong>Đã xác nhận<\/strong> ở nhóm Đã đánh giá<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><code>Xuất PDF<\/code><\/td><td>Hệ thống tải tệp <code>TongKet_&lt;mã chiến dịch&gt;_yyyymmdd.pdf<\/code> khổ A4 dọc, gồm: tiêu đề \"Báo cáo tổng kết chiến dịch\"; mã, tên chiến dịch và mã đánh giá; thông tin chung (kênh, mục tiêu, sản phẩm, Đội chủ, người phụ trách, thời gian chạy, ngày và cách kết thúc); bảng mục tiêu so với thực tế; bảng chỉ số; bài học, đề xuất, case mẫu; người lập, người xác nhận và thời điểm; chân trang \"Số liệu chốt lúc … · in lúc … · trang n/m\". Số tiền ghi đầy đủ, không rút gọn. Lịch sử đánh giá ghi \"Xuất PDF\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem số phát sinh sau<\/td><td>Nhấn liên kết chiến dịch → tab <strong>Lịch sử &amp; liên kết<\/strong> → <strong>Báo cáo hiệu quả chiến dịch<\/strong> để xem số liệu phát sinh sau ngày chốt<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ đánh giá Đã xác nhận mới xuất PDF được; đánh giá chưa xác nhận không có nút `Xuất PDF`\n* Ai xem được đánh giá thì xuất được PDF và Excel\n* Lỗi tạo tệp: \"Chưa xuất được tệp, vui lòng thử lại.\"\n* Đánh giá Đã xác nhận có gắn Case mẫu sẽ được gợi ý (tối đa 3, mới nhất trước) trong hộp **Tạo đề xuất chiến dịch** khi người khác chọn cùng nhãn sản phẩm. Xem [Danh sách chiến dịch](danh-sach-chien-dich.md), mục Tạo và sửa đề xuất\n* Số liệu phát sinh sau ngày chốt xem ở [Hiệu quả chiến dịch](../bao-cao-du-lieu/hieu-qua-chien-dich.md)\n", "noi-dung-va-media/yeu-cau-noi-dung.md": "# Yêu cầu nội dung\n\n🧭 Tổng quan chức năng: Màn dùng để đặt hàng sản xuất một nội dung (bài viết, ảnh, video), phân công người làm và theo dõi yêu cầu từ lúc tạo tới khi nội dung được duyệt và lên lịch đăng. Mọi người trong phòng Marketing đều tạo được yêu cầu; Trưởng nhóm, Trưởng/Phó phòng và BGĐ phân công, điều phối\n\nTruy cập: menu **Nội dung & media → Sản xuất nội dung → Yêu cầu nội dung** (màn mặc định khi mở nhóm Nội dung và media). Bấm mã yêu cầu ở màn Kế hoạch nội dung, Lịch xuất bản hoặc Duyệt nội dung cũng mở đúng yêu cầu đó tại màn này\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH SẢN XUẤT NỘI DUNG\n\nBước 1: **Kế hoạch nội dung**. Trưởng nhóm hoặc Chuyên viên lập kế hoạch nội dung của kỳ, gồm các dòng chủ đề, kênh và ngày dự kiến đăng; kế hoạch được duyệt. Xem [Kế hoạch nội dung](ke-hoach-noi-dung.md)\n\nBước 2: **Yêu cầu nội dung**. Người cần nội dung tạo yêu cầu tại màn này, hoặc bấm `Tạo yêu cầu` ở một dòng của kế hoạch nội dung. Yêu cầu ở trạng thái **Mới**. Xem mục 3 trang [Yêu cầu nội dung](yeu-cau-noi-dung.md)\n\nBước 3: **Phân công**. Trưởng nhóm của đội (hoặc Trưởng/Phó phòng, BGĐ) chọn Người viết, Người thiết kế, Người quay / dựng. Yêu cầu chuyển **Đã giao**. Xem mục 5 trang [Yêu cầu nội dung](yeu-cau-noi-dung.md)\n\nBước 4: **Sản xuất**. Người thực hiện bấm `Bắt đầu sản xuất`, soạn nội dung và cập nhật từng công đoạn. Yêu cầu chuyển **Đang sản xuất**. Xem [Bài đang sản xuất](bai-dang-san-xuat.md)\n\nBước 5: **Nộp phiên bản**. Người thực hiện bấm `Nộp bản nháp`; hệ thống kiểm tuân thủ và tạo một phiên bản chờ duyệt. Yêu cầu chuyển **Chờ duyệt**. Xem [Bài đang sản xuất](bai-dang-san-xuat.md)\n\nBước 6: **Duyệt nội dung**. Người duyệt bấm `Duyệt xuất bản` (yêu cầu chuyển **Hoàn thành**) hoặc `Yêu cầu sửa` (yêu cầu quay về **Đang sản xuất**, người thực hiện sửa rồi nộp phiên bản mới). Xem [Duyệt nội dung](duyet-noi-dung.md)\n\nBước 7: **Lên lịch xuất bản**. Với yêu cầu Hoàn thành, bấm `Lên lịch đăng` để hẹn giờ đăng nội dung lên một hoặc nhiều kênh. Xem [Lịch xuất bản](lich-xuat-ban.md)\n\nBước 8: **Đăng bài**. Đến giờ hẹn, hệ thống tự đăng; bài lỗi được thử lại, sửa hoặc đánh dấu đã đăng tay. Trạng thái xuất bản hiện lại ở chi tiết yêu cầu. Xem [Lịch xuất bản](lich-xuat-ban.md)\n\n**Trạng thái của yêu cầu:**\n\n* **Mới**: vừa tạo, chưa có người thực hiện\n* **Đã giao**: đã phân công, chờ người thực hiện bắt đầu\n* **Đang sản xuất**: đang soạn nội dung, hoặc đang sửa sau khi bị yêu cầu sửa\n* **Chờ duyệt**: đã nộp phiên bản, chờ người duyệt\n* **Hoàn thành**: phiên bản được duyệt xuất bản. Việc đăng bài theo dõi riêng ở **Trạng thái xuất bản**\n* **Đã hủy**: dừng yêu cầu, có lý do; khôi phục được về Mới\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách yêu cầu nội dung<\/mark>\n\n<figure><img src=\"images/yeu-cau-noi-dung-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề \"Yêu cầu nội dung\" và dòng đếm \"N yêu cầu · M chờ duyệt\". N là số yêu cầu khớp điều kiện lọc; M là số yêu cầu Chờ duyệt trong đó (M = 0 thì không hiện phần \"· M chờ duyệt\") |\n| **Bộ lọc nhanh** | `Tất cả`, `Mới`, `Đang sản xuất`, `Chờ duyệt`, `Hoàn thành`, `Đã hủy`. Mặc định `Tất cả` |\n| **Ô tìm** | \"Tìm theo mã, tiêu đề…\", tìm ngay khi gõ |\n| **Nút `Bộ lọc`** | Mở thêm điều kiện lọc: Định dạng, Kênh đăng dự kiến, Chiến dịch, Người thực hiện, Đội thực hiện, Trễ hạn, Của tôi, khoảng ngày tạo, khoảng hạn hoàn thành |\n| **Nút `Xuất Excel`** | Xuất danh sách đang lọc ra tệp Excel |\n| **Nút `+ Tạo yêu cầu`** | Mở hộp tạo yêu cầu mới |\n| **Cột trái: danh sách** | Mỗi dòng là một yêu cầu, gồm 3 dòng chữ: tên và chip trạng thái; mã, định dạng, kênh; hạn hoàn thành và người thực hiện |\n| **Cột phải: chi tiết** | Chi tiết yêu cầu đang chọn, gồm 3 tab `Tổng quan`, `Phiên bản`, `Lịch sử` (xem mục 2) |\n\n**Chip trạng thái:** Mới, Đã giao, Đang sản xuất, Chờ duyệt, Hoàn thành, Đã hủy\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Nội dung &amp; media → Sản xuất nội dung → Yêu cầu nội dung<\/strong><\/td><td>Hệ thống hiển thị các yêu cầu bạn được xem, bộ lọc <code>Tất cả<\/code>, tự chọn dòng đầu tiên và hiện chi tiết ở cột phải<br>Thứ tự: yêu cầu chưa đóng (Mới, Đã giao, Đang sản xuất, Chờ duyệt) đứng trước, hạn gần nhất lên đầu; yêu cầu đã đóng (Hoàn thành, Đã hủy) đứng sau, hạn mới nhất lên đầu<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn một nút ở <strong>Bộ lọc nhanh<\/strong><\/td><td><code>Tất cả<\/code>: mọi trạng thái trừ Đã hủy<br><code>Đang sản xuất<\/code>: gồm cả Đã giao và Đang sản xuất<br><code>Hoàn thành<\/code>: chỉ yêu cầu Hoàn thành<br><code>Đã hủy<\/code>: yêu cầu đã hủy<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập từ khóa vào <strong>Ô tìm<\/strong><\/td><td>Tìm theo một phần mã hoặc tên, không phân biệt hoa thường và dấu. Ví dụ \"video demo\" khớp \"Video demo…\", \"0052\" khớp mã <code>MKT-YC-0052<\/code>. Tối đa 100 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Bộ lọc<\/code> để lọc thêm<\/td><td>Chọn các điều kiện cần. Mỗi điều kiện hiện thành một chip có nút bỏ. Chọn <strong>Của tôi<\/strong> để xem yêu cầu mình tạo hoặc mình thực hiện. Chọn <strong>Trễ hạn<\/strong> để xem yêu cầu đã quá hạn hoàn thành<br>Nhấn <code>Xóa bộ lọc<\/code> để xóa mọi điều kiện, xóa ô tìm và đưa bộ lọc nhanh về <code>Tất cả<\/code><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Đọc thông tin trên từng dòng<\/td><td><strong>Hạn dd/mm/yyyy<\/strong> đã qua: yêu cầu đã trễ hạn hoàn thành<br>Nhãn <strong>Quá hạn duyệt<\/strong>: phiên bản đang chờ duyệt đã qua hạn duyệt<br>Chip <strong>Lỗi đăng<\/strong>: nội dung của yêu cầu có bài đăng lên kênh bị lỗi<br>Người thực hiện: tối đa hai tên, thêm \"+n\" nếu nhiều hơn; \"Chưa giao\" khi chưa phân công; \"Chưa giao · đề xuất &lt;tên&gt;\" khi yêu cầu tạo từ kế hoạch nội dung có người được gợi ý; \"&lt;tên&gt; (chờ phân công lại)\" khi yêu cầu vừa được khôi phục<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn vào một dòng<\/td><td>Cột phải hiện chi tiết yêu cầu ở tab <code>Tổng quan<\/code>. Bộ lọc và ô tìm giữ nguyên<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>YeuCauNoiDung_yyyymmdd.xlsx<\/code> gồm đúng các yêu cầu đang hiện theo bộ lọc và ô tìm, mỗi yêu cầu một dòng (mã, tên, định dạng, chiến dịch, kênh, người yêu cầu, người thực hiện, các mốc ngày, trạng thái, công đoạn, phiên bản mới nhất, trạng thái xuất bản, trễ hạn…)<br>Danh sách rỗng: hệ thống báo \"Không có dữ liệu để xuất.\" và không tải tệp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy yêu cầu nào:** Chuyên viên thấy yêu cầu mình tạo hoặc mình là Người viết, Người thiết kế, Người quay / dựng. Trưởng nhóm thấy thêm mọi yêu cầu của đội mình. Trưởng/Phó phòng và BGĐ thấy tất cả. Yêu cầu chưa có đội thực hiện chỉ người tạo và Trưởng/Phó phòng, BGĐ thấy\n* **Trễ hạn:** yêu cầu chưa Hoàn thành, chưa Đã hủy mà hạn hoàn thành trước hôm nay. Hạn bằng hôm nay chưa tính trễ. Trễ hạn chỉ để nhắc và lọc, không chặn thao tác\n* Không có yêu cầu nào khớp: danh sách hiện \"Không có yêu cầu nào khớp điều kiện.\", cột phải hiện \"Chọn một yêu cầu để xem chi tiết.\"\n* Khi bạn vừa thao tác làm yêu cầu rời khỏi bộ lọc (ví dụ hủy yêu cầu đang ở bộ lọc `Tất cả`), chi tiết vẫn giữ nguyên; dòng đó hiện mờ kèm nhãn \"Không nằm trong bộ lọc hiện tại\" cho tới khi bạn đổi bộ lọc hoặc chọn dòng khác\n* Danh sách tải 50 dòng mỗi lần; cuộn tới cuối để tải tiếp\n* Lỗi tải dữ liệu: hệ thống hiện \"Không tải được dữ liệu.\" và nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết yêu cầu<\/mark>\n\n### 2.1. Tab Tổng quan\n\n<figure><img src=\"images/yeu-cau-noi-dung-2.png\" alt=\"\"><figcaption><p>Yêu cầu Chờ duyệt đã quá hạn duyệt và trễ hạn hoàn thành<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên yêu cầu, dòng \"&lt;mã&gt; · &lt;định dạng&gt; · hạn &lt;dd/mm/yyyy&gt;\", chip trạng thái; nút chính theo trạng thái và menu `⋯` (Thao tác khác) |\n| **Thanh bước** | Mới → Đã giao → Đang sản xuất → Chờ duyệt → Hoàn thành; Đã hủy hiển thị riêng |\n| **Khung \"Phiên bản n đang chờ duyệt\"** | Khi yêu cầu Chờ duyệt: khung ghi giờ nộp, hạn duyệt và câu cho biết bạn có duyệt được không. Quá hạn duyệt thì tiêu đề khung thêm \"· quá hạn duyệt theo cam kết (SLA)\" |\n| **Khung \"Phiên bản n cần sửa\"** | Khi người duyệt đã yêu cầu sửa: khung kèm nhận xét, người và thời điểm nhận xét |\n| **Khung \"Trễ hạn hoàn thành\"** | \"Hạn &lt;dd/mm/yyyy&gt; đã qua mà yêu cầu chưa hoàn thành.\" Không hiện với yêu cầu Hoàn thành, Đã hủy |\n| **Khung \"Lỗi đăng lên kênh\"** | Khung kèm thông điệp lỗi của bài đăng và nút `Mở Lịch xuất bản` |\n| **Khung \"Tài nguyên hết hạn\"** | Khung \"Nội dung dùng tài nguyên đã hết hạn quyền sử dụng: &lt;mã&gt;.\" Khung mất khi bỏ tài nguyên đó khỏi nội dung |\n| **Khung \"Đã hủy\"** | Khung \"Đã hủy bởi &lt;tên&gt;, &lt;dd/mm/yyyy hh:mm&gt;\" và lý do. Yêu cầu đã khôi phục hiện \"Lý do hủy lần trước: &lt;lý do&gt;\" cho tới khi phân công lại |\n| **Thẻ \"Thông tin yêu cầu\"** | Mã yêu cầu, Định dạng, Loại nội dung, Chiến dịch, Kế hoạch nội dung, Người yêu cầu, Người viết, Người thiết kế, Người quay / dựng, Người thực hiện đề xuất (nếu có), Đội thực hiện, Hạn hoàn thành, Kênh đăng dự kiến, Giờ đăng dự kiến, Trạng thái xuất bản, Mô tả, Tệp tham khảo, Nội dung liên kết, Ngày hoàn thành. Ô trống hiện \"-\" |\n| **Thẻ \"Công đoạn sản xuất\"** | Hiện khi đã phân công: tên công đoạn, người làm, trạng thái Chưa làm, Đang làm, Xong |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn một yêu cầu ở danh sách<\/td><td>Tab <code>Tổng quan<\/code> mở ra. Đọc các khung cảnh báo ở đầu (nếu có) để biết yêu cầu đang vướng gì<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem thẻ <strong>Thông tin yêu cầu<\/strong><\/td><td><strong>Chiến dịch<\/strong> hiện \"&lt;mã&gt; · &lt;tên&gt;\", nhấn để mở chiến dịch<br><strong>Kế hoạch nội dung<\/strong> hiện mã, tên, trạng thái kế hoạch và chủ đề dòng; nhấn để mở kế hoạch. \"-\" nếu yêu cầu chưa thuộc kế hoạch nào<br><strong>Giờ đăng dự kiến<\/strong> của yêu cầu thuộc kế hoạch nội dung hiện theo dòng kế hoạch, kèm chú giải \"Theo dòng kế hoạch &lt;mã&gt;\"<br><strong>Nội dung liên kết<\/strong> là bản nội dung trong Kho nội dung (mã dạng <code>ND-yymm-nnn<\/code>), có từ khi bắt đầu sản xuất; nhấn để mở<br><strong>Ngày hoàn thành<\/strong> kèm \"trễ n ngày\" nếu hoàn thành sau hạn<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem <strong>Trạng thái xuất bản<\/strong><\/td><td><strong>Chưa hẹn giờ<\/strong>: chưa có bài đăng. <strong>Đã hẹn giờ<\/strong>: có bài chờ đăng hoặc đang đăng. <strong>Đã đăng<\/strong>: mọi bài đã đăng. <strong>Lỗi đăng<\/strong>: có bài đăng lỗi. \"-\" khi chưa có nội dung liên kết. Chỉ yêu cầu Hoàn thành mới có bài đăng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Dùng nút chính hoặc menu <code>⋯<\/code><\/td><td>Nút thay đổi theo trạng thái, xem bảng \"Nút theo trạng thái\" bên dưới. Nút bạn không có quyền sẽ không hiện<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>⋯<\/code> → <code>Xuất Excel<\/code><\/td><td>Tải tệp <code>&lt;mã&gt;_yyyymmdd.xlsx<\/code> của riêng yêu cầu này, gồm các sheet Tổng quan, Công đoạn, Phiên bản, Lịch sử. Mục này có ở mọi trạng thái<\/td><\/tr>\n<\/tbody><\/table>\n\n**Nút theo trạng thái**\n\n| Trạng thái | Nút chính | Trong menu `⋯` |\n| --- | --- | --- |\n| **Mới** | `Phân công` | `Sửa yêu cầu`, `Hủy yêu cầu`, `Xóa` (chỉ khi chưa từng phân công) |\n| **Đã giao** | `Bắt đầu sản xuất` | `Sửa yêu cầu`, `Đổi người thực hiện`, `Hủy yêu cầu` |\n| **Đang sản xuất** | `Nộp bản nháp`, nút phụ `Cập nhật công đoạn` | `Sửa yêu cầu`, `Đổi người thực hiện`, `Hủy yêu cầu`, `Mở nội dung` |\n| **Chờ duyệt** | `Yêu cầu sửa`, `Duyệt xuất bản` (người có quyền duyệt) | `Mở nội dung` |\n| **Hoàn thành** | `Lên lịch đăng` (khi trạng thái xuất bản là Chưa hẹn giờ) | `Mở nội dung` |\n| **Đã hủy** | - | `Khôi phục` |\n\n* `Bắt đầu sản xuất`, `Cập nhật công đoạn`, `Nộp bản nháp`: xem [Bài đang sản xuất](bai-dang-san-xuat.md)\n* `Duyệt xuất bản`, `Yêu cầu sửa`: hệ thống chuyển sang màn [Duyệt nội dung](duyet-noi-dung.md), mở đúng phiên bản đang chờ và hộp thao tác tương ứng. Không duyệt ngay tại màn này\n* `Lên lịch đăng`: mở [Lịch xuất bản](lich-xuat-ban.md) với nội dung chọn sẵn\n* `Mở nội dung`: mở nội dung liên kết ở Kho nội dung để soạn tiêu đề, chữ, tài nguyên\n\n### ⚠️ Lưu ý\n\n* Yêu cầu Chờ duyệt: nếu bạn là người bắt đầu sản xuất hoặc người nộp phiên bản, hai nút `Yêu cầu sửa`, `Duyệt xuất bản` hiện mờ kèm câu \"Bạn không thể duyệt nội dung do chính mình lập hoặc gửi duyệt.\" Người không có quyền duyệt chỉ thấy chú thích \"Đang chờ duyệt · hạn &lt;dd/mm/yyyy hh:mm&gt;\"\n* Yêu cầu Hoàn thành nhưng nội dung chưa thuộc dòng của một kế hoạch nội dung **Đã duyệt**: nút `Lên lịch đăng` được thay bằng chú thích \"Cần kế hoạch nội dung đã duyệt để lên lịch đăng\". Gắn nội dung vào kế hoạch ở màn [Kế hoạch nội dung](ke-hoach-noi-dung.md)\n* Người không có quyền xem chiến dịch, kế hoạch hay nội dung liên kết thấy liên kết khóa kèm chú giải \"Bạn không có quyền xem bản ghi này\"\n* Khi đổi sang yêu cầu khác, chi tiết luôn quay về tab `Tổng quan`\n\n### 2.2. Tab Phiên bản\n\n<figure><img src=\"images/yeu-cau-noi-dung-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nhãn tab** | \"Phiên bản (n)\", n là số lần đã nộp |\n| **Thẻ \"Lịch sử phiên bản\"** | Phiên bản mới nhất ở trên. Góc phải ghi \"Hạn duyệt theo cam kết (SLA): 480 phút làm việc\" |\n| **Mỗi phiên bản** | \"Phiên bản n\", chip kết quả: Chờ duyệt, Đã duyệt, Yêu cầu sửa, Trả lại nháp; nhãn \"Quá hạn duyệt\" nếu đang chờ đã qua hạn. Dòng \"&lt;người nộp&gt; nộp lúc … · hạn duyệt …\", kết quả kiểm tuân thủ (\"Đạt\" hoặc \"Đạt, có cảnh báo\") và nút `Xem bản nộp` |\n| **Khung nhận xét** | Người duyệt, thời điểm và nhận xét. Phiên bản bị trả lại nháp có thêm khung lý do trả lại |\n\nNhấn `Xem bản nộp` để xem lại đúng tiêu đề, nội dung chữ và tài nguyên của lần nộp đó (chỉ đọc). Chưa nộp lần nào: tab hiện \"Chưa nộp phiên bản nào.\"\n\n### 2.3. Tab Lịch sử\n\n<figure><img src=\"images/yeu-cau-noi-dung-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nBảng gồm **Thời điểm**, **Người thực hiện**, **Hành động**, mới nhất ở trên. Hệ thống ghi mọi mốc: tạo yêu cầu, sửa từng trường (\"&lt;Tên trường&gt;: &lt;giá trị cũ&gt; → &lt;giá trị mới&gt;\"), phân công, đổi người thực hiện, bắt đầu sản xuất, cập nhật công đoạn, kiểm tuân thủ vi phạm, nộp, duyệt, yêu cầu sửa (kèm nhận xét), trả lại nháp, hủy (kèm lý do), khôi phục. Các mốc của bài đăng (lên lịch, đã đăng, lỗi đăng) ghi với người thực hiện là \"Hệ thống\"\n\n## <mark style=\"color:green;\">3. Tạo yêu cầu nội dung<\/mark>\n\n<figure><img src=\"images/yeu-cau-noi-dung-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>+ Tạo yêu cầu<\/code><\/td><td>Mở hộp thoại \"Tạo yêu cầu nội dung\". Ô bắt buộc có dấu \"*\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Tên yêu cầu<\/strong> (bắt buộc)<\/td><td>Nhập tên, tối đa 255 ký tự. Bỏ trống: \"Nhập tên yêu cầu.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Định dạng<\/strong> (bắt buộc)<\/td><td>Chọn <strong>Bài viết<\/strong>, <strong>Ảnh<\/strong> hoặc <strong>Video<\/strong>. Mặc định Bài viết. Định dạng quyết định vai bắt buộc khi phân công và các công đoạn sản xuất<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><strong>Loại nội dung<\/strong><\/td><td>Chọn mục đích của nội dung (CTKM, Hướng dẫn bảo dưỡng máy khắc laser, Giới thiệu sản phẩm…). Không bắt buộc<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><strong>Chiến dịch<\/strong><\/td><td>Mặc định \"Không gắn chiến dịch\". Danh sách hiện \"&lt;mã&gt; · &lt;tên&gt;\", có ô tìm; chỉ gồm chiến dịch bạn được xem và không ở trạng thái Chờ duyệt nội dung, Chờ duyệt ngân sách, Từ chối, Đã kết thúc<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td><strong>Kênh đăng dự kiến<\/strong> (bắt buộc)<\/td><td>Chọn kênh (Facebook, Zalo OA, Website, TikTok…). Mặc định Facebook. Bỏ trống: \"Chọn kênh đăng dự kiến.\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td><strong>Hạn hoàn thành<\/strong> (bắt buộc)<\/td><td>Mặc định hôm nay. Phải từ hôm nay trở đi: \"Hạn hoàn thành phải từ hôm nay trở đi.\"<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td><strong>Giờ đăng dự kiến<\/strong><\/td><td>Không bắt buộc. Nếu nhập: phải sau thời điểm hiện tại (\"Giờ đăng dự kiến phải sau thời điểm hiện tại.\") và không trước hạn hoàn thành (\"Giờ đăng dự kiến không được trước hạn hoàn thành.\")<\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td><strong>Mô tả yêu cầu<\/strong><\/td><td>Ghi nội dung chính, thông điệp, ghi chú cho người thực hiện. Tối đa 5.000 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 10<\/strong><\/td><td><strong>Ảnh / tệp tham khảo<\/strong><\/td><td>Chọn ảnh, video hoặc PDF làm mẫu, kịch bản. Tối đa 10 tệp, mỗi tệp tối đa 20 MB. Mỗi tệp hiện ảnh thu nhỏ hoặc tên tệp, có nút bỏ<br>Lỗi: \"Tệp \"&lt;tên&gt;\" không phải ảnh, video hoặc PDF.\", \"Tệp \"&lt;tên&gt;\" nặng &lt;x&gt; MB, vượt mức tối đa 20 MB.\", \"Chỉ đính kèm tối đa 10 tệp tham khảo.\"<\/td><\/tr>\n<tr><td><strong>Bước 11<\/strong><\/td><td><strong>Đội thực hiện<\/strong><\/td><td>Chỉ Trưởng nhóm trở lên thấy và đổi ô này (bắt buộc với họ). Mặc định là đội của người yêu cầu. Người yêu cầu là bạn, không sửa được<\/td><\/tr>\n<tr><td><strong>Bước 12<\/strong><\/td><td>Nhấn <code>Tạo yêu cầu<\/code><\/td><td>Hệ thống kiểm tra; lỗi hiện ngay tại từng ô sai, dữ liệu đã nhập được giữ<br>Thành công: cấp mã <code>MKT-YC-nnnn<\/code>, yêu cầu ở trạng thái <strong>Mới<\/strong>, đóng hộp, chọn yêu cầu vừa tạo và báo \"Đã tạo yêu cầu &lt;mã&gt;.\"<br>Hệ thống giao việc \"Phân công yêu cầu nội dung &lt;mã&gt;\" cho Trưởng nhóm của đội thực hiện<br>Nhấn <code>Hủy<\/code> để đóng hộp, không lưu<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Mọi người trong phòng Marketing đều tạo được yêu cầu\n* Mã yêu cầu do hệ thống cấp, không sửa được và không dùng lại số của yêu cầu đã xóa\n* Tệp tham khảo chỉ là tài liệu đính kèm của yêu cầu, không đưa vào Kho ảnh video\n* Yêu cầu tạo ở màn này chưa thuộc kế hoạch nội dung nào. Muốn đưa vào kế hoạch, gắn yêu cầu vào dòng ở màn [Kế hoạch nội dung](ke-hoach-noi-dung.md)\n* **Tạo yêu cầu từ dòng kế hoạch:** ở màn [Kế hoạch nội dung](ke-hoach-noi-dung.md), nhấn `Tạo yêu cầu` ở dòng chưa có yêu cầu. Hệ thống tạo ngay yêu cầu Mới, không mở hộp thoại: tên là chủ đề dòng, định dạng, kênh, giờ đăng dự kiến, hạn hoàn thành, chiến dịch lấy từ dòng; đội thực hiện là đội của kế hoạch. Người phụ trách dòng chỉ được lưu là **người thực hiện đề xuất**, chưa phải người thực hiện; Trưởng nhóm vẫn phải bấm `Phân công`\n* Lỗi khi lưu: \"Chưa lưu được yêu cầu, vui lòng thử lại.\" Hộp thoại và dữ liệu đã nhập được giữ\n\n## <mark style=\"color:green;\">4. Sửa yêu cầu<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn yêu cầu, nhấn <code>⋯<\/code> → <code>Sửa yêu cầu<\/code><\/td><td>Mở hộp \"Sửa yêu cầu &lt;mã&gt;\" với các ô như khi tạo. Ô không sửa được hiện chỉ đọc kèm chú giải \"Không sửa được khi yêu cầu &lt;trạng thái&gt;\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Sửa các ô được phép<\/td><td>Yêu cầu <strong>Mới<\/strong>: sửa mọi ô<br>Yêu cầu <strong>Đã giao<\/strong>, <strong>Đang sản xuất<\/strong>: sửa Tên, Mô tả, Loại nội dung, Chiến dịch, Kênh đăng dự kiến, Giờ đăng dự kiến, Hạn hoàn thành, Tệp tham khảo. <strong>Định dạng<\/strong> bị khóa. Người thực hiện đổi bằng <code>Đổi người thực hiện<\/code> (mục 5)<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Lưu thay đổi<\/code><\/td><td>Thành công: \"Đã lưu thay đổi &lt;mã&gt;.\" Tab Lịch sử ghi từng trường đã đổi<br>Đổi Tên thì tiêu đề nội dung liên kết đổi theo. Đổi Chiến dịch khi đã có nội dung thì chiến dịch mới được gắn thêm vào nội dung; chiến dịch cũ vẫn gắn, gỡ ở màn chiến dịch hoặc Kho nội dung nếu cần<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được sửa:** yêu cầu Mới: người yêu cầu, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. Yêu cầu Đã giao, Đang sản xuất: chỉ Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. Người thực hiện không sửa thông tin yêu cầu; họ soạn nội dung ở [Bài đang sản xuất](bai-dang-san-xuat.md)\n* **Khi nào khóa sửa:** yêu cầu **Chờ duyệt** khóa mọi ô, để thứ đang duyệt đúng là thứ được duyệt; cần sửa thì người duyệt bấm `Yêu cầu sửa` trước. Yêu cầu **Hoàn thành**, **Đã hủy** chỉ đọc; giờ đăng thật quản lý ở [Lịch xuất bản](lich-xuat-ban.md)\n* **Yêu cầu thuộc dòng kế hoạch nội dung:** Kênh đăng dự kiến và Giờ đăng dự kiến chỉ đọc, hiện giá trị của dòng kèm \"Theo dòng kế hoạch &lt;mã&gt;\". Muốn đổi, sửa dòng ở màn [Kế hoạch nội dung](ke-hoach-noi-dung.md)\n* Chiến dịch đang gắn chuyển sang chờ duyệt: ô Chiến dịch khóa, đổi hoặc bỏ báo \"Chiến dịch &lt;mã&gt; đang chờ duyệt, chưa gắn hoặc gỡ nội dung được.\" Chiến dịch đã kết thúc: ô khóa kèm \"Chiến dịch &lt;mã&gt; đã kết thúc, không gắn thêm nội dung.\" Chiến dịch bị từ chối sau khi gắn: yêu cầu giữ liên kết, hiện thêm chip \"Chiến dịch bị từ chối\"\n* Yêu cầu đã trễ hạn: nếu không đổi ô Hạn hoàn thành, hệ thống không bắt hạn phải từ hôm nay trở đi\n* Người khác vừa đổi trạng thái yêu cầu: \"Yêu cầu &lt;mã&gt; đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\" Dữ liệu đang nhập được giữ\n\n## <mark style=\"color:green;\">5. Phân công người thực hiện<\/mark>\n\n<figure><img src=\"images/yeu-cau-noi-dung-6.png\" alt=\"\"><figcaption><p>Yêu cầu sau khi phân công: chuyển Đã giao, nút chính đổi thành Bắt đầu sản xuất<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp thoại \"Phân công yêu cầu &lt;mã&gt;\" (chế độ đổi người: \"Đổi người thực hiện &lt;mã&gt;\")\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thông tin yêu cầu** | \"&lt;mã&gt; · &lt;tên&gt; · &lt;định dạng&gt;\" và dòng nhắc vai bắt buộc: \"Bài viết cần Người viết.\", \"Ảnh cần Người thiết kế hoặc Người quay / dựng.\", \"Video cần Người quay / dựng.\" |\n| **Ba ô vai** | Người viết, Người thiết kế, Người quay / dựng. Mỗi ô chọn tối đa một người, có ô tìm và nút bỏ chọn |\n| **Đội thực hiện, Hạn hoàn thành, Ghi chú phân công** | Đội và hạn bắt buộc; ghi chú tối đa 1.000 ký tự |\n| **Nút** | `Phân công` (chế độ đổi người: `Lưu người thực hiện`), `Hủy` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn yêu cầu <strong>Mới<\/strong>, nhấn <code>Phân công<\/code><\/td><td>Mở hộp phân công với đội và hạn hiện có. Yêu cầu tạo từ kế hoạch nội dung có người thực hiện đề xuất thì người đó được điền sẵn vào vai đề xuất (Bài viết: Người viết; Ảnh: Người thiết kế; Video: Người quay / dựng); bạn sửa được<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Người viết<\/strong>, <strong>Người thiết kế<\/strong>, <strong>Người quay / dựng<\/strong><\/td><td>Danh sách gồm người dùng đang hoạt động của phòng Marketing; người thuộc đội thực hiện xếp trước, có nhãn đội. Một người nhận được nhiều vai<br>Chọn người ngoài đội: hệ thống cảnh báo \"&lt;tên&gt; không thuộc đội &lt;đội&gt;.\" nhưng vẫn cho lưu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Kiểm tra <strong>Đội thực hiện<\/strong> (bắt buộc)<\/td><td>Mặc định đội của yêu cầu. Trưởng nhóm chỉ chọn được đội mình làm trưởng hoặc là thành viên; Trưởng/Phó phòng, BGĐ chọn mọi đội<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Kiểm tra <strong>Hạn hoàn thành<\/strong> (bắt buộc)<\/td><td>Phải từ hôm nay trở đi. Hạn đã qua: \"Hạn hoàn thành đã qua, chọn hạn mới.\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhập <strong>Ghi chú phân công<\/strong><\/td><td>Không bắt buộc. Ghi chú gửi kèm việc nhắc của người được giao và ghi vào lịch sử<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Phân công<\/code><\/td><td>Lỗi thường gặp: \"Chọn ít nhất một người thực hiện.\", \"Bài viết cần chọn Người viết.\", \"Ảnh cần chọn Người thiết kế hoặc Người quay / dựng.\", \"Video cần chọn Người quay / dựng.\", \"Chọn đội thực hiện.\", \"&lt;tên&gt; không còn hoạt động, chọn người khác.\"<br>Thành công: yêu cầu chuyển <strong>Đã giao<\/strong>; hệ thống sinh các công đoạn sản xuất theo định dạng và vai đã chọn (trạng thái Chưa làm); mỗi người được giao nhận việc \"Thực hiện yêu cầu nội dung &lt;mã&gt;\" có hạn bằng hạn hoàn thành; báo \"Đã phân công &lt;mã&gt;.\" Nút chính đổi thành <code>Bắt đầu sản xuất<\/code><\/td><\/tr>\n<\/tbody><\/table>\n\n**Đổi người thực hiện** (yêu cầu Đã giao hoặc Đang sản xuất)\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>⋯<\/code> → <code>Đổi người thực hiện<\/code><\/td><td>Mở hộp \"Đổi người thực hiện &lt;mã&gt;\" với người hiện tại ở từng vai<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Thay, thêm hoặc bỏ người ở các vai<\/td><td><strong>Thay người<\/strong>: công đoạn chưa Xong của vai đó chuyển sang người mới; công đoạn đã Xong giữ người cũ<br><strong>Thêm vai<\/strong>: hệ thống sinh thêm công đoạn của vai đó ở trạng thái Chưa làm<br><strong>Bỏ vai<\/strong>: hệ thống xóa công đoạn Chưa làm của vai đó. Công đoạn đã bắt đầu thì bị chặn: \"Công đoạn &lt;tên công đoạn&gt; đã bắt đầu nên không bỏ được vai &lt;vai&gt;.\" Hãy chọn người thay thế thay vì bỏ trống<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Lưu người thực hiện<\/code><\/td><td>Trạng thái yêu cầu giữ nguyên. Người mới nhận việc nhắc, việc của người bị thay được đóng. Lịch sử ghi \"Đổi người thực hiện: &lt;vai&gt; &lt;cũ&gt; → &lt;mới&gt;\". Hệ thống báo \"Đã đổi người thực hiện &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chỉ Trưởng nhóm của đội thực hiện, Trưởng/Phó phòng, BGĐ** được phân công và đổi người. Chuyên viên không phân công, kể cả yêu cầu mình tạo. Yêu cầu chưa có đội hoặc đội không có Trưởng nhóm thì chỉ Trưởng/Phó phòng, BGĐ phân công\n* Không đổi người khi yêu cầu Chờ duyệt, Hoàn thành hoặc Đã hủy\n* Yêu cầu thuộc dòng kế hoạch nội dung: khi phân công hoặc đổi người, người phụ trách của dòng tự cập nhật bằng người thực hiện chính (người đầu tiên theo thứ tự Viết, Thiết kế, Quay / dựng)\n* Phân công lại yêu cầu đã khôi phục sau hủy: hệ thống không sinh lại công đoạn; công đoạn cũ giữ trạng thái và xử lý như khi đổi người\n\n## <mark style=\"color:green;\">6. Hủy, khôi phục, xóa yêu cầu<\/mark>\n\nBa thao tác nằm trong menu `⋯` của chi tiết yêu cầu, mỗi thao tác mở một hộp xác nhận có nút `Đóng` (mặc định) và nút chính\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Hủy - Bước 1<\/strong><\/td><td>Nhấn <code>⋯<\/code> → <code>Hủy yêu cầu<\/code><\/td><td>Có khi yêu cầu Mới, Đã giao hoặc Đang sản xuất. Hộp \"Hủy yêu cầu &lt;mã&gt;?\" ghi: \"Người thực hiện nhận thông báo kèm lý do. Nội dung nháp đi kèm (nếu có) được lưu trữ, khôi phục được.\"<\/td><\/tr>\n<tr><td><strong>Hủy - Bước 2<\/strong><\/td><td>Nhập <strong>Lý do hủy<\/strong> (bắt buộc)<\/td><td>Tối đa 1.000 ký tự. Bỏ trống: \"Nhập lý do hủy.\"<\/td><\/tr>\n<tr><td><strong>Hủy - Bước 3<\/strong><\/td><td>Nhấn <code>Hủy yêu cầu<\/code><\/td><td>Yêu cầu chuyển <strong>Đã hủy<\/strong>; các việc nhắc đang mở được đóng; nội dung nháp đi kèm được lưu trữ (ẩn khỏi Kho nội dung, không xóa); yêu cầu được gỡ khỏi dòng kế hoạch nội dung, dòng trở về \"Chưa có yêu cầu\"; người yêu cầu và người thực hiện nhận thông báo kèm lý do. Hệ thống báo \"Đã hủy yêu cầu &lt;mã&gt;.\"<\/td><\/tr>\n<tr><td><strong>Khôi phục<\/strong><\/td><td>Chọn yêu cầu Đã hủy, nhấn <code>⋯<\/code> → <code>Khôi phục<\/code> → <code>Khôi phục<\/code><\/td><td>Hộp xác nhận ghi: \"Yêu cầu về trạng thái Mới để phân công lại. Người thực hiện cũ, công đoạn và nội dung đã soạn được giữ; phân công lại không sinh lại công đoạn.\"<br>Yêu cầu về <strong>Mới<\/strong>, nội dung đi kèm được bỏ lưu trữ, khung \"Lý do hủy lần trước\" hiện ở Tổng quan. Hệ thống báo \"Đã khôi phục yêu cầu &lt;mã&gt;.\"<\/td><\/tr>\n<tr><td><strong>Xóa<\/strong><\/td><td>Chọn yêu cầu Mới chưa từng phân công, nhấn <code>⋯<\/code> → <code>Xóa<\/code> → <code>Xóa<\/code><\/td><td>Hộp xác nhận ghi: \"Yêu cầu và tệp tham khảo sẽ bị xóa, không khôi phục được.\"<br>Yêu cầu bị xóa hẳn; dòng kế hoạch nội dung gắn yêu cầu (nếu có) trở về \"Chưa có yêu cầu\". Danh sách chọn lại dòng đầu, hệ thống báo \"Đã xóa yêu cầu &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được làm:** Hủy: người yêu cầu (chỉ khi yêu cầu còn Mới), Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. Khôi phục và Xóa: chỉ Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ\n* **Không hủy được** yêu cầu Chờ duyệt (\"Yêu cầu đang chờ duyệt, không hủy được. Người duyệt cần Yêu cầu sửa trước.\") hoặc Hoàn thành (\"Yêu cầu đã hoàn thành, không hủy được.\")\n* **Chỉ xóa** yêu cầu Mới chưa từng phân công (không có người thực hiện, nội dung, phiên bản). Người thực hiện đề xuất từ kế hoạch không tính là đã phân công. Yêu cầu khác chỉ hủy được: \"Chỉ xóa được yêu cầu Mới chưa từng phân công. Hãy dùng Hủy yêu cầu.\"\n* Khôi phục **không** tự gắn lại yêu cầu vào dòng kế hoạch cũ; gắn lại ở màn [Kế hoạch nội dung](ke-hoach-noi-dung.md). Khi bắt đầu sản xuất lại, hệ thống dùng lại nội dung đã có, không tạo nội dung thứ hai\n* Yêu cầu Đã hủy không bao giờ bị tính trễ hạn\n* Lỗi khi thực hiện: \"Chưa thực hiện được, vui lòng thử lại.\" Hộp thoại và lý do đã nhập được giữ\n", "noi-dung-va-media/bai-dang-san-xuat.md": "# Bài đang sản xuất\n\n🧭 Tổng quan chức năng: Nơi người thực hiện (Người viết, Người thiết kế, Người quay / dựng) bắt đầu sản xuất, cập nhật tiến độ từng công đoạn, soạn nội dung và nộp bản nháp để duyệt. Trưởng nhóm và Trưởng/Phó phòng dùng màn này để theo dõi bài nào đang làm tới đâu, bài nào trễ hạn\n\nTruy cập: menu **Nội dung & media → Sản xuất nội dung → Yêu cầu nội dung**, chọn bộ lọc nhanh `Đang sản xuất`. Bấm việc nhắc \"Thực hiện yêu cầu nội dung &lt;mã&gt;\" hoặc \"Sửa nội dung theo yêu cầu\" cũng mở thẳng bài cần làm\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH SẢN XUẤT MỘT BÀI\n\nBước 1: Trưởng nhóm phân công ở màn [Yêu cầu nội dung](yeu-cau-noi-dung.md). Yêu cầu ở trạng thái **Đã giao**, các công đoạn ở trạng thái **Chưa làm**\n\nBước 2: Người thực hiện bấm `Bắt đầu sản xuất`. Hệ thống tạo bản nội dung trong Kho nội dung, công đoạn đầu tiên chuyển **Đang làm**, yêu cầu chuyển **Đang sản xuất**\n\nBước 3: Mỗi người soạn phần việc của mình (tiêu đề, chữ, ảnh, video) và cập nhật công đoạn: Chưa làm → Đang làm → Xong\n\nBước 4: Khi xong, bấm `Nộp bản nháp`. Hệ thống kiểm tuân thủ; đạt thì tạo **phiên bản** mới, yêu cầu chuyển **Chờ duyệt** và vào hàng đợi [Duyệt nội dung](duyet-noi-dung.md)\n\nBước 5: Người duyệt `Duyệt xuất bản` (yêu cầu **Hoàn thành**, chuyển sang [Lịch xuất bản](lich-xuat-ban.md)) hoặc `Yêu cầu sửa` (yêu cầu quay lại **Đang sản xuất**, mọi công đoạn mở lại). Người thực hiện sửa rồi nộp phiên bản tiếp theo\n\n**Công đoạn sinh theo định dạng** (mỗi vai đã phân công sinh một công đoạn; vai trống không sinh):\n\n| Định dạng | Thứ tự công đoạn |\n| --- | --- |\n| **Bài viết** | Viết (Người viết) → Quay chụp (Người quay / dựng) → Thiết kế (Người thiết kế) |\n| **Ảnh** | Quay chụp (Người quay / dựng) → Thiết kế (Người thiết kế) → Viết nội dung đi kèm (Người viết) |\n| **Video** | Viết kịch bản (Người viết) → Quay / dựng (Người quay / dựng) → Thiết kế (Người thiết kế) |\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách bài đang sản xuất<\/mark>\n\n<figure><img src=\"images/bai-dang-san-xuat-1.png\" alt=\"\"><figcaption><p>Danh sách Yêu cầu nội dung với bộ lọc Đang sản xuất<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bộ lọc nhanh `Đang sản xuất`** | Gồm các yêu cầu **Đã giao** và **Đang sản xuất** bạn được xem. Yêu cầu Chờ duyệt không nằm ở đây (xem bộ lọc `Chờ duyệt` hoặc màn [Duyệt nội dung](duyet-noi-dung.md)) |\n| **Dòng đếm** | \"&lt;N&gt; bài đang sản xuất · &lt;T&gt; trễ hạn\" (không hiện phần trễ hạn khi T = 0) |\n| **Dòng bài** | Tên, chip Đã giao hoặc Đang sản xuất; mã, định dạng, kênh; \"Hạn dd/mm/yyyy\", người thực hiện. Thêm nhãn công đoạn hiện tại và tiến độ, ví dụ \"Đang Quay / dựng · 1/2\", \"Chưa bắt đầu · 0/2\", \"Chờ nộp bản nháp · 2/2\". Chip **Cần sửa** khi bài vừa bị yêu cầu sửa hoặc trả lại nháp |\n| **Ô tìm, `Bộ lọc`, `Xuất Excel`, `+ Tạo yêu cầu`** | Dùng như danh sách [Yêu cầu nội dung](yeu-cau-noi-dung.md) |\n| **Cột phải** | Chi tiết bài đang chọn (mục 2) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở <strong>Nội dung &amp; media → Sản xuất nội dung → Yêu cầu nội dung<\/strong>, chọn <code>Đang sản xuất<\/code><\/td><td>Danh sách sắp xếp: bài trễ hạn lên đầu, sau đó theo hạn hoàn thành gần nhất; tự chọn dòng đầu<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Bộ lọc<\/code> → chọn <strong>Của tôi<\/strong><\/td><td>Chỉ còn các bài bạn là người yêu cầu hoặc người thực hiện. Người thực hiện nên bật điều kiện này để xem đúng việc của mình<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc nhãn công đoạn trên từng dòng<\/td><td><strong>Chưa bắt đầu<\/strong>: bài Đã giao, chưa ai bấm <code>Bắt đầu sản xuất<\/code><br><strong>Đang &lt;tên công đoạn&gt;<\/strong>: công đoạn đang làm đầu tiên theo thứ tự<br><strong>Chờ nộp bản nháp<\/strong>: mọi công đoạn đã xong, chờ nộp<br>Số \"x/y\" là số công đoạn đã xong trên tổng số<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn vào một bài<\/td><td>Cột phải hiện chi tiết bài kèm khối <strong>Công đoạn sản xuất<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Tải tệp <code>BaiDangSanXuat_yyyymmdd.xlsx<\/code> gồm các bài đang hiện, có thêm cột Công đoạn hiện tại và Tiến độ. Danh sách rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Không có bài nào: \"Không có bài nào đang sản xuất.\" Có điều kiện lọc mà không khớp: \"Không có yêu cầu nào khớp điều kiện.\"\n* Sau khi bạn nộp bản nháp, bài chuyển Chờ duyệt nên rời khỏi bộ lọc này; chi tiết vẫn giữ, dòng hiện mờ kèm \"Không nằm trong bộ lọc hiện tại\" cho tới khi bạn đổi bộ lọc hoặc chọn bài khác\n* Phạm vi xem như màn Yêu cầu nội dung: Chuyên viên thấy bài mình yêu cầu hoặc thực hiện; Trưởng nhóm thấy bài của đội; Trưởng/Phó phòng, BGĐ thấy tất cả\n\n## <mark style=\"color:green;\">2. Chi tiết bài đang sản xuất<\/mark>\n\n<figure><img src=\"images/bai-dang-san-xuat-2.png\" alt=\"\"><figcaption><p>Bài Đã giao, hai công đoạn Chưa làm, nút Bắt đầu sản xuất<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nút chính** | `Bắt đầu sản xuất` (bài Đã giao) hoặc `Nộp bản nháp` (bài Đang sản xuất), kèm nút phụ `Cập nhật công đoạn` |\n| **Menu `⋯`** | `Mở nội dung` (mở bản nội dung ở Kho nội dung để soạn), cùng các mục `Sửa yêu cầu`, `Đổi người thực hiện`, `Hủy yêu cầu` cho người có quyền (xem [Yêu cầu nội dung](yeu-cau-noi-dung.md)) |\n| **Thẻ \"Thông tin yêu cầu\"** | Như tab Tổng quan của Yêu cầu nội dung |\n| **Khối \"Công đoạn sản xuất\"** | Tiêu đề kèm \"&lt;x&gt;/&lt;y&gt; công đoạn xong\". Mỗi dòng: biểu tượng trạng thái (Xong có dấu tích), tên công đoạn, trạng thái, người làm, ngày bắt đầu, ngày xong, ghi chú. Người có quyền bấm vào dòng để cập nhật |\n| **Khung \"Mọi công đoạn đã xong\"** | \"Mọi công đoạn đã xong. Bấm Nộp bản nháp để gửi duyệt.\" |\n| **Khung \"Phiên bản n cần sửa\"** | Nhận xét của người duyệt (xem mục 6) |\n| **Khung \"Vi phạm quy tắc tuân thủ - chưa gửi duyệt\"** | Lần nộp gần nhất bị chặn; kèm danh sách quy tắc bị khớp. Khung mất khi bạn sửa tiêu đề hoặc chữ |\n| **Khung \"Trễ hạn hoàn thành\", khung tài nguyên hết hạn** | \"Hạn &lt;dd/mm/yyyy&gt; đã qua mà yêu cầu chưa hoàn thành.\"; \"Nội dung dùng tài nguyên đã hết hạn quyền sử dụng: &lt;mã&gt;.\" |\n\n### ⚠️ Lưu ý\n\n* **Ai thao tác sản xuất:** người thực hiện của yêu cầu, Trưởng nhóm của đội thực hiện, Trưởng/Phó phòng, BGĐ. Người yêu cầu không phải người thực hiện chỉ xem. Nút bạn không có quyền sẽ không hiện\n* Tab `Phiên bản`, `Lịch sử` và các thao tác sửa, phân công, hủy dùng như màn [Yêu cầu nội dung](yeu-cau-noi-dung.md)\n\n## <mark style=\"color:green;\">3. Bắt đầu sản xuất<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn bài <strong>Đã giao<\/strong>, nhấn <code>Bắt đầu sản xuất<\/code><\/td><td>Không có hộp xác nhận; hệ thống thực hiện ngay<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Hệ thống xử lý<\/td><td>Tạo bản nội dung ở trạng thái Nháp trong Kho nội dung, chép tên, loại nội dung, kênh, giờ đăng dự kiến, đội; gắn chiến dịch của yêu cầu vào nội dung<br>Công đoạn đầu tiên chưa xong chuyển <strong>Đang làm<\/strong> và ghi ngày bắt đầu<br>Yêu cầu chuyển <strong>Đang sản xuất<\/strong>. Hệ thống báo \"Đã chuyển &lt;mã&gt; sang Đang sản xuất.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>⋯<\/code> → <code>Mở nội dung<\/code> (nếu cần)<\/td><td>Mở bản nội dung ở Kho nội dung để soạn tiêu đề, chữ, tài nguyên. Bạn cũng có thể soạn ngay trong hộp <code>Nộp bản nháp<\/code> (mục 5)<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Yêu cầu thuộc dòng kế hoạch nội dung: kênh và ngày dự kiến đăng của nội dung lấy theo dòng kế hoạch; nội dung được tự ghi vào ô Nội dung của dòng\n* Chiến dịch của yêu cầu đang chờ duyệt: hệ thống tự gắn vào nội dung khi chiến dịch được duyệt xong\n* Yêu cầu đã khôi phục sau hủy: hệ thống dùng lại bản nội dung cũ và các công đoạn cũ, không tạo mới\n* Ở Kho nội dung, nội dung thuộc yêu cầu chỉ để soạn: không có nút Gửi duyệt, Duyệt, Yêu cầu sửa, Trả lại nháp. Nộp và duyệt làm ở màn này và màn [Duyệt nội dung](duyet-noi-dung.md)\n* Lỗi: \"Chưa bắt đầu được sản xuất, vui lòng thử lại.\" Trạng thái yêu cầu không đổi\n\n## <mark style=\"color:green;\">4. Cập nhật công đoạn<\/mark>\n\n<figure><img src=\"images/bai-dang-san-xuat-3.png\" alt=\"\"><figcaption><p>Khối Công đoạn sản xuất của bài video: Viết kịch bản Xong, Dựng / quay Đang làm<\/p><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Cập nhật công đoạn<\/code> hoặc nhấn vào một dòng công đoạn<\/td><td>Mở hộp \"Cập nhật công đoạn &lt;mã&gt;\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Công đoạn<\/strong> (bắt buộc)<\/td><td>Mặc định là công đoạn vừa bấm hoặc công đoạn hiện tại của bạn. Người thực hiện chỉ thấy công đoạn mình làm; Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ thấy mọi công đoạn<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Người làm<\/strong><\/td><td>Chỉ xem. Muốn đổi người, dùng <code>⋯<\/code> → <code>Đổi người thực hiện<\/code> ở màn <a href=\"yeu-cau-noi-dung.md\">Yêu cầu nội dung<\/a><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><strong>Trạng thái<\/strong> (bắt buộc)<\/td><td>Chọn <code>Chưa làm<\/code>, <code>Đang làm<\/code> hoặc <code>Xong<\/code>. Lần đầu sang Đang làm thì ghi ngày bắt đầu; sang Xong thì ghi ngày xong; đưa công đoạn Xong về Đang làm thì xóa ngày xong<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><strong>Ghi chú<\/strong><\/td><td>Không bắt buộc, tối đa 1.000 ký tự. Ví dụ \"Đã quay xong 3 cảnh, còn cảnh cắt thép\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Lưu<\/code><\/td><td>Hệ thống báo \"Đã cập nhật công đoạn &lt;tên&gt;.\", cập nhật tiến độ và nhãn công đoạn hiện tại; lịch sử ghi \"Công đoạn &lt;tên&gt;: &lt;cũ&gt; → &lt;mới&gt;\"<br>Mọi công đoạn Xong: nhãn đổi thành \"Chờ nộp bản nháp\" và hiện khung \"Mọi công đoạn đã xong. Bấm Nộp bản nháp để gửi duyệt.\" Trạng thái yêu cầu chưa đổi cho tới khi nộp<br>Nhấn <code>Hủy<\/code> để đóng, không lưu<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ cập nhật công đoạn khi yêu cầu **Đang sản xuất**: \"Chỉ cập nhật công đoạn khi yêu cầu đang sản xuất.\"\n* **Ai cập nhật:** người làm công đoạn đó, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. Người khác bị chặn: \"Bạn không phụ trách công đoạn này.\"\n* Công đoạn không bắt buộc làm theo thứ tự; công đoạn sau có thể bắt đầu trước khi công đoạn trước xong\n\n## <mark style=\"color:green;\">5. Soạn nội dung và nộp bản nháp<\/mark>\n\n<figure><img src=\"images/bai-dang-san-xuat-4.png\" alt=\"\"><figcaption><p>Sau khi nộp: phiên bản 1 ở trạng thái Chờ duyệt kèm hạn duyệt<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp \"Nộp bản nháp &lt;mã&gt; · phiên bản &lt;n&gt;\"\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề, Nội dung chữ** | Lấy sẵn từ bản nội dung đang soạn |\n| **Tài nguyên** | Ảnh, video đã gắn (ảnh thu nhỏ, tên, loại, nút bỏ); nút `Chọn từ Kho tài nguyên` và `Tải tệp mới` |\n| **Định dạng nội dung** | Hệ thống tự nhận biết: Chỉ chữ, Một ảnh, Nhiều ảnh, Video. Hiện cạnh định dạng yêu cầu, ví dụ \"Định dạng yêu cầu: Video · Nội dung hiện là: Một ảnh\", cảnh báo khi không khớp |\n| **Xem trước Facebook** | Khung bài kiểu Facebook để xem trước |\n| **Khung kết quả kiểm tuân thủ** | Chưa kiểm, \"Đạt kiểm tra tuân thủ\", \"Đạt, nhưng có cảnh báo\", \"Vi phạm quy tắc tuân thủ - chưa gửi duyệt\" |\n| **Công đoạn chưa xong** | Liệt kê công đoạn chưa Xong (nếu có) |\n| **Hạn duyệt dự kiến** | \"Nộp bây giờ thì hạn duyệt là &lt;dd/mm/yyyy hh:mm&gt; (480 phút làm việc).\" |\n| **Mục Chiến dịch** | Các chiến dịch đang gắn với nội dung, nút `Gắn chiến dịch`, biểu tượng gỡ |\n| **Nút** | `Kiểm tra tuân thủ`, `Lưu nháp`, `Nộp bản nháp`, `Hủy` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn bài <strong>Đang sản xuất<\/strong>, nhấn <code>Nộp bản nháp<\/code><\/td><td>Mở hộp nộp với dữ liệu hiện có của bản nội dung. Nút chỉ có khi bài chưa có phiên bản đang chờ duyệt<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Tiêu đề<\/strong> (bắt buộc)<\/td><td>Tối đa 255 ký tự. Bỏ trống: \"Nhập tiêu đề nội dung.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Nội dung chữ<\/strong><\/td><td>Bắt buộc với Bài viết. Tối đa 63.206 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><strong>Tài nguyên<\/strong>: nhấn <code>Chọn từ Kho tài nguyên<\/code><\/td><td>Danh sách chỉ gồm ảnh, video <strong>Đang sử dụng<\/strong> trong phạm vi bạn được xem. Chọn tài nguyên có nhãn \"Hạn chế\" thì hệ thống hỏi: \"Tài nguyên &lt;mã&gt; có quyền sử dụng hạn chế: &lt;điều kiện&gt;. Xác nhận đã được phép dùng cho nội dung này?\" Nhấn <code>Đã được phép, gắn tài nguyên<\/code> hoặc <code>Không gắn<\/code><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><strong>Tài nguyên<\/strong>: nhấn <code>Tải tệp mới<\/code><\/td><td>Chỉ nhận ảnh, video, tối đa 20 MB mỗi tệp; tệp được đưa vào Kho tài nguyên rồi gắn vào bài. Tệp đã có trong kho: cảnh báo \"Tệp đã có trong kho: &lt;tên&gt;\", bạn chọn dùng tệp có sẵn hoặc vẫn tải<br>Lỗi: \"Tệp \"&lt;tên&gt;\" nặng &lt;x&gt; MB, vượt mức tối đa 20 MB.\", \"Tệp \"&lt;tên&gt;\" không phải ảnh hoặc video (nhận ra là &lt;kiểu tệp&gt;).\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Kiểm tra tuân thủ<\/code> (nên làm)<\/td><td>Hệ thống lưu nội dung đang soạn và so tiêu đề, chữ với các quy tắc tuân thủ đang bật; kết quả hiện ở khung kiểm tuân thủ. Không đổi trạng thái bài<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Lưu nháp<\/code> (nếu chưa muốn nộp)<\/td><td>Lưu tiêu đề, chữ, tài nguyên vào bản nội dung, không nộp: \"Đã lưu nháp &lt;mã nội dung&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Nhấn <code>Nộp bản nháp<\/code><\/td><td>Còn công đoạn chưa xong: hệ thống hỏi \"Còn &lt;n&gt; công đoạn chưa xong: &lt;danh sách&gt;. Đánh dấu xong và nộp?\". Nhấn <code>Quay lại<\/code> để tiếp tục soạn, hoặc <code>Đánh dấu xong và nộp<\/code><\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td>Hệ thống kiểm tuân thủ và tạo phiên bản<\/td><td><strong>Vi phạm mức Chặn<\/strong>: không nộp; khung \"Vi phạm quy tắc tuân thủ - chưa gửi duyệt\" liệt kê quy tắc bị khớp. Sửa nội dung rồi nộp lại<br><strong>Đạt<\/strong> (kể cả có cảnh báo): tạo phiên bản số kế tiếp, lưu bản chụp tiêu đề, chữ, tài nguyên; yêu cầu chuyển <strong>Chờ duyệt<\/strong>; người duyệt nhận việc \"Duyệt nội dung marketing\". Chi tiết chuyển sang tab <code>Phiên bản<\/code>, hệ thống báo \"Đã nộp phiên bản &lt;n&gt;. Hạn duyệt &lt;dd/mm/yyyy hh:mm&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Điều kiện nộp:** có tiêu đề; có nội dung chữ hoặc ít nhất một tài nguyên (\"Nhập nội dung chữ hoặc gắn ít nhất một tài nguyên.\"); Bài viết cần có chữ (\"Bài viết cần có nội dung chữ.\"); Ảnh cần ít nhất một ảnh (\"Ảnh cần có ít nhất một ảnh.\"); Video cần ít nhất một video (\"Video cần có ít nhất một video.\")\n* **Tài nguyên hết hạn quyền sử dụng** có chip \"Hết hạn quyền sử dụng\" và chặn nộp: \"Nội dung dùng tài nguyên đã hết hạn quyền sử dụng: &lt;mã&gt;. Bỏ tài nguyên trước khi nộp.\"\n* **Hạn duyệt** là 480 phút làm việc tính từ lúc nộp (giờ làm 08:00–18:00, làm thứ Bảy, nghỉ Chủ nhật). Ví dụ nộp 17:10 thứ Sáu thì hạn duyệt 15:10 thứ Bảy\n* Kiểm tuân thủ chỉ đọc tiêu đề và chữ, không đọc ảnh, video. Quy tắc mức Cảnh báo chỉ liệt kê, vẫn cho nộp. Sửa tiêu đề hoặc chữ thì kết quả cũ về \"Chưa kiểm\"\n* Phiên bản đã nộp không sửa, không xóa, không rút lại được. Khi bài Chờ duyệt, nội dung bị khóa tiêu đề, chữ, tệp\n* Không tự duyệt: người bấm `Bắt đầu sản xuất` và người nộp phiên bản không được duyệt phiên bản đó, kể cả Trưởng/Phó phòng, BGĐ. Không còn ai khác có quyền duyệt thì phiên bản giữ Chờ duyệt và người nộp thấy \"Chưa có người khác có quyền duyệt nội dung này.\"\n* `Hủy` khi có thay đổi chưa lưu: hệ thống hỏi \"Bỏ các thay đổi chưa lưu?\" (`Tiếp tục soạn` / `Bỏ thay đổi`)\n* Lỗi khi nộp: \"Chưa nộp được bản nháp, vui lòng thử lại.\" Không tạo phiên bản dở, dữ liệu đang soạn được giữ\n\n## <mark style=\"color:green;\">6. Nhận yêu cầu sửa và nộp lại<\/mark>\n\n<figure><img src=\"images/bai-dang-san-xuat-5.png\" alt=\"\"><figcaption><p>Bài bị yêu cầu sửa: quay lại Đang sản xuất, phiên bản 1 có nhận xét của người duyệt<\/p><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở việc nhắc \"Sửa nội dung theo yêu cầu\" hoặc dòng có chip <strong>Cần sửa<\/strong><\/td><td>Việc nhắc giao cho người nộp phiên bản và người làm các công đoạn được mở lại, nội dung việc là nhận xét của người duyệt<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc khung <strong>\"Phiên bản n cần sửa\"<\/strong> ở tab <code>Tổng quan<\/code><\/td><td>Khung ghi người duyệt, thời điểm và nhận xét. Nếu bài đã duyệt bị trả lại, tiêu đề khung là \"Nội dung đã duyệt bị trả lại nháp\" kèm người trả lại, thời điểm và lý do<br>Tab <code>Phiên bản<\/code> hiện phiên bản có chip \"Yêu cầu sửa\" (hoặc \"Trả lại nháp\") cùng nhận xét; các phiên bản cũ giữ nguyên<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Cập nhật công đoạn<\/td><td>Khi bị yêu cầu sửa, mọi công đoạn về <strong>Đang làm<\/strong>. Người không cần sửa phần của mình thì đánh dấu Xong lại (mục 4)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Sửa nội dung, nhấn <code>Nộp bản nháp<\/code><\/td><td>Làm như mục 5. Hệ thống tạo phiên bản kế tiếp (n+1) với hạn duyệt mới tính từ lúc nộp lại; khung \"cần sửa\" mất; việc \"Sửa nội dung theo yêu cầu\" được đóng<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Một bài có thể qua nhiều vòng sửa; tab `Phiên bản` giữ đủ các phiên bản và nhận xét, mới nhất ở trên\n* Người nộp phiên bản đã nghỉ: việc sửa được giao cho Trưởng nhóm của đội thực hiện\n* Thao tác `Yêu cầu sửa` và `Trả lại nháp` do người duyệt làm ở màn [Duyệt nội dung](duyet-noi-dung.md)\n", "noi-dung-va-media/duyet-noi-dung.md": "# Duyệt nội dung\n\n🧭 Tổng quan chức năng: Hàng đợi các phiên bản nội dung đã nộp, nơi người duyệt đọc đúng bản nộp rồi `Duyệt xuất bản`, `Yêu cầu sửa` hoặc `Trả lại nháp`. Người duyệt là Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ; mọi người trong phòng Marketing mở được màn này để theo dõi phiên bản của mình\n\nTruy cập: menu **Nội dung & media → Sản xuất nội dung → Duyệt nội dung**. Bấm việc nhắc \"Duyệt nội dung marketing\", nút `Duyệt xuất bản` / `Yêu cầu sửa` ở chi tiết [Yêu cầu nội dung](yeu-cau-noi-dung.md), hoặc dòng \"Nội dung chờ duyệt quá hạn\" ở [Cảnh báo cần xử lý](../bang-dieu-khien/canh-bao-can-xu-ly.md) cũng mở đúng phiên bản tại màn này\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH DUYỆT NỘI DUNG\n\nBước 1: Người thực hiện nộp bản nháp ở [Bài đang sản xuất](bai-dang-san-xuat.md) (hoặc bấm Gửi duyệt một nội dung tạo thẳng ở Kho nội dung). Hệ thống tạo một **phiên bản** ở kết quả **Chờ duyệt**, hạn duyệt 480 phút làm việc, và giao việc \"Duyệt nội dung marketing\" cho người duyệt\n\nBước 2: Người duyệt mở phiên bản, đọc bản nộp (tiêu đề, chữ, ảnh, video, kết quả kiểm tuân thủ)\n\nBước 3: Người duyệt chọn một trong hai:\n\n* `Duyệt xuất bản` → phiên bản **Đã duyệt**, yêu cầu **Hoàn thành**. Nội dung sẵn sàng lên lịch ở [Lịch xuất bản](lich-xuat-ban.md) nếu đã thuộc một kế hoạch nội dung đã duyệt\n* `Yêu cầu sửa` (bắt buộc nhận xét) → phiên bản **Yêu cầu sửa**, yêu cầu quay về **Đang sản xuất**. Người thực hiện sửa và nộp phiên bản tiếp theo, quay lại Bước 1\n\nBước 4 (khi cần): Nội dung đã duyệt nhưng chưa lên lịch đăng mà cần làm lại → `Trả lại nháp` (bắt buộc lý do) → phiên bản **Trả lại nháp**, yêu cầu từ Hoàn thành về **Đang sản xuất**\n\n**Kết quả của phiên bản:** Chờ duyệt, Đã duyệt, Yêu cầu sửa, Trả lại nháp\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Hàng đợi duyệt nội dung<\/mark>\n\n<figure><img src=\"images/duyet-noi-dung-1.png\" alt=\"\"><figcaption><p>Bộ lọc Chờ duyệt, phiên bản quá hạn duyệt đang được chọn<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề \"Duyệt nội dung\" và dòng đếm \"&lt;N&gt; phiên bản · &lt;M&gt; chờ duyệt · &lt;Q&gt; quá hạn duyệt\" (phần bằng 0 không hiện) |\n| **Bộ lọc nhanh** | `Chờ duyệt` (mặc định) và `Tất cả phiên bản` (mọi phiên bản, kể cả phiên bản cũ) |\n| **Ô tìm** | \"Tìm theo mã, tiêu đề…\": tìm theo mã yêu cầu, mã nội dung hoặc tiêu đề bản nộp |\n| **Nút `Bộ lọc`** | Kết quả, Quá hạn duyệt, Tôi duyệt được, Nguồn (Thuộc yêu cầu / Ngoài yêu cầu), Định dạng, Kênh, Chiến dịch, Đội, Người nộp, khoảng ngày nộp |\n| **Nút `Xuất Excel`** | Xuất danh sách đang lọc |\n| **Cột trái: danh sách** | Mỗi dòng là **một phiên bản**: tiêu đề, chip kết quả; mã, \"phiên bản n\", \"· đã sửa k lần\", định dạng; hạn duyệt hoặc chip \"Quá hạn duyệt\", người nộp |\n| **Cột phải: chi tiết** | Chi tiết phiên bản đang chọn (mục 2) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Nội dung &amp; media → Sản xuất nội dung → Duyệt nội dung<\/strong><\/td><td>Màn luôn mở ở bộ lọc <code>Chờ duyệt<\/code>. Phiên bản chờ duyệt xếp trước, hạn duyệt sớm nhất (quá hạn lâu nhất) ở trên; phiên bản đã có kết quả xếp sau, mới duyệt nhất ở trên. Dòng đầu được chọn sẵn<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Bộ lọc<\/code> → <strong>Tôi duyệt được<\/strong><\/td><td>Chỉ còn các phiên bản chờ duyệt mà bạn có quyền duyệt và không phải do bạn lập hoặc nộp. Nên dùng điều kiện này để làm việc hằng ngày<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc thông tin trên từng dòng<\/td><td><strong>Mã<\/strong>: phiên bản của yêu cầu hiện mã yêu cầu <code>MKT-YC-nnnn<\/code>; nội dung tạo thẳng ở Kho nội dung hiện mã nội dung kèm chip <strong>Ngoài yêu cầu<\/strong><br><strong>\"· đã sửa k lần\"<\/strong>: phiên bản này là lần nộp thứ k+1<br>Chip <strong>Quá hạn duyệt<\/strong>: đã qua hạn mà chưa duyệt. Chip <strong>Tài nguyên hết hạn<\/strong>: nội dung dùng ảnh, video đã hết hạn quyền sử dụng<br>Dòng đã có kết quả ghi \"&lt;kết quả&gt; lúc &lt;dd/mm/yyyy hh:mm&gt;\" thay cho hạn<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn vào một dòng<\/td><td>Cột phải hiện chi tiết phiên bản. Bộ lọc và ô tìm giữ nguyên<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Tải tệp <code>DuyetNoiDung_yyyymmdd.xlsx<\/code>, mỗi phiên bản một dòng: mã yêu cầu, mã nội dung, tiêu đề, nguồn, phiên bản, số lần sửa, định dạng, kênh, chiến dịch, đội, người nộp, thời điểm nộp, hạn duyệt, quá hạn (Có/Không), kết quả, người duyệt, thời điểm duyệt, nhận xét, tuân thủ lúc nộp. Danh sách rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy phiên bản nào:** phiên bản của yêu cầu theo quyền xem yêu cầu (Chuyên viên: yêu cầu mình tạo hoặc thực hiện; Trưởng nhóm: của đội; Trưởng/Phó phòng, BGĐ: tất cả). Phiên bản ngoài yêu cầu theo quyền xem Kho nội dung. Người nộp luôn thấy phiên bản mình nộp. Chuyên viên chỉ xem, không duyệt\n* Màn không có nút tạo mới: phiên bản chỉ sinh ra khi nộp bản nháp hoặc gửi duyệt\n* Hàng đợi trống: \"Không còn phiên bản nào chờ duyệt.\" Có điều kiện lọc mà không khớp: \"Không có phiên bản nào khớp điều kiện.\"\n* Sau khi bạn duyệt hoặc yêu cầu sửa, phiên bản rời bộ lọc `Chờ duyệt`; chi tiết vẫn giữ, dòng hiện mờ kèm \"Không nằm trong bộ lọc hiện tại\" cho tới khi bạn đổi bộ lọc hoặc chọn dòng khác\n* Danh sách tải 50 dòng mỗi lần, cuộn tới cuối để tải tiếp\n\n## <mark style=\"color:green;\">2. Xem chi tiết phiên bản<\/mark>\n\n<figure><img src=\"images/duyet-noi-dung-2.png\" alt=\"\"><figcaption><p>Trưởng nhóm mở phiên bản do chính mình nộp: không duyệt được<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tiêu đề bản nộp, dòng \"&lt;mã&gt; · phiên bản &lt;n&gt; · &lt;định dạng&gt;\"; nút `Yêu cầu sửa`, `Duyệt xuất bản` (phiên bản chờ duyệt) hoặc `Trả lại nháp`, `Lên lịch đăng` (phiên bản đã duyệt) |\n| **Khung quyền duyệt** | Cho biết vì sao bạn không duyệt được (xem Lưu ý) |\n| **Khung \"Quá hạn duyệt\"** | \"Hạn duyệt &lt;dd/mm/yyyy hh:mm&gt; đã qua &lt;x&gt; giờ &lt;y&gt; phút.\" |\n| **Khung tài nguyên hết hạn** | \"Nội dung dùng tài nguyên đã hết hạn quyền sử dụng: &lt;mã&gt;.\" Khi có khung này, không duyệt xuất bản được |\n| **Khung \"Phiên bản cũ\"** | \"Phiên bản cũ, chỉ xem. Phiên bản hiện tại: &lt;n&gt;.\" kèm liên kết mở phiên bản mới nhất |\n| **Thẻ \"Phiên bản gửi duyệt\"** | Người gửi, Gửi lúc, Hạn duyệt (SLA), Kênh đăng, Kết quả, Tuân thủ lúc nộp (\"Đạt\" hoặc \"Đạt, có cảnh báo · k quy tắc\"), Nhận xét kèm người và thời điểm |\n| **Thẻ \"Bản nộp\"** | Tiêu đề, nội dung chữ, lưới ảnh/video với chip \"Hạn chế\", \"Hết hạn quyền sử dụng\", \"Lưu trữ\"; danh sách quy tắc cảnh báo tuân thủ; khung \"Xem trước Facebook\". Nhấn vào ảnh, video để xem cỡ lớn |\n| **Thẻ \"Thông tin nội dung\"** | Mã yêu cầu, mã nội dung, định dạng, loại nội dung, chiến dịch, kế hoạch nội dung, kênh, giờ đăng dự kiến, hạn hoàn thành, người yêu cầu, người thực hiện, đội, trạng thái xuất bản. Mã và tên là liên kết mở màn tương ứng |\n| **Thẻ \"Lịch sử phiên bản\"** | Mọi phiên bản của nội dung, mới nhất ở trên, kèm kết quả, người nộp, giờ nộp, hạn, nhận xét; phiên bản bị trả lại nháp có thêm lý do trả lại |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Đọc các khung cảnh báo ở đầu<\/td><td>Quá hạn duyệt, tài nguyên hết hạn, phiên bản cũ, hoặc bạn không có quyền duyệt<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc thẻ <strong>Bản nộp<\/strong><\/td><td>Đây là bản chụp đúng lúc nộp, không thay đổi về sau. Kiểm tra tiêu đề, chữ, ảnh, video và các quy tắc tuân thủ được cảnh báo<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem <strong>Lịch sử phiên bản<\/strong><\/td><td>Đọc nhận xét các vòng trước để kiểm tra người làm đã sửa đúng chưa<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn thao tác<\/td><td><code>Duyệt xuất bản<\/code>: mục 3. <code>Yêu cầu sửa<\/code>: mục 4. <code>Trả lại nháp<\/code>: mục 5<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chỉ phiên bản mới nhất** của một nội dung được thao tác; phiên bản cũ chỉ xem\n* **Không tự duyệt:** người tạo nội dung (người bấm `Bắt đầu sản xuất`), người nộp phiên bản và người gửi duyệt không được duyệt, yêu cầu sửa hay trả lại nháp phiên bản đó, kể cả Trưởng/Phó phòng, BGĐ. Các nút hiện mờ kèm câu \"Bạn không thể duyệt nội dung do chính mình lập hoặc gửi duyệt.\" Không còn ai khác đủ quyền: thêm câu \"Chưa có người khác có quyền duyệt nội dung này.\"\n* **Không có quyền duyệt** (ví dụ Chuyên viên, Trưởng nhóm đội khác): các nút ẩn, chi tiết hiện \"Chỉ Trưởng nhóm của đội thực hiện, Trưởng/Phó phòng hoặc Ban giám đốc duyệt được.\"\n* Liên kết tới bản ghi bạn không có quyền xem hiện khóa kèm \"Bạn không có quyền xem bản ghi này\"\n\n## <mark style=\"color:green;\">3. Duyệt xuất bản<\/mark>\n\n<figure><img src=\"images/duyet-noi-dung-3.png\" alt=\"\"><figcaption><p>Sau khi duyệt: phiên bản 1 Đã duyệt, hệ thống báo có thể lên lịch đăng<\/p><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở phiên bản <strong>Chờ duyệt<\/strong>, nhấn <code>Duyệt xuất bản<\/code><\/td><td>Mở hộp \"Duyệt xuất bản phiên bản &lt;n&gt; của &lt;mã&gt;?\" với tóm tắt \"&lt;tiêu đề&gt; · nộp bởi &lt;người nộp&gt; lúc &lt;dd/mm/yyyy hh:mm&gt;\", kết quả tuân thủ lúc nộp; quá hạn thì thêm \"Đã quá hạn duyệt &lt;x&gt; giờ &lt;y&gt; phút.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Nhận xét<\/strong><\/td><td>Không bắt buộc, tối đa 1.000 ký tự. Gợi ý \"Ghi chú cho người soạn (không bắt buộc)\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Duyệt xuất bản<\/code><\/td><td>Hệ thống kiểm tuân thủ lại một lần nữa và kiểm tài nguyên<br>Thành công: phiên bản <strong>Đã duyệt<\/strong>, nội dung Đã duyệt, yêu cầu <strong>Hoàn thành<\/strong> (ghi ngày hoàn thành). Việc \"Duyệt nội dung marketing\" của mọi người được đóng; người nộp, người yêu cầu, người thực hiện nhận thông báo \"Phiên bản &lt;n&gt; của &lt;mã&gt; đã được duyệt xuất bản.\"<br>Hệ thống báo \"Đã duyệt xuất bản &lt;mã&gt; phiên bản &lt;n&gt;. Có thể lên lịch đăng.\" hoặc, nếu nội dung chưa thuộc kế hoạch nội dung đã duyệt, \"Đã duyệt xuất bản &lt;mã&gt; phiên bản &lt;n&gt;. Cần kế hoạch nội dung đã duyệt để lên lịch đăng.\"<br>Nhấn <code>Hủy<\/code> để đóng hộp, không đổi gì<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Lên lịch đăng<\/code><\/td><td>Có khi trạng thái xuất bản là \"Chưa hẹn giờ\" và nội dung đã thuộc kế hoạch nội dung đã duyệt; mở <a href=\"lich-xuat-ban.md\">Lịch xuất bản<\/a> với nội dung chọn sẵn. Thiếu kế hoạch thì thay bằng chú thích \"Cần kế hoạch nội dung đã duyệt để lên lịch đăng\". Mọi người trong phòng Marketing đều bấm được<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Vi phạm tuân thủ khi kiểm lại:** hộp hiện \"Nội dung vi phạm quy tắc tuân thủ đang áp dụng, không duyệt được:\" kèm danh sách quy tắc và câu \"Bấm Yêu cầu sửa để người soạn chỉnh lại.\" Phiên bản giữ Chờ duyệt\n* **Tài nguyên hết hạn quyền sử dụng:** \"Nội dung dùng tài nguyên đã hết hạn quyền sử dụng: &lt;mã&gt;. Yêu cầu sửa để bỏ tài nguyên trước khi duyệt.\"\n* Duyệt muộn không bị chặn; phiên bản đã có kết quả không còn tính quá hạn\n* Duyệt không tự tạo bài đăng; lên lịch đăng làm ở [Lịch xuất bản](lich-xuat-ban.md)\n* Nút duyệt ở chi tiết yêu cầu hoặc ở cảnh báo quá hạn đều dẫn về đúng phiên bản tại màn này rồi mở hộp xác nhận; không duyệt hàng loạt\n* Người khác vừa xử lý phiên bản: \"Phiên bản &lt;n&gt; của &lt;mã&gt; đã chuyển sang trạng thái &lt;kết quả&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\" Nhận xét đang nhập được giữ\n* Lỗi: \"Không duyệt được, vui lòng thử lại.\" Không có thay đổi nào được ghi\n\n## <mark style=\"color:green;\">4. Yêu cầu sửa<\/mark>\n\n<figure><img src=\"images/duyet-noi-dung-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở phiên bản <strong>Chờ duyệt<\/strong>, nhấn <code>Yêu cầu sửa<\/code><\/td><td>Mở hộp \"Yêu cầu chỉnh sửa\" kèm dòng \"&lt;mã&gt; · phiên bản &lt;n&gt; · nộp bởi &lt;người nộp&gt;\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Nhận xét cần sửa<\/strong> (bắt buộc)<\/td><td>Nêu rõ chỗ cần chỉnh, tối đa 1.000 ký tự. Bỏ trống: \"Phải ghi lý do để người soạn biết cần sửa gì.\" Quá dài: \"Nhận xét cần sửa tối đa 1.000 ký tự.\"<br>Chú thích dưới ô: \"Nội dung quay lại Đang sản xuất, người làm nộp phiên bản mới.\" (nội dung ngoài yêu cầu: \"Nội dung về Yêu cầu sửa, người soạn sửa rồi gửi duyệt lại.\")<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Gửi yêu cầu sửa<\/code><\/td><td>Phiên bản <strong>Yêu cầu sửa<\/strong> kèm nhận xét; nội dung mở khóa để sửa; yêu cầu về <strong>Đang sản xuất<\/strong>, mọi công đoạn về Đang làm. Người nộp và người làm các công đoạn nhận việc \"Sửa nội dung theo yêu cầu\"<br>Hệ thống báo \"Đã gửi yêu cầu sửa &lt;mã&gt; phiên bản &lt;n&gt;. Yêu cầu quay lại Đang sản xuất.\"<br>Nhấn <code>Huỷ<\/code> hoặc phím Esc để đóng, không lưu<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Người thực hiện xử lý tiếp ở [Bài đang sản xuất](bai-dang-san-xuat.md), mục \"Nhận yêu cầu sửa và nộp lại\"\n* Nội dung tạo thẳng ở Kho nội dung: việc sửa giao cho người tạo nội dung và người nộp (nếu khác)\n* Người nộp đã nghỉ: việc sửa giao cho Trưởng nhóm của đội thực hiện\n* Người duyệt chỉ nhận xét, không sửa trực tiếp nội dung tại màn này\n\n## <mark style=\"color:green;\">5. Trả lại nháp nội dung đã duyệt<\/mark>\n\n<figure><img src=\"images/duyet-noi-dung-5.png\" alt=\"\"><figcaption><p>Chi tiết phiên bản mới nhất Đã duyệt, nơi thực hiện Trả lại nháp<\/p><\/figcaption><\/figure>\n\nDùng khi nội dung đã duyệt nhưng cần làm lại trước khi đăng (ví dụ thông tin khuyến mãi thay đổi)\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn bộ lọc <code>Tất cả phiên bản<\/code>, mở phiên bản mới nhất <strong>Đã duyệt<\/strong><\/td><td>Nút <code>Trả lại nháp<\/code> hiện ở đầu chi tiết<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Trả lại nháp<\/code><\/td><td>Mở hộp \"Trả lại nháp &lt;mã&gt;?\" với câu \"Nội dung sẽ về Nháp và không còn được lên lịch đăng cho tới khi duyệt lại.\" Nội dung thuộc yêu cầu có thêm \"Yêu cầu chuyển từ Hoàn thành về Đang sản xuất.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập <strong>Lý do trả lại nháp<\/strong> (bắt buộc)<\/td><td>Tối đa 1.000 ký tự. Bỏ trống: \"Nhập lý do trả lại nháp.\" Quá dài: \"Lý do trả lại nháp tối đa 1.000 ký tự.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Trả lại nháp<\/code><\/td><td>Phiên bản ghi kết quả <strong>Trả lại nháp<\/strong> kèm lý do, người, thời điểm (nhận xét của lần duyệt trước giữ nguyên); nội dung về Nháp; yêu cầu về <strong>Đang sản xuất<\/strong>, xóa ngày hoàn thành, công đoạn về Đang làm; người thực hiện nhận việc sửa. Hệ thống báo \"Đã trả lại nháp &lt;mã&gt;.\" Nút <code>Lên lịch đăng<\/code> không còn<br>Nhấn <code>Hủy<\/code> để đóng, không đổi gì<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ trả lại nháp được khi nội dung **chưa có bài đăng** đã hẹn giờ, đang đăng hoặc đã đăng. Nếu có, nút hiện mờ kèm câu \"Nội dung đã lên lịch hoặc đã đăng, không trả lại nháp được. Hủy lịch đăng ở Lịch xuất bản trước.\" Hủy lịch ở [Lịch xuất bản](lich-xuat-ban.md) trước\n* Phiên bản đang chờ duyệt thì dùng `Yêu cầu sửa`, không dùng `Trả lại nháp`\n* **Chỉ Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ**, và không phải người lập hoặc nộp phiên bản\n* Nội dung bị trả lại nháp không còn đủ điều kiện lên lịch cho tới khi được duyệt lại ở phiên bản mới\n", "noi-dung-va-media/ke-hoach-noi-dung.md": "# Kế hoạch nội dung\n\n🧭 Tổng quan chức năng: Lập kế hoạch nội dung theo tuần hoặc tháng: mỗi dòng là một chủ đề sẽ đăng trên một kênh vào một ngày dự kiến, có người phụ trách sản xuất. Chuyên viên và Trưởng nhóm lập kế hoạch; Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ duyệt. Chỉ nội dung thuộc kế hoạch **Đã duyệt** mới được lên lịch đăng ở [Lịch xuất bản](lich-xuat-ban.md)\n\nTruy cập: menu **Nội dung & media → Sản xuất nội dung → Kế hoạch nội dung**\n\n{% hint style
