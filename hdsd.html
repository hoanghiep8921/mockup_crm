hỉ với tệp Đang sử dụng), `Tải về`, `Sửa`, menu `⋯` gồm **Lưu trữ** hoặc **Khôi phục**, **Xóa**. Bạn chỉ thấy nút mình có quyền |\n| **Bảng thông tin** | Thư mục, Chiến dịch, Nhãn sản phẩm, Thẻ phân loại, Buổi quay (mỗi buổi một liên kết \"mã - tên\"), Quyền sử dụng, Điều kiện sử dụng (khi Hạn chế), Hạn sử dụng (hoặc \"Không thời hạn\"), Trạng thái, Người tải lên, Ngày tải lên, Người phụ trách, Đội |\n| **Khung cảnh báo** | **Quyền sử dụng hạn chế** kèm điều kiện sử dụng của tệp; \"Hết hạn quyền sử dụng từ dd/mm/yyyy. Không gắn vào nội dung mới.\"; \"Tài nguyên đã lưu trữ lúc dd/mm/yyyy bởi &lt;tên&gt;.\" |\n| **Nội dung đang dùng** | Nút có số đếm; tối đa 5 dòng \"mã nội dung - tiêu đề - trạng thái\" và `Xem tất cả`; dòng \"n nội dung ngoài phạm vi của bạn\"; dòng \"Có trong k phiên bản đã nộp\". Chưa dùng thì ghi \"Chưa dùng ở nội dung nào.\" |\n| **Lịch sử** | Tạo, sửa trường, thay tệp, lưu trữ, khôi phục, gắn vào nội dung, gắn vào buổi quay |\n\n<figure><img src=\"images/kho-anh-video-3.png\" alt=\"\"><figcaption><p>Tệp có quyền sử dụng Hạn chế: khung hiện điều kiện sử dụng<\/p><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm một thẻ trong lưới<\/td><td>Chi tiết mở ở cột phải, lưới thu hẹp<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc khung cảnh báo<\/td><td>Tệp Hạn chế: chỉ dùng khi đúng điều kiện ghi trong khung Quyền sử dụng hạn chế. Tệp hết hạn hoặc lưu trữ: không gắn vào nội dung mới<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm vùng xem trước<\/td><td>Mở ảnh hoặc video cỡ lớn<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Tải về<\/code><\/td><td>Tải tệp gốc với tên tệp gốc<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm liên kết Buổi quay hoặc một nội dung đang dùng<\/td><td>Mở chi tiết buổi quay ở <a href=\"lich-quay-chup.md\">Lịch quay chụp<\/a> hoặc nội dung ở <a href=\"bai-dang-san-xuat.md\">Bài đang sản xuất<\/a>. Nhấn <strong>Nội dung đang dùng<\/strong> hoặc <code>Xem tất cả<\/code> để mở danh sách mọi nội dung đang dùng tệp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Số \"Nội dung đang dùng\" đếm trên toàn bộ nội dung của phòng, kể cả nội dung đã lưu trữ. Nội dung bạn không có quyền xem chỉ hiện thành dòng \"n nội dung ngoài phạm vi của bạn\"\n* Liên kết tới buổi quay hoặc nội dung ngoài phạm vi của bạn hiện mã kèm chú giải \"Bạn không có quyền xem bản ghi này\", không mở được\n* Tệp gốc bị mất thì hiện \"Không tìm thấy tệp gốc của tài nguyên &lt;mã&gt;. Báo quản trị hệ thống.\"\n\n## <mark style=\"color:green;\">3. Tải tài nguyên lên kho<\/mark>\n\n<figure><img src=\"images/kho-anh-video-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp thoại **Tải lên Kho ảnh video**. Mọi lựa chọn trong hộp áp chung cho tất cả tệp của lượt tải; muốn mỗi tệp khác nhau thì sửa từng tệp sau (mục 4)\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Chọn tệp ảnh / video \\*** | Chọn nhiều tệp hoặc kéo thả. Tối đa 20 MB mỗi tệp. Danh sách tệp đã chọn hiện tên, dung lượng, nút bỏ từng tệp |\n| **Thư mục** | Mặc định là thư mục đang chọn trên cây |\n| **Nhãn sản phẩm** | Chọn nhiều |\n| **Chiến dịch** | Mặc định \"Không gắn chiến dịch\". Chỉ hiện chiến dịch bạn được xem; tìm theo mã, tên |\n| **Thẻ phân loại** | Gõ để chọn thẻ có sẵn; nhấn Enter hoặc dấu phẩy để thêm thẻ mới. Mỗi thẻ tối đa 50 ký tự |\n| **Quyền sử dụng \\*** | Nội bộ (mặc định), Công khai, Hạn chế |\n| **Điều kiện sử dụng** | Chỉ hiện khi chọn Hạn chế, khi đó bắt buộc. Tối đa 1.000 ký tự |\n| **Hạn sử dụng** | Không bắt buộc. Dạng \"dd/mm/yyyy\", không trước hôm nay |\n| **Nút** | `Tải lên`, `Huỷ`. Khi có cảnh báo trùng: `Vẫn tải lên`, `Xem tệp có sẵn`, `Huỷ` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn thư mục đích trên cây (nên làm), nhấn <code>+ Tải lên<\/code><\/td><td>Hộp thoại mở, thư mục đang chọn được điền sẵn, quyền Nội bộ<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn tệp<\/td><td>Hệ thống báo ngay tệp quá 20 MB hoặc không phải ảnh, video. Bỏ tệp lỗi bằng nút bỏ cạnh tên tệp<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Nhãn sản phẩm<\/strong>, <strong>Chiến dịch<\/strong>, <strong>Thẻ phân loại<\/strong><\/td><td>Không bắt buộc nhưng giúp người khác tìm được tệp. Thẻ \"Máy cắt\" và \"may cat\" được coi là một thẻ<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Quyền sử dụng<\/strong><\/td><td>Chọn Hạn chế thì nhập <strong>Điều kiện sử dụng<\/strong>, ví dụ \"Tư liệu có hình ảnh khách hàng. Phải xin phép trước khi dùng cho nội dung công khai.\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Chọn <strong>Hạn sử dụng<\/strong> (nếu có)<\/td><td>Ngày cuối cùng được dùng tệp, ví dụ hạn bản quyền ảnh mua<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Tải lên<\/code><\/td><td>Hệ thống kiểm tra dữ liệu nhập, kiểm từng tệp. Một tệp lỗi thì không tệp nào của lượt được tạo; danh sách tệp giữ nguyên để bạn bỏ tệp lỗi<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Xử lý cảnh báo tệp trùng (nếu có)<\/td><td>Nếu có tệp giống hệt nội dung một tệp đã có trong kho (kể cả khác tên), hệ thống chưa tạo gì và hiện \"Có tệp trùng nội dung với tệp đã có trong kho. Nên dùng lại tệp có sẵn; bấm \"Vẫn tải lên\" nếu vẫn muốn thêm bản mới.\" kèm danh sách tệp có sẵn (mã, tên, thư mục, người tải lên). Chọn:<br>• <code>Vẫn tải lên<\/code>: tạo cả tệp trùng thành bản mới<br>• <code>Xem tệp có sẵn<\/code>: đóng hộp, kho lọc theo các tệp trùng để bạn dùng lại<br>• <code>Huỷ<\/code>: đóng hộp, không tạo gì<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Xem kết quả<\/td><td>Hộp thoại đóng, kho lọc \"Vừa tải lên\" và chọn tệp cuối. Thông báo \"Đã tải lên &lt;n&gt; tệp vào Kho ảnh video.\" Mỗi tệp thành một tài nguyên có mã riêng; tên mặc định là tên tệp; bạn là người phụ trách; đội tự điền theo đội của bạn<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Kho chỉ nhận ảnh hoặc video, nhận theo nội dung tệp chứ không theo đuôi tệp (đổi đuôi .exe thành .png vẫn bị chặn). Tệp nén (.zip) không được nhận. Tệp lớn hơn 20 MB chưa lưu được trong giai đoạn này\n* Lỗi tệp: \"Tệp \"&lt;tên&gt;\" nặng &lt;x.x&gt; MB, vượt mức tối đa 20 MB.\" hoặc \"Tệp \"&lt;tên&gt;\" không phải ảnh hoặc video (nhận ra là &lt;định dạng&gt;).\"\n* Lỗi nhập: \"Chọn ít nhất một tệp ảnh hoặc video.\", \"Nhập điều kiện sử dụng cho tài nguyên Hạn chế.\", \"Hạn sử dụng không được trước hôm nay.\", \"Thẻ phân loại tối đa 50 ký tự.\"\n* Kiểm trùng chạy trên toàn kho, kể cả tệp của người khác. Thêm hoặc bỏ tệp sau khi có cảnh báo thì cảnh báo cũ hết hiệu lực, nút trở về `Tải lên`\n* Loại (Ảnh, Video), định dạng, dung lượng do hệ thống tự nhận; không sửa được\n* Lỗi khi lưu thì cả lượt được hoàn tác, hiện \"Chưa tải lên được, vui lòng thử lại.\"\n\n## <mark style=\"color:green;\">4. Sửa thông tin và thay tệp<\/mark>\n\n### 📋 Cấu trúc giao diện\n\nHộp thoại **Sửa tài nguyên &lt;mã&gt;**\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tên \\*** | Tối đa 255 ký tự |\n| **Thay tệp** | Chọn tệp mới, tối đa 20 MB. Bị khóa (thay bằng dòng giải thích) khi tệp đang dùng trong nội dung Chờ duyệt, Đã duyệt hoặc có trong phiên bản đã nộp |\n| **Thư mục**, **Nhãn sản phẩm**, **Chiến dịch**, **Thẻ phân loại** | Như khi tải lên |\n| **Quyền sử dụng \\***, **Điều kiện sử dụng**, **Hạn sử dụng** | Như khi tải lên. Khi sửa, được đặt Hạn sử dụng là ngày đã qua để đánh dấu hết hạn ngay |\n| **Người phụ trách**, **Đội** | Chỉ Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ đổi được |\n| **Thông tin chỉ đọc** | Mã, Loại, Định dạng, Dung lượng, Người tải lên, Ngày tải lên |\n| **Nút** | `Lưu`, `Huỷ` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết tài nguyên, nhấn <code>Sửa<\/code><\/td><td>Hộp thoại mở với dữ liệu hiện có<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Sửa các ô cần đổi<\/td><td>Muốn thay ảnh, video bằng bản mới thì chọn tệp ở <strong>Thay tệp<\/strong>. Hệ thống kiểm tệp mới như khi tải lên<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Lưu<\/code><\/td><td>Hệ thống lưu, ghi lịch sử (giá trị cũ → mới). Thay tệp thì loại, định dạng, dung lượng được tính lại. Thông báo \"Đã lưu tài nguyên &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Không thay được tệp đang dùng trong nội dung Chờ duyệt hoặc Đã duyệt: \"Tệp này đang dùng trong nội dung Chờ duyệt / Đã duyệt (&lt;các nội dung&gt;) nên không thay được - nội dung sẽ được đăng với đúng tệp đã duyệt. Tải tệp mới thành một tài nguyên khác.\" Nội dung ngoài phạm vi của bạn chỉ được đếm, ví dụ \"(ND-2610-012; 2 nội dung ngoài phạm vi của bạn)\"\n* Không thay được tệp có trong phiên bản đã nộp: \"Tệp này có trong &lt;k&gt; phiên bản đã nộp nên không thay được - bản nộp phải giữ đúng tệp lúc nộp. Tải tệp mới thành một tài nguyên khác.\"\n* Nếu nội dung vừa chuyển sang Chờ duyệt trong lúc bạn đang sửa, hệ thống chặn khi lưu và không lưu ô nào. Bỏ tệp mới rồi lưu lại\n* Lỗi nhập thường gặp: \"Nhập tên tài nguyên.\", \"Nhập điều kiện sử dụng cho tài nguyên Hạn chế.\", \"Tên tối đa 255 ký tự.\"\n* Hệ thống không giữ tệp cũ sau khi thay; lịch sử chỉ ghi việc thay tệp\n\n## <mark style=\"color:green;\">5. Lưu trữ và khôi phục tài nguyên<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết tài nguyên, nhấn <code>⋯<\/code> → <strong>Lưu trữ<\/strong><\/td><td>Hệ thống hỏi \"Lưu trữ tài nguyên &lt;mã&gt;? Tài nguyên sẽ ẩn khỏi kho và không gắn được vào nội dung mới; nơi đã gắn (nội dung, buổi quay, bài đăng) vẫn giữ và vẫn dùng tệp.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Lưu trữ<\/code><\/td><td>Tệp chuyển Lưu trữ, biến khỏi kho mặc định. Thông báo \"Đã lưu trữ tài nguyên &lt;mã&gt;.\" Nhấn <code>Không<\/code> để thôi<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Khôi phục: chọn bộ lọc <strong>Trạng thái → Đã lưu trữ<\/strong>, mở tệp, nhấn <code>⋯<\/code> → <strong>Khôi phục<\/strong><\/td><td>Tệp trở lại Đang sử dụng (hoặc Hết hạn nếu đã quá hạn). Thông báo \"Đã khôi phục tài nguyên &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Dùng Lưu trữ thay cho Xóa khi tệp đã được dùng. Tệp lưu trữ vẫn còn ở mọi nơi đã gắn: vẫn hiện trong danh sách tệp của nội dung, vẫn được đăng khi đến giờ, vẫn được đếm\n* Lưu trữ **không** gỡ được chặn hết hạn: tệp lưu trữ mà đã quá hạn sử dụng vẫn làm nội dung chứa nó bị chặn nộp, chặn hẹn giờ và báo lỗi đăng khi đến giờ. Hãy gỡ tệp đó khỏi nội dung\n* Người được lưu trữ, khôi phục: như người được sửa tệp\n\n## <mark style=\"color:green;\">6. Xóa tài nguyên<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết tài nguyên, nhấn <code>⋯<\/code> → <strong>Xóa<\/strong><\/td><td>Hệ thống kiểm tệp có đang dùng ở đâu không, trên toàn bộ dữ liệu của phòng<\/td><\/tr>\n<tr><td><strong>Bước 2a<\/strong><\/td><td>Tệp đang dùng<\/td><td>Hệ thống chặn: \"Tài nguyên &lt;mã&gt; đang dùng trong &lt;n&gt; nội dung, &lt;k&gt; phiên bản đã nộp và &lt;m&gt; buổi quay, không xóa được. Dùng Lưu trữ thay vì xóa.\"<\/td><\/tr>\n<tr><td><strong>Bước 2b<\/strong><\/td><td>Tệp chưa dùng<\/td><td>Hệ thống hỏi \"Xóa tài nguyên &lt;mã&gt; &lt;tên&gt;? Tệp sẽ bị xóa khỏi kho, không khôi phục được.\" Nhấn <code>Xóa<\/code> để xóa: chi tiết đóng, thông báo \"Đã xóa tài nguyên &lt;mã&gt;.\" Nhấn <code>Không xóa<\/code> để thôi<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ Trưởng nhóm (tệp của đội mình), Trưởng/Phó phòng và BGĐ xóa được. Chuyên viên không có mục Xóa\n* Tệp \"đang dùng\" gồm: gắn với bất kỳ nội dung nào (mọi trạng thái, kể cả đã lưu trữ, kể cả nội dung bạn không thấy), có trong phiên bản đã nộp, hoặc gắn với buổi quay\n\n## <mark style=\"color:green;\">7. Quản lý thư mục<\/mark>\n\n### 📋 Cấu trúc giao diện\n\nHộp thoại nhỏ **Thêm thư mục**, **Đổi tên thư mục** hoặc **Chuyển thư mục &lt;đường dẫn&gt;**, mở từ cây thư mục\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tên thư mục \\*** | Tối đa 255 ký tự; không trùng tên với thư mục khác trong cùng thư mục cha |\n| **Thư mục cha** | Bỏ trống là thư mục gốc. Thêm từ nút `+` của một thư mục thì thư mục đó được điền sẵn làm cha |\n| **Đường dẫn** | Tự tính dạng \"Cha / Con\" |\n| **Nút** | `Lưu`, `Huỷ` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Thêm thư mục: nhấn <code>Thêm thư mục<\/code> ở gốc cây, hoặc <code>+<\/code> cạnh một thư mục<\/td><td>Hộp thoại <strong>Thêm thư mục<\/strong> mở<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Tên thư mục<\/strong>, chọn <strong>Thư mục cha<\/strong>, nhấn <code>Lưu<\/code><\/td><td>Cây mở tới thư mục vừa lưu và chọn nó. Thông báo \"Đã lưu thư mục &lt;đường dẫn&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đổi tên hoặc chuyển: nhấn <code>⋯<\/code> cạnh thư mục → <strong>Đổi tên<\/strong> hoặc <strong>Chuyển<\/strong><\/td><td>Sửa tên hoặc chọn thư mục cha mới, nhấn <code>Lưu<\/code>. Đường dẫn của thư mục và mọi thư mục con được tính lại; tệp bên trong giữ nguyên thư mục<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xóa: nhấn <code>⋯<\/code> → <strong>Xóa<\/strong><\/td><td>Hệ thống hỏi \"Xóa thư mục &lt;đường dẫn&gt;?\". Thư mục rỗng thì bị xóa, cây chọn thư mục cha, thông báo \"Đã xóa thư mục &lt;đường dẫn&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Thư mục dùng chung toàn phòng, không thuộc riêng ai. Mỗi tệp nằm trong tối đa một thư mục; không chọn thì nằm ở \"Chưa xếp thư mục\"\n* Chỉ Trưởng nhóm trở lên xóa được thư mục, và chỉ thư mục rỗng: \"Thư mục &lt;đường dẫn&gt; còn &lt;n&gt; thư mục con và &lt;m&gt; tài nguyên, không xóa được. Chuyển hoặc xóa chúng trước.\"\n* Lỗi thường gặp: \"Nhập tên thư mục.\", \"Đã có thư mục &lt;tên&gt; trong &lt;thư mục cha&gt;.\", \"Thư mục không thể nằm trong chính nó.\" (khi chọn cha là chính nó hoặc thư mục con của nó)\n\n## <mark style=\"color:green;\">8. Gắn tài nguyên vào nội dung<\/mark>\n\n### 📋 Cấu trúc giao diện\n\nHộp thoại **Gắn &lt;mã tài nguyên&gt; vào nội dung**\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tài nguyên** | Ảnh thu nhỏ, mã, tên, loại, quyền sử dụng; khung điều kiện sử dụng nếu tệp Hạn chế |\n| **Nội dung \\*** | Danh sách có ô tìm theo mã, tiêu đề. Mỗi dòng \"mã - tiêu đề - trạng thái\". Chỉ hiện nội dung Nháp hoặc Yêu cầu sửa mà bạn được sửa, chưa gắn tệp này |\n| **Xác nhận được phép** | Chỉ với tệp Hạn chế, bắt buộc tích: \"Tôi xác nhận đã được phép dùng tài nguyên này cho nội dung đã chọn.\" |\n| **Nút** | `Gắn`, `Huỷ` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết tài nguyên, nhấn <code>Gắn vào nội dung<\/code><\/td><td>Tệp lưu trữ hoặc hết hạn bị chặn ngay: \"Tài nguyên &lt;mã&gt; đã lưu trữ, khôi phục trước khi gắn vào nội dung.\" hoặc \"Tài nguyên &lt;mã&gt; đã hết hạn quyền sử dụng từ &lt;dd/mm/yyyy&gt;, không gắn được vào nội dung.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Nội dung<\/strong><\/td><td>Gõ mã hoặc tiêu đề để tìm. Danh sách rỗng thì hiện \"Chưa có nội dung Nháp hoặc Yêu cầu sửa nào bạn được sửa.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Tích <strong>Xác nhận được phép<\/strong> (tệp Hạn chế)<\/td><td>Chỉ tích khi bạn đã được phép dùng tệp theo điều kiện ghi trong khung Quyền sử dụng hạn chế<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Gắn<\/code><\/td><td>Tệp được thêm vào danh sách tệp của nội dung; số \"Nội dung đang dùng\" tăng 1. Thông báo \"Đã gắn &lt;mã&gt; vào nội dung &lt;mã nội dung&gt;.\" kèm liên kết <strong>Mở nội dung<\/strong><\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Lỗi thường gặp: \"Chọn nội dung cần gắn.\", \"Xác nhận đã được phép dùng tài nguyên hạn chế.\", \"Nội dung &lt;mã&gt; đang Chờ duyệt hoặc Đã duyệt, không thay đổi tệp được.\"\n* Với tệp Hạn chế, lịch sử nội dung ghi \"Xác nhận được phép dùng tài nguyên hạn chế &lt;mã&gt;\"\n* Bạn cũng gắn được tệp từ phía nội dung, ở chi tiết nội dung trong [Bài đang sản xuất](bai-dang-san-xuat.md). Các điều kiện trên áp dụng như nhau. Gỡ tệp khỏi nội dung chỉ làm ở chi tiết nội dung; gỡ không xóa tệp khỏi kho\n\n## <mark style=\"color:green;\">9. Xuất Excel<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn thư mục, lọc, tìm danh sách cần xuất<\/td><td>Tệp xuất đúng danh sách đang hiển thị<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <strong>KhoAnhVideo_yyyymmdd.xlsx<\/strong>, một sheet, cột: Mã, Tên, Loại, Định dạng, Dung lượng (MB), Thư mục, Chiến dịch, Nhãn sản phẩm, Thẻ, Quyền sử dụng, Hạn sử dụng, Trạng thái, Người tải lên, Ngày tải lên, Số nội dung đang dùng, Buổi quay<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Tệp Excel chỉ chứa thông tin, không chứa ảnh, video\n* Hạn sử dụng xuất dạng \"dd/mm/yyyy\"; Ngày tải lên dạng \"dd/mm/yyyy hh:mm\" (giờ Việt Nam). Ô hiện \"-\" trên màn thì xuất \"-\"\n* Danh sách rỗng thì không tải tệp và hiện \"Không có dữ liệu để xuất.\" Lỗi khi xuất thì hiện \"Không xuất được tệp, vui lòng thử lại.\"\n", "noi-dung-va-media/mau-va-nhan-dien.md": "# Mẫu và nhận diện\n\n🧭 Tổng quan chức năng: Thư viện dùng chung của phòng Marketing gồm **bộ nhận diện thương hiệu** (logo, font, bảng màu) và **mẫu thiết kế** (template bài viết). Mỗi mục có phiên bản, ngày cập nhật, tệp tải về và hướng dẫn sử dụng, để mọi nội dung dùng đúng bản nhận diện mới nhất. Trưởng/Phó phòng, BGĐ tải lên và cập nhật; mọi người trong phòng xem và tải về\n\nTruy cập: menu **Nội dung & media → Tài nguyên → Mẫu và nhận diện**\n\n{% hint style=\"info\" %}\n\n## NHÓM, LOẠI VÀ PHIÊN BẢN CỦA MẪU\n\nMỗi mục trong thư viện gọi tắt là một **mẫu**, có mã dạng **MKT-MAU-0001**\n\n| Nhóm | Loại | Tệp nhận (tối đa 50 MB) |\n| --- | --- | --- |\n| **Bộ nhận diện thương hiệu** | Logo | .png .jpg .svg .pdf .ai .eps .zip |\n| | Font | .ttf .otf .woff .woff2 .zip |\n| | Bảng màu | .pdf .png .jpg .ase .aco, hoặc chỉ nhập danh sách màu |\n| **Mẫu thiết kế** | Template bài viết | .png .jpg .pdf .psd .ai .pptx .zip |\n\n**Vòng đời một mẫu**\n\nBước 1: Trưởng/Phó phòng hoặc BGĐ tải mẫu mới, phiên bản đầu thường là **v1.0**. Mẫu ở trạng thái **Đang dùng**\n\nBước 2: Khi có bản mới (logo đổi, template sửa…), bấm **Cập nhật phiên bản** và tải tệp mới. Bản đang dùng chuyển vào **Lịch sử phiên bản**, bản mới thành **phiên bản hiện hành**\n\nBước 3: Mẫu không còn dùng thì bấm **Ngừng dùng**: mẫu ẩn khỏi thư viện nhưng vẫn xem, tải được qua bộ lọc. Có thể **Dùng lại** khi cần\n\n**Ai làm được gì**\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng, BGĐ |\n| --- | --- | --- | --- |\n| Xem, tìm, tải về mẫu và phiên bản cũ | Có | Có | Có |\n| Tải mẫu mới, cập nhật phiên bản, sửa thông tin | Không | Không | Có |\n| Ngừng dùng, dùng lại, xóa mẫu tạo nhầm | Không | Không | Có |\n| Xuất Excel | Có | Có | Có |\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem thư viện, tìm và lọc<\/mark>\n\n<figure><img src=\"images/mau-va-nhan-dien-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề \"Mẫu và nhận diện\", dòng đếm \"n mẫu và tài sản nhận diện\", ô tìm, nút `Xuất Excel`, nút `+ Tải mẫu mới` (chỉ Trưởng/Phó phòng, BGĐ thấy) |\n| **Nhóm nút Nhóm** | Tất cả (mặc định), Bộ nhận diện, Mẫu thiết kế |\n| **Bộ lọc** | Loại (Logo, Font, Bảng màu, Template bài viết), Trạng thái (Đang dùng mặc định, Ngừng dùng, Tất cả), Ngày cập nhật từ – đến. Lọc đang áp hiện thành chip, kèm nút `Xóa bộ lọc` |\n| **Thẻ mẫu** | Ảnh thu nhỏ khi tệp là ảnh; tối đa 5 ô màu đầu tiên với Bảng màu; biểu tượng theo loại với tệp khác. Tên (di chuột để xem tên đầy đủ), \"Loại · phiên bản\", \"cập nhật dd/mm/yyyy\". Chip \"Ngừng dùng\" khi đang lọc mẫu ngừng dùng |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Nội dung &amp; media → Tài nguyên → Mẫu và nhận diện<\/strong><\/td><td>Thư viện hiện mọi mẫu Đang dùng, xếp theo nhóm (Bộ nhận diện trước), rồi loại, rồi tên<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn nhóm<\/td><td>Nhấn <strong>Bộ nhận diện<\/strong> hoặc <strong>Mẫu thiết kế<\/strong> để thu hẹp thư viện<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn bộ lọc<\/td><td>Chọn Loại, Trạng thái, khoảng Ngày cập nhật. Chọn <strong>Trạng thái → Ngừng dùng<\/strong> để xem mẫu đã ngừng dùng<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập từ khóa vào ô tìm<\/td><td>Tìm trong mã, tên, loại; không phân biệt hoa thường và dấu. Nhập \"0003\" hay \"MKT-MAU-0003\" đều ra cùng mẫu. Tối đa 100 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm một thẻ<\/td><td>Chi tiết mẫu mở ở cột phải (mục 2). Nhóm, bộ lọc, ô tìm giữ nguyên khi bạn chọn mẫu khác<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Thư viện dùng chung toàn phòng: mọi người thấy mọi mẫu, không phân theo người hay đội\n* Không có mẫu khớp thì hiện \"Không có mẫu nào khớp điều kiện.\" Thư viện trống thì hiện \"Chưa có mẫu và nhận diện. Trưởng/Phó phòng bấm Tải mẫu mới để thêm.\"\n* Lỗi tải dữ liệu thì hiện \"Không tải được thư viện mẫu và nhận diện\" và nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết và tải về<\/mark>\n\n<figure><img src=\"images/mau-va-nhan-dien-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên mẫu, dòng phụ \"mã · Loại · phiên bản\", ví dụ \"MKT-MAU-0003 · Bảng màu · v2.1\". Chip \"Ngừng dùng\" nếu mẫu đã ngừng dùng. Nút `X` đóng chi tiết |\n| **Nút thao tác** | `Tải về`. Trưởng/Phó phòng, BGĐ có thêm `Cập nhật phiên bản` (nút chính) và menu `⋯` gồm **Sửa thông tin**, **Ngừng dùng** hoặc **Dùng lại**, **Xóa** (chỉ với mẫu tạo nhầm) |\n| **Hướng dẫn sử dụng** | Cách dùng mẫu, giữ nguyên xuống dòng; liên kết trong đoạn bấm được |\n| **Bảng màu** | Chỉ với loại Bảng màu: mỗi màu một ô kèm tên, mã HEX, ghi chú dùng |\n| **Bảng thông tin** | Nhóm, Phiên bản, Cập nhật, Người cập nhật, Tên tệp, Dung lượng, Phạm vi dùng (\"Toàn phòng Marketing\"), Trạng thái |\n| **Lịch sử phiên bản** | Mỗi phiên bản cũ một dòng: Phiên bản, Ngày cập nhật, Người cập nhật, Ghi chú thay đổi, nút `Tải về`. Mới nhất ở trên. Chưa có thì ghi \"Chưa có phiên bản cũ.\" |\n| **Khung Ngừng dùng** | Khung \"Mẫu đã ngừng dùng từ dd/mm/yyyy (&lt;tên người&gt;). Không dùng cho nội dung mới.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm một thẻ trong thư viện<\/td><td>Chi tiết mở ở cột phải<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc <strong>Hướng dẫn sử dụng<\/strong><\/td><td>Ví dụ: \"Xanh chủ đạo #1F5FBF cho nút và liên kết. Cam #C96A12 chỉ dùng cho nhấn mạnh, không quá 10% diện tích.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Sao chép mã màu (Bảng màu)<\/td><td>Bấm vào ô màu. Hệ thống sao chép mã HEX và hiện \"Đã sao chép &lt;HEX&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Tải về<\/code><\/td><td>Tải tệp của phiên bản hiện hành, tên tệp dạng \"&lt;mã&gt;_&lt;phiên bản&gt;_&lt;tên tệp gốc&gt;\". Bảng màu không có tệp thì tải về tệp .txt danh sách \"Tên màu – HEX – Ghi chú\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Tải phiên bản cũ (nếu cần)<\/td><td>Nhấn <code>Tải về<\/code> ở một dòng trong <strong>Lịch sử phiên bản<\/strong>. Hệ thống tải tệp và nhắc \"Đã tải phiên bản cũ &lt;phiên bản&gt;. Không dùng cho nội dung mới.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Luôn dùng phiên bản hiện hành cho nội dung mới. Phiên bản cũ và mẫu ngừng dùng chỉ để tra cứu\n* Tệp bị mất thì hiện \"Không tìm thấy tệp của mẫu &lt;mã&gt; &lt;phiên bản&gt;. Báo Trưởng/Phó phòng cập nhật lại.\"\n\n## <mark style=\"color:green;\">3. Tải mẫu mới<\/mark>\n\n<figure><img src=\"images/mau-va-nhan-dien-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ Trưởng/Phó phòng Marketing và BGĐ làm được\n\n### 📋 Cấu trúc giao diện\n\nHộp thoại **Tải mẫu mới**. Ô có dấu **\\*** là bắt buộc\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tên mẫu \\*** | Tối đa 255 ký tự. Không trùng tên với mẫu Đang dùng cùng loại |\n| **Loại \\*** | Logo (mặc định), Font, Bảng màu, Template bài viết. Nhóm tương ứng hiện bên cạnh |\n| **Phiên bản \\*** | Dạng \"v&lt;số&gt;.&lt;số&gt;\", mặc định \"v1.0\". Tối đa 20 ký tự |\n| **Tệp mẫu** | Một tệp, tối đa 50 MB. Dưới ô ghi các đuôi tệp được nhận theo loại đang chọn. Bắt buộc với Logo, Font, Template bài viết. Bộ nhiều tệp thì nén thành .zip |\n| **Hướng dẫn sử dụng \\*** | Nhiều dòng, tối đa 5.000 ký tự |\n| **Bảng màu** | Chỉ hiện với loại Bảng màu. Bảng dòng: **Tên màu** (bắt buộc, tối đa 100 ký tự), **Mã HEX** (bắt buộc, dạng #RRGGBB, có ô màu xem trước), **Ghi chú dùng** (tối đa 255 ký tự). Nút `Thêm màu`; tối đa 20 màu |\n| **Nút** | `Tải lên`, `Huỷ` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>+ Tải mẫu mới<\/code><\/td><td>Hộp thoại mở, Loại mặc định Logo, Phiên bản v1.0<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Tên mẫu<\/strong>, chọn <strong>Loại<\/strong><\/td><td>Đổi Loại thì danh sách đuôi tệp được nhận đổi theo. Hãy chọn đúng loại: sau khi lưu không đổi được loại<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Kiểm tra <strong>Phiên bản<\/strong><\/td><td>Giữ v1.0 hoặc nhập theo đánh số đang dùng, ví dụ v3.2<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Tệp mẫu<\/strong><\/td><td>Hệ thống kiểm đuôi tệp, nội dung tệp và dung lượng ngay khi chọn<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhập <strong>Bảng màu<\/strong> (loại Bảng màu)<\/td><td>Nhấn <code>Thêm màu<\/code>, nhập tên màu, mã HEX, ghi chú dùng. Bảng màu có màu thì không cần tệp<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhập <strong>Hướng dẫn sử dụng<\/strong><\/td><td>Ghi rõ dùng khi nào, dùng thế nào, điều cần tránh<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Tải lên<\/code><\/td><td>Có lỗi thì hiện tất cả lỗi, mỗi lỗi tại ô sai; hộp thoại giữ dữ liệu. Thành công: hộp đóng, thư viện chọn mẫu mới và mở chi tiết; thông báo \"Đã tải lên mẫu &lt;mã&gt; &lt;tên&gt;.\" Ngày cập nhật là hôm nay, người cập nhật là bạn<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Lỗi nhập thường gặp: \"Nhập tên mẫu.\", \"Nhập hướng dẫn sử dụng.\", \"Phiên bản phải có dạng v&lt;số&gt;.&lt;số&gt;, ví dụ v1.0.\", \"Chọn tệp mẫu.\", \"Thêm tệp hoặc ít nhất một màu cho bảng màu.\", \"Đã có mẫu &lt;tên&gt; loại &lt;loại&gt;.\"\n* Lỗi tệp: \"Loại tệp \".&lt;đuôi&gt;\" không được nhận cho &lt;Loại&gt;. Nhận: &lt;danh sách đuôi&gt;.\", \"Tệp \"&lt;tên&gt;\" không đúng định dạng đã khai.\", \"Tệp \"&lt;tên&gt;\" nặng &lt;x,x&gt; MB, vượt mức tối đa 50 MB.\"\n* Lỗi bảng màu: \"Mã màu phải có dạng #RRGGBB, ví dụ #1F5FBF.\", \"Mã màu &lt;HEX&gt; đã có trong bảng màu.\" Mã HEX được lưu chữ hoa\n* Tệp mẫu lưu riêng trong thư viện này, không đưa vào [Kho ảnh video](kho-anh-video.md)\n* Lỗi khi lưu thì hiện \"Chưa lưu được mẫu, vui lòng thử lại.\" và giữ dữ liệu đang nhập\n\n## <mark style=\"color:green;\">4. Cập nhật phiên bản<\/mark>\n\nChỉ Trưởng/Phó phòng Marketing và BGĐ làm được. Hộp thoại dùng chung bố cục với Tải mẫu mới (mục 3), tiêu đề **Cập nhật phiên bản &lt;mã&gt;**\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết mẫu, nhấn <code>Cập nhật phiên bản<\/code><\/td><td>Hộp thoại mở. Tên, Loại chỉ đọc. Phiên bản gợi ý tăng số sau dấu chấm (v2.1 → v2.2). Hướng dẫn sử dụng và Bảng màu điền sẵn bản hiện hành, sửa được<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Tệp mẫu<\/strong> mới<\/td><td>Bắt buộc chọn tệp mới. Với Bảng màu: chọn tệp mới hoặc sửa danh sách màu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Kiểm tra <strong>Phiên bản<\/strong><\/td><td>Phải lớn hơn phiên bản hiện hành, so theo từng số (v1.10 lớn hơn v1.9)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập <strong>Ghi chú thay đổi<\/strong><\/td><td>Bắt buộc, tối đa 1.000 ký tự. Ghi điểm khác so với bản trước<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Lưu phiên bản<\/code><\/td><td>Bản đang dùng (tệp, phiên bản, ngày, người, ghi chú, bảng màu) chuyển vào <strong>Lịch sử phiên bản<\/strong>; bản mới thành hiện hành; Ngày cập nhật là hôm nay. Thông báo \"Đã cập nhật &lt;mã&gt; lên &lt;phiên bản&gt;.\" Thẻ trong thư viện đổi phiên bản và ngày cập nhật<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Lỗi thường gặp: \"Phiên bản mới phải lớn hơn &lt;phiên bản hiện hành&gt;.\", \"Nhập nội dung thay đổi của phiên bản.\", \"Chọn tệp mẫu.\"\n* Lỗi khi lưu thì cả lượt được hoàn tác: phiên bản hiện hành giữ nguyên, không mất bản cũ\n* Hệ thống không tự báo cho cả phòng khi có phiên bản mới; hãy thông báo cho đồng nghiệp nếu thay đổi quan trọng\n\n## <mark style=\"color:green;\">5. Sửa thông tin mẫu<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết mẫu, nhấn <code>⋯<\/code> → <strong>Sửa thông tin<\/strong><\/td><td>Hộp thoại \"Sửa thông tin &lt;mã&gt;\" mở, chỉ cho sửa <strong>Tên mẫu<\/strong> và <strong>Hướng dẫn sử dụng<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Sửa, nhấn <code>Lưu<\/code><\/td><td>Hệ thống lưu, ghi lịch sử thay đổi. Thông báo \"Đã lưu mẫu &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Sửa thông tin không tạo phiên bản mới và không đổi Ngày cập nhật. Đổi tệp hoặc màu thì dùng **Cập nhật phiên bản**\n* Chỉ Trưởng/Phó phòng Marketing và BGĐ làm được\n\n## <mark style=\"color:green;\">6. Ngừng dùng và dùng lại mẫu<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết mẫu, nhấn <code>⋯<\/code> → <strong>Ngừng dùng<\/strong><\/td><td>Hộp xác nhận \"Ngừng dùng mẫu?\": \"Ngừng dùng &lt;mã&gt; &lt;tên&gt;? Mẫu sẽ ẩn khỏi thư viện; vẫn xem được ở bộ lọc Ngừng dùng.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Ngừng dùng<\/code><\/td><td>Mẫu ẩn khỏi thư viện mặc định, mang chip \"Ngừng dùng\". Thông báo \"Đã ngừng dùng mẫu &lt;mã&gt;.\" Nhấn <code>Không<\/code> để thôi<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Dùng lại: chọn bộ lọc <strong>Trạng thái → Ngừng dùng<\/strong>, mở mẫu, nhấn <code>⋯<\/code> → <strong>Dùng lại<\/strong><\/td><td>Mẫu trở lại Đang dùng. Thông báo \"Đã dùng lại mẫu &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Mẫu ngừng dùng vẫn tải về được, kèm nhãn \"Đã ngừng dùng\"\n* Không dùng lại được nếu đã có mẫu Đang dùng cùng tên, cùng loại: \"Đã có mẫu &lt;tên&gt; loại &lt;loại&gt;.\"\n* Mẫu đã dùng không xóa được; dùng Ngừng dùng thay cho xóa\n\n## <mark style=\"color:green;\">7. Xóa mẫu tạo nhầm<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết mẫu, nhấn <code>⋯<\/code> → <strong>Xóa<\/strong><\/td><td>Mục Xóa chỉ hiện với mẫu tạo trong 24 giờ gần nhất và chưa có phiên bản cũ. Hệ thống hỏi \"Xóa mẫu &lt;mã&gt; &lt;tên&gt;? Mẫu tạo nhầm sẽ bị xóa hẳn, không khôi phục được.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Xóa<\/code><\/td><td>Mẫu và bảng màu của nó bị xóa, chi tiết đóng. Thông báo \"Đã xóa mẫu &lt;mã&gt;.\" Nhấn <code>Không xóa<\/code> để thôi<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Nếu mẫu không còn đủ điều kiện lúc bấm xóa (quá 24 giờ hoặc đã có phiên bản cũ), hệ thống chặn: \"Chỉ xóa được mẫu tạo trong 24 giờ và chưa có phiên bản cũ. Dùng Ngừng dùng.\"\n* Chỉ Trưởng/Phó phòng Marketing và BGĐ làm được\n\n## <mark style=\"color:green;\">8. Xuất Excel<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn nhóm, lọc, tìm danh sách cần xuất<\/td><td>Tệp xuất đúng danh sách đang hiển thị<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <strong>MauNhanDien_yyyymmdd.xlsx<\/strong>, một sheet, cột: Mã, Tên, Nhóm, Loại, Phiên bản, Ngày cập nhật, Người cập nhật, Trạng thái<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Ngày cập nhật xuất dạng \"dd/mm/yyyy\". Ô hiện \"-\" trên màn thì xuất \"-\"\n* Danh sách rỗng thì không tải tệp và hiện \"Không có dữ liệu để xuất.\" Lỗi khi xuất thì hiện \"Không xuất được tệp, vui lòng thử lại.\"\n", "quan-ly-chi-phi-ngan-sach/de-xuat-chi.md": "# Đề xuất chi\n\n🧭 Tổng quan chức năng: Màn **Đề xuất chi** dùng để xin chi một khoản cụ thể ngoài ngân sách quảng cáo chạy đồng bộ, ví dụ thuê KOL, in ấn, booking PR, sự kiện, nạp tiền tài khoản quảng cáo. Người lập gửi duyệt, người ký duyệt lần lượt theo bậc tính theo số tiền; đề xuất đã duyệt đủ bậc chuyển sang màn Thanh toán. Màn dành cho Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng Marketing và BGĐ\n\nTruy cập: menu **Chi phí & ngân sách → Quản lý chi phí → Đề xuất chi**\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH CHI TIỀN MARKETING\n\nBước 1: **[Đề xuất chi](de-xuat-chi.md)**. Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng hoặc BGĐ lập đề xuất. Đề xuất lưu ở trạng thái **Nháp**. Người lập bấm `Gửi duyệt` khi đã sẵn sàng, đề xuất sang **Chờ duyệt**\n\nBước 2: **[Duyệt theo bậc](de-xuat-chi.md)**. Người ký duyệt lần lượt từng bậc theo số tiền: đến 20 tr chỉ cần Trưởng nhóm; trên 20 tr đến 100 tr thêm Trưởng/Phó phòng; trên 100 tr thêm BGĐ. Ký đủ bậc thì đề xuất sang **Đã duyệt**. Người ký có thể `Yêu cầu chỉnh sửa` (đề xuất về **Nháp**) hoặc `Từ chối` (đề xuất sang **Từ chối**, sửa và gửi lại được)\n\nBước 3: **[Thanh toán](thanh-toan.md)** (một hoặc nhiều lượt). **Trưởng/Phó phòng** hoặc **BGĐ** ghi nhận từng lượt trả tiền kèm chứng từ. Trả đủ số tiền, hoặc bấm `Hoàn tất` khi chi thực tế thấp hơn số đã duyệt, thì đề xuất sang **Đã thanh toán**\n\nBước 4: **[Đối soát tháng](doi-soat.md)**. Số hóa đơn của từng kênh trong tháng được nhập kèm hóa đơn; Trưởng/Phó phòng hoặc BGĐ chốt kỳ. Khi mọi lượt thanh toán của đề xuất thuộc kỳ đã chốt, đề xuất sang **Đã đối soát**\n\nBước 5: **[Cảnh báo vượt mức](canh-bao-vuot-muc.md)**. Hệ thống tự so chi phí thực với ngân sách mỗi giờ và ngay sau mỗi lần ghi nhận hoặc hủy lượt thanh toán; khi chạm mốc cảnh báo hoặc vượt ngân sách thì sinh cảnh báo và giao việc cho người phụ trách\n\nTrạng thái đề xuất: **Nháp** → **Chờ duyệt** → **Đã duyệt** → **Đã thanh toán** → **Đã đối soát**. Nhánh phụ: **Từ chối**\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách đề xuất chi<\/mark>\n\n<figure><img src=\"images/de-xuat-chi-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề và dòng đếm** | Tiêu đề \"Đề xuất chi\" và dòng \"&lt;n&gt; đề xuất · &lt;a&gt; chờ duyệt · &lt;b&gt; quá hạn duyệt\". Số n đếm theo bộ lọc đang chọn; số chờ duyệt và quá hạn duyệt đếm trong toàn bộ phạm vi bạn được xem |\n| **Bộ lọc nhanh** | Tất cả, Nháp, Chờ duyệt, Chờ tôi duyệt, Quá hạn duyệt, Đã duyệt, Đã thanh toán (gồm cả Đã đối soát), Từ chối |\n| **Ô tìm** | Tìm theo mã hoặc nội dung đề xuất, không phân biệt hoa thường, lọc ngay khi gõ (tối đa 100 ký tự) |\n| **Bộ lọc mở rộng** | Khoản mục, Kênh, Chiến dịch, Đội, Người lập, Ngày dự kiến chi từ – đến. Điều kiện đang áp hiện thành chip, bấm X trên chip để bỏ |\n| **Nút `Xuất Excel`** | Tải danh sách đang xem ra tệp Excel |\n| **Nút `+ Lập đề xuất`** | Mở hộp lập đề xuất mới |\n| **Danh sách (cột trái)** | Mỗi dòng: nội dung đề xuất và chip trạng thái; mã, khoản mục; số tiền, người lập và các nhãn **Quá hạn duyệt**, **Vượt hạn mức**, **Chờ bạn duyệt**. Dòng đang chọn được tô nền. Mỗi trang 20 dòng |\n| **Chi tiết (cột phải)** | Chi tiết của đề xuất đang chọn, xem mục 2 |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Chi phí &amp; ngân sách → Quản lý chi phí → Đề xuất chi<\/strong><\/td><td>Hệ thống hiển thị danh sách và chọn sẵn dòng đầu. Nếu bạn đang có đề xuất chờ mình ký, bộ lọc mặc định là <strong>Chờ tôi duyệt<\/strong>; nếu không, bộ lọc là <strong>Tất cả<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn bộ lọc nhanh<\/td><td>Hệ thống vẽ lại danh sách và dòng đếm. Bộ lọc <strong>Chờ duyệt<\/strong>, <strong>Chờ tôi duyệt<\/strong>, <strong>Quá hạn duyệt<\/strong> là hàng chờ duyệt, xem mục 6<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập từ khóa vào <strong>ô tìm<\/strong> hoặc mở <strong>bộ lọc mở rộng<\/strong><\/td><td>Danh sách lọc theo mã, nội dung, khoản mục, kênh, chiến dịch, đội, người lập, khoảng ngày dự kiến chi. Không có kết quả: \"Không có đề xuất nào khớp điều kiện.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm một dòng<\/td><td>Chi tiết đề xuất hiện ở cột phải (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>DeXuatChi_yyyymmdd.xlsx<\/code> gồm đúng các dòng đang xem (sau bộ lọc và tìm), có các cột Mã, Nội dung, Khoản mục, Kênh, Chiến dịch, Số tiền, Ngày dự kiến chi, Người lập, Người phụ trách, Đội, Trạng thái, Bậc đang chờ, Hạn duyệt, Quá hạn, Vượt hạn mức, Đã thanh toán, Còn phải trả, Gửi duyệt lúc, Duyệt xong lúc. Danh sách rỗng: \"Không có dữ liệu để xuất.\", không tải tệp. Lỗi: \"Không xuất được tệp, vui lòng thử lại.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Bạn chỉ thấy đề xuất trong phạm vi của mình: Chuyên viên thấy đề xuất mình lập hoặc mình phụ trách; Trưởng nhóm thấy đề xuất của đội mình; Trưởng/Phó phòng và BGĐ thấy tất cả\n* Danh sách mặc định xếp theo ngày tạo, mới trước\n* Mã đề xuất có dạng `MKT-DX-0001`, cấp tự động khi lưu lần đầu. Đề xuất lập trước khi áp dạng mã này giữ mã cũ\n* Số tiền trên danh sách hiển thị rút gọn (ví dụ 28,0 tr); di chuột để xem số đầy đủ\n* Tải danh sách lỗi: hệ thống hiện \"Không tải được danh sách đề xuất chi.\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết đề xuất chi<\/mark>\n\n<figure><img src=\"images/de-xuat-chi-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | Nội dung đề xuất; dòng phụ \"&lt;mã&gt; · &lt;khoản mục&gt; · dự kiến chi dd/mm/yyyy\" |\n| **Nút thao tác** | Hiện theo trạng thái và quyền của bạn: Nháp, Từ chối có `Sửa`, `Xóa`, `Gửi duyệt`; Chờ duyệt có `Từ chối`, `Yêu cầu chỉnh sửa`, `Duyệt` kèm dòng \"Bậc duyệt tiếp theo: &lt;bậc&gt;\"; Đã duyệt có `Ghi nhận thanh toán`, `Hoàn tất` |\n| **Khung trạng thái** | Khung **Quá hạn duyệt** (hạn đã qua bao lâu); khung **Bị từ chối** (người, thời điểm, lý do); khung **Cần chỉnh sửa** (người, thời điểm, ý kiến); khung **Vượt hạn mức quý của kênh: cần ký đủ mọi bậc** |\n| **Khung \"Vượt phân bổ còn lại\"** | Hiện khi số tiền đề xuất làm dòng phân bổ ngân sách vượt phần còn lại |\n| **Thẻ số** | **Số tiền đề xuất**, **Ngân sách phân bổ**, **Lũy kế đã dùng**, **Còn lại sau đề xuất**. Di chuột vào thẻ Còn lại để xem công thức |\n| **Bậc duyệt theo số tiền** | Tiêu đề phụ \"&lt;số tiền&gt; cần &lt;n&gt; bậc\". Mỗi bậc ghi \"Đã duyệt bởi &lt;người&gt; · thời điểm\", \"Đang chờ bậc này duyệt · hạn dd/mm/yyyy hh:mm\" hoặc \"Chưa tới lượt\", kèm ý kiến của người ký nếu có |\n| **Bảng thông tin** | Khoản mục, Kênh (trống là \"Khác\"), Chiến dịch (bấm để mở chiến dịch), Lý do, Người đề xuất, Người phụ trách, Người gửi duyệt, Đội nhóm, Công ty (khi dùng nhiều công ty), Gửi duyệt lúc, Hạn duyệt, Chứng từ đính kèm (bấm tên tệp để tải) |\n| **Thanh toán đã ghi nhận** | Hiện khi đã có lượt thanh toán: chip \"&lt;đã trả&gt; / &lt;số tiền&gt;\" và bảng Mã lượt, Ngày, Số tiền, Phương thức. Bấm mã lượt để mở chi tiết lượt ở màn [Thanh toán](thanh-toan.md) |\n| **Lịch sử và liên kết** | Mọi thay đổi, lần gửi duyệt, từng chữ ký, lần nhắc quá hạn; liên kết chiến dịch, lượt thanh toán, kỳ đối soát; ô bình luận (tối đa 1.000 ký tự) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm một dòng ở danh sách<\/td><td>Chi tiết đề xuất hiện ở cột phải. Mở từ việc được giao, thông báo, hoặc nút \"Xem chi tiết\" ở Bảng điều khiển cũng vào màn này<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem <strong>Thẻ số<\/strong><\/td><td>Ngân sách phân bổ và Lũy kế đã dùng lấy theo dòng phân bổ ngân sách khớp với kênh, chiến dịch, ngày dự kiến chi của đề xuất. Còn lại sau đề xuất = Ngân sách phân bổ − Lũy kế đã dùng − tiền đã cam kết của các đề xuất đã duyệt chưa trả − Số tiền đề xuất. Không có dòng phân bổ khớp: thẻ ghi \"Chưa có phân bổ\", các thẻ còn lại ghi \"-\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem khối <strong>Bậc duyệt theo số tiền<\/strong><\/td><td>Đề xuất Nháp hiển thị các bậc dự kiến theo số tiền hiện tại. Đề xuất đã gửi hiển thị tiến trình ký của lần gửi hiện tại; các lần trước xem ở Lịch sử<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm nút thao tác<\/td><td><code>Sửa<\/code>, <code>Xóa<\/code>: mục 4. <code>Gửi duyệt<\/code>: mục 5. <code>Duyệt<\/code>, <code>Yêu cầu chỉnh sửa<\/code>, <code>Từ chối<\/code>: mục 7. <code>Ghi nhận thanh toán<\/code>, <code>Hoàn tất<\/code>: mở hộp tương ứng của màn <a href=\"thanh-toan.md\">Thanh toán<\/a> với đề xuất chọn sẵn<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhập bình luận ở <strong>Lịch sử và liên kết<\/strong><\/td><td>Bình luận ghi được ở mọi trạng thái, kể cả khi đề xuất đã khóa sửa<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Từ lúc gửi duyệt, thẻ số giữ **số tại lúc gửi** kèm dòng \"Số tại lúc gửi duyệt dd/mm/yyyy hh:mm\" để người ký thấy đúng bối cảnh khi gửi. Số chỉ tính lại khi gửi lại\n* Khung **Vượt phân bổ còn lại** chỉ để cảnh báo: không chặn gửi duyệt, không chặn duyệt, không làm tăng số bậc\n* Khoản nạp tiền tài khoản quảng cáo Meta không tính vào chi phí thực (tiền tiêu thật đã có trong chi phí Meta đồng bộ), nên thẻ Còn lại ghi \"Khoản này không vào chi phí thực\" và không hiện khung Vượt phân bổ\n* Nút bạn không có quyền sẽ ẩn. Nút bạn có quyền nhưng chưa dùng được (ví dụ bạn là người lập nên không được duyệt) sẽ hiện mờ kèm chú giải lý do\n* `Ghi nhận thanh toán` ở màn này dành cho Trưởng/Phó phòng và BGĐ\n* Đề xuất đã bị xóa hoặc ra khỏi phạm vi xem: hệ thống báo \"Đề xuất chi không còn tồn tại.\" hoặc \"Bạn không có quyền xem đề xuất chi này.\" rồi tải lại danh sách\n\n## <mark style=\"color:green;\">3. Lập đề xuất chi<\/mark>\n\n<figure><img src=\"images/de-xuat-chi-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp **Lập đề xuất chi**, câu dẫn \"Đề xuất được lưu ở trạng thái Nháp. Bấm Gửi duyệt ở màn chi tiết khi đã sẵn sàng.\" Các ô theo thứ tự:\n\n| Ô nhập | Bắt buộc | Mô tả |\n| --- | --- | --- |\n| **Nội dung đề xuất** | Có | Tiêu đề ngắn, tối đa 255 ký tự. Ví dụ \"In ấn standee cho hội chợ\" |\n| **Khoản mục** | Có | Thuê ngoài, Sản xuất ấn phẩm, Truyền thông, Quảng cáo trả phí, Sự kiện / Hội chợ, Khác (theo danh mục đang dùng). Mặc định khoản mục đầu |\n| **Kênh** | Có khi khoản mục là **Quảng cáo trả phí** | Kênh marketing. Có lựa chọn \"- Không chọn (tính vào Khác) -\". Chọn chiến dịch chỉ có một kênh thì kênh được điền sẵn |\n| **Chiến dịch** | Không | Mặc định \"- Không gắn chiến dịch -\". Chỉ hiện chiến dịch bạn được xem, không ở trạng thái Từ chối; hiển thị \"&lt;mã&gt; · &lt;tên&gt;\" |\n| **Số tiền (₫)** | Có | Số nguyên VND, lớn hơn 0, tối đa 12 chữ số. Dưới ô hiện số rút gọn và \"Cần &lt;n&gt; bậc duyệt: &lt;các bậc&gt;\" ngay khi gõ |\n| **Ngày dự kiến chi** | Có | Mặc định hôm nay. Chọn được ngày trong quá khứ để hợp thức hóa khoản đã chi |\n| **Lý do** | Có | Vì sao cần khoản chi, chi cho ai, vào việc gì. Tối đa 1.000 ký tự |\n| **Đội phụ trách** | Có | Mặc định đội của bạn. Chuyên viên, Trưởng nhóm chỉ chọn đội mình thuộc; Trưởng/Phó phòng, BGĐ chọn mọi đội |\n| **Người phụ trách** | Có | Mặc định là bạn. Chuyên viên chỉ chọn chính mình |\n| **Công ty** | Có | Chỉ hiện khi bạn làm việc với nhiều công ty; mặc định công ty đang làm việc |\n| **Chứng từ đính kèm** | Không | Báo giá, hợp đồng, kế hoạch chi. Tối đa 10 tệp, mỗi tệp tối đa 20 MB, định dạng pdf, jpg, png, xlsx, docx |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>+ Lập đề xuất<\/code><\/td><td>Hộp <strong>Lập đề xuất chi<\/strong> mở với giá trị mặc định: khoản mục đầu, ngày hôm nay, đội và người phụ trách theo bạn<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Nội dung đề xuất<\/strong>, chọn <strong>Khoản mục<\/strong>, <strong>Kênh<\/strong>, <strong>Chiến dịch<\/strong><\/td><td>Chọn chiến dịch đã kết thúc vẫn được; dưới ô hiện \"Chiến dịch đã kết thúc ngày dd/mm/yyyy; khoản thanh toán ghi nhận sau lúc chốt chi phí (dd/mm/yyyy 06:00) không vào số chốt.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập <strong>Số tiền<\/strong>, chọn <strong>Ngày dự kiến chi<\/strong><\/td><td>Hệ thống báo ngay số bậc duyệt cần có theo số tiền<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập <strong>Lý do<\/strong>, chọn <strong>Đội phụ trách<\/strong>, <strong>Người phụ trách<\/strong><\/td><td>Đội quyết định Trưởng nhóm nào ký bậc 1 và Trưởng nhóm nào thấy đề xuất<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Tải <strong>Chứng từ đính kèm<\/strong> (nếu có)<\/td><td>Hệ thống kiểm tệp ngay khi tải. Tệp lỗi không được thêm: \"Tệp &lt;tên&gt; vượt 20 MB.\", \"Tối đa 10 tệp đính kèm.\", \"Định dạng tệp không được hỗ trợ.\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Lập đề xuất<\/code><\/td><td>Hệ thống kiểm dữ liệu và báo lỗi ngay tại ô, giữ hộp và dữ liệu đang nhập. Thành công: đề xuất được cấp mã, lưu ở trạng thái <strong>Nháp<\/strong>, hộp đóng, danh sách chuyển sang bộ lọc Nháp và chọn đề xuất mới; thông báo \"Đã lập đề xuất &lt;mã&gt; (&lt;số tiền&gt;). Bấm Gửi duyệt khi đã sẵn sàng.\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Hủy<\/code> hoặc dấu X<\/td><td>Đóng hộp, không lưu; tệp vừa tải bị bỏ<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Các câu lỗi thường gặp: \"Nhập nội dung đề xuất.\", \"Chọn khoản mục chi phí.\", \"Chọn kênh cho khoản Quảng cáo trả phí.\", \"Số tiền đề xuất chi phải lớn hơn 0.\", \"Số tiền là số nguyên VND.\", \"Số tiền tối đa 999.999.999.999 ₫.\", \"Chọn ngày dự kiến chi.\", \"Phải ghi lý do đề xuất chi.\", \"Chọn đội phụ trách.\", \"&lt;Tên ô&gt; tối đa &lt;n&gt; ký tự.\"\n* Chiến dịch ở trạng thái Từ chối không gắn được: \"Chiến dịch &lt;mã&gt; đã bị từ chối, không gắn đề xuất chi được.\"\n* Lưu lỗi: \"Chưa lưu được đề xuất chi, vui lòng thử lại.\" Hệ thống không lưu một nửa và không cấp mã\n* Lập đề xuất chưa làm gì tới ngân sách. Chỉ phần **đã thanh toán** mới vào chi phí thực; đề xuất đã duyệt chưa trả là tiền **đã cam kết**\n\n## <mark style=\"color:green;\">4. Sửa, xóa đề xuất chi<\/mark>\n\n<figure><img src=\"images/de-xuat-chi-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nút `Sửa`** | Ở đầu chi tiết của đề xuất **Nháp** hoặc **Từ chối**. Mở hộp **Sửa đề xuất chi &lt;mã&gt;** với các ô như hộp Lập (mục 3), nút cuối là `Lưu` |\n| **Nút `Xóa`** | Chỉ có ở đề xuất **Nháp chưa từng gửi duyệt**. Mở hộp xác nhận \"Xóa đề xuất &lt;mã&gt;?\" với câu \"Thao tác này không hoàn tác.\", nút `Hủy` (mặc định) và `Xóa` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn đề xuất Nháp hoặc Từ chối, nhấn <code>Sửa<\/code><\/td><td>Hộp Sửa mở với dữ liệu hiện có<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Sửa các ô cần đổi, nhấn <code>Lưu<\/code><\/td><td>Hệ thống kiểm như khi lập. Thành công: \"Đã lưu đề xuất &lt;mã&gt;.\"; thay đổi ghi vào lịch sử. Đề xuất Từ chối vẫn ở trạng thái Từ chối sau khi lưu, bạn cần <code>Gửi duyệt<\/code> lại<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Muốn bỏ đề xuất Nháp chưa gửi: nhấn <code>Xóa<\/code><\/td><td>Hộp xác nhận mở<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Xóa<\/code> trong hộp xác nhận<\/td><td>Đề xuất và chứng từ đính kèm bị xóa; thông báo \"Đã xóa đề xuất &lt;mã&gt;.\"; danh sách chọn dòng kế tiếp. Mã đã cấp không dùng lại. Nhấn <code>Hủy<\/code> để đóng hộp, không xóa<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được sửa:** người lập, người phụ trách, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ (trong phạm vi xem)\n* **Ai được xóa:** chỉ Trưởng nhóm (đề xuất của đội), Trưởng/Phó phòng, BGĐ. Chuyên viên không xóa được, kể cả đề xuất mình lập\n* Đề xuất đã từng gửi duyệt (kể cả đã về Nháp sau Yêu cầu chỉnh sửa, hoặc đang Từ chối) **không xóa được** để giữ vết\n* **Khóa sau khi gửi duyệt:** từ Chờ duyệt trở đi không sửa được nội dung, số tiền, khoản mục, kênh, chiến dịch, ngày chi, lý do, người phụ trách, đội, công ty, chứng từ. Hệ thống báo \"Đề xuất «&lt;mã&gt;» đã gửi duyệt - không sửa số tiền, khoản mục, kênh, chiến dịch, ngày chi, lý do, người phụ trách hay đội nhóm được nữa. Muốn đổi thì nhờ người duyệt Yêu cầu chỉnh sửa.\" Xóa đề xuất đã vào luồng duyệt: \"Đề xuất «&lt;mã&gt;» đã vào luồng duyệt - không xoá được.\"\n\n## <mark style=\"color:green;\">5. Gửi duyệt đề xuất chi<\/mark>\n\n<figure><img src=\"images/de-xuat-chi-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nút `Gửi duyệt`** | Ở đầu chi tiết của đề xuất **Nháp** hoặc **Từ chối**; không có hộp xác nhận |\n| **Bậc duyệt theo số tiền** | Trước khi gửi: liệt kê các bậc dự kiến, mỗi bậc ghi \"Chưa tới lượt\". Sau khi gửi: bậc đầu ghi \"Đang chờ bậc này duyệt · hạn dd/mm/yyyy hh:mm\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn đề xuất Nháp hoặc Từ chối, kiểm tra lại thông tin và thẻ số<\/td><td>Khối Bậc duyệt cho biết đề xuất cần bao nhiêu chữ ký<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Gửi duyệt<\/code><\/td><td>Hệ thống kiểm lại dữ liệu (khoản mục còn dùng, kênh với khoản Quảng cáo trả phí, chiến dịch không ở Từ chối), rồi dựng các bậc ký theo số tiền, chụp số ngân sách, chuyển đề xuất sang <strong>Chờ duyệt<\/strong> và giao việc chờ ký cho người ký bậc đầu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem kết quả<\/td><td>Thông báo \"Đã gửi duyệt &lt;mã&gt;. Cần &lt;n&gt; bậc duyệt cho &lt;số tiền&gt;.\" Nếu vượt hạn mức quý của kênh, thông báo thêm \"Đề xuất vượt hạn mức quý của kênh nên cần ký đủ &lt;n&gt; bậc.\" và chi tiết có khung <strong>Vượt hạn mức<\/strong><\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được gửi duyệt:** người lập đề xuất, hoặc Trưởng/Phó phòng, BGĐ gửi thay. Người phụ trách (không phải người lập) và Trưởng nhóm không gửi thay đề xuất của người khác\n* **Số bậc theo số tiền:** đến 20.000.000 ₫ cần 1 bậc (Trưởng nhóm); trên 20 tr đến 100 tr cần 2 bậc (thêm Trưởng/Phó phòng); trên 100 tr cần 3 bậc (thêm BGĐ). Ví dụ đúng 20.000.000 ₫ chỉ cần Trưởng nhóm\n* **Vượt hạn mức:** nếu số tiền lớn hơn phần còn lại của kênh trong hạn mức quý, đề xuất được gắn nhãn **Vượt hạn mức** và phải ký đủ mọi bậc tới BGĐ. Hệ thống không chặn gửi. Chuyên viên chỉ thấy nhãn; Trưởng nhóm trở lên thấy thêm số \"Còn lại của kênh lúc gửi duyệt\"\n* Khoản nạp tiền tài khoản Meta không bị gắn nhãn Vượt hạn mức; số bậc vẫn tính theo số tiền\n* **Gửi lại** sau Từ chối hoặc Yêu cầu chỉnh sửa: hệ thống dựng lại toàn bộ bậc theo số tiền hiện tại; chữ ký lần trước không còn hiệu lực (vẫn xem được ở Lịch sử)\n* Câu lỗi thường gặp: \"Chỉ gửi duyệt được đề xuất Nháp hoặc đã bị Từ chối.\"; \"Khoản mục &lt;tên&gt; đã ngừng dùng, chọn khoản mục khác.\" (bấm `Sửa` rồi gửi lại); \"Chưa khai báo bậc duyệt nào áp dụng cho số tiền này - xem Thiết lập và quản trị ▸ Bậc duyệt đề xuất chi.\"\n* Nếu không còn ai khác đủ quyền ký bậc đang chờ, đề xuất giữ Chờ duyệt và người lập thấy \"Chưa có người khác có quyền duyệt đề xuất chi này.\"\n\n## <mark style=\"color:green;\">6. Hàng chờ duyệt và hạn duyệt<\/mark>\n\n<figure><img src=\"images/de-xuat-chi-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bộ lọc Chờ duyệt** | Mọi đề xuất Chờ duyệt trong phạm vi xem của bạn |\n| **Bộ lọc Chờ tôi duyệt** | Đề xuất mà bạn ký được bậc đang chờ |\n| **Bộ lọc Quá hạn duyệt** | Đề xuất có bậc đang chờ đã quá hạn |\n| **Dòng chờ duyệt** | Như dòng ở danh sách, thêm dòng \"Chờ &lt;bậc&gt; · hạn dd/mm hh:mm\" và nhãn **Chờ bạn duyệt** khi bạn ký được. Xếp theo hạn tăng dần, quá hạn lâu nhất lên đầu |\n| **Số đếm ở menu** | Số đề xuất Chờ tôi duyệt cạnh mục menu Đề xuất chi; ẩn khi bằng 0 |\n| **Khung Quá hạn duyệt** | Khung ở chi tiết: \"Hạn duyệt dd/mm/yyyy hh:mm đã qua &lt;thời gian&gt;. Đề xuất này đang nằm trong cảnh báo Đề xuất chi quá hạn duyệt ở Bảng điều khiển.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn bộ lọc <strong>Chờ tôi duyệt<\/strong><\/td><td>Danh sách chỉ còn các đề xuất đang chờ chính bạn ký, sắp theo hạn. Rỗng: \"Không có đề xuất nào đang chờ bạn duyệt.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn bộ lọc <strong>Quá hạn duyệt<\/strong> khi cần xử lý việc trễ<\/td><td>Danh sách các đề xuất có bậc đang chờ đã qua hạn, quá hạn lâu nhất lên đầu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm một dòng<\/td><td>Chi tiết mở ở cột phải với các nút <code>Từ chối<\/code>, <code>Yêu cầu chỉnh sửa<\/code>, <code>Duyệt<\/code> và dòng \"Bậc duyệt tiếp theo: &lt;bậc&gt;\". Ký theo mục 7<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Hoặc bấm việc \"Duyệt đề xuất chi &lt;mã&gt; - &lt;bậc&gt;\" trong danh sách việc cần làm<\/td><td>Hệ thống mở thẳng chi tiết đề xuất cần ký<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Hạn duyệt mỗi bậc là 10 giờ làm việc** tính từ lúc bậc đó tới lượt (bậc đầu tính từ lúc gửi duyệt, bậc sau tính từ lúc bậc trước ký xong). Giờ làm việc 08:00–18:00, làm thứ Bảy, nghỉ Chủ nhật. Ví dụ gửi 16:00 thứ Sáu thì hạn là 16:00 thứ Bảy; gửi 16:00 thứ Bảy thì hạn là 16:00 thứ Hai\n* Khi một bậc tới lượt, hệ thống giao việc chờ ký cho người ký đúng bậc. Không còn ai ký được thì giao Trưởng/Phó phòng, sau cùng là BGĐ\n* Quá hạn chỉ để nhắc: hệ thống **không tự duyệt** và **không bỏ qua bậc**. Mỗi bậc quá hạn được nhắc đúng một lần qua việc \"Quá hạn duyệt đề xuất chi - cần bạn ký\" (người ký) và \"Quá hạn duyệt đề xuất chi - theo dõi\" (cấp trên một nấc)\n* Đề xuất quá hạn cũng hiện ở Bảng điều khiển, loại cảnh báo \"Đề xuất chi quá hạn duyệt\"; bấm \"Xem chi tiết\" ở đó sẽ mở màn này với bộ lọc Quá hạn duyệt. Người ký cũng duyệt được ngay từ Bảng điều khiển, xem [Cảnh báo cần xử lý](../bang-dieu-khien/canh-bao-can-xu-ly.md)\n\n## <mark style=\"color:green;\">7. Duyệt, yêu cầu chỉnh sửa, từ chối<\/mark>\n\n<figure><img src=\"images/de-xuat-chi-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nBa nút dùng chung một hộp **Ý kiến**, tiêu đề đổi theo nút bấm: \"Duyệt đề xuất chi\", \"Yêu cầu chỉnh sửa đề xuất chi\", \"Từ chối đề xuất chi\"\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tóm tắt** | \"&lt;mã&gt; · &lt;nội dung&gt; · &lt;số tiền&gt;\" và \"Bậc đang chờ: &lt;bậc&gt;\". Nếu duyệt làm dòng phân bổ vượt ngân sách, có thêm dòng \"Duyệt sẽ làm dòng phân bổ vượt ngân sách &lt;số tiền&gt;.\" |\n| **Ô ý kiến** | Nhãn \"Lý do từ chối\" (bắt buộc), \"Nội dung cần chỉnh sửa\" (bắt buộc) hoặc \"Ý kiến (không bắt buộc)\" khi duyệt. Tối đa 1.000 ký tự |\n| **Dòng giải thích** | Từ chối: \"Đề xuất chuyển sang Từ chối; người lập sửa rồi gửi duyệt lại được. Người lập và người gửi duyệt nhận được lý do này.\" Yêu cầu chỉnh sửa: \"Đề xuất quay về Nháp để người lập sửa và gửi lại.\" Duyệt: \"Sau bậc này: &lt;bậc kế&gt;\" hoặc \"Đã duyệt, chuyển sang chờ thanh toán\" |\n| **Nút xác nhận** | `Xác nhận duyệt`, `Yêu cầu chỉnh sửa` hoặc `Từ chối`; nút `Hủy` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở đề xuất Chờ duyệt mà bạn ký được (bộ lọc Chờ tôi duyệt)<\/td><td>Ba nút <code>Từ chối<\/code>, <code>Yêu cầu chỉnh sửa<\/code>, <code>Duyệt<\/code> hiện ở đầu chi tiết<\/td><\/tr>\n<tr><td><strong>Bước 2a<\/strong><\/td><td>Đồng ý: nhấn <code>Duyệt<\/code>, nhập ý kiến nếu muốn, nhấn <code>Xác nhận duyệt<\/code><\/td><td>Còn bậc sau: thông báo \"Đã duyệt bậc &lt;bậc&gt;. Còn chờ &lt;bậc kế&gt;.\", bậc kế bắt đầu tính hạn và người ký bậc kế nhận việc. Bậc cuối: thông báo \"Đã duyệt đủ bậc. &lt;mã&gt; chuyển sang chờ thanh toán.\"; đề xuất sang <strong>Đã duyệt<\/strong> và hiện ở khối chờ thanh toán của màn <a href=\"thanh-toan.md\">Thanh toán<\/a><\/td><\/tr>\n<tr><td><strong>Bước 2b<\/strong><\/td><td>Cần sửa: nhấn <code>Yêu cầu chỉnh sửa<\/code>, nhập nội dung cần chỉnh sửa, nhấn <code>Yêu cầu chỉnh sửa<\/code><\/td><td>Đề xuất về <strong>Nháp<\/strong>, các bậc sau không còn chờ; thông báo \"Đã trả &lt;mã&gt; về Nháp để chỉnh sửa.\" Chi tiết hiện khung <strong>Cần chỉnh sửa<\/strong> kèm người, thời điểm, ý kiến<\/td><\/tr>\n<tr><td><strong>Bước 2c<\/strong><\/td><td>Không đồng ý: nhấn <code>Từ chối<\/code>, nhập lý do, nhấn <code>Từ chối<\/code><\/td><td>Đề xuất sang <strong>Từ chối<\/strong>; thông báo \"Đã từ chối &lt;mã&gt;. Người đề xuất nhận được lý do.\" Chi tiết hiện khung <strong>Bị từ chối<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Hủy<\/code>, dấu X hoặc phím Esc<\/td><td>Đóng hộp, không ký<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai ký bậc nào:**\n\n| Bậc | Người ký | Người ký thay |\n| --- | --- | --- |\n| Trưởng nhóm | Trưởng nhóm **của đội** của đề xuất | Trưởng/Phó phòng, BGĐ |\n| Trưởng/Phó phòng | Trưởng/Phó phòng | BGĐ |\n| Ban giám đốc | Chỉ BGĐ | Không có |\n\n* Đề xuất không có đội, hoặc đội không có Trưởng nhóm, thì bậc Trưởng nhóm do Trưởng/Phó phòng hoặc BGĐ ký. Trưởng nhóm đội khác không ký được: \"Chỉ Trưởng nhóm của &lt;đội&gt; hoặc Trưởng/Phó phòng, BGĐ được ký bậc này.\"\n* **Không tự duyệt:** người lập và người gửi duyệt không được ký bất kỳ bậc nào, kể cả khi là Trưởng/Phó phòng hoặc BGĐ. Nút ký hiện mờ kèm \"Bạn không thể duyệt đề xuất chi do chính mình lập hoặc gửi duyệt.\"\n* **Mỗi người ký một bậc:** ai đã ký một bậc thì không ký tiếp bậc sau của cùng lần gửi: \"Bạn đã ký một bậc của đề xuất này - mỗi người chỉ ký một bậc, các bậc còn lại do người khác ký.\"\n* Thiếu ý kiến khi từ chối hoặc yêu cầu chỉnh sửa: \"Chưa nhập lý do từ chối.\" hoặc \"Chưa nhập nội dung cần chỉnh sửa.\"; quá dài: \"Ý kiến tối đa 1.000 ký tự.\"\n* Người lập và người gửi duyệt nhận thông báo: \"Đề xuất chi &lt;mã&gt; bị từ chối: &lt;ý kiến&gt;\", \"Đề xuất chi &lt;mã&gt; cần chỉnh sửa: &lt;ý kiến&gt;\", \"Đề xuất chi &lt;mã&gt; đã duyệt đủ bậc, chờ thanh toán.\"\n* Hai người cùng ký một lúc: người đến sau nhận \"Đề xuất chi &lt;mã&gt; đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\"; ý kiến đang nhập được giữ để sao chép\n* **Yêu cầu chỉnh sửa** khác **Từ chối**: Yêu cầu chỉnh sửa đưa đề xuất về Nháp, không mang tiếng bị bác; Từ chối là trạng thái riêng, vẫn sửa và gửi lại được\n", "quan-ly-chi-phi-ngan-sach/thanh-toan.md": "# Thanh toán\n\n🧭 Tổng quan chức năng: Màn **Thanh toán** dùng để ghi nhận khoản đã trả thực tế cho đề xuất chi đã duyệt đủ bậc, kèm chứng từ (hóa đơn, ủy nhiệm chi, biên lai). Mỗi lần trả là một **lượt thanh toán**; một đề xuất trả được nhiều lượt, tổng không vượt số tiền đã duyệt. Trưởng/Phó phòng, BGĐ ghi nhận; Chuyên viên và Trưởng nhóm xem lượt thanh toán của đề xuất trong phạm vi mình\n\nTruy cập: menu **Chi phí & ngân sách → Quản lý chi phí → Thanh toán**\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH THANH TOÁN ĐỀ XUẤT CHI\n\nBước 1: Đề xuất chi được ký đủ bậc ở màn [Đề xuất chi](de-xuat-chi.md) và chuyển **Đã duyệt**. Đề xuất hiện ở khối **Đề xuất chờ thanh toán** của màn này\n\nBước 2: **Trưởng/Phó phòng** hoặc **BGĐ** bấm `Ghi nhận`, nhập số tiền trả, ngày, phương thức, số chứng từ và đính kèm chứng từ. Hệ thống tạo một lượt thanh toán **Hiệu lực**\n\nBước 3: Trả chưa đủ: đề xuất vẫn **Đã duyệt**, chip \"Đã trả &lt;x&gt; / &lt;y&gt;\", tiếp tục ghi nhận lượt sau. Trả đủ số tiền: đề xuất tự chuyển **Đã thanh toán**\n\nBước 4: Chi thực tế thấp hơn số đã duyệt: **Trưởng/Phó phòng** hoặc **BGĐ** bấm `Hoàn tất` để đóng đề xuất ở **Đã thanh toán** với số thực trả\n\nBước 5: Ghi nhầm một lượt: **BGĐ** bấm `Hủy lượt thanh toán`; lượt chuyển **Đã hủy**, đề xuất tính lại số đã trả, rồi ghi nhận lại lượt đúng\n\nBước 6: Cuối tháng, kỳ được chốt ở màn [Đối soát](doi-soat.md). Khi mọi lượt của đề xuất thuộc kỳ đã chốt, đề xuất sang **Đã đối soát**\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem đề xuất chờ thanh toán và lượt thanh toán<\/mark>\n\n<figure><img src=\"images/thanh-toan-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề và dòng đếm** | \"Thanh toán\" và dòng \"Đã chi &lt;x&gt; · &lt;n&gt; lượt thanh toán\" theo bộ lọc đang áp |\n| **Ô tìm** | Tìm theo mã lượt, mã đề xuất, nội dung đề xuất, số chứng từ (tối đa 100 ký tự) |\n| **Bộ lọc** | Khoảng **Ngày thanh toán** (mặc định từ mùng 1 tháng này đến hôm nay), **Khoản mục**, **Kênh**, **Phương thức**, **Trạng thái lượt** (mặc định Hiệu lực). Điều kiện đang áp hiện thành chip |\n| **Nút `Xuất Excel`** | Tải bảng lượt đang xem |\n| **Nút `+ Ghi nhận thanh toán`** | Mở hộp ghi nhận (mục 3). Chỉ hiện với Trưởng/Phó phòng, BGĐ |\n| **Khối \"Đề xuất chờ thanh toán (n)\"** | Bảng mọi đề xuất Đã duyệt trong phạm vi: Mã (bấm để mở đề xuất), Nội dung, Khoản mục, Kênh, Số tiền, Đã trả, Còn phải trả, Ngày dự kiến chi, Người lập. Mỗi dòng có nút `Ghi nhận` và `Hoàn tất` theo quyền. Xếp theo ngày dự kiến chi, ngày sớm nhất trước. Khối ẩn khi không còn đề xuất chờ |\n| **Thẻ số** | **Đã thanh toán** (tổng các lượt hiệu lực đang hiển thị, kèm \"&lt;n&gt; lượt chi\"), **Chờ thanh toán** (tổng Còn phải trả của khối chờ), **Có chứng từ** (số lượt có tệp / tổng lượt) |\n| **Bảng lượt thanh toán** | Mã lượt (bấm để mở chi tiết, mục 2), Đề xuất chi, Ngày, Số tiền, Phương thức, Số chứng từ, Người ghi nhận, Chứng từ (\"&lt;n&gt; tệp\"), Trạng thái (Hiệu lực; Đã hủy hiển thị gạch ngang). Dòng **Tổng** chỉ cộng lượt hiệu lực. Mỗi trang 20 dòng, mới nhất trước |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Chi phí &amp; ngân sách → Quản lý chi phí → Thanh toán<\/strong><\/td><td>Hệ thống hiển thị khối đề xuất chờ thanh toán, thẻ số và bảng lượt của tháng hiện tại, chỉ lượt hiệu lực<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem khối <strong>Đề xuất chờ thanh toán<\/strong><\/td><td>Cột <strong>Còn phải trả<\/strong> cho biết số tiền còn lại cần ghi nhận của từng đề xuất. Bấm <code>Ghi nhận<\/code> để trả (mục 3), <code>Hoàn tất<\/code> để đóng đề xuất trả thiếu (mục 5)<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đổi <strong>bộ lọc<\/strong> hoặc nhập <strong>ô tìm<\/strong><\/td><td>Bảng lượt, thẻ Đã thanh toán và dòng đếm vẽ lại theo bộ lọc. Khối chờ thanh toán không đổi theo khoảng ngày. Không có kết quả: \"Không có lượt thanh toán nào khớp điều kiện.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm <strong>mã lượt<\/strong> trong bảng<\/td><td>Chi tiết lượt mở ở cột phải (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>ThanhToan_&lt;từ ngày&gt;_&lt;đến ngày&gt;.xlsx<\/code> (ngày dạng yyyymmdd) gồm các lượt đang xem, có thêm cột Lý do hủy, Vào chi phí thực (Có/Không), Vào chi phí quảng cáo (Có/Không). Rỗng: \"Không có dữ liệu để xuất.\"; lỗi: \"Không xuất được tệp, vui lòng thử lại.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy gì:** Chuyên viên thấy lượt thanh toán của đề xuất mình lập hoặc phụ trách; Trưởng nhóm thấy của đội; Trưởng/Phó phòng, BGĐ thấy tất cả\n* Nhãn **Thiếu** ở cột Chứng từ chỉ gặp ở các lượt ghi nhận trước khi chứng từ trở thành bắt buộc\n* Tải danh sách lỗi: \"Không tải được danh sách thanh toán.\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết lượt thanh toán<\/mark>\n\n<figure><img src=\"images/thanh-toan-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Mã lượt (dạng `MKT-TT-0001`), dòng \"dd/mm/yyyy · &lt;phương thức&gt;\", nút X đóng chi tiết |\n| **Đề xuất chi** | \"&lt;mã&gt; · &lt;nội dung&gt;\" (bấm để mở đề xuất), dòng phụ khoản mục, kênh, chiến dịch |\n| **Số tiền** | Số tiền của lượt và \"Đợt &lt;k&gt; · đã trả &lt;x&gt; / &lt;y&gt;\" (đợt thứ mấy của đề xuất, tính theo ngày thanh toán) |\n| **Phương thức, Số chứng từ** | Chuyển khoản, Tiền mặt, Thẻ hoặc Khác; số chứng từ đã nhập |\n| **Người ghi nhận** | Tên và thời điểm ghi nhận \"dd/mm/yyyy hh:mm\" |\n| **Ghi chú** | \"-\" khi trống |\n| **Chứng từ đính kèm** | Danh sách tệp, mỗi tệp có nút `Tải về` |\n| **Nút `Hủy lượt thanh toán`** | Chỉ với BGĐ khi lượt còn hiệu lực (mục 4) |\n| **Khung Đã hủy** | Lượt đã hủy: khung \"Đã hủy bởi &lt;người&gt; · dd/mm/yyyy hh:mm\" kèm lý do |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm mã lượt ở bảng lượt, hoặc ở khối \"Thanh toán đã ghi nhận\" của <a href=\"de-xuat-chi.md\">Đề xuất chi<\/a><\/td><td>Chi tiết lượt mở ở cột phải<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Tải về<\/code> cạnh tên tệp<\/td><td>Tải tệp chứng từ. Lỗi: \"Không tải được tệp &lt;tên&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm liên kết đề xuất chi<\/td><td>Mở chi tiết đề xuất ở màn Đề xuất chi<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn dấu X<\/td><td>Đóng chi tiết, bảng trở lại toàn chiều rộng<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Lượt đã ghi **không sửa, không xóa**. Ghi nhầm thì hủy lượt (mục 4) rồi ghi nhận lại\n* Ai xem được lượt thì tải được tệp chứng từ của lượt\n* Lượt cũ không có tệp ghi \"Lượt ghi nhận trước khi bắt buộc chứng từ.\"\n\n## <mark style=\"color:green;\">3. Ghi nhận thanh toán<\/mark>\n\n<figure><img src=\"images/thanh-toan-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp **Ghi nhận thanh toán**. Các ô theo thứ tự:\n\n| Ô nhập | Bắt buộc | Mô tả |\n| --- | --- | --- |\n| **Đề xuất chi** | Có | Chọn trong các đề xuất Đã duyệt còn phải trả, hiển thị \"&lt;mã&gt; - &lt;nội dung&gt; · còn phải trả &lt;x&gt;\". Mở từ dòng chờ hoặc từ Đề xuất chi thì chọn sẵn và khóa ô |\n| **Tóm tắt đề xuất** | - | Khoản mục, Kênh, Chiến dịch, Số tiền đã duyệt, Đã trả, Còn phải trả |\n| **Số tiền (₫)** | Có | Mặc định bằng Còn phải trả. Số nguyên VND, lớn hơn 0, không vượt Còn phải trả. Dưới ô hiện \"Sau lượt này: đã trả &lt;a&gt; / &lt;b&gt;\" và \"Đề xuất sẽ chuyển Đã thanh toán\" khi đủ |\n| **Ngày thanh toán** | Có | Mặc định hôm nay, không chọn ngày sau hôm nay. Ngày này quyết định khoản chi rơi vào tháng nào |\n| **Phương thức** | Có | Chuyển khoản (mặc định), Tiền mặt, Thẻ, Khác |\n| **Số chứng từ** | Có | Tối đa 100 ký tự |\n| **Chứng từ đính kèm** | Có, ít nhất 1 tệp | Tối đa 10 tệp, mỗi tệp tối đa 20 MB, định dạng pdf, jpg, png |\n| **Ghi chú** | Không | Tối đa 1.000 ký tự. Ví dụ \"Thanh toán đợt 1 trong 90 tr đã duyệt.\" |\n| **Câu phân loại chi phí** | - | Cho biết khoản này vào số liệu nào (xem Lưu ý) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Ghi nhận<\/code> ở dòng đề xuất chờ thanh toán, hoặc <code>+ Ghi nhận thanh toán<\/code> ở thanh trên<\/td><td>Hộp mở; số tiền mặc định bằng phần còn phải trả. Không có đề xuất nào chờ: nút hiện mờ kèm \"Chưa có đề xuất nào ở trạng thái Đã duyệt để ghi nhận thanh toán.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Đề xuất chi<\/strong> (nếu chưa chọn sẵn)<\/td><td>Phần tóm tắt và câu phân loại chi phí cập nhật theo đề xuất<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập <strong>Số tiền<\/strong><\/td><td>Muốn trả một phần thì nhập số nhỏ hơn Còn phải trả. Dòng \"Sau lượt này\" cập nhật ngay<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Ngày thanh toán<\/strong>, <strong>Phương thức<\/strong>, nhập <strong>Số chứng từ<\/strong><\/td><td>Ngày thuộc kỳ đối soát đã chốt bị chặn, xem Lưu ý<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Tải <strong>Chứng từ đính kèm<\/strong>, nhập <strong>Ghi chú<\/strong> nếu cần<\/td><td>Tệp lỗi không được thêm: \"Tệp &lt;tên&gt; vượt 20 MB.\", \"Tối đa 10 tệp đính kèm.\", \"Định dạng tệp không được hỗ trợ.\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Ghi nhận<\/code><\/td><td>Hệ thống kiểm dữ liệu, báo lỗi tại ô nếu sai. Thành công: tạo lượt hiệu lực có mã <code>MKT-TT-<\/code>, thông báo \"Đã ghi nhận thanh toán &lt;mã lượt&gt; cho &lt;mã đề xuất&gt;.\"; nếu đủ tiền thêm \"Đề xuất chuyển sang Đã thanh toán.\" Mở từ màn Thanh toán thì lượt mới được chọn ở cột phải; mở từ Đề xuất chi thì ở lại đề xuất, khối \"Thanh toán đã ghi nhận\" có lượt mới<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn <code>Hủy<\/code> hoặc dấu X<\/td><td>Đóng hộp, không lưu; tệp vừa tải bị bỏ<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được ghi nhận:** Trưởng/Phó phòng, BGĐ. Chuyên viên và Trưởng nhóm không thấy nút. Người lập đề xuất vẫn ghi nhận được nếu thuộc các nhóm này (ghi nhận không phải là duyệt)\n* Chỉ ghi nhận cho đề xuất **Đã duyệt** chưa trả đủ: \"Chỉ thanh toán được đề xuất chi đã duyệt đủ bậc và chưa thanh toán.\"\n* Câu lỗi thường gặp: \"Số tiền thanh toán phải lớn hơn 0.\", \"Số tiền thanh toán vượt phần còn phải trả &lt;x&gt;.\", \"Phải nhập ngày trả.\", \"Ngày thanh toán không được sau hôm nay.\", \"Phải nhập số chứng từ.\", \"Đính kèm ít nhất một chứng từ thanh toán.\", \"Chứng từ đính kèm phải là tệp bạn vừa tải lên.\"\n* **Kỳ đã chốt đối soát:** nếu tháng của ngày thanh toán, kênh và công ty của đề xuất đã chốt ở [Đối soát](doi-soat.md), hệ thống chặn: \"Kỳ &lt;mm/yyyy&gt; của Kênh marketing «&lt;kênh&gt;» (&lt;công ty&gt;) đã chốt đối soát: không ghi nhận thanh toán vào kỳ này vì sẽ làm đổi Thực chi đã chốt. Chỉ ghi nhận được với ngày trả thuộc kỳ chưa chốt.\" Chọn ngày thuộc kỳ chưa chốt\n* **Câu phân loại chi phí** dưới hộp:\n  * Quảng cáo trả phí của Google, TikTok: \"Khoản này vào chi phí thực và chi phí quảng cáo (CPL, ROAS, ROI).\"\n  * Khoản mục khác: \"Khoản này vào chi phí thực, không vào chi phí quảng cáo.\"\n  * Nạp tiền tài khoản Meta: \"Khoản nạp tiền Meta không cộng vào chi phí thực vì chi phí tiêu thật đã có trong số Meta đồng bộ.\" Khoản này không bị chặn bởi kỳ đã chốt\n  * Khoản mục không tính vào thực chi: \"Khoản mục &lt;tên&gt; không tính vào chi phí thực.\"\n* Đề xuất gắn chiến dịch đã chốt chi phí: hộp hiện \"Chiến dịch &lt;mã&gt; đã chốt chi phí lúc dd/mm/yyyy hh:mm; khoản này không vào số chốt của chiến dịch.\" (không chặn)\n* Sau khi ghi nhận, người lập và người phụ trách đề xuất nhận thông báo \"Đề xuất chi &lt;mã&gt; đã được thanh toán &lt;x&gt; (&lt;đã trả&gt; / &lt;số tiền&gt;).\" Lượt vào chi phí thực theo **ngày thanh toán** từ lần tính kế tiếp, và hệ thống soát ngay [Cảnh báo vượt mức](canh-bao-vuot-muc.md)\n* Hai người cùng ghi nhận một đề xuất: người đến sau nhận \"Số tiền thanh toán vượt phần còn phải trả &lt;x&gt;.\" hoặc \"Đề xuất chi &lt;mã&gt; đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\"; dữ liệu đang nhập được giữ\n\n## <mark style=\"color:green;\">4. Hủy lượt thanh toán ghi nhầm<\/mark>\n\n<figure><img src=\"images/thanh-toan-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nút `Hủy lượt thanh toán`** | Ở chi tiết lượt (mục 2). Hiện mờ kèm chú giải khi đề xuất đã đối soát (\"Đề xuất đã đối soát, không hủy lượt được.\") hoặc kỳ đã chốt |\n| **Hộp Hủy lượt** | Tiêu đề \"Hủy lượt thanh toán &lt;mã&gt;?\", nội dung \"Lượt này không còn tính vào chi phí thực và phần đã trả của &lt;mã đề xuất&gt;. Không hoàn tác.\", ô **Lý do hủy** (bắt buộc, tối đa 1.000 ký tự), nút `Đóng` (mặc định) và `Hủy lượt` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm mã lượt cần hủy ở bảng lượt<\/td><td>Chi tiết lượt mở ở cột phải<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Hủy lượt thanh toán<\/code><\/td><td>Hộp Hủy lượt mở<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập <strong>Lý do hủy<\/strong>, nhấn <code>Hủy lượt<\/code><\/td><td>Thiếu lý do: \"Chưa nhập lý do hủy.\"; quá dài: \"Lý do hủy tối đa 1.000 ký tự.\" Thành công: lượt chuyển <strong>Đã hủy<\/strong>, chi tiết hiện khung Đã hủy; thông báo \"Đã hủy lượt thanh toán &lt;mã&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Ghi nhận lại lượt đúng (mục 3)<\/td><td>Đề xuất đã tính lại số đã trả; nếu thiếu tiền thì về <strong>Đã duyệt<\/strong> và quay lại khối chờ thanh toán<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chỉ BGĐ** được hủy lượt. Trưởng/Phó phòng chỉ ghi nhận, không hủy\n* Không hủy được khi đề xuất đã **Đã đối soát**, hoặc khi kỳ của lượt đã chốt: \"Lượt &lt;mã&gt; thuộc kỳ &lt;mm/yyyy&gt; đã chốt đối soát, không hủy được.\"\n* Lượt đã hủy không bị xóa: vẫn hiện trong bảng (lọc Trạng thái lượt = Đã hủy), không còn tính vào phần đã trả, chi phí thực, chi phí quảng cáo\n* Nếu đề xuất đã **Hoàn tất**, hủy một lượt sẽ bỏ trạng thái hoàn tất; đề xuất về Đã duyệt và ghi nhận tiếp được\n* Người lập và người phụ trách đề xuất nhận thông báo \"Lượt thanh toán &lt;mã&gt; của đề xuất chi &lt;mã đề xuất&gt; đã bị hủy: &lt;lý do&gt;\"\n* Lượt đã bị người khác hủy trước: \"Lượt thanh toán &lt;mã&gt; đã được &lt;tên&gt; hủy lúc HH:MM.\"\n* Không có lượt âm, không có hoàn tiền\n\n## <mark style=\"color:green;\">5. Hoàn tất thanh toán một phần<\/mark>\n\n<figure><img src=\"images/thanh-toan-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nút `Hoàn tất`** | Ở dòng của khối Đề xuất chờ thanh toán; Trưởng/Phó phòng, BGĐ còn thấy nút này ở chi tiết đề xuất trong màn Đề xuất chi. Hiện mờ kèm \"Đề xuất chưa có lượt thanh toán nào, không hoàn tất được.\" khi chưa trả đồng nào |\n| **Hộp Hoàn tất** | Tiêu đề \"Hoàn tất thanh toán &lt;mã&gt;?\", nội dung \"Đã trả &lt;x&gt; trên &lt;y&gt;. Phần còn lại &lt;z&gt; sẽ không thanh toán và không còn tính là đã cam kết. Không hoàn tác.\", ô **Lý do** (bắt buộc, tối đa 1.000 ký tự), nút `Đóng` (mặc định) và `Hoàn tất` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở khối <strong>Đề xuất chờ thanh toán<\/strong>, tìm đề xuất đã trả một phần và không trả thêm<\/td><td>Cột Đã trả lớn hơn 0 và nhỏ hơn Số tiền<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Hoàn tất<\/code><\/td><td>Hộp Hoàn tất mở<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập <strong>Lý do<\/strong>, nhấn <code>Hoàn tất<\/code><\/td><td>Thiếu lý do: \"Chưa nhập lý do hoàn tất.\" Thành công: đề xuất chuyển <strong>Đã thanh toán<\/strong>, rời khối chờ; thông báo \"Đã hoàn tất thanh toán &lt;mã đề xuất&gt;: thực trả &lt;x&gt;.\" Chi tiết đề xuất ghi \"Hoàn tất thanh toán một phần: &lt;người&gt; · dd/mm/yyyy\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai được hoàn tất:** Trưởng/Phó phòng, BGĐ\n* Dùng khi chi thực tế thấp hơn số đã duyệt. Phần còn lại không còn là tiền đã cam kết nên không còn trừ vào ngân sách, và không ghi nhận thêm được\n* Muốn trả tiếp sau khi đã hoàn tất: BGĐ hủy một lượt (mục 4) để mở lại đề xuất\n* Nếu mọi lượt của đề xuất đều thuộc kỳ đã chốt đối soát, đề xuất chuyển thẳng **Đã đối soát** ngay khi hoàn tất\n\n## <mark style=\"color:green;\">6. Phân quyền trên màn Thanh toán<\/mark>\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng | BGĐ |\n| --- | --- | --- | --- | --- |\n| Xem màn, lượt, đề xuất chờ thanh toán | Đề xuất mình lập hoặc phụ trách | Đề xuất của đội | Tất cả | Tất cả |\n| Ghi nhận thanh toán | Không | Không | Có | Có |\n| Hủy lượt thanh toán | Không | Không | Không | Có |\n| Hoàn tất thanh toán một phần | Không | Không | Có | Có |\n| Tải tệp chứng từ | Lượt xem được | Lượt xem được | Có | Có |\n| Xuất Excel | Có | Có | Có | Có |\n", "quan-ly-chi-phi-ngan-sach/doi-soat.md": "# Đối soát\n\n🧭 Tổng quan chức năng: Màn **Đối soát** dùng để mỗi tháng đối chiếu **chi phí thực** của từng kênh mà hệ thống ghi n
