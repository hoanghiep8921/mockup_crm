không xóa được giá vốn đã nạp: để trống ô nghĩa là giữ nguyên\n* Giá vốn 0 là hợp lệ, khác với để trống\n\n## <mark style=\"color:green;\">7. Tìm, xuất Excel<\/mark>\n\nCách chọn kỳ và bộ lọc xem phần đầu trang và [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md)\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhập từ khóa vào ô tìm<\/td><td>Tìm theo tên kênh, mã hoặc tên chiến dịch, mã đơn, tên khách hàng, không phân biệt hoa thường và dấu; tối đa 100 ký tự. Dòng TỔNG ghi \"TỔNG (n/m dòng khớp tìm kiếm)\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm tiêu đề cột để sắp xếp<\/td><td>Bấm lại để đảo chiều; ô \"-\" và dòng chưa gắn luôn ở cuối<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <code>Xuất Excel<\/code><\/td><td>Trình duyệt tải <code>DoanhThuGhiNhan_&lt;từ ngày&gt;_&lt;đến ngày&gt;.xlsx<\/code>. Ở chế độ Tổng hợp, tệp có bảng đang hiển thị; ở chế độ Chi tiết đơn, tệp có danh sách đơn. Đầu trang ghi kỳ, nhãn so sánh, cách cắt số liệu, \"Đang lọc: …\", \"Cập nhật lúc\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Tệp của Chuyên viên không có cột Giá vốn, Lợi nhuận gộp, Biên, ROI lợi nhuận gộp và không có danh sách đơn\n* Không có dòng nào thì không tải tệp, hiện \"Không có dữ liệu để xuất.\"; lỗi thì hiện \"Không xuất được tệp, vui lòng thử lại.\"\n", "bao-cao-du-lieu/hieu-qua-chien-dich.md": "# Hiệu quả chiến dịch\n\n🧭 Tổng quan chức năng: So sánh hiệu quả giữa các chiến dịch đã và đang chạy: ngân sách, chi phí, lead, đơn, doanh thu, CPL, ROAS, ROI và mức đạt mục tiêu, để rút kinh nghiệm cho chiến dịch sau. Màn dành cho Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng Marketing và BGĐ\n\nTruy cập: menu **Báo cáo dữ liệu → Hiệu quả Marketing → Hiệu quả chiến dịch**. Cũng mở được từ liên kết **Báo cáo hiệu quả chiến dịch** ở chi tiết chiến dịch ([Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md)) và ở [Đánh giá chiến dịch](../chien-dich/danh-gia-chien-dich.md)\n\n{% hint style=\"info\" %}\n\n## ĐIỂM RIÊNG CỦA NHÓM BÁO CÁO\n\nMàn dùng chung cách chọn kỳ, bộ lọc và danh sách dữ liệu gốc với Bảng điều khiển, xem [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md). Điểm khác ở màn này:\n\n* **Kỳ mặc định là Tháng này.** Kỳ và bộ lọc giữ khi chuyển qua lại giữa [Chi phí và Lead](chi-phi-va-lead.md), [Doanh thu ghi nhận](doanh-thu-ghi-nhan.md), Hiệu quả chiến dịch; tải lại trang thì về Tháng này, không lọc. Kỳ, bộ lọc không mang từ Bảng điều khiển sang\n* Màn có ô **Chế độ số liệu** với hai lựa chọn:\n  * **Lũy kế chiến dịch** (mặc định): mọi chỉ số của chiến dịch tính trên **toàn bộ** dữ liệu của chiến dịch, không cắt theo kỳ. Kỳ đang xem chỉ quyết định chiến dịch nào có mặt trong bảng. Số khớp với [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md) và [Đánh giá chiến dịch](../chien-dich/danh-gia-chien-dich.md)\n  * **Trong kỳ**: chỉ số cắt theo ngày phát sinh trong kỳ đang xem. Số của một chiến dịch khớp với [Tổng quan ngày](../bang-dieu-khien/tong-quan-ngay.md) khi lọc Chiến dịch = chiến dịch đó\n* Ở chế độ Lũy kế, bộ lọc dùng chung chỉ dùng để **chọn chiến dịch**, không cắt số. Chiều **Nguồn** và **Nhân viên** bị khóa, chú giải \"Chiều này không áp ở chế độ Lũy kế\"; giá trị đã chọn được giữ và áp lại khi về chế độ Trong kỳ\n* Màn **không có cột so với kỳ trước**; màn so với mục tiêu của chiến dịch\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem hiệu quả các chiến dịch<\/mark>\n\n<figure><img src=\"images/hieu-qua-chien-dich-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n<figure><img src=\"images/hieu-qua-chien-dich-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nẢnh trên là phần trái của bảng, ảnh dưới là phần phải sau khi cuộn ngang\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Đường dẫn \"Marketing › Báo cáo dữ liệu › Hiệu quả Marketing\", tiêu đề màn. Dòng mô tả dạng \"3 chiến dịch hoạt động trong kỳ · Kỳ 01/10/2026 – 03/10/2026\". Bên phải có ô tìm, `Xuất Excel`, `Làm mới` và dòng **Cập nhật lúc HH:MM** |\n| **Bộ lọc dùng chung và chọn kỳ** | Nhóm nút kỳ và khối **Bộ lọc dùng chung · N điều kiện** |\n| **Ô Chế độ số liệu** | Nhóm nút **Lũy kế chiến dịch** (mặc định), **Trong kỳ** |\n| **Dòng cách cắt số liệu** | \"Số liệu lũy kế toàn bộ chiến dịch, không cắt theo kỳ\" hoặc \"Số liệu theo ngày phát sinh trong kỳ dd/mm/yyyy – dd/mm/yyyy\" |\n| **Bảng chiến dịch** | Tiêu đề nhóm cột: Ngân sách (lũy kế), Quảng cáo, Lead, Bán hàng, Mục tiêu. Cột Chiến dịch cố định khi cuộn ngang. Mặc định xếp Chi phí quảng cáo giảm dần |\n| **Dòng TỔNG** | Cuối bảng |\n| **Chú thích dưới bảng** | \"Chi phí thực gồm chi phí Meta và các lượt thanh toán còn hiệu lực thuộc khoản mục tính vào thực chi, trừ khoản nạp tiền cho Meta; dùng để so với ngân sách. CPL, ROAS, ROI, Chi phí / cơ hội tính trên chi phí quảng cáo. Lead → Đơn = Đơn chốt / Lead. Lợi nhuận gộp = Doanh thu − Giá vốn. Dòng TỔNG chỉ gồm các chiến dịch trong bảng.\" |\n| **Nút Xuất PDF** | Dưới bảng |\n\n**Các cột của bảng:**\n\n| Nhóm | Cột | Ý nghĩa |\n| --- | --- | --- |\n| - | **Chiến dịch** | Tên chiến dịch; dòng phụ là mã dạng `CMP-yymm-nn` và thời gian chạy \"dd/mm – dd/mm · kết thúc thực dd/mm\". Bấm tên để mở chi tiết chiến dịch |\n| - | **Kênh** | Kênh triển khai của chiến dịch |\n| - | **Trạng thái** | Đang chạy (kèm \"Tạm dừng\" hoặc \"Chờ duyệt điều chỉnh\" nếu có), \"Đã duyệt · chờ ngày chạy\", Mới đồng bộ, Đã kết thúc kèm chip đánh giá \"Chưa đánh giá\", \"Đánh giá nháp\" hoặc \"Đã đánh giá\" |\n| Ngân sách (lũy kế) | **Ngân sách đã duyệt** | Ngân sách đã duyệt của cả chiến dịch |\n| Ngân sách (lũy kế) | **Chi phí thực** | Chi phí thực của cả chiến dịch, dùng để so với ngân sách |\n| Ngân sách (lũy kế) | **% đã dùng** | Chi phí thực ÷ Ngân sách đã duyệt, kèm thanh tiến độ |\n| Quảng cáo | **Chi phí quảng cáo** | Chi phí Meta và các lượt thanh toán quảng cáo trả phí của Google, TikTok. Số có gạch chân, bấm để mở danh sách khoản chi |\n| Quảng cáo | **Lượt hiển thị**, **Lượt nhấp** | Chỉ có với Meta |\n| Quảng cáo | **Khách hàng tiếp cận**, **Tần suất** | Số người xem duy nhất của cả chiến dịch và số lần xem trung bình; chỉ có với Meta, chỉ ở chế độ Lũy kế |\n| Lead | **Lead**, **CPL** | Lead của chiến dịch; CPL = Chi phí quảng cáo ÷ Lead |\n| Lead | **Đủ điều kiện**, **Cơ hội** | Khách tiềm năng đủ điều kiện; cơ hội của chiến dịch, kể cả cơ hội đã lưu trữ |\n| Lead | **Chi phí / cơ hội** | Chi phí quảng cáo ÷ Cơ hội |\n| Bán hàng | **Đơn chốt**, **Doanh thu** | Đơn chốt có nguồn Marketing của chiến dịch và tổng tiền |\n| Bán hàng | **Lead → Đơn** | Đơn chốt ÷ Lead |\n| Bán hàng | **ROAS**, **ROI** | Doanh thu ÷ Chi phí quảng cáo; (Doanh thu − Chi phí quảng cáo) ÷ Chi phí quảng cáo |\n| Bán hàng | **Lợi nhuận gộp** | Doanh thu − Giá vốn; còn đơn chưa có giá vốn thì ghi \"Chưa đủ giá vốn (x/y đơn)\" |\n| Mục tiêu | **% đạt Lead**, **% đạt Doanh thu**, **% đạt Tiếp cận** | Thực tế ÷ Mục tiêu của chiến dịch, một chữ số thập phân, kèm thanh. Chỉ ở chế độ Lũy kế |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Báo cáo dữ liệu → Hiệu quả Marketing → Hiệu quả chiến dịch<\/strong><\/td><td>Hệ thống mở màn với kỳ, bộ lọc đang giữ, chế độ <strong>Lũy kế chiến dịch<\/strong>. Bảng gồm các chiến dịch có thời gian hoạt động giao với kỳ đang xem<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn kỳ bao quanh các chiến dịch muốn so<\/td><td>Ví dụ chọn <code>Tùy chọn<\/code> từ 01/07/2026 đến 30/09/2026 để so các chiến dịch chạy trong quý 3. Kỳ chỉ quyết định chiến dịch nào có mặt<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc nhóm cột <strong>Ngân sách (lũy kế)<\/strong><\/td><td>So chi phí thực với ngân sách đã duyệt qua cột <strong>% đã dùng<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Cuộn ngang, đọc nhóm <strong>Quảng cáo<\/strong>, <strong>Lead<\/strong>, <strong>Bán hàng<\/strong><\/td><td>So CPL, Chi phí / cơ hội, Lead → Đơn, ROAS, ROI giữa các chiến dịch<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Đọc nhóm <strong>Mục tiêu<\/strong><\/td><td>Xem chiến dịch đạt bao nhiêu % mục tiêu lead, doanh thu, tiếp cận. Rê chuột lên ô để thấy \"Thực tế &lt;x&gt; / Mục tiêu &lt;y&gt; · Chênh lệch &lt;±z&gt;\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Bấm tiêu đề cột để sắp xếp; nhập ô tìm để lọc chiến dịch<\/td><td>Bấm lại để đảo chiều. Ô tìm theo mã hoặc tên chiến dịch; khi có chữ, dòng TỔNG ghi \"TỔNG (n/m dòng khớp tìm kiếm)\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Bấm <code>Làm mới<\/code> khi cần số mới nhất<\/td><td>Hệ thống tính lại và cập nhật dòng <strong>Cập nhật lúc HH:MM<\/strong><\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chiến dịch nào có mặt:** chiến dịch trong phạm vi bạn xem được, ở trạng thái đã cam kết (Đã duyệt, Đang đẩy, Đã đẩy chờ ngày chạy, Đang chạy kể cả Tạm dừng và Chờ duyệt điều chỉnh, Đã kết thúc) hoặc Mới đồng bộ. Không gồm Nháp, Chờ duyệt nội dung, Chờ duyệt ngân sách, Từ chối. Thời gian hoạt động tính từ ngày sớm hơn trong hai ngày \"ngày bắt đầu\" và \"ngày chạy thực tế\", tới ngày kết thúc thực tế (nếu đã kết thúc) hoặc ngày kết thúc\n* **Ai thấy chiến dịch nào:** Chuyên viên thấy chiến dịch mình xem được; Trưởng nhóm thấy chiến dịch của đội (Đội chủ là đội mình, hoặc được xem qua nhóm quảng cáo gán cho đội); Trưởng/Phó phòng, BGĐ thấy mọi chiến dịch. Số của một chiến dịch đã thấy là số của **cả chiến dịch**, không cắt theo người xem\n* **Mở từ liên kết của một chiến dịch:** màn mở với ô tìm điền sẵn mã chiến dịch, chế độ Lũy kế, kỳ bao quanh thời gian hoạt động của chiến dịch (tối đa 366 ngày, tính lùi từ ngày kết thúc thực tế hoặc hôm nay)\n* **Chuyên viên** không thấy cột Lợi nhuận gộp; số Đơn chốt, Doanh thu không mở được danh sách đơn\n* **Chi phí thực khác Chi phí quảng cáo:** Chi phí thực dùng để so với ngân sách; CPL, ROAS, ROI, Chi phí / cơ hội luôn tính trên Chi phí quảng cáo\n* **Kênh không có chi phí quảng cáo:** Chi phí quảng cáo, CPL, Chi phí / cơ hội, ROAS, ROI hiển thị \"-\"; Chi phí thực vẫn hiện\n* **Chiến dịch chưa nối chiến dịch UTM:** Chi phí thực, Chi phí quảng cáo, Lead, Đủ điều kiện, Cơ hội, Đơn chốt, Doanh thu và các tỷ số hiển thị \"-\" kèm chú giải \"Chưa nối chiến dịch UTM\"; Ngân sách đã duyệt vẫn hiện\n* **Mục tiêu:** mục tiêu bỏ trống hoặc bằng 0 thì \"-\"; chiến dịch chưa chạy hiển thị \"chưa chạy\"\n* **Dòng TỔNG** cộng ngân sách, chi phí, lượt hiển thị, lượt nhấp, lead, đủ điều kiện, cơ hội, đơn, doanh thu, lợi nhuận gộp (khi đủ giá vốn); các tỷ số tính lại từ tổng; Khách hàng tiếp cận, Tần suất, % đạt mục tiêu là \"-\". Dòng TỔNG chỉ gồm các chiến dịch trong bảng nên **không** so với dòng TỔNG của Bảng điều khiển\n* Không có chiến dịch nào thì hiện \"Không có chiến dịch nào hoạt động trong kỳ.\"; lỗi tải thì hiện \"Không tải được số liệu\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Đổi chế độ số liệu<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở ô <strong>Chế độ số liệu<\/strong>, chọn <strong>Trong kỳ<\/strong><\/td><td>Hệ thống tính lại ngay. Dòng trên bảng đổi thành \"Số liệu theo ngày phát sinh trong kỳ dd/mm/yyyy – dd/mm/yyyy\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc bảng<\/td><td>Chi phí quảng cáo, Lượt hiển thị, Lượt nhấp, Lead, Đủ điều kiện, Cơ hội, Đơn chốt, Doanh thu, Lợi nhuận gộp chỉ còn phần phát sinh trong kỳ. Nhóm cột Mục tiêu ẩn; Khách hàng tiếp cận, Tần suất hiển thị \"-\" kèm chú giải \"Người xem duy nhất chỉ có cho cả chiến dịch\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn lại <strong>Lũy kế chiến dịch<\/strong><\/td><td>Hệ thống về số lũy kế toàn bộ chiến dịch<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Ở **cả hai chế độ**, ba cột Ngân sách đã duyệt, Chi phí thực, % đã dùng luôn là số lũy kế của cả chiến dịch (tiêu đề cột ghi \"lũy kế\"), vì chỉ có nghĩa khi so với ngân sách của cả chiến dịch\n* Ở chế độ Trong kỳ, chiến dịch ngoài thời gian chạy mà vẫn có dữ liệu phát sinh trong kỳ (ví dụ đơn chốt sau khi kết thúc) cũng có mặt, kèm nhãn \"ngoài thời gian chạy\"\n* Ở chế độ Trong kỳ, mọi chiều của bộ lọc dùng chung đều cắt số. Chi phí chỉ lọc được theo Chiến dịch, Nền tảng, Nhóm, Sản phẩm; lọc theo chiều khác thì chi phí là số chưa lọc kèm \"Chi phí chưa lọc theo chiều này\", CPL, ROAS, ROI, Chi phí / cơ hội hiển thị \"-\"\n* Cùng một chiến dịch có hai bộ số khác nhau ở hai chế độ. Số \"Trong kỳ\" của chiến dịch X bằng dòng X ở [Chi phí và Lead](chi-phi-va-lead.md) và [Doanh thu ghi nhận](doanh-thu-ghi-nhan.md) khi xem theo chiến dịch, với Trưởng/Phó phòng và BGĐ\n\n## <mark style=\"color:green;\">3. Đọc số của chiến dịch đã kết thúc<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở chế độ <strong>Lũy kế chiến dịch<\/strong>, tìm chiến dịch có trạng thái Đã kết thúc<\/td><td>Số của chiến dịch là <strong>số chốt<\/strong>: lead, đơn chốt, doanh thu chốt lúc kết thúc; chi phí và số liệu Meta chốt lúc 06:00 ngày thứ 3 sau ngày kết thúc thực tế<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem nhãn <strong>Chi phí chưa chốt<\/strong><\/td><td>Trước lượt chốt chi phí, các ô chi phí và số liệu Meta là số đang tính, kèm nhãn \"Chi phí chưa chốt (chốt ngày dd/mm/yyyy)\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem dòng phụ <strong>Phát sinh sau chốt<\/strong><\/td><td>Khi dữ liệu hiện tại khác số chốt, dòng chiến dịch có thêm \"Phát sinh sau chốt: +n lead · +m đơn · +&lt;tiền&gt; doanh thu · +&lt;tiền&gt; chi phí\". Số chốt không đổi<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Muốn xem số phát sinh sau chốt theo kỳ<\/td><td>Chuyển sang chế độ <strong>Trong kỳ<\/strong>: chiến dịch Đã kết thúc dùng dữ liệu hiện tại cắt theo kỳ như mọi chiến dịch<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm chip đánh giá ở cột <strong>Trạng thái<\/strong><\/td><td>Hệ thống mở <a href=\"../chien-dich/danh-gia-chien-dich.md\">Đánh giá chiến dịch<\/a> của chiến dịch đó<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Số chốt ở đây bằng số ở tab Đã kết thúc của [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md) và ở [Đánh giá chiến dịch](../chien-dich/danh-gia-chien-dich.md)\n* Đủ điều kiện, Cơ hội, Lợi nhuận gộp không có số chốt; ba cột này tính trên dữ liệu hiện tại **giới hạn tới thời điểm chốt**, chú giải \"Tính tới lúc chốt, theo dữ liệu hiện tại\"\n\n## <mark style=\"color:green;\">4. Đi sâu từ một chiến dịch<\/mark>\n\nDanh sách dữ liệu gốc là danh sách dùng chung của Bảng điều khiển, xem [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md)\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm tên chiến dịch<\/td><td>Hệ thống mở chi tiết chiến dịch ở <a href=\"../chien-dich/danh-sach-chien-dich.md\">Danh sách chiến dịch<\/a>, tab Tổng quan<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm số <strong>Lead<\/strong>, <strong>Đủ điều kiện<\/strong>, <strong>Cơ hội<\/strong>, <strong>Đơn chốt<\/strong> hoặc <strong>Chi phí quảng cáo<\/strong><\/td><td>Hệ thống mở danh sách dữ liệu gốc của chiến dịch. Chế độ Trong kỳ: theo kỳ đang xem. Chế độ Lũy kế: không giới hạn ngày, dòng \"Đang lọc: Chiến dịch = &lt;mã&gt;; toàn bộ dữ liệu chiến dịch\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <code>Quay lại<\/code><\/td><td>Về màn Hiệu quả chiến dịch, giữ kỳ, bộ lọc, chế độ số liệu, ô tìm, cột sắp xếp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Với chiến dịch Đã kết thúc ở chế độ Lũy kế, danh sách là dữ liệu hiện tại nên có thể nhiều hơn số chốt. Đầu danh sách ghi \"Số chốt &lt;n&gt;; hiện có &lt;m&gt;\"\n* Chuyên viên không mở được danh sách đơn\n\n## <mark style=\"color:green;\">5. Xuất Excel và PDF<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kỳ, bộ lọc, chế độ số liệu, ô tìm và thứ tự sắp xếp như muốn xuất<\/td><td>Tệp lấy đúng tập chiến dịch và thứ tự đang hiện<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm <code>Xuất Excel<\/code><\/td><td>Trình duyệt tải <code>HieuQuaChienDich_&lt;từ ngày&gt;_&lt;đến ngày&gt;.xlsx<\/code>, cùng cột với màn theo chế độ đang chọn, thêm cột \"Phát sinh sau chốt\" khi có. Đầu trang ghi kỳ, cách cắt số liệu, \"Đang lọc: …\", \"Cập nhật lúc\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <code>Xuất PDF<\/code> dưới bảng<\/td><td>Hệ thống tạo tệp <code>HieuQuaChienDich_&lt;từ ngày&gt;_&lt;đến ngày&gt;.pdf<\/code>, khổ A4 ngang, dùng để họp tổng kết<\/td><\/tr>\n<\/tbody><\/table>\n\n**Nội dung tệp PDF:**\n\n| Phần | Nội dung |\n| --- | --- |\n| **Đầu trang** | \"Báo cáo hiệu quả chiến dịch\"; \"Kỳ dd/mm/yyyy – dd/mm/yyyy\"; chế độ số liệu và câu cách cắt; \"Đang lọc: …\"; \"Xuất bởi &lt;tên&gt; lúc dd/mm/yyyy hh:mm\" |\n| **Phần \"Ngân sách và quảng cáo\"** | Chiến dịch, Kênh, Trạng thái, Ngân sách đã duyệt, Chi phí thực, % đã dùng, Chi phí quảng cáo, Lượt hiển thị, Lượt nhấp, Khách hàng tiếp cận; có dòng TỔNG |\n| **Phần \"Kết quả\"** | Chiến dịch, Lead, CPL, Đủ điều kiện, Cơ hội, Chi phí / cơ hội, Đơn chốt, Doanh thu, Lead → Đơn, ROAS, ROI, Lợi nhuận gộp, % đạt Lead, % đạt Doanh thu; có dòng TỔNG |\n| **Chú thích** | Như chú thích dưới bảng trên màn |\n| **Chân trang** | \"Trang x/y\" |\n\n### ⚠️ Lưu ý\n\n* Tệp chỉ có chiến dịch trong phạm vi bạn xem được. Tệp của Chuyên viên không có cột Lợi nhuận gộp\n* Tệp PDF này so sánh nhiều chiến dịch; khác với báo cáo tổng kết PDF của một chiến dịch ở [Đánh giá chiến dịch](../chien-dich/danh-gia-chien-dich.md)\n* Không có chiến dịch nào thì không tạo tệp, hiện \"Không có dữ liệu để xuất.\"; lỗi thì hiện \"Không xuất được tệp, vui lòng thử lại.\"\n", "bao-cao-du-lieu/bao-cao-ngay-tuan-thang.md": "# Báo cáo ngày, tuần, tháng\n\n🧭 Tổng quan chức năng: Tổng hợp số liệu hoạt động Marketing theo ngày, tuần và tháng để báo cáo định kỳ. Báo cáo ngày được gửi email tự động lúc 09:00; báo cáo tháng được Trưởng/Phó phòng trình Ban giám đốc. Mọi nhóm Marketing đều xem được, mỗi người trong phạm vi dữ liệu của mình\n\nTruy cập: menu **Báo cáo dữ liệu → Báo cáo định kỳ → Báo cáo ngày / tuần / tháng**\n\n{% hint style=\"info\" %}\n\n## ĐIỂM RIÊNG VỀ KỲ VÀ BỘ LỌC\n\nBộ lọc dùng chung giống Bảng điều khiển, cách dùng xem ở [Bộ lọc và kỳ báo cáo](../bang-dieu-khien/bo-loc-va-ky-bao-cao.md). Màn này **không** dùng nhóm nút kỳ Hôm nay / 7 ngày / Tháng này / Tùy chọn, mà chọn kỳ theo chế độ:\n\n* **Ngày:** mặc định **Hôm qua** (ngày đã trọn). Có nút `Hôm qua`, `Hôm nay` và ô chọn ngày\n* **Tuần:** thứ Hai đến Chủ nhật, mặc định **tuần liền trước**. Có nút `Tuần trước`, `Tuần này` và ô chọn tuần\n* **Tháng:** tháng lịch, mặc định **tháng liền trước**. Có ô chọn tháng\n* **Kỳ trước** là khoảng liền trước **cùng số ngày**, không phải \"cả tháng trước\". Ví dụ tháng 9/2026 (30 ngày) so với 02/08/2026 – 31/08/2026\n* Bộ lọc chỉ áp cho **bảng chỉ số** và danh sách bản ghi nguồn. Ba khối của báo cáo tháng, email tự động và bản trình BGĐ **không** áp bộ lọc\n* Bộ lọc giữ khi đổi Ngày, Tuần, Tháng. Tải lại trang thì giữ chế độ và kỳ, chỉ mất bộ lọc. Mở lại từ menu thì về Ngày, kỳ Hôm qua\n\n## QUY TRÌNH TRÌNH BÁO CÁO THÁNG\n\nBước 1: Ngày mùng 1 hằng tháng, hệ thống tạo báo cáo của tháng vừa kết thúc ở trạng thái **Nháp**\n\nBước 2: Trưởng/Phó phòng nhập **Nhận xét của trưởng phòng**, bấm `Lưu nhận xét` (lưu được nhiều lần)\n\nBước 3: Trưởng/Phó phòng bấm `Trình BGĐ`. Hệ thống chụp lại số liệu toàn phòng, chuyển **Đã trình** và giao việc \"Xem báo cáo tháng mm/yyyy\" cho Ban giám đốc\n\nBước 4: BGĐ đọc bản đã trình, bấm `BGĐ đã xem` (kết thúc) hoặc `Trả lại` kèm ý kiến\n\nBước 5: Bị trả lại thì báo cáo ở trạng thái **Trả lại**; Trưởng/Phó phòng sửa nhận xét và trình lại (vòng mới)\n\n| Trạng thái | Ý nghĩa | Ai làm gì |\n| --- | --- | --- |\n| **Nháp** | Báo cáo mới tạo hoặc đang soạn nhận xét | Trưởng/Phó phòng lưu nhận xét, trình BGĐ |\n| **Đã trình** | Đã gửi BGĐ, nhận xét bị khóa | BGĐ bấm `BGĐ đã xem` hoặc `Trả lại` |\n| **BGĐ đã xem** | BGĐ đã xem xong, là trạng thái cuối | Không ai sửa được |\n| **Trả lại** | BGĐ yêu cầu sửa | Trưởng/Phó phòng sửa nhận xét, trình lại |\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem báo cáo ngày<\/mark>\n\n<figure><img src=\"images/bao-cao-ngay-tuan-thang-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Đường dẫn \"Marketing › Báo cáo dữ liệu › Báo cáo định kỳ\", tiêu đề \"Báo cáo ngày / tuần / tháng\", dòng phụ \"Báo cáo ngày · dd/mm/yyyy\". Bên phải: nhóm nút `Ngày`, `Tuần`, `Tháng`; `Làm mới`, `Xuất Excel`, `Xuất PDF` |\n| **Dòng chọn kỳ** | Nút `Hôm qua`, `Hôm nay` và ô chọn ngày `dd/mm/yyyy` |\n| **Bộ lọc dùng chung** | Khối thu gọn, như Bảng điều khiển |\n| **Dòng Cập nhật lúc** | Giờ tính số, nhãn so sánh (ví dụ \"so với hôm trước (dd/mm/yyyy)\"), giờ đồng bộ chi phí gần nhất |\n| **Bảng chỉ số** | Bảy dòng chỉ số, các cột Kỳ này, Kỳ trước, Chênh lệch, Kế hoạch, % đạt, Định nghĩa / nguồn |\n| **Chú thích dưới bảng** | \"Kế hoạch lấy từ chỉ tiêu của kế hoạch Marketing đã duyệt, chia theo ngày.\" |\n| **Khối Gửi báo cáo ngày tự động** | Cuối màn, chỉ Trưởng/Phó phòng, BGĐ thấy (xem mục 6) |\n\n**Bảy chỉ số:**\n\n| Chỉ số | Định nghĩa / nguồn |\n| --- | --- |\n| **Lead mới** | Khách tiềm năng tạo trong kỳ |\n| **Cơ hội mới** | Cơ hội tạo trong kỳ, kể cả đã lưu trữ |\n| **Đơn chốt** | Đơn đã xác nhận có lead Marketing nguồn, theo ngày đặt đơn |\n| **Doanh thu** | Tổng tiền đơn chốt có nguồn Marketing, gồm thuế |\n| **Chi phí quảng cáo** | Tiền tài khoản quảng cáo Meta, Google, TikTok, không gồm KOL, in ấn |\n| **Số bài đăng** | Bài trạng thái Đã đăng, thời điểm đăng trong kỳ |\n| **Chiến dịch chạy trong kỳ** | Chiến dịch có thời gian chạy thực tế giao với kỳ |\n\n**Các cột:**\n\n| Cột | Ý nghĩa |\n| --- | --- |\n| **Kỳ này** | Số của kỳ đang xem. Số có gạch chân, bấm để mở danh sách bản ghi nguồn |\n| **Kỳ trước** | Số của kỳ liền trước cùng số ngày, cùng bộ lọc. Không bấm được |\n| **Chênh lệch** | % thay đổi, một chữ số thập phân, có dấu \"+\" hoặc \"−\". Tăng là tốt, giảm là xấu; riêng Chi phí quảng cáo giảm là tốt, tăng là xấu. Kỳ trước bằng 0 thì \"-\" |\n| **Kế hoạch**, **% đạt** | Chỉ ở dòng Lead mới và Doanh thu: chỉ tiêu của kế hoạch Marketing đã duyệt, chia theo số ngày của kỳ. Các dòng khác \"-\" |\n| **Định nghĩa / nguồn** | Câu giải thích cố định của từng chỉ số |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn menu <strong>Báo cáo dữ liệu → Báo cáo định kỳ → Báo cáo ngày / tuần / tháng<\/strong><\/td><td>Hệ thống mở chế độ <strong>Ngày<\/strong>, kỳ <strong>Hôm qua<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn ngày khác (nếu cần)<\/td><td>Bấm <code>Hôm nay<\/code>, hoặc nhập, chọn ngày ở ô ngày. Không chọn được ngày sau hôm nay. Nhập sai định dạng thì báo \"Ngày không đúng định dạng dd/mm/yyyy\", giữ kỳ cũ<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đặt bộ lọc dùng chung (nếu cần), bấm <code>Áp dụng<\/code><\/td><td>Bảng chỉ số tính lại theo bộ lọc. Bấm <code>Xóa bộ lọc<\/code> để về \"Tất cả\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đọc bảng chỉ số<\/td><td>So kỳ này với kỳ trước qua cột <strong>Chênh lệch<\/strong>; so Lead mới, Doanh thu với kế hoạch qua cột <strong>% đạt<\/strong>. Rê chuột lên số tiền rút gọn để xem giá trị đầy đủ<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm <code>Làm mới<\/code> khi cần số mới nhất<\/td><td>Hệ thống tính lại ngay và cập nhật dòng <strong>Cập nhật lúc HH:MM<\/strong>. Màn không tự làm mới<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy dữ liệu gì:** Chuyên viên thấy dữ liệu của mình; Trưởng nhóm thấy dữ liệu đội mình; Trưởng/Phó phòng, BGĐ thấy toàn bộ. Số bài đăng theo đội của người lên lịch bài; Chiến dịch chạy trong kỳ theo phạm vi xem chiến dịch\n* **Chuyên viên** không có cột Kế hoạch, % đạt; ô Đơn chốt, Doanh thu có biểu tượng khóa, không mở được danh sách đơn\n* **Kế hoạch theo vai trò:** Trưởng/Phó phòng, BGĐ dùng chỉ tiêu toàn phòng; Trưởng nhóm dùng tổng chỉ tiêu các đội mình. Chưa có kế hoạch đã duyệt cho kỳ thì hai cột \"-\" kèm \"Chưa có kế hoạch đã duyệt cho kỳ này\". Lọc theo chiều không có chỉ tiêu thì hai cột \"-\"\n* **Kỳ Hôm nay** là kỳ chưa trọn: dòng Cập nhật lúc có nhãn \"chưa trọn ngày\", chênh lệch Chi phí quảng cáo là \"-\" tới hết ngày, dưới bảng có \"Kỳ chưa trọn: thời gian đã qua m%\"\n* **Khớp với Tổng quan ngày:** năm dòng Lead mới, Cơ hội mới, Đơn chốt, Doanh thu, Chi phí quảng cáo tính cùng cách với [Tổng quan ngày](../bang-dieu-khien/tong-quan-ngay.md); cùng kỳ, cùng phạm vi, cùng bộ lọc thì số bằng nhau\n* **Chiến dịch chạy trong kỳ** khác ô \"Chiến dịch đang chạy\" của Tổng quan ngày: dòng này đếm mọi chiến dịch có thời gian chạy thực tế giao với kỳ, kể cả chiến dịch đã kết thúc trong kỳ hoặc tạm dừng một phần kỳ; không đếm chiến dịch chưa tới ngày chạy\n* **Số bài đăng** đếm mỗi bài một lần dù đăng lên nhiều Fanpage. Bài Lỗi, Đã hủy, Đã hẹn giờ, Đang đăng không tính\n* **Lọc Số bài đăng, Chiến dịch chạy trong kỳ:** hai dòng này lọc được theo Chiến dịch, Nền tảng, Nhóm, Nhân viên, Sản phẩm. Chiều không lọc được thì giữ số chưa lọc kèm \"Chưa lọc theo chiều này\"\n* Lỗi tải thì màn giữ kỳ, bộ lọc và hiện \"Không tải được số liệu.\" kèm nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem báo cáo tuần<\/mark>\n\n<figure><img src=\"images/bao-cao-ngay-tuan-thang-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nBáo cáo tuần có cùng bố cục, cùng bảng chỉ số với báo cáo ngày; khác ở dòng chọn kỳ và không có khối gửi email\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm <code>Tuần<\/code> trên thanh tiêu đề<\/td><td>Hệ thống mở báo cáo tuần liền trước, giữ bộ lọc đang áp<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn tuần ở ô chọn tuần, hoặc bấm <code>Tuần trước<\/code>, <code>Tuần này<\/code><\/td><td>Ô hiển thị \"Tuần nn/yyyy (dd/mm – dd/mm/yyyy)\". Không chọn được tuần bắt đầu sau hôm nay. <code>Tuần này<\/code> là thứ Hai đến hôm nay, mang nhãn \"chưa trọn ngày\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc bảng chỉ số<\/td><td>Nhãn so sánh ví dụ tuần 05/10 – 11/10/2026: \"so với 7 ngày liền trước (28/09 – 04/10/2026)\". Kế hoạch là chỉ tiêu chia theo 7 ngày của tuần<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Báo cáo tuần không gửi email tự động\n\n## <mark style=\"color:green;\">3. Xem báo cáo tháng<\/mark>\n\n<figure><img src=\"images/bao-cao-ngay-tuan-thang-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Ô Tháng báo cáo** | Chọn tháng `mm/yyyy`. Đổi tháng là tính lại ngay |\n| **Nhãn trạng thái tháng** | Cạnh ô tháng: Nháp, Đã trình, BGĐ đã xem, Trả lại; tháng chưa kết thúc ghi \"Chưa kết thúc\". Chỉ Trưởng/Phó phòng, BGĐ thấy |\n| **Nhãn bản chụp, nút Xem số liệu hiện tại / Xem bản đã trình** | Khi báo cáo đã trình: mặc định hiện số đã chụp lúc trình, nhãn \"Số liệu chụp lúc trình dd/mm/yyyy hh:mm\" |\n| **Dòng Kế hoạch tháng** | \"Kế hoạch tháng: &lt;mã kế hoạch&gt; (Đã duyệt)\"; không có thì \"Chưa có kế hoạch tháng đã duyệt\" |\n| **Bảng chỉ số** | Như báo cáo ngày |\n| **Khối Trình báo cáo tháng** | Chỉ Trưởng/Phó phòng, BGĐ thấy (xem mục 7, 8) |\n| **Khối Hiệu quả chiến dịch · tháng mm/yyyy** | Bảng của màn [Hiệu quả chiến dịch](hieu-qua-chien-dich.md) ở chế độ **Trong kỳ**, kỳ là tháng đang xem. Bấm mã chiến dịch mở chi tiết chiến dịch |\n| **Khối Hiệu suất đội nhóm · tháng mm/yyyy** | Bảng theo đội của màn [Hiệu suất đội nhóm](../bang-dieu-khien/hieu-suat-doi-nhom.md) chế độ Theo đội, kỳ là tháng đang xem |\n| **Khối So với chỉ tiêu theo sản phẩm · tháng mm/yyyy** | Mỗi chỉ tiêu sản phẩm giao với tháng một dòng: Mã chỉ tiêu, Sản phẩm, Chỉ tiêu lead, Lead thực tế, % đạt lead, Chỉ tiêu doanh thu, Doanh thu thực tế, % đạt doanh thu; dòng Tổng |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm <code>Tháng<\/code> trên thanh tiêu đề<\/td><td>Hệ thống mở báo cáo tháng liền trước<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn tháng khác ở ô <strong>Tháng báo cáo<\/strong> (nếu cần)<\/td><td>Không chọn được tháng sau tháng hiện tại. Nhập sai báo \"Tháng không đúng định dạng mm/yyyy\". Chọn tháng hiện tại thì kỳ là mùng 1 đến hôm nay, nhãn \"chưa trọn ngày\", kế hoạch chia theo số ngày đã qua<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc bảng chỉ số và ba khối bên dưới<\/td><td>Bảng chỉ số tóm tắt kết quả tháng; ba khối cho chi tiết theo chiến dịch, theo đội và theo sản phẩm<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Với tháng đã trình: bấm <code>Xem số liệu hiện tại<\/code> (nếu cần)<\/td><td>Hệ thống tính số theo dữ liệu hiện tại. Bấm <code>Xem bản đã trình<\/code> để quay về bản chụp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Bản đã trình không đổi:** lúc trình, hệ thống chụp lại số toàn phòng, không lọc. Dữ liệu nguồn đổi sau đó (lead được thẩm định, chi phí đồng bộ muộn) không làm đổi bản chụp. Khi xem bản chụp, bộ lọc dùng chung bị khóa, chú giải \"Bản đã trình là số toàn phòng, không lọc\"\n* Chuyên viên, Trưởng nhóm không thấy khối trình và luôn xem số hiện tại theo phạm vi của mình\n* **Ba khối không áp bộ lọc dùng chung.** Khi đang lọc, mỗi khối có dòng \"Khối này không áp bộ lọc dùng chung\"\n* **Khối Hiệu quả chiến dịch** dùng chế độ Trong kỳ, nên không có cột mục tiêu; Khách hàng tiếp cận, Tần suất là \"-\". Số bằng màn Hiệu quả chiến dịch chế độ Trong kỳ cùng tháng. Số chiến dịch của khối có thể khác dòng \"Chiến dịch chạy trong kỳ\" của bảng chỉ số vì khối gồm cả chiến dịch đã duyệt chưa tới ngày chạy và chiến dịch có phát sinh ngoài thời gian chạy\n* **Khối Hiệu suất đội nhóm** chỉ hiện từ Trưởng nhóm trở lên; Trưởng nhóm thấy đội mình\n* **Khối So với chỉ tiêu theo sản phẩm** có số bằng màn [Chỉ tiêu theo sản phẩm](../ke-hoach/chi-tieu-theo-san-pham.md) cùng kỳ. Không có chỉ tiêu thì hiện \"Chưa có chỉ tiêu sản phẩm cho tháng mm/yyyy.\"\n* Người không xem được màn Hiệu quả chiến dịch thì không thấy khối Hiệu quả chiến dịch\n* Tháng không có chiến dịch hoạt động: khối hiện \"Không có chiến dịch hoạt động trong tháng mm/yyyy.\"; không có đội có số liệu: \"Chưa có số liệu theo đội cho tháng mm/yyyy.\"\n* Một khối lỗi thì khối đó hiện \"Không tải được dữ liệu.\" kèm `Thử lại`; các khối khác vẫn hiển thị. Bản chụp lỗi thì hiện \"Không tải được bản đã trình.\" kèm `Thử lại`\n\n## <mark style=\"color:green;\">4. Mở danh sách bản ghi nguồn<\/mark>\n\n<figure><img src=\"images/bao-cao-ngay-tuan-thang-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | \"&lt;Tên chỉ số&gt; · &lt;kỳ&gt; · N bản ghi\", ví dụ \"Lead mới · 12/10/2026 · 148 bản ghi\"; Chi phí quảng cáo ghi tổng tiền |\n| **Dòng Đang lọc** | Liệt kê các chiều đang lọc |\n| **Danh sách** | Lead mới, Cơ hội mới, Đơn chốt (cả dòng Doanh thu), Chi phí quảng cáo mở danh sách dữ liệu gốc dùng chung của Bảng điều khiển. Số bài đăng mở danh sách bài đăng; Chiến dịch chạy trong kỳ mở danh sách chiến dịch |\n| **Nút Quay lại** | Về màn báo cáo |\n\n**Hai danh sách riêng của màn này:**\n\n| Danh sách | Cột | Bấm dòng |\n| --- | --- | --- |\n| **Bài đăng** | Mã bài, Nội dung, Kênh đăng, Fanpage, Thời điểm đã đăng, Chiến dịch, Người lên lịch, Đội | Mở bài đăng ở [Lịch xuất bản](../noi-dung-va-media/lich-xuat-ban.md) |\n| **Chiến dịch** | Mã, Tên, Kênh, Đội chủ, Người phụ trách, Ngày chạy thực tế, Ngày kết thúc thực tế, Trạng thái | Mở chi tiết chiến dịch ở [Danh sách chiến dịch](../chien-dich/danh-sach-chien-dich.md) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm số có gạch chân ở cột <strong>Kỳ này<\/strong><\/td><td>Hệ thống mở danh sách đúng kỳ, bộ lọc và phạm vi của bạn. Tổng bản ghi (với Chi phí quảng cáo là tổng tiền) bằng số đã bấm<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Lọc nhanh, sắp xếp, bấm dòng<\/td><td>Ô lọc nhanh tối đa 100 ký tự; khi lọc hiện \"N khớp trên tổng M\". Bấm dòng mở bản ghi gốc<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm <code>Quay lại<\/code><\/td><td>Về màn báo cáo, giữ chế độ, kỳ, bộ lọc<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Số 0 không gạch chân, không bấm được. Cột Kỳ trước, Kế hoạch không bấm được\n* Chuyên viên bấm Đơn chốt, Doanh thu không mở được danh sách, thấy chú giải \"Không mở được danh sách đơn hàng\". Gọi danh sách đơn bằng đường khác sẽ bị chặn: \"Bạn chưa được cấp quyền xem danh sách đơn hàng. Số tổng vẫn hiển thị trên bảng điều khiển. Liên hệ trưởng phòng nếu cần xem chi tiết đơn.\"\n* Bấm số khi đang xem bản chụp báo cáo tháng thì danh sách lấy theo dữ liệu hiện tại, có dòng \"Danh sách theo dữ liệu hiện tại, có thể khác số đã trình.\"; tổng có thể khác số đã bấm\n* Lỗi tải danh sách thì hiện \"Không tải được dữ liệu.\" kèm `Thử lại`\n\n## <mark style=\"color:green;\">5. Xuất Excel, PDF<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn chế độ, kỳ, bộ lọc như muốn xuất<\/td><td>Tệp lấy đúng số đang hiển thị. Báo cáo tháng đang xem bản chụp thì lấy bản chụp<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm <code>Xuất Excel<\/code> hoặc <code>Xuất PDF<\/code><\/td><td>Nút khóa trong lúc tạo tệp, chú giải \"Đang tạo tệp…\". Trình duyệt tải tệp; bạn ở lại màn<\/td><\/tr>\n<\/tbody><\/table>\n\n**Tên và nội dung tệp:**\n\n| Chế độ | Tên tệp |\n| --- | --- |\n| Ngày | `BaoCaoNgay_yyyymmdd.xlsx` (hoặc `.pdf`) |\n| Tuần | `BaoCaoTuan_<từ ngày>_<đến ngày>.xlsx` (hoặc `.pdf`), ngày dạng yyyymmdd |\n| Tháng | `BaoCaoThang_<từ ngày>_<đến ngày>.xlsx` (hoặc `.pdf`), ngày dạng yyyymmdd |\n\n* Đầu tệp: tên báo cáo, kỳ, kỳ so sánh, dòng \"Đang lọc: …\" nếu có, \"Cập nhật lúc dd/mm/yyyy hh:mm\", người xuất. Xuất từ bản chụp thì ghi \"Số liệu chụp lúc trình dd/mm/yyyy hh:mm\" và trạng thái\n* Thân tệp: bảng chỉ số đủ cột đang hiển thị, kèm cột Định nghĩa / nguồn. Báo cáo tháng thêm ba khối; người xem được khối trình thì có thêm nhận xét, trạng thái, ý kiến BGĐ\n* Tiền là số VND đầy đủ; ô \"-\" giữ nguyên \"-\". Tệp PDF khổ A4 ngang, bảng rộng xuống nhiều trang và lặp dòng tiêu đề cột\n\n### ⚠️ Lưu ý\n\n* Tệp của Chuyên viên không có cột Kế hoạch, % đạt và không kèm danh sách đơn\n* Số liệu chưa tải xong hoặc đang lỗi thì hai nút khóa, chú giải \"Chờ tải xong số liệu để xuất.\"\n* Lỗi tạo tệp thì hiện \"Không xuất được tệp, vui lòng thử lại.\"\n\n## <mark style=\"color:green;\">6. Cài lịch gửi báo cáo ngày tự động<\/mark>\n\n<figure><img src=\"images/bao-cao-ngay-tuan-thang-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ Trưởng/Phó phòng và BGĐ thấy và sửa khối này. Khối nằm cuối màn, ở chế độ Ngày. Cả phòng dùng chung một lịch gửi\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bật gửi tự động** | Công tắc, mặc định Bật |\n| **Người nhận** | Chọn nhiều người dùng hệ thống đang hoạt động, bắt buộc ít nhất một. Mặc định là mọi Trưởng/Phó phòng Marketing |\n| **CC bộ phận liên quan** | Chọn người dùng hoặc nhập địa chỉ email ngoài hệ thống, tối đa 20 |\n| **Giờ gửi hằng ngày** | \"09:00\", chỉ đọc |\n| **Chú thích** | \"Gửi 09:00 (giờ Việt Nam) mỗi ngày · số liệu toàn phòng của ngày hôm trước, không áp bộ lọc · đính kèm tệp Excel của báo cáo ngày.\" |\n| **Nút Lưu lịch gửi** | Lưu cấu hình |\n| **Dòng Lần gửi gần nhất** | \"Lần gửi gần nhất: dd/mm/yyyy hh:mm · Báo cáo ngày dd/mm/yyyy · Đã gửi\", hoặc \"Gửi lỗi: &lt;lý do&gt;\", hoặc \"Không gửi được trong ngày\" |\n| **Nút Gửi thử cho tôi** | Gửi ngay báo cáo ngày hôm qua tới email của chính bạn |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở báo cáo ngày, cuộn xuống khối <strong>Gửi báo cáo ngày tự động<\/strong><\/td><td>Khối hiện cấu hình đang dùng và kết quả lần gửi gần nhất<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Người nhận<\/strong><\/td><td>Bỏ hết người nhận thì báo \"Chọn ít nhất một người nhận.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Thêm <strong>CC bộ phận liên quan<\/strong> (không bắt buộc)<\/td><td>Email ngoài hệ thống phải đúng dạng <code>ten@mien.tld<\/code>, tối đa 254 ký tự; sai thì báo \"Địa chỉ email &lt;địa chỉ&gt; không hợp lệ.\". Quá 20 người thì báo \"Tối đa 20 người nhận CC.\". Địa chỉ trùng tự bỏ bớt<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bật hoặc tắt công tắc <strong>Bật gửi tự động<\/strong><\/td><td>Tắt thì hệ thống không gửi lúc 09:00<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm <code>Lưu lịch gửi<\/code><\/td><td>Hệ thống hiện \"Đã lưu lịch gửi báo cáo ngày.\", áp từ lần gửi kế tiếp. Có ô sai thì báo tại ô, không lưu, giữ giá trị đang nhập<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Bấm <code>Gửi thử cho tôi<\/code> để kiểm tra (nếu cần)<\/td><td>Hệ thống gửi báo cáo ngày hôm qua tới email của bạn, hiện \"Đã gửi thử tới &lt;email&gt;.\". Lần gửi thử không tính là lần gửi trong ngày<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Hệ thống gửi lúc 09:00 giờ Việt Nam mỗi ngày, kể cả thứ Bảy, Chủ nhật.** Thư có tiêu đề \"[Datyso MKT] Báo cáo ngày dd/mm/yyyy\", thân thư là bảng 7 chỉ số (Kỳ này, Kỳ trước, Chênh lệch) và liên kết mở báo cáo trên hệ thống, kèm tệp `BaoCaoNgay_yyyymmdd.xlsx`\n* **Thư luôn mang số toàn phòng** của ngày hôm qua, không áp bộ lọc, kể cả khi người nhận không phải Trưởng/Phó phòng hoặc BGĐ. Cân nhắc khi thêm người nhận, CC\n* Ngày không có dữ liệu vẫn gửi, các số bằng 0\n* Mỗi ngày dữ liệu chỉ gửi một lần. Máy chủ không chạy lúc 09:00 thì gửi bù trong cùng ngày; qua ngày thì ghi \"Không gửi được trong ngày\"\n* Gửi lỗi thì hệ thống thử lại tối đa 3 lần, cách 10 phút; vẫn lỗi thì ghi \"Gửi lỗi: &lt;lý do&gt;\". Người nhận đã ngừng hoạt động thì bị bỏ qua, dòng kết quả ghi \"Bỏ qua &lt;tên&gt;: tài khoản ngừng hoạt động\"\n* Báo cáo tuần, tháng không gửi email tự động\n\n## <mark style=\"color:green;\">7. Trình báo cáo tháng lên BGĐ<\/mark>\n\n<figure><img src=\"images/bao-cao-ngay-tuan-thang-7.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ Trưởng/Phó phòng Marketing. Khối **Trình báo cáo tháng** nằm dưới bảng chỉ số của báo cáo tháng\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thẻ trạng thái** | Nháp, Đã trình, BGĐ đã xem, Trả lại |\n| **Nhận xét của trưởng phòng** | Ô văn bản nhiều dòng, tối đa 5.000 ký tự. Sửa được ở Nháp, Trả lại |\n| **Nút** | `Lưu nhận xét`, `Trình BGĐ` |\n| **Dòng thông tin vòng trình** | \"Trình lúc dd/mm/yyyy hh:mm bởi &lt;tên&gt; · vòng n\" |\n| **Bảng lịch sử** | Thời điểm, Người, Thao tác (Lưu nhận xét, Trình BGĐ, BGĐ đã xem, Trả lại), Nội dung, Bản chụp (liên kết tải \"Excel\", \"PDF\" của vòng trình). Mới nhất ở trên, không sửa, không xóa |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở báo cáo tháng đã kết thúc<\/td><td>Ngày mùng 1, hệ thống đã tạo báo cáo của tháng vừa qua ở trạng thái Nháp. Nếu chưa có, hệ thống tạo khi bạn lưu nhận xét hoặc trình lần đầu<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Bấm <code>Xóa bộ lọc<\/code> nếu đang lọc<\/td><td>Báo cáo trình BGĐ luôn là số toàn phòng; khi đang lọc, nút <code>Trình BGĐ<\/code> khóa, chú giải \"Bỏ bộ lọc dùng chung để trình báo cáo toàn phòng.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập <strong>Nhận xét của trưởng phòng<\/strong>, bấm <code>Lưu nhận xét<\/code><\/td><td>Hệ thống lưu, không đổi trạng thái, hiện \"Đã lưu nhận xét báo cáo tháng mm/yyyy.\". Lịch sử ghi \"Lưu nhận xét\". Lưu được nhiều lần<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Bấm <code>Trình BGĐ<\/code><\/td><td>Hệ thống chụp số liệu toàn phòng (bảng chỉ số, ba khối) kèm tệp Excel, PDF; chuyển <strong>Đã trình<\/strong>; khóa nhận xét; giao việc \"Xem báo cáo tháng mm/yyyy\" cho mọi người thuộc BGĐ; hiện \"Đã trình báo cáo tháng mm/yyyy lên Ban giám đốc.\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Khi bị trả lại: mở việc \"Sửa và trình lại báo cáo tháng mm/yyyy\"<\/td><td>Báo cáo ở trạng thái <strong>Trả lại<\/strong>, ý kiến BGĐ ghi ở lịch sử. Sửa nhận xét rồi bấm <code>Trình BGĐ<\/code>: hệ thống mở vòng mới, chụp số mới, đóng việc sửa<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ trình được **tháng đã kết thúc**. Tháng hiện tại, khối trình hiện \"Báo cáo tháng mm/yyyy trình được từ ngày 01/mm/yyyy.\"; trình bằng đường khác bị chặn \"Tháng mm/yyyy chưa kết thúc, chưa trình được.\"\n* Nhận xét bắt buộc khi trình: để trống thì báo \"Nhập nhận xét trước khi trình.\"; quá dài thì báo \"Nhận xét tối đa 5.000 ký tự.\"\n* BGĐ không trình báo cáo tháng\n* Rời màn khi nhận xét chưa lưu thì hệ thống hỏi \"Nhận xét chưa lưu sẽ mất. Rời màn?\"\n* Ở trạng thái Trả lại, nếu đang bấm `Xem số liệu hiện tại` thì vẫn trình được và hệ thống chụp số mới\n* Chụp số liệu lỗi thì không chuyển trạng thái, hiện \"Không chụp được số liệu báo cáo, vui lòng thử lại.\"\n* Không còn người BGĐ nào đủ điều kiện nhận việc thì báo cáo giữ Đã trình, khối hiện \"Chưa có người khác có quyền duyệt báo cáo tháng này.\"\n* Hai Trưởng/Phó phòng cùng lưu nhận xét thì người lưu sau ghi đè, lịch sử ghi cả hai lần\n* Báo cáo đã bị người khác đổi trạng thái thì thao tác không thực hiện, nội dung đang nhập được giữ, hệ thống báo \"Báo cáo tháng mm/yyyy đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\"\n\n## <mark style=\"color:green;\">8. BGĐ xem hoặc trả lại báo cáo tháng<\/mark>\n\n<figure><img src=\"images/bao-cao-ngay-tuan-thang-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nChỉ người thuộc Ban giám đốc, khi báo cáo ở trạng thái Đã trình\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nhận xét của trưởng phòng** | Chỉ đọc |\n| **Ý kiến BGĐ** | Ô văn bản nhiều dòng, tối đa 1.000 ký tự; tùy chọn khi bấm `BGĐ đã xem`, bắt buộc khi bấm `Trả lại` |\n| **Nút** | `BGĐ đã xem`, `Trả lại` |\n| **Bảng lịch sử** | Các lần lưu nhận xét, trình, xem, trả lại; tải bản chụp Excel, PDF của từng vòng |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở việc \"Xem báo cáo tháng mm/yyyy\"<\/td><td>Hệ thống mở báo cáo tháng, hiện bản đã trình với nhãn \"Số liệu chụp lúc trình dd/mm/yyyy hh:mm\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc bảng chỉ số, ba khối và nhận xét của trưởng phòng<\/td><td>Có thể bấm <code>Xem số liệu hiện tại<\/code> để so với dữ liệu mới nhất<\/td><\/tr>\n<tr><td><strong>Bước 3a<\/strong><\/td><td>Nhập ý kiến (không bắt buộc), bấm <code>BGĐ đã xem<\/code><\/td><td>Hệ thống chuyển <strong>BGĐ đã xem<\/strong>, đóng việc của mọi BGĐ, thông báo người trình, hiện \"Đã đánh dấu BGĐ đã xem báo cáo tháng mm/yyyy.\"<\/td><\/tr>\n<tr><td><strong>Bước 3b<\/strong><\/td><td>Hoặc nhập ý kiến, bấm <code>Trả lại<\/code><\/td><td>Hệ thống chuyển <strong>Trả lại<\/strong>, mở khóa nhận xét, đóng việc của mọi BGĐ, giao việc \"Sửa và trình lại báo cáo tháng mm/yyyy\" cho người trình, hiện \"Đã trả lại báo cáo tháng mm/yyyy.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Không tự duyệt:** người đã bấm trình ở vòng hiện tại không bấm được `BGĐ đã xem`, `Trả lại`; nút khóa kèm chú giải \"Bạn không thể duyệt báo cáo tháng do chính mình lập hoặc gửi duyệt.\"\n* Trả lại mà để trống ý kiến thì báo \"Nhập ý kiến khi trả lại.\"; ý kiến quá dài thì báo \"Ý kiến tối đa 1.000 ký tự.\"\n* **BGĐ đã xem** là trạng thái cuối, không mở lại được\n* Một người BGĐ đã xem hoặc trả lại thì việc \"Xem báo cáo tháng\" của mọi BGĐ khác đều đóng\n"}}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('hdsd-data').textContent);
  var groups = DATA.groups, pages = DATA.pages;
  var order = [], titles = {}, groupOf = {};
  groups.forEach(function(g){ g.items.forEach(function(it){ order.push(it.path); titles[it.path] = it.title; groupOf[it.path] = g.title || ''; }); });

  // Đường dẫn trang <-> mã hash (hash chỉ cho phép chữ, số, . _ ~ -)
  function toHash(p){ return p.replace(/\//g,'~'); }
  function fromHash(h){ var p = decodeURIComponent(h || '').replace(/^#/,'').replace(/~/g,'/'); return pages[p] ? p : null; }
  function dirOf(p){ var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i + 1); }
  function resolve(base, rel){
    var parts = (dirOf(base) + rel).split('/'), out = [];
    parts.forEach(function(x){ if (x === '..') out.pop(); else if (x !== '.' && x !== '') out.push(x); });
    return out.join('/');
  }
  function slug(t){ return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // Gán id cho h2, h3 trong trang; trả về danh sách h2 (bỏ qua tiêu đề nằm trong khung lưu ý)
  function headings(root){
    var used = {}, out = [];
    root.querySelectorAll('h2, h3').forEach(function(h){
      if (h.closest('.hint')) return;
      var id = slug(h.textContent) || 'muc'; while (used[id]) id += '-'; used[id] = 1; h.id = id;
      if (h.tagName === 'H2') out.push({id: id, t: h.textContent.trim()});
    });
    return out;
  }
  // Mục lục trái: Nhóm → Trang (các mục trong trang xem ở "Trên trang này")
  var side = document.getElementById('side'), nav = document.getElementById('nav');
  nav.innerHTML = groups.map(function(g){
    return '<div class="grp">' + (g.title ? '<h4>' + esc(g.title) + '</h4>' : '') +
      g.items.map(function(it){ return '<a class="pg" href="#' + toHash(it.path) + '" data-p="' + esc(it.path) + '">' + esc(it.title) + '</a>'; }).join('') + '</div>';
  }).join('');

  // Chọn phân hệ: hiện mới có Marketing, thêm phân hệ mới vào danh sách này
  var MODULES = [{name: 'Phân hệ Marketing', url: null}], curMod = 0;
  var modBtn = document.getElementById('modBtn'), modList = document.getElementById('modList');
  document.getElementById('modName').textContent = MODULES[curMod].name;
  modList.innerHTML = MODULES.map(function(m, i){
    return '<button type="button" role="option" data-i="' + i + '" aria-selected="' + (i === curMod) + '"><span>' + esc(m.name) + '</span>' + (i === curMod ? '<span aria-hidden="true">✓</span>' : '') + '</button>';
  }).join('');
  function modOpen(v){ modList.hidden = !v; modBtn.setAttribute('aria-expanded', v); }
  modBtn.addEventListener('click', function(e){ e.stopPropagation(); modOpen(modList.hidden); });
  modList.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var m = MODULES[+b.dataset.i]; if (m.url) location.href = m.url;
    modOpen(false);
  });
  document.addEventListener('click', function(e){ if (!e.target.closest('.mod')) modOpen(false); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modList.hidden) { modOpen(false); modBtn.focus(); } });

  // Chuyển Markdown GitBook sang HTML
  function render(md){
    var hints = [];
    md = md.replace(/\{%\s*hint\s+style="(\w+)"\s*%\}([\s\S]*?)\{%\s*endhint\s*%\}/g, function(_, style, inner){
      hints.push('<div class="hint hint-' + style + '">' + marked.parse(inner) + '</div>');
      return '\n\n@@HINT' + (hints.length - 1) + '@@\n\n';
    });
    var html = marked.parse(md, {gfm: true});
    return html.replace(/<p>@@HINT(\d+)@@<\/p>/g, function(_, i){ return hints[+i]; });
  }

  var doc = document.getElementById('doc'), toc = document.getElementById('toc'), current = null;

  function show(p, anchor){
    current = p;
    doc.innerHTML = '<div class="crumbs">' + esc(groupOf[p] || 'Giới thiệu') + '</div>' + render(pages[p]);
    // Ảnh: đường dẫn tương đối theo thư mục trang
    doc.querySelectorAll('img').forEach(function(img){
      var s = img.getAttribute('src') || '';
      if (!/^(data:|https?:|\/)/.test(s)) img.setAttribute('src', resolve(p, s));
      img.loading = 'lazy';
      if (!img.alt) img.alt = 'Ảnh màn hình ' + titles[p];
    });
    // Bảng cuộn ngang trong khung riêng
    doc.querySelectorAll('table').forEach(function(t){
      if (t.parentElement.classList.contains('tbl')) return;
      var w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    // Liên kết sang trang khác
    doc.querySelectorAll('a[href]').forEach(function(a){
      var h = a.getAttribute('href');
      if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      var m = h.match(/^([^#]+\.md)(#.*)?$/);
      if (m) { var t = resolve(p, m[1]); if (pages[t]) a.setAttribute('href', '#' + toHash(t)); }
    });
    // Mục "Trên trang này"
    var items = headings(doc).map(function(h){ return '<a href="#' + toHash(p) + '" data-id="' + h.id + '">' + esc(h.t) + '</a>'; });
    toc.innerHTML = items.length ? '<h5>Trên trang này</h5>' + items.join('') : '';
    // Trang trước, sau
    var i = order.indexOf(p), prev = order[i - 1], next = order[i + 1];
    var pg = '<nav class="pager">' +
      (prev ? '<a class="prev" href="#' + toHash(prev) + '"><small>← Trang trước</small><span>' + esc(titles[prev]) + '</span></a>' : '') +
      (next ? '<a class="next" href="#' + toHash(next) + '"><small>Trang sau →</small><span>' + esc(titles[next]) + '</span></a>' : '') +
      '</nav>';
    doc.insertAdjacentHTML('beforeend', pg);
    side.querySelectorAll('a.pg').forEach(function(a){ a.classList.toggle('on', a.dataset.p === p); });
    var on = side.querySelector('a.pg.on');
    if (on && (on.offsetTop < side.scrollTop || on.offsetTop + on.offsetHeight > side.scrollTop + side.clientHeight)) side.scrollTop = on.offsetTop - 70;
    document.title = titles[p] + ' · Hướng dẫn sử dụng Marketing';
    document.body.classList.remove('nav-open');
    if (anchor) { var el = document.getElementById(anchor); if (el) { el.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
  }

  function route(){ show(fromHash(location.hash) || order[0]); }
  window.addEventListener('hashchange', route);

  toc.addEventListener('click', function(e){
    var a = e.target.closest('a[data-id]'); if (!a) return;
    e.preventDefault(); var el = document.getElementById(a.dataset.id); if (el) el.scrollIntoView({behavior: 'smooth'});
  });
  // Tô mục đang đọc ở "Trên trang này"
  window.addEventListener('scroll', function(){
    var links = toc.querySelectorAll('a[data-id]'), cur = null;
    links.forEach(function(a){ var el = document.getElementById(a.dataset.id); if (el && el.getBoundingClientRect().top < 120) cur = a; });
    links.forEach(function(a){ a.classList.toggle('on', a === cur); });
  }, {passive: true});

  // Xem ảnh lớn
  var lb = document.getElementById('lightbox');
  doc.addEventListener('click', function(e){
    var img = e.target.closest('figure img'); if (!img) return;
    lb.querySelector('img').src = img.src; lb.hidden = false;
  });
  lb.addEventListener('click', function(){ lb.hidden = true; });

  // Mục lục trên màn hẹp
  document.getElementById('menuBtn').addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });

  // Đổi giao diện sáng, tối
  var root = document.documentElement;
  try { var saved = localStorage.getItem('hdsd-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function(){
    var dark = root.getAttribute('data-theme') ? root.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('hdsd-theme', next); } catch (e) {}
  });

  // Tìm kiếm
  var index = order.map(function(p){
    var tmp = document.createElement('div'); tmp.innerHTML = marked.parse(pages[p].replace(/\{%[^%]*%\}/g, ''));
    tmp.querySelectorAll('img').forEach(function(i){ i.remove(); });
    return {p: p, t: titles[p], g: groupOf[p], x: tmp.textContent.replace(/\s+/g, ' ')};
  });
  function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
  index.forEach(function(r){ r.nt = norm(r.t); r.nx = norm(r.x); });
  var q = document.getElementById('q'), res = document.getElementById('results'), sel = -1;
  function search(){
    var v = q.value.trim(); sel = -1;
    if (v.length < 2) { res.hidden = true; return; }
    var nv = norm(v), out = [];
    index.forEach(function(r){
      var inTitle = r.nt.indexOf(nv) >= 0, at = r.nx.indexOf(nv);
      if (!inTitle && at < 0) return;
      var snip = '';
      if (at >= 0) {
        var s = Math.max(0, at - 50), e = Math.min(r.x.length, at + nv.length + 90);
        snip = (s ? '…' : '') + esc(r.x.slice(s, at)) + '<mark>' + esc(r.x.slice(at, at + v.length)) + '</mark>' + esc(r.x.slice(at + v.length, e)) + (e < r.x.length ? '…' : '');
      }
      var hits = r.nx.split(nv).length - 1;
      out.push({r: r, score: (inTitle ? 1000 : 0) + hits, snip: snip, hits: hits});
    });
    out.sort(function(a, b){ return b.score - a.score; });
    res.innerHTML = out.length ? out.slice(0, 12).map(function(o){
      return '<a href="#' + toHash(o.r.p) + '"><div class="rt">' + esc(o.r.t) + '</div><div class="rg">' + esc(o.r.g || 'Giới thiệu') + (o.hits ? ' · ' + o.hits + ' kết quả trong trang' : '') + '</div>' + (o.snip ? '<div class="rs">' + o.snip + '</div>' : '') + '</a>';
    }).join('') : '<div class="empty">Không tìm thấy "' + esc(v) + '". Thử từ khóa ngắn hơn, ví dụ "duyệt", "thanh toán"</div>';
    res.hidden = false;
  }
  q.addEventListener('input', search);
  q.addEventListener('focus', search);
  q.addEventListener('keydown', function(e){
    var links = res.querySelectorAll('a');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!links.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links.forEach(function(a, i){ a.classList.toggle('on', i === sel); });
    } else if (e.key === 'Enter') {
      var a = links[sel >= 0 ? sel : 0]; if (a) { location.hash = a.getAttribute('href'); res.hidden = true; q.blur(); }
    } else if (e.key === 'Escape') { res.hidden = true; q.blur(); }
  });
  res.addEventListener('click', function(){ res.hidden = true; });
  document.addEventListener('click', function(e){ if (!e.target.closest('.search')) res.hidden = true; });
  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
  });

  route();
})();
</script>

</body>
