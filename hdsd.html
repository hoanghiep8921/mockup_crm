=\"info\" %}\n\n## QUY TRÌNH KẾ HOẠCH NỘI DUNG\n\nBước 1: Nhấn `+ Tạo kế hoạch`, chọn kỳ Tuần hoặc Tháng. Kế hoạch ở trạng thái **Nháp**\n\nBước 2: Nhấn `Thêm dòng` cho từng chủ đề: định dạng, kênh, ngày dự kiến, người phụ trách, hạn sản xuất\n\nBước 3: Nhấn `Gửi duyệt`. Kế hoạch chuyển **Chờ duyệt** và bị khóa sửa\n\nBước 4: Người duyệt nhấn `Duyệt` (kế hoạch **Đã duyệt**) hoặc `Từ chối` kèm lý do (kế hoạch **Từ chối**; người lập sửa rồi gửi duyệt lại)\n\nBước 5: Với từng dòng, nhấn `Tạo yêu cầu` để đặt sản xuất. Yêu cầu đi tiếp qua [Yêu cầu nội dung](yeu-cau-noi-dung.md) → [Bài đang sản xuất](bai-dang-san-xuat.md) → [Duyệt nội dung](duyet-noi-dung.md) → [Lịch xuất bản](lich-xuat-ban.md). Cột **Xuất bản** của dòng cập nhật theo tiến độ đăng bài\n\nBước 6: Hết kỳ, nhấn `Đóng kỳ`. Kế hoạch chuyển **Hoàn thành**; dòng chưa đăng được chuyển sang kế hoạch kỳ sau\n\n**Trạng thái:** Nháp, Chờ duyệt, Đã duyệt, Từ chối, Hoàn thành. Kế hoạch có thể được rút về Nháp để sửa\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách kế hoạch nội dung<\/mark>\n\n<figure><img src=\"images/ke-hoach-noi-dung-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề \"Kế hoạch nội dung\" và dòng đếm \"N kế hoạch nội dung · M chờ duyệt\" |\n| **Ô tìm** | \"Tìm theo mã, tên…\": nhập <code>0010<\/code> hay <code>MKT-KN-0010<\/code> đều tìm được |\n| **Bộ lọc** | Trạng thái, Loại kỳ (Tuần, Tháng), Kỳ (từ ngày – đến ngày), Người phụ trách, Đội, Của tôi. Có điều kiện lọc thì hiện chip \"Đang lọc\" và nút `Xóa bộ lọc` |\n| **Nút `Xuất Excel`, `+ Tạo kế hoạch`** | Xuất danh sách đang lọc; mở hộp tạo kế hoạch mới |\n| **Nhóm \"Chờ bạn duyệt · N\"** | Chỉ hiện với người có quyền duyệt: các kế hoạch đang chờ bạn duyệt, đứng trên nhóm \"Các kế hoạch khác\" |\n| **Dòng kế hoạch** | Tên, chip trạng thái, mã <code>MKT-KN-nnnn<\/code>, kỳ \"dd/mm/yyyy – dd/mm/yyyy\", dòng phụ \"&lt;n&gt; dòng · &lt;m&gt; đã đăng · &lt;k&gt; trễ\", người phụ trách (\"Chưa phân công\" nếu trống). Chip \"Quá kỳ\" khi đã qua ngày kết thúc mà chưa đóng kỳ |\n| **Cột phải** | Chi tiết kế hoạch đang chọn (mục 2) |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Nội dung &amp; media → Sản xuất nội dung → Kế hoạch nội dung<\/strong><\/td><td>Danh sách xếp theo ngày bắt đầu kỳ, mới nhất ở trên. Hệ thống chọn sẵn kế hoạch có kỳ chứa hôm nay (ưu tiên kế hoạch Đã duyệt, rồi kế hoạch của đội bạn)<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Tìm, lọc<\/td><td>Nhập từ khóa hoặc chọn bộ lọc. Chọn <strong>Của tôi<\/strong> để xem kế hoạch bạn phụ trách hoặc bạn tạo<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn vào một kế hoạch<\/td><td>Cột phải hiện chi tiết. Bộ lọc và ô tìm giữ nguyên<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Tải tệp <code>KeHoachNoiDung_yyyymmdd.xlsx<\/code> (mã, tên, loại kỳ, kỳ, người phụ trách, đội, số dòng, đã đăng, trễ, trạng thái). Danh sách rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy kế hoạch nào:** Chuyên viên thấy kế hoạch mình phụ trách hoặc mình tạo, và (chỉ xem) kế hoạch có dòng mình phụ trách. Trưởng nhóm thấy kế hoạch của đội mình. Trưởng/Phó phòng, BGĐ thấy tất cả\n* Không có kế hoạch khớp: \"Không có kế hoạch nội dung khớp bộ lọc.\" Chưa có kế hoạch nào: \"Chưa có kế hoạch nội dung. Bấm Tạo kế hoạch để lập kế hoạch đầu tiên.\"\n\n## <mark style=\"color:green;\">2. Xem chi tiết kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-noi-dung-2.png\" alt=\"\"><figcaption><p>Kế hoạch Nháp, xem với vai trò Chuyên viên: nút Gửi duyệt<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên, dòng \"mã · kỳ\", chip trạng thái, dòng \"Người phụ trách · Đội · Kế hoạch Marketing liên quan\"; menu `⋯` có `Sửa kế hoạch`, `Xóa`, `Rút về nháp`, `Xuất Excel` tùy trạng thái và quyền |\n| **Khối \"Duyệt kế hoạch nội dung\"** | Chip trạng thái, chú thích \"Marketing lập kế hoạch, Leader duyệt. Chỉ kế hoạch đã duyệt được dùng cho lịch xuất bản.\", người lập, người và thời điểm duyệt; khung lý do khi bị từ chối; \"Lý do từ chối lần trước\"; \"&lt;n&gt; dòng chưa giao người phụ trách\"; cảnh báo trùng kỳ; các nút theo trạng thái |\n| **Khối \"Dòng kế hoạch\"** | Nút `Thêm dòng` (hoặc nhãn \"Đã khóa\") và bảng dòng: Chủ đề, Định dạng, Kênh, Ngày dự kiến, Người phụ trách, Hạn sản xuất, Chiến dịch, Xuất bản, cột thao tác |\n| **Khối \"Lịch sử\"** | Thời điểm, Người thực hiện, Hành động: tạo, sửa (cũ → mới), thêm/sửa/xóa dòng, gửi duyệt, duyệt, từ chối (kèm lý do), rút về nháp, đóng kỳ, xếp lịch |\n| **Liên kết** | \"Xem trên Lịch xuất bản\" (lọc theo kế hoạch này), \"Xem trên Lịch triển khai\" |\n\n**Nút theo trạng thái**\n\n| Trạng thái | Nút chính | Trong menu `⋯` |\n| --- | --- | --- |\n| **Nháp** | `Gửi duyệt` | `Sửa kế hoạch`, `Xóa`, `Xuất Excel` |\n| **Từ chối** | `Gửi duyệt` | `Sửa kế hoạch`, `Rút về nháp`, `Xuất Excel` |\n| **Chờ duyệt** | `Từ chối`, `Duyệt` (người có quyền duyệt) | `Rút về nháp`, `Xuất Excel` |\n| **Đã duyệt** | `Đóng kỳ` | `Rút về nháp` (người có quyền duyệt), `Xuất Excel` |\n| **Hoàn thành** | - | `Xuất Excel` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Đọc bảng dòng kế hoạch<\/td><td>Dòng xếp theo ngày dự kiến, rồi giờ dự kiến, rồi chủ đề<br><strong>Người phụ trách<\/strong> trống hiện chip \"Chưa giao\". Dòng đã có yêu cầu hiện người thực hiện chính của yêu cầu; yêu cầu chưa phân công hiện \"Chưa giao · đề xuất &lt;tên&gt;\"<br>Chip <strong>Chưa có yêu cầu<\/strong> ở cột Chủ đề: dòng chưa có yêu cầu lẫn nội dung<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc cột <strong>Xuất bản<\/strong><\/td><td><strong>Chưa có nội dung<\/strong>: chưa bắt đầu sản xuất. <strong>Chưa hẹn giờ<\/strong>: có nội dung, chưa có bài đăng. <strong>Đã hẹn giờ<\/strong>, <strong>Đã đăng<\/strong>, <strong>Lỗi đăng<\/strong>: theo bài đăng ở Lịch xuất bản. Chip <strong>Trễ<\/strong>: ngày dự kiến đã qua mà chưa đăng<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn vào <strong>Chủ đề<\/strong><\/td><td>Mở yêu cầu nội dung hoặc nội dung liên kết của dòng. Bạn không có quyền xem thì chủ đề là chữ thường kèm \"Bạn không có quyền xem bản ghi này\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>⋯<\/code> → <code>Xuất Excel<\/code><\/td><td>Tải tệp <code>&lt;mã&gt;_yyyymmdd.xlsx<\/code> gồm các dòng của kế hoạch (chủ đề, định dạng, kênh, ngày giờ dự kiến, người phụ trách, hạn sản xuất, chiến dịch, yêu cầu, nội dung, xuất bản)<\/td><\/tr>\n<\/tbody><\/table>\n\n## <mark style=\"color:green;\">3. Tạo, sửa, xóa kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-noi-dung-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>+ Tạo kế hoạch<\/code><\/td><td>Mở hộp \"Tạo kế hoạch nội dung\". Ô bắt buộc có dấu \"*\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Tên kế hoạch<\/strong> (bắt buộc)<\/td><td>Ví dụ \"Nội dung tháng 10/2026\". Tối đa 255 ký tự. Bỏ trống: \"Nhập tên kế hoạch.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Loại kỳ<\/strong> (bắt buộc)<\/td><td>Chọn <code>Tuần<\/code> hoặc <code>Tháng<\/code>, mặc định Tháng. Không đổi được sau khi lưu<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><strong>Từ ngày<\/strong>, <strong>Đến ngày<\/strong> (bắt buộc)<\/td><td>Từ ngày mặc định ngày 1 tháng sau (Tháng) hoặc thứ Hai tuần sau (Tuần). Đến ngày tự gợi ý: Tuần = Từ ngày + 6 ngày; Tháng = Từ ngày + 1 tháng − 1 ngày (01/10 gợi ý 31/10; 15/10 gợi ý 14/11)<br>Lỗi: \"Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.\", \"Kế hoạch Tuần phải dài đúng 7 ngày.\", \"Kế hoạch Tháng phải dài từ 28 đến 31 ngày.\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><strong>Người phụ trách<\/strong> (bắt buộc)<\/td><td>Mặc định là bạn. Bỏ trống: \"Chọn người phụ trách.\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td><strong>Đội nhóm<\/strong> (bắt buộc)<\/td><td>Mặc định đội của người phụ trách. Cần có đội để Trưởng nhóm của đội thấy và duyệt. Bỏ trống: \"Chọn đội nhóm.\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td><strong>Kế hoạch Marketing liên quan<\/strong><\/td><td>Không bắt buộc. Chỉ liệt kê kế hoạch Marketing Đã duyệt có kỳ giao với kỳ này; chỉ để tham chiếu<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td><strong>Ghi chú<\/strong><\/td><td>Định hướng chủ đề của kỳ, tối đa 5.000 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td>Nhấn <code>Tạo kế hoạch<\/code><\/td><td>Thành công: kế hoạch ở <strong>Nháp<\/strong>, cấp mã <code>MKT-KN-nnnn<\/code>, báo \"Đã tạo kế hoạch nội dung &lt;mã&gt;.\" Đã có kế hoạch cùng đội trùng kỳ: hệ thống vẫn lưu và cảnh báo \"Đã có kế hoạch nội dung &lt;mã&gt; cùng kỳ của đội.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Sửa kế hoạch:** nhấn `⋯` → `Sửa kế hoạch`, sửa rồi nhấn `Lưu thay đổi` (\"Đã lưu thay đổi &lt;mã&gt;.\"). Chỉ sửa khi kế hoạch Nháp hoặc Từ chối. Đổi kỳ mà làm dòng nằm ngoài kỳ: \"Kỳ mới làm dòng &lt;chủ đề&gt; nằm ngoài kỳ.\"\n\n**Xóa kế hoạch:** nhấn `⋯` → `Xóa`. Hộp \"Xóa kế hoạch nội dung &lt;mã&gt;?\" báo \"Kế hoạch cùng các dòng và lịch sử sẽ bị xóa, không khôi phục được. Ngày dự kiến của &lt;n&gt; nội dung liên kết sẽ bị xóa.\" Nhấn `Xóa`: \"Đã xóa kế hoạch nội dung &lt;mã&gt;.\"\n\n### ⚠️ Lưu ý\n\n* Mọi người trong phòng Marketing đều tạo được kế hoạch. Người sửa: người phụ trách, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ\n* **Xóa:** chỉ Trưởng nhóm (kế hoạch của đội mình), Trưởng/Phó phòng, BGĐ; chỉ khi kế hoạch Nháp và không có dòng nào mà nội dung đã có bài đăng. Bị chặn thì hệ thống nêu từng lý do, ví dụ \"Kế hoạch không ở trạng thái Nháp.\", \"Dòng &lt;chủ đề&gt; đã có bài đăng.\"\n* Lỗi khi lưu: \"Chưa lưu được, vui lòng thử lại.\"\n\n## <mark style=\"color:green;\">4. Thêm, sửa, xóa dòng kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-noi-dung-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Thêm dòng<\/code><\/td><td>Mở hộp \"Thêm dòng kế hoạch\". Sửa dòng: nhấn biểu tượng sửa ở cuối dòng, hộp \"Sửa dòng kế hoạch\", nút <code>Lưu dòng<\/code><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Chủ đề<\/strong> (bắt buộc)<\/td><td>Tối đa 255 ký tự. Bỏ trống: \"Nhập chủ đề.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Định dạng<\/strong> (bắt buộc)<\/td><td>Bài viết, Ảnh, Video; mặc định Bài viết<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><strong>Kênh<\/strong> (bắt buộc)<\/td><td>Facebook, Website, Zalo OA; mặc định Facebook. Đây là nơi dự kiến đăng bài<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><strong>Ngày dự kiến<\/strong> (bắt buộc), <strong>Giờ dự kiến<\/strong><\/td><td>Phải nằm trong kỳ: \"Ngày dự kiến phải nằm trong kỳ của kế hoạch.\" Giờ mặc định 09:00, bước 15 phút<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td><strong>Người phụ trách<\/strong><\/td><td>Không bắt buộc (\"Chưa giao\"). Là người <strong>được đề xuất<\/strong> làm dòng này; khi tạo yêu cầu, Trưởng nhóm vẫn phải phân công chính thức<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td><strong>Hạn sản xuất<\/strong><\/td><td>Không bắt buộc; không được sau ngày dự kiến: \"Hạn sản xuất không được sau ngày dự kiến đăng.\"<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td><strong>Chiến dịch liên quan<\/strong><\/td><td>Chiến dịch còn hiệu lực, không bị từ chối; hiển thị \"mã - tên\"<\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td><strong>Yêu cầu nội dung liên kết<\/strong><\/td><td>Chọn một yêu cầu có sẵn, chưa Hoàn thành, chưa hủy, chưa thuộc dòng khác. Hệ thống điền sẵn định dạng, kênh, chiến dịch (nếu ô trống), người phụ trách theo người thực hiện chính, và nội dung của yêu cầu (nếu có)<\/td><\/tr>\n<tr><td><strong>Bước 10<\/strong><\/td><td><strong>Nội dung liên kết<\/strong><\/td><td>Chọn một nội dung có sẵn trong Kho nội dung, chưa thuộc dòng khác. Nội dung thuộc một yêu cầu thì yêu cầu đó được gắn theo. Dòng đã có yêu cầu thì ô này khóa và do hệ thống tự ghi khi yêu cầu bắt đầu sản xuất (\"Chờ yêu cầu sinh nội dung\")<\/td><\/tr>\n<tr><td><strong>Bước 11<\/strong><\/td><td><strong>Ghi chú<\/strong><\/td><td>Tối đa 1.000 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 12<\/strong><\/td><td>Nhấn <code>Thêm dòng<\/code> / <code>Lưu dòng<\/code><\/td><td>Thành công: \"Đã thêm dòng &lt;chủ đề&gt;.\" hoặc \"Đã lưu dòng &lt;chủ đề&gt;.\" Dòng có nội dung liên kết thì ngày, giờ dự kiến được ghi sang \"Dự kiến đăng\" của nội dung<br>Trùng: \"Nội dung &lt;mã&gt; đã thuộc dòng &lt;chủ đề&gt; của kế hoạch &lt;mã&gt;.\" hoặc \"Yêu cầu &lt;mã&gt; đã thuộc dòng &lt;chủ đề&gt; của kế hoạch &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Xóa dòng** (kế hoạch Nháp, Từ chối): nhấn biểu tượng xóa ở cuối dòng → hộp \"Xóa dòng &lt;chủ đề&gt;?\" → `Xóa`. Hệ thống báo \"Đã xóa dòng &lt;chủ đề&gt;.\" và xóa ngày dự kiến của nội dung liên kết (nếu nội dung chưa có bài đăng)\n\n**Tạo yêu cầu từ dòng:** ở dòng chưa có yêu cầu và nội dung (kế hoạch Nháp, Từ chối hoặc Đã duyệt), nhấn `Tạo yêu cầu`. Hệ thống tạo ngay một yêu cầu nội dung trạng thái Mới, điền sẵn tên (chủ đề), định dạng, kênh, giờ đăng dự kiến, hạn hoàn thành (hạn sản xuất, không có thì ngày dự kiến), chiến dịch; người phụ trách dòng thành người thực hiện đề xuất; gắn yêu cầu vào dòng và báo \"Đã tạo yêu cầu &lt;mã&gt; cho dòng &lt;chủ đề&gt;.\" Tiếp tục phân công ở [Yêu cầu nội dung](yeu-cau-noi-dung.md)\n\n### ⚠️ Lưu ý\n\n* **Một nội dung, một yêu cầu chỉ thuộc một dòng** của các kế hoạch Nháp, Chờ duyệt, Đã duyệt. Một dòng đủ làm căn cứ đăng lên mọi nền tảng ở Lịch xuất bản; không lập hai dòng cho cùng nội dung\n* **Khi nào khóa sửa:**\n  * Nháp, Từ chối: sửa mọi ô, thêm và xóa dòng\n  * Chờ duyệt, Hoàn thành: khóa toàn bộ; khối dòng hiện nhãn \"Đã khóa\"\n  * Đã duyệt: khóa chủ đề, định dạng, kênh, ngày dự kiến, chiến dịch; không thêm, không xóa dòng. Vẫn sửa được người phụ trách (dòng chưa có yêu cầu), hạn sản xuất, ghi chú, và gắn yêu cầu vào dòng còn trống. Muốn đổi hoặc gỡ yêu cầu, nội dung đã gắn thì phải rút kế hoạch về nháp\n  * Sửa ô bị khóa: \"Kế hoạch nội dung &lt;mã&gt; đang ở trạng thái &lt;trạng thái&gt; nên không sửa được &lt;tên trường&gt;.\"\n* Dòng đã có yêu cầu: ô Người phụ trách chỉ đọc, hệ thống tự ghi theo người thực hiện chính khi Trưởng nhóm phân công ở [Yêu cầu nội dung](yeu-cau-noi-dung.md)\n* Ngày dự kiến của nội dung thuộc dòng do kế hoạch quản lý; sửa trực tiếp ở nội dung báo \"Ngày dự kiến của nội dung này do kế hoạch nội dung &lt;mã&gt; quản lý.\"\n* Gắn yêu cầu khi dòng đã có nội dung khác: \"Dòng &lt;chủ đề&gt; đã có nội dung &lt;mã&gt; không thuộc yêu cầu này. Bỏ nội dung trước khi gắn yêu cầu.\"\n\n## <mark style=\"color:green;\">5. Gửi duyệt kế hoạch<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kế hoạch <strong>Nháp<\/strong> hoặc <strong>Từ chối<\/strong>, nhấn <code>Gửi duyệt<\/code><\/td><td>Hệ thống kiểm tra kế hoạch có đủ tên, loại kỳ, khoảng ngày, người phụ trách, đội, ít nhất một dòng; mọi dòng có chủ đề, định dạng, kênh, ngày dự kiến trong kỳ<br>Thiếu: \"Chưa thể gửi duyệt. Còn thiếu: &lt;danh sách&gt;.\" (ví dụ \"đội nhóm\", \"ít nhất một dòng kế hoạch\", \"ngày dự kiến của dòng &lt;chủ đề&gt;\")<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Hệ thống chuyển <strong>Chờ duyệt<\/strong><\/td><td>Kế hoạch và các dòng bị khóa; lý do từ chối cũ được xóa. Người duyệt nhận việc \"Duyệt kế hoạch nội dung &lt;mã&gt;\". Hệ thống báo \"Đã gửi duyệt &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai gửi duyệt:** người phụ trách, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ\n* Dòng chưa có người phụ trách vẫn gửi được; khối duyệt hiện \"&lt;n&gt; dòng chưa giao người phụ trách\" để người duyệt cân nhắc\n\n## <mark style=\"color:green;\">6. Duyệt, từ chối kế hoạch<\/mark>\n\n<figure><img src=\"images/ke-hoach-noi-dung-3.png\" alt=\"\"><figcaption><p>Kế hoạch Chờ duyệt, xem với vai trò Trưởng phòng: nút Từ chối, Duyệt<\/p><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở kế hoạch ở nhóm <strong>\"Chờ bạn duyệt\"<\/strong> hoặc từ việc nhắc<\/td><td>Xem các dòng kế hoạch và khối duyệt<\/td><\/tr>\n<tr><td><strong>Bước 2a<\/strong><\/td><td>Nhấn <code>Duyệt<\/code><\/td><td>Kế hoạch chuyển <strong>Đã duyệt<\/strong>, ghi người và ngày duyệt; người lập, người phụ trách nhận thông báo. Người phụ trách của mỗi dòng chưa có yêu cầu nhận việc \"Sản xuất &lt;chủ đề&gt; - đăng &lt;ngày dự kiến&gt;\" hạn bằng hạn sản xuất. Hệ thống báo \"Đã duyệt &lt;mã&gt;.\" Từ lúc này nội dung của kế hoạch được lên lịch đăng<\/td><\/tr>\n<tr><td><strong>Bước 2b<\/strong><\/td><td>Nhấn <code>Từ chối<\/code><\/td><td>Mở hộp \"Từ chối kế hoạch\" (bước tiếp theo)<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/ke-hoach-noi-dung-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhập <strong>Lý do<\/strong> (bắt buộc)<\/td><td>Nêu rõ dòng hoặc điểm cần sửa, tối đa 1.000 ký tự. Bỏ trống: \"Chưa nhập lý do từ chối.\" Người lập nhận được lý do này kèm thông báo<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Xác nhận từ chối<\/code><\/td><td>Kế hoạch chuyển <strong>Từ chối<\/strong>, khối duyệt hiện khung \"Từ chối bởi &lt;tên&gt; lúc &lt;thời điểm&gt;\" và lý do. Hệ thống báo \"Đã từ chối &lt;mã&gt;. Người lập nhận được lý do.\" Người lập sửa rồi gửi duyệt lại<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chỉ Trưởng nhóm của đội của kế hoạch, Trưởng/Phó phòng, BGĐ** duyệt và từ chối được. Trưởng nhóm đội khác không duyệt được. Người không đủ quyền thấy \"Chỉ Trưởng nhóm của đội, Trưởng/Phó phòng hoặc Ban giám đốc duyệt được.\"\n* **Không tự duyệt:** người lập và người gửi duyệt không duyệt, không từ chối được kế hoạch đó, kể cả BGĐ. Nút hiện mờ kèm \"Cần người khác duyệt\"; thao tác bị chặn với \"Bạn không thể duyệt kế hoạch nội dung do chính mình lập hoặc gửi duyệt.\"\n* Không còn ai khác có quyền duyệt: kế hoạch giữ Chờ duyệt, người lập thấy \"Chưa có người khác có quyền duyệt kế hoạch nội dung này.\" và có thể rút về nháp\n* Người khác vừa đổi trạng thái kế hoạch: hệ thống không thực hiện, giữ lý do đang nhập\n\n## <mark style=\"color:green;\">7. Rút kế hoạch về nháp<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>⋯<\/code> → <code>Rút về nháp<\/code><\/td><td>Kế hoạch <strong>Chờ duyệt<\/strong> hoặc <strong>Từ chối<\/strong>: thực hiện ngay, không hỏi xác nhận. Lý do từ chối cũ hiện ở \"Lý do từ chối lần trước\"<br>Kế hoạch <strong>Đã duyệt<\/strong>: hiện hộp \"Rút kế hoạch đã duyệt về nháp?\" với câu \"Kế hoạch &lt;mã&gt; sẽ mở khóa để sửa và phải gửi duyệt lại. &lt;n&gt; bài đăng đã hẹn giờ của nội dung thuộc kế hoạch sẽ không được đăng cho tới khi kế hoạch được duyệt lại.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Rút về nháp<\/code><\/td><td>Kế hoạch về <strong>Nháp<\/strong>, mở khóa để sửa; xóa người và ngày duyệt; việc chờ duyệt được đóng<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Rút từ Chờ duyệt, Từ chối: người phụ trách, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ. Rút từ **Đã duyệt**: chỉ người có quyền duyệt kế hoạch đó\n* Bài đã hẹn giờ của kế hoạch giữ nguyên lịch, nhưng nếu tới giờ mà kế hoạch chưa được duyệt lại thì bài chuyển **Lỗi đăng** với lý do \"Kế hoạch nội dung &lt;mã&gt; không còn Đã duyệt - không đăng.\"\n\n## <mark style=\"color:green;\">8. Đóng kỳ<\/mark>\n\n<figure><img src=\"images/ke-hoach-noi-dung-7.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn kế hoạch <strong>Đã duyệt<\/strong>, nhấn <code>Đóng kỳ<\/code><\/td><td>Nút chỉ dùng được từ ngày kết thúc kỳ; trước đó nút mờ kèm \"Chỉ đóng kỳ từ ngày &lt;dd/mm/yyyy&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc hộp \"Đóng kỳ kế hoạch nội dung?\"<\/td><td>Hộp liệt kê các dòng chưa có lịch đăng (chủ đề, ngày dự kiến, mã yêu cầu, mã nội dung) và nhắc: nội dung các dòng này cần gắn vào kế hoạch kỳ sau (thêm dòng ở kế hoạch Nháp của kỳ sau; kế hoạch kỳ sau đã duyệt thì lập kế hoạch Tuần bổ sung). Mọi dòng đã có lịch: \"Mọi dòng đã có lịch đăng.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Đóng kỳ<\/code><\/td><td>Kế hoạch chuyển <strong>Hoàn thành<\/strong> và khóa toàn bộ. Hệ thống báo \"Đã đóng kỳ &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai đóng kỳ:** người phụ trách, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ\n* Sau khi đóng kỳ, kế hoạch không nhận thêm dòng và không còn là căn cứ lên lịch mới; bài đã hẹn giờ vẫn đăng theo lịch, bài lỗi vẫn thử lại được\n* Kế hoạch đã qua ngày kết thúc mà chưa đóng vẫn là Đã duyệt và vẫn là căn cứ lên lịch; danh sách hiện chip \"Quá kỳ\" để nhắc đóng kỳ\n* Không mở lại được kỳ đã đóng\n\n## <mark style=\"color:green;\">9. Xếp lịch nội dung chưa lên lịch<\/mark>\n\nDùng khi một nội dung đã có trong Kho nội dung nhưng chưa có ngày đăng dự kiến (hiện ở thẻ \"Chưa lên lịch\" của [Lịch triển khai](../ke-hoach/lich-trien-khai.md))\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở <a href=\"../ke-hoach/lich-trien-khai.md\">Lịch triển khai<\/a>, nhấn <code>Xếp lịch<\/code> trên nội dung ở thẻ \"Chưa lên lịch\"<\/td><td>Hệ thống chuyển sang màn Kế hoạch nội dung và mở hộp \"Xếp lịch nội dung\". Nội dung được điền sẵn và khóa; chủ đề, định dạng, kênh, người phụ trách, chiến dịch lấy sẵn từ nội dung, sửa được<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Kế hoạch<\/strong> (bắt buộc)<\/td><td>Chỉ liệt kê kế hoạch Nháp hoặc Từ chối bạn được sửa. Chưa có: \"Chưa có kế hoạch nội dung Nháp của kỳ này.\" kèm nút <code>Tạo kế hoạch nội dung<\/code>. Kế hoạch của kỳ đang Chờ duyệt hoặc Đã duyệt không nhận dòng mới: rút về nháp (nếu có quyền) hoặc chọn kế hoạch khác<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Ngày dự kiến<\/strong>, <strong>Giờ dự kiến<\/strong> (bắt buộc)<\/td><td>Từ hôm nay trở đi (\"Ngày dự kiến phải từ hôm nay trở đi.\") và nằm trong kỳ của kế hoạch<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Xếp lịch<\/code><\/td><td>Hệ thống tạo dòng mới gắn nội dung, ghi ngày dự kiến sang nội dung và báo \"Đã xếp lịch &lt;tên nội dung&gt; vào kế hoạch &lt;mã&gt; ngày &lt;dd/mm/yyyy&gt;.\" kèm liên kết <code>Quay lại Lịch triển khai<\/code>. Nhấn <code>Hủy<\/code> để quay lại Lịch triển khai, không đổi gì<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Nội dung đã thuộc một dòng: hệ thống không tạo dòng mới, mở kế hoạch chứa dòng đó và báo \"Nội dung &lt;mã&gt; đã thuộc dòng &lt;chủ đề&gt; của kế hoạch &lt;mã&gt;.\"\n* Người khác vừa xếp lịch: \"Nội dung &lt;mã&gt; đã có lịch, không cần xếp lại.\"\n* Sau khi xếp, nội dung rời thẻ \"Chưa lên lịch\" và hiện trên lưới Lịch triển khai theo ngày dự kiến\n", "noi-dung-va-media/lich-xuat-ban.md": "# Lịch xuất bản\n\n🧭 Tổng quan chức năng: Lên lịch đăng nội dung đã duyệt lên Facebook, Zalo OA, Website; theo dõi từng bài đăng (đã hẹn giờ, đã đăng, lỗi) và xử lý bài lỗi. Mọi người trong phòng Marketing đều lên lịch được với nội dung mình xem được\n\nTruy cập: menu **Nội dung & media → Sản xuất nội dung → Lịch xuất bản**. Cũng mở được từ nút `Lên lịch đăng` ở [Yêu cầu nội dung](yeu-cau-noi-dung.md), [Duyệt nội dung](duyet-noi-dung.md), hoặc liên kết \"Xem trên Lịch xuất bản\" ở [Kế hoạch nội dung](ke-hoach-noi-dung.md)\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH XUẤT BẢN\n\nBước 1: Nội dung đủ điều kiện lên lịch khi **đã được duyệt xuất bản** ở [Duyệt nội dung](duyet-noi-dung.md) **và thuộc một dòng của kế hoạch nội dung Đã duyệt** ([Kế hoạch nội dung](ke-hoach-noi-dung.md)). Nội dung đủ điều kiện mà chưa có bài hiện ở dòng **Chưa hẹn giờ**\n\nBước 2: Nhấn `Lên lịch đăng`, chọn nền tảng, trang, giờ đăng. Mỗi nền tảng × trang sinh một **bài đăng** riêng, mã `MKT-BD-nnnn`, trạng thái **Đã hẹn giờ**\n\nBước 3: Tới giờ, hệ thống tự đăng Facebook, Zalo OA (kiểm 5 phút một lần). Website chưa kết nối: hệ thống nhắc người phụ trách đăng tay rồi đánh dấu đã đăng\n\nBước 4: Bài chuyển **Đã đăng** hoặc **Lỗi đăng**. Bài lỗi: sửa nguyên nhân rồi `Thử lại`, hoặc `Sửa lịch`, `Hủy lịch`\n\n**Trạng thái bài đăng:** Đã hẹn giờ, Đang đăng, Đã đăng, Lỗi đăng, Đã hủy. Thêm hai cờ cảnh báo: **Trễ lịch** (quá giờ đăng hơn 15 phút mà chưa đăng) và **Kẹt** (ở Đang đăng quá 15 phút)\n\n**Trạng thái xuất bản của một nội dung** (gộp từ các bài của nó, hiện ở Yêu cầu nội dung, Kế hoạch nội dung): còn bài Lỗi đăng → \"Lỗi đăng\"; còn bài Đã hẹn giờ hoặc Đang đăng → \"Đã hẹn giờ\"; mọi bài Đã đăng → \"Đã đăng\"; chưa có bài → \"Chưa hẹn giờ\"\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem lịch xuất bản<\/mark>\n\n<figure><img src=\"images/lich-xuat-ban-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề \"Lịch xuất bản\" và dòng đếm \"a bài đã hẹn giờ · b lỗi đăng · c trễ lịch · d chưa hẹn giờ\" theo khoảng ngày và bộ lọc đang xem |\n| **Lọc trạng thái** | `Tất cả`, `Chưa hẹn giờ`, `Đã hẹn giờ`, `Đã đăng`, `Lỗi đăng`, `Trễ lịch`, `Đang đăng`, `Đã hủy` |\n| **Bộ lọc khác** | Khoảng ngày giờ đăng, Nền tảng, Trang, Người phụ trách, Đội, Chiến dịch, Kế hoạch nội dung, Của tôi, Bỏ bài đã hủy (bật sẵn). Có điều kiện thì hiện chip và nút `Xóa bộ lọc` |\n| **Ô tìm** | \"Tìm theo mã, tiêu đề…\": mã bài, mã nội dung, tiêu đề nội dung |\n| **Chế độ xem** | `Bảng` (mặc định) hoặc `Lịch` tháng, tuần (mỗi ô là một bài \"giờ · nền tảng · tên\") |\n| **Nút `Xuất Excel`, `+ Lên lịch đăng`** | Xuất các dòng đang lọc; mở hộp lên lịch (mục 3) |\n| **Nhóm \"Cần xử lý (n)\"** | Bài Lỗi đăng, Kẹt, Trễ lịch trong phạm vi bạn xem, luôn ở trên cùng bảng, bất kể khoảng ngày |\n| **Bảng bài đăng** | Mỗi dòng một bài: Mã bài, Nội dung, Định dạng, Nền tảng, Trang, Giờ đăng, Người phụ trách, Chiến dịch, Trạng thái (kèm chip \"Trễ lịch\", \"Kẹt\"); nút thao tác cuối dòng |\n| **Dòng \"Chưa hẹn giờ\"** | Nội dung đủ điều kiện chưa có bài: kênh, ngày giờ <em>dự kiến<\/em> và người phụ trách lấy từ dòng kế hoạch; nút `Lên lịch` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Nội dung &amp; media → Sản xuất nội dung → Lịch xuất bản<\/strong><\/td><td>Bảng hiện bài có giờ đăng từ 7 ngày trước đến 30 ngày tới, ẩn bài đã hủy, xếp theo giờ đăng tăng dần<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem nhóm <strong>Cần xử lý<\/strong><\/td><td>Ưu tiên xử lý các bài lỗi, kẹt, trễ lịch ở đây (mục 6, 9)<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Lọc, tìm hoặc chuyển chế độ <code>Lịch<\/code><\/td><td>Ở chế độ Lịch, nhấn vào ô để mở chi tiết bài<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Dùng nút cuối dòng<\/td><td><code>Thử lại<\/code> (bài Lỗi đăng), <code>Lên lịch<\/code> (dòng Chưa hẹn giờ), <code>Hủy lịch<\/code> (bài Đã hẹn giờ, Lỗi đăng), <code>Đánh dấu đã đăng<\/code> (bài Website, bài kẹt). Nút bạn không có quyền sẽ không hiện<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Tải tệp <code>LichXuatBan_yyyymmdd.xlsx<\/code>: mã bài, nội dung, nền tảng, trang, giờ đăng, người phụ trách, chiến dịch, kế hoạch, trạng thái, thời điểm đã đăng, đường dẫn bài, thông điệp lỗi. Danh sách rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy bài nào:** Chuyên viên thấy bài mình phụ trách hoặc mình tạo; Trưởng nhóm thấy bài của đội; Trưởng/Phó phòng, BGĐ thấy tất cả. Đội của bài là đội của người lên lịch. Dòng \"Chưa hẹn giờ\" theo quyền xem nội dung\n* \"Chưa hẹn giờ\" ở màn này là nội dung đã đủ điều kiện nhưng chưa có bài đăng; khác thẻ \"Chưa lên lịch\" ở [Lịch triển khai](../ke-hoach/lich-trien-khai.md) (nội dung chưa có ngày đăng dự kiến)\n* Mọi giờ hiển thị theo giờ Việt Nam, dạng dd/mm/yyyy hh:mm\n* Không có kết quả: \"Không có nội dung nào khớp điều kiện.\"\n\n## <mark style=\"color:green;\">2. Xem chi tiết bài đăng<\/mark>\n\n<figure><img src=\"images/lich-xuat-ban-2.png\" alt=\"\"><figcaption><p>Bài Lỗi đăng: khung lỗi ghi rõ nguyên nhân<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tiêu đề nội dung, dòng \"mã · định dạng\", nút X đóng chi tiết; vùng nút theo trạng thái: `Thử lại`, `Sửa lịch`, `Hủy lịch`, `Đánh dấu đã đăng`, `Đánh dấu lỗi` |\n| **Bảng thông tin** | Mã bài, Nền tảng, Trang, Kênh đăng, Giờ đăng, Trạng thái, Chiến dịch (\"mã · tên\"), Kế hoạch nội dung (liên kết), Yêu cầu gốc (liên kết), Người phụ trách, Đội, Thời điểm đã đăng, Mã bài trên nền tảng, `Mở bài` (đường dẫn công khai), \"Bắt đầu đăng lúc\" (khi Đang đăng) |\n| **Khung \"Lỗi đăng\"** | Thông điệp lỗi của lần đăng gần nhất |\n| **Khung \"Bài kẹt\"** | \"Bài ở Đang đăng quá 15 phút - tiến trình đăng đã dừng giữa chừng. Kiểm trên &lt;nền tảng&gt; rồi đánh dấu Đã đăng hoặc Lỗi.\" Người không phải Trưởng/Phó phòng thấy thêm \"Liên hệ Trưởng/Phó phòng để gỡ bài kẹt.\" |\n| **Khung \"Trễ lịch\"** | Website: \"Đã quá giờ đăng &lt;dd/mm/yyyy hh:mm&gt; mà chưa đánh dấu đã đăng.\"; Facebook, Zalo OA: \"Đã quá giờ đăng mà hệ thống chưa đăng. Kiểm kết nối của trang.\" |\n| **Bảng \"Các bài của nội dung này\"** | Mọi bài của cùng nội dung (trừ Đã hủy) kèm trạng thái xuất bản chung; nhấn một dòng để chuyển sang bài đó |\n| **Khối \"Xuất bản đa kênh\"** | Lên lịch thêm nền tảng cho nội dung này (mục 4) |\n| **Lịch sử** | Tạo, sửa giờ, đăng, lỗi, thử lại, hủy, đánh dấu: người, thời điểm, nội dung |\n\n### ⚠️ Lưu ý\n\n* Nhấn dòng \"Chưa hẹn giờ\": chi tiết hiện thông tin nội dung và dòng kế hoạch (kênh, ngày dự kiến), không có vùng nút của bài; dùng khối \"Xuất bản đa kênh\" để lên lịch\n* Bài chưa đăng có chiến dịch vừa bị gỡ khỏi nội dung: cảnh báo \"Chiến dịch &lt;mã&gt; đã được gỡ khỏi nội dung. Sửa lịch để chọn lại chiến dịch của bài nếu cần.\" Bài vẫn đăng theo lịch\n* Liên kết tới bản ghi bạn không có quyền xem hiện chữ thường kèm \"Bạn không có quyền xem bản ghi này\"\n\n## <mark style=\"color:green;\">3. Lên lịch đăng<\/mark>\n\n<figure><img src=\"images/lich-xuat-ban-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>+ Lên lịch đăng<\/code> (hoặc <code>Lên lịch<\/code> ở dòng Chưa hẹn giờ)<\/td><td>Mở hộp \"Lên lịch đăng nội dung\". Mở từ dòng Chưa hẹn giờ thì nội dung được chọn sẵn và khóa<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Nội dung<\/strong> (bắt buộc)<\/td><td>Danh sách \"mã - tiêu đề\" kèm kế hoạch, kênh, ngày dự kiến của dòng; chỉ gồm nội dung đủ điều kiện còn nền tảng chưa có bài. Không có: \"Chưa có nội dung nào đủ điều kiện lên lịch. Nội dung cần Đã duyệt và thuộc kế hoạch nội dung đã duyệt.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Nền tảng<\/strong> (bắt buộc)<\/td><td>Đánh dấu Facebook, Zalo OA, Website; mặc định là kênh dự kiến của dòng kế hoạch<br>Nền tảng đã có bài của nội dung này hiện đánh dấu sẵn, khóa, kèm chip trạng thái<br>Nền tảng chưa kết nối: khóa kèm \"Chưa có Fanpage kết nối\" / \"Chưa có Zalo OA kết nối\". Website luôn chọn được; chưa kết nối thì chú giải \"Đăng tay, hệ thống nhắc khi đến giờ\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><strong>Trang<\/strong> (bắt buộc với Facebook, Zalo OA)<\/td><td>Chọn một hoặc nhiều Fanpage / Zalo OA đã kết nối; chỉ có một trang thì chọn sẵn. Mỗi trang sinh một bài<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><strong>Thời điểm đăng<\/strong><\/td><td><code>Hẹn giờ<\/code> (mặc định) hoặc <code>Đăng ngay<\/code><\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td><strong>Giờ đăng<\/strong> (bắt buộc khi Hẹn giờ)<\/td><td>Mặc định là ngày giờ dự kiến của dòng kế hoạch (nếu còn ở tương lai), không thì giờ chẵn kế tiếp; bước 5 phút. Phải sau thời điểm hiện tại<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td><strong>Chiến dịch của bài<\/strong><\/td><td>Mặc định là chiến dịch của yêu cầu đã sinh ra nội dung, hoặc chiến dịch hợp lệ duy nhất của nội dung. Nội dung gắn nhiều chiến dịch mà không xác định được thì bắt buộc chọn: \"Chọn chiến dịch của bài đăng.\" Mọi bài tạo trong một lần bấm dùng chung chiến dịch này<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Nhấn <code>Lên lịch đăng<\/code> (hoặc <code>Đăng ngay<\/code>)<\/td><td>Có cảnh báo mềm thì khung cảnh báo hiện, ví dụ \"Nền tảng &lt;tên&gt; không phải kênh dự kiến (&lt;kênh&gt;) của dòng kế hoạch &lt;mã&gt;.\" hoặc \"Giờ đăng nằm ngoài kỳ của kế hoạch &lt;mã&gt; (&lt;kỳ&gt;).\" Nhấn nút lần nữa để xác nhận, hoặc sửa lựa chọn<br>Thành công: tạo một bài cho mỗi nền tảng × trang, trạng thái <strong>Đã hẹn giờ<\/strong>, bạn là người phụ trách bài; bài đầu tiên được chọn ở chi tiết<br><code>Đăng ngay<\/code>: hệ thống đăng ngay sau khi lưu, báo \"Đã gửi đăng ngay &lt;tên&gt; lên &lt;n&gt; nền tảng.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Điều kiện lên lịch:** nội dung Đã duyệt và thuộc dòng của kế hoạch nội dung Đã duyệt. Thiếu kế hoạch: \"&lt;Tên nội dung&gt; chưa thuộc kế hoạch nội dung đã duyệt, chưa lên lịch đăng được.\" Chưa duyệt: \"Chỉ lên lịch được nội dung ĐÃ DUYỆT. \"&lt;tên&gt;\" đang ở trạng thái khác.\"\n* **Không đăng trùng:** cùng nội dung, cùng trang đã có bài Đã hẹn giờ, Đang đăng hoặc Đã đăng thì không tạo thêm: \"Nội dung &lt;mã&gt; đã có bài &lt;mã bài&gt; trên &lt;trang&gt; (&lt;trạng thái&gt;).\" Muốn đổi giờ thì sửa bài cũ (mục 7)\n* **Tài nguyên hết hạn quyền sử dụng:** \"Nội dung dùng tài nguyên đã hết hạn quyền sử dụng: &lt;mã&gt;. Bỏ tài nguyên trước khi hẹn giờ.\" Muốn bỏ tài nguyên của nội dung đã duyệt thì trả lại nháp, sửa và duyệt lại\n* **Giới hạn theo nền tảng:**\n  * Facebook không đăng video chung với ảnh hay video khác trong một bài; tách thành các nội dung riêng\n  * Zalo OA chưa đăng được video: \"Zalo OA chưa hỗ trợ đăng video từ hệ thống; bỏ chọn Zalo OA hoặc đăng tay.\" Bài Zalo OA lấy tiêu đề (cắt 150 ký tự), mô tả (300 ký tự đầu), chữ, ảnh (ảnh đầu làm ảnh bìa)\n* Lỗi thường gặp khác: \"Chọn ít nhất một nền tảng.\", \"Chọn ít nhất một Fanpage.\", \"Chọn ít nhất một Zalo OA.\", \"Chọn ngày giờ đăng.\", \"Giờ đăng phải sau thời điểm hiện tại.\"\n* Lỗi khi lưu: \"Chưa lên lịch được, vui lòng thử lại.\" Không bài nào được tạo, dữ liệu đã chọn được giữ\n\n## <mark style=\"color:green;\">4. Lên lịch từ khối Xuất bản đa kênh<\/mark>\n\n<figure><img src=\"images/lich-xuat-ban-4.png\" alt=\"\"><figcaption><p>Nội dung đủ điều kiện: chọn Zalo OA và Website, hẹn giờ đăng<\/p><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết một bài hoặc một dòng Chưa hẹn giờ<\/td><td>Khối \"Xuất bản đa kênh\" nằm dưới bảng thông tin<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đánh dấu <strong>Nền tảng<\/strong>, chọn <strong>Trang<\/strong><\/td><td>Như mục 3. Nền tảng đã có bài hiện chip trạng thái và khóa. Thiếu: \"Chọn ít nhất một nền tảng.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Thời điểm đăng<\/strong><\/td><td><code>Hẹn giờ<\/code> (mặc định) thì nhập <strong>Ngày giờ đăng<\/strong>: bỏ trống \"Chọn ngày giờ đăng.\"; đã qua \"Giờ đăng phải sau thời điểm hiện tại.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Chiến dịch của bài<\/strong> (nếu được hỏi)<\/td><td>Như mục 3<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Hẹn giờ đăng<\/code> (hoặc <code>Đăng tự động<\/code> khi chọn Đăng ngay)<\/td><td>Tạo bài như mục 3; bảng \"Các bài của nội dung này\" cập nhật ngay<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/lich-xuat-ban-5.png\" alt=\"\"><figcaption><p>Nội dung chưa đủ điều kiện: nút khóa kèm chú thích<\/p><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Nội dung chưa đủ điều kiện: nút khóa, dòng trạng thái ghi \"Cần nội dung đã duyệt và thuộc kế hoạch nội dung đã duyệt.\"\n* Mọi nền tảng chọn được đều đã có bài: nút khóa\n* Đủ điều kiện mà chưa chọn gì: dòng trạng thái ghi \"Chọn các nền tảng muốn đăng.\"\n\n## <mark style=\"color:green;\">5. Hệ thống tự đăng và kết quả<\/mark>\n\nPhần này do hệ thống tự làm; người dùng chỉ theo dõi kết quả\n\n| Tình huống | Hệ thống làm gì | Bạn thấy gì |\n| --- | --- | --- |\n| **Tới giờ đăng (Facebook, Zalo OA)** | Cứ 5 phút kiểm một lần; bài tới giờ chuyển **Đang đăng** rồi gửi lên nền tảng | Bài chuyển **Đã đăng**, có mã bài trên nền tảng, thời điểm đăng và nút `Mở bài`. Dòng kế hoạch hiện \"Đã đăng\" |\n| **Website chưa kết nối** | Không tự đăng, giữ Đã hẹn giờ; tạo việc \"Đăng bài lên Website: &lt;tên nội dung&gt;\" cho người phụ trách | Đăng tay trên website rồi `Đánh dấu đã đăng` (mục 9). Quá giờ 15 phút chưa đánh dấu thì hiện cờ Trễ lịch |\n| **Không đủ điều kiện lúc đăng** | Không gửi lên nền tảng, chuyển **Lỗi đăng** kèm lý do; người phụ trách nhận thông báo | Ví dụ \"Nội dung đã bị gỡ duyệt sau khi lên lịch - không đăng.\", \"Kế hoạch nội dung &lt;mã&gt; không còn Đã duyệt - không đăng.\", \"Tài nguyên &lt;mã&gt; đã hết hạn quyền sử dụng.\" |\n| **Nền tảng từ chối** | Chuyển **Lỗi đăng** kèm thông điệp; một bài lỗi không ảnh hưởng bài khác | Ví dụ \"Fanpage \"&lt;tên&gt;\" chưa kết nối Facebook… Vào kênh và bấm \"Kết nối Facebook Page\".\", \"Kênh Zalo OA \"&lt;tên&gt;\" chưa kết nối hoặc đã hết quyền. Vào kênh và kết nối lại.\" |\n| **Tiến trình dừng giữa chừng** | Bài giữ Đang đăng; quá 15 phút thì gắn cờ **Kẹt**, báo Trưởng/Phó phòng một lần. Không tự đăng lại để tránh đăng hai lần | Khung \"Bài kẹt\"; Trưởng/Phó phòng kiểm trên nền tảng rồi gỡ (mục 9) |\n\n### ⚠️ Lưu ý\n\n* Hẹn giờ thì bài được đăng ở lượt kiểm 5 phút đầu tiên sau giờ đăng\n* Zalo OA xử lý chậm: bài giữ Đang đăng tới khi Zalo trả mã bài; quá 15 phút chưa có mã thì là Kẹt\n* Kế hoạch nội dung bị rút về nháp sau khi hẹn giờ: tới giờ bài chuyển Lỗi đăng, không đăng\n* Bài đăng thành công không có thông báo; chỉ bài lỗi và bài kẹt mới báo\n\n## <mark style=\"color:green;\">6. Thử lại bài lỗi<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở bài <strong>Lỗi đăng<\/strong>, đọc khung lỗi<\/td><td>Sửa nguyên nhân bên ngoài trước, ví dụ kết nối lại Fanpage, hoặc trả lại nháp nội dung để sửa rồi duyệt lại<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Thử lại<\/code><\/td><td>Bài về <strong>Đã hẹn giờ<\/strong>, thông điệp lỗi được xóa. Giờ đăng đã qua thì hệ thống đăng ngay; chưa qua thì chờ tới giờ<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xem kết quả<\/td><td>Bài chuyển Đã đăng, hoặc Lỗi đăng với thông điệp mới<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ thử lại bài Lỗi đăng: \"Chỉ thử lại được bài đang ở trạng thái Lỗi.\"\n* Thử lại không đổi nền tảng, trang. Muốn hẹn giờ khác thì `Sửa lịch` trước rồi mới thử lại\n\n## <mark style=\"color:green;\">7. Sửa lịch<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở bài <strong>Đã hẹn giờ<\/strong> hoặc <strong>Lỗi đăng<\/strong>, nhấn <code>Sửa lịch<\/code><\/td><td>Mở hộp \"Sửa lịch đăng\": nội dung và nền tảng khóa<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đổi <strong>Giờ đăng<\/strong>, <strong>Trang<\/strong> hoặc <strong>Chiến dịch của bài<\/strong><\/td><td>Kiểm như khi lên lịch (mục 3)<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Lưu lịch<\/code><\/td><td>Hệ thống báo \"Đã lưu lịch &lt;mã bài&gt;.\"; lịch sử ghi giờ cũ → mới<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Bài đã đăng, đang đăng, đã hủy không sửa được: \"Bài đã đăng / đang đăng / đã hủy thì không sửa lịch được.\"\n\n## <mark style=\"color:green;\">8. Hủy lịch<\/mark>\n\n<figure><img src=\"images/lich-xuat-ban-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Ở bài <strong>Đã hẹn giờ<\/strong> hoặc <strong>Lỗi đăng<\/strong>, nhấn <code>Hủy lịch<\/code><\/td><td>Hộp \"Hủy lịch đăng bài này?\" ghi \"Bài &lt;mã bài&gt; · &lt;nội dung&gt; · &lt;nền tảng&gt; · &lt;giờ đăng&gt; sẽ không được đăng. Muốn đăng lại phải lên lịch mới.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Hủy lịch<\/code><\/td><td>Bài chuyển <strong>Đã hủy<\/strong>, hệ thống báo \"Đã hủy lịch &lt;mã bài&gt;.\" Nội dung không còn bài nào khác thì quay lại dòng \"Chưa hẹn giờ\". Nhấn <code>Huỷ<\/code> để đóng, không đổi gì<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ hủy được bài chưa đăng: \"Chỉ hủy được lịch của bài chưa đăng.\"\n* Bài đăng không xóa được ở mọi vai trò; muốn bỏ thì hủy lịch để giữ dấu vết\n* Cần hủy lịch trước khi trả lại nháp một nội dung đã duyệt ở [Duyệt nội dung](duyet-noi-dung.md)\n\n## <mark style=\"color:green;\">9. Đánh dấu đã đăng và gỡ bài kẹt<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n**Bài Website đăng tay**\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Đăng bài lên website (khi nhận việc nhắc), rồi mở bài Website <strong>Đã hẹn giờ<\/strong> hoặc <strong>Lỗi đăng<\/strong><\/td><td>Nhấn <code>Đánh dấu đã đăng<\/code>. Hộp hiện mã bài, nội dung, nền tảng, giờ đăng<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Đường dẫn bài<\/strong> (bắt buộc)<\/td><td>Bắt đầu bằng http:// hoặc https://, tối đa 2.000 ký tự. Sai: \"Nhập đường dẫn bài trên website (bắt đầu bằng http:// hoặc https://).\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><strong>Thời điểm đã đăng<\/strong> (bắt buộc)<\/td><td>Mặc định hiện tại; không được sau hiện tại: \"Thời điểm đã đăng không được sau hiện tại.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Xác nhận<\/code><\/td><td>Bài chuyển <strong>Đã đăng<\/strong>, việc nhắc được đóng, hệ thống báo \"Đã đánh dấu đã đăng &lt;mã bài&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Gỡ bài kẹt** (chỉ Trưởng/Phó phòng, BGĐ)\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở bài có cờ <strong>Kẹt<\/strong>, kiểm trên Facebook / Zalo OA xem bài đã lên chưa<\/td><td>Chỉ gỡ được bài ở Đang đăng quá 15 phút: \"Chỉ gỡ được bài ở Đang đăng quá 15 phút - bài mới hơn có thể vẫn đang được đăng.\"<\/td><\/tr>\n<tr><td><strong>Bước 2a<\/strong><\/td><td>Bài đã có trên nền tảng: nhấn <code>Đánh dấu đã đăng<\/code><\/td><td>Nhập <strong>Mã bài trên nền tảng<\/strong> (bắt buộc, tối đa 100 ký tự; Facebook dạng <code>&lt;page_id&gt;_&lt;post_id&gt;<\/code>) và thời điểm đã đăng, nhấn <code>Xác nhận<\/code>. Bài chuyển Đã đăng<\/td><\/tr>\n<tr><td><strong>Bước 2b<\/strong><\/td><td>Bài không có trên nền tảng: nhấn <code>Đánh dấu lỗi<\/code><\/td><td>Hộp hỏi \"Đã kiểm trên Facebook và bài KHÔNG có ở đó? Đánh dấu Lỗi rồi có thể Thử lại.\" Xác nhận thì bài chuyển Lỗi đăng; sau đó dùng <code>Thử lại<\/code> (mục 6)<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Bài Website: người phụ trách bài, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ đánh dấu được\n* Bài Facebook, Zalo OA không kẹt thì không đánh dấu tay: \"Chỉ bài Website hoặc bài kẹt mới đánh dấu đã đăng bằng tay.\"\n* Người khác gỡ bài kẹt: \"Chỉ trưởng / phó phòng Marketing được gỡ bài kẹt.\"\n* **Ai sửa, hủy, thử lại:** người phụ trách bài, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng, BGĐ\n", "noi-dung-va-media/lich-quay-chup.md": "# Lịch quay chụp\n\n🧭 Tổng quan chức năng: Đặt lịch và theo dõi các buổi quay video, chụp ảnh phục vụ sản xuất nội dung: thời gian, địa điểm, ê-kíp, chiến dịch và yêu cầu nội dung liên quan. Sau buổi quay, ê-kíp bàn giao tư liệu vào [Kho ảnh video](kho-anh-video.md) để người làm nội dung tìm đúng tư liệu theo buổi. Mọi người trong phòng Marketing đều đặt được lịch quay\n\nTruy cập: menu **Nội dung & media → Tài nguyên → Lịch quay chụp**\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH MỘT BUỔI QUAY\n\nBước 1: Người làm Marketing bấm `Đặt lịch quay`, nhập tên, thời gian, địa điểm, ê-kíp. Hệ thống cảnh báo nếu trùng lịch người hoặc địa điểm. Buổi quay được cấp mã dạng **MKT-LQ-0001**, trạng thái **Đã đặt lịch**. Ê-kíp nhận thông báo phân công\n\nBước 2: Đến giờ, buổi quay tự hiển thị **Đang thực hiện**. Qua giờ kết thúc mà chưa ai bấm Hoàn thành thì hiển thị **Quá giờ, chưa hoàn thành**\n\nBước 3: Sau buổi quay, ê-kíp hoặc người phụ trách bàn giao tư liệu: tải ảnh, video mới hoặc chọn tệp có sẵn trong kho rồi gắn vào buổi quay\n\nBước 4: Người phụ trách bấm `Hoàn thành`. Nếu buổi chưa có tư liệu, hệ thống nhắc gắn tư liệu. Buổi không diễn ra thì bấm `Hủy buổi` kèm lý do\n\n**Trạng thái buổi quay**\n\n| Trạng thái | Ý nghĩa |\n| --- | --- |\n| **Đã đặt lịch** | Chưa tới giờ bắt đầu |\n| **Đang thực hiện** | Đang trong khoảng giờ bắt đầu – kết thúc |\n| **Quá giờ, chưa hoàn thành** | Đã qua giờ kết thúc, chưa bấm Hoàn thành |\n| **Hoàn thành** | Đã hoàn thành. Nếu chưa có tư liệu thì kèm nhãn **Chưa bàn giao tư liệu** |\n| **Đã hủy** | Buổi không diễn ra |\n\nHoàn thành và Đã hủy là trạng thái cuối, không mở lại được. Muốn quay lại thì đặt buổi mới\n\n**Ai làm được gì**\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng, BGĐ |\n| --- | --- | --- | --- |\n| Xem lịch, chi tiết buổi quay | Buổi mình phụ trách, mình tạo hoặc mình có trong ê-kíp | Buổi của đội mình | Tất cả |\n| Đặt lịch quay | Có | Có | Có |\n| Sửa, sửa ghi chú, Hoàn thành, Hủy buổi | Buổi mình phụ trách hoặc mình tạo | Buổi của đội | Tất cả |\n| Gắn, gỡ tư liệu | Buổi mình phụ trách, mình tạo hoặc mình có trong ê-kíp | Buổi của đội | Tất cả |\n| Xuất Excel | Trong phạm vi xem | Trong phạm vi xem | Tất cả |\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem lịch quay chụp<\/mark>\n\n<figure><img src=\"images/lich-quay-chup-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề \"Lịch quay chụp\", dòng đếm \"a buổi đã đặt lịch · b buổi trong khoảng đang xem\", ô tìm, nút `Xuất Excel`, nút `+ Đặt lịch quay` |\n| **Chế độ xem** | Nút **Lịch** và **Danh sách**. Trong chế độ Lịch có thêm nút **Tuần**, **Tháng**, **Trước**, **Sau**, `Hôm nay` và nhãn khoảng đang xem, ví dụ \"Tuần 12/10 – 18/10/2026\" hoặc \"Tháng 10/2026\". Mặc định mở chế độ Lịch, tuần chứa hôm nay. Hệ thống nhớ chế độ bạn chọn cho lần mở sau |\n| **Lưới lịch** | **Tuần**: cột thứ Hai đến Chủ nhật, hàng theo giờ 06:00–22:00. Mỗi buổi là một ô từ giờ bắt đầu tới giờ kết thúc, ghi \"giờ mã · tên\". **Tháng**: mỗi ô ngày hiện tối đa 3 buổi, còn lại gộp thành \"+n buổi\" (bấm để xem hết). Ô hôm nay có viền. Buổi kéo qua nhiều ngày hiện ở mọi ngày đó |\n| **Bộ lọc nhanh** | Tất cả (mặc định), Đã đặt lịch (gồm cả Đang thực hiện, Quá giờ), Hoàn thành, Đã hủy, Chưa bàn giao tư liệu |\n| **Bộ lọc khác** | Chiến dịch, Người trong ê-kíp, Người phụ trách, Đội, Từ ngày – Đến ngày (chỉ ở chế độ Danh sách, mặc định tháng hiện tại), **Của tôi** (buổi mình phụ trách, mình tạo hoặc mình trong ê-kíp). Lọc đang áp hiện thành chip, kèm nút `Xóa bộ lọc` |\n| **Bảng danh sách** | Cột **Buổi quay** (tên, dòng phụ là mã), **Thời gian** (giờ bắt đầu, dòng phụ \"đến hh:mm\"), **Địa điểm**, **Ê-kíp** (\"Chưa phân công\" nếu chưa có ai), **Chiến dịch**, **Trạng thái**, **Tư liệu** (số tệp đã gắn; buổi Hoàn thành chưa có tư liệu hiện chip \"Chưa bàn giao\"). Xếp theo giờ bắt đầu, mới nhất trước |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Nội dung &amp; media → Tài nguyên → Lịch quay chụp<\/strong><\/td><td>Hệ thống mở chế độ Lịch, tuần chứa hôm nay. Chỉ hiện các buổi bạn được xem<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn chế độ xem<\/td><td>Nhấn <strong>Tuần<\/strong> hoặc <strong>Tháng<\/strong> để đổi lưới lịch. Nhấn <strong>Trước<\/strong>, <strong>Sau<\/strong> để chuyển tuần, tháng. Nhấn <code>Hôm nay<\/code> để quay về khoảng chứa hôm nay. Nhấn <strong>Danh sách<\/strong> để xem dạng bảng<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Lọc<\/td><td>Chọn một bộ lọc nhanh, hoặc chọn thêm Chiến dịch, Người trong ê-kíp, Người phụ trách, Đội, khoảng ngày, <strong>Của tôi<\/strong>. Lịch, bảng và dòng đếm vẽ lại ngay. Một buổi được tính nếu thời gian của nó giao một phần với khoảng đã chọn<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Tìm<\/td><td>Nhập vào ô <strong>Tìm theo mã, tiêu đề…<\/strong> (tối đa 100 ký tự). Hệ thống tìm trong mã, tên buổi quay, địa điểm, không phân biệt hoa thường và dấu: \"giang vo\" khớp \"Giảng Võ\"; nhập \"0014\" hay \"MKT-LQ-0014\" đều ra cùng buổi<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Bấm một buổi quay<\/td><td>Chi tiết buổi quay mở ở cột phải (xem mục 2). Chế độ xem, khoảng đang xem, bộ lọc và ô tìm giữ nguyên khi bạn chọn buổi khác<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Trạng thái **Đang thực hiện** và **Quá giờ, chưa hoàn thành** tính theo giờ Việt Nam lúc bạn xem; không ai đổi tay được\n* Dòng đếm chỉ tính buổi nằm trong tuần, tháng hoặc khoảng ngày đang xem và khớp bộ lọc. Số \"đã đặt lịch\" gồm cả buổi Đang thực hiện và Quá giờ\n* Không có buổi nào khớp thì hiện \"Không có buổi quay khớp điều kiện.\" (danh sách) hoặc \"Không có buổi quay trong tuần này.\" / \"… trong tháng này.\" (lịch)\n* Lỗi tải dữ liệu thì hiện \"Không tải được lịch quay chụp\" và nút `Thử lại`\n* Mở đường dẫn tới buổi ngoài phạm vi của bạn thì hiện \"Bạn không có quyền xem buổi quay này.\"\n\n## <mark style=\"color:green;\">2. Xem chi tiết buổi quay<\/mark>\n\n<figure><img src=\"images/lich-quay-chup-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên buổi quay, dòng phụ \"mã · người phụ trách\", chip trạng thái. Nút `X` đóng chi tiết |\n| **Nút thao tác** | Buổi Đã đặt lịch: `Hoàn thành` (nút chính), `Sửa`, `Hủy buổi`. Buổi Hoàn thành hoặc Đã hủy: chỉ có `Sửa ghi chú`. Bạn chỉ thấy nút mình có quyền |\n| **Bảng thông tin** | Bắt đầu, Kết thúc, Địa điểm, Ê-kíp (mỗi dòng \"tên – vai trò\"), Chiến dịch, Yêu cầu nội dung liên quan, Người phụ trách, Đội, Trạng thái, Ghi chú. Buổi Hoàn thành có thêm Hoàn thành lúc, bởi ai và lý do chưa bàn giao tư liệu (nếu có). Buổi Đã hủy có thêm lý do hủy, hủy lúc, bởi ai |\n| **Khung thông báo** | Khung \"Đã bàn giao n tư liệu vào Kho ảnh video.\" kèm nút `Mở kho` (buổi Hoàn thành có tư liệu); khung \"Buổi quay đã hoàn thành nhưng chưa bàn giao tư liệu. Lý do: …\" kèm nút `Gắn tư liệu`; khung Quá giờ; khung Đã hủy |\n| **Tư liệu bàn giao** | Bảng tư liệu đã gắn và vùng gắn tư liệu mới (xem mục 5) |\n| **Lịch sử** | Thời điểm, người, nội dung từng thay đổi: tạo, sửa trường (giá trị cũ → mới), đổi trạng thái, gắn và gỡ tư liệu, lưu khi trùng lịch. Mới nhất ở trên |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Bấm tên buổi quay trên lịch hoặc bảng<\/td><td>Chi tiết mở ở cột phải, bảng thu hẹp lại. Dòng đang chọn được tô nền<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc khung thông báo<\/td><td>Buổi quá giờ hiện: \"Buổi quay đã qua giờ kết thúc &lt;ngày giờ&gt; mà chưa hoàn thành. Bàn giao tư liệu rồi bấm Hoàn thành, hoặc Hủy buổi nếu không quay.\" Buổi đã hủy hiện: \"Buổi quay đã hủy lúc &lt;ngày giờ&gt; bởi &lt;tên&gt;. Lý do: &lt;lý do&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Bấm liên kết Chiến dịch, Yêu cầu nội dung hoặc tên tệp tư liệu<\/td><td>Hệ thống mở đúng bản ghi ở màn tương ứng: <a href=\"../chien-dich/danh-sach-chien-dich.md\">Danh sách chiến dịch<\/a>, <a href=\"yeu-cau-noi-dung.md\">Yêu cầu nội dung<\/a>, <a href=\"kho-anh-video.md\">Kho ảnh video<\/a><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Mở kho<\/code> (buổi đã bàn giao)<\/td><td>Kho ảnh video mở, lọc sẵn theo buổi quay này<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>X<\/code><\/td><td>Đóng chi tiết, bảng trở lại đủ rộng<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/lich-quay-chup-7.png\" alt=\"\"><figcaption><p>Chi tiết buổi quay đã hủy: không còn nút thao tác, khối Tư liệu bàn giao chỉ ghi \"Buổi quay đã hủy, không bàn giao tư liệu.\"<\/p><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Liên kết tới bản ghi bạn không có quyền xem bị khóa, kèm chú giải \"Bạn không có quyền xem bản ghi này\". Bản ghi đã bị xóa thì hiện \"Bản ghi không còn.\"\n* Buổi Đã hủy không có nút `Hoàn thành`, `Hủy buổi`, `Gắn tư liệu`\n\n## <mark style=\"color:green;\">3. Đặt lịch quay mới<\/mark>\n\n<figure><img src=\"images/lich-quay-chup-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp thoại **Đặt lịch quay chụp**. Ô có dấu **\\*** là bắt buộc\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tên buổi quay \\*** | Tối đa 255 ký tự |\n| **Chiến dịch** | Không bắt buộc. Mặc định \"Không gắn chiến dịch\". Mỗi dòng \"mã - tên\", có ô tìm. Chỉ hiện chiến dịch bạn được xem, trừ chiến dịch bị từ chối |\n| **Yêu cầu nội dung liên quan** | Không bắt buộc, chọn được nhiều. Chỉ hiện yêu cầu chưa Hoàn thành, chưa Hủy. Chọn một yêu cầu có chiến dịch khi ô Chiến dịch còn trống thì hệ thống tự điền chiến dịch đó |\n| **Bắt đầu \\*** | Định dạng \"dd/mm/yyyy hh:mm\", bước 15 phút. Mặc định 08:00 ngày làm việc kế tiếp. Không được trước thời điểm hiện tại |\n| **Kết thúc \\*** | Mặc định Bắt đầu + 4 giờ; đổi Bắt đầu thì Kết thúc dời theo, giữ nguyên độ dài. Phải sau Bắt đầu, buổi dài tối đa 3 ngày |\n| **Địa điểm \\*** | Tối đa 255 ký tự. Gợi ý tối đa 10 địa điểm đã dùng, dùng gần nhất lên trước |\n| **Ê-kíp** | Không bắt buộc khi đặt lịch. Bảng dòng: **Người** (người dùng trong phòng Marketing, tìm theo tên) và **Vai trò** (Quay phim, Chụp ảnh, Đạo diễn, Hỗ trợ; mặc định Quay phim). Nút `Thêm người` để thêm dòng |\n| **Người phụ trách \\*** | Mặc định là bạn |\n| **Đội nhóm** | Mặc định đội của người phụ trách; đổi người phụ trách thì đội đổi theo nếu bạn chưa tự chọn đội |\n| **Ghi chú** | Nhiều dòng, tối đa 5.000 ký tự. Ghi người ngoài hệ thống (thuê ngoài, khách mời) ở đây |\n| **Nút** | `Đặt lịch quay`, `Huỷ` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>+ Đặt lịch quay<\/code><\/td><td>Hộp thoại mở với giá trị mặc định. Nếu mở từ chi tiết một yêu cầu nội dung, ô Yêu cầu nội dung liên quan, Chiến dịch và Tên buổi quay đã được điền sẵn<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Tên buổi quay<\/strong><\/td><td>Ví dụ \"Quay video review máy cắt A5\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Chiến dịch<\/strong>, <strong>Yêu cầu nội dung liên quan<\/strong><\/td><td>Không bắt buộc. Gắn để người khác tìm được buổi quay theo chiến dịch, yêu cầu<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Bắt đầu<\/strong>, <strong>Kết thúc<\/strong><\/td><td>Chọn ngày giờ trong lịch chọn hoặc gõ theo dạng \"dd/mm/yyyy hh:mm\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhập <strong>Địa điểm<\/strong><\/td><td>Có thể chọn từ danh sách gợi ý<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Thêm <strong>Ê-kíp<\/strong><\/td><td>Nhấn <code>Thêm người<\/code>, chọn người, chọn vai trò. Mỗi người chỉ một dòng; chọn trùng thì báo \"&lt;Tên&gt; đã có trong ê-kíp.\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Kiểm tra <strong>Người phụ trách<\/strong>, <strong>Đội nhóm<\/strong>, nhập <strong>Ghi chú<\/strong><\/td><td>Đổi người phụ trách nếu bạn đặt lịch hộ người khác<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Nhấn <code>Đặt lịch quay<\/code><\/td><td>Hệ thống kiểm tra dữ liệu. Có lỗi thì hiện tất cả lỗi, mỗi lỗi ngay tại ô sai; hộp thoại giữ nguyên dữ liệu<\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td>Xử lý cảnh báo trùng lịch (nếu có)<\/td><td>Nếu có buổi Đã đặt lịch khác trùng giờ và chung người trong ê-kíp hoặc cùng địa điểm, hệ thống chưa lưu mà hiện khung \"Trùng lịch với n buổi quay:\", mỗi dòng \"mã · giờ bắt đầu–giờ kết thúc · trùng &lt;tên người hoặc 'địa điểm'&gt;\". Nhấn <code>Sửa lại<\/code> để đóng khung và chỉnh; hoặc <code>Vẫn lưu<\/code> để lưu dù trùng (lịch sử ghi \"Lưu khi trùng lịch với …\")<\/td><\/tr>\n<tr><td><strong>Bước 10<\/strong><\/td><td>Xem kết quả<\/td><td>Hộp thoại đóng, lịch nhảy tới tuần chứa buổi vừa đặt và mở chi tiết. Thông báo \"Đã đặt lịch quay &lt;mã&gt; &lt;tên&gt;.\" Người trong ê-kíp nhận thông báo \"Bạn được phân công &lt;vai trò&gt; buổi quay &lt;mã&gt; &lt;tên&gt;, &lt;ngày giờ&gt; tại &lt;địa điểm&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Các lỗi thường gặp: \"Nhập tên buổi quay.\", \"Nhập địa điểm.\", \"Chọn thời gian bắt đầu và kết thúc.\", \"Giờ kết thúc phải sau giờ bắt đầu.\", \"Không đặt lịch quay vào thời điểm đã qua.\", \"Một buổi quay không kéo dài quá 3 ngày; chia thành nhiều buổi.\", \"Chọn người phụ trách.\"\n* Hai buổi nối tiếp nhau (08:00–12:00 và 12:00–15:00) không tính là trùng. So địa điểm không phân biệt hoa thường, dấu và khoảng trắng thừa\n* Cảnh báo trùng kiểm trên mọi buổi quay của phòng, kể cả buổi bạn không xem được. Với các buổi đó, bạn chỉ thấy mã, giờ và loại trùng. Buổi Hoàn thành, Đã hủy không tính\n* Trùng lịch chỉ là cảnh báo, không chặn. Hãy trao đổi với người liên quan trước khi bấm `Vẫn lưu`\n* Lỗi khi lưu thì hiện \"Chưa lưu được buổi quay, vui lòng thử lại.\" và giữ dữ liệu đang nhập\n* Nhấn `Huỷ`, `X` hoặc phím Esc để đóng mà không lưu; dữ liệu đã nhập bị bỏ\n* Giai đoạn này hệ thống chỉ gửi thông báo trong hệ thống; chưa đồng bộ Google Calendar, chưa nhắc qua email hay Zalo, chưa kéo-thả đổi giờ trên lịch, chưa đặt thiết bị hay phòng studio\n\n## <mark style=\"color:green;\">4. Sửa buổi quay<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết buổi quay, nhấn <code>Sửa<\/code><\/td><td>Chỉ có ở buổi Đã đặt lịch. Hộp thoại \"Sửa buổi quay &lt;mã&gt;\" mở với dữ liệu hiện có; mọi ô sửa được<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Sửa thông tin<\/td><td>Các ô và quy tắc giống khi đặt lịch mới (mục 3). Giờ bắt đầu chưa qua thì không được dời sang thời điểm đã qua<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Lưu<\/code><\/td><td>Hệ thống kiểm tra dữ liệu và kiểm trùng lịch như khi đặt mới<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xem kết quả<\/td><td>Thông báo \"Đã lưu buổi quay &lt;mã&gt;.\" Ê-kíp nhận thông báo khi đổi giờ hoặc địa điểm (\"Buổi quay &lt;mã&gt; đổi sang &lt;ngày giờ&gt; tại &lt;địa điểm&gt;.\"), khi được thêm vào ê-kíp, hoặc khi bị bỏ khỏi ê-kíp (\"Bạn không còn trong ê-kíp buổi quay &lt;mã&gt;.\")<\/td><\/tr>\n<\/tbody><\/table>\n\n**Sửa ghi chú buổi Hoàn thành hoặc Đã hủy:** nhấn `Sửa ghi chú`. Hộp thoại \"Sửa ghi chú\" chỉ mở ô Ghi chú, không kiểm trùng lịch. Nhấn `Lưu` để quay lại chi tiết\n\n### ⚠️ Lưu ý\n\n* Chỉ người phụ trách, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng và BGĐ sửa được. Thành viên ê-kíp chỉ gắn, gỡ tư liệu\n* Buổi Hoàn thành, Đã hủy bị khóa mọi trường trừ Ghi chú\n* Người thao tác không nhận thông báo về thay đổi do chính mình làm\n\n## <mark style=\"color:green;\">5. Bàn giao tư liệu buổi quay<\/mark>\n\n<figure><img src=\"images/lich-quay-chup-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nKhối **Tư liệu bàn giao** nằm cuối chi tiết buổi quay\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Bảng tư liệu đã gắn** | Cột Mã tài nguyên, Tệp trong Kho (bấm để mở chi tiết tệp ở Kho ảnh video), Loại (Ảnh, Video), Dung lượng, Người tải, Ngày tải lên, nút `Gỡ`. Tệp mới tải lên trước. Tệp đã lưu trữ trong kho vẫn hiện, kèm chip \"Lưu trữ\". Chưa có tệp nào thì ghi \"Chưa gắn tư liệu.\" |\n| **Tải ảnh / video mới lên Kho** | Chọn nhiều tệp ảnh, video, tối đa 20 MB mỗi tệp. Danh sách tệp đã chọn hiện tên, dung lượng, nút bỏ từng tệp |\n| **Thư mục** | Không bắt buộc. Thư mục trong Kho ảnh video cho các tệp mới của lượt này, hiện dạng \"Cha / Con\" |\n| **Hoặc chọn tệp có sẵn trong Kho** | Ô tìm chọn nhiều theo mã, tên tệp, thẻ; tối đa 20 kết quả mỗi lần tìm, mỗi kết quả có ảnh thu nhỏ, tên, loại, dung lượng. Chỉ hiện tệp đang sử dụng và chưa gắn với buổi này |\n| **Nút** | `Gắn tư liệu` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết buổi quay Đã đặt lịch hoặc Hoàn thành<\/td><td>Cuộn xuống khối <strong>Tư liệu bàn giao<\/strong>. Từ khung \"chưa bàn giao\" hoặc hộp nhắc khi Hoàn thành, nút <code>Gắn tư liệu<\/code> đưa bạn thẳng tới khối này<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn tệp mới ở <strong>Tải ảnh / video mới lên Kho<\/strong><\/td><td>Hệ thống kiểm tra ngay khi chọn: tệp quá 20 MB hoặc không phải ảnh, video bị báo lỗi tại chỗ. Bỏ tệp lỗi bằng nút bỏ cạnh tên tệp<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Thư mục<\/strong> (nếu muốn)<\/td><td>Các tệp mới sẽ nằm trong thư mục này ở Kho ảnh video. Bỏ trống thì nằm ở \"Chưa xếp thư mục\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn tệp ở <strong>Hoặc chọn tệp có sẵn trong Kho<\/strong><\/td><td>Gõ mã, tên tệp hoặc thẻ để tìm, tích các tệp cần gắn. Có thể vừa tải tệp mới vừa chọn tệp có sẵn trong cùng một lượt<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Gắn tư liệu<\/code><\/td><td>Chưa chọn gì thì báo \"Chọn tệp để tải lên hoặc tài nguyên có sẵn trong kho.\" Có tệp lỗi thì báo lỗi từng tệp, ví dụ \"Tệp \"phu-kien-bo-42-anh.zip\" không phải ảnh hoặc video (nhận ra là application/zip).\" hoặc \"Tệp \"&lt;tên&gt;\" nặng &lt;x.x&gt; MB, vượt mức tối đa 20 MB.\"; không tệp nào của lượt được tạo<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Xử lý cảnh báo tệp trùng (nếu có)<\/td><td>Nếu tệp mới có nội dung giống hệt một tệp đã có trong kho (kể cả khác tên), hệ thống chưa tạo gì và hiện \"Có tệp trùng nội dung với tệp đã có trong kho. Nên dùng lại tệp có sẵn; bấm \"Vẫn tải lên\" nếu vẫn muốn thêm bản mới.\" kèm danh sách tệp có sẵn. Chọn:<br>• <code>Gắn tệp có sẵn<\/code>: gắn tệp có sẵn thay cho tệp trùng; các tệp không trùng vẫn được tải lên<br>• <code>Vẫn tải lên<\/code>: tạo bản mới trong kho<br>• <code>Huỷ<\/code>: đóng khung, giữ lựa chọn để bạn chỉnh<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Xem kết quả<\/td><td>Bảng tư liệu cập nhật. Thông báo \"Đã gắn &lt;n&gt; tư liệu vào buổi quay &lt;mã&gt;.\" Buổi Hoàn thành mất nhãn \"Chưa bàn giao tư liệu\"; việc cần làm \"Bàn giao tư liệu buổi quay …\" tự đóng<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Tệp mới tải ở đây được đưa vào [Kho ảnh video](kho-anh-video.md) với chiến dịch và đội của buổi quay, người tải là bạn, quyền sử dụng **Nội bộ**, thẻ \"buổi quay\". Muốn đổi quyền sử dụng (ví dụ ảnh có khách hàng cần đặt **Hạn chế**), sửa tệp ở Kho ảnh video\n* Một tệp có thể gắn vào nhiều buổi quay; chi tiết tệp ở Kho ảnh video hiện các buổi quay chứa tệp đó\n* Hệ thống chỉ nhận ảnh hoặc video, nhận theo nội dung tệp chứ không theo đuôi tệp. Tệp nén (.zip) không được nhận. Tư liệu gốc lớn hơn 20 MB chưa lưu được trên hệ thống; hãy lưu ở nơi lưu trữ riêng và ghi đường dẫn vào Ghi chú\n* Tệp trùng đã lưu trữ hoặc hết hạn quyền sử dụng không gắn được, kèm chú giải \"Tệp có sẵn &lt;mã&gt; đã lưu trữ hoặc hết hạn quyền sử dụng; tải bản mới hoặc khôi phục tệp.\"\n* Thêm hoặc bỏ tệp sau khi đã có cảnh báo trùng thì cảnh báo cũ hết hiệu lực; hệ thống kiểm lại khi bạn bấm `Gắn tư liệu`\n* Lỗi khi gắn thì cả lượt được hoàn tác (không có tệp mới nằm trong kho mà không gắn vào buổi) và hiện \"Chưa gắn được tư liệu, vui lòng thử lại.\"\n* Buổi Đã hủy không gắn được tư liệu: khối chỉ hiện \"Buổi quay đã hủy, không bàn giao tư liệu.\"\n* Người không có quyền gắn chỉ thấy bảng tư liệu, không có ô tải, ô chọn và nút `Gỡ`\n\n## <mark style=\"color:green;\">6. Gỡ tư liệu khỏi buổi quay<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Gỡ<\/code> ở dòng tư liệu cần bỏ<\/td><td>Hệ thống bỏ liên kết giữa tệp và buổi quay, ghi lịch sử, hiện \"Đã gỡ &lt;tên tệp&gt; khỏi buổi quay.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xác nhận khi gỡ tệp cuối cùng của buổi Hoàn thành<\/td><td>Hệ thống hỏi \"Buổi quay sẽ không còn tư liệu bàn giao. Vẫn gỡ?\". Nhấn <code>Vẫn gỡ<\/code> để gỡ, buổi mang lại nhãn \"Chưa bàn giao tư liệu\"; nhấn <code>Không gỡ<\/code> để giữ nguyên<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Gỡ chỉ bỏ liên kết, không xóa tệp khỏi Kho ảnh video\n\n## <mark style=\"color:green;\">7. Hoàn thành buổi quay<\/mark>\n\n<figure><img src=\"images/lich-quay-chup-5.png\" alt=\"\"><figcaption><p>Buổi quay đã hoàn thành và đã bàn giao tư liệu: khung \"Đã bàn giao\" kèm nút <code>Mở kho<\/code><\/p><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết buổi quay Đã đặt lịch, nhấn <code>Hoàn thành<\/code><\/td><td>Hệ thống kiểm tra: đã đến giờ bắt đầu và có ít nhất một người trong ê-kíp. Chưa đạt thì báo \"Chưa đến giờ bắt đầu buổi quay, chưa hoàn thành được.\" hoặc \"Phân công ê-kíp trước khi hoàn thành buổi quay.\"<\/td><\/tr>\n<tr><td><strong>Bước 2a<\/strong><\/td><td>Buổi đã có tư liệu<\/td><td>Buổi chuyển <strong>Hoàn thành<\/strong> ngay, ghi người và thời điểm hoàn thành. Thông báo \"Đã hoàn thành buổi quay &lt;mã&gt;. Tư liệu đã bàn giao: &lt;n&gt; tệp.\" Chi tiết hiện khung \"Đã bàn giao &lt;n&gt; tư liệu vào Kho ảnh video.\"<\/td><\/tr>\n<tr><td><strong>Bước 2b<\/strong><\/td><td>Buổi chưa có tư liệu<\/td><td>Hộp nhắc <strong>Buổi quay chưa có tư liệu bàn giao<\/strong> mở: \"Buổi quay &lt;mã&gt; &lt;tên&gt; chưa có ảnh, video nào được bàn giao vào Kho ảnh video. Gắn tư liệu ngay để người làm nội dung tìm được tư liệu theo buổi quay.\" Có ô <strong>Lý do chưa bàn giao<\/strong> và ba nút (bước 3)<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn một nút trong hộp nhắc<\/td><td>• <code>Gắn tư liệu<\/code> (nút chính): đóng hộp, cuộn tới khối Tư liệu bàn giao; buổi vẫn Đã đặt lịch. Gắn xong, bấm lại <code>Hoàn thành<\/code><br>• <code>Hoàn thành, bàn giao sau<\/code>: nhập <strong>Lý do chưa bàn giao<\/strong> (bắt buộc, tối đa 1.000 ký tự; trống thì báo \"Nhập lý do chưa bàn giao tư liệu.\"). Buổi chuyển Hoàn thành, mang nhãn \"Chưa bàn giao tư liệu\"; thông báo \"Đã hoàn thành buổi quay &lt;mã&gt;. Chưa bàn giao tư liệu.\"<br>• <code>Đóng<\/code>: đóng hộp, không đổi gì<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Chỉ người phụ trách, người tạo, Trưởng nhóm của đội, Trưởng/Phó phòng và BGĐ bấm được `Hoàn thành`\n* Khi chọn \"Hoàn thành, bàn giao sau\", người phụ trách nhận việc cần làm \"Bàn giao tư liệu buổi quay &lt;mã&gt;\", hạn sau 2 ngày. Việc tự đóng khi gắn tệp đầu tiên; nhãn \"Chưa bàn giao tư liệu\" cũng mất\n* Dùng bộ lọc nhanh **Chưa bàn giao tư liệu** để tìm các buổi còn nợ tư liệu\n* Buổi Hoàn thành vẫn gắn, gỡ tư liệu được\n\n## <mark style=\"color:green;\">8. Hủy buổi quay<\/mark>\n\n<figure><img src=\"images/lich-quay-chup-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\nHộp xác nhận **Hủy buổi quay?**\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Nội dung xác nhận** | \"Hủy buổi quay &lt;mã&gt; &lt;tên&gt;? Ê-kíp sẽ nhận thông báo hủy. Chiến dịch và yêu cầu nội dung liên kết vẫn giữ nguyên.\" |\n| **Lý do hủy \\*** | Nhiều dòng, tối đa 1.000 ký tự |\n| **Nút** | `Hủy buổi`, `Không hủy` |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chi tiết buổi quay Đã đặt lịch, nhấn <code>Hủy buổi<\/code><\/td><td>Có cả ở buổi đang hiển thị Đang thực hiện hoặc Quá giờ<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Lý do hủy<\/strong><\/td><td>Bắt buộc. Trống thì báo \"Nhập lý do hủy.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Hủy buổi<\/code><\/td><td>Buổi chuyển <strong>Đã hủy<\/strong>, ghi người, thời điểm, lý do. Thông báo \"Đã hủy buổi quay &lt;mã&gt;.\" Người phụ trách và ê-kíp nhận \"Buổi quay &lt;mã&gt; đã hủy. Lý do: &lt;lý do&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Buổi đã có tư liệu không hủy được: \"Buổi quay đã có tư liệu bàn giao, không hủy được. Gỡ tư liệu hoặc hoàn thành buổi quay.\" Đóng hộp, gỡ tư liệu (mục 6) rồi hủy lại, hoặc chọn Hoàn thành\n* Nhấn `Không hủy` để đóng hộp, buổi giữ nguyên\n* Buổi đã hủy không mở lại được. Chiến dịch và yêu cầu nội dung liên kết không bị ảnh hưởng\n* Người dùng không xóa được buổi quay trên giao diện; buổi nhập nhầm thì hủy kèm lý do\n\n## <mark style=\"color:green;\">9. Xuất Excel<\/mark>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Lọc, tìm danh sách cần xuất<\/td><td>Tệp xuất đúng danh sách đang hiển thị, trong phạm vi bạn được xem<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <strong>LichQuayChup_yyyymmdd_yyyymmdd.xlsx<\/strong> (ngày đầu, ngày cuối khoảng đang xem), một sheet, cột: Mã, Tên buổi quay, Bắt đầu, Kết thúc, Địa điểm, Ê-kíp (tên – vai trò, ngăn bằng dấu chấm phẩy), Chiến dịch, Yêu cầu nội dung, Người phụ trách, Đội, Trạng thái, Số tư liệu<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Thời điểm Bắt đầu, Kết thúc xuất dạng \"dd/mm/yyyy hh:mm\" (giờ Việt Nam). Ô hiện \"-\" trên màn thì xuất \"-\"\n* Danh sách rỗng thì không tải tệp và hiện \"Không có dữ liệu để xuất.\" Lỗi khi xuất thì hiện \"Không xuất được tệp, vui lòng thử lại.\"\n", "noi-dung-va-media/kho-anh-video.md": "# Kho ảnh video\n\n🧭 Tổng quan chức năng: Kho lưu tập trung ảnh, video đã sản xuất để dùng lại cho nhiều nội dung và chiến dịch. Bạn duyệt kho theo thư mục, tìm và lọc, xem trước, tải về; tải tệp mới lên; ghi chiến dịch, nhãn sản phẩm, thẻ, quyền sử dụng; gắn tệp vào nội dung. Mọi người trong phòng Marketing xem và tải về được toàn bộ kho\n\nTruy cập: menu **Nội dung & media → Tài nguyên → Kho ảnh video**\n\n{% hint style=\"info\" %}\n\n## TỆP VÀO KHO TỪ ĐÂU VÀ TRẠNG THÁI CỦA TỆP\n\nMỗi tệp trong kho gọi là một **tài nguyên**, có mã dạng **MKT-TN-0001**. Tệp vào kho theo ba đường:\n\n* Tải lên trực tiếp ở màn này bằng nút `Tải lên`\n* Tải tệp ở chi tiết nội dung ([Bài đang sản xuất](bai-dang-san-xuat.md)): tệp vào kho rồi gắn vào nội dung, mang đội và nhãn sản phẩm của nội dung\n* Bàn giao tư liệu ở [Lịch quay chụp](lich-quay-chup.md): tệp vào kho mang chiến dịch, đội của buổi quay và thẻ \"buổi quay\"\n\n**Quyền sử dụng** (bắt buộc, mặc định Nội bộ)\n\n| Quyền | Ý nghĩa |\n| --- | --- |\n| **Công khai** | Được dùng cho nội dung đăng công khai và chia sẻ cho đối tác |\n| **Nội bộ** | Được dùng cho nội dung trên kênh của Datyso; không chia sẻ tệp ra ngoài công ty |\n| **Hạn chế** | Chỉ dùng khi đã được phép, ví dụ hình ảnh khách hàng, tư liệu mua bản quyền có điều kiện. Bắt buộc ghi **Điều kiện sử dụng** |\n\n**Trạng thái** (hệ thống tự tính, không nhập tay)\n\n| Trạng thái | Khi nào |\n| --- | --- |\n| **Đang sử dụng** | Chưa lưu trữ và còn hạn sử dụng (hoặc không có hạn) |\n| **Hết hạn quyền sử dụng** | Đã qua **Hạn sử dụng**. Hạn 12/10 thì từ 13/10 mới tính là hết hạn |\n| **Lưu trữ** | Đã bấm Lưu trữ. Tệp lưu trữ mà quá hạn vẫn hiện thêm chip \"Hết hạn quyền\" |\n\nChỉ tài nguyên **Đang sử dụng** gắn được vào nội dung hoặc buổi quay mới\n\n**Ai làm được gì**\n\n| Thao tác | Chuyên viên | Trưởng nhóm | Trưởng/Phó phòng, BGĐ |\n| --- | --- | --- | --- |\n| Xem, tìm, xem trước, tải về | Toàn kho | Toàn kho | Toàn kho |\n| Tải lên | Có | Có | Có |\n| Sửa thông tin, thay tệp, lưu trữ, khôi phục | Tệp mình tải lên hoặc phụ trách | Tệp của đội | Tất cả |\n| Đổi người phụ trách, đội của tệp | Không | Tệp của đội | Tất cả |\n| Xóa tệp chưa dùng ở đâu | Không | Tệp của đội | Tất cả |\n| Tạo, đổi tên, chuyển thư mục | Có | Có | Có |\n| Xóa thư mục rỗng | Không | Có | Có |\n| Gắn vào nội dung | Nội dung Nháp hoặc Yêu cầu sửa mà bạn được sửa | Như Chuyên viên | Như Chuyên viên |\n| Gộp, đổi tên, xóa thẻ phân loại | Không | Không | Có |\n| Xuất Excel | Có | Có | Có |\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Duyệt, tìm và lọc kho<\/mark>\n\n<figure><img src=\"images/kho-anh-video-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề \"Kho ảnh video\", dòng đếm \"n tệp · dung lượng\", nhóm nút **Tất cả / Ảnh / Video**, ô tìm, nút `Xuất Excel`, nút `+ Tải lên` |\n| **Cây thư mục** (bên trái) | **Tất cả tài nguyên** (mặc định), các thư mục theo cây (mở, gập được), **Chưa xếp thư mục**. Mỗi mục có số đếm. Chọn thư mục cha thì thấy cả tệp trong thư mục con. Nút `+` và menu `⋯` ở mỗi thư mục để quản lý thư mục (mục 7) |\n| **Bộ lọc khác** | Quyền sử dụng, Trạng thái, Chiến dịch, Nhãn sản phẩm, Thẻ, Người tải lên, Ngày tải lên từ – đến, Buổi quay, **Tôi tải lên**, **Chưa dùng ở nội dung nào**. Lọc đang áp hiện thành chip, kèm nút `Xóa bộ lọc` |\n| **Xếp theo, chế độ xem** | Xếp: Mới tải lên (mặc định), Tên A–Z, Dung lượng lớn nhất. Chế độ: **Lưới** (mặc định) hoặc **Bảng** |\n| **Thẻ tài nguyên** | Ảnh thu nhỏ (ảnh) hoặc biểu tượng phát (video); chip quyền sử dụng ở góc; tên tệp (di chuột để xem tên đầy đủ); \"dung lượng · ngày tải lên\"; tối đa 2 thẻ phân loại; \"Đang dùng n\" nếu tệp đang dùng ở n nội dung; chip \"Lưu trữ\", chip \"Hết hạn quyền\" khi có |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Nội dung &amp; media → Tài nguyên → Kho ảnh video<\/strong><\/td><td>Kho mở ở <strong>Tất cả tài nguyên<\/strong>, chế độ Lưới, xếp Mới tải lên, chỉ hiện tệp Đang sử dụng và Hết hạn quyền sử dụng (ẩn tệp Lưu trữ)<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn thư mục trên cây<\/td><td>Lưới chỉ còn tệp trong thư mục đó (gồm thư mục con). Số đếm trên cây tính theo các bộ lọc khác đang áp<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Ảnh<\/strong> hoặc <strong>Video<\/strong><\/td><td>Lọc theo loại tệp<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập từ khóa vào ô tìm<\/td><td>Tìm trong mã, tên, tên tệp, thẻ; không phân biệt hoa thường và dấu. Nhập \"0012\" hay \"MKT-TN-0012\" đều ra cùng tệp. Tối đa 100 ký tự<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Chọn thêm bộ lọc<\/td><td>Ví dụ chọn <strong>Trạng thái → Đã lưu trữ<\/strong> để xem tệp đã lưu trữ; chọn <strong>Buổi quay<\/strong> để xem tư liệu của một buổi; chọn <strong>Chưa dùng ở nội dung nào<\/strong> để tìm tệp chưa ai dùng. Nhấn <code>Xóa bộ lọc<\/code> để bỏ mọi lọc và ô tìm (giữ thư mục đang chọn)<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Đổi cách xếp hoặc chế độ xem<\/td><td>Chế độ Bảng hiện các cột Mã, Tên, Loại, Nhãn sản phẩm, Dung lượng, Quyền, Trạng thái, Người tải lên, Ngày tải lên, Đang dùng<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Cuộn xuống cuối<\/td><td>Hệ thống tải thêm 60 thẻ mỗi lần<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Bấm một thẻ<\/td><td>Chi tiết tài nguyên mở ở cột phải (mục 2). Thư mục, bộ lọc, ô tìm, cách xếp giữ nguyên khi bạn chọn tệp khác<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Dòng đếm tính trên kết quả đang lọc. Dung lượng dưới 1.024 MB hiện dạng \"x,x MB\", từ 1.024 MB hiện \"x,xx GB\"\n* Không có tệp khớp thì hiện \"Không có tệp nào khớp điều kiện.\" Thư mục chưa có tệp thì hiện \"Thư mục chưa có tài nguyên. Bấm Tải lên để thêm.\"\n* Mở kho bằng nút `Mở kho` ở chi tiết buổi quay thì bộ lọc Buổi quay được chọn sẵn; xóa chip để xem toàn kho\n* \"Chưa dùng ở nội dung nào\" tính trên toàn bộ nội dung của phòng, kể cả nội dung đã lưu trữ và phiên bản đã nộp, không chỉ nội dung bạn thấy\n* Lỗi tải dữ liệu thì hiện \"Không tải được kho ảnh video\" và nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết, xem trước và tải về<\/mark>\n\n<figure><img src=\"images/kho-anh-video-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên tài nguyên, dòng phụ \"mã · dung lượng · loại · định dạng\", ví dụ \"MKT-TN-0012 · 96,8 MB · Ảnh · image/jpeg\". Nút `X` đóng chi tiết |\n| **Xem trước** | Ảnh hoặc trình phát video ở đầu cột phải; bấm để xem lớn |\n| **Nút thao tác** | `Gắn vào nội dung` (nút chính, c
