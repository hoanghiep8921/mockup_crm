ân bổ`, `Về nháp` | Trưởng/Phó phòng, BGĐ |\n| **Đã khóa** | `Mở khóa`, `Đóng kỳ` | Trưởng/Phó phòng, BGĐ |\n| **Đã đóng kỳ** | - | - |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Gửi duyệt<\/code><\/td><td>Điều kiện: kỳ có ít nhất một dòng và tổng phân bổ lớn hơn 0; kế hoạch gốc còn Đã duyệt; khoảng ngày kỳ nằm trong kỳ kế hoạch<br>Đủ: kỳ chuyển <strong>Chờ duyệt<\/strong>, khóa nội dung và dòng; hệ thống ghi người gửi, giờ gửi và tạo việc \"Duyệt kỳ phân bổ &lt;mã&gt;\" cho các Trưởng/Phó phòng (trừ người tạo kỳ và người gửi); không còn ai thì giao BGĐ<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Duyệt<\/code><\/td><td>Kỳ chuyển <strong>Đã duyệt<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Khóa phân bổ<\/code><\/td><td>Kỳ chuyển <strong>Đã khóa<\/strong> để triển khai. Nhấn <code>Mở khóa<\/code> để đưa về Đã duyệt<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Hết kỳ, nhấn <code>Đóng kỳ<\/code><\/td><td>Chỉ khi kỳ Đã khóa và đã qua ngày kết thúc kỳ (theo ngày Việt Nam). Chưa hết kỳ: nút khóa kèm chú giải \"Kỳ chưa kết thúc\"<br>Kỳ chuyển <strong>Đã đóng kỳ<\/strong>, không mở lại được<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Về nháp<\/code> (từ Chờ duyệt hoặc Đã duyệt)<\/td><td>Kỳ về <strong>Đang phân bổ<\/strong>, mở khóa; người gửi, người duyệt và ngày duyệt bị xóa. Kỳ Đã khóa phải <code>Mở khóa<\/code> trước rồi mới <code>Về nháp<\/code><\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Xóa kỳ<\/code> (kỳ Đang phân bổ)<\/td><td>Hộp xác nhận \"Xóa kỳ phân bổ &lt;mã&gt;? Các dòng của kỳ sẽ bị xóa theo.\" Đồng ý: hệ thống báo \"Đã xóa kỳ phân bổ &lt;mã&gt;.\" và cột phải về \"Chọn một kỳ phân bổ để xem chi tiết.\"<br>Kỳ đã có chi phí thực khớp dòng: hệ thống báo \"Không xóa được kỳ đã có chi phí thực.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Kỳ chưa có dòng | \"Thêm ít nhất một dòng phân bổ trước khi gửi duyệt.\" |\n| Kế hoạch gốc không còn Đã duyệt, hoặc kỳ chưa gắn kế hoạch | \"Kỳ chưa có kế hoạch đã duyệt làm căn cứ.\" |\n| Khoảng ngày kỳ ngoài kỳ kế hoạch | \"Khoảng ngày của kỳ nằm ngoài kỳ của kế hoạch.\" |\n| Đóng kỳ khi chưa hết kỳ | \"Kỳ chưa kết thúc, chưa đóng được.\" |\n| Người tạo kỳ hoặc người gửi duyệt bấm Duyệt | \"Bạn không thể duyệt kỳ phân bổ do chính mình lập hoặc gửi duyệt.\" |\n\n### ⚠️ Lưu ý\n\n* **Không tự duyệt:** người tạo kỳ và người bấm `Gửi duyệt` lần gần nhất thấy nút `Duyệt` bị khóa kèm chú giải trên. Trưởng/Phó phòng đã gửi duyệt hộ cũng không duyệt được vòng đó. Quy tắc này không áp cho Khóa, Mở khóa, Đóng kỳ, Về nháp\n* Không còn ai khác có quyền duyệt: kỳ giữ Chờ duyệt, người tạo kỳ thấy \"Chưa có người khác có quyền duyệt kỳ phân bổ này.\"\n* Muốn xóa kỳ ở trạng thái khác Đang phân bổ: đưa kỳ về nháp trước\n* **Khi kế hoạch gốc thay đổi:**\n  * Kế hoạch bị rút về nháp: kỳ giữ trạng thái, gắn cờ \"Không còn căn cứ đã duyệt\"; bị chặn thêm, sửa dòng, gửi duyệt và duyệt; vẫn `Về nháp`, `Mở khóa`, `Khóa phân bổ`, `Đóng kỳ` được. Kế hoạch được duyệt lại thì cờ mất\n  * Kế hoạch bị xóa: kỳ được giữ, hiện cảnh báo \"Kỳ chưa gắn kế hoạch\", không có khối kiểm soát; chỉ xem, `Về nháp`, `Mở khóa`, `Đóng kỳ`\n  * Kế hoạch sửa khoảng ngày làm kỳ nằm ngoài: kỳ giữ nguyên, hiện cảnh báo; không gửi duyệt được cho tới khi sửa kỳ vào trong khoảng ngày kế hoạch\n\n## <mark style=\"color:green;\">6. Kiểm soát ngân sách theo kế hoạch<\/mark>\n\n<figure><img src=\"images/phan-bo-ngan-sach-1.png\" alt=\"\"><figcaption><p>Kế hoạch đã phân bổ 100% ngân sách: banner đang chặn tăng phân bổ<\/p><\/figcaption><\/figure>\n\nKhối **Kiểm soát ngân sách theo kế hoạch &lt;mã kế hoạch&gt;** nằm ở đầu chi tiết kỳ, khi kỳ có gắn kế hoạch\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề** | \"Kiểm soát ngân sách theo kế hoạch &lt;mã&gt;\" kèm chip trạng thái kế hoạch |\n| **Ô số (chỉ đọc)** | **Tổng ngân sách kế hoạch được duyệt**; **Tổng phân bổ kỳ này**; **Đã phân bổ ở kỳ khác cùng kế hoạch** (khi lớn hơn 0); **Tổng phân bổ của kế hoạch**; **Còn lại trước mức chặn** |\n| **Banner cảnh báo (từ 80%)** | \"Đã phân bổ p% ngân sách được duyệt\" – \"Từ 80% hệ thống cảnh báo; ở 100% (&lt;tiền&gt;) không được tăng thêm. Còn &lt;tiền&gt; trước mức 100%.\" |\n| **Banner chặn (từ 100%)** | \"Đã phân bổ p% ngân sách được duyệt, đang chặn tăng phân bổ\" – \"Chỉ lưu được khi giảm hoặc giữ nguyên tổng phân bổ; muốn tăng phải gửi Đề nghị tăng ngân sách để cấp trên duyệt.\" |\n| **Banner \"Kế hoạch chưa được duyệt\"** | \"Kế hoạch &lt;mã&gt; chưa được duyệt\" – \"Chỉ phân bổ theo kế hoạch đã duyệt\"; mọi ô chỉ đọc |\n| **Nút `Đề nghị tăng ngân sách`** | Chỉ Trưởng/Phó phòng (mục 7). Khóa kèm \"Đã chờ n ngày\" khi đã có đề nghị đang chờ |\n| **Nút `Duyệt tăng ngân sách`, `Từ chối`** | Chỉ BGĐ, khi có đề nghị đang chờ (mục 7) |\n| **Nhật ký** | \"dd/mm/yyyy hh:mm · &lt;người&gt; · &lt;hành động&gt;\" cho lưu phân bổ, đề nghị, duyệt, từ chối |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Thêm, sửa hoặc xóa một dòng phân bổ<\/td><td>Hệ thống tính <strong>tổng phân bổ của kế hoạch<\/strong> = tổng mọi dòng của mọi kỳ cùng kế hoạch, ở mọi trạng thái (kể cả kỳ Đã đóng)<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Dưới 80% ngân sách kế hoạch<\/td><td>Lưu bình thường<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Từ 80% đến dưới 100%<\/td><td>Lưu được, kèm cảnh báo \"Đã phân bổ x% ngân sách kế hoạch, còn &lt;số tiền&gt; trước mức chặn\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đạt hoặc vượt 100%<\/td><td>Hiện banner chặn. Lần lưu làm tổng <strong>tăng lên và vượt<\/strong> ngân sách kế hoạch bị chặn. Lần lưu làm tổng <strong>giảm hoặc giữ nguyên<\/strong> vẫn được. Đúng bằng 100% vẫn lưu được<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Cần tăng thêm<\/td><td>Trưởng/Phó phòng nhấn <code>Đề nghị tăng ngân sách<\/code> (mục 7)<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Hệ thống so trên **tổng ngân sách kế hoạch**, không so theo từng kênh\n* Tổng phân bổ của kế hoạch tính trên mọi kỳ, kể cả kỳ bạn không được xem; các số này chỉ hiện là số tổng, không kèm mã kỳ, đội, người phụ trách của kỳ ngoài phạm vi của bạn\n* Phần trăm so với ngân sách được **cắt xuống**, không làm tròn lên: 99,96% hiện 99,9%, không hiện 100%\n* Ô **Tổng phân bổ kỳ này** chỉ để xem; muốn đổi phân bổ, sửa từng dòng\n* Số tiền trong thông báo lỗi, cảnh báo ghi đầy đủ, ví dụ 1.010.000.000 đ\n* Kế hoạch duyệt lại với ngân sách thấp hơn tổng phân bổ: banner chặn hiện, không chặn giảm dần. Trưởng/Phó phòng giảm dòng hoặc gửi đề nghị mới\n\n## <mark style=\"color:green;\">7. Đề nghị tăng ngân sách<\/mark>\n\n<figure><img src=\"images/phan-bo-ngan-sach-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\nTrưởng/Phó phòng gửi; BGĐ duyệt hoặc từ chối\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Đề nghị tăng ngân sách<\/code> ở khối kiểm soát<\/td><td>Nút có ở mọi mức phân bổ, khi kế hoạch Đã duyệt và chưa có đề nghị nào đang chờ. Hộp <strong>Đề nghị tăng ngân sách<\/strong> mở ra, hiện <strong>Ngân sách kế hoạch hiện tại<\/strong> (chỉ đọc)<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập <strong>Số tiền tăng thêm (₫)<\/strong> (bắt buộc)<\/td><td>Lớn hơn 0. Hệ thống hiện \"Ngân sách sau khi tăng\". Không giới hạn mức tăng<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Kênh nhận phần tăng<\/strong> (không bắt buộc)<\/td><td>Chọn một kênh trong danh mục kênh của kế hoạch, chỉ để ghi nhận. Để trống thì phần tăng không gắn kênh<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhập <strong>Lý do<\/strong> (bắt buộc, tối đa 1.000 ký tự)<\/td><td><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Gửi đề nghị<\/code><\/td><td>Thiếu số tiền: \"Nhập số tiền tăng lớn hơn 0.\" Thiếu lý do: \"Nhập lý do đề nghị.\"<br>Thành công: hệ thống báo \"Đã gửi đề nghị tăng ngân sách\", đề nghị ở trạng thái <strong>Chờ BGĐ duyệt<\/strong>; nút đề nghị của kế hoạch bị khóa tới khi có kết quả. Mọi BGĐ nhận thông báo \"&lt;Người gửi&gt; đề nghị tăng ngân sách kế hoạch &lt;mã&gt; thêm &lt;số tiền&gt;. Lý do: &lt;lý do&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>BGĐ nhấn <code>Duyệt tăng ngân sách<\/code> hoặc <code>Từ chối<\/code><\/td><td>Hộp xác nhận hiện người gửi, số tiền, kênh, lý do<br><code>Duyệt tăng ngân sách<\/code>: kế hoạch được thêm dòng ngân sách <strong>\"Điều chỉnh tăng\"<\/strong>, tổng ngân sách kế hoạch tăng, kế hoạch <strong>vẫn Đã duyệt<\/strong>; người gửi nhận \"Đề nghị tăng ngân sách kế hoạch &lt;mã&gt; thêm &lt;số tiền&gt; đã được duyệt.\"<br><code>Từ chối<\/code>: bắt buộc lý do (\"Chưa nhập lý do từ chối.\" nếu trống); người gửi nhận \"Đề nghị tăng ngân sách kế hoạch &lt;mã&gt; bị từ chối. Lý do: &lt;lý do từ chối&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Phân bổ phần tăng<\/td><td>Ngân sách kế hoạch đã tăng nên lưu được dòng phân bổ thêm. Kỳ đang Đã duyệt hoặc Đã khóa: Trưởng/Phó phòng <code>Mở khóa<\/code> rồi <code>Về nháp<\/code> trước (kỳ phải duyệt lại). Cách nhẹ hơn: tạo kỳ mới ở phần ngày còn trống của kế hoạch<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* BGĐ không gửi đề nghị; BGĐ là người duyệt. Người lập hoặc gửi đề nghị không duyệt được đề nghị đó: nút khóa kèm chú giải \"Bạn không thể duyệt đề nghị tăng ngân sách do chính mình lập hoặc gửi duyệt.\"\n* Mỗi kế hoạch chỉ có **một** đề nghị đang chờ tại một thời điểm. Đề nghị bị từ chối hoặc hủy thì gửi đề nghị mới, không giới hạn số lần. Không có chức năng rút đề nghị\n* Đề nghị đang chờ không có hạn xử lý; nút hiện số ngày đã chờ\n* Kế hoạch bị rút về nháp khi có đề nghị đang chờ: đề nghị **tự hủy**, người gửi nhận \"Đề nghị tăng ngân sách kế hoạch &lt;mã&gt; đã hủy do kế hoạch rút về nháp.\"\n* Đề nghị đã duyệt rồi kế hoạch bị rút về nháp: dòng \"Điều chỉnh tăng\" vẫn giữ\n* Tăng ngân sách không làm sinh lại chỉ tiêu (chỉ tiêu sinh từ mục tiêu, không từ ngân sách)\n* Kỳ Đã đóng kỳ không mở lại, nên phần tăng chỉ phân bổ được vào kỳ mới ở phần ngày còn trống của kế hoạch\n", "ke-hoach/chi-tieu-theo-san-pham.md": "# Chỉ tiêu theo sản phẩm\n\n🧭 Tổng quan chức năng: Màn theo dõi chỉ tiêu Lead, Doanh thu, CPL mục tiêu theo **nhãn sản phẩm** và so với kết quả thực tế hệ thống tự tính từ lead, đơn hàng, chi phí. Mọi người trong phòng Marketing xem được theo phạm vi của mình; Trưởng nhóm trở lên tạo thêm chỉ tiêu tạo tay\n\nTruy cập: menu **Kế hoạch → Ngân sách và mục tiêu → Chỉ tiêu theo sản phẩm**. Nhấn liên kết \"theo sản phẩm\" ở tab **Lịch sử & liên kết** của [Kế hoạch Marketing](ke-hoach-marketing.md) cũng mở màn này\n\n{% hint style=\"info\" %}\n\n## CHỈ TIÊU ĐẾN TỪ ĐÂU VÀ ĐƯỢC TÍNH THẾ NÀO\n\n**Nguồn chỉ tiêu:**\n\n* **Sinh từ kế hoạch:** kế hoạch Marketing Đã duyệt, người phụ trách hoặc Trưởng/Phó phòng, BGĐ nhấn `Sinh chỉ tiêu`. Mỗi bộ (nhãn sản phẩm, kênh) của dòng mục tiêu thành một chỉ tiêu. Dòng mục tiêu có nhãn (kể cả có thêm kênh) sinh chỉ tiêu ở màn này; dòng có cả nhãn và kênh hiện tên dạng \"Sản phẩm · Kênh\". Xem mục 11 trang [Kế hoạch Marketing](ke-hoach-marketing.md)\n* **Tạo tay:** Trưởng nhóm trở lên nhấn `Thiết lập chỉ tiêu` (mục 3), cho chỉ tiêu không thuộc kế hoạch nào\n\n**Số thực tế (tự tính, không nhập tay):**\n\n* **Lead thực tế**: số khách hàng tạo trong kỳ (giờ Việt Nam), có nhãn sản phẩm của dòng. Chỉ đếm khách đang hoạt động; khách trùng số điện thoại chỉ tính một\n* **Doanh thu thực tế**: tổng tiền (gồm thuế) các đơn đã chốt có nguồn lead Marketing, tính theo ngày đặt hàng. Báo giá, đơn hủy không tính. Một đơn tính về một nhãn và một kênh theo nguồn của đơn\n* **Chi phí thực tế**: chi phí thực chia về nhãn sản phẩm theo chiến dịch\n* **CPL thực tế** = chi phí **quảng cáo** ÷ Lead thực tế\n* **% đạt** = thực tế × 100 ÷ chỉ tiêu\n\n**Tiến độ và chip trạng thái:**\n\n* **% thời gian đã qua** = số ngày đã qua (tính cả hôm nay) ÷ số ngày của phần giao giữa kỳ đang xem và kỳ chỉ tiêu\n* **Đạt**: % đạt không thấp hơn % thời gian đã qua quá 3 điểm (đi trước cũng là Đạt)\n* **Cần theo dõi**: chậm hơn từ trên 3 đến 10 điểm\n* **Chưa đạt**: chậm hơn trên 10 điểm\n* Dòng có cả chỉ tiêu Lead và Doanh thu thì xét chỉ số **kém hơn**. Dòng chỉ có CPL mục tiêu thì chip là \"-\"\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem bảng chỉ tiêu theo sản phẩm<\/mark>\n\n<figure><img src=\"images/chi-tieu-theo-san-pham-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề và dòng \"N dòng chỉ tiêu · kỳ &lt;kỳ đang lọc&gt;\" |\n| **Ô tìm** | \"Tìm theo mã hoặc tên…\" |\n| **Nút `Xuất Excel`** | Xuất bảng chỉ tiêu đang lọc |\n| **Nút `Thiết lập chỉ tiêu`** | Tạo chỉ tiêu tạo tay (mục 3). Chuyên viên không thấy |\n| **Bộ lọc** | Sản phẩm; Nguồn (6 nền tảng) và Trang (chỉ khi Nguồn là Facebook); khoảng thời gian, mặc định **Tháng**; chip `Tất cả`, `Đạt`, `Cần theo dõi`, `Chưa đạt` |\n| **Banner kỳ** | \"Kỳ &lt;từ&gt; – &lt;đến&gt; · thời gian đã qua x%\", nút `Mở kế hoạch` (khi các dòng chỉ thuộc một kế hoạch), câu \"Chỉ tiêu sinh từ kế hoạch &lt;mã&gt; đã duyệt. Kết quả thực tế hệ thống tự cập nhật từ lead, đơn hàng và chi phí quảng cáo. Thanh đỏ: chậm hơn tiến độ thời gian quá 3 điểm.\" |\n| **Bảng chỉ tiêu** | Cột Sản phẩm (nhấn để xem chi tiết), Chỉ tiêu Lead, Lead thực tế, % đạt Lead, Chỉ tiêu Doanh thu, Doanh thu thực tế, % đạt Doanh thu. Cột % đạt có thanh tiến độ và vạch mốc thời gian |\n| **Hàng Tổng** | Cộng chỉ tiêu và thực tế Lead, Doanh thu; % đạt tính trên tổng |\n| **Dòng đối chiếu** | \"Tổng theo kênh khác tổng theo sản phẩm x Lead\", chỉ hiện khi hai tổng lệch |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Kế hoạch → Ngân sách và mục tiêu → Chỉ tiêu theo sản phẩm<\/strong><\/td><td>Hệ thống hiện các chỉ tiêu bạn được xem, kỳ mặc định là tháng hiện tại, kèm số thực tế tính tại lúc mở<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đổi <strong>khoảng thời gian<\/strong><\/td><td>Chọn Ngày, Tuần, Tháng, Năm hoặc Tùy chỉnh; xem cách chọn ở <a href=\"../bang-dieu-khien/bo-loc-va-ky-bao-cao.md\">Bộ lọc và kỳ báo cáo<\/a><br>Kỳ đang xem không trùng kỳ chỉ tiêu: chỉ tiêu được <strong>chia theo ngày<\/strong> = chỉ tiêu × số ngày giao nhau ÷ số ngày của kỳ chỉ tiêu; thực tế chỉ đếm phần nằm trong khoảng giao<br>Kỳ đang xem không giao kỳ chỉ tiêu nào: dòng bị ẩn<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Sản phẩm<\/strong>, <strong>Nguồn<\/strong>, <strong>Trang<\/strong><\/td><td>Các bộ lọc này chỉ lọc <strong>dòng chỉ tiêu<\/strong>, không đổi số thực tế<br>Chọn Nguồn Facebook mà không chọn Trang: ẩn dòng không gắn Trang. Chọn một Trang: chỉ hiện dòng của Trang đó, kèm ghi chú \"Thực tế tính cho cả đối tượng, không riêng Trang\". Dòng không có kênh vẫn hiện khi chọn Nguồn<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn chip <code>Đạt<\/code>, <code>Cần theo dõi<\/code>, <code>Chưa đạt<\/code><\/td><td>Chỉ còn các dòng có chip tương ứng. Dòng chip \"-\" chỉ hiện ở <code>Tất cả<\/code><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhập từ khóa vào <strong>Ô tìm<\/strong><\/td><td>Tìm theo mã hoặc tên sản phẩm. Không khớp: \"Không có dòng chỉ tiêu nào khớp \"&lt;từ khóa&gt;\".\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Nhấn <code>Mở kế hoạch<\/code><\/td><td>Mở kế hoạch gốc ở <a href=\"ke-hoach-marketing.md\">Kế hoạch Marketing<\/a><\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Nhấn tên một sản phẩm<\/td><td>Cột phải mở chi tiết dòng (mục 2)<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>ChiTieuTheoSanPham_yyyymmdd.xlsx<\/code> gồm đúng các cột của bảng, kèm Kỳ và Trang, chỉ các dòng bạn thấy. Tiền ghi đủ VND; ô \"-\" trên màn xuất \"-\"<br>Không có dòng: \"Không có dữ liệu để xuất.\" Xuất lỗi: \"Không xuất được tệp, vui lòng thử lại.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy dòng nào:** Chuyên viên thấy chỉ tiêu mình phụ trách hoặc mình tạo; Trưởng nhóm thấy chỉ tiêu của đội; Trưởng/Phó phòng, BGĐ thấy tất cả. Số thực tế của một dòng **giống nhau với mọi người xem**; riêng hàng Tổng và dòng đối chiếu chỉ cộng các dòng bạn thấy, nên có thể khác giữa các vai trò\n* **Không cộng kép:** chỉ tiêu theo sản phẩm và chỉ tiêu theo kênh là **hai cách nhìn của cùng một tổng**, không cộng với nhau. Tổng theo kênh có thể thấp hơn tổng theo sản phẩm vì dòng mục tiêu có cả nhãn và kênh chỉ sinh chỉ tiêu ở màn này\n* **Chỉ tiêu chồng kỳ:** kế hoạch Năm, Quý, Tháng cùng có chỉ tiêu cho một sản phẩm thì, với từng ngày, hệ thống lấy chỉ tiêu của kỳ **ngắn nhất** phủ ngày đó. Cùng độ dài thì ưu tiên chỉ tiêu tạo tay, rồi mã lớn hơn. Hàng Tổng không cộng các chỉ tiêu chồng nhau của cùng sản phẩm\n* Các dòng cùng sản phẩm, cùng kỳ, chỉ khác Trang hiện riêng (kèm tên Trang) và có **cùng số thực tế**; hàng Tổng chỉ cộng thực tế đó một lần\n* Chỉ tiêu bằng 0 thì % đạt hiện \"-\"\n* Kỳ lọc chưa bắt đầu: % thời gian là 0 nên dòng % đạt 0 vẫn Đạt. Kỳ lọc đã kết thúc: % thời gian là 100\n* Phần trăm làm tròn một chữ số thập phân; chỉ tiêu chia theo ngày làm tròn về số nguyên khi hiển thị\n* Kỳ đang xem không có chỉ tiêu: hiện \"Chưa có chỉ tiêu trong kỳ này\", kèm nút thiết lập nếu bạn có quyền\n* Chỉ tiêu gắn kế hoạch đã bị rút về nháp hiện cờ **\"Không còn căn cứ đã duyệt\"** tới khi kế hoạch được duyệt lại\n* Lỗi tải: hiện \"Không tải được dữ liệu\" và nút `Thử lại` ngay tại vùng lỗi\n\n## <mark style=\"color:green;\">2. Xem chi tiết một dòng chỉ tiêu<\/mark>\n\n<figure><img src=\"images/chi-tieu-theo-san-pham-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên sản phẩm, mã chỉ tiêu dạng `MKT-CT-0021`, khoảng ngày; nút X để đóng |\n| **Bốn ô** | **Chỉ tiêu Lead**; **Lead thực tế** (đạt x%); **Chi phí thực tế** kèm dòng phụ \"trong đó quảng cáo &lt;tiền&gt;\"; **CPL thực tế** kèm \"mục tiêu &lt;tiền&gt;\" hoặc \"không đặt mục tiêu\" |\n| **Thông tin** | Loại chỉ tiêu (Theo sản phẩm), Trang, Từ kế hoạch (nhấn để mở kế hoạch), Chỉ tiêu Doanh thu, Doanh thu thực tế (và %) |\n| **Ghi chú** | \"Số thực tế lấy trực tiếp từ lead, đơn hàng và chi phí quảng cáo trong kỳ, không nhập tay.\" |\n| **Nút** | `Mở báo cáo`, `Mở form đầy đủ`; `Sửa`, `Xóa` chỉ với chỉ tiêu tạo tay và đúng quyền |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn tên sản phẩm ở bảng<\/td><td>Cột phải mở chi tiết dòng. Nhấn X để đóng<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc ô <strong>Chi phí thực tế<\/strong> và <strong>CPL thực tế<\/strong><\/td><td>CPL chỉ tính phần chi phí <strong>quảng cáo<\/strong> (dòng phụ \"trong đó quảng cáo\"), không tính toàn bộ chi phí thực<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn <code>Mở báo cáo<\/code><\/td><td>Mở <a href=\"../bao-cao-du-lieu/chi-phi-va-lead.md\">Chi phí và Lead<\/a> để xem chi tiết lead và chi phí<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Mở form đầy đủ<\/code><\/td><td>Mở hộp <strong>Thiết lập chỉ tiêu<\/strong> của dòng này để xem; với chỉ tiêu tạo tay và bạn có quyền thì sửa được (mục 3)<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* CPL thực tế hiện **\"-\"** khi Lead thực tế bằng 0 (không chia được). Có lead mà chi phí quảng cáo bằng 0 thì CPL hiện \"0 đ\"\n* Số chi phí của một sản phẩm ở màn này có thể khác số ở báo cáo Chi phí và Lead, vì màn chỉ tiêu chia chi phí về nhãn và kênh theo chiến dịch\n* Chỉ tiêu sinh từ kế hoạch không có nút `Sửa`, `Xóa`; nút sửa hiện khóa kèm hướng dẫn \"Sửa ở kế hoạch rồi sinh lại\"\n\n## <mark style=\"color:green;\">3. Thiết lập chỉ tiêu tạo tay<\/mark>\n\nDùng khi cần chỉ tiêu không thuộc kế hoạch nào. Hộp **Thiết lập chỉ tiêu** dùng chung cho màn này và [Chỉ tiêu theo kênh](chi-tieu-theo-kenh.md). Chỉ Trưởng nhóm, Trưởng/Phó phòng, BGĐ\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn <code>Thiết lập chỉ tiêu<\/code><\/td><td>Hộp <strong>Thiết lập chỉ tiêu<\/strong> mở ra<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn <strong>Loại<\/strong> (bắt buộc)<\/td><td>Theo sản phẩm hoặc Theo kênh; mặc định theo màn đang mở<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn <strong>Nhãn sản phẩm<\/strong> (loại sản phẩm) hoặc <strong>Kênh<\/strong> (loại kênh) (bắt buộc)<\/td><td>Chọn từ danh mục<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Chọn <strong>Từ ngày<\/strong>, <strong>Đến ngày<\/strong><\/td><td>Đến ngày phải sau hoặc bằng Từ ngày<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhập <strong>Chỉ tiêu Lead<\/strong>, <strong>Chỉ tiêu Doanh thu<\/strong>, <strong>CPL mục tiêu<\/strong><\/td><td>Không âm; nhập ít nhất một giá trị<br>Loại kênh có thêm ô <strong>Chỉ tiêu Lợi nhuận gộp<\/strong> (không âm)<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Chọn <strong>Trang<\/strong> (không bắt buộc)<\/td><td>Chỉ có với Facebook; chỉ là ghi chú<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Chọn <strong>Người phụ trách<\/strong>, <strong>Đội<\/strong><\/td><td>Mặc định là bạn. Người phụ trách và đội quyết định ai xem được chỉ tiêu<\/td><\/tr>\n<tr><td><strong>Bước 8<\/strong><\/td><td>Nhấn <code>Lưu<\/code><\/td><td>Hợp lệ: hệ thống báo \"Đã lưu chỉ tiêu &lt;mã&gt;.\" Chỉ tiêu có mã dạng <code>MKT-CT-0040<\/code>, không gắn kế hoạch, không khóa theo trạng thái<br>Có lỗi: hộp giữ nguyên dữ liệu, lỗi hiện tại ô sai<br><code>Hủy<\/code> khi đã nhập: hỏi \"Bỏ các thay đổi đang nhập?\" với <code>Bỏ<\/code> và <code>Ở lại<\/code><\/td><\/tr>\n<tr><td><strong>Bước 9<\/strong><\/td><td>Sửa chỉ tiêu tạo tay: chọn dòng, nhấn <code>Sửa<\/code> (hoặc <code>Mở form đầy đủ<\/code>)<\/td><td>Hộp mở với dữ liệu hiện có; lưu như bước 8. Trưởng nhóm sửa được chỉ tiêu tạo tay trong phạm vi đội, kể cả do Trưởng/Phó phòng tạo<\/td><\/tr>\n<tr><td><strong>Bước 10<\/strong><\/td><td>Xóa chỉ tiêu tạo tay: chọn dòng, nhấn <code>Xóa<\/code><\/td><td>Chỉ Trưởng/Phó phòng, BGĐ. Hộp xác nhận \"Xóa chỉ tiêu &lt;mã&gt;? Số thực tế vẫn tính từ dữ liệu gốc, chỉ mất chỉ tiêu.\" Đồng ý: \"Đã xóa chỉ tiêu &lt;mã&gt;.\" Xóa được cả chỉ tiêu đã có thực tế<\/td><\/tr>\n<\/tbody><\/table>\n\n**Thông báo lỗi thường gặp**\n\n| Tình huống | Thông báo |\n| --- | --- |\n| Loại sản phẩm thiếu nhãn | \"Chọn nhãn sản phẩm.\" |\n| Loại kênh thiếu kênh | \"Chọn kênh.\" |\n| Đến ngày trước Từ ngày | \"Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.\" |\n| Giá trị âm | \"Giá trị chỉ tiêu không được âm.\" |\n| Không nhập giá trị nào | \"Nhập ít nhất một chỉ tiêu.\" |\n| Trùng hệt chỉ tiêu tạo tay khác (cùng loại, đối tượng, kênh kèm theo, Trang, từ ngày, đến ngày) | \"Chỉ tiêu này đã có trong kỳ.\" |\n\n### ⚠️ Lưu ý\n\n* Chuyên viên không thấy nút `Thiết lập chỉ tiêu`, `Sửa`, `Xóa`; chỉ xem\n* Chỉ tiêu tạo tay **được phép chồng kỳ** với chỉ tiêu tạo tay khác hoặc với chỉ tiêu sinh từ kế hoạch cùng đối tượng; khi chồng, hệ thống lấy chỉ tiêu kỳ ngắn nhất (xem Lưu ý mục 1). Chỉ bị chặn khi trùng hệt\n* Chỉ tiêu sinh từ kế hoạch không sửa, không xóa ở đây; muốn đổi thì sửa mục tiêu ở [Kế hoạch Marketing](ke-hoach-marketing.md) rồi sinh lại\n", "ke-hoach/chi-tieu-theo-kenh.md": "# Chỉ tiêu theo kênh\n\n🧭 Tổng quan chức năng: Màn theo dõi chỉ tiêu Lead và CPL mục tiêu theo **kênh** (Meta Ads, Google Ads, Zalo OA…), kèm chỉ tiêu Doanh thu và Lợi nhuận gộp theo kênh, so với kết quả thực tế hệ thống tự tính. Mọi người trong phòng Marketing xem được theo phạm vi của mình; Trưởng nhóm trở lên xem thêm Lợi nhuận gộp và tạo chỉ tiêu tạo tay\n\nTruy cập: menu **Kế hoạch → Ngân sách và mục tiêu → Chỉ tiêu theo kênh**. Nhấn liên kết \"theo kênh\" ở tab **Lịch sử & liên kết** của [Kế hoạch Marketing](ke-hoach-marketing.md) cũng mở màn này\n\n{% hint style=\"info\" %}\n\n## MÀN NÀY KHÁC MÀN CHỈ TIÊU THEO SẢN PHẨM Ở ĐÂU\n\nMàn này dùng **chung** với [Chỉ tiêu theo sản phẩm](chi-tieu-theo-san-pham.md): bộ lọc, banner kỳ, cách tính số thực tế, tiến độ, chip Đạt / Cần theo dõi / Chưa đạt, chi tiết một dòng, Xuất Excel và hộp **Thiết lập chỉ tiêu**. Phần giải thích chung xem trang đó\n\nKhác biệt:\n\n* **Chỉ gồm chỉ tiêu loại kênh**: sinh từ dòng mục tiêu của kế hoạch **chỉ ghi kênh** (không có nhãn sản phẩm), kể cả dòng Lợi nhuận gộp, hoặc tạo tay. Dòng mục tiêu có cả nhãn và kênh thuộc màn sản phẩm, **không** hiện ở đây\n* Bảng chính có thêm **CPL mục tiêu**, **CPL thực tế**, **Chênh lệch** thay cho cột Doanh thu\n* Có thêm khối **Chỉ tiêu doanh thu và lợi nhuận gộp theo kênh**\n\nVì vậy tổng Lead theo kênh có thể thấp hơn tổng theo sản phẩm. Hai màn là hai cách nhìn của cùng một tổng, **không cộng với nhau**; khi hai tổng lệch, màn hiện dòng đối chiếu \"Tổng theo kênh khác tổng theo sản phẩm x Lead\"\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Xem bảng chỉ tiêu Lead và CPL theo kênh<\/mark>\n\n<figure><img src=\"images/chi-tieu-theo-kenh-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh tiêu đề** | Tiêu đề và dòng \"N dòng chỉ tiêu · kỳ &lt;kỳ đang lọc&gt;\" |\n| **Ô tìm, `Xuất Excel`, `Thiết lập chỉ tiêu`** | Như màn [Chỉ tiêu theo sản phẩm](chi-tieu-theo-san-pham.md). `Thiết lập chỉ tiêu` mở hộp với Loại mặc định là Theo kênh; Chuyên viên không thấy nút |\n| **Bộ lọc** | Kênh; Nguồn và Trang (chỉ Facebook); khoảng thời gian, mặc định **Tháng**; chip `Tất cả`, `Đạt`, `Cần theo dõi`, `Chưa đạt` |\n| **Banner kỳ** | \"Kỳ &lt;từ&gt; – &lt;đến&gt; · thời gian đã qua x%\" và nút `Mở kế hoạch` |\n| **Bảng chính** | Cột Kênh (nhấn để xem chi tiết), Chỉ tiêu Lead, Lead thực tế, % đạt Lead (thanh tiến độ, vạch mốc thời gian), CPL mục tiêu, CPL thực tế, Chênh lệch |\n| **Hàng Tổng** | Chỉ cộng chỉ tiêu Lead, Lead thực tế và % đạt; không cộng CPL |\n| **Khối Doanh thu và Lợi nhuận gộp** | Xem mục 3 |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở menu <strong>Kế hoạch → Ngân sách và mục tiêu → Chỉ tiêu theo kênh<\/strong><\/td><td>Hệ thống hiện chỉ tiêu loại kênh bạn được xem, kỳ mặc định là tháng hiện tại<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đổi khoảng thời gian, lọc, tìm<\/td><td>Cách chọn kỳ xem <a href=\"../bang-dieu-khien/bo-loc-va-ky-bao-cao.md\">Bộ lọc và kỳ báo cáo<\/a>. Cách chia chỉ tiêu theo ngày, lọc Nguồn và Trang, chip tiến độ như mục 1 trang <a href=\"chi-tieu-theo-san-pham.md\">Chỉ tiêu theo sản phẩm<\/a><br>Không khớp từ khóa: \"Không có dòng chỉ tiêu nào khớp \"&lt;từ khóa&gt;\".\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc cột <strong>CPL thực tế<\/strong><\/td><td>CPL thực tế = chi phí <strong>quảng cáo<\/strong> của kênh ÷ Lead thực tế<br>Kênh không có chi phí quảng cáo (Zalo OA, Website/SEO, Giới thiệu, Hotline): hiện <strong>\"-\"<\/strong><br>Kênh có quảng cáo nhưng chi phí quảng cáo trong kỳ bằng 0 và có lead: hiện \"0 đ\"<br>Lead thực tế bằng 0: hiện \"-\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Đọc cột <strong>Chênh lệch<\/strong><\/td><td>Chênh lệch = (CPL thực tế − CPL mục tiêu) × 100 ÷ CPL mục tiêu<br>Dương: \"+x%\" (đắt hơn mục tiêu). Âm: \"−x%\" (rẻ hơn mục tiêu). Bằng 0: \"0,0%\"<br>Thiếu CPL mục tiêu hoặc CPL thực tế: \"-\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn <code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>ChiTieuTheoKenh_yyyymmdd.xlsx<\/code> gồm hai trang: \"Chỉ tiêu theo kênh\" (bảng chính) và \"Doanh thu và Lợi nhuận\" (khối ở mục 3), chỉ các dòng bạn thấy. Tiền ghi đủ VND; ô \"-\" trên màn xuất \"-\"<br>Không có dòng: \"Không có dữ liệu để xuất.\" Xuất lỗi: \"Không xuất được tệp, vui lòng thử lại.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy dòng nào:** Chuyên viên thấy chỉ tiêu mình phụ trách hoặc mình tạo; Trưởng nhóm thấy chỉ tiêu của đội; Trưởng/Phó phòng, BGĐ thấy tất cả. Số thực tế của một dòng giống nhau với mọi người xem\n* Danh sách kênh không có chi phí quảng cáo là danh sách cố định của phân hệ (Zalo OA, Website/SEO, Giới thiệu, Hotline). Khoản chi \"Quảng cáo trả phí\" của các kênh này không vào CPL nhưng vẫn vào chi phí thực\n* Chi phí của một kênh ở màn này có thể khác số ở [Chi phí và Lead](../bao-cao-du-lieu/chi-phi-va-lead.md) và [Doanh thu ghi nhận](../bao-cao-du-lieu/doanh-thu-ghi-nhan.md), vì màn chỉ tiêu chia chi phí về kênh theo chiến dịch\n* Kỳ đang xem không có chỉ tiêu: hiện \"Chưa có chỉ tiêu trong kỳ này\", kèm nút thiết lập nếu bạn có quyền\n* Lỗi tải: hiện \"Không tải được dữ liệu\" và nút `Thử lại`\n\n## <mark style=\"color:green;\">2. Xem chi tiết một dòng chỉ tiêu<\/mark>\n\n<figure><img src=\"images/chi-tieu-theo-kenh-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Nhấn tên kênh ở bảng chính<\/td><td>Cột phải mở chi tiết: tên kênh, mã chỉ tiêu, khoảng ngày; bốn ô Chỉ tiêu Lead, Lead thực tế (đạt x%), Chi phí thực tế (kèm \"trong đó quảng cáo &lt;tiền&gt;\"), CPL thực tế (kèm \"mục tiêu &lt;tiền&gt;\"); thông tin Loại chỉ tiêu (Theo kênh), Trang, Từ kế hoạch, Chỉ tiêu Doanh thu, Doanh thu thực tế<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhấn <code>Mở báo cáo<\/code><\/td><td>Mở <a href=\"../bao-cao-du-lieu/chi-phi-va-lead.md\">Chi phí và Lead<\/a><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Nhấn liên kết <strong>Từ kế hoạch<\/strong><\/td><td>Mở kế hoạch gốc ở <a href=\"ke-hoach-marketing.md\">Kế hoạch Marketing<\/a><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Mở form đầy đủ<\/code>, <code>Sửa<\/code> hoặc <code>Xóa<\/code><\/td><td>Chỉ với chỉ tiêu tạo tay và đúng quyền; cách làm như mục 3 trang <a href=\"chi-tieu-theo-san-pham.md\">Chỉ tiêu theo sản phẩm<\/a>. Chỉ tiêu sinh từ kế hoạch: nút sửa khóa kèm hướng dẫn \"Sửa ở kế hoạch rồi sinh lại\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Nhấn X<\/td><td>Đóng chi tiết<\/td><\/tr>\n<\/tbody><\/table>\n\n## <mark style=\"color:green;\">3. Xem chỉ tiêu Doanh thu và Lợi nhuận gộp theo kênh<\/mark>\n\n<figure><img src=\"images/chi-tieu-theo-kenh-1.png\" alt=\"\"><figcaption><p>Khối \"Chỉ tiêu doanh thu và lợi nhuận gộp theo kênh\" nằm dưới bảng chính<\/p><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề và biểu tượng giải thích** | \"Doanh thu tính từ đơn đã chốt có nguồn lead Marketing của kênh. Lợi nhuận gộp = doanh thu trừ giá vốn, chỉ tính được khi mọi đơn của kênh đã có giá vốn.\" |\n| **Nút `Nạp giá vốn`** | Chỉ Trưởng/Phó phòng, BGĐ thấy; mở chức năng nạp giá vốn ở [Doanh thu ghi nhận](../bao-cao-du-lieu/doanh-thu-ghi-nhan.md) |\n| **Bảng** | Cột Kênh, Chỉ tiêu Doanh thu, Doanh thu thực tế, % đạt Doanh thu, Chỉ tiêu Lợi nhuận gộp, Lợi nhuận gộp thực tế, % đạt Lợi nhuận. Liệt kê mọi kênh có chỉ tiêu |\n| **Thẻ \"Chưa đủ giá vốn\"** | Thẻ ở ô Lợi nhuận gộp thực tế khi kênh chưa đủ giá vốn; % đạt hiện \"-\" |\n| **Hàng Tổng** | Tổng chỉ tiêu và thực tế Doanh thu; Lợi nhuận gộp chỉ có số khi mọi kênh đủ giá vốn, nếu không hiện \"-\" |\n| **Ghi chú** | \"Kết quả thực tế hệ thống tự tính, không nhập tay. Vạch đen là tiến độ thời gian của kỳ.\" |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Cuộn xuống khối <strong>Chỉ tiêu doanh thu và lợi nhuận gộp theo kênh<\/strong><\/td><td>Khối dùng chung bộ lọc và ô tìm với bảng chính<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Đọc cột <strong>Doanh thu thực tế<\/strong><\/td><td>Tổng tiền các đơn đã chốt có nguồn lead Marketing của kênh, theo ngày đặt hàng<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Đọc cột <strong>Lợi nhuận gộp thực tế<\/strong><\/td><td>Lợi nhuận gộp = Doanh thu − Giá vốn. Chỉ có số khi kênh có ít nhất một đơn chốt trong kỳ và <strong>mọi<\/strong> đơn đó đã có giá vốn (giá vốn bằng 0 vẫn tính là có)<br>Chưa đủ hoặc kênh không có đơn chốt trong kỳ: thẻ \"Chưa đủ giá vốn\"<br>Lợi nhuận âm: có dấu trừ<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Nhấn <code>Nạp giá vốn<\/code> (Trưởng/Phó phòng, BGĐ)<\/td><td>Chuyển sang chức năng nạp giá vốn ở <a href=\"../bao-cao-du-lieu/doanh-thu-ghi-nhan.md\">Doanh thu ghi nhận<\/a>. Nạp xong, quay lại màn này để thấy Lợi nhuận gộp<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chuyên viên** không thấy ba cột Lợi nhuận gộp và nút `Nạp giá vốn`; tệp Excel của Chuyên viên cũng không có các cột này. Chuyên viên vẫn thấy phần Doanh thu\n* Chỉ tiêu Lợi nhuận gộp được lập ở kế hoạch, như một dòng mục tiêu **Lợi nhuận gộp** có chọn Kênh (xem mục 4 trang [Kế hoạch Marketing](ke-hoach-marketing.md)), rồi sinh sang đây. Chỉ tiêu không thuộc kế hoạch thì tạo tay bằng `Thiết lập chỉ tiêu`\n* Lợi nhuận gộp không xét tiến độ: không có chip, không đánh dấu chậm tiến độ\n* Đơn trả hàng, hoàn tiền chưa được trừ khỏi doanh thu\n", "chien-dich/danh-sach-chien-dich.md": "# Danh sách chiến dịch\n\n🧭 Tổng quan chức năng: Nơi lập đề xuất chiến dịch quảng cáo, gửi duyệt 2 cấp (nội dung, ngân sách), đưa chiến dịch vào chạy, theo dõi số liệu, tạm dừng, điều chỉnh và kết thúc để chốt số liệu. Mọi người trong phòng Marketing dùng màn này; mỗi người thấy chiến dịch và nút theo vai trò của mình\n\nTruy cập: menu **Chiến dịch → Quản lý chiến dịch → Chiến dịch**\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH CHIẾN DỊCH\n\nBước 1: **Lập đề xuất** (Chuyên viên, Trưởng nhóm, Trưởng/Phó phòng hoặc BGĐ). Nhấn `+ Tạo đề xuất`, nhập sản phẩm, mục tiêu, kênh, ngân sách, thời gian chạy và mục tiêu định lượng. Chiến dịch lưu ở trạng thái **Nháp**. Chiến dịch dựng sẵn trên Facebook Ads Manager được hệ thống tự tạo hồ sơ ở trạng thái **Mới đồng bộ** để người dùng bổ sung\n\nBước 2: **Gửi duyệt** (người phụ trách, người lập, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng hoặc BGĐ). Nhấn `Gửi duyệt`. Hệ thống kiểm đủ thông tin và hạn mức ngân sách quý, rồi chuyển chiến dịch sang **Chờ duyệt nội dung**\n\nBước 3: **Duyệt nội dung (cấp 1)** (Trưởng nhóm của Đội chủ; Trưởng/Phó phòng, BGĐ ký thay). Nhấn `Duyệt nội dung`. Chiến dịch chuyển sang **Chờ duyệt ngân sách**\n\nBước 4: **Duyệt ngân sách (cấp 2)** (Trưởng/Phó phòng hoặc BGĐ). Nhấn `Duyệt ngân sách`. Hệ thống kiểm lại hạn mức quý; đạt thì chiến dịch sang **Đã duyệt** và chuyển sang tab **Đang chạy**. Ở bước 3 và 4, người ký có thể `Từ chối` hoặc `Yêu cầu chỉnh sửa`; người lập và người gửi duyệt không được ký\n\nBước 5: **Đẩy sang nền tảng, đưa vào chạy** (Hệ thống; Trưởng/Phó phòng, BGĐ khi cần chạy sớm). Hệ thống tự đẩy chiến dịch sang Facebook, chạy ngay nếu đã tới ngày bắt đầu, hoặc hẹn tự chạy lúc 07:00 ngày bắt đầu (**Đã duyệt · chờ ngày chạy**). Trưởng/Phó phòng, BGĐ có thể nhấn `Chạy ngay`. Với Google, TikTok, Zalo OA, người phụ trách tự bật quảng cáo trên nền tảng đó\n\nBước 6: **Theo dõi; tạm dừng hoặc tiếp tục; điều chỉnh**. Mọi người theo dõi số liệu đồng bộ mỗi 1 giờ. Người phụ trách, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ nhấn `Tạm dừng` / `Tiếp tục chạy`. Người phụ trách, người lập, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ gửi đề nghị **Điều chỉnh** ngân sách, ngày kết thúc, Đội chủ; đề nghị được duyệt lại đủ 2 cấp như bước 3, 4\n\nBước 7: **Kết thúc, chốt số liệu** (Hệ thống tự kết thúc lúc 23:55 ngày kết thúc; người phụ trách, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ nhấn `Kết thúc sớm`). Lead, đơn, doanh thu chốt ngay lúc kết thúc; chi phí chốt lúc 06:00 ngày thứ 3 sau ngày kết thúc. Chiến dịch sang tab **Đã kết thúc**; người phụ trách nhận việc lập [Đánh giá chiến dịch](danh-gia-chien-dich.md)\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách chiến dịch<\/mark>\n\nMàn chia hai cột: bên trái là danh sách, bên phải là chi tiết chiến dịch đang chọn. Chiến dịch chia vào 3 tab theo trạng thái; tab thứ tư **Đánh giá sau chiến dịch** mở màn [Đánh giá chiến dịch](danh-gia-chien-dich.md)\n\n<figure><img src=\"images/danh-sach-chien-dich-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Tiêu đề và dòng đếm** | Tiêu đề theo tab: \"Chiến dịch đề xuất\", \"Chiến dịch đang chạy\", \"Chiến dịch đã kết thúc\". Dòng đếm dạng \"N chiến dịch · M chờ bạn duyệt · K tạm dừng\". Tab **Đang chạy** ghi thêm số chiến dịch đã duyệt chờ ngày chạy và thời điểm đồng bộ số liệu Facebook gần nhất |\n| **Ô tìm** | Tìm theo mã, tên, kênh hoặc người phụ trách, không phân biệt hoa thường và dấu, tối đa 100 ký tự |\n| **Bộ lọc** | Kênh, Nhãn sản phẩm, Đội chủ, Người phụ trách, Kỳ (từ ngày – đến ngày) và các lọc nhanh **Chờ tôi duyệt**, **Có cảnh báo**, **Của tôi**, **Đội của tôi** |\n| `Xuất Excel` | Tải danh sách đang xem ra tệp Excel |\n| `+ Tạo đề xuất` | Mở hộp tạo đề xuất chiến dịch mới |\n| **Dải tab** | **Đề xuất** (Mới đồng bộ, Nháp, Chờ duyệt nội dung, Chờ duyệt ngân sách, Từ chối); **Đang chạy** (Đã duyệt, Đang đẩy sang Facebook, Đã duyệt · chờ ngày chạy, Đang chạy kể cả đang tạm dừng); **Đã kết thúc**; **Đánh giá sau chiến dịch**. Số cạnh tên tab là số chiến dịch bạn được xem |\n| **Dòng chiến dịch** | Dòng 1: tên, chip trạng thái, chip cảnh báo (\"Chạy khi chưa duyệt\", \"Chi vượt ngân sách đã duyệt\") hoặc nhãn \"Chờ duyệt điều chỉnh\". Dòng 2: mã, kênh, thời gian chạy. Dòng 3: tổng ngân sách (NS), số lead và CPL hoặc số tiếp cận, phần trăm ngân sách đã dùng, nhãn **Chờ bạn duyệt** nếu bạn ký được bước đang chờ |\n| **Cột chi tiết** | Thông tin của chiến dịch đang chọn, xem mục 2 |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở màn<\/td><td>Chọn menu <strong>Chiến dịch → Quản lý chiến dịch → Chiến dịch<\/strong>. Hệ thống mở tab <strong>Đề xuất<\/strong> và mở sẵn chi tiết dòng đầu tiên<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Chọn tab<\/td><td>Nhấn <strong>Đề xuất<\/strong>, <strong>Đang chạy<\/strong> hoặc <strong>Đã kết thúc<\/strong>. Đổi tab thì ô tìm bị xóa, bộ lọc giữ nguyên<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Tìm, lọc<\/td><td>Nhập từ khóa vào ô tìm hoặc nhấn <code>Bộ lọc<\/code> để chọn điều kiện. Khi đang lọc, màn hiện chip <strong>Đang lọc<\/strong>; nhấn <code>Xóa bộ lọc<\/code> để bỏ cả bộ lọc lẫn ô tìm. Không có kết quả: \"Không có chiến dịch nào khớp \"&lt;từ khóa&gt;\".\"; tab rỗng: \"Không có chiến dịch nào ở mục này.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xem chi tiết<\/td><td>Nhấn một dòng. Chi tiết hiện ở cột phải, mở tab <strong>Tổng quan<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><code>Xuất Excel<\/code><\/td><td>Hệ thống tải tệp <code>ChienDich_&lt;DeXuat|DangChay|DaKetThuc&gt;_yyyymmdd.xlsx<\/code> gồm đúng các dòng đang xem (sau tìm và lọc): mã, tên, trạng thái, kênh, sản phẩm, Đội chủ, người phụ trách, ngày, ngân sách, chi phí thực, % đã dùng, mục tiêu và thực tế lead, doanh thu, tiếp cận, CPL, ROAS, cảnh báo. Ô không có số xuất \"-\" để phân biệt với số 0. Danh sách rỗng: \"Không có dữ liệu để xuất.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Ai thấy chiến dịch nào:** Chuyên viên thấy chiến dịch mình phụ trách hoặc mình tạo, chiến dịch có quảng cáo gán cho mình hoặc thuộc tài khoản quảng cáo phân công cho mình. Trưởng nhóm thấy chiến dịch có Đội chủ là đội mình; chiến dịch chỉ có nhóm quảng cáo của đội mình thì xem được nhưng không sửa. Trưởng/Phó phòng, BGĐ thấy toàn bộ\n* **Thứ tự dòng:** việc cần xử lý đứng trước. Tab Đề xuất: Chờ duyệt ngân sách, Chờ duyệt nội dung, Từ chối, Nháp, Mới đồng bộ. Tab Đang chạy: chờ duyệt điều chỉnh, chờ ngày chạy, đang đẩy, đã duyệt, tạm dừng, đang chạy. Cùng nhóm thì xếp theo ngày bắt đầu. Tab Đã kết thúc xếp theo ngày kết thúc thực tế, mới nhất trước\n* Danh sách cuộn liên tục, không phân trang\n* **Đội chủ** là đội Marketing chịu trách nhiệm chiến dịch. Trưởng nhóm của Đội chủ là người ký cấp 1\n\n## <mark style=\"color:green;\">2. Xem chi tiết chiến dịch<\/mark>\n\nĐầu chi tiết gồm tên chiến dịch, dòng \"mã · kênh · ngày bắt đầu – ngày kết thúc\" và các nút thao tác theo trạng thái. Bên dưới có 4 tab: **Tổng quan**, **Nội dung (n)**, **Lịch sử & liên kết**, **Quảng cáo (n)**\n\n<figure><img src=\"images/danh-sach-chien-dich-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n**Tab Tổng quan**\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Thanh bước** | Đề xuất → Duyệt nội dung → Duyệt ngân sách → Đang chạy → Kết thúc. Bước đã qua tô đậm; bước bị từ chối ghi \"Bị từ chối\" |\n| **Khung trạng thái** | Câu giải thích trạng thái hiện tại và việc bạn làm được, ví dụ \"Chờ duyệt nội dung, bước 1 của 2 · Bạn duyệt được bước này.\" |\n| **Khung cảnh báo** | Hiện khi chiến dịch có cảnh báo, hoặc \"Kỳ chưa có kế hoạch\" khi quý của ngày bắt đầu chưa khai hạn mức ngân sách |\n| **Thẻ chỉ số** | 5 thẻ. Hai thẻ đầu luôn là **Ngân sách duyệt** và **Chi phí thực**. Ba thẻ sau theo mục tiêu: Thu lead → Lead (kèm CPL), Đơn chốt (kèm doanh thu), ROAS; Bán hàng → Đơn chốt, ROAS, Lead; Kéo truy cập, Tương tác → Tiếp cận, Tần suất, Chi phí / 1.000 tiếp cận |\n| **Mục tiêu định lượng** | Bảng Chỉ số, Mục tiêu, Thực tế, % đạt cho Lead, Doanh thu, Độ phủ · khách hàng tiếp cận. Khi chiến dịch ở Mới đồng bộ, Nháp, Từ chối và bạn có quyền sửa: thêm 3 ô nhập mục tiêu và nút `Lưu mục tiêu` |\n| **Chi phí theo ngày** | Biểu đồ cột chi phí Facebook mỗi ngày, kèm \"Cao nhất … / ngày · trung bình … / ngày\". Chỉ hiện khi chiến dịch đang chạy hoặc đã kết thúc và có số liệu Facebook |\n| **Thông tin chung** | Mã, kênh triển khai (tỷ lệ % và số tiền từng kênh), mục tiêu, sản phẩm, thời gian chạy, người lập, người gửi duyệt, người phụ trách, Đội chủ, tài khoản quảng cáo, kiểu và tổng ngân sách, hạn mức quý còn lại, nguồn, trạng thái trên Facebook, chiến dịch UTM, trạng thái, ghi chú |\n\n**Tab Nội dung (n)**: bảng nội dung đã gắn vào chiến dịch (Nội dung, Loại, Trạng thái, Người làm), nút `+ Gắn nội dung` và biểu tượng gỡ ở từng dòng\n\n<figure><img src=\"images/danh-sach-chien-dich-3.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n**Tab Lịch sử & liên kết**: thẻ **Liên kết** (Kế hoạch, Phân bổ ngân sách, Đánh giá, Báo cáo hiệu quả chiến dịch), thẻ **Tiến trình duyệt** của vòng hiện tại (Cấp, Bước, Kết quả, Người ký, Thời điểm, Ý kiến) và thẻ **Lịch sử** (Thời điểm, Người thực hiện, Hành động; mới nhất trên đầu)\n\n<figure><img src=\"images/danh-sach-chien-dich-4.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n**Tab Quảng cáo (n)**: chỉ hiện với chiến dịch có kênh Facebook; n là số nhóm quảng cáo. Gồm bảng nhóm quảng cáo và quảng cáo (sửa được khi chiến dịch ở Mới đồng bộ, Nháp, Từ chối), cây nhóm quảng cáo đọc từ Facebook với nút `Gán đội`, `Gán Nhân viên marketing`, thẻ **Hiệu quả trên Facebook** (Chi Meta, Lượt hiển thị, Lượt nhấp, Khách hàng tiếp cận, thời điểm đồng bộ) và **Nhật ký API** (chỉ Trưởng nhóm trở lên)\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn chiến dịch<\/td><td>Nhấn dòng chiến dịch ở cột trái. Chi tiết mở tab <strong>Tổng quan<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Xem số liệu<\/td><td>Đọc thẻ chỉ số và bảng <strong>Mục tiêu định lượng<\/strong>. Chiến dịch chưa chạy ghi \"chưa chạy\" ở cột Thực tế. Chiến dịch đang chạy ghi \"% đạt tính tại thời điểm xem · dd/mm/yyyy hh:mm\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Lưu mục tiêu<\/td><td>Với chiến dịch Mới đồng bộ, Nháp, Từ chối: nhập <strong>Mục tiêu Lead<\/strong>, <strong>Mục tiêu doanh thu (đ)<\/strong>, <strong>Mục tiêu khách hàng tiếp cận<\/strong>, nhấn <code>Lưu mục tiêu<\/code>. Thành công: \"Đã lưu mục tiêu.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Gắn nội dung<\/td><td>Mở tab <strong>Nội dung<\/strong>, nhấn <code>+ Gắn nội dung<\/code>, chọn một hoặc nhiều nội dung trong kho. Thành công: \"Đã gắn &lt;n&gt; nội dung vào chiến dịch.\" Để gỡ, nhấn biểu tượng gỡ ở dòng, xác nhận \"Gỡ nội dung &lt;tên&gt; khỏi chiến dịch?\" bằng <code>Gỡ<\/code><\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Xem lịch sử, mở liên kết<\/td><td>Mở tab <strong>Lịch sử &amp; liên kết<\/strong>. Nhấn liên kết để mở kế hoạch, kỳ phân bổ, đánh giá hoặc báo cáo hiệu quả đã lọc theo chiến dịch. Liên kết tới bản ghi bạn không có quyền xem hiện chữ thường, không bấm được<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* **Chi phí thực** gồm chi phí Facebook đồng bộ về và các lượt thanh toán còn hiệu lực đã ghi cho chiến dịch (khoản tính vào thực chi); tiền nạp tài khoản Facebook không bị tính hai lần. **% đã dùng** = Chi phí thực ÷ Ngân sách đã duyệt\n* **CPL, ROAS, ROI** luôn tính trên **chi phí quảng cáo**, không dùng chi phí thực\n* **Khách hàng tiếp cận** là số người xem duy nhất của cả chiến dịch, chỉ có với Facebook; kênh khác hiện \"-\". Kênh không có chi phí quảng cáo (Zalo OA, Website/SEO, Giới thiệu, Hotline) hiện \"-\" ở chi phí quảng cáo, CPL, ROAS, ROI\n* Chiến dịch chưa nối chiến dịch UTM thì chi phí, lead, đơn, doanh thu và các tỷ số hiện \"-\" kèm chú giải \"Chưa nối chiến dịch UTM\"\n* Số liệu tính trên toàn bộ dữ liệu của chiến dịch, kể cả phần phát sinh trước ngày chạy và khoản trả sau tới lúc chốt chi phí\n* Chỉ gắn hoặc gỡ nội dung được khi chiến dịch **không** ở Chờ duyệt nội dung, Chờ duyệt ngân sách, Từ chối, Đã kết thúc. Gắn nội dung chưa duyệt vẫn gửi duyệt được; người ký cấp 1 thấy dòng \"n nội dung chưa duyệt\"\n* Bản ghi gốc của nội dung xem ở [Bài đang sản xuất](../noi-dung-va-media/bai-dang-san-xuat.md)\n\n## <mark style=\"color:green;\">3. Tạo và sửa đề xuất chiến dịch<\/mark>\n\nMọi người trong phòng Marketing tạo được đề xuất. Sửa được khi chiến dịch ở **Mới đồng bộ**, **Nháp**, **Từ chối**, bởi người phụ trách, người lập, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng hoặc BGĐ\n\n<figure><img src=\"images/danh-sach-chien-dich-5.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Ô nhập | Mô tả |\n| --- | --- |\n| **Tên chiến dịch** | Bắt buộc, tối đa 255 ký tự |\n| **Kênh triển khai** | Bảng phân bổ, mỗi dòng: Kênh, Tỷ lệ % (lớn hơn 0, tối đa 2 chữ số thập phân), Số tiền tự tính = Tổng ngân sách × Tỷ lệ ÷ 100. Dòng đầu mặc định 100%. Không trùng kênh; tổng phải đủ 100% |\n| **Mục tiêu** | Bắt buộc: Thu lead (mặc định), Kéo truy cập, Tương tác, Bán hàng |\n| **Sản phẩm** | Chọn một hoặc nhiều nhãn sản phẩm. Bắt buộc khi gửi duyệt |\n| **Ngày bắt đầu, Ngày kết thúc** | Bắt buộc. Ngày bắt đầu mặc định hôm nay. Ngày kết thúc không trước ngày bắt đầu |\n| **Kiểu ngân sách** | Trọn đời (mặc định) hoặc Theo ngày |\n| **Ngân sách đề xuất (đ)** | Bắt buộc, số nguyên lớn hơn 0, tối đa 999.999.999.999. Bên dưới hiện \"Hạn mức quý &lt;Quý/năm&gt; còn lại &lt;x&gt;\" hoặc \"Quý này chưa khai hạn mức ngân sách\" theo ngày bắt đầu |\n| **Đội chủ** | Bắt buộc, không có mặc định. Nếu chiến dịch đã có nhóm quảng cáo thì chỉ chọn trong các đội có nhóm quảng cáo |\n| **Người phụ trách** | Bắt buộc, mặc định là bạn |\n| **Tài khoản quảng cáo** | Hiện khi có kênh Facebook. Không bắt buộc khi lưu, bắt buộc khi đẩy sang Facebook |\n| **Mục tiêu Lead, Mục tiêu doanh thu (đ), Mục tiêu khách hàng tiếp cận** | Số nguyên không âm, tối đa 999.999.999.999; bỏ trống là không đặt. Ô bắt buộc theo mục tiêu có dấu * |\n| **Chiến dịch UTM** | Không bắt buộc; hệ thống tự gán khi để trống |\n| **Ghi chú (Mô tả & KPI cam kết)** | Không bắt buộc, tối đa 5.000 ký tự |\n| **Gợi ý case mẫu** | Khi đã chọn sản phẩm: tối đa 3 đánh giá đã xác nhận gắn \"Case mẫu\" cùng nhãn sản phẩm, dạng \"mã đánh giá · tên chiến dịch · ROAS\". Nhấn để mở đánh giá ở thẻ mới |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td><code>+ Tạo đề xuất<\/code><\/td><td>Nhấn nút ở thanh trên. Hệ thống mở hộp <strong>Tạo đề xuất chiến dịch<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập thông tin<\/td><td>Nhập lần lượt các ô ở bảng trên. Số tiền từng kênh và hạn mức quý còn lại tự cập nhật khi bạn đổi tổng ngân sách hoặc ngày bắt đầu<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><code>Tạo đề xuất<\/code><\/td><td>Hệ thống kiểm dữ liệu. Sai thì báo lỗi ngay dưới ô sai và giữ nguyên dữ liệu, ví dụ \"Nhập tên chiến dịch.\", \"Ngày kết thúc không được trước ngày bắt đầu.\", \"Ngân sách phải là số lớn hơn 0.\", \"Phân bổ theo kênh của «&lt;tên&gt;» đang là &lt;x&gt;%, phải đủ 100%.\", \"Kênh này đã có trong phân bổ.\"<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Hệ thống lưu<\/td><td>Chiến dịch lưu ở <strong>Nháp<\/strong>, nguồn \"Soạn trong ERP\", được cấp mã dạng <code>CMP-yymm-nn<\/code>. Hộp đóng, chi tiết chiến dịch mở ở tab Đề xuất. Thông báo: \"Đã tạo đề xuất &lt;mã&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><code>Sửa<\/code><\/td><td>Ở chi tiết chiến dịch Mới đồng bộ, Nháp, Từ chối, nhấn <code>Sửa<\/code>, đổi thông tin, nhấn <code>Lưu thay đổi<\/code>. Thông báo: \"Đã lưu thay đổi đề xuất &lt;mã&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td>Bổ sung chiến dịch Mới đồng bộ<\/td><td>Với chiến dịch dựng trên Ads Manager: menu <strong>⋯<\/strong> → <code>Gán đội<\/code> để gán đội cho từng nhóm quảng cáo, <code>Gán Nhân viên marketing<\/code> để gán người cho từng quảng cáo; chọn Đội chủ; nhấn <code>Sửa<\/code> để bổ sung ngày kết thúc và mục tiêu định lượng; sau đó gửi duyệt<\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Xóa đề xuất<\/td><td>Menu <strong>⋯<\/strong> → <code>Xóa<\/code> (chỉ chiến dịch Nháp, Mới đồng bộ chưa đẩy sang Facebook). Xác nhận \"Xóa chiến dịch &lt;mã&gt;?\" bằng <code>Xóa<\/code>. Thông báo: \"Đã xóa chiến dịch &lt;mã&gt;.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Khi chiến dịch đang **Chờ duyệt nội dung** hoặc **Chờ duyệt ngân sách**, mọi ô bị khóa. Muốn sửa, nhờ người ký nhấn `Yêu cầu chỉnh sửa` để chiến dịch về Nháp\n* Chỉ Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ được xóa. Chuyên viên không xóa được. Xóa sẽ xóa cả phân bổ, nhóm quảng cáo, liên kết nội dung và lịch sử, không khôi phục được; mã đã cấp không dùng lại\n* Chiến dịch đã duyệt trở đi chỉ đổi được Tổng ngân sách, Ngày kết thúc, Đội chủ qua **Điều chỉnh** (mục 9)\n\n## <mark style=\"color:green;\">4. Gửi duyệt<\/mark>\n\nNgười phụ trách, người lập, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng hoặc BGĐ gửi duyệt chiến dịch **Mới đồng bộ**, **Nháp**; chiến dịch **Từ chối** dùng nút `Gửi duyệt lại`\n\n<figure><img src=\"images/danh-sach-chien-dich-2.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Chọn chiến dịch<\/td><td>Ở tab <strong>Đề xuất<\/strong>, nhấn chiến dịch Nháp, Mới đồng bộ hoặc Từ chối<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><code>Gửi duyệt<\/code> / <code>Gửi duyệt lại<\/code><\/td><td>Nhấn nút ở đầu chi tiết. Không có hộp xác nhận<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Hệ thống kiểm điều kiện<\/td><td>Thiếu điều kiện thì hiện hộp \"Chưa gửi duyệt được «&lt;tên&gt;»:\" và liệt kê mọi thiếu sót, mỗi dòng một ý, ví dụ: \"Chưa chọn Đội chủ.\", \"Chưa chọn nhãn sản phẩm.\", \"Chưa phân bổ kênh triển khai.\", \"Ngày bắt đầu không được trước hôm nay.\", \"Chưa nhập Mục tiêu Lead cho mục tiêu Thu lead.\", \"Nhóm quảng cáo chưa gán đội: …\", \"Quảng cáo chưa gán Nhân viên marketing: …\", \"Tổng ngân sách các nhóm quảng cáo (x) khác phần đã phân bổ cho Facebook (y)…\". Nhấn <code>Đóng<\/code>, bổ sung rồi gửi lại<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Hệ thống kiểm hạn mức quý<\/td><td>Ngân sách vượt phần còn lại của quý (theo ngày bắt đầu) thì bị chặn: \"Ngân sách &lt;số tiền&gt; vượt phần còn lại của kỳ &lt;Quý/năm&gt; (&lt;còn lại&gt;). Giảm ngân sách hoặc đề nghị nâng hạn mức quý trước khi gửi duyệt.\" Quý chưa khai hạn mức thì vẫn gửi được, chiến dịch gắn cờ \"Kỳ chưa có kế hoạch\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Gửi thành công<\/td><td>Chiến dịch sang <strong>Chờ duyệt nội dung<\/strong>, bị khóa sửa. Bạn trở thành người phụ trách và được ghi là người gửi duyệt. Người ký cấp 1 nhận việc \"Duyệt chiến dịch marketing\". Thông báo: \"Đã gửi duyệt &lt;mã&gt;. Bước 1: duyệt nội dung.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Người bấm gửi duyệt **không** được ký bất kỳ cấp nào của vòng duyệt đó, kể cả khi là Trưởng nhóm, Trưởng/Phó phòng hay BGĐ\n* Gửi lại sau khi bị từ chối hoặc yêu cầu chỉnh sửa luôn bắt đầu lại từ cấp 1; chữ ký cũ vẫn giữ trong lịch sử\n* Chiến dịch dựng trên Ads Manager và chiến dịch đã từng chạy không bị kiểm \"ngày bắt đầu không trước hôm nay\"\n* Hạn mức quý tính trên toàn công ty, đã trừ mọi chiến dịch đã duyệt, đang chạy, đã kết thúc có ngày bắt đầu trong quý. Trưởng/Phó phòng xem tham chiếu \"Hạn mức quý còn lại\" ở [Phân bổ ngân sách](../ke-hoach/phan-bo-ngan-sach.md)\n\n## <mark style=\"color:green;\">5. Duyệt nội dung (cấp 1)<\/mark>\n\nTrưởng nhóm của Đội chủ ký cấp 1; Trưởng/Phó phòng, BGĐ ký thay ở mọi đội. Chiến dịch chờ bạn ký có nhãn **Chờ bạn duyệt** ở dòng danh sách và có việc \"Duyệt chiến dịch marketing\"\n\n<figure><img src=\"images/danh-sach-chien-dich-6.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chiến dịch<\/td><td>Nhấn chiến dịch <strong>Chờ duyệt nội dung<\/strong> (dùng lọc nhanh <strong>Chờ tôi duyệt<\/strong> để tìm nhanh). Khung \"Chờ duyệt nội dung, bước 1 của 2\" cho biết bạn duyệt được hay không, kèm dòng \"&lt;n&gt; nội dung chưa duyệt\" nếu có<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Kiểm tra<\/td><td>Xem thông tin chung, mục tiêu định lượng và tab <strong>Nội dung<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><code>Duyệt nội dung<\/code><\/td><td>Hệ thống mở hộp <strong>Duyệt nội dung<\/strong>. Nhập <strong>Ý kiến<\/strong> (không bắt buộc, tối đa 1.000 ký tự), nhấn <code>Duyệt<\/code><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Kết quả<\/td><td>Chiến dịch sang <strong>Chờ duyệt ngân sách<\/strong>; Trưởng/Phó phòng nhận việc ký cấp 2; người lập và người phụ trách nhận thông báo. Thông báo: \"Đã duyệt nội dung. Chuyển sang bước 2: duyệt ngân sách.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n### ⚠️ Lưu ý\n\n* Nếu bạn là người lập hoặc người gửi duyệt, nút ký hiện mờ kèm câu \"Bạn không thể duyệt chiến dịch do chính mình lập hoặc gửi duyệt.\" và khung ghi \"Cần Trưởng nhóm khác của Đội chủ hoặc Trưởng/Phó phòng duyệt.\"\n* Trưởng nhóm đội khác xem được chiến dịch vẫn không ký được; khung ghi \"Bước này do trưởng nhóm của Đội chủ &lt;đội&gt; ký (hoặc trưởng phòng ký thay).\" Chuyên viên thấy \"Trưởng nhóm trở lên mới duyệt được bước này.\"\n* Đội chủ có nhiều Trưởng nhóm thì ai cũng ký được. Đội chủ không có Trưởng nhóm thì chỉ Trưởng/Phó phòng, BGĐ ký\n* Không còn ai khác đủ quyền ký thì chiến dịch giữ trạng thái chờ duyệt; người lập thấy \"Chưa có người khác có quyền duyệt chiến dịch này.\"\n* BGĐ ký được nhưng thường không nhận việc chờ ký, trừ khi không còn ai khác\n\n## <mark style=\"color:green;\">6. Duyệt ngân sách (cấp 2)<\/mark>\n\nChỉ Trưởng/Phó phòng hoặc BGĐ ký cấp 2, và không phải người lập, người gửi duyệt\n\n<figure><img src=\"images/danh-sach-chien-dich-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở chiến dịch<\/td><td>Nhấn chiến dịch <strong>Chờ duyệt ngân sách<\/strong>. Khung \"Chờ duyệt ngân sách, bước 2 của 2\" ghi \"Ngân sách đề xuất &lt;x&gt;, hạn mức quý còn lại &lt;y&gt;.\" Trong hạn mức: khung \"Nằm trong hạn mức.\"; vượt: khung \"Vượt hạn mức &lt;z&gt;.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><code>Duyệt ngân sách<\/code><\/td><td>Hệ thống kiểm lại hạn mức quý tại thời điểm bấm (chiến dịch khác có thể vừa được duyệt). Vượt hạn mức: xem bước 4<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Xác nhận<\/td><td>Trong hộp <strong>Duyệt ngân sách<\/strong>, nhập ý kiến (không bắt buộc), nhấn <code>Duyệt<\/code>. Chiến dịch sang <strong>Đã duyệt<\/strong>; ngân sách đã duyệt bằng tổng ngân sách và được tính vào hạn mức quý đã dùng. Hệ thống tự nối chiến dịch UTM, rồi:<br>- ngày bắt đầu đã tới: \"Đã duyệt &lt;mã&gt;, chiến dịch bắt đầu chạy trên &lt;kênh&gt;.\";<br>- ngày bắt đầu còn ở sau: \"Đã duyệt &lt;mã&gt;, đã đẩy sang &lt;kênh&gt; và tự chạy lúc 07:00 ngày dd/mm/yyyy.\"<br>Chiến dịch chuyển sang tab <strong>Đang chạy<\/strong> và màn đi theo<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Vượt hạn mức quý<\/td><td>Hệ thống hiện hộp <strong>Không duyệt được: vượt hạn mức quý<\/strong> (ảnh dưới), không ký, chiến dịch giữ Chờ duyệt ngân sách. Nhấn <code>Đóng<\/code> để quay lại, hoặc <code>Yêu cầu chỉnh sửa<\/code> để trả chiến dịch về cho người lập với ý kiến điền sẵn \"Ngân sách vượt hạn mức quý còn lại &lt;y&gt;. Giảm ngân sách xuống tối đa &lt;y&gt; hoặc chờ nâng hạn mức quý.\" (sửa được)<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/danh-sach-chien-dich-8.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Vượt hạn mức quý thì **không** có cách duyệt vượt. Người lập phải giảm ngân sách, hoặc Trưởng/Phó phòng nâng hạn mức quý trước\n* Quý chưa khai hạn mức vẫn duyệt được, nhưng chiến dịch có kênh Facebook chưa đẩy đi được; khung ghi \"Quý này chưa khai hạn mức cho công ty của chiến dịch.\" Khai hạn mức xong, hệ thống tự đẩy ở lượt 5 phút kế tiếp\n* Người lập, người gửi duyệt thấy nút ký mờ kèm câu \"Bạn không thể duyệt chiến dịch do chính mình lập hoặc gửi duyệt.\" và khung ghi \"Cần Trưởng/Phó phòng hoặc Ban giám đốc khác duyệt.\"\n\n## <mark style=\"color:green;\">7. Từ chối, yêu cầu chỉnh sửa<\/mark>\n\nNgười ký của bước đang chờ (cấp 1 hoặc cấp 2) có hai cách trả chiến dịch:\n\n* `Yêu cầu chỉnh sửa`: chiến dịch về **Nháp** để người lập sửa và gửi lại ngay, không mang tiếng bị bác\n* `Từ chối`: chiến dịch về **Từ chối**, vẫn nằm ở tab Đề xuất\n\n<figure><img src=\"images/danh-sach-chien-dich-7.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td><code>Từ chối<\/code> hoặc <code>Yêu cầu chỉnh sửa<\/code><\/td><td>Nhấn nút ở đầu chi tiết chiến dịch đang chờ bạn ký. Hệ thống mở hộp <strong>Từ chối chiến dịch<\/strong> hoặc <strong>Yêu cầu chỉnh sửa chiến dịch<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Nhập lý do<\/td><td>Nhập <strong>Lý do từ chối *<\/strong> hoặc <strong>Cần sửa gì *<\/strong> (bắt buộc, tối đa 1.000 ký tự). Nêu rõ điểm cần sửa để người lập chỉnh lại<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><code>Từ chối chiến dịch<\/code> / <code>Gửi yêu cầu chỉnh sửa<\/code><\/td><td>Để trống lý do: \"Chưa nhập lý do từ chối.\" hoặc \"Yêu cầu chỉnh sửa phải ghi rõ cần sửa gì.\" Thành công: \"Đã từ chối &lt;mã&gt;. Người lập nhận được lý do.\" hoặc \"Đã trả &lt;mã&gt; về Nháp để chỉnh sửa.\" Người lập và người phụ trách nhận thông báo kèm lý do<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Người lập xem lý do<\/td><td>Chiến dịch Từ chối có khung \"Bị từ chối ở bước &lt;duyệt nội dung | duyệt ngân sách&gt; bởi &lt;người&gt; lúc &lt;thời điểm&gt;\", lý do và câu \"Sửa theo lý do rồi gửi duyệt lại từ bước duyệt nội dung.\" (ảnh dưới). Chiến dịch về Nháp do yêu cầu chỉnh sửa có khung \"Yêu cầu chỉnh sửa ở bước … bởi … lúc …\" kèm ý kiến<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><code>Sửa<\/code>, <code>Gửi duyệt lại<\/code><\/td><td>Người lập sửa (mục 3) rồi gửi lại (mục 4). Vòng duyệt mới bắt đầu từ cấp 1; khung lý do cũ ẩn đi<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/danh-sach-chien-dich-9.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Lý do là bắt buộc ở cả hai cách. Lý do được ghi vào tiến trình duyệt và lịch sử\n* Chiến dịch Từ chối không tính vào hạn mức quý và không xóa được (để giữ vết). Trưởng/Phó phòng, BGĐ có thể **Lưu trữ** qua menu **⋯** để ẩn khỏi danh sách; vẫn tra lại được\n\n## <mark style=\"color:green;\">8. Đẩy sang nền tảng và đưa vào chạy<\/mark>\n\nSau khi duyệt ngân sách, hệ thống tự đưa chiến dịch vào chạy. Chiến dịch chưa tới ngày bắt đầu nằm ở tab **Đang chạy** với chip **Đã duyệt · chờ ngày chạy**\n\n<figure><img src=\"images/danh-sach-chien-dich-10.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Hệ thống đẩy sang Facebook<\/td><td>Với chiến dịch có kênh Facebook soạn trong hệ thống: hệ thống dựng chiến dịch, nhóm quảng cáo, quảng cáo trên Facebook ở trạng thái tạm dừng. Đang đẩy dở: chip \"Đang đẩy sang Facebook\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Hẹn ngày chạy<\/td><td>Ngày bắt đầu còn ở sau: khung \"Đã đẩy sang Facebook · Đã hẹn tự kích hoạt lúc 07:00 ngày dd/mm/yyyy.\" Kênh khác: \"Đã duyệt · Đã hẹn tự kích hoạt lúc 07:00 ngày dd/mm/yyyy. Người phụ trách bật quảng cáo trên &lt;kênh&gt;.\" Thẻ chỉ số ghi \"chưa chạy\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Tự chạy<\/td><td>Đúng 07:00 ngày bắt đầu (hoặc ngay khi duyệt nếu đã tới ngày), hệ thống bật chạy chiến dịch, mọi nhóm quảng cáo, mọi quảng cáo trên Facebook, chuyển chiến dịch sang <strong>Đang chạy<\/strong>, ghi ngày chạy thực tế và báo người phụ trách<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><code>Chạy ngay<\/code><\/td><td>Chỉ Trưởng/Phó phòng, BGĐ. Nhấn để chạy sớm hơn lịch; hộp <strong>Chạy sớm hơn lịch?<\/strong> ghi \"Lịch chạy bắt đầu dd/mm/yyyy. Chạy ngay sẽ phát sinh chi phí từ hôm nay và ngày bắt đầu thực tế được ghi lại.\" Nhấn <code>Chạy ngay<\/code> để xác nhận (thông báo \"Chiến dịch &lt;mã&gt; đã bắt đầu chạy.\"), hoặc <code>Hủy<\/code> để giữ lịch hẹn<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><code>Đẩy sang Facebook<\/code><\/td><td>Khi đẩy lỗi, khung \"Đẩy sang Facebook dừng lại\" hiện lỗi gần nhất và \"Hệ thống tự thử lại mỗi 5 phút.\" Người phụ trách, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ có thể nhấn nút để đẩy lại ngay. Thành công: \"Đã dựng xong cây quảng cáo.\" kèm \"Tự chạy lúc 07:00 ngày dd/mm/yyyy.\" hoặc \"Đã bật chạy.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/danh-sach-chien-dich-11.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Google, TikTok, Zalo OA chưa có kết nối đẩy: hệ thống chỉ chuyển trạng thái để theo dõi, người phụ trách tự bật quảng cáo trên nền tảng đó\n* Chiến dịch dựng trên Ads Manager không đẩy từ hệ thống (tránh tạo bản trùng); bật chạy trên Ads Manager, lượt đồng bộ thấy chiến dịch chạy sẽ ghi nhận Đang chạy\n* Lỗi đẩy thường gặp: \"Chưa chọn tài khoản quảng cáo, hoặc tài khoản đã tắt.\", \"Tài khoản quảng cáo «&lt;tên&gt;» chưa có token - bấm Kết nối Facebook Ads.\", \"Quý này chưa khai hạn mức cho công ty của chiến dịch.\", \"Chưa có nhóm quảng cáo nào để đẩy.\", \"Nhóm «&lt;tên&gt;» chưa có quảng cáo nào…\"\n* Ngày chạy thực tế chỉ ghi ở lần chạy đầu tiên; tiếp tục chạy sau tạm dừng không ghi đè\n\n## <mark style=\"color:green;\">9. Theo dõi, tạm dừng, tiếp tục và điều chỉnh<\/mark>\n\nTab **Đang chạy** cho biết số liệu Facebook Ads đồng bộ lúc nào. Chi tiết chiến dịch đang chạy có thẻ chỉ số, mục tiêu so với thực tế và chi phí theo ngày\n\n<figure><img src=\"images/danh-sach-chien-dich-12.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Theo dõi<\/td><td>Mở tab <strong>Đang chạy<\/strong>, chọn chiến dịch. Số liệu theo lượt đồng bộ gần nhất; % đạt tính tại thời điểm xem. Khung \"Cảnh báo: Chi vượt ngân sách đã duyệt\" hiện khi chi phí thực vượt ngân sách đã duyệt<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><code>Đồng bộ ngay<\/code><\/td><td>Chỉ Trưởng nhóm trở lên. Nút ở thanh trên tab Đang chạy kéo ngay số liệu mọi tài khoản quảng cáo, soát cảnh báo rồi tải lại màn. Với một chiến dịch có mã Facebook: menu <strong>⋯<\/strong> → <code>Đồng bộ lại<\/code> (\"Đã kéo lại dữ liệu từ Facebook.\")<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><code>Tạm dừng<\/code><\/td><td>Hộp <strong>Tạm dừng chiến dịch?<\/strong> mở ra, nhập <strong>Lý do tạm dừng<\/strong> (không bắt buộc, ví dụ \"CPL vượt mục tiêu\"), nhấn <code>Tạm dừng<\/code>. Thông báo: \"Đã tạm dừng &lt;mã&gt;. Cờ tạm dừng gửi sang &lt;kênh&gt;.\" Chip đổi sang <strong>Tạm dừng<\/strong>, khung \"Đang tạm dừng\" ghi người và thời điểm tạm dừng (ảnh dưới)<\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td><code>Tiếp tục chạy<\/code><\/td><td>Nhấn ở chiến dịch đang tạm dừng. Thông báo: \"Đã cho &lt;mã&gt; chạy tiếp.\"<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td>Menu <strong>⋯<\/strong> → <code>Điều chỉnh<\/code><\/td><td>Hộp <strong>Đề nghị điều chỉnh chiến dịch<\/strong> chỉ mở 3 ô: <strong>Ngày kết thúc<\/strong>, <strong>Ngân sách đề xuất<\/strong>, <strong>Đội chủ<\/strong> (ảnh dưới). Ô ngân sách hiện \"Phần tăng &lt;x&gt;, hạn mức quý còn lại &lt;y&gt;\"<\/td><\/tr>\n<tr><td><strong>Bước 6<\/strong><\/td><td><code>Gửi đề nghị điều chỉnh<\/code><\/td><td>Hộp xác nhận \"Đề nghị điều chỉnh sẽ được duyệt lại 2 cấp. Chiến dịch vẫn chạy với số đã duyệt cho tới khi duyệt xong. Gửi đề nghị?\", nhấn <code>Gửi đề nghị<\/code>. Thông báo: \"Đã gửi đề nghị điều chỉnh &lt;mã&gt;. Chiến dịch vẫn chạy với số đã duyệt.\" Chiến dịch có nhãn <strong>Chờ duyệt điều chỉnh<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 7<\/strong><\/td><td>Duyệt điều chỉnh<\/td><td>Người ký cấp 1 rồi cấp 2 nhấn <code>Duyệt điều chỉnh<\/code> (hoặc <code>Từ chối<\/code>, <code>Yêu cầu chỉnh sửa<\/code>), giống mục 5, 6, 7. Cấp 2 duyệt xong: \"Đã duyệt điều chỉnh &lt;mã&gt;. Áp dụng số mới từ bây giờ.\" Bị trả lại: \"Đã trả lại đề nghị điều chỉnh &lt;mã&gt;. Chiến dịch tiếp tục chạy với số đã duyệt.\"<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/danh-sach-chien-dich-13.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n<figure><img src=\"images/danh-sach-chien-dich-14.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* **Ai tạm dừng, tiếp tục được:** người phụ trách, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ. Người khác thấy câu \"Chỉ người phụ trách (&lt;tên&gt;) hoặc trưởng nhóm trở lên được tạm dừng hay kết thúc chiến dịch.\"\n* Tạm dừng không đổi trạng thái: chiến dịch vẫn là Đang chạy. Với Facebook, hệ thống gửi lệnh tạm dừng sang Facebook; kênh khác chỉ ghi cờ, người phụ trách tự tạm dừng trên nền tảng. Tạm dừng hoặc bật lại trên Ads Manager cũng được hệ thống tự ghi nhận ở lượt đồng bộ sau. Gửi lệnh lỗi: \"Chưa gửi được lệnh sang Meta: &lt;lỗi&gt;. Thử lại sau.\"\n* Số liệu Facebook đồng bộ **mỗi 1 giờ**; Google Ads, TikTok Ads chưa có đồng bộ (chi phí các kênh này vào qua [Đề xuất chi](../quan-ly-chi-phi-ngan-sach/de-xuat-chi.md)). Quá 3 giờ chưa đồng bộ được, dòng đếm hiện \"· chưa đồng bộ được từ hh:mm\"\n* **Điều chỉnh chiến dịch đang chạy:** trong lúc chờ duyệt, chiến dịch vẫn chạy với ngân sách, ngày kết thúc, Đội chủ cũ; % đã dùng và cảnh báo vẫn tính trên ngân sách đã duyệt cũ; chưa gửi được đề nghị khác. Đổi Đội chủ thì cấp 1 do Trưởng nhóm của Đội chủ **mới** ký. Ngân sách, ngày kết thúc trên Facebook không tự đổi; người phụ trách chỉnh trên Ads Manager theo số đã duyệt\n* **Điều chỉnh chiến dịch chưa chạy** (Đã duyệt, chờ ngày chạy): hộp xác nhận \"Điều chỉnh sẽ hủy mọi chữ ký duyệt và đưa chiến dịch về Chờ duyệt nội dung. Tiếp tục?\". Nhấn `Điều chỉnh` thì mọi chữ ký bị hủy, chiến dịch quay về tab Đề xuất để duyệt lại từ đầu\n* Cảnh báo chi vượt được soát mỗi giờ; mỗi khi cảnh báo thay đổi, người phụ trách, Trưởng/Phó phòng và BGĐ nhận việc cảnh báo. Xem thêm ở [Cảnh báo cần xử lý](../bang-dieu-khien/canh-bao-can-xu-ly.md)\n* Hết ngân sách **không** tự kết thúc chiến dịch, chỉ cảnh báo\n\n## <mark style=\"color:green;\">10. Kết thúc sớm và chốt số liệu<\/mark>\n\nChiến dịch kết thúc theo một trong ba cách: người có quyền nhấn `Kết thúc sớm`; hệ thống tự kết thúc lúc 23:55 ngày kết thúc; hoặc chiến dịch bị xóa, lưu trữ trên Facebook\n\n<figure><img src=\"images/danh-sach-chien-dich-15.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td><code>Kết thúc sớm<\/code><\/td><td>Chỉ người phụ trách, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ. Hộp <strong>Kết thúc sớm chiến dịch?<\/strong> ghi: \"Lead, đơn và doanh thu sẽ được chốt tại thời điểm này; chi phí chốt lúc 06:00 ngày dd/mm/yyyy (ngày thứ 3 sau ngày kết thúc). Số đã chốt không đổi theo dữ liệu phát sinh sau. Không hoàn tác được.\" và số chốt dự kiến. Có đề nghị điều chỉnh đang chờ thì ghi thêm \"Đề nghị điều chỉnh đang chờ sẽ bị hủy.\"<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td><strong>Lý do kết thúc sớm<\/strong><\/td><td>Nhập lý do (không bắt buộc, tối đa 1.000 ký tự); lý do ghi vào lịch sử<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td><code>Kết thúc và chốt số<\/code><\/td><td>Hệ thống đồng bộ lại một lượt, tạm dừng quảng cáo trên Facebook, chốt lead, đơn, doanh thu, chuyển chiến dịch sang <strong>Đã kết thúc<\/strong>, khóa mọi trường và giao việc \"Lập đánh giá &lt;mã&gt;\" cho người phụ trách. Thông báo: \"Đã kết thúc &lt;mã&gt; và chốt số liệu.\" Màn chuyển sang tab <strong>Đã kết thúc<\/strong><\/td><\/tr>\n<tr><td><strong>Bước 4<\/strong><\/td><td>Xem chiến dịch đã kết thúc<\/td><td>Khung \"Số liệu đã chốt lúc kết thúc (dd/mm/yyyy)\" ghi cách kết thúc (sớm bởi ai, theo lịch, hoặc do bị xóa trên Facebook) và trạng thái đánh giá. Trước lượt chốt chi phí, thẻ chi phí ghi \"Chi phí chưa chốt (chốt ngày dd/mm/yyyy)\". Dòng danh sách có chip \"Chưa đánh giá\", \"Đánh giá nháp\" hoặc \"Đã đánh giá\" (ảnh dưới)<\/td><\/tr>\n<tr><td><strong>Bước 5<\/strong><\/td><td><code>Lập đánh giá<\/code> / <code>Mở đánh giá<\/code><\/td><td>Mở màn <a href=\"danh-gia-chien-dich.md\">Đánh giá chiến dịch<\/a> để lập hoặc xem đánh giá<\/td><\/tr>\n<\/tbody><\/table>\n\n<figure><img src=\"images/danh-sach-chien-dich-16.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### ⚠️ Lưu ý\n\n* Số liệu chốt **2 lượt**: lead, đơn, doanh thu chốt ngay lúc kết thúc; chi phí và số liệu Facebook (tiếp cận, hiển thị, nhấp) chốt lúc 06:00 ngày thứ 3 sau ngày kết thúc thực tế (ví dụ kết thúc 15/10 thì chốt chi phí 06:00 ngày 18/10)\n* Số đã chốt không đổi theo dữ liệu phát sinh sau; số phát sinh sau xem ở [Hiệu quả chiến dịch](../bao-cao-du-lieu/hieu-qua-chien-dich.md). Kết thúc không hoàn tác được\n* Chiến dịch đã duyệt nhưng chưa chạy mà qua ngày kết thúc cũng tự kết thúc và chốt số như trên\n* Không tạm dừng được trên Facebook thì hệ thống vẫn kết thúc và chốt số, hiện khung \"Chưa tạm dừng được trên Facebook: &lt;lỗi&gt;. Tắt chiến dịch trên Ads Manager.\" và giao việc cho người phụ trách\n* Chiến dịch Đã kết thúc vẫn tính vào hạn mức quý đã dùng\n\n## <mark style=\"color:green;\">Thông báo chung<\/mark>\n\n| Tình huống | Hệ thống báo |\n| --- | --- |\n| Người khác hoặc hệ thống vừa đổi trạng thái chiến dịch | \"Chiến dịch &lt;mã&gt; đã chuyển sang trạng thái &lt;trạng thái&gt; nên chưa thực hiện được thao tác này. Tải lại để xem.\" Dữ liệu đang nhập trong hộp thoại được giữ |\n| Lỗi tải dữ liệu | \"Không tải được dữ liệu\" và nút `Thử lại` |\n| Lỗi khi lưu | \"Chưa lưu được, vui lòng thử lại.\" |\n| Lỗi khi chuyển trạng thái | \"Chưa thực hiện được, vui lòng thử lại.\" |\n| Mở chiến dịch ngoài phạm vi | \"Bạn không có quyền xem chiến dịch này.\" |\n\nNgười lập và người phụ trách nhận thông báo trong ứng dụng khi: duyệt xong cấp 1, duyệt xong cấp 2 (kèm giờ tự chạy), bị yêu cầu chỉnh sửa, bị từ chối, đẩy lỗi, tự kết thúc\n\nXem thêm: [Vai trò và phân quyền](../bat-dau/vai-tro-va-phan-quyen.md), [Kế hoạch Marketing](../ke-hoach/ke-hoach-marketing.md), [Lịch triển khai](../ke-hoach/lich-trien-khai.md)\n", "chien-dich/danh-gia-chien-dich.md": "# Đánh giá chiến dịch\n\n🧭 Tổng quan chức năng: Nơi tổng kết từng chiến dịch đã kết thúc: so mục tiêu với số liệu đã chốt, ghi bài học và đề xuất cho lần sau, gắn \"Case mẫu\" để gợi ý khi lập đề xuất mới, xác nhận để khóa và xuất báo cáo tổng kết PDF. Người phụ trách chiến dịch lập và soạn; Trưởng nhóm của Đội chủ hoặc Trưởng/Phó phòng xác nhận\n\nTruy cập: menu **Chiến dịch → Quản lý chiến dịch → Chiến dịch**, chọn tab **Đánh giá sau chiến dịch**. Hoặc nhấn `Lập đánh giá` / `Mở đánh giá` ở chiến dịch đã kết thúc trong [Danh sách chiến dịch](danh-sach-chien-dich.md)\n\n{% hint style=\"info\" %}\n\n## QUY TRÌNH ĐÁNH GIÁ SAU CHIẾN DỊCH\n\nBước 1: **Chiến dịch kết thúc** (Hệ thống). Lead, đơn, doanh thu được chốt; hệ thống giao việc \"Lập đánh giá &lt;mã chiến dịch&gt;\" cho người phụ trách, hạn 7 ngày. Chi phí chốt lúc 06:00 ngày thứ 3 sau ngày kết thúc\n\nBước 2: **Lập đánh giá** (người phụ trách chiến dịch, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ). Nhấn `Lập đánh giá`. Đánh giá được tạo ở trạng thái **Nháp** với số liệu đã chốt\n\nBước 3: **Soạn và lưu nháp** (người lập, người phụ trách, Trưởng nhóm của Đội chủ, Trưởng/Phó phòng, BGĐ). Nhập Bài học rút ra, Đề xuất cho lần sau, đánh dấu Case mẫu nếu đáng dùng lại; nhấn `Lưu nháp`\n\nBước 4: **Gửi xác nhận** (cùng nhóm người ở bước 3), chỉ khi chiến dịch **đã chốt chi phí**. Đánh giá chuyển sang **Chờ xác nhận**, nội dung bị khóa\n\nBước 5: **Xác nhận** (Trưởng nhóm của Đội chủ; Trưởng/Phó phòng, BGĐ xác nhận thay; không phải người lập, người gửi xác nhận). Nhấn `Xác nhận đánh giá` → **Đã xác nhận**, khóa vĩnh viễn và lưu vào lịch sử chiến dịch. Hoặc nhấn `Yêu cầu bổ sung` kèm ý kiến → **Yêu cầu bổ sung**, người lập sửa và gửi xác nhận lại\n\nBước 6: **Xuất báo cáo tổng kết** (mọi người xem được đánh giá). Nhấn `Xuất PDF` ở đánh giá Đã xác nhận\n\n{% endhint %}\n\n## <mark style=\"color:green;\">1. Danh sách đánh giá<\/mark>\n\nMỗi dòng là một chiến dịch đã kết thúc bạn được xem, kèm trạng thái đánh giá của nó. Bên phải là chi tiết đánh giá đang chọn\n\n<figure><img src=\"images/danh-gia-chien-dich-1.png\" alt=\"\"><figcaption><\/figcaption><\/figure>\n\n### 📋 Cấu trúc giao diện\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Dòng đếm** | \"N chiến dịch đã kết thúc · M cần đánh giá · K chờ xác nhận\" (K là số đánh giá chờ chính bạn xác nhận) |\n| **Ô tìm** | Tìm theo mã đánh giá, mã và tên chiến dịch, kênh; không phân biệt hoa thường và dấu, tối đa 100 ký tự |\n| **Bộ lọc** | Trạng thái, Quá hạn đánh giá, Case mẫu, Kênh, Nhãn sản phẩm, Đội chủ, Kỳ kết thúc (từ ngày – đến ngày theo ngày kết thúc thực tế); chip **Đang lọc**, nút `Xóa bộ lọc` |\n| `Xuất Excel` | Tải danh sách đang xem ra tệp Excel |\n| **Nhóm \"Cần đánh giá · n\"** | Đứng trước, gồm dòng Chưa lập, Nháp, Yêu cầu bổ sung, Chờ xác nhận. Số cạnh tab **Đánh giá sau chiến dịch** là số dòng của nhóm này |\n| **Nhóm \"Đã đánh giá · n\"** | Đứng sau, gồm dòng Đã xác nhận |\n| **Dòng đánh giá** | Dòng 1: tên chiến dịch, chip trạng thái: **Chưa lập**, **Nháp**, **Chờ xác nhận**, **Yêu cầu bổ sung**, **Đã xác nhận**; chip **Quá hạn đánh giá** khi quá hạn. Dòng 2: mã đánh giá (\"Chưa lập\" khi chưa có), mã chiến dịch, kênh, chip **Case mẫu**. Dòng 3: \"ROAS x× · ROI y%\", \"Kết thúc dd/mm/yyyy\" |\n\n**Chi tiết đánh giá (cột phải)**\n\n| Khu vực | Mô tả |\n| --- | --- |\n| **Đầu chi tiết** | Tên chiến dịch; dòng \"mã đánh giá · chiến dịch &lt;mã&gt; · ngày bắt đầu – ngày kết thúc\"; các nút theo trạng thái: Nháp, Yêu cầu bổ sung có `Lưu nháp`, `Gửi xác nhận` (Nháp thêm menu **⋯** → `Xóa đánh giá`); Chờ xác nhận có `Yêu cầu bổ sung`, `Xác nhận đánh giá`; Đã xác nhận có `Xuất PDF` |\n| **Khung trạng thái** | \"Đánh giá đang ở trạng thái …\" và câu cho biết bạn làm được gì. Chưa chốt chi phí thì thêm \"Chi phí chưa chốt (chốt ngày dd/mm/yyyy)\". Ở Yêu cầu bổ sung có khung \"Yêu cầu bổ sung bởi &lt;người&gt; lúc &lt;thời điểm&gt;: &lt;ý kiến&gt;\" |\n| **Thẻ chỉ số** | 6 thẻ từ số chốt. Luôn có **Ngân sách duyệt** và **Chi phí thực** (kèm \"x% ngân sách\"). Bốn thẻ còn lại theo mục tiêu: Thu lead → Lead (kèm CPL), Đơn chốt (kèm doanh thu), ROAS, ROI; Bán hàng → Đơn chốt, ROAS, ROI, Lead; Kéo truy cập, Tương tác → Tiếp cận, Tần suất, Chi phí / 1.000 tiếp cận, ROI |\n| **Mục tiêu so với thực tế** | Bảng 4 dòng Lead, Doanh thu, Khách hàng tiếp cận, Ngân sách. Cột: Chỉ số, Mục tiêu, Thực tế (số chốt), Chênh lệch (= Thực tế − Mục tiêu), % đạt, Kết luận. Ghi chú \"Thực tế là số chốt lúc dd/mm/yyyy hh:mm\" |\n| **Bài học rút ra** | Ô nhập nhiều dòng, gợi ý \"Điều gì hiệu quả, điều gì không, kèm số liệu\" |\n| **Đề xuất cho lần sau** | Ô nhập nhiều dòng |\n| **Thẻ thông tin** | Chiến dịch (liên kết mở chiến dịch), ô **Gắn làm case mẫu**, người lập và thời điểm lập, người gửi xác nhận và thời điểm gửi, hạn đánh giá, người xác nhận |\n| **Lịch sử** | Thời điểm, Người thực hiện, Hành động (lập, lưu nháp, gửi xác nhận, yêu cầu bổ sung, xác nhận, xuất PDF); mới nhất trên đầu |\n\n### 🧭 Hướng dẫn sử dụng chi tiết\n\n<table><thead><tr><th width=\"90\">Bước<\/th><th>Thành phần / Thao tác<\/th><th>Mô tả chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Bước 1<\/strong><\/td><td>Mở tab<\/td><td>Ở màn Chiến dịch, nhấn tab <strong>Đánh giá sau chiến dịch<\/strong>. Hệ thống mở sẵn dòng đầu của nhóm Cần đánh giá<\/td><\/tr>\n<tr><td><strong>Bước 2<\/strong><\/td><td>Tìm, lọc<\/td><td>Nhập từ khóa hoặc chọn bộ lọc. Không có kết quả: \"Không có đánh giá nào khớp điều kiện.\"<\/td><\/tr>\n<tr><td><strong>Bước 3<\/strong><\/td><td>Chọn dòng<\/td><td>Dòng <strong>Chưa lập<\/strong>: cột phải hiện chiến dịch đã kết thúc với nút <code>Lập đánh giá<\/code> (mục 2). Dòng Nháp, Chờ xác nhận, Yêu cầu bổ sung: chi tiết đánh giá đang soạn. Dòng Đã xác nhận: chi tiết
