.todo{display:flex;align-items:center;gap:.625rem;padding:.625rem 1rem;border-bottom:1px solid var(--border-subtle)}
.todo:last-child{border-bottom:0}
.todo__m{flex:1;min-width:0}
tr[draggable="true"]{cursor:grab}
.is-drop{box-shadow:inset 0 2px 0 var(--interactive)}
.media{display:flex;flex-direction:column;gap:.25rem}
.calm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calm__h{padding:.375rem .5rem;font-size:.75rem;color:var(--text-secondary);background:var(--bg-subtle);border-bottom:1px solid var(--border)}
.calm__d{min-height:5.5rem;padding:.25rem .375rem;border-right:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);font-size:.75rem}
.calm__d.is-off{background:var(--bg-subtle)}
.calm__d.is-today{background:var(--bg-selected)}
.calm__i{margin-top:.25rem;padding:.25rem .375rem;border-radius:var(--radius-sm);background:var(--status-info-bg);line-height:1rem}
.calm__i.is-warn{background:var(--status-warning-bg)}
.calm__i.is-bad{background:var(--status-danger-bg)}
.sign-pad{display:block;width:100%;height:9rem;border:1px solid var(--border-control);border-radius:var(--radius-md);background:var(--bg-surface);touch-action:none;cursor:crosshair}
.doc-view{height:18rem;display:grid;place-items:center;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-secondary);text-align:center;padding:1rem}
.pick-row{display:flex;gap:.75rem;align-items:flex-start;padding:.625rem 0;border-bottom:1px solid var(--border-subtle)}
.pick-row>div{flex:1;min-width:0}
@media (max-width:1023px){.calm__d{min-height:3.5rem}}


/* Ảnh chụp cho URD: phần Claude tự bổ sung có nền vàng, chỉ bật khi mở với #mh=...&vang=1 */
.vang [data-moi]{background:#FFF176!important;outline:2px dashed #F9A825;outline-offset:2px;border-radius:4px}
body[data-shot] .toasts{display:none}

/* CSKH: biểu đồ cột, biểu tượng nền tảng. Chỉ dùng token của design system */
.cs-bars{display:flex;align-items:flex-end;gap:2px;height:8rem;border-bottom:1px solid var(--border)}
.cs-bars__c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.cs-bars__c i{display:block;background:var(--data-1);opacity:.55;border-radius:2px 2px 0 0}
.cs-bars__c i.is-max{opacity:1}
.cs-bars--stack .cs-bars__c i{opacity:1;border-radius:0}
.cs-bars--stack .cs-bars__c i:last-child{border-radius:2px 2px 0 0}
.cs-bars--stack .cs-bars__c{flex-direction:column-reverse;justify-content:flex-start}
.cs-bars__x{display:flex;gap:2px;margin-top:.25rem}
.cs-bars__x span{flex:1;min-width:0;text-align:center;font-size:.6875rem;color:var(--text-tertiary);overflow:hidden;white-space:nowrap}
.cs-bars__x span:nth-child(3n+2),.cs-bars__x span:nth-child(3n+3){visibility:hidden}
.cs-bars--all + .cs-bars__x span{visibility:visible!important}
.cs-nt{display:inline-grid;place-items:center;width:1rem;height:1rem;border-radius:var(--radius-xs);font-size:.625rem;font-weight:700;color:var(--text-on-color);flex:none;background:var(--blue-60)}
.cs-nt--zl{background:var(--blue-40)}
.cs-nt--tt{background:var(--gray-90)}
.cs-ch{display:inline-flex;align-items:center;gap:.375rem}
.kpi-mini .cell b.overdue{color:var(--status-danger-fg)}
.kpi-mini.cs-k2{grid-template-columns:repeat(2,1fr)}
.kpi-mini.cs-k3{grid-template-columns:repeat(3,1fr)}

/* CS-URD-02 Hộp thư: bốn vùng toàn trang. Chỉ dùng token của design system */
.cs-inbox{display:grid;grid-template-columns:10rem 18rem minmax(0,1fr) 18rem;height:calc(100vh - 3rem);margin:-1rem -1.5rem -2.5rem;background:var(--bg-surface);border-top:1px solid var(--border-subtle)}
.cs-inbox.is-exp{grid-template-columns:minmax(0,1fr)}
.cs-col{min-height:0;min-width:0;overflow:auto;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column}
.cs-col:last-child{border-right:0}
.cs-cap{font-size:.6875rem;line-height:1rem;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em;padding:.5rem .75rem .25rem}
.cs-views{background:var(--bg-subtle);padding:.25rem 0 .75rem}
.cs-vi{display:flex;align-items:center;gap:.25rem;width:100%;padding:.375rem .75rem;border:0;background:none;text-align:left;cursor:pointer;color:var(--text-primary);line-height:1rem}
.cs-vi:hover{background:var(--bg-hover)}
.cs-vi[aria-current="true"]{background:var(--bg-selected);font-weight:500;box-shadow:inset 3px 0 0 var(--interactive)}
.cs-vi small{margin-left:auto;color:var(--text-tertiary);font-variant-numeric:tabular-nums;font-size:.75rem}
.cs-pg__g{display:flex;align-items:center;gap:.375rem;padding:.375rem .75rem .125rem;font-weight:500}
.cs-pg{padding:.125rem .75rem .125rem 1.25rem;font-size:.75rem;line-height:1rem}
.cs-tabs{padding:0 .5rem;flex:none}
.cs-tabs [role="tab"]{padding:0 .5rem;white-space:nowrap}
.cs-list__h{padding:.5rem;border-bottom:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:.5rem;flex:none}
.cs-list__h .input-wrap{flex:1;min-width:0}
.cs-list__h .select{flex:1;min-width:0}
.cs-list__b{flex:1;overflow:auto}
.cs-adv{display:flex;flex-direction:column;gap:.375rem;padding:.5rem;background:var(--bg-subtle);border-radius:var(--radius-md)}
.cs-adv .row .select{flex:1;min-width:0}
.cs-li{display:flex;flex-direction:column;gap:.25rem;width:100%;padding:.5rem .75rem;border:0;border-bottom:1px solid var(--border-subtle);background:none;text-align:left;cursor:pointer;color:var(--text-primary)}
.cs-li:hover{background:var(--bg-hover)}
.cs-li[aria-selected="true"]{background:var(--bg-selected)}
.cs-li.is-sla-warn{box-shadow:inset 3px 0 0 var(--status-warning-solid)}
.cs-li.is-sla-bad{box-shadow:inset 3px 0 0 var(--status-danger-solid)}
.cs-li__h{display:flex;align-items:center;gap:.5rem;min-width:0}
.cs-li__h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-li__t{font-size:.75rem;color:var(--text-tertiary);flex:none}
.cs-li__m{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:2rem}
.cs-li__f{display:flex;align-items:center;gap:.375rem;font-size:.75rem;padding-left:2rem;min-width:0}
.cs-li__f > span:not(.tag):not(.badge):not(.cs-nt){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-more{padding:.75rem;text-align:center}
.cs-chat{background:var(--bg-page)}
.cs-chat__h{background:var(--bg-surface);padding:.5rem .75rem;border-bottom:1px solid var(--border-subtle);flex:none;display:flex;flex-direction:column;gap:.375rem}
.cs-chat__n{display:flex;flex-direction:column;min-width:0;line-height:1.125rem}
.cs-chat__n small{display:flex;align-items:center;gap:.25rem;color:var(--text-tertiary);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-acts{gap:.25rem}
.cs-menu{max-height:18rem;overflow:auto}
.cs-menu .chk{pointer-events:none}
.cs-post{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between;padding:.5rem .625rem;background:var(--bg-subtle);border-radius:var(--radius-md);font-size:.75rem;line-height:1rem}
.cs-post__t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cs-thread{flex:1;min-height:0;overflow:auto;padding:.75rem 1rem;display:flex;flex-direction:column;gap:.5rem}
.cs-msg{max-width:78%;align-self:flex-start;display:flex;flex-direction:column}
.cs-msg__b{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:.5rem .75rem;line-height:1.25rem}
.cs-msg--me{align-self:flex-end;align-items:flex-end}
.cs-msg--me .cs-msg__b{background:var(--brand-10);border-color:var(--brand-20)}
.cs-msg--bot .cs-msg__b{background:var(--status-info-bg);border-color:var(--blue-20)}
.cs-msg__m{display:flex;gap:.5rem;font-size:.6875rem;line-height:1rem;color:var(--text-tertiary);margin-top:.125rem}
.cs-msg__m .lnk{font-size:.6875rem}
.cs-msg mark{background:var(--status-warning-bg);color:inherit}
.cs-quote{border-left:2px solid var(--border-control);padding-left:.5rem;margin-bottom:.25rem;color:var(--text-tertiary);font-size:.75rem}
.cs-quote--c{display:flex;align-items:center;justify-content:space-between;background:var(--bg-subtle);border-radius:var(--radius-sm);padding:.125rem .25rem .125rem .5rem;margin:0 0 .375rem}
.cs-ev{align-self:center;font-size:.75rem;line-height:1rem;color:var(--text-tertiary);background:var(--bg-active);border-radius:var(--radius-pill);padding:.125rem .625rem}
.cs-att{display:inline-flex;align-items:center;gap:.25rem;color:var(--text-link)}
.cs-comp{background:var(--bg-surface);border-top:1px solid var(--border-subtle);padding:.5rem .75rem;flex:none;display:flex;flex-direction:column;gap:.375rem}
.cs-qr{display:flex;align-items:center;gap:.375rem;flex-wrap:wrap}
.cs-ta{min-height:3.5rem}
.cs-comp__f{gap:.25rem}
.cs-loai select.input{height:var(--control-h-sm);font-size:.75rem;width:auto}
.cs-info{background:var(--bg-surface)}
.cs-info__h{display:flex;align-items:center;gap:.5rem;padding:.75rem .75rem .5rem}
.cs-qas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.25rem;padding:0 .5rem .5rem}
.cs-qa{display:flex;flex-direction:column;align-items:center;gap:.125rem;width:100%;padding:.25rem 0;border:0;background:none;cursor:pointer;color:var(--text-secondary);font-size:.6875rem;line-height:.875rem;text-align:center;border-radius:var(--radius-md)}
.cs-qa:hover{background:var(--bg-hover)}
.cs-qa:disabled{color:var(--text-disabled);cursor:not-allowed}
.cs-qa__i{display:grid;place-items:center;width:2rem;height:2rem;border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary)}
.cs-qa:disabled .cs-qa__i{color:var(--text-disabled)}
.cs-qas .dd .menu{right:auto;left:-4rem}
.cs-sec{padding:.5rem .75rem;border-bottom:1px solid var(--border-subtle)}
.cs-sec .cs-cap{padding:0 0 .25rem}
.cs-dl{grid-template-columns:4.5rem 1fr;gap:.25rem .5rem;font-size:.8125rem}
.cs-dl dd{min-width:0;overflow-wrap:anywhere}
.cs-ai{margin-top:.25rem;padding:.375rem .5rem;background:var(--bg-subtle);border-radius:var(--radius-sm);line-height:1.125rem}
.cs-sec .lnk{font-size:.8125rem}
.cs-sec .lnk:disabled{color:var(--text-disabled);cursor:not-allowed;text-decoration:none}
.cs-chat__h > .row:first-child .cs-chat__n{flex:0 1 auto}
.cs-chat__h .dd .menu{z-index:40}

/* CS-URD-03 Bài viết: dòng bài có ảnh thu nhỏ. Chỉ dùng token của design system */
.bv-post{display:flex;gap:.625rem;align-items:flex-start;min-width:22rem;max-width:34rem}
.bv-thumb{width:3.5rem;height:3.5rem;flex:none}
.bv-post__b{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.bv-post__t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text-primary);font-weight:500}

/* CS-URD-06 Kết nối kênh: chỉ dùng token của design system */
.c06-card .card__h .hint{flex:none}
.c06-dl{grid-template-columns:9rem 1fr;gap:.25rem 1rem}
.c06-add{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:10rem;border:1px dashed var(--border-control);border-radius:var(--radius-card);background:var(--bg-surface);color:var(--interactive-text);font:inherit;font-weight:700;cursor:pointer}
.c06-add:hover{background:var(--bg-hover);border-color:var(--interactive)}
.c06-nt{display:flex;flex-direction:column;align-items:center;gap:.375rem;padding:1rem .75rem;border:1px solid var(--border);border-radius:var(--radius-md);text-align:center;cursor:pointer;position:relative}
.c06-nt input{position:absolute;opacity:0;pointer-events:none}
.c06-nt small{color:var(--text-tertiary);font-size:.75rem;line-height:1rem}
.c06-nt:hover{background:var(--bg-hover)}
.c06-nt:has(input:checked){border-color:var(--interactive);background:var(--bg-selected);box-shadow:inset 0 0 0 1px var(--interactive)}
.c06-nt.is-off{cursor:not-allowed;background:var(--bg-subtle);color:var(--text-tertiary)}
.c06-lnk{display:inline-flex;align-items:center;gap:.25rem}

/* CS-URD-07 Mục tiêu phản hồi (SLA) */
.modal.c07-modal{top:3vh;max-height:94vh;width:min(56rem,calc(100vw - 2rem))}
.c07-sec{padding:.625rem 0;border-top:1px solid var(--border-subtle)}
.c07-sec:first-child{border-top:0;padding-top:0}
.c07-sec h4{margin:0 0 .5rem;font-size:.8125rem;line-height:1.25rem;font-weight:700;color:var(--text-primary)}
.c07-g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem 1rem}
.c07-g4{grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem 1rem}
.c07-chips{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap;height:auto;min-height:var(--control-h);padding:.1875rem .375rem}
.c07-chips .tag button{border:0;background:none;padding:0;display:inline-grid;cursor:pointer;color:inherit}
.c07-ls{margin:0;padding-left:1rem;line-height:1.5rem;color:var(--text-secondary);font-size:.8125rem}
.c07-ls .ic{vertical-align:-2px}

/* CS-URD-08 Danh mục cấu hình CSKH */
.tbl tr.c08-grp td{background:var(--bg-subtle);font-weight:700;font-size:.75rem;color:var(--text-secondary);height:1.75rem}
.c08-chips{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap;height:auto;min-height:var(--control-h);padding:.1875rem .375rem}
.c08-chips .tag button{border:0;background:none;padding:0;display:inline-grid;cursor:pointer;color:inherit}
.modal.c08-modal{top:3vh;max-height:94vh;width:min(60rem,calc(100vw - 2rem))}
.c08-split{display:grid;grid-template-columns:minmax(0,1fr) 18rem;gap:1.25rem;align-items:start}
.c08-msg{position:relative;padding:.75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-subtle);gap:.5rem}
.c08-prev{background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.75rem}
.c08-chat{margin-top:.5rem;display:flex;flex-direction:column;align-items:flex-start;gap:.375rem}
.c08-bub{max-width:100%;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:.5rem .75rem;line-height:1.25rem;white-space:pre-wrap}
.c08-btns{display:flex;flex-direction:column;gap:.25rem;width:100%}
.c08-btns span{display:block;text-align:center;padding:.375rem;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-surface);color:var(--interactive-text);font-weight:500}
.c08-var{grid-template-columns:7rem 1fr;font-size:.75rem}
.c08-var dt{font-family:var(--font-mono)}
.c08-varmenu{position:absolute;right:.75rem;bottom:2.5rem;z-index:5}

/* CS-URD-10 đến CS-URD-13: trình dựng luồng, khung chat, xem trước Messenger. Chỉ dùng token của design system */
.trl-side{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:1rem;align-items:start;margin-top:.75rem}
.trl-nav{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:.25rem 0}
.trl-nav .menu__i[aria-current="true"]{background:var(--bg-selected);font-weight:500;box-shadow:inset .1875rem 0 0 var(--interactive)}
.trl-nav .menu__i small{margin-left:auto;color:var(--text-tertiary);font-size:.75rem}
.trl-nav .menu__lbl{padding-top:.5rem;text-transform:uppercase;letter-spacing:.02em}
.trl-nav .menu__i.is-sub{padding-left:1.5rem}
.trl-pop{position:fixed;z-index:70}
.trl-ibtn{border:0;background:none;width:1.75rem;height:1.75rem;border-radius:var(--radius-sm);display:inline-grid;place-items:center;cursor:pointer;color:var(--text-secondary)}
.trl-ibtn:hover{background:var(--bg-hover);color:var(--text-primary)}
.trl-ibtn.is-on{color:var(--status-warning-solid)}
.trl-star{font-size:1rem;line-height:1;color:var(--text-disabled)}
.trl-star.is-on{color:var(--status-warning-solid)}
.trl-tb{display:flex;align-items:center;gap:.375rem;flex-wrap:wrap;padding:.5rem .625rem;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card) var(--radius-card) 0 0;border-bottom:0}
.trl-tb .sep{width:1px;height:1.25rem;background:var(--border);margin:0 .25rem}
/* Trình dựng luồng */
.trl-cv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1rem;align-items:start;margin-top:.75rem}
.trl-cv{position:relative;min-height:30rem;overflow:auto;border:1px solid var(--border-subtle);border-radius:0 0 var(--radius-card) var(--radius-card);
  background-color:var(--bg-subtle);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:1rem 1rem}
.trl-cv__in{position:relative;width:56rem;min-height:30rem}
.trl-cv__svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trl-cv__svg path{fill:none;stroke:var(--text-tertiary);stroke-width:1.5}
.trl-cv__svg path.is-tmp{stroke:var(--interactive);stroke-dasharray:4 3}
.trl-cv__svg marker path{fill:var(--text-tertiary);stroke:none}
.trl-cv__lbl{position:absolute;transform:translate(-50%,-50%);padding:0 .375rem;height:1.125rem;line-height:1.125rem;font-size:.6875rem;border-radius:var(--radius-pill);
  background:var(--bg-surface);border:1px solid var(--border);color:var(--text-secondary);white-space:nowrap;pointer-events:none}
.trl-nd{position:absolute;width:13rem;background:var(--bg-surface);border:1px solid var(--border);border-left:3px solid var(--k,var(--data-1));border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);padding:.4375rem .625rem .625rem;cursor:grab;user-select:none;font-size:.75rem;line-height:1rem}
.trl-nd:hover{border-color:var(--border-control);border-left-color:var(--k,var(--data-1))}
.trl-nd.is-sel{box-shadow:0 0 0 2px var(--focus)}
.trl-nd.is-drag{cursor:grabbing;opacity:.92}
.trl-nd__h{display:flex;align-items:center;gap:.375rem;font-weight:500;color:var(--text-primary)}
.trl-nd__h .ic{color:var(--k,var(--data-1))}
.trl-nd__b{margin-top:.25rem;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.trl-nd__q{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.375rem}
.trl-nd__q span{padding:0 .375rem;border:1px solid var(--border);border-radius:var(--radius-pill);font-size:.6875rem;color:var(--text-secondary);background:var(--bg-subtle)}
.trl-nd__st{position:absolute;top:-.75rem;left:.5rem;height:1.25rem;padding:0 .5rem;border-radius:var(--radius-pill);font-size:.6875rem;line-height:1.25rem;font-weight:500;
  background:var(--interactive);color:var(--text-on-brand)}
.trl-nd__port{position:absolute;left:50%;bottom:-.4375rem;width:.875rem;height:.875rem;margin-left:-.4375rem;border-radius:50%;background:var(--bg-surface);
  border:2px solid var(--text-tertiary);cursor:crosshair}
.trl-nd__port:hover{border-color:var(--interactive);background:var(--bg-selected)}
.trl-nd.is-orphan{border-style:dashed;border-left-style:solid}
.trl-cv-panel .card__b{display:flex;flex-direction:column;gap:.75rem}
.trl-cv-edges{display:flex;flex-direction:column;gap:.25rem}
.trl-cv-edges div{display:flex;align-items:center;gap:.375rem;font-size:.75rem}
.trl-cv-edges div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Khung chat */
.trl-chat{display:flex;flex-direction:column;gap:.5rem;padding:.75rem;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  height:20rem;overflow:auto}
.trl-bub{max-width:82%;padding:.4375rem .75rem;border-radius:1rem;background:var(--bg-surface);border:1px solid var(--border-subtle);line-height:1.25rem;color:var(--text-primary);align-self:flex-start}
.trl-bub--me{align-self:flex-end;background:var(--interactive);border-color:var(--interactive);color:var(--text-on-brand)}
.trl-bub--ev{align-self:center;background:none;border:0;padding:0;font-size:.75rem;color:var(--text-tertiary)}
.trl-bub--wait{color:var(--text-tertiary);font-style:italic}
.trl-bub-qr{display:flex;gap:.375rem;flex-wrap:wrap;align-self:flex-start}
.trl-bub-img{align-self:flex-end;width:6rem;height:4.5rem;border-radius:var(--radius-md);background:var(--bg-active);display:grid;place-items:center;font-size:.6875rem;color:var(--text-secondary)}
.trl-chat-in{display:flex;gap:.375rem;margin-top:.5rem}
.trl-chat-in .input{flex:1}
/* Xem trước Messenger */
.trl-msgr{border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;background:var(--bg-surface)}
.trl-msgr__h{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-bottom:1px solid var(--border-subtle);font-weight:500}
.trl-msgr__b{display:flex;flex-direction:column;gap:.5rem;padding:.75rem;min-height:16rem;background:var(--bg-subtle)}
.trl-msgr__q{align-self:flex-end;padding:.375rem .75rem;border:1px solid var(--status-info-solid);color:var(--status-info-fg);border-radius:1rem;background:var(--bg-surface);font-size:.75rem}
.trl-msgr__card{width:11rem;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-surface);overflow:hidden;font-size:.75rem}
.trl-msgr__card div{height:4rem;background:var(--bg-active)}
.trl-msgr__card b{display:block;padding:.375rem .5rem;font-weight:500}
.trl-msgr__btn{display:block;width:100%;padding:.375rem;border:0;border-top:1px solid var(--border-subtle);background:none;color:var(--text-link);font-size:.75rem}
/* Hàng công tắc */
.trl-sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 2rem}
.trl-sw-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:2.75rem;border-bottom:1px solid var(--border-subtle)}
.trl-sw-row .sw{flex:none}
.trl-sw-row > span{color:var(--text-primary)}
.trl-sw-row small{display:block;color:var(--text-tertiary);font-size:.75rem;line-height:1rem}
.trl-blk{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.75rem;background:var(--bg-surface)}
.trl-blk + .trl-blk{margin-top:.75rem}
.trl-blk__h{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;font-weight:500}
.trl-grip{color:var(--text-tertiary);cursor:grab;letter-spacing:-.15em}
.trl-kv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border-subtle);border-radius:var(--radius-md)}
.trl-kv-grid > div{padding:.625rem .875rem;border-left:1px solid var(--border-subtle);border-top:1px solid var(--border-subtle)}
.trl-kv-grid > div:nth-child(3n+1){border-left:0}
.trl-kv-grid > div:nth-child(-n+3){border-top:0}
.trl-kv-grid b{display:block;font-size:1.25rem;line-height:1.75rem;font-variant-numeric:tabular-nums}
.trl-kv-grid span{font-size:.75rem;color:var(--text-tertiary)}
.trl-aicards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1rem}
.trl-aicard{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.trl-aicard:hover{border-color:var(--border-control)}
.trl-aicard .dl{grid-template-columns:4rem 1fr;margin-top:.5rem}
.trl-cnt-warn{color:var(--status-warning-fg)}
@media (max-width:1023px){.trl-side,.trl-cv-wrap{grid-template-columns:minmax(0,1fr)}.trl-aicards{grid-template-columns:1fr}.trl-sw-grid{grid-template-columns:1fr}}
.trl-dis{position:relative;display:inline-flex}
.trl-dis > .hint{position:absolute;top:calc(100% + 2px);right:0;white-space:nowrap}

/* CS-URD-14 Chăm sóc sau bán */
.c14-dl{grid-template-columns:9.5rem 1fr}
.tbl.c14-bac td{padding-top:.25rem;padding-bottom:.25rem}
.tbl.c14-bac .input{height:var(--control-h-sm)}

/* CS-URD-15 Khảo sát hài lòng */
.c15-star{white-space:nowrap;letter-spacing:.0625rem;font-size:.875rem}
.c15-star b{color:var(--status-warning-solid);font-weight:400}
.c15-star i{color:var(--border-control);font-style:normal}
.c15-chips{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap;height:auto;min-height:var(--control-h);padding:.1875rem .375rem}
.c15-chips .tag button{border:0;background:none;padding:0;display:inline-grid;cursor:pointer;color:inherit}
.c15-phone{max-width:22rem;margin:0 auto;padding:.75rem;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:.5rem}
.c15-b{align-self:flex-start;max-width:85%;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:.5rem .75rem;line-height:1.25rem}
.c15-b--me{align-self:flex-end;background:var(--bg-selected);border-color:transparent}
.c15-qr{display:flex;flex-wrap:wrap;gap:.25rem}
.c15-qr span{padding:.25rem .625rem;border:1px solid var(--interactive);border-radius:var(--radius-pill);background:var(--bg-surface);color:var(--interactive-text);font-size:.75rem;line-height:1rem}

/* CS-URD-16 Khiếu nại */
.c16-dl{grid-template-columns:11rem 1fr}

<script>
/* ---------- tiện ích ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('vi-VN');
const fmt1=n=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:1,minimumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const NOW=new Date(2026,10,3,15,30), TODAY=new Date(2026,10,3);
const mkD=(d,m,y=2026,h=8,mi=0)=>new Date(y,m-1,d,h,mi);
const fD=d=>d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:'-';
const fDT=d=>d?`${fD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'-';
const fT=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes());
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate(),d.getHours(),d.getMinutes());
const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const diffMin=(a,b)=>Math.round((a-b)/60000);
const diffDay=(a,b)=>Math.round((dayStart(a)-dayStart(b))/864e5);
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function dur(m){m=Math.max(0,Math.round(m));if(m<60)return m+' phút';const h=Math.floor(m/60);if(h<24)return h+' giờ'+(m%60?' '+(m%60)+' phút':'');const d=Math.floor(h/24);return d+' ngày'+(h%24?' '+(h%24)+' giờ':'')}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const has=(hay,q)=>norm(hay).includes(norm(q));
const initials=n=>{const p=String(n).trim().split(/\s+/);return (p[p.length-2]||'')[0]+(p[p.length-1]||'')[0]};
const avatar=(n,c='')=>{const k=['avatar--a','avatar--b','avatar--c',''];let h=0;for(const ch of String(n))h+=ch.charCodeAt(0);return `<span class="avatar ${c||k[h%4]}" aria-hidden="true">${esc(initials(n).toUpperCase())}</span>`};
const userCell=n=>n?`<span class="cell-user">${avatar(n)}<span>${esc(n)}</span></span>`:'<span class="muted">-</span>';
const tag=(t,k='')=>`<span class="tag ${k?'tag--'+k:''}">${esc(t)}</span>`;
const dash='<span class="muted">-</span>';
function hashStr(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
let _rnd=20261103;const rnd=()=>{_rnd=(_rnd*1664525+1013904223)>>>0;return _rnd/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];


/* ---------- toast, modal, drawer ---------- */
function toast(msg,kind='success',undo){const b=$('#toasts');const el=document.createElement('div');el.className='toast toast--'+kind;
  const n=kind==='error'?'err':kind==='info'?'info':'ok';
  el.innerHTML=`${ic(n)}<div class="toast__m">${esc(msg)}</div>${undo?'<button class="toast__a">Hoàn tác</button>':''}<button class="toast__x" aria-label="Đóng">${ic('x','ic--sm')}</button>`;
  while(b.children.length>=3)b.firstChild.remove();b.appendChild(el);const rm=()=>el.remove();el.querySelector('.toast__x').onclick=rm;
  if(undo)el.querySelector('.toast__a').onclick=()=>{undo();rm();render()};
  if(kind!=='error')setTimeout(rm,undo?8000:5000)}
let _overlay=null;
function closeOverlay(){if(_overlay){_overlay.remove();_overlay=null}}
function modal({title,body,foot,size=''}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="modal__b">${body}</div>${foot?`<div class="modal__f">${foot}</div>`:''}</div>`;document.body.appendChild(w);_overlay=w;const f=w.querySelector('input,select,textarea');if(f)f.focus()}
function drawer({title,body,foot}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="drawer__b">${body}</div>${foot?`<div class="drawer__f">${foot}</div>`:''}</aside>`;document.body.appendChild(w);_overlay=w}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function fieldErr(id,msg){const e=document.getElementById(id);if(!e)return;e.setAttribute('aria-invalid','true');const w=e.closest('.field');if(w&&!w.querySelector('.field__err')){const d=document.createElement('div');d.className='field__err';d.innerHTML=ic('err')+`<span>${esc(msg)}</span>`;w.appendChild(d)}e.focus()}
const selectBox=(id,opts,cur='',attrs='')=>`<div class="select"><select class="input" id="${id}" ${attrs}>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSel=(key,opts,cur,label)=>`<div class="select"><select class="input" data-f="${key}" aria-label="${esc(label)}">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSearch=(key,cur,ph)=>`<div class="input-wrap">${ic('search')}<input class="input" id="s-${key.replace('.','-')}" data-f="${key}" value="${esc(cur)}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></div>`;
const seg=(key,opts,cur,label)=>`<div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v,l])=>`<button data-a="setF" data-k="${key}" data-v="${v}" aria-pressed="${v===cur}">${esc(l)}</button>`).join('')}</div>`;
const sw=(a,on,label,x='')=>`<button class="sw" role="switch" aria-checked="${!!on}" data-a="${a}" data-x="${esc(x)}"><span class="sw__t"></span><span>${esc(label)}</span></button>`;
const crumbs=(arr)=>`<nav class="crumbs" aria-label="Đường dẫn">${arr.map((c,i)=>i<arr.length-1?`<a href="#" data-a="go" data-x="${c[1]}">${esc(c[0])}</a>${ic('chev-right')}`:`<span aria-current="page">${esc(c[0])}</span>`).join('')}</nav>`;
const pagehead=(cr,title,actions='',sub='')=>`<div class="pagehead"><div class="pagehead__l">${cr?crumbs(cr):''}<h1>${title}</h1>${sub?`<div class="hint">${sub}</div>`:''}</div>${actions?`<div class="row">${actions}</div>`:''}</div>`;
const emptyState=(t,d,btn='')=>`<div class="state"><span class="state__ic">${ic('search')}</span><h4>${esc(t)}</h4><p>${esc(d)}</p>${btn?`<div class="row">${btn}</div>`:''}</div>`;
const logs=[];
function addLog(fn,op,before,after){logs.unshift({t:new Date(NOW.getTime()+logs.length*0),who:me(),fn,op,before,after})}

/* ---------- khung chung: trạng thái, thanh ứng dụng, điều hướng, sự kiện ----------
   File phân hệ khai: APP, ROLES, NAV, VIEWS.<route>, ACT.<thao tác>, Object.assign(S,{...}), MH(...)
   Xem _congcu/proto/HUONG_DAN_PROTOTYPE.md */
const S={role:null,route:null,arg:null,openNav:null,userOpen:false};
const VIEWS={}, ACT={}, MHS={};
let APP={key:'',name:'',search:'Tìm kiếm'}, ROLES={}, NAV=[];
function can(r){return !r||r.split(' ').includes(S.role)}
const me=()=>ROLES[S.role].u;
function canRoute(r){for(const g of NAV){if(g.r===r)return can(g.ro);if(g.items)for(const i of g.items)if(i[0]===r)return can(i[2])}return true}
function navGroupOf(r){return NAV.find(g=>g.r===r||(g.items&&g.items.some(i=>i[0]===r)))}
function getPath(k){return k.split('.').reduce((o,p)=>o==null?o:o[p],S)}
function setPath(k,v){const p=k.split('.');let o=S;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=v;if(o.page!==undefined&&p[p.length-1]!=='page')o.page=1}

  const it=g.items.filter(i=>can(i[2]));if(!it.length||(g.ro&&!can(g.ro)))return'';
  if(g.items.length===1)return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="go" data-x="${it[0][0]}" aria-current="${cur===g}">${esc(g.t)}</button></div>`;
  return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="toggleNav" data-x="${esc(g.t)}" aria-haspopup="menu" aria-expanded="${S.openNav===g.t}" aria-current="${cur===g}">${esc(g.t)}${ic('chev-down','ic--sm')}</button>${S.openNav===g.t?`<div class="menu navmenu" role="menu">${it.map(i=>`<button class="menu__i" role="menuitem" data-a="go" data-x="${i[0]}" aria-current="${S.route===i[0]?'page':'false'}">${esc(i[1])}</button>`).join('')}</div>`:''}</div>`}).join('')}</nav><span class="spacer"></span>
 <div class="appbar__search" style="max-width:15rem">${ic('search')}<input id="global-q" placeholder="${esc(APP.search)}" aria-label="${esc(APP.search)}"></div>
 <button class="appbar__ib" data-a="openBell" aria-label="Thông báo">${ic('bell')}${APP.bell?`<span class="badge">${APP.bell}</span>`:''}</button>
 <div class="dd" style="display:flex"><button class="appbar__mod" data-a="toggleUser" aria-haspopup="menu" aria-expanded="${S.userOpen}">${avatar(R.u,'avatar--a')}<span>${esc(R.n)}</span>${ic('chev-down','ic--sm')}</button>${S.userOpen?`<div class="menu" role="menu" style="color:var(--text-primary)"><div class="menu__lbl">Xem theo vai trò</div>${Object.entries(ROLES).map(([k,x])=>`<button class="menu__i" role="menuitem" data-a="setRole" data-x="${k}">${k===S.role?ic('check'):'<span style="width:1rem"></span>'}<span class="cell-2"><span>${esc(x.n)}</span><small class="hint">${esc(x.u)}</small></span></button>`).join('')}</div>`:''}</div>`}
function denied(){return `<div class="card"><div class="perm"><span class="perm__ic">${ic('lock')}</span><h4 style="margin:0">Bạn chưa có quyền xem màn hình này</h4><p>Liên hệ Quản trị hệ thống để được cấp quyền</p><div class="row"><button class="btn btn--primary" data-a="go" data-x="${ROLES[S.role].home}">Về trang đầu</button></div></div></div>`}
function render(keep){const f=document.activeElement;const fid=f&&f.id,caret=f&&f.selectionStart;const scroll=window.scrollY;
 $('#appbar').innerHTML=vAppbar();const fn=VIEWS[S.route];
 $('#view').className='page'+((APP.full||[]).includes(S.route)?' page--full':'');
 $('#view').innerHTML=!fn?emptyState('Chưa có màn hình','Màn hình này chưa dựng'):(canRoute(S.route)?fn():denied());
 if(fid){const e=document.getElementById(fid);if(e&&e.focus){e.focus();try{if(caret!=null&&e.setSelectionRange)e.setSelectionRange(caret,caret)}catch(x){}}}
 if(keep)window.scrollTo(0,scroll);else window.scrollTo(0,0);
 if(!document.body.dataset.shot){try{history.replaceState(null,'','#/'+S.route+(S.arg?'/'+S.arg:''))}catch(x){}}}
function go(r,arg=null){S.route=r;S.arg=arg;S.openNav=null;S.userOpen=false;closeOverlay();render()}

 go(x){go(x)},closeOverlay(){closeOverlay()},
 setF(_,el){setPath(el.dataset.k,el.dataset.v);render(true)},
 toggleNav(x){S.openNav=S.openNav===x?null:x;S.userOpen=false;$('#appbar').innerHTML=vAppbar()},
 toggleUser(){S.userOpen=!S.userOpen;S.openNav=null;$('#appbar').innerHTML=vAppbar()},
 setRole(x){S.role=x;S.userOpen=false;go(canRoute(S.route)?S.route:ROLES[x].home);toast('Đang xem theo vai trò '+ROLES[x].n,'info')},
 openBell(){toast('Không có thông báo mới','info')}
});

function MH(doc,mh,o){MHS[doc+'/'+mh]=o}
function openMH(key){const o=MHS[key];if(!o)return false;if(o.role&&ROLES[o.role])S.role=o.role;S.route=o.r;S.arg=o.arg||null;
 if(o.state)for(const k in o.state)setPath(k,o.state[k]);render();if(o.run)o.run();return true}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');
 if(!el){if(S.openNav||S.userOpen){S.openNav=null;S.userOpen=false;$('#appbar').innerHTML=vAppbar()}return}
 if(el.tagName==='A')e.preventDefault();if(el.disabled||el.getAttribute('aria-disabled')==='true')return;const fn=ACT[el.dataset.a];if(fn)fn(el.dataset.x,el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(_overlay)closeOverlay();else if(S.openNav||S.userOpen){S.openNav=null;S.userOpen=false;$('#appbar').innerHTML=vAppbar()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click()}});
let _tIn=null;
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&el.tagName==='INPUT'&&el.type!=='date'){setPath(el.dataset.f,el.value);clearTimeout(_tIn);_tIn=setTimeout(()=>render(true),250)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.f&&(el.tagName==='SELECT'||el.type==='date'||el.type==='checkbox')){setPath(el.dataset.f,el.type==='checkbox'?el.checked:el.value);render(true)}});
function boot(){
 if(!S.role)S.role=Object.keys(ROLES)[0];
 const h=decodeURIComponent(location.hash.slice(1));
 if(h.startsWith('mh=')){const[k,...rest]=h.slice(3).split('&');document.body.dataset.shot='1';if(rest.includes('vang=1'))document.body.classList.add('vang');if(openMH(k))return}
 const hs=h.replace(/^\//,'').split('/');if(hs[0]&&VIEWS[hs[0]]){S.route=hs[0];S.arg=hs[1]||null}else S.route=ROLES[S.role].home;
 render()}

const csBars=(vals,labels,hiMax=true)=>{const mx=Math.max(1,...vals);return `<div class="cs-bars" role="img" aria-label="Biểu đồ cột">${vals.map((v,i)=>`<div class="cs-bars__c" title="${esc(labels[i])}: ${fmt(v)}"><i class="${hiMax&&v===mx?'is-max':''}" style="height:${Math.max(2,Math.round(v/mx*100))}%"></i></div>`).join('')}</div><div class="cs-bars__x">${labels.map(l=>`<span>${esc(l)}</span>`).join('')}</div>`};
const csStack=(rows,keys,cols)=>{const mx=Math.max(...rows.map(r=>keys.reduce((s,k)=>s+r[k],0)));return `<div class="cs-bars cs-bars--stack" role="img" aria-label="Biểu đồ cột chồng">${rows.map(r=>`<div class="cs-bars__c" title="${esc(r.d)}">${keys.map((k,i)=>`<i style="height:${Math.round(r[k]/mx*100)}%;background:var(${cols[i]})"></i>`).join('')}</div>`).join('')}</div><div class="cs-bars__x">${rows.map(r=>`<span>${esc(r.d)}</span>`).join('')}</div><ul class="legend">${keys.map((k,i)=>`<li><i style="background:var(${cols[i]})"></i>${esc(k)}</li>`).join('')}</ul>`};

function cbCheck(g,ten,k){const E=[];const nm=k==='bot'?`Bot '${ten}'`:`Luồng '${ten}'`;
 if(!g.nodes.length){E.push(`${nm} chưa có bước nào để xuất bản`);return E}
 if(!g.start||!g.nodes.some(n=>n.id===g.start)){E.push(`${nm}: chưa chọn Bước bắt đầu`);return E}
 const seen=new Set([g.start]),q=[g.start];while(q.length){const c=q.shift();g.edges.filter(e=>e.f===c).forEach(e=>{if(!seen.has(e.t)){seen.add(e.t);q.push(e.t)}})}
 const un=g.nodes.filter(n=>!seen.has(n.id));if(un.length)E.push('Không tới được từ Bước bắt đầu: '+un.map(cbName).join(', '));
 g.nodes.forEach(n=>{const out=g.edges.filter(e=>e.f===n.id);const t=cbName(n);
  if(n.ty!=='cond'&&n.ty!=='rand'&&out.filter(e=>!e.l).length>1)E.push(`Bước '${t}' có ${out.filter(e=>!e.l).length} cạnh ra không điều kiện, bộ chạy không biết chọn cạnh nào khi mọi điều kiện khác đều trượt`);
  if(n.ty==='ask'){if(!out.length)E.push(`Bước câu hỏi '${t}' không có cạnh ra nào, khách bấm đáp án xong rơi vào hư không`);else{const m=n.ans.filter(a=>!out.some(e=>e.l===a));if(m.length)E.push(`Bước câu hỏi '${t}': đáp án không có cạnh dẫn tới đâu: ${m.join(', ')}`)}}
  if(n.ty==='msg')(n.btns||[]).forEach(b=>{if(!out.some(e=>e.l===b))E.push(`Nút '${b}' (bước '${t}'): chưa chọn Tin nhắn tiếp theo`)});
  if(n.ty==='jump'){if(!n.flow)E.push(`Bước '${t}': chưa chọn Luồng tin nhắn để chuyển sang`);else if(!cbFlowOk(n.flow))E.push(`Bước '${t}': Luồng '${n.flow}' đang chọn chưa Xuất bản`)}
  if(n.ty==='rand'){const s=(n.opts||[]).filter(o=>o[2]).reduce((a,o)=>a+Number(o[1]),0);if(s!==100)E.push(`Bước '${t}': tổng tỷ lệ các phương án đang bật phải bằng 100% (hiện ${s}%)`)}

/* ---------- sự kiện canvas: kéo khối, nối cạnh ---------- */
document.addEventListener('mousedown',e=>{const nd=e.target.closest('.trl-nd');if(!nd||!nd.closest('.trl-cv')||e.button!==0)return;const id=nd.dataset.nd,inn=nd.closest('.trl-cv__in');
 if(e.target.closest('.trl-nd__port')){if(!can(CB_ED))return;e.preventDefault();_cbDrag={m:'link',id,inn};return}
 const n=cbNode(id);if(!n)return;e.preventDefault();_cbDrag={m:'move',id,el:nd,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false}});
document.addEventListener('mousemove',e=>{const d=_cbDrag;if(!d)return;
 if(d.m==='move'){const dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(!d.moved&&Math.abs(dx)+Math.abs(dy)<4)return;if(!can(CB_ED))return;d.moved=true;const n=cbNode(d.id);n.x=Math.max(0,d.ox+dx);n.y=Math.max(14,d.oy+dy);d.el.style.left=n.x+'px';d.el.style.top=n.y+'px';d.el.classList.add('is-drag');cbDraw()}
 else{const r=d.inn.getBoundingClientRect();cbDraw({from:d.id,x:e.clientX-r.left,y:e.clientY-r.top})}});
document.addEventListener('mouseup',e=>{const d=_cbDrag;if(!d)return;_cbDrag=null;
 if(d.m==='move'){if(d.moved){d.el.classList.remove('is-drag');const inn=d.el.closest('.trl-cv__in');const h=Math.max(480,...cbCtx().g.nodes.map(n=>n.y+150));inn.style.height=h+'px'}else{S.cb.sel=d.id;render(true)}return}
 const t=document.elementFromPoint(e.clientX,e.clientY);const tn=t&&t.closest('.trl-nd');if(tn&&tn.dataset.nd!==d.id)cbLink(d.id,tn.dataset.nd);else cbDraw()});
document.addEventListener('keydown',e=>{if(!(S.route==='CS-URD-10:bot'||S.route==='CS-URD-10:sualuong')||_overlay||!(e.ctrlKey||e.metaKey))return;if(e.target.matches('input,textarea,select'))return;
 const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();ACT.cbUndo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();ACT.cbRedo()}});
function cbLink(f,t){const g=cbCtx().g,n=g.nodes.find(x=>x.id===f);const used=g.edges.filter(e=>e.f===f).map(e=>e.l);let l='';
 if(n.ty==='ask'||n.ty==='msg')l=cbChips(n).find(a=>!used.includes(a))||'';
 else if(n.ty==='cond')l=['Thoả','Không thoả'].find(a=>!used.includes(a))||'';
 else if(n.ty==='collect')l=CB_COLLECT_OUT.find(a=>!used.includes(a))||'';
 else if(n.ty==='rand')l=(n.opts||[]).map(o=>o[0]).find(a=>!used.includes(a))||'';
 if(g.edges.some(e=>e.f===f&&e.t===t&&e.l===l)){cbDraw();return toast('Hai bước này đã được nối','info')}
 S.cb.sel=f;cbStruct(g=>g.edges.push({f,t,l}))}

/* ---------- MH4 Kiểm thử ---------- */
function cbSimStep(id,depth,said){const c=cbCtx(),g=c.g,L=S.cb.sim.log;const n=g.nodes.find(x=>x.id===id);
 if(!n){S.cb.sim.cur=null;return}if(depth>10){L.push({ev:'Chạm trần 10 bước tự động, chuyển cho nhân viên'});S.cb.sim.cur=null;return}
 S.cb.sim.cur=id;const next=l=>{const e=g.edges.find(e=>e.f===id&&(l==null?!e.l:e.l===l))||(l==null?g.edges.find(e=>e.f===id):null);if(e)cbSimStep(e.t,depth+1,said);else S.cb.sim.cur=n.ty==='msg'&&(n.btns||[]).length?id:null};
 const fill=s=>String(s).replace(/\{ten_khach\}/g,'Khách kiểm thử');
 switch(n.ty){
  case'msg':L.push({t:fill(n.body),q:n.btns});if(!(n.btns||[]).length)next(null);break;
  case'ask':L.push({t:n.body,q:n.ans});break;
  case'collect':case'ai':case'aibot':L.push({t:said&&/khắc|laser|60w|giá/i.test(norm(said))?'Dạ máy khắc laser CO2 60W bên em đang có 2 mẫu, anh/chị cho em xin số điện thoại để gửi báo giá ạ':'Dạ anh/chị cần tư vấn dòng máy nào, cho em xin khu vực để em báo giá kèm phí lắp đặt ạ'});break;
  case'act':L.push({ev:'Hành động: '+(n.acts||[]).join(', ')});next(null);break;
  case'tag':L.push({ev:'Gắn thẻ '+(n.tag||'')});next(null);break;
  case'delay':L.push({ev:`Smart Delay ${n.cho} ${n.dv.toLowerCase()}, bỏ qua khi kiểm thử`});next(null);break;
  case'cond':L.push({ev:'Điều kiện: không thoả với Khách kiểm thử'});next('Không thoả');break;
  case'jump':if(cbFlowOk(n.flow)){L.push({ev:'Chuyển sang luồng '+n.flow})}else{L.push({ev:`Luồng chuyển đến không dùng được, chatbot chuyển hội thoại cho nhân viên`})}S.cb.sim.cur=null;break;
  case'human':L.push({ev:'Chatbot chuyển hội thoại cho nhân viên: '+(n.who||'người phụ trách Trang')});S.cb.sim.cur=null;break;
  case'rand':next((n.opts||[[]])[0][0]);break}}
function cbSimSay(txt){const sim=S.cb.sim,c=cbCtx(),g=c.g,L=sim.log;L.push({t:txt,me:true});
 const stop=c.k==='bot'?(c.o.tk||'').split('\n').map(s=>s.trim()).filter(s=>s.length>=3).find(s=>has(txt,s)):null;
 if(stop){L.push({ev:`Chatbot dừng vì nội dung khách nhắn: ${stop}`});sim.cur=null;return}
 const n=sim.cur&&g.nodes.find(x=>x.id===sim.cur);if(!n){L.push({ev:'Lượt bot đã kết thúc, bấm Bắt đầu lại để chạy lại'});return}
 const go=l=>{const e=g.edges.find(e=>e.f===n.id&&e.l===l);if(e)cbSimStep(e.t,0,txt);else{L.push({ev:'Không có cạnh dẫn tiếp, chatbot chuyển hội thoại cho nhân viên'});sim.cur=null}};
 if(n.ty==='ask'||n.ty==='msg'){const ch=cbChips(n);const hit=ch.find(a=>a===txt.trim())||ch.find((a,i)=>txt.trim()===String(i+1)||norm(a).split(/\s+/).filter(w=>w.length>=2&&w!=='in'&&w!=='may').some(w=>norm(txt).includes(w)));
  if(hit){sim.miss=0;go(hit)}else{sim.miss=(sim.miss||0)+1;const lim=c.k==='bot'?c.o.khong:2;if(sim.miss>=lim){L.push({ev:'Không hiểu quá số lần cho phép, chatbot chuyển hội thoại cho nhân viên'});sim.cur=null}else L.push({t:'Dạ em chưa rõ ý anh/chị, anh/chị mô tả giúp em thêm ạ'})}return}
 if(n.ty==='collect'){if(/gap nguoi|nhan vien|nguoi that/.test(norm(txt)))return go('Khách đòi gặp người');if(/\d{9,}/.test(txt.replace(/\s/g,'')))return go('Đủ thông tin');L.push({t:'Dạ anh/chị cho em xin số điện thoại để em gửi báo giá chi tiết ạ'});return}
 cbSimStep(n.id,0,txt)}
function cbTestModal(){const sim=S.cb.sim;const c=cbCtx();
 modal({title:c.k==='bot'?'Kiểm thử bot':'Kiểm thử luồng tin nhắn',size:'modal--lg',body:`<div class="alert">${ic('info')}<div class="alert__d">Chạy thử không gửi gì cho khách, dữ liệu thử được xoá sau khi đóng${c.k==='flow'?'. Chạy theo bản nháp của luồng':''}</div></div>

 <div class="trl-chat-in"><input class="input" id="cb-sim-in" placeholder="Nhắn như khách… Enter để gửi" aria-label="Nhắn như khách" onkeydown="if(event.key==='Enter'&&this.value.trim()){ACT.cbSimSend()}"><button class="btn btn--secondary" data-a="cbSimSend">Gửi</button></div>`,
 foot:`<button class="btn btn--secondary" data-a="cbSimReset">${ic('refresh')}Bắt đầu lại</button><button class="btn btn--primary" data-a="closeOverlay">Đóng</button>`});

Object.assign(ACT,{
 ttFaqAdd(){const F=ttFaq();if(F.items.length>=4)return toast(`Trang '${cbPg(S.tt.pg).n}' đã đủ 4 câu hỏi thường gặp, Meta chỉ cho đặt tối đa 4 câu`,'error');F.items.push({q:'',hd:'',flow:'',msg:'',bot:'',them:'',go:'',tb:'',nhap:true,isNew:true});ttFaqModal(F.items.length-1)},
 ttFaqCancel(x){const F=ttFaq(),f=F.items[Number(x)];if(f.isNew)F.items.splice(Number(x),1);closeOverlay();render(true)},
 ttFaqSave(x){const i=Number(x);ttFaqRead(i);const f=ttFaq().items[i];if(!f.q)return fieldErr('tt-q','Câu hỏi không được để trống');if(f.q.length>80)return fieldErr('tt-q',`Câu hỏi '${f.q}' dài quá 80 ký tự, Messenger không nhận`);
  if(f.them&&f.them===f.go)return ttFaqModal(i,'Một thẻ không vừa thêm vừa gỡ');if(f.tb==='Tạm dừng Bot'&&f.hd!=='Tạo tin nhắn mới')return ttFaqModal(i,'Tạm dừng Bot chỉ đi với Tạo tin nhắn mới');
  delete f.isNew;f.nhap=true;ttFaq().chg=true;closeOverlay();toast('Đã lưu câu hỏi, bấm Xuất bản để đưa lên Messenger');render(true)},

 ttFaqDelOk(x){const F=ttFaq();F.items.splice(Number(x),1);F.chg=true;closeOverlay();toast('Đã xoá câu hỏi');render(true)},
 ttFaqPub(){const F=ttFaq(),E=[];F.items.forEach(f=>{const q=f.q||'(chưa nhập)';if(!f.hd)E.push(`'${q}': chưa chọn hành động khi nhấn nút`);else if(f.hd==='Tạo tin nhắn mới'&&!f.msg)E.push(`'${q}': chưa soạn tin nhắn trả lời`);else if(f.hd==='Chọn luồng tin nhắn'&&!f.flow)E.push(`'${q}': chưa chọn luồng tin nhắn`);else if(f.hd==='Chọn luồng tin nhắn'&&!cbFlowOk(f.flow))E.push(`'${q}': luồng '${f.flow}' chưa Xuất bản (không ở trạng thái 'Đang chạy')`)});
  if(E.length)return cbErrModal('Chưa xuất bản được câu hỏi thường gặp','Còn các lỗi sau',E);F.chg=false;F.pub=F.items.length>0;F.items.forEach(f=>delete f.nhap);toast('Đã xuất bản câu hỏi thường gặp lên Messenger');render(true)},
 ttStart(){const M=ttMd(),F=ttFaq();if(!M.on&&!M.pub)return toast('Xuất bản nội dung trước khi kích hoạt','error');M.on=!M.on;
  if(!M.on)return toast('Đã huỷ kích hoạt'),render(true);toast(F.pub&&F.items.length?'Đã lưu, nút Bắt đầu chưa hiện vì Trang đang có Câu hỏi thường gặp':'Đã kích hoạt nút Bắt đầu trên Messenger',F.pub&&F.items.length?'info':'success');render(true)},
 ttMdSave(){ttMd().chg=true;toast('Đã lưu bản nháp, khách vẫn nhận bản đã xuất bản');render(true)},
 ttMdPub(){const M=ttMd(),E=[];if(!M.blocks.length)E.push('Chưa có nội dung nào để gửi');M.blocks.forEach((b,i)=>{const n=`Khối ${i+1}`;if(b.t==='Văn bản'&&!b.text.trim())E.push(`${n}: văn bản trống`);if(b.btns&&b.btns.length>3)E.push(`${n}: tối đa 3 nút`);if(['Hình ảnh','Nhóm ảnh','Video'].includes(b.t)&&!b.f)E.push(`${n}: chưa tải ảnh/video lên`);(b.btns||[]).forEach(x=>{const m=x[1].match(/^Luồng: (.+)$/);if(m&&!cbFlowOk(m[1]))E.push(`${n}: luồng '${m[1]}' chưa Xuất bản`)})});

   <div class="field"><label class="field__label" for="c16ldv">Loại dịch vụ phiếu con <span class="field__req" aria-hidden="true">*</span></label>${selectBox('c16ldv',['Sửa chữa','Bảo hành','Bảo trì','Hỗ trợ từ xa'],'Sửa chữa')}</div>
   <div class="field"><label class="field__label" for="c16ut">Mức ưu tiên</label>${selectBox('c16ut',['P1','P2','P3'],C16_P[k.md])}<div class="field__help">Theo mức độ ${k.md.toLowerCase()}</div></div>
   <div class="field full" id="c16tlW"><span class="field__label">Tính là tái lỗi</span><label class="chk"><input type="checkbox" checked>Cùng máy, cùng lỗi trong 30 ngày, tính cho kỹ thuật viên phiếu gốc</label></div>
   <div class="field full"><label class="field__label" for="c16mt">Mô tả cho Kỹ thuật <span class="field__req" aria-hidden="true">*</span></label><textarea class="input" id="c16mt" rows="3" maxlength="2000" oninput="ACT.c16KChk()">${esc(k.nd)}. Khách cần xử lý trước ${k.hgq.slice(0,5)}</textarea></div></div>
   <p class="hint">Điều phối kỹ thuật nhận trong hạn phản hồi của Kỹ thuật, quá hạn báo Trưởng nhóm kỹ thuật</p></div>`,
   foot:`<span class="hint" id="c16kh2" style="margin-right:auto;align-self:center"></span><button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" id="c16kok" data-a="c16KtOk" data-x="${x}">Chuyển Kỹ thuật</button>`});ACT.c16KChk()},
 c16KChk(){const g=val('c16goc');const w0=$('#c16tlW');if(w0)w0.hidden=g==='khong';const ok=g&&val('c16mt');const b=$('#c16kok');b.disabled=!ok;const w=ok?'':'Chọn phiếu gốc và nhập mô tả';b.title=w;$('#c16kh2').textContent=w},
 c16KtOk(x){const k=c16K(x);const kg=val('c16goc')==='khong';k.tt='Chờ Kỹ thuật';k.con={ma:'KT/2026/00186 · '+val('c16ldv')+(kg?' · phiếu thường':''),bg:'Chờ nhận',nhan:'--',tt:'Mới'};k.ls.unshift([`${pad(NOW.getDate())}/${pad(NOW.getMonth()+1)} ${fT(NOW)}`,`${me()} chuyển Kỹ thuật`,`Phiếu con KT/2026/00186, ưu tiên ${val('c16ut')}`,'']);closeOverlay();render(true);toast('Đã chuyển Kỹ thuật, phiếu KT/2026/00186')},
 c16Dong(x){const k=c16K(x);const p=S.c16.pre;
  modal({title:'Đóng khiếu nại',body:`<div data-moi><div class="field"><label class="field__label" for="c16kq">Kết quả <span class="field__req" aria-hidden="true">*</span></label>${selectBox('c16kq',[['','Chọn kết quả'],'Đã giải quyết','Khiếu nại không có cơ sở','Khách không phản hồi','Không giải quyết được'],p?'Đã giải quyết':'','onchange="ACT.c16DChk(1)"')}</div>
   <div class="field gap-t-s"><label class="field__label" for="c16ly2">Lý do <span class="field__req" aria-hidden="true">*</span></label><div id="c16lyW">${selectBox('c16ly2',[['','Chọn lý do']],'')}</div></div>
   <div class="field gap-t-s"><label class="field__label" for="c16dg">Diễn giải <span class="field__req" aria-hidden="true">*</span></label><textarea class="input" id="c16dg" rows="3" placeholder="Tối thiểu 10 ký tự" oninput="ACT.c16DChk()">${p?'Phiếu con KT/2026/00177 hoàn thành, khách in thử 20 tấm không còn sọc, xác nhận qua Zalo':''}</textarea></div>
   <div class="field gap-t-s" id="c16xnW"><label class="field__label" for="c16xn">Khách xác nhận <span class="field__req" aria-hidden="true">*</span></label>${selectBox('c16xn',[['','Chọn cách khách xác nhận'],'Có, qua tin nhắn','Có, qua cuộc gọi','Khách không trả lời sau 3 ngày làm việc'],p?'Có, qua tin nhắn':'','onchange="ACT.c16DChk()"')}</div>
   ${k.md==='Nghiêm trọng'?`<div class="alert alert--warning gap-t-s">${ic('alert')}<div class="alert__d">Khiếu nại Nghiêm trọng: sau khi bấm sẽ chờ Trưởng nhóm chăm sóc duyệt đóng</div></div>`:''}</div>`,
   foot:`<span class="hint" id="c16dh" style="margin-right:auto;align-self:center"></span><button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" id="c16dok" data-a="c16DongOk" data-x="${x}">Đóng khiếu nại</button>`});ACT.c16DChk(1);if(p){$('#c16ly2').value='Đã sửa lại, khách xác nhận máy chạy tốt';ACT.c16DChk()}},
 c16DChk(re){const kq=val('c16kq');const L={'Đã giải quyết':['Đã sửa lại, khách xác nhận máy chạy tốt','Đã đổi máy hoặc linh kiện','Đã hoàn tiền hoặc bù chênh lệch','Đã giao bổ sung'],'Khiếu nại không có cơ sở':['Khách dùng sai hướng dẫn','Lỗi do vật tư khách tự mua','Ngoài phạm vi bảo hành'],'Khách không phản hồi':['Gọi 3 lần không nghe máy','Khách không trả lời tin nhắn'],'Không giải quyết được':['Khách đòi bồi thường ngoài chính sách','Hết linh kiện thay thế']};
  if(re){const cur=val('c16ly2');$('#c16lyW').innerHTML=selectBox('c16ly2',[['','Chọn lý do'],...(L[kq]||[])],cur,'onchange="ACT.c16DChk()"')}
  $('#c16xnW').hidden=kq!=='Đã giải quyết';const ok=kq&&val('c16ly2')&&val('c16dg').length>=10&&(kq!=='Đã giải quyết'||val('c16xn'));const b=$('#c16dok');b.disabled=!ok;const w=ok?'':'Chọn kết quả, lý do và nhập diễn giải tối thiểu 10 ký tự';b.title=w;$('#c16dh').textContent=w},
 c16DongOk(x){const k=c16K(x);closeOverlay();if(k.md==='Nghiêm trọng'){k.tt='Chờ duyệt đóng';k.de=me();render(true);toast('Đã gửi Trưởng nhóm chăm sóc duyệt đóng')}else{k.tt='Đã đóng';render(true);toast('Đã đóng khiếu nại')}},
 c16Duyet(x){const k=c16K(x);if(k.de===me())return toast('Người đề nghị đóng không tự duyệt','error');k.tt='Đã đóng';render(true);toast('Đã duyệt đóng khiếu nại '+k.ma)},
 c16TuChoi(x){const p=S.c16.pre2||'';modal({title:'Từ chối duyệt đóng',size:'modal--sm',body:`<p style="margin:0 0 .75rem">Khiếu nại về Đang xử lý, người phụ trách nhận thông báo kèm lý do</p><div class="field"><label class="field__label" for="c16tc">Lý do <span class="field__req" aria-hidden="true">*</span></label><textarea class="input" id="c16tc" rows="3" placeholder="Tối thiểu 10 ký tự">${esc(p)}</textarea></div>`,foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--danger" data-a="c16TuChoiOk" data-x="${x}">Từ chối duyệt</button>`})},
 c16TuChoiOk(x){if(val('c16tc').length<10)return fieldErr('c16tc','Lý do tối thiểu 10 ký tự');c16K(x).tt='Đang xử lý';closeOverlay();render(true);toast('Đã trả khiếu nại về Đang xử lý, đã báo người phụ trách')},
 c16Chuyen(x){const k=c16K(x);modal({title:'Chuyển người phụ trách',size:'modal--sm',body:`<div class="field"><label class="field__label" for="c16np">Người phụ trách mới <span class="field__req" aria-hidden="true">*</span></label>${selectBox('c16np',[['','Chọn chuyên viên chăm sóc'],...['Lê Thị Hoa','Nguyễn Thu Trang','Phạm Thu Trang'].filter(n=>n!==k.pt)],'')}</div><div class="field gap-t-s"><label class="field__label" for="c16lc">Lý do <span class="field__req" aria-hidden="true">*</span></label><textarea class="input" id="c16lc" rows="2"></textarea></div>`,
  foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="c16ChuyenOk" data-x="${x}">Chuyển</button>`})},
 c16ChuyenOk(x){const n=val('c16np');if(!n)return fieldErr('c16np','Người phụ trách mới không được để trống');if(!val('c16lc'))return fieldErr('c16lc','Lý do không được để trống');const k=c16K(x);k.ls.unshift([`${pad(NOW.getDate())}/${pad(NOW.getMonth()+1)} ${fT(NOW)}`,`${me()} chuyển người phụ trách`,`${k.pt} sang ${n}: ${val('c16lc')}`,'']);k.pt=n;closeOverlay();render(true);toast('Đã chuyển người phụ trách cho '+n)}
});
MH('CS-URD-16','MH1',{r:'CS-URD-16',role:'tncs'});
MH('CS-URD-16','MH2',{r:'CS-URD-16',role:'cvcs',state:{'c16.pre':true},run:()=>ACT.c16Tao()});
MH('CS-URD-16','MH3',{r:'CS-URD-16:ct',arg:'KN-2611-0012',role:'tncs'});
MH('CS-URD-16','MH4',{r:'CS-URD-16:ct',arg:'KN-2611-0010',role:'tncs',run:()=>ACT.c16Kt('KN-2611-0010')});
MH('CS-URD-16','MH5',{r:'CS-URD-16:ct',arg:'KN-2611-0012',role:'tncs',state:{'c16.pre':true},run:()=>{const k=c16K('KN-2611-0012');k.tt='Chờ khách xác nhận';k.con.tt='Hoàn thành';k.ls.unshift(['05/11 15:10','Phiếu con KT/2026/00177 hoàn thành','Hệ thống báo người phụ trách liên hệ khách xác nhận','ok']);render();ACT.c16Dong('KN-2611-0012')}});
MH('CS-URD-16','MH6',{r:'CS-URD-16:ct',arg:'KN-2611-0008',role:'tncs'});
MH('CS-URD-16','MH7',{r:'CS-URD-16:ct',arg:'KN-2611-0008',role:'tncs',state:{'c16.pre2':'Chưa có chứng từ hoàn tiền đính kèm, bổ sung trước khi đóng'},run:()=>ACT.c16TuChoi('KN-2611-0008')});


boot();
</script>
</body>
</html>
