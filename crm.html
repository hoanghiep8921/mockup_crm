.todo{display:flex;align-items:center;gap:.625rem;padding:.625rem 1rem;border-bottom:1px solid var(--border-subtle)}
.todo:last-child{border-bottom:0}
.todo__m{flex:1;min-width:0}
tr[draggable="true"]{cursor:grab}
.is-drop{box-shadow:inset 0 2px 0 var(--interactive)}
.media{display:flex;flex-direction:column;gap:.25rem}
.calm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calm__h{padding:.375rem .5rem;font-size:.75rem;color:var(--text-secondary);background:var(--bg-subtle);border-bottom:1px solid var(--border)}
.calm__d{min-height:5.5rem;padding:.25rem .375rem;border-right:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);font-size:.75rem}
.calm__d.is-off{background:var(--bg-subtle)}
.calm__d.is-today{background:var(--bg-selected)}
.calm__i{margin-top:.25rem;padding:.25rem .375rem;border-radius:var(--radius-sm);background:var(--status-info-bg);line-height:1rem}
.calm__i.is-warn{background:var(--status-warning-bg)}
.calm__i.is-bad{background:var(--status-danger-bg)}
.sign-pad{display:block;width:100%;height:9rem;border:1px solid var(--border-control);border-radius:var(--radius-md);background:var(--bg-surface);touch-action:none;cursor:crosshair}
.doc-view{height:18rem;display:grid;place-items:center;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-secondary);text-align:center;padding:1rem}
.pick-row{display:flex;gap:.75rem;align-items:flex-start;padding:.625rem 0;border-bottom:1px solid var(--border-subtle)}
.pick-row>div{flex:1;min-width:0}
@media (max-width:1023px){.calm__d{min-height:3.5rem}}


/* Ảnh chụp cho URD: phần Claude tự bổ sung có nền vàng, chỉ bật khi mở với #mh=...&vang=1 */
.vang [data-moi]{background:#FFF176!important;outline:2px dashed #F9A825;outline-offset:2px;border-radius:4px}
body[data-shot] .toasts{display:none}

/* CRM-URD-15 App Hiện trường: khung điện thoại 390px giữa vùng nội dung, chỉ dùng token của design system */
.ap15-stage{display:flex;justify-content:center;padding:.5rem 0 1rem}
.ap15-phone{position:relative;width:24.375rem;height:46rem;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-page);border:.625rem solid var(--bg-inverse);border-radius:2.5rem;box-shadow:var(--shadow-overlay)}
.ap15-status{display:flex;justify-content:space-between;align-items:center;padding:.375rem 1.25rem .125rem;background:var(--appbar-bg);color:var(--appbar-fg);font-size:.75rem;font-weight:500}
.ap15-status__r{display:inline-flex;align-items:flex-end;gap:2px}
.ap15-status__r i{display:inline-block;width:3px;background:currentColor;border-radius:1px}
.ap15-status__r i:nth-child(1){height:5px;margin-left:.25rem}
.ap15-status__r i:nth-child(2){height:8px}
.ap15-status__r i:nth-child(3){height:11px}
.ap15-head{display:flex;align-items:center;gap:.25rem;min-height:3rem;padding:0 .5rem 0 1rem;background:var(--appbar-bg);color:var(--appbar-fg)}
.ap15-head h2{flex:1;margin:0;font-size:1.0625rem;line-height:1.5rem;font-weight:700;color:inherit}
.ap15-ib{display:grid;place-items:center;width:2.25rem;height:2.25rem;border:0;border-radius:var(--radius-pill);background:none;color:inherit;cursor:pointer}
.ap15-ib:hover{background:color-mix(in srgb,var(--appbar-fg) 14%,transparent)}
.ap15-head .ap15-ib:first-child{margin-left:-.5rem}
.ap15-body{flex:1;overflow-y:auto;padding:.75rem .875rem 1.25rem;display:flex;flex-direction:column;gap:.625rem}
.ap15-seg{display:flex;width:100%}
.ap15-seg button{flex:1;height:2.25rem;font-size:.8125rem}
.ap15-q{width:100%}
.ap15-q .input{height:2.5rem}
.ap15-item{display:flex;gap:.5rem;align-items:flex-start;width:100%;padding:.75rem;text-align:left;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);cursor:pointer;color:var(--text-primary);font:inherit}
.ap15-item:hover{border-color:var(--border-control)}
.ap15-item__m{flex:1;min-width:0;display:flex;flex-direction:column;gap:.125rem}
.ap15-item__m b{font-weight:500;line-height:1.25rem}
.ap15-item__m span{font-size:.8125rem;color:var(--text-secondary)}
.ap15-item__m small{font-size:.75rem;color:var(--text-tertiary)}
.ap15-empty{padding:2rem 1rem;text-align:center;color:var(--text-secondary)}
.ap15-al{margin:0;padding:.5rem .75rem}
.ap15-al--btn{width:100%;text-align:left;cursor:pointer;font:inherit}
.ap15-ten{margin:0;font-size:1.0625rem;line-height:1.5rem;font-weight:700}
.ap15-sub{margin-top:-.375rem;font-size:.8125rem;color:var(--text-tertiary)}
.ap15-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:.25rem .75rem}
.ap15-dl{grid-template-columns:6.5rem 1fr;padding:.5rem 0;gap:.375rem .75rem}
.ap15-h{display:flex;justify-content:space-between;align-items:center;margin-top:.25rem;font-weight:700;font-size:.875rem}
.ap15-h .lnk{display:inline-flex;align-items:center;gap:.25rem;font-weight:500;font-size:.8125rem}
.ap15-acts{display:flex;flex-direction:column;gap:.5rem}
.ap15-row{padding:.5rem 0;border-bottom:1px solid var(--border-subtle);font-size:.8125rem;line-height:1.25rem}
.ap15-row:last-child{border-bottom:0}
.ap15-row small{display:block;font-size:.75rem;color:var(--text-tertiary)}
.ap15-call{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:2.5rem 0 1.5rem;text-align:center}
.ap15-call__ic{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:50%;background:var(--status-success-bg);color:var(--interactive);margin-bottom:.75rem}
.ap15-call__ic .ic{width:2rem;height:2rem}
.ap15-call b{font-size:1.125rem;line-height:1.5rem}
.ap15-call__st{margin-top:.5rem;color:var(--interactive);font-weight:500}
.ap15-call small{font-size:.75rem}
.ap15-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--gray-100) 45%,transparent);z-index:2}
.ap15-perm{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:1.5rem;background:color-mix(in srgb,var(--bg-inverse) 55%,transparent)}
.ap15-perm__c{width:100%;background:var(--bg-surface);border-radius:var(--radius-lg);padding:1.25rem 1rem 0;text-align:center;box-shadow:var(--shadow-overlay)}
.ap15-perm__c h3{margin:0 0 .5rem;font-size:1rem;line-height:1.5rem}
.ap15-perm__c p{margin:0 0 1rem;color:var(--text-secondary);font-size:.875rem}
.ap15-perm__b{display:flex;flex-direction:column;margin:0 -1rem;border-top:1px solid var(--border-subtle)}
.ap15-perm__b button{height:2.75rem;border:0;background:none;font:inherit;font-weight:500;color:var(--text-primary);cursor:pointer}
.ap15-perm__b button+button{border-top:1px solid var(--border-subtle)}
.ap15-sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;max-height:85%;display:flex;flex-direction:column;background:var(--bg-surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:.5rem 1rem 1rem;box-shadow:var(--shadow-overlay)}
.ap15-sheet__grip{display:block;width:2.25rem;height:.25rem;margin:0 auto .625rem;border-radius:var(--radius-pill);background:var(--border-control)}
.ap15-sheet h3{margin:0 0 .75rem;font-size:1rem;line-height:1.5rem;font-weight:700}
.ap15-sheet__b{display:flex;flex-direction:column;gap:.75rem;overflow-y:auto}
.ap15-sheet__f{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
.ap15-body>*,.ap15-sheet__b>*{flex-shrink:0}

/* CRM dùng chung cho 01, 02, 03, 05: chỉ dùng token của design system */
.cx-stars{white-space:nowrap;letter-spacing:.0625rem;color:var(--border-control);font-size:.875rem}
.cx-stars .on{color:var(--amber-60)}
.cx-phone{display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap}
.cx-phone .ic{color:var(--text-secondary)}
.cx-phone button{border:0;background:none;padding:0;display:inline-grid;place-items:center;cursor:pointer;color:var(--text-link)}
.cx-lock .ic{color:var(--text-tertiary)}
.cx-lock select.input{background:var(--input-bg-readonly);color:var(--text-secondary);cursor:not-allowed;opacity:1}
.cx-foot-hint{margin-right:auto;align-self:center;max-width:16rem}
.cx-sec-h{margin:0 0 .5rem;font-size:.875rem;line-height:1.25rem;font-weight:700}
.cx-sec-h.gap-t{margin-top:1.25rem}
.cx-stat{display:flex;flex-wrap:wrap;gap:.5rem}
.cx-stat button{display:inline-flex;align-items:baseline;gap:.375rem;height:2.25rem;padding:0 .75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);cursor:pointer;color:var(--text-secondary);font:inherit;font-size:.75rem}
.cx-stat button b{font-size:1rem;line-height:2.25rem;color:var(--text-primary)}
.cx-stat button:hover{background:var(--bg-hover)}
.cx-tree{list-style:none;margin:0;padding:0 0 0 1.25rem;border-left:1px dashed var(--border)}
.cx-tree--root{border-left:0;padding-left:0}
.cx-tree li{position:relative;padding:.25rem 0 .25rem .75rem}
.cx-tree .cx-tree li::before{content:"";position:absolute;left:-1.25rem;top:1.125rem;width:1.75rem;border-top:1px dashed var(--border)}
.cx-node{display:inline-flex;align-items:center;gap:.5rem;padding:.375rem .75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);box-shadow:var(--shadow-card)}
.cx-drag{color:var(--text-tertiary);cursor:grab}

/* Bảng điều khiển */
.d1-filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.75rem}
.d1-filters .select{min-width:11rem}
.d1-range{font-size:.75rem;color:var(--text-secondary)}
.d1-sec{margin-top:1rem}
.d1-sec .card__h h4{flex:none}
.d1-sec .card__h .hint{margin-left:auto}
.d1-grid{display:grid;gap:.75rem;padding:1rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.d1-grid--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.d1-grid--5{grid-template-columns:repeat(5,minmax(0,1fr))}
.d1-grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.d1-k{border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-subtle);padding:.75rem .875rem;min-width:0}
.d1-k.is-bad{background:var(--status-danger-bg);border-color:color-mix(in srgb,var(--status-danger-solid) 30%,transparent)}
.d1-k.is-warn{background:var(--status-warning-bg);border-color:color-mix(in srgb,var(--status-warning-solid) 30%,transparent)}
.d1-l{font-size:.75rem;line-height:1rem;color:var(--text-secondary)}
.d1-n{display:block;border:0;background:none;padding:0;margin-top:.25rem;font:inherit;font-size:1.5rem;line-height:2rem;font-weight:700;color:var(--text-primary);cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.d1-n:hover{color:var(--text-link)}
.d1-n.is-off{cursor:default}
.d1-n.is-off:hover{color:var(--text-primary)}
.d1-n small{font-size:.875rem;font-weight:500;color:var(--text-secondary)}
.d1-sub{display:flex;flex-wrap:wrap;gap:.125rem .75rem;margin-top:.25rem;font-size:.75rem;line-height:1.125rem;color:var(--text-secondary)}
.d1-sub button{border:0;background:none;padding:0;font:inherit;color:var(--text-secondary);cursor:pointer}
.d1-sub button:hover{color:var(--text-link);text-decoration:underline}
.d1-sub b{font-weight:700;color:var(--text-primary)}
.d1-sub .is-red,.d1-sub .is-red b{color:var(--status-danger-fg)}
.d1-up{color:var(--status-success-fg)}
.d1-down{color:var(--status-danger-fg)}
.d1-split{display:flex;height:.5rem;border-radius:.25rem;overflow:hidden;margin-top:.5rem;background:var(--bg-active)}
.d1-split i{display:block}
.d1-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem;align-items:start}
.d1-pg{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;font-size:.75rem;color:var(--text-secondary)}
@media (max-width:1023px){.d1-grid,.d1-grid--4,.d1-grid--5{grid-template-columns:repeat(2,minmax(0,1fr))}.d1-two{grid-template-columns:minmax(0,1fr)}}

/* Danh sách cơ hội */
.op-wrap{display:grid;grid-template-columns:10.5rem minmax(0,1fr);gap:1rem;align-items:start;margin-top:1rem}
.op-facet{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:.75rem .875rem}
.op-facet h5{margin:.75rem 0 .25rem;font-size:.75rem;line-height:1rem;font-weight:700;color:var(--text-secondary)}
.op-facet h5:first-child{margin-top:0}
.op-facet .chk{display:flex;width:100%;font-size:.8125rem;min-height:1.625rem}
.op-facet .chk span:first-of-type{flex:1}
.op-facet .chk small{color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.tbl tr.op-closed td{color:var(--text-disabled)}
.tbl tr.op-late td{color:var(--status-danger-fg)}
.tbl tr.op-late td .lnk{color:var(--status-danger-fg);font-weight:700}
.tbl tr.op-sla td{background:var(--status-warning-bg)}
.tbl tfoot td{font-weight:700;background:var(--table-header-bg);border-bottom:0}
.op-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(13rem,1fr);gap:.75rem;overflow-x:auto;align-items:start;margin-top:1rem;padding-bottom:.5rem}
.op-col{background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:.5rem;min-height:14rem}
.op-col.is-over{box-shadow:inset 0 0 0 2px var(--interactive)}
.op-col__h{display:flex;align-items:center;gap:.375rem;font-weight:700;padding:.125rem .25rem}
.op-col__h small{color:var(--text-tertiary);font-weight:500}
.op-col .d1-split{margin:.375rem .25rem .25rem;height:.25rem}
.op-card{display:block;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.5rem .625rem;margin-top:.375rem;cursor:grab;line-height:1.125rem;font:inherit;color:inherit}
.op-card:hover{border-color:var(--border-control)}
.op-card b{display:block;font-weight:500}
.op-card .hint{display:flex;gap:.25rem;align-items:flex-start}
.op-card .hint .ic{flex:none;margin-top:1px}
.op-name{min-width:9rem;max-width:11rem}
.op-card__m{display:flex;align-items:center;gap:.375rem;margin-top:.375rem}
.op-card__m .spacer{flex:1}
.op-empty{padding:1rem .5rem;text-align:center;font-size:.75rem;color:var(--text-tertiary)}
.op-hd td.c{text-align:center}
.op-dot{display:inline-block;min-width:4.5rem;padding:.125rem .375rem;border-radius:var(--radius-sm);font-size:.75rem;line-height:1rem}
.op-dot.is-ok{background:var(--status-success-bg);color:var(--status-success-fg)}
.op-dot.is-today{background:var(--status-warning-bg);color:var(--status-warning-fg)}
.op-dot.is-late{background:var(--status-danger-bg);color:var(--status-danger-fg)}
@media (max-width:1023px){.op-wrap{grid-template-columns:minmax(0,1fr)}}

/* Chi tiết cơ hội */
.od-band{display:grid;grid-template-columns:1.1fr 1.3fr 1.6fr 1.2fr;border-top:1px solid var(--border-subtle)}
.od-band>div{padding:.625rem 1rem;border-left:1px solid var(--border-subtle);min-width:0}
.od-band>div:first-child{border-left:0}
.od-band small{display:block;font-size:.75rem;color:var(--text-tertiary);line-height:1rem}
.od-band .v{margin-top:.25rem;display:flex;align-items:center;gap:.375rem;flex-wrap:wrap;line-height:1.25rem}
.od-band .is-red{color:var(--status-danger-fg);font-weight:500}
.od-hen{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.25rem}
.od-hen .ic{color:var(--text-tertiary)}
.od-head{display:flex;align-items:flex-start;gap:1rem;padding:1rem;flex-wrap:wrap}
.od-head h2{margin:0;font-size:1.25rem;line-height:1.75rem;font-weight:700}
.od-head .spacer{flex:1}
.od-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem 2rem;padding:1rem;border-top:1px solid var(--border-subtle)}
.od-form .dl{grid-template-columns:10rem 1fr;gap:.5rem 1rem}
.od-form .form-grid{gap:.75rem 1rem}
.od-tabs{padding:0 1rem;border-top:1px solid var(--border-subtle)}
.od-panel{padding:1rem}
.od-panel>section+section{margin-top:1.25rem}
.od-play{display:inline-flex;align-items:center;gap:.25rem;height:1.5rem;padding:0 .5rem;border:1px solid var(--border-subtle);border-radius:var(--radius-pill);background:var(--bg-surface);font-size:.75rem;cursor:pointer;color:var(--text-secondary)}
.od-closed{display:flex;align-items:center;gap:.5rem}
.od-sched{margin:0;padding:0;list-style:none;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-subtle)}
.od-sched li{padding:.5rem .75rem;border-bottom:1px solid var(--border-subtle);line-height:1.25rem}
.od-sched li:last-child{border-bottom:0}
.od-radio{display:flex;gap:1.25rem;flex-wrap:wrap}
.od-up{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
@media (max-width:1023px){.od-form,.od-band{grid-template-columns:minmax(0,1fr)}.od-band>div{border-left:0;border-top:1px solid var(--border-subtle)}}

.modal--xl{width:min(60rem,calc(100vw - 2rem))}
.cx-wraptbl td,.cx-wraptbl th{white-space:normal;line-height:1.125rem}

/* CRM-URD-07: trang web đơn BO Server trả về sau khi Facebook chuyển về, phủ lên thanh ứng dụng */
.webpg{position:fixed;inset:0;z-index:60;background:var(--bg-page);overflow:auto;padding:2.5rem 1rem}
.webpg__in{max-width:34rem;margin:0 auto}
.webpg__brand{display:flex;align-items:center;gap:.375rem;font-weight:700;color:var(--brand-70);margin-bottom:1rem}
.webpg__t{margin:0 0 .75rem;font-size:var(--type-h2-size);line-height:var(--type-h2-lh);font-weight:700}
.webpg p{margin:0 0 .75rem;line-height:1.5rem}
.webpg__opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;gap:.5rem;padding:.625rem .75rem;margin-bottom:.5rem;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-surface);cursor:pointer;color:var(--text-primary)}
.webpg__opt:hover{border-color:var(--interactive);background:var(--bg-selected)}

/* CRM-URD-08: biểu đồ cột chi phí theo ngày */
.cp-bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.75rem;align-items:end;height:14rem}
.cp-bars__c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.25rem;font-size:.75rem}
.cp-bars__c i{display:block;width:60%;max-width:3rem;background:var(--data-1);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.cp-bars__c small{color:var(--text-tertiary)}

/* CRM-URD-09 Trung tâm cuộc gọi ba cột và softphone nổi góc phải dưới, CRM-URD-10 lịch sử định tuyến */
.cc{display:grid;grid-template-columns:18rem minmax(0,1fr) 22rem;gap:1rem;align-items:start;margin-top:.75rem}
.cc-col{display:flex;flex-direction:column;overflow:hidden}
.cc-tabs{padding:0 .5rem}
.cc-pad-s{padding:.5rem .75rem}
.cc-ql{max-height:28rem;overflow:auto;border-top:1px solid var(--border-subtle)}
.cc-qi{display:flex;flex-direction:column;align-items:flex-start;gap:.125rem;width:100%;text-align:left;padding:.5rem .75rem;border:0;border-bottom:1px solid var(--border-subtle);background:none;cursor:pointer;color:var(--text-primary)}
.cc-qi:hover{background:var(--bg-hover)}
.cc-qi[aria-current="true"]{background:var(--bg-selected);box-shadow:inset 3px 0 0 var(--interactive)}
.cc-qi b{font-weight:500}
.cc-qi small{font-size:.75rem;color:var(--text-tertiary)}
.cc-qi span{margin-top:.125rem}
.cc-empty{padding:1rem .75rem;margin:0}
.cc-foot{padding:.5rem .75rem;border-top:1px solid var(--border-subtle)}
.cc-mid{display:flex;flex-direction:column;align-items:stretch;gap:.75rem}
.cc-c{justify-content:center}
.cc-num{border:0;border-bottom:1px solid var(--border);background:none;text-align:center;font-size:1.75rem;line-height:2.5rem;font-weight:700;color:var(--text-primary);outline:0;padding:.25rem 0}
.cc-num:focus{border-bottom-color:var(--interactive)}
.cc-keys,.sfp__keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:15rem;margin:0 auto;width:100%}
.cc-key{height:2.75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-subtle);font-size:1.125rem;font-weight:500;cursor:pointer;color:var(--text-primary)}
.cc-key:hover{background:var(--bg-hover)}
.cc-cap{font-size:.75rem;line-height:1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-70)}
.cc-ring{align-items:center;text-align:center;padding:2.5rem 1rem}
.cc-name{font-size:1.25rem;line-height:1.75rem;font-weight:700;text-align:center}
.cc-dl{grid-template-columns:7.5rem 1fr;gap:.375rem .75rem}
.cc-blk{display:block;width:100%;text-align:left;padding:.625rem .75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-subtle);cursor:pointer;color:var(--text-primary)}
.cc-blk:hover{border-color:var(--border-control)}
.cc-ls{padding:.375rem 0;border-bottom:1px solid var(--border-subtle);font-size:.8125rem}
.cc-ls:last-child{border-bottom:0}
.cc-btnw{display:inline-flex;flex-direction:column;align-items:flex-end;gap:.125rem}
.rt-ok{color:var(--status-success-fg);font-weight:500}
.rt-skip{color:var(--text-tertiary)}
.rt-warn{color:var(--status-warning-fg);font-weight:500}
.rt-bad{color:var(--status-danger-fg);font-weight:500}
.sfp{position:fixed;right:1rem;bottom:1rem;width:21rem;max-height:calc(100vh - 5rem);overflow:auto;z-index:70;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay)}
.sfp.is-min{width:auto;background:none;border:0;box-shadow:none;overflow:visible}
.sfp__pill{display:flex;align-items:center;gap:.5rem;height:2.5rem;padding:0 1rem;border:0;border-radius:var(--radius-pill);background:var(--btn-primary-bg);color:var(--btn-primary-fg);box-shadow:var(--shadow-overlay);cursor:pointer;font-weight:500}
.sfp__h{display:flex;align-items:center;gap:.5rem;padding:.5rem .5rem .5rem .75rem;border-bottom:1px solid var(--border-subtle)}
.sfp__den{padding:.75rem;text-align:center;background:var(--bg-selected);border-bottom:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:.25rem}
.sfp__cd{color:var(--status-warning-fg);font-size:.8125rem;margin:.25rem 0 .5rem}
.sfp__tabs{padding:0 .25rem}
.sfp__tabs [role="tab"]{padding:0 .5rem;font-size:.8125rem}
.sfp__b{padding:.5rem .75rem;display:flex;flex-direction:column;gap:.375rem}
.sfp__i{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.25rem 0;border-bottom:1px solid var(--border-subtle)}
.sfp__i:last-child{border-bottom:0}
.sfp__call{padding:.75rem;border-top:1px solid var(--border);background:var(--bg-subtle)}
.sfp__call .row{flex-wrap:wrap;gap:.375rem}
@media (max-width:1180px){.cc{grid-template-columns:16rem minmax(0,1fr)}.cc>div:last-child{grid-column:1/-1}}

/* CRM-URD-11: nút khoá kèm lý do, dòng tổng của bảng dòng hàng */
.bg11-bw{display:inline-flex;flex-direction:column;align-items:flex-end;gap:.125rem;max-width:15rem}
.bg11-bw .hint{text-align:right}
.pagehead .row:has(.bg11-bw){align-items:flex-start}
.bg11-tong{display:flex;align-items:center;gap:.5rem;padding:.625rem 1rem;border-top:1px solid var(--border-subtle)}

/* CRM-URD-12: chữ quá hạn, thanh tiến độ trong bảng, dải giai đoạn */
.tk12-red{color:var(--status-danger-fg);font-weight:500}
.tk12-pg{display:flex;align-items:center;gap:.5rem}
.tk12-pg .prog{flex:1}
.tk12-pg span{font-size:.75rem;color:var(--text-secondary);min-width:2.25rem;text-align:right}
.tk12-steps li{font-size:.75rem;color:var(--text-tertiary);min-width:0}
.tk12-steps li b{line-height:1.125rem}
.tk12-dl{grid-template-columns:8.5rem 1fr}
.tk12-undo .alert__a{margin-left:auto}
.board__i b{display:block;line-height:1.25rem}

/* CRM-URD-13: ô màu giai đoạn, dòng nhóm giai đoạn trong bảng nhiệm vụ mẫu */
.wf13-sw{display:inline-block;width:.75rem;height:.75rem;border-radius:var(--radius-xs);margin-right:.5rem;vertical-align:-1px;box-shadow:inset 0 0 0 1px var(--border-subtle)}
.wf13-color{display:flex;align-items:center;gap:.25rem}
.wf13-color .wf13-sw{width:1.25rem;height:1.25rem;flex:none}
.wf13-grp td{background:var(--bg-subtle)}
.wf13-grp b{color:var(--text-primary)}
.tbl td.wf13-in{padding-left:1.75rem}
.stack-v{display:flex;flex-direction:column;gap:1rem}

/* CRM-URD-14: số điện thoại có biểu tượng, nút mũi tên lên, ô chọn nhiều tuyến và nhãn */
.st14-tel{display:inline-flex;align-items:center;gap:.25rem}
.st14-tel .ic{color:var(--interactive)}
.st14-up{display:inline-flex;transform:rotate(180deg)}
.st14-chips{margin:0 0 .375rem;display:flex;flex-wrap:wrap;gap:.375rem}

/* Báo cáo CRM-URD-16, 17, 18: dùng chung, chỉ dùng token design system */
.rp{grid-template-columns:12.5rem minmax(0,1fr)}
.rp-nav{position:sticky;top:1rem}
.rp-nav .menu__lbl{padding:.5rem .75rem .25rem;font-size:.6875rem;line-height:1rem;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.02em}
.rp-nav .menu__i{height:auto;min-height:2rem;padding:.3125rem .75rem;line-height:1.125rem;white-space:normal}
.rp-main{min-width:0}
.rp-main>.pagehead{margin-top:0}
.rp-kpis .kpi-mini>div{min-width:0}
.rp-kpis .kpi-mini b{white-space:nowrap}
.kpi-mini small.rp-sub{margin-top:.125rem;color:var(--text-secondary)}
.kpi-mini small.rp-sub.trend-up{color:var(--status-success-fg)}
.kpi-mini small.rp-sub.trend-down{color:var(--status-danger-fg)}
.rp-n{color:var(--text-link);text-decoration:underline;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,var(--text-link) 45%,transparent)}
.rp-n:hover{text-decoration-color:currentColor}
.rp-th{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:.25rem}
.tbl tr.rp-tot td{font-weight:700;background:var(--bg-subtle)}
.tbl tr.rp-sec td{font-weight:500}
.tbl tr.rp-child td:first-child{padding-left:1.75rem}
.tbl tr.rp-child2 td:first-child{padding-left:3rem}
.tbl tr.rp-wk td{color:var(--text-tertiary)}
.tbl .rp-heat{border-radius:0}
.tbl--rp{min-width:0}
.rp-note{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.5rem;font-size:.75rem;line-height:1rem;color:var(--text-secondary)}
.rp-note .ic{color:var(--text-tertiary)}
.rp-btnh{display:flex;flex-direction:column;align-items:flex-end;gap:.125rem}
.rp-sec-h{display:flex;align-items:center;gap:.5rem;justify-content:space-between;margin:1.25rem 0 .5rem}
.rp-sec-h h3{margin:0;font-size:.9375rem;line-height:1.5rem;font-weight:700}
.rp-mini-bar{display:inline-block;vertical-align:middle;width:3rem;height:.375rem;margin-left:.5rem;background:var(--bg-active);border-radius:.1875rem;position:relative;overflow:hidden}
.rp-mini-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--seq-400);border-radius:.1875rem}
.rp-rank{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;font-weight:700;font-size:.75rem;background:var(--bg-active);color:var(--text-secondary)}
.rp-rank.is-1{background:var(--status-success-bg);color:var(--status-success-fg)}
.rp-rank.is-2{background:var(--status-warning-bg);color:var(--status-warning-fg)}
.rp-rank.is-3{background:var(--status-info-bg);color:var(--status-info-fg)}
.rp-bxh .tbl td:last-child{width:45%}
.rp-bxh .prog{margin-top:.25rem}
.rp-ai{border-color:color-mix(in srgb,var(--brand-50) 35%,transparent)}
.rp-ai__b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.rp-ai__c{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.75rem;background:var(--bg-surface)}
.rp-ai__c h5{margin:0 0 .375rem;font-size:.8125rem;line-height:1.25rem;font-weight:700;display:flex;align-items:center;gap:.375rem}
.rp-ai__c ul{margin:0;padding-left:1.125rem;line-height:1.375rem;color:var(--text-primary)}
.rp-ai__c.is-1 h5{color:var(--brand-70)}
.rp-ai__c.is-2 h5{color:var(--status-warning-fg)}
.rp-ai__c.is-3 h5{color:var(--seq-500)}
.rp-stack{display:flex;height:.625rem;width:8rem;border-radius:.1875rem;overflow:hidden;background:var(--bg-active)}
.rp-stack i{display:block;height:100%}
.rp-task{display:flex;flex-direction:column;gap:.25rem;padding:1rem;text-align:left;width:100%;border:0;background:none;font:inherit;color:inherit;cursor:pointer;height:100%}
.rp-task:hover{background:var(--bg-hover)}
.rp-task b{font-size:1.75rem;line-height:2.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.rp-task.is-off{cursor:default}
.rp-task.is-off:hover{background:none}
.rp-task.is-off b{color:var(--text-tertiary)}
.rp-tasks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.rp-tasks>div{border-left:1px solid var(--border-subtle)}
.rp-tasks>div:first-child{border-left:0}
.rp-legend-n{margin-left:auto;font-size:.75rem;color:var(--text-tertiary)}
.rp-cmp{font-size:.6875rem;margin-left:.25rem}
.rp-cmp.up{color:var(--status-success-fg)}
.rp-cmp.down{color:var(--status-danger-fg)}
.rp-grp th.rp-g{text-align:center;border-left:1px solid var(--table-line)}
.rp-filters{display:flex;flex-direction:column;gap:0}
.rp-filters .toolbar .select{min-width:8.5rem}
@media (max-width:1023px){.rp{grid-template-columns:minmax(0,1fr)}.rp-nav{position:static}.rp-ai__b,.rp-tasks{grid-template-columns:minmax(0,1fr)}}

/* CRM-URD-19 Danh mục cơ hội: chỉ dùng token design system */
.d19-drag{width:2rem;color:var(--text-tertiary);cursor:grab}
.d19-act{width:1%;white-space:nowrap;text-align:right}
.d19-act .btn{margin-left:.125rem}
.d19-sw{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;vertical-align:middle;margin-right:.375rem}
.d19-plan{display:grid;grid-template-columns:14rem minmax(0,1fr) 17rem;gap:.75rem;align-items:start;margin-top:.75rem}
.d19-plist .menu__i{height:auto;min-height:2.5rem;padding:.375rem .75rem;justify-content:space-between;white-space:normal;line-height:1.125rem}
.d19-plist .menu__i[aria-current="true"]{background:var(--bg-selected);font-weight:500}
.d19-canvas{background:var(--bg-subtle);border-top:1px solid var(--border-subtle);padding:1rem;display:flex;flex-direction:column;align-items:center;min-height:22rem}
.d19-step{display:block;width:min(100%,19rem);text-align:left;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:.625rem .75rem;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow-card)}
.d19-step:hover{border-color:var(--border-control)}
.d19-step.is-sel{border-color:var(--interactive);box-shadow:0 0 0 1px var(--interactive)}
.d19-step b{display:flex;align-items:center;gap:.375rem;font-weight:700}
.d19-step small{display:block;margin-top:.125rem;font-size:.75rem;line-height:1rem;color:var(--text-secondary)}
.d19-arrow{display:flex;flex-direction:column;align-items:center;gap:.125rem;padding:.25rem 0;color:var(--text-tertiary);font-size:.75rem}
.d19-arrow::before{content:"";width:1px;height:.75rem;background:var(--border-control)}
.d19-arrow::after{content:"";width:0;height:0;border-left:.3125rem solid transparent;border-right:.3125rem solid transparent;border-top:.375rem solid var(--border-control)}
.d19-meta{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;padding:.625rem 1rem;font-size:.75rem;color:var(--text-secondary)}
.d19-meta b{font-weight:500;color:var(--text-primary)}
.d19-issues{margin:.25rem 0 0;padding-left:1.125rem;line-height:1.5rem;color:var(--text-primary)}
@media (max-width:1180px){.d19-plan{grid-template-columns:minmax(0,1fr)}}

/* Màn cấu hình CRM-URD-20 đến CRM-URD-24: chỉ dùng token của design system */
.cf-main{min-width:0}
.cf-main>.toolbar:first-child{margin-top:0}
.cf-main>.card+.card,.cf-main>.card+.tabs-wrap,.cf-main>.alert+.toolbar{margin-top:1rem}
.cf-main>.alert{margin-bottom:0}
.cf-acts{display:flex;gap:.125rem;justify-content:flex-end}
.cf-grip{color:var(--text-tertiary);cursor:grab}
.cf-multi{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem;min-height:var(--control-h);padding:.25rem .375rem;border:1px solid var(--border-control);border-radius:var(--radius-md);background:var(--bg-surface)}
.cf-multi select{border:0;background:none;font:inherit;font-size:.875rem;color:var(--text-tertiary);min-width:8rem;height:1.5rem;cursor:pointer;flex:1}
.cf-multi[aria-invalid="true"]{border-color:var(--status-danger-solid)}
.cf-time{display:flex;align-items:center;gap:.5rem}
.cf-time .input{width:6.5rem}
.cf-sum td{font-weight:700;background:var(--table-header-bg)}
.tbl th.num,.tbl td.num{text-align:right}
.cf-grp td{background:var(--bg-subtle);font-weight:500;color:var(--text-secondary)}
.cf-cap{grid-column:1/-1;margin:.25rem 0 -.25rem;font-size:.75rem;line-height:1rem;font-weight:700;color:var(--text-secondary)}
.cf-name{margin:0 0 .75rem;font-size:.875rem;line-height:1.25rem;font-weight:700}
.cf-mono{font-family:var(--font-mono);font-size:.75rem}
.cf-foot-l{margin-right:auto;display:flex;gap:.5rem;align-items:center}
.cf-sub{margin-top:.75rem}
.cf-inline{display:flex;gap:.5rem;align-items:center}
.cf-inline .select{flex:1}
.page>.cf-main{margin-top:.75rem}

/* ---------- tiện ích ---------- */

const fD=d=>d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:'-';
const fDT=d=>d?`${fD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'-';

const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate(),d.getHours(),d.getMinutes());
const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const diffMin=(a,b)=>Math.round((a-b)/60000);
const diffDay=(a,b)=>Math.round((dayStart(a)-dayStart(b))/864e5);
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function dur(m){m=Math.max(0,Math.round(m));if(m<60)return m+' phút';const h=Math.floor(m/60);if(h<24)return h+' giờ'+(m%60?' '+(m%60)+' phút':'');const d=Math.floor(h/24);return d+' ngày'+(h%24?' '+(h%24)+' giờ':'')}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const has=(hay,q)=>norm(hay).includes(norm(q));
const initials=n=>{const p=String(n).trim().split(/\s+/);return (p[p.length-2]||'')[0]+(p[p.length-1]||'')[0]};
const avatar=(n,c='')=>{const k=['avatar--a','avatar--b','avatar--c',''];let h=0;for(const ch of String(n))h+=ch.charCodeAt(0);return `<span class="avatar ${c||k[h%4]}" aria-hidden="true">${esc(initials(n).toUpperCase())}</span>`};
const userCell=n=>n?`<span class="cell-user">${avatar(n)}<span>${esc(n)}</span></span>`:'<span class="muted">-</span>';
const tag=(t,k='')=>`<span class="tag ${k?'tag--'+k:''}">${esc(t)}</span>`;
const dash='<span class="muted">-</span>';
function hashStr(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
let _rnd=20261103;const rnd=()=>{_rnd=(_rnd*1664525+1013904223)>>>0;return _rnd/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];


/* ---------- toast, modal, drawer ---------- */
function toast(msg,kind='success',undo){const b=$('#toasts');const el=document.createElement('div');el.className='toast toast--'+kind;
  const n=kind==='error'?'err':kind==='info'?'info':'ok';
  el.innerHTML=`${ic(n)}<div class="toast__m">${esc(msg)}</div>${undo?'<button class="toast__a">Hoàn tác</button>':''}<button class="toast__x" aria-label="Đóng">${ic('x','ic--sm')}</button>`;
  while(b.children.length>=3)b.firstChild.remove();b.appendChild(el);const rm=()=>el.remove();el.querySelector('.toast__x').onclick=rm;
  if(undo)el.querySelector('.toast__a').onclick=()=>{undo();rm();render()};
  if(kind!=='error')setTimeout(rm,undo?8000:5000)}
let _overlay=null;
function closeOverlay(){if(_overlay){_overlay.remove();_overlay=null}}
function modal({title,body,foot,size=''}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="modal__b">${body}</div>${foot?`<div class="modal__f">${foot}</div>`:''}</div>`;document.body.appendChild(w);_overlay=w;const f=w.querySelector('input,select,textarea');if(f)f.focus()}
function drawer({title,body,foot}){closeOverlay();const w=document.createElement('div');w.innerHTML=`<div class="scrim" data-a="closeOverlay"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer__h"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--icon btn--sm" data-a="closeOverlay" aria-label="Đóng">${ic('x')}</button></div><div class="drawer__b">${body}</div>${foot?`<div class="drawer__f">${foot}</div>`:''}</aside>`;document.body.appendChild(w);_overlay=w}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function fieldErr(id,msg){const e=document.getElementById(id);if(!e)return;e.setAttribute('aria-invalid','true');const w=e.closest('.field');if(w&&!w.querySelector('.field__err')){const d=document.createElement('div');d.className='field__err';d.innerHTML=ic('err')+`<span>${esc(msg)}</span>`;w.appendChild(d)}e.focus()}
const selectBox=(id,opts,cur='',attrs='')=>`<div class="select"><select class="input" id="${id}" ${attrs}>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSel=(key,opts,cur,label)=>`<div class="select"><select class="input" data-f="${key}" aria-label="${esc(label)}">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const fSearch=(key,cur,ph)=>`<div class="input-wrap">${ic('search')}<input class="input" id="s-${key.replace('.','-')}" data-f="${key}" value="${esc(cur)}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></div>`;
const seg=(key,opts,cur,label)=>`<div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v,l])=>`<button data-a="setF" data-k="${key}" data-v="${v}" aria-pressed="${v===cur}">${esc(l)}</button>`).join('')}</div>`;
const sw=(a,on,label,x='')=>`<button class="sw" role="switch" aria-checked="${!!on}" data-a="${a}" data-x="${esc(x)}"><span class="sw__t"></span><span>${esc(label)}</span></button>`;
const crumbs=(arr)=>`<nav class="crumbs" aria-label="Đường dẫn">${arr.map((c,i)=>i<arr.length-1?`<a href="#" data-a="go" data-x="${c[1]}">${esc(c[0])}</a>${ic('chev-right')}`:`<span aria-current="page">${esc(c[0])}</span>`).join('')}</nav>`;
const pagehead=(cr,title,actions='',sub='')=>`<div class="pagehead"><div class="pagehead__l">${cr?crumbs(cr):''}<h1>${title}</h1>${sub?`<div class="hint">${sub}</div>`:''}</div>${actions?`<div class="row">${actions}</div>`:''}</div>`;
const emptyState=(t,d,btn='')=>`<div class="state"><span class="state__ic">${ic('search')}</span><h4>${esc(t)}</h4><p>${esc(d)}</p>${btn?`<div class="row">${btn}</div>`:''}</div>`;
const logs=[];
function addLog(fn,op,before,after){logs.unshift({t:new Date(NOW.getTime()+logs.length*0),who:me(),fn,op,before,after})}

/* ---------- khung chung: trạng thái, thanh ứng dụng, điều hướng, sự kiện ----------
   File phân hệ khai: APP, ROLES, NAV, VIEWS.<route>, ACT.<thao tác>, Object.assign(S,{...}), MH(...)
   Xem _congcu/proto/HUONG_DAN_PROTOTYPE.md */
const S={role:null,route:null,arg:null,openNav:null,userOpen:false};
const VIEWS={}, ACT={}, MHS={};
let APP={key:'',name:'',search:'Tìm kiếm'}, ROLES={}, NAV=[];
function can(r){return !r||r.split(' ').includes(S.role)}
const me=()=>ROLES[S.role].u;
function canRoute(r){for(const g of NAV){if(g.r===r)return can(g.ro);if(g.items)for(const i of g.items)if(i[0]===r)return can(i[2])}return true}
function navGroupOf(r){return NAV.find(g=>g.r===r||(g.items&&g.items.some(i=>i[0]===r)))}
function getPath(k){return k.split('.').reduce((o,p)=>o==null?o:o[p],S)}
function setPath(k,v){const p=k.split('.');let o=S;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=v;if(o.page!==undefined&&p[p.length-1]!=='page')o.page=1}
/* Đánh dấu phần Claude tự bổ sung: chỉ hiện nền vàng khi mở với #...&vang=1 (ảnh chụp cho URD) */
const moi=h=>`<span data-moi>${h}</span>`;
function vAppbar(){const R=ROLES[S.role],cur=navGroupOf(S.route);
 return `<button class="appbar__mod" data-a="go" data-x="${R.home}" aria-label="${esc(APP.name)}, về trang đầu">${ic('apps')}<span class="appbar__brand">${esc(APP.name)}</span></button><span class="appbar__sep"></span><nav class="appbar__secs" aria-label="Nhóm chức năng">${NAV.map(g=>{
  if(g.r){if(!can(g.ro))return'';return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="go" data-x="${g.r}" aria-current="${cur===g}">${esc(g.t)}</button></div>`}
  const it=g.items.filter(i=>can(i[2]));if(!it.length||(g.ro&&!can(g.ro)))return'';
  if(g.items.length===1)return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="go" data-x="${it[0][0]}" aria-current="${cur===g}">${esc(g.t)}</button></div>`;
  return `<div class="appbar__sec-w"><button class="appbar__sec" data-a="toggleNav" data-x="${esc(g.t)}" aria-haspopup="menu" aria-expanded="${S.openNav===g.t}" aria-current="${cur===g}">${esc(g.t)}${ic('chev-down','ic--sm')}</button>${S.openNav===g.t?`<div class="menu navmenu" role="menu">${it.map(i=>`<button class="menu__i" role="menuitem" data-a="go" data-x="${i[0]}" aria-current="${S.route===i[0]?'page':'false'}">${esc(i[1])}</button>`).join('')}</div>`:''}</div>`}).join('')}</nav><span class="spacer"></span>
 <div class="appbar__search" style="max-width:15rem">${ic('search')}<input id="global-q" placeholder="${esc(APP.search)}" aria-label="${esc(APP.search)}"></div>
 <button class="appbar__ib" data-a="openBell" aria-label="Thông báo">${ic('bell')}${APP.bell?`<span class="badge">${APP.bell}</span>`:''}</button>
 <div class="dd" style="display:flex"><button class="appbar__mod" data-a="toggleUser" aria-haspopup="menu" aria-expanded="${S.userOpen}">${avatar(R.u,'avatar--a')}<span>${esc(R.n)}</span>${ic('chev-down','ic--sm')}</button>${S.userOpen?`<div class="menu" role="menu" style="color:var(--text-primary)"><div class="menu__lbl">Xem theo vai trò</div>${Object.entries(ROLES).map(([k,x])=>`<button class="menu__i" role="menuitem" data-a="setRole" data-x="${k}">${k===S.role?ic('check'):'<span style="width:1rem"></span>'}<span class="cell-2"><span>${esc(x.n)}</span><small class="hint">${esc(x.u)}</small></span></button>`).join('')}</div>`:''}</div>`}
function denied(){return `<div class="card"><div class="perm"><span class="perm__ic">${ic('lock')}</span><h4 style="margin:0">Bạn chưa có quyền xem màn hình này</h4><p>Liên hệ Quản trị hệ thống để được cấp quyền</p><div class="row"><button class="btn btn--primary" data-a="go" data-x="${ROLES[S.role].home}">Về trang đầu</button></div></div></div>`}
function render(keep){const f=document.activeElement;const fid=f&&f.id,caret=f&&f.selectionStart;const scroll=window.scrollY;
 $('#appbar').innerHTML=vAppbar();const fn=VIEWS[S.route];
 $('#view').className='page'+((APP.full||[]).includes(S.route)?' page--full':'');
 $('#view').innerHTML=!fn?emptyState('Chưa có màn hình','Màn hình này chưa dựng'):(canRoute(S.route)?fn():denied());
 if(fid){const e=document.getElementById(fid);if(e&&e.focus){e.focus();try{if(caret!=null&&e.setSelectionRange)e.setSelectionRange(caret,caret)}catch(x){}}}
 if(keep)window.scrollTo(0,scroll);else window.scrollTo(0,0);
 if(!document.body.dataset.shot){try{history.replaceState(null,'','#/'+S.route+(S.arg?'/'+S.arg:''))}catch(x){}}}
function go(r,arg=null){S.route=r;S.arg=arg;S.openNav=null;S.userOpen=false;closeOverlay();render()}
Object.assign(ACT,{
 go(x){go(x)},closeOverlay(){closeOverlay()},
 setF(_,el){setPath(el.dataset.k,el.dataset.v);render(true)},
 toggleNav(x){S.openNav=S.openNav===x?null:x;S.userOpen=false;$('#appbar').innerHTML=vAppbar()},
 toggleUser(){S.userOpen=!S.userOpen;S.openNav=null;$('#appbar').innerHTML=vAppbar()},
 setRole(x){S.role=x;S.userOpen=false;go(canRoute(S.route)?S.route:ROLES[x].home);toast('Đang xem theo vai trò '+ROLES[x].n,'info')},
 openBell(){toast('Không có thông báo mới','info')}
});
/* ---------- đăng ký màn hình theo mã MH của URD ----------
   MH('CRM-URD-04','MH2',{r:'pool',role:'tn',arg:null,run:()=>ACT.chia()})
   r: route, role: vai trò xem, run: thao tác mở popup hoặc chọn tab sau khi vào màn */
function MH(doc,mh,o){MHS[doc+'/'+mh]=o}
function openMH(key){const o=MHS[key];if(!o)return false;if(o.role&&ROLES[o.role])S.role=o.role;S.route=o.r;S.arg=o.arg||null;
 if(o.state)for(const k in o.state)setPath(k,o.state[k]);render();if(o.run)o.run();return true}
/* ---------- sự kiện ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');
 if(!el){if(S.openNav||S.userOpen){S.openNav=null;S.userOpen=false;$('#appbar').innerHTML=vAppbar()}return}
 if(el.tagName==='A')e.preventDefault();if(el.disabled||el.getAttribute('aria-disabled')==='true')return;const fn=ACT[el.dataset.a];if(fn)fn(el.dataset.x,el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(_overlay)closeOverlay();else if(S.openNav||S.userOpen){S.openNav=null;S.userOpen=false;$('#appbar').innerHTML=vAppbar()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click()}});
let _tIn=null;
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&el.tagName==='INPUT'&&el.type!=='date'){setPath(el.dataset.f,el.value);clearTimeout(_tIn);_tIn=setTimeout(()=>render(true),250)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.f&&(el.tagName==='SELECT'||el.type==='date'||el.type==='checkbox')){setPath(el.dataset.f,el.type==='checkbox'?el.checked:el.value);render(true)}});
function boot(){
 if(!S.role)S.role=Object.keys(ROLES)[0];
 const h=decodeURIComponent(location.hash.slice(1));
 if(h.startsWith('mh=')){const[k,...rest]=h.slice(3).split('&');document.body.dataset.shot='1';if(rest.includes('vang=1'))document.body.classList.add('vang');if(openMH(k))return}
 const hs=h.replace(/^\//,'').split('/');if(hs[0]&&VIEWS[hs[0]]){S.route=hs[0];S.arg=hs[1]||null}else S.route=ROLES[S.role].home;
 render()}

 ${J.flatMap((j,i)=>[0,1].map(k=>{const s=st[(i+k)%st.length];const t=new Date(NOW.getTime()-(k*30+i*7)*60000);return `<tr><td><b>${esc(j[0])}</b><div class="hint">${esc(j[1])}</div></td><td>${esc(j[2])}</td><td class="nowrap">${fDT(t)}</td><td class="nowrap">${fDT(new Date(t.getTime()+42000))}</td><td>${tag(s[0],s[1])}</td><td>${fmt(20+(i*13+k*7)%60)}</td><td>${s[1]==='success'?'0':s[1]==='warning'?'2':'Toàn lượt'}</td><td>${esc(APP.jobAlert||'Quản trị hệ thống')}</td></tr>`})).join('')||`<tr><td colspan="8">${emptyState('Chưa có tác vụ tự động','Phân hệ này chưa có tác vụ chạy nền')}</td></tr>`}
 </tbody></table></div>`};

/* Nút có điều kiện: ô nhập mang data-gate="<id nút>" và data-min, nút bật khi mọi ô đủ điều kiện, nút có data-lock thì luôn tắt */
function cxGate(btnId){const b=document.getElementById(btnId);if(!b)return;
 const ok=!b.dataset.lock&&$$(`[data-gate="${btnId}"]`).every(e=>e.value.trim().length>=Number(e.dataset.min||1));
 b.disabled=!ok;const h=document.getElementById(btnId+'-hint');if(h)h.hidden=ok}
document.addEventListener('input',e=>{const g=e.target.dataset&&e.target.dataset.gate;if(g)cxGate(g)});
document.addEventListener('change',e=>{const g=e.target.dataset&&e.target.dataset.gate;if(g)cxGate(g)});

  ${sua?`<div class="field full" data-moi><label class="field__label" for="cp-ly">Lý do sửa <span class="field__req" aria-hidden="true">*</span></label><textarea class="input" id="cp-ly" rows="2" maxlength="500" placeholder="Tối thiểu 10 ký tự"></textarea></div>`:''}
 </div>`,foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="cpLuu" data-x="${sua?r.id:''}">Lưu</button>`})}
function cpChot(kenh,ky,cty){modal({title:'Kỳ đã chốt đối soát',size:'modal--sm',body:`<div class="alert alert--warning">${ic('alert')}<div class="alert__d">Kỳ ${ky} của Kênh marketing ${esc(kenh)} (${esc(cty)}) đã chốt đối soát: không thêm, sửa hay xoá chi phí bổ sung của kỳ này</div></div>`,foot:`<button class="btn btn--primary" data-a="closeOverlay">Đã hiểu</button>`})}
function cpXoaChk(){const l=val('cp-xly'),d=val('cp-xdg');const b=document.getElementById('cp-xok');if(!b)return;const ok=l&&d.length>=10;b.disabled=!ok;b.title=ok?'':'Chọn lý do và nhập diễn giải';const h=document.getElementById('cp-xh');if(h)h.style.display=ok?'none':''}
const cpKy=d=>`${pad(d.getMonth()+1)}/${d.getFullYear()}`;
Object.assign(ACT,{
 cpBc(){S.cp.bc.cd='Máy khắc laser fiber T11/2026';go('CRM-URD-08:bc')},
 cpLuuCd(){toast('Đã lưu')},
 cpThem(){cpForm(null)},
 cpSua(x){cpForm(CP_ROWS.find(r=>r.id===x))},
 cpLuu(x){const ngay=fromIso(val('cp-ngay')),tien=Number(val('cp-tien').replace(/\D/g,'')),kenh=val('cp-kenh');
  if(!ngay)return fieldErr('cp-ngay','Chọn ngày chi phí');
  if(ngay>TODAY)return fieldErr('cp-ngay','Ngày chi phí không được sau hôm nay');
  if(!(tien>0))return fieldErr('cp-tien','Số tiền chi phí bổ sung phải lớn hơn 0');
  if(x&&val('cp-ly').length<10)return fieldErr('cp-ly','Nhập lý do sửa tối thiểu 10 ký tự');
  const r=x?CP_ROWS.find(z=>z.id===x):null;const cty=r?r.cty:val('cp-cty');
  const chot=CP_CHOT.find(c=>c[0]===(kenh||'Khác')&&c[2]===cty&&(c[1]===cpKy(ngay)||(r&&c[1]===cpKy(r.ngay)&&c[0]===(r.kenh||'Khác'))));
  if(chot)return cpChot(chot[0],chot[1],chot[2]);
  if(r)Object.assign(r,{ngay,tien,kenh,gc:val('cp-gc')});else CP_ROWS.push({id:'p'+(CP_ROWS.length+1)+Date.now()%1000,ngay,tien,kenh,cty,gc:val('cp-gc'),nguoi:me()});
  closeOverlay();render(true);toast('Đã lưu')},
 cpXoa(x){const r=CP_ROWS.find(z=>z.id===x);
  modal({title:'Xoá chi phí nhập tay',body:`<p data-moi>Xoá khoản <b>${fmt(r.tien)} đ</b> ngày ${fD(r.ngay)}, kênh ${esc(r.kenh||'Khác')}. Thực chi của kênh giảm tương ứng</p>

   <div class="field gap-t"><label class="field__label" for="cp-xdg">Diễn giải <span class="field__req" aria-hidden="true">*</span></label><textarea class="input" id="cp-xdg" rows="2" maxlength="500" placeholder="Tối thiểu 10 ký tự" oninput="cpXoaChk()"></textarea></div></div>`,
   foot:`<span class="hint" id="cp-xh" data-moi>Chọn lý do và nhập diễn giải</span><button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--danger" id="cp-xok" data-a="cpXoaOk" data-x="${x}" disabled title="Chọn lý do và nhập diễn giải">Xoá</button>`})},
 cpXoaOk(x){const i=CP_ROWS.findIndex(z=>z.id===x);const r=CP_ROWS[i];const c=CP_CHOT.find(c=>c[0]===(r.kenh||'Khác')&&c[1]===cpKy(r.ngay)&&c[2]===r.cty);if(c)return cpChot(c[0],c[1],c[2]);
  CP_ROWS.splice(i,1);closeOverlay();render(true);toast('Đã xoá')},
 cpView(x){S.cp.bc.view=x;render(true)},
 cpSo(){toast('Mở danh sách các dòng chi phí tạo nên số này','info')},
 cpXuat(){toast('Đã xuất Excel theo bộ lọc')}
});

Object.assign(ACT,{
 wf13Open(x){go('CRM-URD-13:wf',x)},
 wf13LuuNhap(){toast('Thay đổi cấu hình chỉ áp dụng cho triển khai tạo mới sau khi xuất bản')},
 wf13SuaNhap(id){const w=wf13Get(id);w.nhap=w.ver+1;w.cn=NOW;render(true);toast(`Đã tạo bản nháp v${w.nhap} từ phiên bản đang áp dụng`)},
 wf13XuatBan(id){const w=wf13Get(id);const v=w.ver+1;
  modal({title:`Xuất bản workflow v${v}?`,size:'modal--sm',body:`<p style="margin:0" data-moi>Bản nháp v${v} thành phiên bản đang áp dụng của ${esc(w.ten)}. Triển khai tạo mới từ giờ dùng v${v}${w.ver?`, ${w.tk} triển khai đang chạy vẫn giữ v${w.ver}`:''}. Bản v${v} đã xuất bản không sửa được nữa</p>`,
   foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="wf13XuatBanOk" data-x="${id}">Xuất bản</button>`})},
 wf13XuatBanOk(id){const w=wf13Get(id);w.ver=w.ver+1;w.nhap=0;w.tt='Đang áp dụng';w.cn=NOW;closeOverlay();render(true);toast(`Đã xuất bản v${w.ver}`)},
 wf13NhanBan(id){const w=wf13Get(id);const n={...w,id:'WF00'+(WF13.length+1),ten:w.ten+' (bản sao)',md:false,tt:'Bản nháp',ver:0,nhap:1,tk:0,cn:NOW};WF13.push(n);go('CRM-URD-13:wf',n.id);toast(`Nhân bản từ quy trình “${w.ten}”. Bản sao giữ nguyên giai đoạn và nhiệm vụ mẫu, đang ở trạng thái Bản nháp`)},
 wf13Ngung(id){const w=wf13Get(id);if(w.md)return toast(`Không thể ngừng workflow mặc định. Hãy đặt một workflow khác làm mặc định trước khi ngừng áp dụng “${w.ten}”`,'error');w.tt='Ngừng áp dụng';render(true);toast('Đã ngừng áp dụng, triển khai đang chạy giữ nguyên')},
 wf13ApDung(id){const w=wf13Get(id);if(!w.ver)return toast(`Quy trình “${w.ten}” chưa có phiên bản nào được xuất bản, hãy xuất bản trước`,'error');w.tt='Đang áp dụng';render(true);toast(`Đã áp dụng lại. Có thể chọn “${w.ten}” khi tạo triển khai mới`)},
 wf13MacDinh(id){const w=wf13Get(id);WF13.forEach(x=>x.md=false);w.md=true;render(true);toast(`Đã đặt “${w.ten}” làm workflow mặc định`)},
 wf13Bb(x,el){const[g,n]=x.split('|');WF13_CT[+g][1][+n][4]=el.checked?1:0},
 wf13ThemNv(){toast('Đã thêm dòng nhiệm vụ mẫu','info')},
 wf13ThemGd(){toast('Chọn giai đoạn từ danh mục hoặc thêm giai đoạn tự tạo','info')},
 wf13ThemCt(){toast('Đã thêm dòng chuyển tiếp','info')},
 wf13ChonHet(x){WF13_GD.filter(g=>g[6]==='Đang dùng').forEach(g=>S.wf13t.sel[g[1]]=x==='1');render(true)},
 wf13TaoOk(){const T=S.wf13t;T.ten=val('wf13-ten');T.mota=val('wf13-mt');const box=document.getElementById('wf13-err');box.innerHTML='';
  if(!T.ten)return fieldErr('wf13-ten','Chưa có tên workflow. Nhập tên để nhận diện workflow trong danh sách chọn khi tạo triển khai');
  const sel=WF13_GD.filter(g=>T.sel[g[1]]);if(!sel.length){box.innerHTML=`<div class="alert alert--danger gap-t-s">${ic('err')}<div class="alert__d">Chưa chọn giai đoạn. Workflow cần ít nhất một giai đoạn để sinh nhiệm vụ mẫu</div></div>`;return}
  const id='WF00'+(WF13.length+1);WF13.push({id,ten:T.ten,md:false,tt:T.sau==='xb'?'Đang áp dụng':'Bản nháp',ver:T.sau==='xb'?1:0,nhap:T.sau==='xb'?0:1,gd:sel.length,nvm:sel.reduce((s,g)=>s+g[5],0),tk:0,cn:NOW,ai:me(),kieu:T.kieu});
  S.wf13t={ten:'',tu:'',kieu:'Tuần tự',sau:'nhap',mota:'',sel:{}};go('CRM-URD-13:wf',id);toast('Đã tạo workflow '+id)},
 wf13Gd(ma){const g=WF13_GD.find(x=>x[1]===ma);const v=g||['','','','#78909c',0];
  modal({title:g?'Sửa giai đoạn':'Thêm giai đoạn',body:`<div class="form-grid"><div class="field"><label class="field__label" for="wf13-gt">Tên giai đoạn <span class="field__req">*</span></label><input class="input" id="wf13-gt" maxlength="100" value="${esc(v[2]||(ma==='mh'?'Đào tạo vận hành':''))}"></div>
   <div class="field"><label class="field__label" for="wf13-gm">Mã</label><input class="input" id="wf13-gm" maxlength="8" value="${esc(v[1]||(ma==='mh'?'DT':''))}" placeholder="Ví dụ TN, KS, TK"></div>
   <div class="field"><label class="field__label" for="wf13-gc">Màu <span class="field__req">*</span></label><div class="wf13-color"><span class="wf13-sw" style="background:${ma==='mh'?'#0b6468':v[3]}"></span><input class="input" id="wf13-gc" maxlength="7" value="${ma==='mh'?'#0b6468':v[3]}"></div></div>
   <div class="field"><label class="field__label" for="wf13-go">Thứ tự</label><input class="input" id="wf13-go" maxlength="4" inputmode="numeric" value="${v[0]||(ma==='mh'?9:WF13_GD.length+1)}"></div>
   <div class="field full"><label class="field__label" for="wf13-gmt">Mô tả</label><textarea class="input" id="wf13-gmt" rows="2" maxlength="500">${ma==='mh'?'Đào tạo người vận hành của khách sau khi chạy thử':''}</textarea></div>
   <label class="chk full"><input type="checkbox" id="wf13-gtb" ${v[4]?'checked':''}>Giai đoạn trước bán</label></div>`,
   foot:`<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button><button class="btn btn--primary" data-a="wf13GdOk" data-x="${g?ma:''}">Lưu</button>`})},
 wf13GdOk(ma){const ten=val('wf13-gt'),mau=val('wf13-gc');if(!ten)return fieldErr('wf13-gt','Tên giai đoạn không được để trống');
  if(!/^#[0-9a-fA-F]{6}$/.test(mau))return fieldErr('wf13-gc',`Màu của giai đoạn “${ten}” phải là mã HEX, ví dụ #0f6fc5`);
  const g=WF13_GD.find(x=>x[1]===ma);const tb=document.getElementById('wf13-gtb').checked?1:0;
  if(g){g[2]=ten;g[3]=mau;g[4]=tb;g[0]=+val('wf13-go')||g[0]}else WF13_GD.push([+val('wf13-go')||WF13_GD.length+1,val('wf13-gm')||'GD',ten,mau,tb,0,'Đang dùng','',0,0]);
  WF13_GD.sort((a,b)=>a[0]-b[0]);closeOverlay();render(true);toast('Đã lưu giai đoạn')},
 wf13GdNgung(ma){const g=WF13_GD.find(x=>x[1]===ma);g[6]=g[6]==='Đang dùng'?'Ngừng dùng':'Đang dùng';render(true);toast(g[6]==='Ngừng dùng'?`Đã ngừng dùng ${g[2]}, workflow và triển khai đang dùng giữ nguyên`:`Đã dùng lại ${g[2]}`)},
 wf13GdXoa(ma){const g=WF13_GD.find(x=>x[1]===ma)||WF13_GD[1];
  if(!g[8]&&!g[9]){WF13_GD.splice(WF13_GD.indexOf(g),1);render(true);return toast('Đã xoá giai đoạn '+g[2])}
  modal({title:'Không xoá được giai đoạn',size:'modal--sm',body:`<div class="alert alert--warning" data-moi>${ic('alert')}<div class="alert__d">Giai đoạn ${esc(g[2])} đang dùng trong ${g[8]} workflow và ${g[9]} triển khai. Dùng Ngừng dùng để không chọn được cho workflow mới, dữ liệu cũ giữ nguyên</div></div>`,foot:`<button class="btn btn--primary" data-a="closeOverlay">Đã hiểu</button>`})},
 wf13CaiHuy(){S.wf13c={...TK12_CFG};render(true)},
 wf13CaiLuu(){const C=S.wf13c;const ten={han:'Cách hiển thị hạn nhiệm vụ',cong:'Chế độ cổng nhiệm vụ',lui:'Cho phép lùi giai đoạn'};
  ['han','cong','lui'].forEach(k=>{if(C[k]!==TK12_CFG[k]){const l=o=>WF13_OPT[k].find(x=>x[0]===o)[1];WF13_LS.unshift([NOW,me(),ten[k],l(TK12_CFG[k]),l(C[k])]);TK12_CFG[k]=C[k]}});render(true);toast('Đã lưu cài đặt')}
});

const RPT={
 nav:{},
 navAdd(g,sec,route,label,roles){(this.nav[g]=this.nav[g]||[]).push([route,label,roles||'',sec])},
 side(g,cur){let last='';return `<nav class="settings__nav rp-nav" aria-label="Danh sách báo cáo">${(this.nav[g]||[]).filter(i=>can(i[2])).map(i=>{const h=i[3]!==last?`<div class="menu__lbl">${esc(i[3])}</div>`:'';last=i[3];return h+`<button class="menu__i" data-a="go" data-x="${i[0]}" aria-current="${i[0]===cur}">${esc(i[1])}</button>`}).join('')}</nav>`},
 page(g,cur,html){return `<div class="settings rp">${this.side(g,cur)}<div class="rp-main">${html}</div></div>`},
 tien(n){if(n==null||n==='')return '--';const a=Math.abs(n);if(a>=1e9)return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';if(a>=1e5)return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:a>=1e8?0:1})+' tr';return fmt(n)},
 pct(a,b,d=1){return b?(a/b*100).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d})+'%':(0).toLocaleString('vi-VN',{minimumFractionDigits:d})+'%'},
 dec(v,d=1){return Number(v).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d})},
 n(disp,kind,title){return `<a href="#" class="rp-n" data-a="rpDrill" data-x="${esc(kind+'|'+title)}">${disp}</a>`},
 kpis(arr){return `<div class="card rp-kpis gap-t"><div class="kpi-mini" style="border-top:0;grid-template-columns:repeat(${arr.length},minmax(0,1fr))">${arr.map(k=>{const inner=`<b>${k.v}</b><small>${esc(k.l)}</small>${k.s?`<small class="rp-sub ${k.c||''}">${k.s}</small>`:''}`;return `<div${k.moi?' data-moi':''}>${k.d?`<button class="cell" data-a="rpDrill" data-x="${esc(k.d)}">${inner}</button>`:inner}</div>`}).join('')}</div></div>`},
 cmp(d,txt){if(d==null)return {s:'',c:''};return d>0?{s:`▲ ${txt} kỳ trước`,c:'trend-up'}:d<0?{s:`▼ ${txt} kỳ trước`,c:'trend-down'}:{s:'± 0 kỳ trước',c:''}},
 dd(key,label,opts,cur){return fSel(key,opts.map(o=>Array.isArray(o)?[o[0],label+': '+o[1]]:[o,label+': '+o]),cur,label)},
 xuat(primary,dis){const c=primary?'btn--primary':'btn--secondary';return dis?`<div class="rp-btnh"><button class="btn ${c}" disabled title="Không có dữ liệu để xuất">${ic('download')}Xuất Excel</button><span class="hint">Không có dữ liệu để xuất</span></div>`:`<button class="btn ${c}" data-a="rpXuat">${ic('download')}Xuất Excel</button>`},
 lamMoi(){return `<button class="btn btn--secondary" data-a="rpLamMoi">${ic('refresh')}Làm mới</button>`},
 th(label,sk,col,cls=''){const o=getPath(sk);const on=o.sort===col;return `<th class="${cls}"${on?` aria-sort="${o.dir<0?'descending':'ascending'}"`:''}><button class="rp-th" data-a="rpSort" data-x="${sk}|${col}">${label}${on?ic(o.dir<0?'sort-desc':'sort','ic--sm'):''}</button></th>`},
 heat(r,tok='--seq-300'){return r>0?` style="background:color-mix(in srgb,var(${tok}) ${Math.round(Math.min(1,r)*70)}%,transparent)"`:''},
 nice(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p},
 chart(title,right,body,moiAttr=''){return `<div class="chart"${moiAttr}><div class="chart__h"><b>${esc(title)}</b><span>${right||''}</span></div>${body}</div>`},
 legend(items){return `<ul class="legend">${items.map(([n,c])=>`<li><i style="background:${c}"></i>${esc(n)}</li>`).join('')}</ul>`},
 /* Biểu đồ cột: series [{n,c,v:[...]}], stack: cột chồng, line: {v:[%],c,n} vẽ đường theo trục phải 0 đến 100% */
 bars({labels,series,stack=false,w=640,h=200,line=null,vfmt=fmt,showV=true,cols=null}){
  const pl=40,pr=line?40:10,pt=14,pb=26,iw=w-pl-pr,ih=h-pt-pb;
  const tops=labels.map((_,i)=>stack?series.reduce((s,se)=>s+(se.v[i]||0),0):Math.max(...series.map(se=>se.v[i]||0)));
  const max=this.nice(Math.max(...tops,1));const gw=iw/labels.length;
  const bw=stack||series.length===1?Math.min(gw*.58,46):Math.min(gw*.8/series.length,24);
  const y=v=>pt+ih*(1-v/max);let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${vfmt(v)}</text>`;if(line)g+=`<text x="${w-pr+6}" y="${yy+4}">${k*25}%</text>`}
  labels.forEach((l,i)=>{const cx=pl+gw*i+gw/2;let acc=0;
   series.forEach((se,j)=>{const v=se.v[i]||0;if(stack){const y0=y(acc),y1=y(acc+v);acc+=v;if(v)g+=`<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${y0-y1}" fill="${(cols&&cols[i])||se.c}"><title>${esc(se.n+' '+l+': '+vfmt(v))}</title></rect>`}
    else{const x=cx-bw*series.length/2+bw*j;if(v)g+=`<rect x="${x+1}" y="${y(v)}" width="${bw-2}" height="${pt+ih-y(v)}" rx="2" fill="${(cols&&cols[i])||se.c}"><title>${esc(se.n+' '+l+': '+vfmt(v))}</title></rect>`;if(showV&&series.length===1)g+=`<text x="${cx}" y="${y(v)-4}" text-anchor="middle" style="fill:var(--text-secondary)">${vfmt(v)}</text>`}});
   if(stack&&showV)g+=`<text x="${cx}" y="${y(acc)-4}" text-anchor="middle" style="fill:var(--text-secondary)">${vfmt(acc)}</text>`;
   g+=`<text x="${cx}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  if(line){const pts=line.v.map((v,i)=>[pl+gw*i+gw/2,pt+ih*(1-v/100)]);g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${line.c}" stroke-width="2"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${line.c}"><title>${esc(line.n+' '+labels[i]+': '+this.dec(line.v[i])+'%')}</title></circle>`).join('')}
  return `<div class="vz"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ cột"><line class="axis" x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}"/>${g}</svg></div>`},
 /* Biểu đồ đường: series [{n,c,v:[...]}] */
 lines({labels,series,w=900,h=190,vfmt=fmt}){
  const pl=44,pr=12,pt=12,pb=26,iw=w-pl-pr,ih=h-pt-pb;const all=series.flatMap(s=>s.v.filter(v=>v!=null));
  const max=this.nice(Math.max(...all,1));const gx=labels.length>1?iw/(labels.length-1):0;const y=v=>pt+ih*(1-v/max);let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${vfmt(v)}</text>`}
  labels.forEach((l,i)=>{g+=`<text x="${pl+gx*i}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[pl+gx*i,y(v)]).filter(Boolean);g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.c}"/>`).join('')});
  return `<div class="vz"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Biểu đồ đường"><line class="axis" x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}"/>${g}</svg></div>`},
 /* Thanh ngang bằng div: rows [{l,v,disp,d,c}] */
 hbars(rows,c='var(--data-1)'){const max=Math.max(...rows.map(r=>r.v),1);return rows.map(r=>{const inner=`<span class="wrap">${esc(r.l)}</span><span class="hbar__t"><i style="width:${(r.v/max*100).toFixed(1)}%;background:${r.c||c}"></i></span><span class="num">${r.disp??fmt(r.v)}</span>`;return r.d?`<div class="hbar is-click" role="button" tabindex="0" data-a="rpDrill" data-x="${esc(r.d)}">${inner}</div>`:`<div class="hbar">${inner}</div>`}).join('')},
 bxh(title,rows,colName,vfmt,valName='Doanh số chốt'){const max=rows.length?rows[0][1]:1;return `<div class="card rp-bxh"><div class="card__h"><h4>${esc(title)}</h4></div>${rows.length?`<table class="tbl tbl--rp"><thead><tr><th style="width:3.5rem">Hạng</th><th>${esc(colName)}</th><th class="r">${esc(valName)}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="rp-rank ${i<3?'is-'+(i+1):''}">${i+1}</span></td><td>${userCell(r[0])}</td><td class="r"><div>${vfmt(r[1])}</div><div class="prog prog--sm"><i style="width:${(r[1]/max*100).toFixed(1)}%;background:var(--seq-400)"></i></div></td></tr>`).join('')}</tbody></table>`:emptyState('Chưa có dữ liệu','Chưa có đơn đã xác nhận trong kỳ này')}</div>`}
};

 const nc=o.cols.length+(dg?1:0);

 ${o.rows.map(r=>r.grp?`<tr class="cf-grp"><td colspan="${nc}">${r.grp}</td></tr>`:`<tr${dg?` draggable="true" data-drag="${dg}" data-i="${r.i}"`:''}>${dg?`<td class="cf-grip" title="Kéo để đổi thứ tự">${ic('menu','ic--sm')}</td>`:''}${r.c.map(td).join('')}</tr>`).join('')}</tbody>${o.foot?`<tfoot>${o.foot}</tfoot>`:''}</table></div>
 <div class="pag"><span>1–${n} trong ${fmt(o.total??n)}</span><span class="spacer"></span><div class="pag__pages"><button aria-current="page">1</button></div></div>`
 :`<div class="card">${emptyState(...(o.empty||['Không có kết quả tìm kiếm phù hợp','Bỏ bớt điều kiện lọc hoặc tìm theo từ khác']))}</div>`;
 return `${o.top||''}${o.tools?`<div class="toolbar">${o.tools}</div>`:''}<div class="gap-t">${tb}</div>`}

const cfV=k=>S.cf.d[k]??'';

const cfIn=(k,o={})=>`<input class="input${o.ro?' is-readonly':''}" id="cf-${k}" data-k="${k}" value="${esc(cfV(k))}"${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.ro?' readonly':''}${o.type?` type="${o.type}"`:''}${o.re?' data-cfre':''}${o.max?` maxlength="${o.max}"`:''}${o.num?' inputmode="numeric"':''}>`;
const cfSel=(k,opts,o={})=>`<div class="select"><select class="input" id="cf-${k}" data-k="${k}"${o.re?' data-cfre':''}${o.dis?' disabled':''}>${opts.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}"${String(v)===String(cfV(k))?' selected':''}>${esc(l)}</option>`}).join('')}</select>${ic('chev-down')}</div>`;
const cfTa=(k,o={})=>`<textarea class="input" id="cf-${k}" data-k="${k}" rows="${o.rows||3}"${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.max?` maxlength="${o.max}"`:''}>${esc(cfV(k))}</textarea>`;
const cfCk=(k,l,o={})=>`<label class="chk"><input type="checkbox" id="cf-${k}" data-k="${k}"${cfV(k)?' checked':''}${o.dis?' disabled':''}${o.re?' data-cfre':''}><span>${l}</span></label>`;
const cfRad=(k,opts)=>`<div class="cf-inline" role="radiogroup" style="gap:1.25rem">${opts.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<label class="chk"><input type="radio" name="cf-${k}" data-k="${k}" value="${esc(v)}"${String(cfV(k))===String(v)?' checked':''} data-cfre><span>${esc(l)}</span></label>`}).join('')}</div>`;
const cfTg=(k,l,o={})=>`<button type="button" class="sw" role="switch" aria-checked="${!!cfV(k)}" data-a="cfTg" data-x="${k}"${o.dis?' disabled':''}><span class="sw__t"></span><span>${esc(l)}</span></button>`;
const cfRo=v=>`<div class="field-ro">${v==null||v===''?dash:v}</div>`;
function cfMulti(k,opts,ph){const v=S.cf.d[k]||[];const rest=opts.filter(o=>!v.includes(o));
 return `<div class="cf-multi" id="cf-${k}">${v.map(x=>`<span class="fchip">${esc(x)}<button type="button" data-a="cfRm" data-x="${esc(k+'|'+x)}" aria-label="Bỏ ${esc(x)}">${ic('x','ic--sm')}</button></span>`).join('')}${rest.length?`<select data-cfadd="${k}" aria-label="${esc(ph)}"><option value="">${esc(v.length?'Thêm':ph)}</option>${rest.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:''}</div>`}
function cfCollect(){if(!_overlay)return;$$('[data-k]',_overlay).forEach(e=>{const k=e.dataset.k;if(e.type==='radio'){if(e.checked)S.cf.d[k]=e.value}else S.cf.d[k]=e.type==='checkbox'?e.checked:e.value})}
function cfDraw(){const f=CF_M[S.cf.m];if(f)f()}
function cfOpen(m,d){S.cf.m=m;S.cf.err='';S.cf.d=cfClone(d||{});cfDraw()}
function cfErrBox(){return S.cf.err?`<div class="alert alert--danger err-box">${ic('err')}<div class="alert__d">${esc(S.cf.err)}</div></div>`:''}
function cfModal(o){modal({title:o.title,size:o.size||'',body:`${cfErrBox()}${o.top||''}${o.fields?`<div class="form-grid">${o.fields.filter(Boolean).join('')}</div>`:''}${o.bottom||''}`,
 foot:`${o.left?`<div class="cf-foot-l">${o.left}</div>`:''}<button class="btn btn--secondary" data-a="closeOverlay">Huỷ</button>${o.save?`<button class="btn btn--primary" data-a="${o.save}" data-x="${esc(o.x||'')}">${esc(o.saveL||'Lưu')}</button>`:''}`})}
function cfReq(list){cfCollect();for(const[k,l]of list){const v=S.cf.d[k];if(v==null||v===''||(Array.isArray(v)&&!v.length)){fieldErr('cf-'+k,l+' không được để trống');return false}}return true}
const cfSrvErr=m=>{S.cf.err=m;cfDraw()};

function cfConfirm(o){modal({title:o.title,size:'modal--sm',body:`${o.moi?'<div data-moi>':'<div>'}${o.kind==='plain'?`<p style="margin:0">${o.text}</p>`:`<div class="alert alert--${o.kind||'warning'}">${ic(o.kind==='info'?'info':'alert')}<div class="alert__d">${o.text}</div></div>`}</div>${o.err?`<div class="alert alert--danger gap-t-s">${ic('err')}<div class="alert__d">${esc(o.err)}</div></div>`:''}`,
 foot:o.only?`<button class="btn btn--primary" data-a="closeOverlay">${esc(o.only)}</button>`:`<button class="btn btn--secondary" data-a="${o.cancelA||'closeOverlay'}" data-x="${esc(o.x||'')}">Huỷ</button><button class="btn ${o.danger?'btn--danger':'btn--primary'}" data-a="${o.a}" data-x="${esc(o.x||'')}">${esc(o.ok)}</button>`})}
/* form cấu hình trên trang: giá trị đã lưu ở đường dẫn sv, bản nháp ở dr, ô nhập gắn data-f để khung tự vẽ lại */
const cfPid=(p,k)=>'pf-'+p.replace(/\./g,'-')+'-'+k;
function cfPIn(p,k,l,o={}){const id=cfPid(p,k);return cfF(l,`<input class="input${o.ro?' is-readonly':''}" id="${id}" data-f="${p}.${k}" value="${esc(getPath(p)[k])}"${o.ro?' readonly':''}${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.w?` style="max-width:${o.w}"`:''}${o.num?' inputmode="numeric"':''}>`,{...o,id})}
function cfPSel(p,k,l,opts,o={}){const id=cfPid(p,k),cur=getPath(p)[k];return cfF(l,`<div class="select"${o.w?` style="max-width:${o.w}"`:''}><select class="input" id="${id}" data-f="${p}.${k}"${o.ro?' disabled':''}>${opts.map(x=>{const[v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(t)}</option>`}).join('')}</select>${ic('chev-down')}</div>`,{...o,id})}
function cfPTg(p,k,l,o={}){const on=!!getPath(p)[k];return cfF(l,`<button type="button" class="sw" role="switch" aria-checked="${on}" data-a="cfPTgl" data-x="${p}.${k}"${o.ro?' disabled':''}><span class="sw__t"></span><span>${on?(o.on||'Bật'):(o.off||'Tắt')}</span></button>`,o)}
function cfPTime(p,a,b,l,o={}){const P=getPath(p);return cfF(l,`<div class="cf-time"><input class="input" id="${cfPid(p,a)}" data-f="${p}.${a}" value="${esc(P[a])}" aria-label="${esc(l)} từ"${o.ro?' readonly':''}><span>đến</span><input class="input" id="${cfPid(p,b)}" data-f="${p}.${b}" value="${esc(P[b])}" aria-label="${esc(l)} đến"${o.ro?' readonly':''}></div>`,{...o,id:cfPid(p,a)})}
const cfDirty=(sv,dr)=>JSON.stringify(getPath(sv))!==JSON.stringify(getPath(dr));

/* kéo thả đổi thứ tự: dòng có data-drag=<khoá CF_DRAG> và data-i=<vị trí trong mảng gốc> */
let _cfDrag=null;
const cfTr=e=>e.target&&e.target.closest?e.target.closest('tr[data-drag]'):null;
document.addEventListener('dragstart',e=>{const tr=cfTr(e);if(tr){_cfDrag=tr;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',tr.dataset.i)}catch(x){}}});
document.addEventListener('dragover',e=>{const tr=cfTr(e);if(_cfDrag&&tr&&tr.dataset.drag===_cfDrag.dataset.drag){e.preventDefault();$$('.is-drop').forEach(x=>x.classList.remove('is-drop'));tr.classList.add('is-drop')}});
document.addEventListener('drop',e=>{const tr=cfTr(e);if(!_cfDrag||!tr||tr.dataset.drag!==_cfDrag.dataset.drag)return;e.preventDefault();
 const L=CF_DRAG[tr.dataset.drag],a=L.list(),from=+_cfDrag.dataset.i,to=+tr.dataset.i;_cfDrag=null;if(from===to)return;
 const[x]=a.splice(from,1);a.splice(to,0,x);if(L.done)L.done();render(true);toast(L.msg||'Đã lưu thứ tự')});
document.addEventListener('dragend',()=>{_cfDrag=null;$$('.is-drop').forEach(x=>x.classList.remove('is-drop'))});
